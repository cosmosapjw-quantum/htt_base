  files:
  - htt/htt
  - tests/htt
  - docs/PR_DELTAS/pr-137.md
  tests:
  - venv/bin/python -B scripts/codex_harness/validate_pr_dag.py docs/codex_handoff/pr_backlog.yaml
  - to-be-created:venv/bin/python -B -m pytest -p no:cacheprovider -q tests/pr_cards/test_pr_137_weak_identification_boundary_grid_conditional_si.py
  dod:
  - point/partial/unidentified regimes를 연속적으로 가로지르는 DGP grid를 사전 등록한다. complete frozen algorithm의 simultaneous
    coverage, empty/unbounded rate, boundary behavior와 optimization failure를 측정한다. 기본 pre-registration은
    nominal coverage 0.95, 허용 undercoverage 0.02, grid point당 최소 2,000 independent replicates를 최소 10 seed에
    분배하고, family-wise 99% binomial lower bound가 0.93 경계에서 0.01 이내면 최대 10,000까지 연장한다. 최소 두 mesh refinement에서
    coverage 변화와 optimizer endpoint error를 보고한다. continuity/mesh-error theorem이 있을 때만 nuisance class 전체의
    uniform coverage라 부르고, 그렇지 않으면 grid-conditional simultaneous empirical coverage로 제한한다.
  - 최소 10-seed/2,000-replicate DGP grid, family-wise 99% binomial lower intervals, two-level mesh/optimizer-error
    report, boundary/adversarial fixtures, coverage dashboard와 fail-closed status.
  kill: retained grid point의 lower bound가 0.93 미만이거나 mesh refinement에서 coverage가 0.01 넘게 변하거나 optimizer
    error가 reported endpoint tolerance의 10%를 넘으면 scientific bound를 내지 않고 failure map을 보존한다. uniform이라는
    단어는 continuity/mesh certificate가 없으면 lint가 거부한다.
