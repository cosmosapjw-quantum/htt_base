  rejected-candidate, config/input, command, and worktree provenance. It
  exports MIO BudgetSpec and compact MIO reference helpers while preserving
  PR-051 certified-F gates, blocking external/proxy ceilings from certifying F
  before native validation gates, requiring depth-gap bin/null/covariance
  metadata for G_F references, rejecting schema-only future-native atlas
  entries as numeric ceilings, and failing closed on hidden transfer source,
  hidden prior/admissible-set state, malformed valid ranges, mixed transfer
  candidate sets, inference/certificate keys, native-validation wording, or
  family-identification language. PR-083 does not run or fake a native solver,
