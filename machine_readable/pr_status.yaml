notes: PR-000 closed as inventory-only baseline. PR-001 stabilizes editable install
  and import discovery when python points to an active virtual environment. PR-003
  validates DAG structure, policy ordering, and progress bookkeeping only. PR-002
  registers pytest marker taxonomy and explicit optional-dependency skip behavior;
  smoke/collect-only evidence is L0 harness reachability only. PR-004 installs and
  verifies repo-scoped Codex instructions, skills, custom agents, execpolicy rules,
  installer operations, and claim-scanner guardrails; this remains orchestration evidence,
  not scientific readiness. PR-005 materializes the first generated five-PR checkpoint
  artifact and no-progress replan detection; checkpoint percentages are DAG bookkeeping
  only, not scientific readiness evidence. PR-020 implements the deterministic Codex
  pytest subset runner for collect/smoke/fast/package commands; this is COMMON L1
  harness dispatch and failure-propagation evidence only. PR-010 adds canonical
  owner, claim-tier, implementation-scope, and bundle-role firewall contracts;
  legacy TSC inputs are accepted only through explicit TSC_LEGACY normalization.
  PR-021 records optional dependency availability and skip/blocker attribution
  as COMMON L1 diagnostic harness provenance only. PR-011 adds COMMON artifact
  manifest validation helpers and a generated diagnostic-only quarantine
  inventory for unmanifested figure/PDF assets; it does not regenerate or
  reinterpret figures. PR-013 adds a COMMON/HTT contract firewall so MIO
  diagnostic certificates and MIO-shaped payloads cannot be consumed as HTT
  likelihood/evidence inputs. PR-014 adds COMMON transfer-provenance contracts
  and a registry so transfer-dependent results carry source, family, valid
  range, observable kind, normalization, calibration status, and caveats
  without allowing external transfers to claim native validation. PR-040 adds
  COMMON sky-support contracts for coordinate frame, deterministic mask hash,
  sky fraction, completeness status, and unit-vector spherical means, and
  tightens directional manifest validation so `sky_support_status` alone is
  not enough for sky-facing artifacts. PR-012 adds the generated COMMON status
  snapshot and claim-ledger pipeline for DAG bookkeeping, with all public counts
  derived from `pr_backlog.yaml` and `pr_status.yaml`; this is diagnostic-only
  project status and not scientific readiness evidence. PR-022 standardizes the
  PR_DELTA/review-artifact scaffold generator, using active DAG cards to
  prefill owner, dependencies, files, tests, DoD, kill switch, claim impact,
  and risk-log sections; this is COMMON L1 review metadata only. PR-070 creates
  the OBSSTAT observable-feature facade over the canonical COMMON
  ObservableVector contract, with recursive claim/firewall checks for
  inference, MIO-certificate, premature family-identification, null p-value
  provenance, and transfer-derived metadata; it is diagnostic feature packaging
  only, not HTT likelihood evidence, MIO certification, transfer validation, or
  Bianchi family identification. PR-015 adds a COMMON semantic claim-language
  linter and CLI that hard-fails forbidden production claims involving
  scalar-only promotion into blocked geometry/family language, TSC/Teff full-solver or
  full-polarisation language, MIO diagnostic promotion into posterior/evidence, and
  external-transfer-as-native wording while allowing explicit negative
  guardrails and skipping archived historical planning surfaces by default.
  PR-050 adds a MIO diagnostic-only formalism package for signed x_C
  comparator projections with explicit B_C components, component signs,
  comparator, frame, units, cancellation index, config/input hashes, caveats,
  and PR-014 transfer metadata validation for transfer-derived bundles. It is
  not an anisotropy norm, posterior/evidence surface, native solver validation,
  or geometry/family claim. PR-041 adds an HTT diagnostic ZoA selection ladder
  with separate raw, ZoA-masked, angular-completeness, and mock-calibrated
  support summaries, COMMON sky-support metadata, config/input hashes,
  explicit no-production uniform-fallback behavior, and a fail-closed
  diagnostic-axis adapter. It does not produce posterior evidence, native
  solver validation, transfer validation, or geometry/family claims. PR-023
  extends the COMMON progress harness with explicit skipped-PR accounting,
  deterministic progress scoreboard output, and checkpoint markdown that lists
  blocked, skipped, unblocked-next, critical-path, and replan state without
  letting skipped PRs inflate completion percentages or satisfy dependencies.
  PR-071 adds an OBSSTAT harmonic/spin convention registry and export gate for
  alm feature payloads, requiring channel-local convention metadata for basis,
  normalization, phase, theta/phi evaluator provenance, coordinate frame,
  healpy-style storage, reality condition, spin transform, paired-map order,
  output-pair semantics, and coefficient shape. This is diagnostic feature
  provenance only; convention metadata is not transfer provenance, HTT evidence,
  MIO certification, native solver validation, morphology compatibility, or
  geometry/family evidence. PR-080 adds BASS_PY external-transfer adapter and
  registry wrappers for current AniCLASS-calibrated and empirical-proxy legacy
  transfer callables under the live `htt/bass/transfer` package root. The
  wrapped paths carry canonical conditional claim tier, diagnostic_only
  production status, explicit transfer_conditional metadata, PR-014 transfer
  source provenance, callable input domains, and native_solver_result false.
  They are not native solver outputs, transfer validation, HTT evidence, MIO
  certificates, morphology compatibility evidence, or geometry/family evidence.
  PR-030 freezes TSC/Teff as `TSC_LEGACY` legacy-reproduction and
  import-compatibility surface only, adds explicit `tsc_legacy` metadata and
  manifest checks, keeps `import tsc` quiet for warning-as-error harnesses,
  normalizes old raw `owner="TSC"` pack refs to canonical `TSC_LEGACY`
  manifests, and pins current production `tsc.*` imports to an advisory/caveat
  allowlist. TSC remains not an active science owner, HTT evidence/posterior
  layer, MIO certificate layer, transfer/native validation path, OBSSTAT
  feature owner, runtime gate, or family-claim path. PR-113 adds a COMMON
  diagnostic-only manuscript figure audit that parses includegraphics and
  graphicspath usage, joins PR-011 quarantine state, and emits
  `docs/generated/manuscript_figure_inventory.md` plus
  `docs/generated/missing_figure_references.md`. The current inventory records
  94 includegraphics refs, 0 manifest-backed resolved refs, 72 quarantined
  refs, 22 missing refs, and 23 text audit findings including manual status
  numbers, solver-validation wording, overstrong validation wording,
  production-value wording, and a pre-native family-identification risk. These
  artifacts are an inventory and
  quarantine gate only. They do not compile the manuscript, promote figures,
  validate native or external transfer, provide HTT evidence, provide MIO
  certificates, or permit final manuscript freeze while missing or quarantined
  references remain unexplained. PR-051 adds a MIO diagnostic-only
  `BudgetSpec` denominator-policy contract with explicit `MES_linear`,
  `external_transfer`, `atlas_quantile`, and `observational` policies,
  positive finite denominator validation, policy-specific provenance gates,
  pre-solver-safe atlas status vocabulary, observational sky/covariance/null
  support metadata, and provenance-preserving sensitivity points. External
  transfer budgets and sensitivity points require PR-014 transfer metadata and
  cannot claim native validation. The legacy COMMON/BASS descriptive departure
  bridge now rejects implicit denominator policy, non-positive denominator
  values, policy/kind mismatches, and any attempt to label a legacy COMMON
  budget as external-transfer/atlas/observational without the MIO contract.
  PR-051 is not Q/F/Pi/G inference, not HTT evidence, not a posterior, not a
  MIO certificate, not native solver validation, and not morphology or
  geometry/family identification evidence. PR-042 adds an HTT pre-solver
  preferred-axis promotion/synthesis lock at the live `htt/htt/htt` package
  root. The canonical COMMON `PreferredAxis` still defaults
  `production_allowed=False`; downstream harmonic use now requires posterior
  axis provenance, finite axis coordinates, explicit PR-040 `SkySupport`,
  sha256 sky-support/mask/scan-volume hashes, adequate mock coverage, and a
  matching `AxisPromotionRecord` with self-attested pre-solver lineage status.
  The existing `restore_full_a2m` entry point now calls this lock before the
  rotation stub, so diagnostic ZoA axes and hand-flipped production flags cannot
  rotate `a_lm`/`a_2m`. PR-042 is gate metadata only; it does not create a
  production axis, native solver result, transfer validation, HTT posterior
  evidence, MIO certificate, morphology compatibility claim, or geometry/family
  identification evidence. PR-072 adds OBSSTAT low-ell scalar feature summaries
  for C_l, S_1/2, parity, and input-frame planarity with explicit definitions,
  dense-full alm storage requirements, mixed C_l and alm consistency checks,
  recursive JSON payload key normalization, stricter null-calibration metadata,
  and stable top-level obsstat import identity. The summaries remain
  feature_only unless null-calibrated, diagnostic_only, transfer_source none,
  not model input, not MIO output, not native solver output, and not
  morphology, geometry, or family-identification evidence. PR-081 adds BASS_PY
  schema-only future low-ell adapter contracts under the live `htt/bass/transfer`
  root and corrects stale BASS backlog paths away from `htt/src/bass`.
  The native schema reserves future `alm_T/E/B` split, gate, residual,
  morphology-gate, and artifact-manifest fields without values. The adapter
  stub fails closed for execution-shaped methods, metadata carries
  `native_solver_result=false`, `returns_values=false`,
  `consumable_as_result=false`, and COMMON transfer validation now rejects
  schema-only/non-consumable metadata as result provenance. PR-081 does not run
  a solver, load a solver artifact, generate synthetic native transfer values,
  validate native transfer, create HTT evidence, create MIO output, or support
  morphology, geometry, or family-identification claims. PR-031 extracts
  COMMON semantic guard records for source, propagation, and observable status
  from legacy TSC semantics without TSC ownership. The guards preserve
  source/propagation/observable separation, block source-to-observable
  overclaim language, attach caveats while preserving artifact owner/scope,
  and cap these records at diagnostic-only or blocked status. They do not
  provide statistical observable validation, rank/null/mask/covariance support,
  transfer provenance, native solver validation, HTT evidence, MIO
  certificates, morphology compatibility, or geometry/family-identification
  evidence. PR-052 adds a MIO diagnostic-only Q normalized-score contract that
  composes PR-050 `DepartureBundle` signed `x_C` outputs with PR-051
  `BudgetSpec` denominator policies. The Q payload records explicit numerator
  policy, denominator policy, denominator use, comparator/frame/units,
  config/input hashes, sky/covariance/null status inherited from the budget,
  and separate departure/budget transfer provenance. Q remains a
  policy-normalized diagnostic score only; it is not certified F, not HTT
  inference, not native solver validation, not morphology compatibility, and
  not geometry/family-identification evidence. PR-043 adds an HTT
  directional mock-calibration harness for production-axis claim gates. The
  report records retention, directional bias, coverage, look-elsewhere adjusted
  FPR, Wilson intervals, rank status, null provenance, sky and mask and scan
  hashes, config and input hashes, caveats, and generating command as
  diagnostic-only metadata. HTT axis promotion now requires a hash-matched
  AxisMockCalibrationReport before an otherwise production axis can seed
  harmonic synthesis. Missing or inadequate mock calibration caps directional
  claims at diagnostic_only. PR-043 does not create posterior evidence, MIO
  certificates, native solver validation, transfer validation, morphology
  compatibility, or geometry/family-identification evidence. PR-073 adds
  OBSSTAT diagnostic morphology-axis and alignment feature extraction from a
  caller-supplied symmetric morphology tensor. The payload records antipodal
  axis conventions, eigenvalue gaps, rank/null-space/condition metadata,
  planarity descriptors, optional null and look-elsewhere metadata, config and
  input hashes, and a fail-closed diagnostic PreferredAxis adapter. The
  morphology axis remains non-production and cannot seed HTT harmonic synthesis
  without PR-042/PR-043 gates. PR-073 does not add HTT posterior evidence, MIO
  certificates, native solver validation, transfer validation, morphology
  compatibility, or geometry/family-identification evidence. PR-082 adds
  BASS_PY metadata-only AtlasEntryLite side-by-side transfer comparison
