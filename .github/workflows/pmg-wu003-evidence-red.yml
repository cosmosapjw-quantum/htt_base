name: PMG-WU-003 evidence RED reproducer

on:
  push:
    branches:
      - audit/pmg-wu003-evidence-red-20260828
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

jobs:
  focused-red:
    name: Focused PMG-WU-003 evidence RED
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact RED revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: |
          python -m pip install 'pytest>=8,<9' 'numpy>=1.26,<3' 'matplotlib>=3.8,<4' 'PyYAML>=6,<7'
          python -m pip install -e './htt'
      - name: Reproduce PMG-WU-003 evidence defects
        run: |
          env PYTHONPATH=htt:htt/src:htt/htt python -m pytest -q \
            tests/integration/test_planck_mes_coordinate_audit.py
