name: PMG-WU-005 worker threading GREEN receipt

on:
  push:
    branches:
      - audit/pmg-wu005-worker-threading-green-20260828
  workflow_dispatch:

permissions:
  contents: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  TARGET_BRANCH: changeset/planck-mes-paired300-irrep-carrier-20260828
  EXPECTED_TARGET_HEAD: 97f6397fadeea41d144420da08adba4495b42b83

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact target branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.TARGET_BRANCH }}
          persist-credentials: true
          fetch-depth: 0
      - name: Refuse moved target authority
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_HEAD"
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: |
          python -m pip install 'pytest>=8,<9' 'numpy>=1.26,<3' 'healpy==1.19.0'
          python -m pip install -e './htt'
      - name: Thread carrier through the existing attended path
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/observed_runs/run_planck_pr3.py')
          lines = path.read_text().splitlines()

          anchor = 'from obsstat.covariance_replay import validate_sample_covariance_replay  # noqa: E402'
          imports = [
              'from obsstat.planck_irrep_carrier import (  # noqa: E402',
              '    OBSERVATION_ROW_ID,',
              '    replay_planck_irrep_carrier,',
              '    scalar_feature_closure_report,',
              '    write_planck_irrep_carrier,',
              ')',
              'from obsstat.planck_paired300_carrier_execution import (  # noqa: E402',
              '    carrier_vector_from_alm,',
              ')',
          ]
          if imports[0] not in lines:
              if lines.count(anchor) != 1:
                  raise SystemExit('carrier import anchor drifted')
              index = lines.index(anchor) + 1
              lines[index:index] = imports

          return_anchor = '    return np.asarray(features, dtype=float)'
          candidates = [index for index, line in enumerate(lines) if line == return_anchor]
          if len(candidates) != 1:
              raise SystemExit('component return anchor drifted')
          insert_at = candidates[0] + 1
          helper_marker = 'def _component_features_from_real_carrier('
          if not any(line.startswith(helper_marker) for line in lines):
              helpers = [
                  '',
                  '',
                  'def _component_features_from_real_carrier(',
                  '    carrier: np.ndarray,',
                  ') -> np.ndarray:',
                  '    """Project one frozen 32-real carrier back to the twelve features."""',
                  '',
                  '    vector = np.asarray(carrier, dtype=np.float64)',
                  '    if vector.shape != (JOINT_CUTSKY_RETAINED_DIMENSION,):',
                  '        raise PlanckWorkerError("real carrier dimension drifted")',
                  '    alm = real_vector_to_alm(vector, lmin=LMIN, lmax=LMAX)',
                  '    vectors2 = extract_multipole_vectors(alm, ell=2, lmax=LMAX)',
                  '    vectors3 = extract_multipole_vectors(alm, ell=3, lmax=LMAX)',
                  '    return component_features_from_vectors(',
                  '        alm, vectors2=vectors2, vectors3=vectors3, lmax=LMAX',
                  '    )',
                  '',
                  '',
                  'def _process_ffp10_component_with_carrier(',
                  '    path: Path,',
                  '    *,',
                  '    array_name: str,',
                  '    row_ids: tuple[str, ...],',
                  '    component: str,',
                  '    context: Mapping[str, object],',
                  '    chunk_rows: int = 32,',
                  ') -> tuple[np.ndarray, np.ndarray]:',
                  '    """Process each compact null row once and preserve the same-fit carrier."""',
                  '',
                  '    try:',
                  '        with np.load(path, allow_pickle=False, mmap_mode="r") as bundle:',
                  '            maps = np.asarray(bundle[array_name])',
                  '            if maps.ndim != 2 or maps.shape[0] != len(row_ids):',
                  '                raise PlanckWorkerError("FFP10 same-sky map pairing is incomplete")',
                  '            features: list[np.ndarray] = []',
                  '            carriers: list[np.ndarray] = []',
                  '            for start in range(0, len(row_ids), chunk_rows):',
                  '                chunk = maps[start : start + chunk_rows]',
                  '                if not np.all(np.isfinite(chunk)):',
                  '                    raise PlanckWorkerError("FFP10 map stack contains nonfinite values")',
                  '                for pixel_map in chunk:',
                  '                    value, _, alm = _process_map(',
                  '                        np.asarray(pixel_map, dtype=float),',
                  '                        component=component,',
                  '                        context=context,',
                  '                    )',
                  '                    features.append(value)',
                  '                    carriers.append(carrier_vector_from_alm(alm))',
                  '    except (KeyError, OSError, ValueError) as exc:',
                  '        raise PlanckWorkerError("FFP10 bundle is not a safe numeric NPZ") from exc',
                  '    feature_matrix = np.asarray(features, dtype=np.float64)',
                  '    carrier_matrix = np.asarray(carriers, dtype=np.float64)',
                  '    if feature_matrix.shape != (len(row_ids), 12):',
                  '        raise PlanckWorkerError("FFP10 feature matrix shape drifted")',
                  '    if carrier_matrix.shape != (',
                  '        len(row_ids), JOINT_CUTSKY_RETAINED_DIMENSION',
                  '    ):',
                  '        raise PlanckWorkerError("FFP10 carrier matrix shape drifted")',
                  '    return feature_matrix, carrier_matrix',
              ]
              lines[insert_at:insert_at] = helpers

          old_start = '        null_features = _process_ffp10_component('
          starts = [index for index, line in enumerate(lines) if line == old_start]
          if len(starts) != 1:
              raise SystemExit('attended null-processing anchor drifted')
          start = starts[0]
          end = start
          while end < len(lines) and lines[end] != '        )':
              end += 1
          end += 1
          observed_block = [
              '        observed_features, _, _ = _process_map(',
              '            observed_map, component="SMICA", context=context',
              '        )',
          ]
          if lines[end:end + len(observed_block)] != observed_block:
              raise SystemExit('attended observation-processing anchor drifted')
          replacement = [
              '        null_features, null_carrier = (',
              '            _process_ffp10_component_with_carrier(',
              '                components["null"],',
              '                array_name="smica_maps",',
              '                row_ids=row_ids,',
              '                component="SMICA",',
              '                context=context,',
              '            )',
              '        )',
              '        observed_features, _, observed_alm = _process_map(',
              '            observed_map, component="SMICA", context=context',
              '        )',
              '        observed_carrier = carrier_vector_from_alm(observed_alm)',
          ]
          lines[start:end + len(observed_block)] = replacement

          replay_anchor = '        portable_replay = replay_pr315_feature_package('
          replay_starts = [index for index, line in enumerate(lines) if line == replay_anchor]
          if len(replay_starts) != 1:
              raise SystemExit('feature replay anchor drifted')
          replay_end = replay_starts[0]
          while replay_end < len(lines) and lines[replay_end] != '        )':
              replay_end += 1
          replay_end += 1
          carrier_marker = '        carrier_package = output_dir / "paired300_irrep_carrier.npz"'
          if carrier_marker not in lines:
              carrier_block = [
                  '        observed_projected = _component_features_from_real_carrier(',
                  '            observed_carrier',
                  '        )',
                  '        null_projected = np.asarray(',
                  '            [',
                  '                _component_features_from_real_carrier(row)',
                  '                for row in null_carrier',
                  '            ],',
                  '            dtype=np.float64,',
                  '        )',
                  '        scalar_closure = scalar_feature_closure_report(',
                  '            observed_expected=observed_features,',
                  '            observed_projected=observed_projected,',
                  '            null_expected=null_features,',
                  '            null_projected=null_projected,',
                  '        )',
                  '        _write_json(output_dir / "scalar_closure.json", scalar_closure)',
                  '        carrier_package = output_dir / "paired300_irrep_carrier.npz"',
                  '        carrier_metadata = output_dir / "paired300_irrep_carrier.json"',
                  '        transfer_identity = {',
                  '            "source_beam_sha256": _array_digest(',
                  '                np.asarray(context["source_beams"]["SMICA"])',
                  '            ),',
                  '            "source_pixel_window_sha256": _array_digest(',
                  '                np.asarray(context["source_pixels"]["SMICA"])',
                  '            ),',
                  '            "target_beam_sha256": _array_digest(',
                  '                np.asarray(context["target_beam"])',
                  '            ),',
                  '            "target_pixel_window_sha256": _array_digest(',
                  '                np.asarray(context["target_pixel"])',
                  '            ),',
                  '        }',
                  '        carrier_receipt = write_planck_irrep_carrier(',
                  '            package_path=carrier_package,',
                  '            metadata_path=carrier_metadata,',
                  '            observed_real_alm=observed_carrier,',
                  '            null_real_alm=null_carrier,',
                  '            row_ids=(OBSERVATION_ROW_ID, *row_ids),',
                  '            null_ordered_row_ids_sha256=SMICA_EXISTING_INVENTORY_ID,',
                  '            operator_identity=observation_operator,',
                  '            transfer_identity=transfer_identity,',
                  '            source_manifest_sha256=str(',
                  '                acceptance["raw_input_manifest_sha256"]',
                  '            ),',
                  '            scalar_feature_package_sha256=str(',
                  '                package_receipt["package_sha256"]',
                  '            ),',
                  '        )',
                  '        carrier_replay = replay_planck_irrep_carrier(',
                  '            package_path=carrier_package,',
                  '            metadata_path=carrier_metadata,',
                  '        )',
              ]
              lines[replay_end:replay_end] = carrier_block

          result_anchor = '            "feature_package": package_receipt,'
          if lines.count(result_anchor) != 1:
              raise SystemExit('result carrier anchor drifted')
          result_index = lines.index(result_anchor) + 1
          result_lines = [
              '            "irrep_carrier": carrier_receipt,',
              '            "irrep_carrier_replay": carrier_replay,',
              '            "scalar_closure": scalar_closure,',
          ]
          if result_lines[0] not in lines:
              lines[result_index:result_index] = result_lines

          terminal_anchor = '                "feature_package_sha256": package_receipt["package_sha256"],'
          if lines.count(terminal_anchor) != 1:
              raise SystemExit('terminal carrier anchor drifted')
          terminal_index = lines.index(terminal_anchor) + 1
          terminal_lines = [
              '                "irrep_carrier_package_sha256": carrier_receipt[',
              '                    "package_sha256"',
              '                ],',
              '                "irrep_carrier_replay": "MATCH",',
              '                "scalar_closure": scalar_closure["state"],',
          ]
          if terminal_lines[0] not in lines:
              lines[terminal_index:terminal_index] = terminal_lines

          path.write_text('\n'.join(lines) + '\n')
          PY
      - name: Run risk-scoped GREEN verification
        run: |
          python -m pytest -q \
            tests/obsstat/test_planck_irrep_carrier.py \
            tests/obsstat/test_covariance_replay.py \
            tests/integration/test_planck_irrep_carrier_execution.py \
            tests/integration/test_planck_pr3_current_stack.py
          python -m py_compile \
            htt/obsstat/planck_irrep_carrier.py \
            htt/obsstat/planck_paired300_carrier_execution.py \
            htt/obsstat/covariance_replay.py \
            scripts/observed_runs/run_planck_pr3.py
          git diff --check
      - name: Commit and push attended carrier threading
        run: |
          git config user.name 'cosmosapjw-quantum'
          git config user.email 'cosmosapjw@gmail.com'
          git add scripts/observed_runs/run_planck_pr3.py tests/integration/test_planck_irrep_carrier_execution.py
          git commit -m 'feat: preserve carrier in the PR315 attended path'
          git push origin HEAD:"$TARGET_BRANCH"
