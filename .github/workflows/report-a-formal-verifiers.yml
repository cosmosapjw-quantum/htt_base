name: Report A R4A1V0 formal verifiers

on:
  pull_request:
    paths:
      - docs/research_reports/verifiers/r4a1nf/CAS_CONTRACT_R4A1NF_DOMAIN.json
      - docs/research_reports/verifiers/r4a1nf/CAS_RUN_SPEC_R4A1NF_DOMAIN.json
      - docs/research_reports/verifiers/r4a1nf/cas/**
      - formal_mathlib/Egs3V8Mathlib/ReportAConvention.lean
      - formal_mathlib/Egs3V8Mathlib.lean
      - formal_mathlib/lakefile.toml
      - formal_mathlib/lake-manifest.json
      - formal_mathlib/lean-toolchain
      - .agent-harness/scripts/cas_gate.py
      - .github/workflows/report-a-formal-verifiers.yml
  push:
    paths:
      - docs/research_reports/verifiers/r4a1nf/CAS_CONTRACT_R4A1NF_DOMAIN.json
      - docs/research_reports/verifiers/r4a1nf/CAS_RUN_SPEC_R4A1NF_DOMAIN.json
      - docs/research_reports/verifiers/r4a1nf/cas/**
      - formal_mathlib/Egs3V8Mathlib/ReportAConvention.lean
      - formal_mathlib/Egs3V8Mathlib.lean
      - formal_mathlib/lakefile.toml
      - formal_mathlib/lake-manifest.json
      - formal_mathlib/lean-toolchain
      - .agent-harness/scripts/cas_gate.py
      - .github/workflows/report-a-formal-verifiers.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formal-r2:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned SymPy axis dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          sympy==1.14.0 mpmath==1.3.0

      - name: Set up and build the pinned Lean/mathlib package
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal_mathlib
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: true

      - name: Run parent-owned R2 CAS adjudication
        run: |
          python3 .agent-harness/scripts/cas_gate.py run-adjudicate \
            --contract docs/research_reports/verifiers/r4a1nf/CAS_CONTRACT_R4A1NF_DOMAIN.json \
            --run-spec docs/research_reports/verifiers/r4a1nf/CAS_RUN_SPEC_R4A1NF_DOMAIN.json \
            --out docs/research_reports/verifiers/r4a1nf/CAS_ADJUDICATION_R4A1NF_DOMAIN.json

      - name: Upload the parent-observed adjudication
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-a-r4a1v0-formal-adjudication
          path: docs/research_reports/verifiers/r4a1nf/CAS_ADJUDICATION_R4A1NF_DOMAIN.json
          if-no-files-found: warn
          retention-days: 30
