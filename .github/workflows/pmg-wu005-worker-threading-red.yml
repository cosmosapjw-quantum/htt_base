name: PMG-WU-005 worker threading RED receipt

on:
  push:
    branches:
      - audit/pmg-wu005-worker-threading-red-20260828
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

jobs:
  focused-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: |
          python -m pip install 'pytest>=8,<9' 'numpy>=1.26,<3' 'healpy==1.19.0'
          python -m pip install -e './htt'
      - name: Require missing worker carrier path RED
        run: |
          set +e
          python -m pytest -q \
            tests/integration/test_planck_irrep_carrier_execution.py \
            -k 'worker_compact or feature_projection' > red.log 2>&1
          status=$?
          cat red.log
          set -e
          test "$status" -ne 0
          grep -Eq '_process_ffp10_component_with_carrier|_component_features_from_real_carrier' red.log
