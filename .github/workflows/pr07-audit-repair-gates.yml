name: PR07 audit-repair gates

# First-push CI is intentionally quiet: no push trigger. Run manually via
# workflow_dispatch or open a PR touching the gated paths.
on:
  pull_request:
    paths:
      - 'htt/**'
      - 'research_gates/pr07/**'
      - 'scripts/run_pr07_experiments.py'
      - 'scripts/cove_verify_pr07.py'
      - 'docs/final_report/main.tex'
      - '.github/workflows/pr07-audit-repair-gates.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  # PR07-005: include every source root used by the uninstalled gate imports.
  PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/htt:${{ github.workspace }}/htt/htt:${{ github.workspace }}/htt/src

jobs:
  portable-gates:
    name: Portable numerical + claim gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './htt[dev]'
      - name: Forbidden legacy-dependency scan (required check)
        run: python research_gates/pr04/tools/verify_forbidden_dependencies.py --repo .
      - name: PR04 theorem/property gates (regression)
        run: python -m unittest discover -s research_gates/pr04/tests -p 'test_pr04_*.py' -v
      - name: PR07 repair gates (unit-safe stress, dynamics, PAPER-A)
        run: python -m unittest discover -s research_gates/pr07/tests -p 'test_pr07_*.py' -v
      - name: Run synthetic experiments + CoVe aggregation
        run: |
          python scripts/run_pr07_experiments.py
          python scripts/cove_verify_pr07.py
      - name: PR07 audit-repair contract gates
        run: python -m pytest tests/contracts/test_pr07_audit_repair.py -q
      - name: Publish current portable gate JSON checksums
        run: |
          mkdir -p artifacts/pr07
          sha256sum \
            docs/generated/pr07_paper_a.json \
            docs/generated/pr07_paper_b.json \
            docs/generated/pr07_k1_global_synthetic.json \
            docs/generated/pr07_k5_hierarchical_synthetic.json \
            docs/generated/pr07_k6_affine_ensemble_synthetic.json \
            docs/generated/pr07_cove_report.json \
            > artifacts/pr07/pr07_checksums.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr07-gate-artifacts
          if-no-files-found: error
          path: |
            docs/generated/pr07_paper_a.json
            docs/generated/pr07_paper_b.json
            docs/generated/pr07_k1_global_synthetic.json
            docs/generated/pr07_k5_hierarchical_synthetic.json
            docs/generated/pr07_k6_affine_ensemble_synthetic.json
            docs/generated/pr07_cove_report.json
            artifacts/pr07/pr07_checksums.sha256

  # The Wolfram/xAct symbolic gate is a LOCAL/manual check: it requires the
  # Wolfram Engine and xAct, which are not provisioned in portable CI. Run
  # `make pr07-wolfram` on the local host; a missing engine exits with a
  # registered blocker rather than a silent Python substitute.
