name: Diagnose PR-315 covariance replay

on:
  push:
    branches:
      - automation/planck-mes-irrep-overlay-20260827

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact planning head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: cosmosapjw-quantum/htt_base
          ref: 9440784dac07acfedb8d5997efc6f930ccc936ee
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install repository-contract dependencies
        run: |
          python -m pip install 'pytest>=8,<9' 'PyYAML>=6,<7' 'numpy>=1.26,<3'
          python -m pip install 'healpy==1.19.0'
          python -m pip install -e './htt'
      - name: Measure covariance replay drift
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import numpy as np

          path = Path('docs/generated/pr315_planck_smica_feature_replay.npz')
          with np.load(path, allow_pickle=False) as bundle:
              nulls = np.asarray(bundle['null_features'], dtype=float)
              stored = np.asarray(bundle['covariance'], dtype=float)
          recomputed = np.cov(nulls, rowvar=False, ddof=1)
          delta = recomputed - stored
          scale = max(1.0, float(np.max(np.abs(stored))), float(np.max(np.abs(recomputed))))
          max_abs = float(np.max(np.abs(delta)))
          nz = np.argwhere(delta != 0.0)
          print('numpy_version=', np.__version__)
          print('nulls_shape=', nulls.shape)
          print('covariance_shape=', stored.shape)
          print('array_equal=', np.array_equal(stored, recomputed))
          print('max_abs_diff=', max_abs)
          print('scale=', scale)
          print('max_abs_over_eps_scale=', max_abs / (np.finfo(float).eps * scale))
          print('nonzero_entries=', int(nz.shape[0]))
          if nz.size:
              i, j = map(int, nz[np.argmax(np.abs(delta[nz[:, 0], nz[:, 1]]))])
              print('worst_index=', (i, j))
              print('stored=', stored[i, j].hex())
              print('recomputed=', recomputed[i, j].hex())
              print('delta=', delta[i, j].hex())
              print('spacing_at_stored=', np.spacing(stored[i, j]).hex())
              print('ulp_ratio=', abs(delta[i, j] / np.spacing(stored[i, j])))
          PY
