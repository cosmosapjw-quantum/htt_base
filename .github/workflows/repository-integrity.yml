name: Repository integrity

# These display names are the candidate required-check interface. Branch
# protection remains deferred until GitHub has reported them on a real run.
on:
  push:
    branches:
      - research/pr04-multicomponent
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  repository-contracts:
    name: Repository contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the triggering revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate clean-clone harness state
        run: |
          test ! -e .agent-harness/ACTIVE_RUN
          test ! -e .agent-harness/runtime/ACTIVE_RUN
          python3 .agent-harness/scripts/validate_harness.py
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install contract-test dependencies
        run: python -m pip install 'pytest>=8,<9' 'PyYAML>=6,<7' 'numpy>=1.26,<3'
      - name: Validate DAG and synchronized mirrors
        run: |
          python scripts/codex_harness/sync_pr_dag_mirrors.py --check
          python scripts/codex_harness/validate_pr_dag.py \
            docs/codex_handoff/pr_backlog.yaml \
            --status docs/codex_handoff/pr_status.yaml \
            --strict-rescue-slice
      - name: Run repository and harness contracts
        run: |
          python -m pytest -q \
            scripts/codex_harness/test_repository_integrity_workflow.py \
            scripts/codex_harness/test_harness_enforcement.py \
            scripts/codex_harness/test_codex_assets.py
      - name: Run clean-clone observational quarantine contracts
        run: |
          python -m pytest -q \
            tests/contracts/test_obsdata_figures.py \
            tests/obsstat/test_pr151_invalidation_boundary.py \
            tests/contracts/test_pr303_pr289_integration.py
      - name: Run architecture boundary contract
        run: python -m pytest -q scripts/architecture/test_import_boundaries.py

  python-package-smoke:
    name: Python package smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the triggering revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install package and explicit build-test tools
        run: |
          python -m pip install 'setuptools>=68' wheel packaging
          python -m pip install -e './htt[dev]'
      - name: Compile Python sources
        run: python -m compileall -q .agent-harness/scripts scripts/codex_harness htt
      - name: Compile architecture checks
        run: python -m compileall -q scripts/architecture
      - name: Probe installed import surface
        run: |
          python -c "import bass, common, htt, mio, obsstat, tsc, tsc_legacy; print('IMPORT_OK')"
      - name: Run package smoke contract
        run: python scripts/codex_harness/run_subset.py package --python python

  rust-compile:
    name: Rust compile
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYO3_PYTHON: python
    steps:
      - name: Check out the triggering revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python 3.12 for PyO3 discovery
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install the repository-known Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal
      - name: Record Rust tool versions
        run: |
          rustc +1.94.1 --version
          cargo +1.94.1 --version
      - name: Check the locked production library
        run: cargo +1.94.1 check --locked --lib
