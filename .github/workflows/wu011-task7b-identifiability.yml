name: WU011 Task7B identifiability

on:
  pull_request:
    paths:
      - 'htt/obsstat/processed_boost_response.py'
      - 'htt/obsstat/processed_boost_operator.py'
      - 'htt/obsstat/processed_boost_linearization.py'
      - 'htt/obsstat/processed_boost_jacobian.py'
      - 'htt/obsstat/processed_boost_identifiability.py'
      - 'htt/obsstat/planck_pr3_operator.py'
      - 'htt/test_wu011_processed_boost_identifiability.py'
      - 'scripts/observed_runs/run_planck_mes_wu011_identifiability_atlas.py'
      - 'docs/superpowers/specs/2026-09-02-planck-mes-wu011-task7b-identifiability-sensitivity-design.md'
      - 'docs/superpowers/plans/2026-09-02-planck-mes-wu011-task7b-identifiability-sensitivity.md'
      - '.github/workflows/wu011-task7b-identifiability.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  identifiability-contracts:
    name: Task7B RED/GREEN contracts / Python 3.12
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install repository and pinned HEALPix dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './htt[dev]'
          python -m pip install 'healpy==1.20.0'
      - name: Verify dependency identity
        run: |
          python - <<'PY'
          import healpy
          import numpy
          import scipy
          assert healpy.__version__ == '1.20.0', healpy.__version__
          print('HEALPY_IDENTITY_OK', healpy.__version__)
          print('NUMPY_IDENTITY', numpy.__version__)
          print('SCIPY_IDENTITY', scipy.__version__)
          PY
      - name: Run Task-7B RED/GREEN contracts
        working-directory: htt
        run: pytest -q -m requires_healpy test_wu011_processed_boost_identifiability.py
