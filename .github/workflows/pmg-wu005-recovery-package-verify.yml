name: PMG-WU-005 recovery package verification

on:
  push:
    branches:
      - audit/pmg-wu005-recovery-package-verify-20260828
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_BRANCH: changeset/planck-mes-paired300-evidence-repair-v2-20260828
  EXPECTED_TARGET_HEAD: 948309925ef7f4cbc3f2e5b645bea9bee5ef879b
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.TARGET_BRANCH }}
          persist-credentials: false
          fetch-depth: 0
      - name: Refuse moved package authority
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_HEAD"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: |
          python -m pip install 'pytest>=8,<9' 'numpy>=1.26,<3' 'PyYAML>=6,<7' 'healpy>=1.18,<2'
          python -m pip install -e './htt'
      - name: Validate package and bounded repair
        run: |
          python scripts/validate_planck_mes_pmg_wu005_evidence_recovery.py --json --check-git
          python -m pytest -q \
            tests/contracts/test_planck_mes_pmg_wu005_evidence_recovery.py \
            tests/obsstat/test_planck_paired300_evidence.py \
            tests/integration/test_planck_paired300_replay_cli.py \
            tests/obsstat/test_planck_irrep_carrier.py \
            tests/integration/test_planck_irrep_carrier_execution.py
          python -m py_compile \
            scripts/validate_planck_mes_pmg_wu005_evidence_recovery.py \
            htt/obsstat/planck_paired300_evidence.py \
            htt/obsstat/planck_paired300_recovery.py \
            scripts/observed_runs/replay_planck_paired300_irrep_carrier.py \
            scripts/observed_runs/export_planck_paired300_irrep_carrier.py
          python scripts/observed_runs/replay_planck_paired300_irrep_carrier.py --help >/dev/null
          python scripts/observed_runs/export_planck_paired300_irrep_carrier.py --help | tee "$RUNNER_TEMP/export-help.txt"
          ! grep -q -- '--finalize-reviewed' "$RUNNER_TEMP/export-help.txt"
          git diff --check
          test -z "$(git status --porcelain=v1)"
