name: PR315 covariance portability diagnostic

on:
  push:
    branches:
      - audit/pr315-covariance-portability-20260828
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install NumPy 2.5
        run: python -m pip install 'numpy==2.5.2'
      - name: Measure covariance against a fixed fsum reference
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import math
          import numpy as np

          package = Path('docs/generated/pr315_planck_smica_feature_replay.npz')
          with np.load(package, allow_pickle=False) as bundle:
              nulls = np.asarray(bundle['null_features'], dtype=np.float64)
              stored = np.asarray(bundle['covariance'], dtype=np.float64)
          n, p = nulls.shape
          means = [math.fsum(float(value) for value in nulls[:, j]) / n for j in range(p)]
          reference = np.empty((p, p), dtype=np.float64)
          absolute_product_sums = np.empty((p, p), dtype=np.float64)
          for i in range(p):
              for j in range(i, p):
                  products = [
                      (float(row[i]) - means[i]) * (float(row[j]) - means[j])
                      for row in nulls
                  ]
                  value = math.fsum(products) / (n - 1)
                  absolute_sum = math.fsum(abs(product) for product in products) / (n - 1)
                  reference[i, j] = reference[j, i] = value
                  absolute_product_sums[i, j] = absolute_product_sums[j, i] = absolute_sum
          replay = np.cov(nulls, rowvar=False, ddof=1)
          eps = np.finfo(np.float64).eps
          gamma_n = (n * eps) / (1.0 - n * eps)
          bound = 16.0 * gamma_n * np.maximum(absolute_product_sums, np.finfo(np.float64).tiny)
          stored_delta = np.abs(stored - reference)
          replay_delta = np.abs(replay - reference)
          payload = {
              'numpy': np.__version__,
              'shape': list(stored.shape),
              'stored_equals_numpy_cov': bool(np.array_equal(stored, replay)),
              'stored_max_abs_error_vs_fsum': float(stored_delta.max()),
              'numpy_cov_max_abs_error_vs_fsum': float(replay_delta.max()),
              'stored_max_bound_ratio': float((stored_delta / bound).max()),
              'numpy_cov_max_bound_ratio': float((replay_delta / bound).max()),
              'stored_within_16gamma_bound': bool(np.all(stored_delta <= bound)),
              'numpy_cov_within_16gamma_bound': bool(np.all(replay_delta <= bound)),
              'stored_symmetric_exact': bool(np.array_equal(stored, stored.T)),
              'stored_min_eigenvalue': float(np.linalg.eigvalsh(stored).min()),
          }
          print(json.dumps(payload, indent=2, sort_keys=True))
          assert payload['stored_within_16gamma_bound']
          assert payload['numpy_cov_within_16gamma_bound']
          assert payload['stored_symmetric_exact']
          assert payload['stored_min_eigenvalue'] > 0.0
          PY
