name: Bianchi geometry and observability targeted regression

on:
  pull_request:
    paths:
      - ".github/workflows/bianchi-similarity.yml"
      - "htt/bass/background/bianchi_types.py"
      - "htt/bass/diagnostics/**"
      - "htt/pyproject.toml"
      - "scripts/r48/**"
      - "tests/r48/**"
  push:
    branches:
      - research/r48-tensorized-observational-convergence-20261109
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bianchi-diagnostics:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./htt[dev]"
      - name: Run targeted Bianchi geometry and observability tests
        run: PYTHONPATH=htt:. pytest -q htt/bass/diagnostics/test_bianchi_similarity.py tests/r48/test_bianchi_fivevar_identifiability_mock.py
      - name: Compile BASS diagnostics
        run: PYTHONPATH=htt:. python -m compileall -q htt/bass/diagnostics scripts/r48 tests/r48
