name: PMG-WU-005 carrier RED receipt

on:
  push:
    branches:
      - audit/pmg-wu005-carrier-red-20260828
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

jobs:
  focused-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out RED candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: |
          python -m pip install 'pytest>=8,<9' 'numpy>=1.26,<3'
          python -m pip install -e './htt'
      - name: Run focused carrier contract and require RED
        run: |
          set +e
          python -m pytest -q tests/obsstat/test_planck_irrep_carrier.py > red.log 2>&1
          status=$?
          cat red.log
          set -e
          test "$status" -ne 0
          grep -Eq 'ModuleNotFoundError|No module named.*planck_irrep_carrier' red.log
