name: Report A K2 claim architecture candidate contracts

on:
  pull_request:
    paths:
      - docs/codex_handoff/htt_tensorized_report_first_20260903/K2_40_CLAIM_CANDIDATE_OVERLAY.yaml
      - docs/codex_handoff/htt_tensorized_report_first_20260903/K2_CITATION_PROVENANCE_CANDIDATE_OVERLAY.yaml
      - docs/codex_handoff/htt_tensorized_report_first_20260903/REPORT_SECTION_CLAIM_MAP_V2_CANDIDATE.csv
      - docs/research_reports/report_a/REPORT_A_ORGANIC_INTEGRATION_MATRIX_V2_CANDIDATE.yaml
      - docs/research_reports/report_a/K2_BIBLIOGRAPHY_SUPPLEMENT_CANDIDATE.bib
      - docs/research_reports/K2_REPORT_A_CLAIM_ARCHITECTURE.md
      - tests/contracts/test_report_a_k2_kinematical_claim_recompile.py
      - .github/workflows/report-a-k2.yml
  push:
    paths:
      - docs/codex_handoff/htt_tensorized_report_first_20260903/K2_40_CLAIM_CANDIDATE_OVERLAY.yaml
      - docs/codex_handoff/htt_tensorized_report_first_20260903/K2_CITATION_PROVENANCE_CANDIDATE_OVERLAY.yaml
      - docs/codex_handoff/htt_tensorized_report_first_20260903/REPORT_SECTION_CLAIM_MAP_V2_CANDIDATE.csv
      - docs/research_reports/report_a/REPORT_A_ORGANIC_INTEGRATION_MATRIX_V2_CANDIDATE.yaml
      - docs/research_reports/report_a/K2_BIBLIOGRAPHY_SUPPLEMENT_CANDIDATE.bib
      - docs/research_reports/K2_REPORT_A_CLAIM_ARCHITECTURE.md
      - tests/contracts/test_report_a_k2_kinematical_claim_recompile.py
      - .github/workflows/report-a-k2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  k2-candidate-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up CPython 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check pytest PyYAML
      - name: Validate K1R source precondition
        run: python -m pytest -q tests/contracts/test_report_a_k1r_kinematical_mes_repairs.py
      - name: Validate K2 candidate claim citation and section bijections
        run: python -m pytest -q tests/contracts/test_report_a_k2_kinematical_claim_recompile.py
