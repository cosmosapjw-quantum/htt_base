name: Report A K2 strict compiler and authority candidate

on:
  pull_request:
    paths:
      - docs/codex_handoff/htt_tensorized_report_first_20260903/**
      - docs/research_reports/report_a/**
      - docs/research_reports/HTT_REPORT_A_REFERENCES.bib
      - docs/research_reports/K2_REPORT_A_CLAIM_ARCHITECTURE.md
      - scripts/compile_report_a_k2f_authority.py
      - scripts/compile_report_a_k2fr0_authority.py
      - tests/contracts/test_report_a_k1r_kinematical_mes_repairs.py
      - tests/contracts/test_report_a_k2_kinematical_claim_recompile.py
      - tests/contracts/test_report_a_k2f_compiler.py
      - tests/contracts/test_report_a_k2fr0_hardening.py
      - .github/workflows/report-a-k2.yml
  push:
    paths:
      - docs/codex_handoff/htt_tensorized_report_first_20260903/**
      - docs/research_reports/report_a/**
      - docs/research_reports/HTT_REPORT_A_REFERENCES.bib
      - docs/research_reports/K2_REPORT_A_CLAIM_ARCHITECTURE.md
      - scripts/compile_report_a_k2f_authority.py
      - scripts/compile_report_a_k2fr0_authority.py
      - tests/contracts/test_report_a_k1r_kinematical_mes_repairs.py
      - tests/contracts/test_report_a_k2_kinematical_claim_recompile.py
      - tests/contracts/test_report_a_k2f_compiler.py
      - tests/contracts/test_report_a_k2fr0_hardening.py
      - .github/workflows/report-a-k2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  k2-authority-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up CPython 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check pytest==8.3.5 PyYAML==6.0.2 pybtex==0.26.1
      - name: Check compiler and test syntax
        run: |
          python -m py_compile scripts/compile_report_a_k2f_authority.py scripts/compile_report_a_k2fr0_authority.py tests/contracts/test_report_a_k2fr0_hardening.py
      - name: Run existing K1R and K2 regression contracts
        run: |
          python -m pytest -q \
            tests/contracts/test_report_a_k1r_kinematical_mes_repairs.py \
            tests/contracts/test_report_a_k2_kinematical_claim_recompile.py \
            tests/contracts/test_report_a_k2f_compiler.py
      - name: Verify K2FR0 provenance, status, snapshot and atomic-publication contracts
        run: python -m pytest -q tests/contracts/test_report_a_k2fr0_hardening.py --junitxml="${RUNNER_TEMP}/k2fr0-tests.xml"
      - name: Materialise strict source-candidate bundle
        shell: bash
        run: |
          set -euo pipefail
          python scripts/compile_report_a_k2fr0_authority.py \
            --repository-root "$GITHUB_WORKSPACE" \
            --output-root "$RUNNER_TEMP/k2fr0-authority-bundle" \
            | tee "$RUNNER_TEMP/k2fr0-compilation.stdout.json"
      - name: Preserve candidate bundle and observed test result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: k2fr0-source-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/k2fr0-authority-bundle/
            ${{ runner.temp }}/k2fr0-tests.xml
            ${{ runner.temp }}/k2fr0-compilation.stdout.json
          if-no-files-found: warn
          retention-days: 14
