      - docs/codex_handoff/htt_tensorized_report_first_20260903/R4A1NF_FLATTENING_CLOSEOUT.yaml
      - docs/codex_handoff/htt_tensorized_report_first_20260903/THEORY_ONLY_DAG_STATUS_OVERLAY_V20.yaml
      - docs/codex_handoff/htt_tensorized_report_first_20260903/R4A1NF_MULTI_CAS_VERIFICATION_PLAN.yaml
