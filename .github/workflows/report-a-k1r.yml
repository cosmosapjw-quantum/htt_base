name: Report A K1R kinematical MES source contracts

on:
  pull_request:
    paths:
      - docs/codex_handoff/htt_tensorized_report_first_20260903/K0_TYPED_KINEMATICAL_MES_AUTHORITY_CROSSWALK_V2.yaml
      - docs/codex_handoff/htt_tensorized_report_first_20260903/K1R_TYPED_KINEMATICAL_MES_EVIDENCE_LEDGER.yaml
      - docs/codex_handoff/htt_tensorized_report_first_20260903/K2_KINEMATICAL_CLAIM_RECOMPILE_INPUT_V2.yaml
      - docs/research_reports/theory_packs/K1R_TYPED_KINEMATICAL_MES_THEOREM_PACK.md
      - tests/contracts/test_report_a_k1_kinematical_mes_theorems.py
      - tests/contracts/test_report_a_k1r_kinematical_mes_repairs.py
      - .github/workflows/report-a-k1r.yml
  push:
    paths:
      - docs/codex_handoff/htt_tensorized_report_first_20260903/K0_TYPED_KINEMATICAL_MES_AUTHORITY_CROSSWALK_V2.yaml
      - docs/codex_handoff/htt_tensorized_report_first_20260903/K1R_TYPED_KINEMATICAL_MES_EVIDENCE_LEDGER.yaml
      - docs/codex_handoff/htt_tensorized_report_first_20260903/K2_KINEMATICAL_CLAIM_RECOMPILE_INPUT_V2.yaml
      - docs/research_reports/theory_packs/K1R_TYPED_KINEMATICAL_MES_THEOREM_PACK.md
      - tests/contracts/test_report_a_k1_kinematical_mes_theorems.py
      - tests/contracts/test_report_a_k1r_kinematical_mes_repairs.py
      - .github/workflows/report-a-k1r.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  k1r-source-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up CPython 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check pytest PyYAML
      - name: Validate historical K1 source contract
        run: python -m pytest -q tests/contracts/test_report_a_k1_kinematical_mes_theorems.py
      - name: Validate K1R semantic and claim-recompile contracts
        run: python -m pytest -q tests/contracts/test_report_a_k1r_kinematical_mes_repairs.py
