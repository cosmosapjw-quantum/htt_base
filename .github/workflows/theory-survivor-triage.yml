name: Theory survivor triage

on:
  pull_request:
    paths:
      - scripts/extract_theory_survivor_surface.py
      - tests/contracts/test_theory_survivor_triage.py
      - docs/research_program/theory_promotion/closeout/REGISTERED_SURVIVOR_SEED.json
      - docs/research_program/theory_promotion/THEORY_PROMOTION_MATRIX_V1.json
      - .github/workflows/theory-survivor-triage.yml
  push:
    paths:
      - scripts/extract_theory_survivor_surface.py
      - tests/contracts/test_theory_survivor_triage.py
      - docs/research_program/theory_promotion/closeout/REGISTERED_SURVIVOR_SEED.json
      - docs/research_program/theory_promotion/THEORY_PROMOTION_MATRIX_V1.json
      - .github/workflows/theory-survivor-triage.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  triage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile and run WU-001 contracts
        run: |
          python -m py_compile scripts/extract_theory_survivor_surface.py
          python -m pytest -q tests/contracts/test_theory_survivor_triage.py

      - name: Replay exact PR-405 Git object twice
        run: |
          set -euo pipefail
          mkdir -p artifacts/theory_survivor_triage
          for suffix in a b; do
            python scripts/extract_theory_survivor_surface.py \
              --repo . \
              --matrix-ref 463f0999949bf8534c60ad7973b7342705c2e3d6 \
              --matrix-path docs/research_program/theory_promotion/THEORY_PROMOTION_MATRIX_V1.json \
              --expect-git-blob 56af1713ef8c4718598e10012819d5ab62c6e37a \
              --output artifacts/theory_survivor_triage/surface-${suffix}.json
          done
          cmp artifacts/theory_survivor_triage/surface-a.json \
              artifacts/theory_survivor_triage/surface-b.json
          cp artifacts/theory_survivor_triage/surface-a.json \
             artifacts/theory_survivor_triage/REGISTERED_SURVIVOR_SURFACE.json

      - name: Validate exact generated surface
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          path = Path('artifacts/theory_survivor_triage/REGISTERED_SURVIVOR_SURFACE.json')
          value = json.loads(path.read_text(encoding='ascii'))
          assert value['schema'] == 'htt.registered_survivor_surface.v1'
          assert value['source']['commit'] == '463f0999949bf8534c60ad7973b7342705c2e3d6'
          assert value['source']['git_blob'] == '56af1713ef8c4718598e10012819d5ab62c6e37a'
          assert value['coverage'] == {
              'exact_or_conditional_broad': 24,
              'synthetic_broad': 8,
              'broad_total': 32,
              'scoped_children': 5,
              'registered_total': 37,
              'included_total': 36,
              'deferred_total': 1,
              'excluded_total': 0,
              'missing_disposition_count': 0,
              'duplicate_candidate_id_count': 0,
          }
          assert value['unique_theorem_count'] is None
          assert value['release_authority'] is False
          assert value['observed_data_used'] is False
          assert len({row['candidate_id'] for row in value['candidates']}) == 37
          assert sum(row['candidate_id'] == 'PR284_NEW:FINITE-REGISTERED-PATH' and row['triage_disposition'] == 'DEFERRED' for row in value['candidates']) == 1
          receipt = {
              'schema': 'htt.registered_survivor_surface.execution_receipt.v1',
              'source_commit': value['source']['commit'],
              'source_git_blob': value['source']['git_blob'],
              'surface_content_id': value['content_id'],
              'surface_sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
              'coverage': value['coverage'],
              'release_authority': False,
              'observational_data_used': False,
              'terminal': 'PASS_REGISTERED_SURVIVOR_SURFACE_TRIAGE',
          }
          Path('artifacts/theory_survivor_triage/EXECUTION_RECEIPT.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n',
              encoding='ascii',
          )
          PY

      - name: Hash artifact surface
        run: |
          cd artifacts/theory_survivor_triage
          sha256sum REGISTERED_SURVIVOR_SURFACE.json EXECUTION_RECEIPT.json > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: theory-survivor-triage-${{ github.sha }}
          path: artifacts/theory_survivor_triage
          if-no-files-found: error
