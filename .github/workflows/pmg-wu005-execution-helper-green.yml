name: PMG-WU-005 execution helper GREEN receipt

on:
  push:
    branches:
      - audit/pmg-wu005-execution-helper-green-20260828
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

jobs:
  focused-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: |
          python -m pip install 'pytest>=8,<9' 'numpy>=1.26,<3'
          python -m pip install -e './htt'
      - name: Run focused one-pass helper contracts
        run: |
          python -m pytest -q \
            tests/obsstat/test_planck_irrep_carrier.py \
            tests/integration/test_planck_irrep_carrier_execution.py
          python -m py_compile \
            htt/obsstat/planck_irrep_carrier.py \
            htt/obsstat/planck_paired300_carrier_execution.py \
            tests/obsstat/test_planck_irrep_carrier.py \
            tests/integration/test_planck_irrep_carrier_execution.py
          git diff --check
