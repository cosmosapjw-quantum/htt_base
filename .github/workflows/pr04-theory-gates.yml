name: PR04 theory and integration gates

on:
  pull_request:
    paths:
      - 'htt/**'
      - 'research_gates/pr04/**'
      - '.github/workflows/pr04-theory-gates.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  theory-gates:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.10'
            experimental: false
          - python-version: '3.11'
            experimental: false
          - python-version: '3.12'
            experimental: false
          - python-version: '3.13'
            experimental: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install repository package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './htt[dev]'
      - name: Compile source tree
        run: python -m compileall -q htt
      - name: Import compatibility probe
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/htt
        run: |
          python -c "import htt; import htt.htt.core.ssot; import bass; import mio; print('IMPORT_OK')"
      - name: Run PR04 theorem/property gates
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/htt
        run: python -m unittest discover -s research_gates/pr04/tests -p 'test_pr04_*.py' -v
      - name: Verify forbidden legacy dependencies
        run: python research_gates/pr04/tools/verify_forbidden_dependencies.py --repo .
      - name: Run existing fast regression tier
        working-directory: htt
        run: pytest -m 'smoke or fast or ci' -q
