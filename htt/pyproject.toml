[project]
name = "bass-py"
version = "0.8.2+w8.2"
description = "BASS-py — Bianchi Anisotropy System Solver (Python side, low-ℓ special-purpose solver)"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=41",
    "emcee>=3.1,<3.2",
    "matplotlib>=3.8",
    "numpy>=1.24",
    "PyYAML>=6.0",
    "scipy>=1.10",
    "sympy>=1.12",
    "tomli>=1.1.0; python_version < '3.11'",
]

[project.optional-dependencies]
bayes = [
    "dynesty==3.0.0",
]
dev = [
    "pytest>=7.4",
]

[tool.pytest.ini_options]
addopts = ["-m", "not slow"]
testpaths = ["bass", "tsc", "src", "mio", "workspace", "."]
python_files = ["test_*.py", "*_test.py"]
markers = [
    "smoke: small deterministic harness and package reachability checks; not scientific validation",
    "fast: quick tests suitable for local pre-commit subsets",
    "slow: marks tests as slow / end-to-end integration; run explicitly with '-m slow'",
    "requires_healpy: tests requiring optional dependency healpy; skip must name healpy when unavailable",
    "requires_dynesty: tests requiring optional dependency dynesty; skip must name dynesty when unavailable",
    "anchor: numerical regression anchors; does not by itself certify production readiness",
    "verification: v5 design-pack verification bundle checks",
    "ci: fast subset safe to run on every CI push",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = [".", "src"]
include = ["bass*", "tsc*", "tsc_legacy*", "common*", "mio*", "workspace*", "htt*", "obsstat*", "teff*"]
exclude = [
    "build*",
    "*.build*",
    "__pycache__*",
    "*.__pycache__*",
    "*.egg-info*",
    "*.egg_info*",
]
namespaces = false

[tool.setuptools.package-data]
"bass.recombination" = [
    "fixtures/recombination_ref_planck2018.csv",
    "fixtures/recombination_ref_planck2018_z1e10.csv",
]
"bass.validation" = ["_d2_anchor_golden.json"]
"common" = ["resources/pr124_mes_authority_table.json"]
"htt.tests" = [
    "fixtures/pipeline_outputs/FLRW_tilt_results.json",
    "fixtures/pipeline_outputs/IS06_3D_posterior.npz",
    "fixtures/pipeline_outputs/robustness_sweeps_integrated.json",
]
"workspace" = ["data/obs_defaults.json"]

[tool.setuptools.exclude-package-data]
"*" = [
    "build/*",
    "build/**/*",
    "*/build/*",
    "*/build/**/*",
    "__pycache__/*",
    "*/__pycache__/*",
    "*.egg-info/*",
    "*/*.egg-info/*",
]
