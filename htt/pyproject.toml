[project]
name = "bass-py"
version = "0.8.2-w8-02"
description = "BASS-py — Bianchi Anisotropy System Solver (Python side, low-ℓ special-purpose solver)"
requires-python = ">=3.10"
dependencies = [
    "emcee>=3.1,<3.2",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.pytest.ini_options]
addopts = ["-m", "not slow"]
testpaths = ["bass", "tsc", "src", "mio", "workspace", "."]
python_files = ["test_*.py"]
markers = [
    "slow: marks tests as slow / end-to-end integration (LB-6; run explicitly with '-m slow'; run all with '-m \"slow or not slow\"')",
    "anchor: numerical regression anchors (D_2 MM-curve, ROUTE_B constants); must pass every commit",
    "verification: v5 design-pack verification bundle (symbolic/numeric/crosscheck)",
    "ci: fast subset safe to run on every CI push (no subprocess, no external I/O)",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [".", "src"]
include = ["bass*", "tsc*", "common*", "mio*", "workspace*"]
