name = "egs3v8mathlib"
defaultTargets = ["Egs3V8Mathlib"]

# Separate mathlib-backed lane for the v8 general (forall-parameter) theorems.
# Kept OUT of formal/ so the core native_decide lane stays offline and fast.

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.31.0"

[[lean_lib]]
name = "Egs3V8Mathlib"
