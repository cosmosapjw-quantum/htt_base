[project]
name = "bass-py"
version = "0.8.2-w8-02"
description = "BASS-py — Bianchi Anisotropy System Solver (Python side, low-ℓ special-purpose solver)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.pytest.ini_options]
testpaths = ["bass", "tsc", "src", "."]
python_files = ["test_*.py"]
markers = [
    "slow: marks tests as slow / end-to-end integration (LB-6; deselect with '-m \"not slow\"')",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [".", "src"]
include = ["bass*", "tsc*", "common*"]
