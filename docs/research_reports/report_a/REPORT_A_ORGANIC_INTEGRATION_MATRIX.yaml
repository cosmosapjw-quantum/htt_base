      numerical error; formulate the result as a quotient or identified set.
    evidence_boundary:
      - continuum row rank does not certify finite-HEALPix row rank
      - finite operator remains RANK_UNRESOLVED
      - physical high-ell priors and covariance define a different inference problem

  - id: verification_and_publication_authority
    manuscript_sections: [appendices]
    claim_ids: []
    original_repository_authority:
      - repository CAS risk-tier policy and parent cas_gate.py adjudicator
      - formal_mathlib package pinned to Lean 4.31.0 and registered mathlib commit
      - Git-diverged source and execution provenance infrastructure
    later_development:
      - R4A1V0 source-binding preflight
      - independent required SymPy and Lean R2 supporting-lemma axes
      - canonical 30-ID hash contract
      - sole formal bibliography authority
      - deterministic Markdown-to-LaTeX assembly
    integrated_role: >-
      Keep theorem truth implementation execution scientific adjudication and
      publication status distinct; make the report reproducible without turning
      infrastructure history into the scientific narrative.
    evidence_boundary:
      - source existence is not execution
      - a blocked axis is not replaced by majority vote
      - PDF compilation is not publication approval

publication_narrative_order:
  - problem and supersession
  - corrected observable representation
  - conditional physical bounds
  - finite-sample validity
  - local response model
  - processed-response quotient
  - continuum and finite numerical boundary
  - conditional robust-rank certificate
  - integrated interpretation and open gates

