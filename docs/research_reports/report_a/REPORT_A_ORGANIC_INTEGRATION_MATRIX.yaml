      Establish which earlier methods remain foundations, which numerical
      interpretations are withdrawn, and which claims are merely source-level
      or unresolved.
    forbidden_conflation:
      - source-disposition row count equals theorem count
      - historical byte replay restores superseded semantics
      - PR chronology substitutes for scientific argument

  - id: harmonic_and_tensor_representation
    manuscript_sections: [2, 3, 4]
    claim_ids:
      - RA-REP-001
      - RA-REP-002
      - RA-REP-003
      - RA-ORBIT-001
      - RA-ORBIT-002
      - RA-ORBIT-003
