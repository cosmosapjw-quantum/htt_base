  - current scalar-only MES observational rank
  - historical WU006-WU008 tensor foreground or carrier-injection conclusions
  - corrected Planck or FFP10 result
  - empirical beta or boost subtraction
  - physical shear or vorticity estimate from morphology alone
  - Bianchi-family identification
  - finite-HEALPix containment theorem
  - native BASS solver background recombination or reionization result
  - quarantined docs/manuscript/main.tex as a scientific or typesetting input

