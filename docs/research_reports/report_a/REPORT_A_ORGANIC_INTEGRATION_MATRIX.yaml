      - no arbitrary packet-image theorem
      - novelty unresolved

  - id: conditional_mes_geometry
    manuscript_sections: [5]
    claim_ids: [RA-MES-001, RA-MES-002, RA-MES-003]
    original_repository_authority:
      - original Maartens-Ellis-Stoeger and COBE-era PSTF formula lineage
