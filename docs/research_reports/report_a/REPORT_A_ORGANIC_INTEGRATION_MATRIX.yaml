      - ideal inverse and response-orthogonal residual interpretation
    integrated_role: >-
      Provide the exact local-observer response model while keeping it distinct
      from global matter-frame tilt and intrinsic cosmological anisotropy.
    forbidden_conflation:
      - local observer boost equals global tilt
      - response-orthogonal residual is automatically intrinsic octupole
      - scalar-temperature result implies polarization response

  - id: processed_response_and_identifiability
