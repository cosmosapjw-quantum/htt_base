    integrated_role: >-
      Retain MES quantities as conditional scalar norm bounds that motivate
      physical questions without treating them as tensor observations or direct
      shear/vorticity measurements.
    forbidden_conflation:
      - MES ceiling equals measured physical kinematics
      - bound compliance proves FLRW
      - rotational scalars reconstruct directional morphology

  - id: finite_null_statistics
    manuscript_sections: [6]
    claim_ids: [RA-STAT-001, RA-STAT-002, RA-STAT-003, RA-STAT-004]
    original_repository_authority:
      - existing finite-rank and observation-inclusive calibration machinery
      - PR367/PR440 row-preservation and typed-chart infrastructure
    later_development:
      - complete-analysis row-equivariance theorem
      - exact adaptive-selection counterexample with deterministic ties
      - strict split between exchangeable-row ranks and finite group-orbit tests
      - proper-subgroup out-of-orbit counterexample
    integrated_role: >-
      State the exact symmetry requirement for each reference construction and
      prevent data-adaptive tensor statistics or chart failures from silently
      invalidating the finite-sample calibration.
    forbidden_conflation:
      - subgroup invariance implies arbitrary-row exchangeability
      - shared rows are independent replications
      - noisy observation and noise-free simulations are automatically exchangeable

  - id: local_observer_response
    manuscript_sections: [7]
    claim_ids: [RA-RESP-001, RA-RESP-002]
    original_repository_authority:
