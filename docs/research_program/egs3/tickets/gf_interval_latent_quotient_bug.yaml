id: EGS3-gf-interval-latent-quotient-bug
title: Latent sign bug + positive-numerator domain restriction in T2' exact quotient path
state: resolved_in_successor_and_iff_retracted_superseded_by_T2G
owner_lane: mio / obsstat
severity: low

found_by: v8 adversarial verification pass (v7_egs3_T2prime spot-check, CONFIRMED low)

description: |
  htt/obsstat/egs3_gf_interval.py (T2', the joint-vs-naive depth-gap strictness module,
  rev-r146/v7) has, in its EXACT naive/joint quotient path:
    1. an UNDOCUMENTED positive-numerator domain restriction (the quotient/log route
       presumes a positive numerator+denominator; outside it the contrast is undefined),
       and
    2. a latent SIGN BUG in that same exact-quotient branch.
  Both are UNEXERCISED by the shipped strictness witness (gf_strictness_exact_witness),
  which only drives the corner-enumeration + subset paths, so NO reported result is
  affected and the gf_strictness_exact_seal is correct. The T2' strictness-iff theorem
  itself is mathematically correct (independently corroborated by brute-force enumeration).

why_not_fixed_now: |
  egs3_gf_interval.py is a v7-FROZEN source: its SHA256 is embedded in the byte-frozen v7
  report MANIFEST (build_external_audit_report_v7.py SOURCE_FILES). Editing it -- even a
  comment -- would break the v7 report --check byte-freeze. Since the bug is unexercised,
  documenting it here is the freeze-preserving action.

exit_gate: |
  In a future cycle that is allowed to touch the v7-era module (e.g. a v9 that re-freezes),
  add the explicit positive-numerator domain guard, fix the sign in the exact-quotient
  branch, and add a witness that exercises that path. Until then the path stays unused.

resolution_v8_update: |
  Resolved additively (2026-07-10, v8-update cycle) by the successor module
  htt/obsstat/egs3_gf_interval_v8.py, which the exit_gate's freeze constraint
  permits: the v7-frozen source is untouched (its historical defective output
  on the registered negative-numerator case is itself pinned by gate
  E-V8-1 test_frozen_module_behavior_is_unchanged).
  - explicit signed-numerator domain DOCUMENTED (v7 pairing valid iff the
    shifted numerator is nonnegative over the shared box);
  - sign defect FIXED via the full four-candidate corner enumeration
    {N_lo/D_lo, N_lo/D_hi, N_hi/D_lo, N_hi/D_hi} (valid for every signed
    numerator with strictly positive denominator);
  - the previously unexercised path is now EXERCISED: registered
    negative-numerator witness shows frozen v7 -> [-3/5,-19/39] vs true
    (= v8 = independent dense-grid Fraction verifier) [-3/4,-19/49];
  - bit-exact containment: on the documented nonnegative domain the v8
    selector reproduces the frozen v7 selector exactly (200/200 Fraction
    draws), so no v7 result changes;
  - signed-domain survey: joint subseteq naive containment 400/400 exact;
    the sign-conflict strictness criterion measured at 271/400 there --
    confirming the domain restriction was load-bearing and the criterion is
    NOT claimed outside the nonnegative-numerator region.
  Seal: docs/generated/gf_interval_v8_seal.json (egs3.gf_interval_v8, PASS).
  Gates: research_gates/egs3/tests/test_egs3_axis_e_gf_v8.py.

supersession_v9_2026_07_10: |
  Beyond the latent quotient bug above, the 2026-07-10 reviews REFUTED the
  T2' per-endpoint strictness iff itself: the instance S=[0,1], N(s)=s,
  D(s)=1+s sits inside the stated hypotheses (positive denominator,
  nondegenerate box, c_N c_D > 0) yet its lower endpoint is NOT strict
  (N_min = 0 neutralizes the conflict). Registry actions (REV-R170/R171):
  P36 RETRACTED and T2' per-endpoint iff RETRACTED, both superseded by T2G
  (htt/obsstat/egs3_fractional_program.py: product relaxation + per-endpoint
  diagonal-attainment criterion + argmin/argmax corollary gated on N > 0;
  seals fractional_program_exact_seal.json + fractional_program_sage_seal
  .json, Sage QQ+PPL Charnes-Cooper second engine). The 400/400 seal of the
  frozen module survives as the weaker existence-level lemma L-T2-EXIST.
  The frozen module stays untouched (byte-freeze); the exit_gate above is
  ABSORBED by the successor: the signed-safe engines live in
  egs3_gf_interval_v8/egs3_fractional_program and the frozen quotient path
  stays unused.

