resolved_in_v8: |
  Both registered identified-interval ENDPOINTS are realized by EXACT homogeneous
  cosmologies whose FULL Gauss and momentum CONSTRAINTS have EXACTLY-zero residuals
  (symbolic/rational, all orders in the tilt rapidity beta):
    - LOWER (Omega_k=0): Bianchi I; momentum constraint = antipodal energy-flux
      cancellation q(beta)+q(-beta)=0 (exact, sinh*cosh odd).
    - UPPER (Omega_k>0): Bianchi V (a_i=(a,0,0)); exact (0i) constraint
      3 a_b sigma^{ab}+kappa q^a=0 satisfied by a shear TRANSVERSE to the a-vector
      (sigma_1=0, sigma=diag(0,s+,-s+)) plus the antipodal zero-flux tilt pair.
  Since an interval is determined by its endpoints, realizing both with exact GR
  solutions makes the identified x_C interval exactly sharp -- a full nonlinear result.
  Verified on TWO engines: SymPy (exact symbolic, egs3_nonlinear_realization.py ->
  nonlinear_realization_seal.json) and Wolfram/xAct (wolfram/v8_t3_king_ellis.wls ->
  egs3_v8_t3_king_ellis_proof.json, xAct available). Gate
  research_gates/egs3/tests/test_egs3_axis_g_nonlinear_realization.py.

