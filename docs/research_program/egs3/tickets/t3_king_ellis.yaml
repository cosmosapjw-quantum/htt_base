honest_scope_note: |
  The v8 adversarial pass (medium-severity finding) flagged that "realizing both endpoints
  => interval exactly sharp / full nonlinear result" conflates endpoint attainment with
  continuum sharpness. Corrected: T3-full establishes EXACT ENDPOINT REALIZATION only; the
  box bound + interior filling remain the convex P31 result, only initial-data constraints
