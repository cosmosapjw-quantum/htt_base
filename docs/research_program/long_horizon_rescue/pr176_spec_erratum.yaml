    corrected_design_columns:
    - Dist*(2*nx^2-ny^2-nz^2)/3
    - Dist*(-nx^2+2*ny^2-nz^2)/3
    tensor_mapping: >-
      For d1=Sxx-Szz and d2=Syy-Szz, trace freedom gives
      Sxx=(2*d1-d2)/3, Syy=(-d1+2*d2)/3, and
      Szz=-(d1+d2)/3. The corrected columns implement this literal mapping.
    invariance: >-
      The two-dimensional diagonal STF nuisance span is unchanged, so theta,
      its covariance, rank, retained information, and residual fit are
      invariant up to floating-point roundoff. Reported nuisance coordinates
      and their injection truths are regenerated.
  terminal_routing:
    correction: >-
      The frozen covariance self-consistency miss is a separate validation
      axis and must not be merged into the registered divergence
      rank/condition/information gate. With all divergence identifiability
      gates passing and both signed q-response bridges unavailable, the
      registered scientific terminal is
      NON_INFORMATIVE_Q_RESPONSE_UNAVAILABLE.
    validation_axis: FROZEN_COVARIANCE_SELF_CONSISTENCY_GATE_FAILED
    accepted_measurement_policy: >-
      Raw affine coefficients remain computed candidate diagnostics, but are
      not labeled an accepted covariance-validated divergence measurement.
      The failed coverage receipts remain byte-visible and are not reseeded,
      rethresholded, or promoted to physical-covariance evidence.

