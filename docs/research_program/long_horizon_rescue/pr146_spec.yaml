model:
  module: htt/src/common/cf4_forward_simulator.py
  primary_generator: >-
    Cholesky factor L of the full Gorski correlation C_ab so a correlated
    radial-velocity field v_cv = L z (z standard normal) has Cov(v_cv) = C_ab
    exactly; the full field carries the super-sample large-scale modes.
  independent_reference: >-
    a periodic-box Gaussian random field built by FFT (a separate code path)
    with a physical linear velocity coloring i (100 f) k_j / k^2 sqrt(P(k));
    used only as the diagonal per-galaxy velocity-dispersion reference.
  H0_kms_mpc: '373/5'
  sigma_nl_kms: 250
  cosmology: fiducial LambdaCDM (velocity_power.fiducial); sigma_v_1d verified
  cholesky_subsample: 2000
  cholesky_realizations: 300
  cholesky_seed: 20260718
  box_ngrid: 128
  box_size_hmpc: 1500
  box_fields: 32
  box_subsample: 400
  box_seed: 20260720

coverage:
  n_mock: 200
  seed: 20260719
  subsample: 800
  inject:
    flow_kms: [120, -80, 60]
    monopole_kms: 40
  targets: [0.68, 0.95]
  idealised_band_68: 0.09
  idealised_band_95: 0.06
  realism_variants:
    - idealised
    - nongaussian_distance_error
    - nonlinear_scatter
    - selection_malmquist
    - grouping
  rule: >-
    the idealised Gaussian variant must cover at nominal under the full
    covariance and the noise-only covariance must under-cover; every realism
    variant is reported with per-component in-band flags and a degradation is
    recorded, never hidden.

depth_coverage:
  n_shells: 3
  n_mock: 160
  seed: 20260721
  rule: >-
    the sample is partitioned into pre-registered distance shells and the
    per-shell coverage is reported with a Bonferroni family-wise note; the
    least-favourable shell is disclosed.

effective_n:
  rule: >-
    the participation ratio of the correlated-field eigenvalues is reported as
    the effective number of independent large-scale modes so that same-box
    regions are never treated as independent samples; the Monte-Carlo
    covariance fractional uncertainty is reported alongside.

mutation_registry:
  - mutation_id: same_box_octant_independence
    kill_rule: counting same-box regions as independent mocks is rejected
  - mutation_id: wf_mean_as_ensemble
    kill_rule: using a single WF mean field as a posterior or CR ensemble is rejected
  - mutation_id: k6_rebind
    kill_rule: rebinding the K6 numerical branch to the CF4 catalogue authority is rejected
  - mutation_id: rare_tail_without_coverage
    kill_rule: emitting a rare-tail claim when the coverage validation fails is rejected
  - mutation_id: cf4_p0_closure
    kill_rule: a premature CF4 P0 closure before the PR-157 adjudication is rejected
  - mutation_id: box_grf_for_covariance
    kill_rule: using the finite-box GRF for the covariance or coverage is rejected

negative_scan:
  targets:
    - htt/src/common/cf4_forward_simulator.py
    - docs/generated/pr146_captions.json
  forbidden_patterns:
    - 'same-box octants are independent'
    - 'wf mean is the ensemble'
    - 'k6 rebound to cf4'
    - 'rare tail detected'
    - 'cf4 p0 closed'
    - 'box grf covariance is the coverage'
  rule: >-
    active PR-146 surfaces must never treat same-box regions as independent,
    treat a WF mean as an ensemble, rebind K6, claim a rare tail, close a CF4
    P0, or use the box GRF for the covariance.

