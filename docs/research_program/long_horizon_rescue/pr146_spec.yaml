acceptance_and_kill_switches:
  - the Cholesky generator reproduces the per-galaxy dispersion and the analytic bulk-flow cosmic-variance covariance within Monte-Carlo tolerance
  - the independent box GRF reproduces the band-limited per-galaxy dispersion under an order-unity factor and is not used for the covariance or coverage
  - the idealised variant covers at nominal under the full covariance and the noise-only covariance under-covers
  - every realism variant coverage is reported with per-component in-band flags and any degradation is recorded
  - the per-depth simultaneous coverage and the least-favourable shell are reported
  - the effective-N participation ratio and the covariance uncertainty are reported
  - the two CF4 P0s stay OPEN with remediation-candidate receipts (no closure before PR-157)
  - every registered mutation executes and is killed
  - all 102 remediation findings remain OPEN

