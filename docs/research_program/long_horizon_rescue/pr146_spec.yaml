claim_identity:
  claim_id: C-PR146-FORWARD-SIMULATOR
  claim_text: >-
    A CF4 catalogue forward-mock simulator draws correlated peculiar-velocity
    mocks whose covariance is the fiducial linear Gorski radial/transverse
    velocity correlation. The PRIMARY generator is a Cholesky factor of the
    full N-by-N Gorski covariance (a direct draw of the whole correlated
    field, so the super-sample large-scale modes are already present); it is
    verified to reproduce the per-galaxy velocity dispersion and, ensemble
    averaged, the analytic bulk-flow cosmic-variance covariance A-inverse M
    A-inverse. An INDEPENDENT box Gaussian-random-field generator built by a
    separate FFT code path reproduces the band-limited analytic per-galaxy
    velocity dispersion to a few percent under an order-unity rescale, which
    confirms the variance NORMALISATION (the diagonal scale) is not a shared
    code artifact; its off-diagonal correlation differs from the analytic by
    an order-unity finite-box factor and its band captures a documented
    fraction of the full dispersion, with the missing power dominated by
    above-Nyquist sub-grid small scales and only a percent-level genuine
    super-sample piece, so the box is used only as the diagonal-variance
    reference and never for the covariance or coverage, and the off-diagonal
    covariance structure is the fiducial Gorski model, not independently
    validated. Non-Gaussian (lognormal distance-modulus) distance error, a
    magnitude-limited selection with an unmodeled Malmquist bias, an unmodeled
    intra-group dispersion and a nonlinear small-scale scatter are layered on
    as genuine stressors and the bulk-flow-plus-monopole estimator is re-fit
    on every mock. Per-component 68 and 95 percent coverage is reported under
    the full covariance and the noise-only covariance for each realism variant
    and per depth shell; the idealised Gaussian variant covers by construction
    (a propagation self-consistency check) while the noise-only covariance
    under-covers, and where a genuine-stressor variant degrades coverage it is
    REPORTED, not hidden (the lognormal distance error and the Malmquist bias
    degrade the radial monopole). An effective-N audit
    (the participation ratio of the correlated field) and the Monte-Carlo
    covariance uncertainty are reported so that same-box regions are never
    counted as independent. This is forward-simulator coverage mechanics at
    C2 only; the two CF4 P0s (C1-K5-MV-F1, C3-K5-VCORR-ML-F1) stay OPEN with
    remediation-CANDIDATE receipts, their closure impossible before the
    PR-157 adjudication. No rare-tail or significance claim is produced, and
    the K6 numerical branch is not rebound to the CF4 catalogue authority.
  domain: cf4_group_peculiar_velocity_forward_mocks
  frame: binds_pr145_estimators_pr144_manifest_pr137_coverage_pr135_ranking_pr123_oracle
  claim_level_scheme: roadmap_rescue_v1
