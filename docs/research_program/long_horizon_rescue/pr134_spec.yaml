registry:
  module: htt/src/common/estimand_registry.py
  required_fields:
    - analysis_id
    - target_population
    - observation_unit
    - dependence_cluster
    - selection_window
    - preprocessing
    - estimand
    - nuisance_family
    - prior_null_multiplicity
    - allowed_transformations
    - generative_branch
  generative_branches:
    - deterministic_template_mean
    - stochastic_covariance_factor
  branch_rule: >-
    the template-mean and covariance-factor branches are distinct typed
    generative objects; a contract declares exactly one branch role per
    component and the composer refuses to mix a template mean with a
    covariance factor drawn from a different analysis or branch.
  dependence_rule: >-
    dependence_cluster is a NAMED structure (e.g. spatial_correlation,
    pixel_covariance, clustering_cosmic_variance); the flat/independent
    label is only admissible when explicitly justified and is never the
    default.

