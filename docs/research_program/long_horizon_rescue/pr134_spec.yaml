negative_scan:
  targets:
    - htt/src/common/estimand_registry.py
    - docs/generated/pr134_captions.json
  forbidden_patterns:
    - 'all surveys share one channel'
    - 'dependency assumed independent'
    - 'template and covariance merged'
    - 'measured the dipole'
    - 'family identified from estimand'
  rule: >-
    active PR-134 surfaces must never flatten surveys to one channel,
    assume independent dependency, merge the two generative branches,
    or claim a measurement/family identification.

mutation_registry:
  - mutation_id: hidden_default_field
    kill_rule: a contract omitting any required field is rejected by the fail-closed schema validator
  - mutation_id: flattened_channel_type
    kill_rule: registering two distinct analysis ids with identical specification content (same channel fingerprint) is rejected by the channel-flattening guard through the public API
  - mutation_id: independent_dependency_assumption
    kill_rule: a dependence_cluster silently set to the flat/independent label without justification is rejected
  - mutation_id: template_covariance_mix
    kill_rule: composing a template mean with a covariance factor from a different branch/analysis is rejected by the branch separation validator
  - mutation_id: posthoc_window_edit
    kill_rule: editing a registered contract field in place (same analysis_id) is rejected by the immutability guard; a rename-only revision that leaves prior_null_multiplicity unchanged is rejected by the multiplicity guard
  - mutation_id: active_inference_without_registry
    kill_rule: an inference request naming an unregistered analysis_id is blocked

artifact_contract:
  outputs:
    - docs/generated/pr134_contract_registry.json
    - docs/generated/pr134_estimand_fingerprints.json
    - docs/generated/pr134_dependency_graph.json
    - docs/generated/pr134_branch_separation.json
    - docs/generated/pr134_captions.json
    - docs/generated/pr134_mutation_report.json
    - docs/generated/pr134_artifact_manifest.json
  check_policy: fresh_build_must_equal_disk_bytes

acceptance_and_kill_switches:
  - all five representative contracts register with every required field explicit (fail-closed on any omission)
  - each contract has a unique content-addressed estimand fingerprint and flattening two surveys is rejected
  - dependence is recorded as a named cluster, never a silent independent-rows default
  - the template-mean and covariance-factor branches are separate and mixing them is blocked
  - a post-hoc field edit without a new id/multiplicity and an unregistered-analysis inference request are both blocked
  - every registered mutation executes and is killed
  - all 102 remediation findings remain OPEN

forbidden_output_language:
  - all surveys share one channel
  - dependency assumed independent
  - template and covariance merged
  - measured the dipole
  - family identified from estimand
  - shear detected
  - isotropy established
  - Bianchi geometry detected
  - Bianchi family identified
  - finding rescued
  - validated as native
