claim_identity:
  claim_id: C-PR134-ESTIMAND-REGISTRY
  claim_text: >-
    Each analysis carries a TYPED contract naming its target population,
    observation unit, dependence cluster, selection/mask/window,
    preprocessing, estimand, nuisance family, prior/null/multiplicity,
    and allowed transformations — every field explicit and fail-closed
    (a missing or defaulted field is rejected, so no hidden
    sample/window/depth convention can survive). The deterministic
    TEMPLATE-mean generative branch and the stochastic COVARIANCE data
    factor are separate typed branches and are never mixed. Five
    REPRESENTATIVE contracts are registered from documented metadata
    (CF4 MV bulk flow, K1 CMB isotropy, DESI number-count dipole, ACT
    DR6 kappa, JWST anchors) — specification mechanics only, no PR4 data
    run. Each contract carries a content-addressed estimand fingerprint
    (editing any field mints a new fingerprint), and dependence is
    recorded as an explicit cluster structure, never as independent
    rows. Any active inference MUST route through the registry's
    require_registered_for_inference gate (an unregistered analysis_id
    is refused there); a mix of the template and covariance branches,
    or a post-hoc nuisance/depth/window edit without a new ID and a
    bumped multiplicity, is BLOCKED. The registry provides the gate; no
    live inference path is wired at this pre-solver tier (PR4 data out
    of scope). Estimand/analysis specification mechanics only — no
    measurement, no family/geometry claim.
  domain: typed_analysis_specification_registry_only
  frame: binds_pr122_receipt_pr125_frame_pr133_source_response_types
  claim_level_scheme: roadmap_rescue_v1
  claim_level: C1

scope_and_non_goals:
  flatten_all_surveys_to_one_channel_type: forbidden
  dependency_assumed_independent_rows: forbidden
  generic_contract_without_representative_fixtures: forbidden
  template_covariance_branch_mixing: forbidden
  posthoc_nuisance_window_edit_without_new_id: forbidden
  active_inference_without_registry: forbidden
  remediation_disposition_change: forbidden

