  measure_as_posterior_or_evidence: forbidden
  measure_as_htt_likelihood_or_truth_certificate: forbidden
  measure_substitution_F_Pi_Q: forbidden
  unmatched_null: forbidden
  degenerate_null: forbidden
  posthoc_weight_or_pairing_change_without_multiplicity: forbidden
  calibrated_scalar_without_justified_measure: forbidden
  remediation_disposition_change: forbidden

remediation_state_contract:
  path: docs/codex_handoff/research_remediation_state.yaml
  sha256: f16d9754828bb32ae4cef92f585af82ae7fd1caa2687a7b4144bc1e942328dd9
  finding_count: 102
  required_scientific_status_counts: {OPEN: 102}
  rescued_count: 0

data_scope:
  pr4_data_work: skip_entirely_by_user_scope
  pr4_commands_run_required: 0

model:
  module: htt/src/common/mio_joint_measure.py
  components: [Sigma2, W2, Omega_tilt, DeltaOmega_k]
  n_obs: 40
  data_seed: 42
  injected_signal: {component: Omega_tilt, mean_shift: '6/5'}
  measure_spec:
    weights: ['1', '1', '1', '1']
    pairing: unpaired
    depth_policy: raw
    null_scale: ['1', '1', '1', '1']
    justified: true

calibration:
  null_seed: 7
  n_null: 3000
  boot_seed: 11
  n_boot: 400
  F_null_type: reference_scale
  Pi_null_type: sign_flip
  null_scale_consistency_tol: '3/2'
  rule: >-
    F is calibrated against a reference-scale matched null (a magnitude
    null) whose per-component noise scale is VALIDATED against the data's
    robust (MAD) scale; Pi against a sign-flip matched null (a signed-
    contrast null) with a TWO-SIDED p-value; each uses the registered
    spec's weights, pairing, and depth policy.

demos:
  degenerate_null:
    kind: F
    null_type: sign_flip
    rule: >-
      a sign-flip null leaves the second-moment F invariant (zero spread);
      it is DEGENERATE and refused.
  two_sided_pi:
    negative_shift: '-6/5'
    rule: >-
      a NEGATIVE Omega_tilt contrast of equal magnitude yields the same
      small two-sided Pi p-value as the positive case (the one-sided upper
      tail would mis-report it as p ~ 1).
  mis_set_null_scale:
    null_scale: ['1/2', '1', '1', '1']
    rule: >-
      a reference null_scale inconsistent with the data's robust scale is
      refused, so F significance is not governed by a free hyperparameter.
  no_justified_measure:
    family_weights: [['1', '1', '1', '1'], ['2', '1', '1', '1'], ['1', '1', '3', '1']]
    rule: >-
      an unjustified MeasureSpec yields no calibrated scalar; only the
      measure-family sensitivity (F across the weight family) is reported.

negative_scan:
  targets:
    - htt/src/common/mio_joint_measure.py
    - docs/generated/pr142_captions.json
  forbidden_patterns:
    - 'f is the posterior probability'
    - 'mio measure is the evidence'
    - 'diagnostic is a truth certificate'
    - 'f substitutes for pi'
    - 'mio measure is the htt likelihood'
  rule: >-
    active PR-142 surfaces must never present a MIO measure as a posterior,
    an evidence, a truth certificate, or an HTT likelihood, or substitute
    F for Pi.

mutation_registry:
  - mutation_id: measure_as_posterior
    kill_rule: presenting a MIO measure as a posterior probability is rejected by the role guard
  - mutation_id: measure_as_evidence
    kill_rule: presenting a MIO measure as an evidence is rejected by the role guard
  - mutation_id: measure_substitution
    kill_rule: reporting Pi as F (or any F/Pi/Q substitution) is rejected by the substitution guard
  - mutation_id: unmatched_null
    kill_rule: a matched-null spec that differs from the measure spec is rejected
  - mutation_id: degenerate_null_for_F
    kill_rule: a sign-flip null for the second-moment F is degenerate and rejected
  - mutation_id: posthoc_weight_change
    kill_rule: changing the measure weights after the result without a new family and multiplicity is rejected

artifact_contract:
  outputs:
    - docs/generated/pr142_measures_report.json
    - docs/generated/pr142_invariance_report.json
    - docs/generated/pr142_gf_range.json
    - docs/generated/pr142_no_justified_demo.json
    - docs/generated/pr142_captions.json
    - docs/generated/pr142_mutation_report.json
    - docs/generated/pr142_artifact_manifest.json
  check_policy: fresh_build_must_equal_disk_bytes

acceptance_and_kill_switches:
  - F and Pi are computed with measure-appropriate matched nulls and permutation invariance holds
  - a sign-flip null for F is demonstrated degenerate and refused
  - the pairing counterexample shows paired and unpaired specs differ
  - G_F is a set-valued feasible range, never a scalar posterior
  - an unjustified measure yields only family sensitivity, no calibrated scalar
  - every registered mutation executes and is killed
  - all 102 remediation findings remain OPEN

forbidden_output_language:
  - f is the posterior probability
  - mio measure is the evidence
  - diagnostic is a truth certificate
  - f substitutes for pi
  - mio measure is the htt likelihood
  - shear detected
  - isotropy established
  - Bianchi geometry detected
  - Bianchi family identified
  - finding rescued
  - validated as native
