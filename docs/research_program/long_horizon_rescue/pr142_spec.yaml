claim_identity:
  claim_id: C-PR142-MIO-MEASURE
  claim_text: >-
    A typed MeasureSpec (identity, weights, pairing, and depth/reference
    policy — a scientific assumption) defines three DISTINCT MIO diagnostic
    quantities over a departure-component table: F (a weighted joint
    second-moment / RMS summary), Pi (a weighted first-moment / mean
    contrast), and G_F (the SET-VALUED feasible range of F over an
    identified set). F, Pi, and Q are never interchangeable, and none of
    them is a posterior probability, an evidence, a likelihood term, or a
    truth certificate — MIO reports, it never manufactures inference, and
    the HTT/BASS likelihood is separate. The report gives each quantity's
    permutation / pairing / depth sensitivity, a bootstrap uncertainty, and
    a MATCHED-null distribution: the null MUST share the spec's weights,
    pairing, and depth policy, and it MUST be measure-appropriate (a signed
    contrast uses a sign-flip null; a second-moment magnitude uses a
    reference-scale resample; a null that leaves the measure invariant is
    degenerate and refused). A calibrated scalar is emitted only when a
    scientifically-justified measure is registered; otherwise the status is
    no_justified_measure and ONLY measure-family sensitivity is reported.
    Changing the weights or pairing after the result is a NEW registered
    diagnostic family with an updated look-elsewhere multiplicity.
    Calibrated MIO diagnostic mechanics only — no posterior, no evidence,
    no detection.
  domain: synthetic_departure_component_table_toy_only
  frame: binds_pr134_estimand_pr136_identified_pr137_coverage_pr141_mixture
  claim_level_scheme: roadmap_rescue_v1
  claim_level: C2

