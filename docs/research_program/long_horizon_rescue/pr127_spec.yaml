claim_identity:
  claim_id: C-PR127-GRADED-NONID
  claim_text: >-
    For the DECLARED registered response map only (three channels over the
    graded comparator g = (Sigma2, W2, Omega_tilt, DeltaOmega_k)): the
    exact kernel is span{e_W2, e_DeltaOmega_k}, point identification is
    impossible along the kernel directions inside the ambient carrier
    S_+^3 x R (constructive set-valued equivalence witnesses), the signed
    DeltaOmega_k axis is NEVER PSD-projected (cancellation witnesses are
    preserved), and an added observable raises the rank iff its row lies
    outside the registered row span. Two independent exact engines (SymPy,
    SageMath QQ) must agree on rank and kernel. Formal non-identification
    of the declared response map at C2 — never an isotropy statement, and
    silent about any other response map, transfer, mask, or window.
  domain: declared_registered_response_map_only
  frame: binds_pr125_registered_contracts_frame_free_algebra
  perturbative_order: exact_algebraic
  claim_level_scheme: roadmap_rescue_v1
  claim_level: C2

