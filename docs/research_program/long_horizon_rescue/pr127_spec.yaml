    - docs/generated/pr127_rank_api_table.json
    - docs/generated/pr127_mutation_report.json
    - docs/generated/pr127_artifact_manifest.json
  check_policy: fresh_build_must_equal_disk_bytes

acceptance_and_kill_switches:
  - both engines agree exactly on rank 2 and the kernel basis
  - every registered rank probe verifies on both engines
  - every non-identification witness pair produces identical response outputs and differs inside the carrier
  - every registered mutation executes and is killed
  - witnesses without constraint assignments stay algebraic_only
  - all 102 remediation findings remain OPEN

forbidden_output_language:
