physical_subset:
  name: A_C_comparator_level
  constraints:
    - hamiltonian_parent_identity: '1 = Omega_m + Omega_L + Omega_k + Omega_tilt + Sigma2 - W2 (exact)'
    - matter_positivity_and_box: '0 <= Omega_m <= 1; |Omega_L| <= 2; |Omega_k_total| <= 1; departures <= 1'
    - carrier: 'Sigma2, W2, Omega_tilt >= 0; DeltaOmega_k signed'
  deferred_constraints: >-
    momentum and Gauss constraint fixtures are NOT implemented at this
    comparator level; they are owned by the dynamical PRs (PR-131+). The
    physical label is A_C_comparator_level, never a full physical
    certificate.
  pair_rule: >-
    a witness PAIR is physical only when BOTH states carry verified
    assignments; the kernel move co-moves the nuisance Omega_L per state
    (registered nuisance freedom = the non-identification). Any witness
    without a verified assignment is algebraic_only.

added_observable_rank_api:
  rule: an added observable row raises the rank iff it lies outside the registered row span (verified exactly on both engines)
  registered_probes:
    - {row: ['0', '1', '0', '0'], raises_rank: true, note: direct W2 observable}
    - {row: ['0', '0', '0', '1'], raises_rank: true, note: direct DeltaOmega_k observable}
    - {row: ['0', '0', '2', '0'], raises_rank: false, note: rescaled duplicate Omega_tilt channel}
    - {row: ['1', '0', '1', '0'], raises_rank: false, note: linear combination of existing rows}

mutation_registry:
  - mutation_id: psd_projection_kills_witness
    kill_rule: clipping the signed DeltaOmega_k of a registered cancellation witness is rejected by the forbid_psd_projection pairwise guard (a convention guard exercised by mutation and tests; no build path performs projections)
  - mutation_id: rank_inflation_duplicate_row
    kill_rule: the rescaled duplicate Omega_tilt row keeps the agreed rank at 2 on both engines (real API answer); the mutant claim of rank 3 is the recorded survival condition
  - mutation_id: kernel_drop
    kill_rule: a claimed kernel basis missing e_W2 is killed by the real require_registered_kernel validator (also routed through the kernel receipt build)
  - mutation_id: constraint_free_promotion
    kill_rule: labeling a witness physical without a verified constraint assignment is rejected by the A_C validator
  - mutation_id: engine_disagreement
    kill_rule: a rank/kernel claim carried by one engine only (or with disagreeing engines) is blocked by the agreement gate
  - mutation_id: non_identification_as_isotropy
    kill_rule: claim text reading non-identification as an isotropy proof fails the language lint

