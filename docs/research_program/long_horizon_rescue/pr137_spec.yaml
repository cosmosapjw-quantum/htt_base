preregistration:
  module: htt/src/common/weak_id_coverage.py
  nominal_coverage: '0.95'
  allowed_undercoverage: '0.02'
  retain_lower_bound: '0.93'
  min_replicates_per_point: 2000
  min_seeds: 10
  bit_generator: PCG64
  base_seed: 20260719
  family_wise_confidence: '0.99'
  mesh_refinement_levels: 2
  optimizer_error_tolerance_fraction: '0.10'
  extension_replicates: 10000
  extension_trigger_within: '0.01'
  theta0_positions: [boundary, midpoint]
  retain_config: boundary
  extension_rule: >-
    the retain/failure decision uses the least-favorable BOUNDARY config
    (theta0 at the identified-set edge). A grid point whose family-wise
    (Bonferroni over all grid points, joint 0.99) lower bound is within
    0.01 of the 0.93 retain boundary at the initial 2000 replicates is
    EXTENDED to 10000 replicates (a pre-registered adaptive rule, not
    post-hoc tuning); the extended lower bound is the retain decision.
  dgp:
    model: 'L_hat ~ N(theta0 - w/2, s^2), U_hat ~ N(theta0 + w/2, s^2); theta0 = 0, s = 1'
    procedure: 'Imbens-Manski CI [L_hat - c(w) s, U_hat + c(w) s], c(w) solves Phi(c + w/s) - Phi(-c) = 0.95'
    regime_by_w: 'w = 0 point-identified; 0 < w < inf partially identified; w -> inf unidentified'
  grid_w_coarse: ['0', '1/2', '1', '2', '4']
  grid_w_fine: ['0', '1/4', '1/2', '3/4', '1', '3/2', '2', '3', '4']

coverage_contract:
  simultaneous_rule: >-
    the family-wise lower bound is the Clopper-Pearson 0.99 lower bound
    on the pooled coverage across all replicates at a grid point; a grid
    point is retained iff its lower bound >= 0.93.
  failure_map_rule: >-
    a grid point whose lower bound < 0.93 is recorded in the failure map
    with its coverage and never removed from the reported grid.
  mesh_rule: >-
    coverage is computed on both the coarse and fine grids; the max
    coverage change on shared grid points and the max optimizer endpoint
    error are reported, and a change > 0.01 or an error > 10% of the
    endpoint tolerance is a kill condition.

uniform_language_lint:
  rule: >-
    the token "uniform" (and "uniformly", "class-wide uniform") is
    refused in any caption/summary unless a registered
    continuity_mesh_certificate is present; the certificate registry is
    EMPTY, so uniform-coverage language is refused.

negative_scan:
  targets:
    - htt/src/common/weak_id_coverage.py
    - docs/generated/pr137_captions.json
  forbidden_patterns:
    - 'uniform coverage over the class'
    - 'coverage from the central cases'
    - 'dropped the failing corner'
    - 'tuned the threshold to the coverage'
    - 'detected the signal'
  rule: >-
    active PR-137 surfaces must never claim uniform class-wide coverage
    without a certificate, coverage from central cases only, a silently
    dropped corner, or a coverage-tuned threshold.

mutation_registry:
  - mutation_id: uniform_without_certificate
    kill_rule: the word uniform in a coverage caption without a registered continuity/mesh certificate is refused by the uniform-language lint
  - mutation_id: central_cases_only
    kill_rule: computing coverage over only the point-identified/high-signal grid subset is rejected by the full-grid coverage guard
  - mutation_id: silent_corner_removal
    kill_rule: dropping a below-threshold grid point from the reported grid (instead of the failure map) is rejected by the failure-map completeness check
  - mutation_id: threshold_tuned_to_coverage
    kill_rule: changing the retain threshold after seeing coverage without a new calibration/evaluation split is rejected by the pre-registration pin
  - mutation_id: fewer_than_min_replicates
    kill_rule: a grid point with fewer than the pre-registered replicates/seeds is rejected by the replicate-count guard
  - mutation_id: wrong_binomial_bound
    kill_rule: an anti-conservative (upper-instead-of-lower, or point-estimate) family-wise interval is rejected by the Clopper-Pearson lower-bound check

artifact_contract:
  outputs:
    - docs/generated/pr137_coverage_grid.json
    - docs/generated/pr137_family_wise_bounds.json
    - docs/generated/pr137_mesh_refinement.json
    - docs/generated/pr137_failure_map.json
    - docs/generated/pr137_captions.json
    - docs/generated/pr137_mutation_report.json
    - docs/generated/pr137_artifact_manifest.json
  check_policy: fresh_build_must_equal_disk_bytes

acceptance_and_kill_switches:
  - every grid point has at least the pre-registered replicates over at least the pre-registered seeds
  - the family-wise 99% Clopper-Pearson lower bound is computed at every grid point and the retain decision uses 0.93
  - a below-threshold grid point is preserved in the failure map, never removed
  - coverage is computed over the FULL grid, not a central subset
  - the two-mesh coverage change and optimizer endpoint error are reported
  - the word uniform is refused without a registered continuity/mesh certificate
  - every registered mutation executes and is killed
  - all 102 remediation findings remain OPEN

forbidden_output_language:
  - uniform coverage over the class
  - coverage from the central cases
  - dropped the failing corner
  - tuned the threshold to the coverage
  - detected the signal
  - shear detected
  - isotropy established
  - Bianchi geometry detected
  - Bianchi family identified
  - finding rescued
  - validated as native
