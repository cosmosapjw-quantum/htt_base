claim_identity:
  claim_id: C-PR137-GRID-COVERAGE
  claim_text: >-
    A PRE-REGISTERED DGP grid crosses the point-identified,
    partially-identified, and unidentified regimes continuously (via the
    identified-set half-width w). The COMPLETE frozen algorithm
    (Imbens-Manski partial-identification confidence interval) is
    measured for simultaneous empirical coverage at every grid point,
    with the family-wise 99% binomial (Clopper-Pearson) LOWER bound
    reported, plus the empty/unbounded rate, the boundary behavior, and
    the optimizer endpoint error. The pre-registration fixes nominal
    coverage 0.95, allowed undercoverage 0.02, at least 2000 independent
    replicates per grid point distributed over at least 10 seeds; a grid
    point is RETAINED only if its family-wise 99% lower bound is at or
    above 0.93. Coverage change and optimizer endpoint error are
    reported at two mesh refinements. The result is reported as
    GRID-CONDITIONAL simultaneous empirical coverage; the word "uniform"
    (class-wide coverage) is LINT-REFUSED unless a continuity/mesh-error
    certificate is registered. Coverage is NEVER claimed from
    central/high-signal cases alone, a failed nuisance corner is NEVER
    silently removed (it is preserved in the failure map), and a
    threshold tuned to the coverage result requires a fresh
    calibration/evaluation split. Grid-conditional coverage-calibrated
    partial-identification mechanics only — no detection.
  domain: imbens_manski_partial_identification_dgp_grid_only
  frame: binds_pr123_oracle_pr135_finite_null_pr136_identified_set
  claim_level_scheme: roadmap_rescue_v1
  claim_level: C2

