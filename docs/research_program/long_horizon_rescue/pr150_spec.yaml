claim_identity:
  claim_id: C-PR150-K1-E2E
  claim_text: >-
    The exchangeable observation-inclusive pooled-rank global p-value estimator
    (binding PR-135) is first checked for conservativeness on a large correlated
    Gaussian-random-field ensemble with a live anti-conservative negative
    control (a method self-consistency check — the correlation is inert to a
    leave-one-out rank statistic, so this is NOT a Planck falsifier), then
    applied to the real Planck PR3 FFP10 end-to-end SMICA null (300 CMB
    Monte-Carlo maps drawn from the 999 available, each paired with a real noise
    Monte-Carlo map) through the SAME frozen mask/proc-nside/
    statistic/max-scan pipeline as the observed SMICA map (PR-149 convention),
    with the observed and null maps traversing a byte-equivalent path. The
    per-statistic local p-values and the look-elsewhere global p (max-scan over
    the six registered statistics — no sky axis grid) are reported separately.
    This is a PR3/FFP10-E2E-conditional low-multipole morphology DIAGNOSTIC at
    C2 only; the idealised GRF super-uniformity is NEVER promoted to a Planck
    systematics calibration, and no real-sky p-value is emitted without the
    E2E ensemble. PR4/NPIPE is fully out of scope — the only permitted PR4
    output is a NON-NUMERIC skip receipt, and no PR3+PR4 joint result is
    produced. No family, axis detection or joint C3 claim. The two CF4 P0s are
    untouched and stay OPEN.
  domain: planck_lowell_k1_e2e_calibration
  frame: binds_pr135_finite_null_pr149_convention_lowell_global_calibration
  claim_level_scheme: roadmap_rescue_v1
  claim_level: C2

