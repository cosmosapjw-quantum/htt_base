claim_identity:
  claim_id: C-PR150-K1-E2E
  claim_text: >-
    The frozen PR-149 low-ell pipeline is applied byte-equivalently to the
    observed Planck PR3 SMICA map and all 999 usable FFP10 CMB Monte-Carlo maps.
    Realizations use 300 instrument-noise maps paired by parsed CMB ID modulo
    300; CMB ID 00970 is excluded with Planck-helpdesk confirmation and no
    replacement. The lane reports the six registered local p-values and their
    max-scan look-elsewhere finite-ensemble global rank. Because noise maps are
    reused, the point rank is accompanied by cycle-split ranks and a
    noise-cluster bootstrap and is not called an iid exact-rank theorem. The
    idealised GRF check is preflight only. PR4 records the public SEVEM map and
    the externally blocked matched-simulation access, with no numeric output.
    This is a PR3/FFP10-E2E-conditional morphology result, not a detection,
    preferred axis, family, geometry, or native-solver result.
  domain: planck_lowell_k1_e2e_calibration
  frame: binds_pr135_finite_null_pr149_convention_lowell_global_calibration
  claim_level_scheme: roadmap_rescue_v1
  claim_level: C2

