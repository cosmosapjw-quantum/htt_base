acceptance_and_kill_switches:
  - the PR3 input manifest records exactly 999 usable CMB and 300 unique noise maps with excluded ID 00970
  - the six-statistic global p uses all 999 CMB maps and reports noise-reuse sensitivity
  - the compact NSIDE64 analysis input is authenticated on two distinct devices and exactly replays all 1299 raw maps plus the retained 999x6 statistic matrix
  - raw PR3 deletion remains forbidden until a versioned PR4 replacement-ready receipt lists the exact observed, simulation, exclusion, and noise-fix inventory and the gate independently rechecks every local size and full SHA-256
  - mechanical replacement readiness never deletes data; an explicit later storage-swap authorization remains a separate human action
  - the idealised GRF check remains preflight and is not promoted to a Planck calibration
  - PR4 records the public map plus externally blocked simulation access and emits no number
  - every registered mutation executes and is killed
  - all 102 remediation findings remain OPEN

forbidden_output_language:
