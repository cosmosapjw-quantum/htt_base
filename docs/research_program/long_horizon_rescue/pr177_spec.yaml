adjudication:
  integer_support_conflict: >-
    The canonical backlog and the user-authorized execution plan both use the
    strict expression 40 < L < 763.  The intake assignments used an inclusive
    paraphrase.  The canonical strict expression wins before any PR-177 score
    is evaluated, so the exact integer support is 41 through 762 inclusive.
  intake_findings:
  - PR177-HARNESS-001
  - F-PR177-CLAIM-001
  - F-PR177-STAT-CONTRACT
  selected_support: strict_40_lt_L_lt_763

claim:
  statement: >-
    One prospectively frozen five-component quadrupolar fractional-variance
    feature of the ACT DR6 baseline released reconstructed-kappa map is
    compared with exactly 400 corresponding released reconstructed
    simulations on the strict integer support 41 <= L <= 762.  The only
    scientific terminals are a release-simulation-conditional modulation
    candidate, no resolved coupling at current MC resolution, or a numerically
    unresolved result, after the registered mask control and finite-ensemble
    guard.
  allowed_scientific_results:
  - ACT_RELEASE_SIMULATION_CONDITIONAL_MODULATION_CANDIDATE
  - NO_RESOLVED_COUPLING_AT_CURRENT_MC_RESOLUTION
  - NUMERICALLY_UNRESOLVED_AT_CURRENT_MC_BUDGET
  blocked_status: BLOCKED_NO_SCIENTIFIC_RESULT
  interpretation: >-
    The result is conditional on this exact released baseline reconstruction,
    mask, estimator, and 400-member release ensemble.  It is neither raw-QE
    reproduction nor a detection, physical attribution, transfer validation,
    statistical-isotropy proof, cosmological-anisotropy result, geometry
    result, or family identification.

