  - the exact finite rank of the low-multipole band is reported
  - the stochastic and fixed-template injection laws are distinguished
  - the upstream raw-QE inputs are absent so the raw-QE inference is abandoned and only the release-simulation diagnostic is closed
  - every registered mutation executes and is killed
  - all 102 remediation findings remain OPEN

