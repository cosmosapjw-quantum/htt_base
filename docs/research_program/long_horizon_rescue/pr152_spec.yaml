acceptance_and_kill_switches:
  - the authenticated inventory separates completed reconstructed products from public but not-yet-executed raw-QE inputs
  - the primary data-plus-simulation leave-one-out transform is permutation-equivariant and reports an exact algebraic finite-rank ceiling conditional on release exchangeability
  - the asymmetric simulation-only LOO transform is disclosed as a non-exact sensitivity
  - the exact algebraic finite-rank ceiling of the low-multipole band is reported without presenting it as a measured numerical covariance rank
  - the stochastic and fixed-template injection laws are distinguished
  - public raw-QE inputs and software are recorded as a feasible large reconstruction that is not yet executed locally
  - raw-QE readiness remains false unless every typed local file record is fully rehashed and a parsed execution log cross-binds the exact inputs, software lock, command, zero exit status, and QE/RDN0 outputs
  - the release-simulation-conditioned null comparison is reported as a concrete conditional result
  - the exactly 400 simulation input manifest and low-L cache are bound by full-content SHA-256
  - the L=2 to 10 result explicitly remains exploratory outside the release-validated L=40 to 763 spectrum range
  - every generated artifact satisfies the complete provenance and statistical-metadata contract
  - every registered mutation executes and is killed
  - all 102 remediation findings remain OPEN

forbidden_output_language:
  - pre-qe transfer
  - sky-power limit from absent
  - naive self-mean-field
  - act kappa detection
  - bianchi family from act
  - anisotropy detected
  - Bianchi geometry detected
  - Bianchi family identified
  - finding rescued
  - validated as native
