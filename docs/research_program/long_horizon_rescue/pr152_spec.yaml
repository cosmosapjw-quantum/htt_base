claim_identity:
  claim_id: C-PR152-ACT-RAW-QE
  claim_text: >-
    The ACT DR6 lensing release provides reconstructed convergence data, 400
    Monte-Carlo simulations, response/normalisation, N0/N1 products, masks, and
    the validated spectrum range. Public four-split CMB maps and the open
    so-lenspipe/falafel/tempura/pixell stack make an independent
    realisation-dependent N0 reproducible, but its exact map, filter, response,
    mask, and software configuration is not local and remains a separate large
    reconstruction. The primary released-product statistic uses an
    OBSERVATION-INCLUSIVE leave-one-out mean field over the data plus 400
    simulations. This transform is permutation-equivariant under the
    release-simulation null; the former simulation-only LOO transform is retained
    as a non-exact sensitivity. The resulting observation-inclusive pooled rank
    is a concrete ACT-release-simulation-conditioned null comparison at C3. No
    raw-QE L=2..10 sky-power limit is emitted before the separate reconstruction,
    and released convergence plus an injected signal is NEVER called a pre-QE
    transfer. No isotropy proof, ACT kappa detection, anisotropy, geometry, or
    Bianchi-family claim. The two CF4 P0s are untouched and stay OPEN.
  domain: act_dr6_lensing_low_ell_crossfit
  frame: binds_pr135_finite_null_act_dr6_lensing_release
  claim_level_scheme: roadmap_rescue_v1
  claim_level: C3

