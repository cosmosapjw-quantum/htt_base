claim_identity:
  claim_id: C-PR152-ACT-RAW-QE
  claim_text: >-
    An authenticated ACT DR6 lensing inventory establishes that the release
    provides the reconstructed convergence (data + 400 Monte-Carlo sims), the QE
    normalisation/response, the fiducial N0 and the N1 derivatives, the mask and
    the validated multipole range, but NOT the raw filtered CMB maps or the
    quadratic-estimator pipeline, so a realisation-dependent N0 (raw-QE) cannot
    be formed.  On the release simulations the mean field is formed by a
    LEAVE-ONE-SIMULATION cross-fit (each sim debiased by the mean of the OTHER
    sims), which removes the self-mean-field bias of the naive all-sim mean
    field; the exact finite rank of the low-multipole band is reported, the
    stochastic versus fixed-template injection laws are distinguished, and the
    cross-fit release-simulation pooled-rank (binding PR-135) is the closed
    diagnostic.  Because the upstream raw-QE inputs are absent, the raw-QE
    inference is a no-go
    (ABANDON_CURRENT_DATASET_FOR_NATIVE_LOW_L_SKY_POWER) and only the
    release-simulation diagnostic is closed; no L=2..10 sky-power limit is
    computed from absent raw-QE inputs, and released convergence plus an injected
    signal is NEVER called a pre-QE transfer.  ACT-release-simulation diagnostic
    at C3 only; no ACT kappa detection, anisotropy, geometry, or Bianchi-family
    claim.  The two CF4 P0s are untouched and stay OPEN.
  domain: act_dr6_lensing_low_ell_crossfit
  frame: binds_pr135_finite_null_act_dr6_lensing_release
  claim_level_scheme: roadmap_rescue_v1
  claim_level: C3

