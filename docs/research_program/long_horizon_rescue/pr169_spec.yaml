claim_identity:
  claim_id: C-PR169-UNSIGNED-LEAKAGE-AND-WITNESS-STATUS
  claim_text: >-
    On the declared PR-126/127 comparator carrier, x_C=0 neither forces the
    unsigned component size to vanish nor supplies a B-independent upper
    bound. Under a preregistered rational component cap B>0 the exact
    full-carrier ceiling is M_max(B)=4B, and the shear-vorticity slice ceiling
    is 2B. These elementary algebraic fixtures are not physical cosmological
    models. Promotion to a constructive witness requires an exact-model bridge
    and complete physical-admissibility receipts. Nilsson et al.'s W_N^2 is
    normalized Weyl curvature, not the repository vorticity V^2; therefore
    that paper cannot supply the missing bridge by symbol substitution. If the
    physical gates remain incomplete, the registered terminal result is
    algebraic_only.
  domain: declared_pr126_pr127_comparator_carrier_only
  approximation_order: exact_rational_algebra
  novelty: project_identity_application_not_new_theorem

symbol_contract:
  Sigma2: sigma_ab sigma^ab/(6 H^2)
  V2:
    definition: omega_ab omega^ab/(6 H^2)
    legacy_repository_label: W2
    type: normalized_vorticity_squared
  W_N2:
    definition: (E_ab E^ab + H_ab H^ab)/(6 H^4)
    source: Nilsson_et_al_1999_equation_1
    type: normalized_weyl_curvature_squared
  Omega_tilt: nonnegative_comparator_tilt_sector
  DeltaOmega_k: signed_anisotropic_curvature_comparator_sector
  forbidden_identification: W_N2_equals_V2

registered_objects:
  scalar_domain: >-
    B, Sigma2, V2, Omega_tilt, and DeltaOmega_k range over the exact ordered
    field Q; B>0. Absolute value is the ordinary rational absolute value.
    Every maximum statement below is universally quantified over this domain.
  signed_comparator: x_C = Sigma2 - V2 + Omega_tilt + DeltaOmega_k
  unsigned_size: M_unsigned = Sigma2 + V2 + Omega_tilt + abs(DeltaOmega_k)
  capped_carrier: >-
    B>0; 0<=Sigma2,V2,Omega_tilt<=B; abs(DeltaOmega_k)<=B; x_C=0
  full_ceiling:
    statement: M_max(B)=4B
    saturating_fixture: {Sigma2: B, V2: B, Omega_tilt: B, DeltaOmega_k: -B}
  shear_vorticity_slice:
    constraints: {Omega_tilt: 0, DeltaOmega_k: 0}
    statement: M_slice_max(B)=2B
    saturating_fixture: {Sigma2: B, V2: B, Omega_tilt: 0, DeltaOmega_k: 0}
  exact_fixture:
    B: 3/10
    full: {Sigma2: 3/10, V2: 3/10, Omega_tilt: 3/10, DeltaOmega_k: -3/10}
    slice: {Sigma2: 3/10, V2: 3/10, Omega_tilt: 0, DeltaOmega_k: 0}
    expected: {x_C: '0', M_full: 6/5, M_slice: 3/5}
  uncapped_family:
    quantifier: for every rational a>0
    point: {Sigma2: a, V2: a, Omega_tilt: 0, DeltaOmega_k: 0}
    expected: {x_C: '0', M_unsigned: 2a}
    conclusion: x_C_zero_supplies_no_B_independent_unsigned_bound

physical_promotion_gate:
  required_receipts:
    - exact_model_and_source_provenance_map
    - hamiltonian_constraint
    - momentum_constraint
    - gauss_constraint
    - vorticity_tilt_compatibility
    - matter_positivity_and_domain
  upstream_limit: >-
    PR-127 A_C_comparator_level checks an exact parent identity, a bounded
    carrier, and matter positivity, while explicitly deferring momentum and
    Gauss fixtures. It is not a full physical certificate.
  nilsson_bridge_status: unavailable_symbol_type_mismatch
  pass_label: constructive_constraint_and_admissibility_conditional
  fail_or_missing_label: algebraic_only
  receipt_status_vocabulary: [PASS, FAIL, MISSING]
  coherence_key_fields:
    - model_id
    - model_version
    - witness_id
    - state_hash
    - convention_hash
    - source_hashes
    - pr169_contract_hash
  bundle_rules:
    - every required receipt is present exactly once and has status PASS
    - every receipt has one identical coherence key
    - comparator-level evidence cannot satisfy a full physical receipt
    - mixed-model, mixed-state, stale, duplicate, or self-asserted receipts fail
    - missing or failed receipt forces algebraic_only after exact CAS success
    - CAS failure, conflict, or blockage yields no scientific result
  complete_gate_ids:
    - PHYS-G1-CONVENTIONS
    - PHYS-G2-EXACT-MODEL-MAP
    - PHYS-G3-CONSTRAINT-CLOSURE
    - PHYS-G4-VORTICITY-TILT-COMPATIBILITY
    - PHYS-G5-MATTER-DOMAIN
    - PHYS-G6-DYNAMICAL-EXISTENCE
    - PHYS-G7-COMPARATOR-SATURATION
    - PHYS-G8-PROVENANCE-AND-INDEPENDENCE

preregistered_falsifiers:
  algebraic:
    - any required four-axis identity or bound fails
    - the registered fixtures do not satisfy x_C=0 and the exact ceilings
    - clipping the signed DeltaOmega_k leaves the full witness invariant
  physical_promotion:
    - any required physical receipt is missing or fails
    - an asserted exact-model bridge maps Nilsson W_N2 directly to V2
    - source provenance does not define the claimed physical variable
  claim_gate:
    - x_C_approximately_zero_is_described_as_an_FLRW_or_EGS_certificate
    - algebraic_only_is_described_as_a_constructive_cosmological_model
    - a comparator result is promoted to family identification

negative_controls:
  - id: sign_mutation
    mutation: replace -V2 with +V2
    expected: the shear-vorticity slice fixture no longer has x_C=0
  - id: signed_axis_projection
    mutation: clip DeltaOmega_k=-B to zero
    expected: the full fixture no longer has x_C=0 and its unsigned size changes
  - id: symbol_conflation
    mutation: substitute Nilsson W_N2 for repository V2
    expected: reject before algebra because the typed provenance map is absent
  - id: missing_physical_receipt
    mutation: promote comparator-level parent identity to physical admissibility
    expected: reject and retain algebraic_only

cas_contract:
  schema: htt.cas_contract.v2
  required_axes: [wolfram_xact, sympy_high_precision, sage_singular, lean_mathlib]
  result_blinding: required_until_adjudication
  missing_axis_outcome: CAS_BLOCKED
  exceptions: none
  aggregate_states:
    - CAS_4AXIS_PASS
    - CAS_PASS_WITH_REGISTERED_EXCEPTION
    - CAS_CONFLICT
    - CAS_BLOCKED
    - CAS_FAIL

source_provenance:
  path: docs/research_program/long_horizon_rescue/pr169_primary_source_provenance.yaml
  sha256: 978437e011346c396a2ad3b4f924f91d1c21afa89529576377c0f6f86530f668
  rule: >-
    Exact algebra and the external-model bridge are adjudicated separately;
    cross-engine agreement cannot repair a missing physical provenance map.

candidate_branch_supersession:
  authoritative_card_policy: >-
    The immutable PR-167 intake card records a proposed constructive
    Nilsson-class branch and an explicit algebraic_only kill switch. Primary-
    source review activates that kill switch for this attempt. A hash-bound
    supersession receipt must classify the constructive wording as a falsified
    candidate, without rewriting the PR-167 intake snapshot.
  required_artifact: docs/generated/pr169_candidate_branch_supersession.json

terminal_routing:
  process_gate_status: [PASS, FAIL, BLOCKED]
  scientific_result:
    - constructive_constraint_and_admissibility_conditional
    - algebraic_only
    - none
  precedence:
    - when: CAS_BLOCKED or CAS_CONFLICT
      process_gate_status: BLOCKED
      scientific_result: none
    - when: CAS_FAIL or invalid_contract or artifact_gate_fail or consumer_gate_fail
      process_gate_status: FAIL
      scientific_result: none
    - when: CAS_4AXIS_PASS and any physical receipt is FAIL or MISSING
      process_gate_status: PASS
      scientific_result: algebraic_only
    - when: CAS_4AXIS_PASS and every physical receipt is coherent PASS
      process_gate_status: PASS
      scientific_result: constructive_constraint_and_admissibility_conditional

all_consumer_scan:
  target: active repository consumers of x_C and the legacy W2 sector label
  forbidden_active_inference:
    - x_C_zero_implies_FLRW
    - x_C_small_certifies_almost_EGS
    - Nilsson_Weyl_is_repository_vorticity
  historical_or_explicitly_refuted_mentions: allowed_with_context

acceptance:
  - conventions, domain, target identities, and falsifiers are frozen before axis execution
  - four blind axes use one hash-bound schema-v2 contract
  - all exact algebraic obligations agree or the aggregate fails closed
  - the uncapped rational a-family is proved universally, not inferred from one fixture
  - the typed source audit rejects the Nilsson Weyl-to-vorticity substitution
  - physical promotion remains algebraic_only unless every required receipt passes
  - all-consumer scan is emitted and actionable claim drift is removed or blocks promotion
  - generated results and manifest reproduce byte-for-byte under write/check

forbidden_output_language:
  - x_C=0 proves isotropy
  - x_C approximately zero certifies FLRW
  - Nilsson-class physical witness
  - Bianchi geometry detected
  - Bianchi family identified
  - validated as native

terminal_outcomes:
  constructive: all exact and physical-promotion gates pass
  algebraic_only: exact algebra passes but any physical-promotion gate is missing or fails
  cas_blocked: any required engine is unavailable
  cas_conflict: required axes disagree after canonical normalization
  cas_fail: an exact identity, bound, fixture, or negative control fails
