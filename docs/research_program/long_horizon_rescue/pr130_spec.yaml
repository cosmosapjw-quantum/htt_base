    - "≈ sufficient"
    - 'is sufficient for'
    - 'Rao-Blackwell'
    - 'no information beyond'
    - 'exactly sufficient'
    - 'complete statistic'
  rule: >-
    active PR-130 and NT2-A2 narrative surfaces must never attach
    sufficiency language to a finite multipole set; the legacy module
    is excluded from the scan because it is byte-frozen and its defect
    is recorded in the invalidation table instead.

