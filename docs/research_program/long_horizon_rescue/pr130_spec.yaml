mutation_registry:
  - mutation_id: sufficiency_language
    kill_rule: a caption asserting a finite multipole set is sufficient fails the real language lint
  - mutation_id: rao_blackwell_from_small_tail
    kill_rule: a sufficiency claim based on a small tail fraction without a registered factorization reference is rejected by the sufficiency gate
  - mutation_id: zero_tail_claim
    kill_rule: a claimed zero tail at finite L is refuted by the exact positive Fraction lower bound
  - mutation_id: wrong_zeta_constant
    kill_rule: a tampered closed-form constant injected through the preregistered closed_form_shift point is rejected by the PRODUCTION enclosure comparison inside three_engine_enclosure
  - mutation_id: divergent_profile_smuggling
    kill_rule: presenting the p = 1 profile as convergent is rejected by the domain validator
  - mutation_id: truncation_error_understated
    kill_rule: a claimed truncation error below the certified lower bracket at the same L is rejected by the bracket check

