acceptance_and_kill_switches:
  - the p = 3/2 closed form, the exact Fraction partial sum with rigorous remainder bracket, and the mpmath/sympy engines agree (three-engine enclosure)
  - the tail is strictly positive at every probed finite L with an exact rational lower bound
  - the domain validator rejects p <= 1 and the sensitivity table spans the registered p values
  - the sufficiency gate rejects every sufficiency claim (empty factorization registry)
  - the legacy module byte-pin verifies and its superseded lines are recorded unedited
  - every registered mutation executes and is killed
  - all 102 remediation findings remain OPEN

forbidden_output_language:
