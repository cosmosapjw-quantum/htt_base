  finding_count: 102
  required_scientific_status_counts: {OPEN: 102}
  rescued_count: 0

data_scope:
  pr4_data_work: skip_entirely_by_user_scope
  pr4_commands_run_required: 0

response_registration:
  module: htt/src/common/nt2_tail_convergence.py
  response_family: 'r_l = (2/l)^p for l >= 2 (r_2 = 1 for every p)'
  fisher_term: 't_l = ((2l+1)/2) * f_sky * (2/l)^(2p)'
  registered_profile_p: '3/2'
  registered_f_sky: '1'
  convergence_domain: 'p > 1 (t_l ~ 2^(2p) l^(1-2p); p = 1 harmonic-divergent, excluded)'
  closed_form_p_three_halves: >-
    I_inf = f_sky (8 (zeta(2)-1) + 4 (zeta(3)-1)); tail T(L) = f_sky
    (8 (zeta(2) - H_L^(2)) + 4 (zeta(3) - H_L^(3)))
  two_sided_bracket_p_three_halves: >-
    f_sky (8/(L+1) + 2/(L+1)^2) < T(L) < f_sky (8/L + 2/L^2)
  positivity: T(L) > 0 exactly for every finite L (all terms positive)

precision_contract:
  exact_partial_sum_engine: fractions.Fraction exact rational partial sums
  arbitrary_precision_engine: mpmath zeta at 60 significant digits
  symbolic_engine: sympy zeta closed-form identity
  partial_sum_L: 10000
  enclosure_rule: >-
    exact Fraction partial sum plus the rigorous two-sided integral
    remainder bracket must enclose the mpmath closed-form value; the
    sympy symbolic identity must simplify to zero exactly. Disagreement
    of any engine pair -> no claim.

sufficiency_gate:
  factorization_registry: 'EMPTY — no model-family factorization theorem is registered'
  rule: >-
    any claim asserting sufficiency/Rao-Blackwell/no-information-beyond
    for a finite multipole set is rejected unless it carries a
    registered factorization proof reference; the registry is empty, so
    every such claim is rejected. A small tail fraction or an L = 80
    plateau is never an accepted basis.
  permanent_exit_rule: >-
    the tail is strictly positive at every finite L on the registered
    family, so the exact-sufficiency claim is PERMANENTLY forbidden per
    the roadmap exit condition; only truncation error and convergence
    rate may be reported.

