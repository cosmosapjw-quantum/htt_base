claim_identity:
  claim_id: C-PR130-NT2-TAIL
  claim_text: >-
    For the REGISTERED toy response r_l = (2/l)^p on the ideal full-sky
    Gaussian low-l likelihood, the marginal Fisher tail beyond any
    finite L has the exact closed form T(L) = f_sky [2^(2p)
    (zeta(2p-1) - H_L^(2p-1)) + 2^(2p-1) (zeta(2p) - H_L^(2p))],
    convergent on the domain p > 1 ONLY, STRICTLY POSITIVE at every
    finite L, with two-sided elementary bracket of order L^(2-2p).
    Because the tail never vanishes and no model-family factorization
    theorem is registered, EXACT SUFFICIENCY OF ANY FINITE MULTIPOLE
    SET IS PERMANENTLY FORBIDDEN on this response family; only
    truncation error and convergence rate are reported. The legacy
    octupole-sufficiency wording is superseded, not relabeled in place
    (the legacy module stays byte-frozen). Toy/transfer-conditional
    convergence theorem only — the toy response is never an observed
    low-ell information claim.
  domain: registered_toy_response_ideal_gaussian_low_ell_likelihood_only
  frame: binds_pr125_registered_contracts_frame_free_statistics
  claim_level_scheme: roadmap_rescue_v1
  claim_level: C1

