claim_identity:
  claim_id: C-PR132-OMK-REMAINDER
  claim_text: >-
    On the compact declared domain |K| <= 1/10, w in [0, 1/2] (BOTH
    2-plane branches), the PR-131 slaved-mode prediction Sigma =
    kappa K + c2 K^2 carries the RIGOROUS forward-invariant remainder
    bound |Sigma - (kappa K + c2 K^2)| <= M |K|^3 with M = 1, proven
    UNIFORMLY by exact-Fraction interval arithmetic with conclusive
    branch-and-bound on the trapping-region boundary sign conditions —
    never by finite grid sampling. The remainder propagates to every
    downstream ceiling/forecast as an EXPLICIT uncertainty component,
    never absorbed into the central coefficient, with
    numerical-enclosure, source-convention, physical-model-form, and
    in-house-conservative-rule uncertainties kept as SEPARATE typed
    components (the same separation applied to MES comparison
    consumers, comparison-only, nothing promoted). The domain API
    refuses evaluation outside the compact domain; post-hoc expansion
    is refused; a domain shrink mints a new version. An admissible
    state escaping the enclosure blocks the claim immediately.
    Class-conditional asymptotic theorem with explicit remainder at
    fixed q0(w) only.
  domain: compact_omk_domain_v1_abs_k_le_1_over_10_w_in_0_to_half_both_branches
  frame: expansion_normalized_orthonormal_lrs_frame_pr125_registered
  claim_level_scheme: roadmap_rescue_v1
  claim_level: C2

scope_and_non_goals:
  finite_grid_sampling_called_uniform_proof: forbidden
  remainder_absorbed_into_central_coefficient: forbidden
  posthoc_domain_expansion_to_fit_observed_values: forbidden
  component_collapse_into_single_number: forbidden
  mes_promotion_or_observational_claim: forbidden
  remediation_disposition_change: forbidden

remediation_state_contract:
  path: docs/codex_handoff/research_remediation_state.yaml
  sha256: f16d9754828bb32ae4cef92f585af82ae7fd1caa2687a7b4144bc1e942328dd9
  finding_count: 102
