  rescued_count: 0

data_scope:
  pr4_data_work: skip_entirely_by_user_scope
  pr4_commands_run_required: 0

compact_domain:
  module: htt/src/common/omk_remainder_certificate.py
  version: omk_domain_v1
  w_box: ['0', '1/2']
  k_abs_max: '1/10'
  branches: both
  api_rule: >-
    enclose/evaluate refuse any state outside the compact domain
    (fail-closed); a proposed domain that is not a subset of
    omk_domain_v1 is refused as post-hoc expansion; a shrink mints a
    new version string and never silently replaces v1.

trapping_certificate:
  statement: >-
    the tube |Sigma - (kappa K + c2 K^2)| <= M |K|^3 is forward
    invariant for the registered reduced flow WHILE |K| stays in the
    compact domain (both branches): on each Sigma-boundary curve the
    field points inward, so a trajectory can leave only through the
    |K| = k_abs_max faces. No bound is claimed once |K| exits the
    domain (|K| grows on both branches).
  numeric_corroboration: >-
    independently confirmed by direct mpmath integration (40 dps) of
    boundary-seeded trajectories on both branches, both w endpoints,
    both sides: every trajectory stays inside the tube until |K| exits
    the domain. This corroborates but does not replace the exact
    interval proof.
  M_exact: '1'
  proof_method: >-
    boundary sign conditions reduced to exact rational polynomials
    (denominators 2(3w+5)^6(9w+7)^3 proven positive on the box; the
    lowest K-power factored exactly), then proven UNIFORMLY by
    monomial-wise exact-Fraction interval bounds with conclusive
    branch-and-bound bisection (max depth 14; an inconclusive result
    fails closed — grid sampling is never accepted as proof).
  transient_note: >-
    the certificate bounds trajectories seeded inside the trap; the
    PR-131 slaved trajectories (linear seed, K0 = 1e-8) are verified
    in-trap at every recorded FD probe via the cross-artifact check.

uncertainty_components:
  separation_rule: >-
    four typed components, never collapsed into a single number and
    never folded into the central value — numerical_enclosure
    (M |K|^3 remainder + engine enclosure widths),
    source_convention (registered PR-125 convention channel deltas,
    labeled), physical_model_form (single-fluid fixed-w class
    assumption, carried as UNQUANTIFIED_CONDITIONAL, never numeric
    zero), inhouse_conservative_rule (the margin between M and the
    envelope-sizing |c3|, labeled in-house choice).
  central_value_rule: >-
    the central value is EXACTLY kappa K + c2 K^2; any report whose
    central value differs from the bare two-term prediction has
    absorbed remainder and is rejected.
  downstream_rule: >-
    ceiling/forecast propagation maps the full enclosure interval
    (never the central value alone) with components preserved; MES
    consumers receive the same separation as comparison-only rows.

boundary_adversarial_states:
  in_trap: corners of the compact domain on both boundary curves (8 states) must be accepted by the enclosure
  out_of_trap: states just outside the trap at the same (K, w) must trigger the immediate claim block
  cross_artifact: every PR-131 FD probe state (docs/generated/pr131_fd_plateau.json) must lie inside the trap

negative_scan:
  targets:
    - htt/src/common/omk_remainder_certificate.py
    - docs/generated/pr132_captions.json
  forbidden_patterns:
    - 'uniform by sampling'
    - 'grid-verified proof'
    - 'absorbed into the central'
    - 'single combined uncertainty'
    - 'observed curvature'
  rule: >-
    active PR-132 surfaces must never present sampling as uniform
    proof, absorb remainder, collapse components, or carry
    observational readings.

mutation_registry:
  - mutation_id: grid_sampling_as_uniform_proof
    kill_rule: a certificate whose proof method is finite grid evaluation is rejected by the certificate validator
  - mutation_id: remainder_absorbed_into_central
    kill_rule: a report whose central value differs from the bare kappa K + c2 K^2 prediction is rejected by the central-value rule
  - mutation_id: posthoc_domain_expansion
    kill_rule: evaluation outside the compact domain raises, and a proposed superset domain is refused as expansion
  - mutation_id: enclosure_escape_claim_block
    kill_rule: an admissible in-domain state outside the trap triggers the immediate claim block
  - mutation_id: component_collapse
    kill_rule: a budget collapsed to one number without the four typed components is rejected by the separation validator
  - mutation_id: wrong_trap_constant
    kill_rule: M = 1/100 (below the envelope-sizing |c3|) makes the boundary sign proof fail with a concrete rational counterexample found by the SAME production prover

artifact_contract:
  outputs:
    - docs/generated/pr132_trapping_certificate.json
    - docs/generated/pr132_domain_api.json
    - docs/generated/pr132_uncertainty_budget.json
    - docs/generated/pr132_boundary_states.json
    - docs/generated/pr132_captions.json
    - docs/generated/pr132_mutation_report.json
    - docs/generated/pr132_artifact_manifest.json
  check_policy: fresh_build_must_equal_disk_bytes

acceptance_and_kill_switches:
  - the boundary sign conditions are proven conclusively on BOTH branches by the exact interval prover (inconclusive -> fail closed)
  - every PR-131 FD probe state lies inside the trap (cross-artifact)
  - the 8 boundary states are accepted and the out-of-trap states trigger the claim block
  - the four uncertainty components stay separate through propagation and the central value equals the bare prediction
  - the domain API refuses out-of-domain evaluation and superset registration
  - every registered mutation executes and is killed
  - all 102 remediation findings remain OPEN

forbidden_output_language:
  - uniform by sampling
  - grid-verified proof
  - absorbed into the central
  - single combined uncertainty
  - observed curvature
  - shear detected
  - isotropy established
  - Bianchi geometry detected
  - Bianchi family identified
  - finding rescued
  - validated as native
