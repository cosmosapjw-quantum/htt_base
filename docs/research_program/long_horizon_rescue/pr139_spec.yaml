data_scope:
  pr4_data_work: skip_entirely_by_user_scope
  pr4_commands_run_required: 0

model:
  module: htt/src/common/dependency_holdout.py
  family: >-
    conjugate Gaussian group random-intercept regression: y_g = X_g beta
    + 1 b_g + eps_g, b_g ~ N(0, tau_b2), eps_g ~ N(0, sig2 I), prior
    beta ~ N(0, tau2 I); marginal group covariance V_g = sig2 I +
    tau_b2 J; the conjugate GLS posterior and the group-joint predictive
    are closed form.
  sig2: '1'
  prior_tau2: '10'
  intercept: '3/10'
  signal_config:
    role: exact ELPD + PSIS-vs-exact verification (a well-identified model)
    n_groups: 20
    rows_per_group: 3
    n_candidate_features: 8
    n_true_features: 3
    beta_true: ['3/2', '-1', '4/5']
    tau_b2: '1/2'
    data_seed: 20260722
  leakage_config:
    role: selection-leakage optimism (null signal, many noise features)
    n_groups: 8
    rows_per_group: 4
    n_candidate_features: 30
    n_true_features: 0
    beta_true: []
    tau_b2: '3/10'
    data_seed: 20260722
  dependency_config:
    role: group-joint vs row-level holdout optimism (large group effect)
    n_groups: 12
    rows_per_group: 5
    n_candidate_features: 3
    n_true_features: 3
    beta_true: ['3/2', '-1', '4/5']
    tau_b2: '2'
    data_seed: 20260722

folds:
  unit_kind: group
  exchangeable_unit: >-
    an entire group (its rows share the random intercept b_g and are not
    exchangeable at the row level); the fold set is the 20 groups.
  loo_not_identified_case: >-
    a single cluster spanning all 60 rows has no held-out exchangeable
    unit; the status is LOO_not_identified.

psis:
  reference: Vehtari et al. 2015 (arXiv:1507.02646); gpdfit per Zhang-Stephens 2009 / arviz
  n_posterior_draws: 4000
  seed: 20260723
  pareto_k_threshold: '0.7'
  elpd_agreement_tol: '0.5'
  rule: >-
    draw beta from the full-data conjugate posterior; for each held-out
    group the importance ratio is 1 / p(y_group | beta); Pareto-smooth the
    ratios and report the fitted shape k. The per-group PSIS ELPD must
    agree with the exact group-refit ELPD within the tolerance and every
    Pareto k must fall below 0.7; otherwise the exact refit is required.

leakage:
  select_k: 3
  rule: >-
    train-only feature selection ranks the candidate features by absolute
    correlation with y on the TRAINING rows of each fold; leaky selection
    ranks on ALL rows (including the held-out group). Leaky selection and
    leaky standardization are DEMONSTRATED to inflate the held-out ELPD
    above the train-only value (optimism), and a transform provenance that
    used full data is refused by the train-only guard.

dependency_optimism:
  rule: >-
    the honest per-observation held-out log predictive density removes a
    whole group; row-level holdout that retains a held-out row's group-
    mates leaks the shared random intercept and is DEMONSTRATED to be
    optimistic (a higher per-observation lpd). A declared fold that splits
    a true dependency cluster is refused.

negative_scan:
  targets:
    - htt/src/common/dependency_holdout.py
    - docs/generated/pr139_captions.json
  forbidden_patterns:
    - 'channel ablation is the loo'
    - 'evidence difference is the loo'
    - 'dependent rows as independent units'
    - 'standardized on the full data'
    - 'selected features on the full data'
  rule: >-
    active PR-139 surfaces must never call a channel ablation or an
    evidence difference a LOO score, use dependent rows as independent
    units, or preprocess on the full data.

mutation_registry:
  - mutation_id: dependent_rows_as_loo_unit
    kill_rule: declaring row-level folds that split a group dependency cluster is rejected by the dependency-respect guard
  - mutation_id: selection_leakage
    kill_rule: a feature-selection provenance computed on the full data is rejected by the train-only guard
  - mutation_id: standardize_leakage
    kill_rule: a standardization provenance computed on the full data is rejected by the train-only guard
  - mutation_id: psis_used_when_unreliable
    kill_rule: reporting a PSIS ELPD whose Pareto k exceeds 0.7 without the exact fallback is rejected by the reliability guard
  - mutation_id: ablation_labeled_loo
    kill_rule: labeling a channel-ablation or full-vs-fold evidence difference a LOO/ELPD score is rejected by the score-kind guard
  - mutation_id: loo_on_single_cluster
    kill_rule: computing LOO on a dependency graph with no exchangeable unit raises LOO_not_identified

artifact_contract:
  outputs:
    - docs/generated/pr139_elpd_report.json
    - docs/generated/pr139_psis_report.json
    - docs/generated/pr139_leakage_report.json
    - docs/generated/pr139_dependency_report.json
    - docs/generated/pr139_captions.json
    - docs/generated/pr139_mutation_report.json
    - docs/generated/pr139_artifact_manifest.json
  check_policy: fresh_build_must_equal_disk_bytes

acceptance_and_kill_switches:
  - the exact group-refit ELPD is computed on the 20 group folds with train-only transforms
  - the PSIS ELPD agrees with the exact refit within tolerance and every Pareto k is below 0.7
  - leaky selection and leaky standardization are demonstrated to inflate the held-out ELPD
  - row-level holdout on the dependent data is demonstrated to be optimistic and the fold-split is refused
  - a single-cluster graph yields LOO_not_identified
  - every registered mutation executes and is killed
  - all 102 remediation findings remain OPEN

forbidden_output_language:
  - channel ablation is the loo
  - evidence difference is the loo
  - dependent rows as independent units
  - standardized on the full data
  - selected features on the full data
  - shear detected
  - isotropy established
  - Bianchi geometry detected
  - Bianchi family identified
  - finding rescued
  - validated as native
