claim_identity:
  claim_id: C-PR139-HOLDOUT
  claim_text: >-
    Held-out predictive comparison is computed on VALID exchangeable
    units taken from an explicit dependency graph (observation / group /
    survey / depth). Every preprocessing step — standardization, the
    nuisance fit, and axis/feature selection — is re-run on the TRAINING
    partition of each fold ONLY; the held-out unit never enters any
    transform, and the train-only transform is content-addressed per
    fold. The held-out score is the JOINT log predictive density of the
    held-out unit's rows (a multivariate density, because rows that share
    a group are correlated), summed over folds (a dependency-bound ELPD,
    Vehtari-Gelman-Gabry 2017, arXiv:1507.04544). The PSIS approximation
    (Vehtari et al. 2015, arXiv:1507.02646) is verified against the exact
    per-fold refit: if any Pareto k exceeds 0.7, or the approximate and
    exact ELPD disagree beyond tolerance, PSIS is refused and the exact
    refit is required. A channel ablation or a full-versus-fold evidence
    difference is NEVER labeled a LOO / ELPD score, and a dependent row
    used as an independent LOO unit (splitting a dependency cluster) is
    refused. When no valid exchangeable unit exists (a single all-
    encompassing cluster), the status is LOO_not_identified and no
    predictive-comparison claim is made. Dependency-qualified held-out
    predictive-score mechanics only — no detection.
  domain: gaussian_group_random_intercept_toy_only
  frame: binds_pr134_estimand_pr138_lineage
  claim_level_scheme: roadmap_rescue_v1
  claim_level: C2

