    - observed_support.abacus.declared_authenticated
    - observed_support.audit_registry.declared_members
    - transfer_state.part_files.count
    - transfer_state.part_files.total_stat_bytes
    - transfer_state.log.age_seconds
    - observed_support.last_authenticated_records
    - transfer_state.manifest.failure
    - disk.free_gib
    - terminal.pr151_terminal
  stall_rule: two_probes_at_least_900_seconds_apart_with_zero_log_and_part_growth

