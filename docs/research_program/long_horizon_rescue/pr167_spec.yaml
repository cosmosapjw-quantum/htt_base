claim_amendments:
  PR-167: >-
    Preserve every canonical PR-000--166 card (expected count 113) and reject
    any missing, extra, semantically changed, or unregistered logical-state
    migration; PR-151 foreground-to-background is the sole permitted migration.
  PR-168: >-
    B_accel deletion is permitted only after blind four-axis agreement on the
    registered spectral-degeneracy identity; otherwise production code is unchanged.
  PR-169: >-
    A witness is constructive only after constraint and physical-admissibility
    gates pass; otherwise the terminal result is algebraic_only.
  PR-170: >-
    The Buchert/two-patch result is an externally attributed conditional
    identity and witness, never a new theorem.
  PR-171: >-
    Stability is class-conditional. A persistent-tilt counterexample retires
    the no-go claim, and no numerical suppression conclusion is frozen in advance.
  PR-173: >-
    A headline inside its certified finite-ensemble resolution is numerically
    unresolved at the current Monte Carlo budget, not estimator noise.
  PR-176: >-
    The divergence channel is structurally distinct from monopole leakage; it
    is not described as immune. Before PR-155, only conservative dependence-bound
    channel falsifiers are allowed, with non_informative as a valid terminal result.
  PR-177: >-
    The result is an ACT-release-simulation-conditional modulation candidate or
    null over 40<L<763 using exactly 400 public release simulations. It is not
    a detection and is not a raw-QE reproduction.
  PR-179: >-
    The result is a selection/systematics-conditional raw-catalogue directional
    statistic with a matched null, not cosmological anisotropy.
  PR-180: >-
    The Planck compact/E2E-null result tests consistency with a pure boost; it
    does not confirm a pure boost. Deterministic subtraction does not restore
    statistical independence; any such statement needs a separate registered
    cross-covariance or conditional-independence test.
  PR-174: >-
    This is SW-only internal mechanics with no likelihood or production
    consumer. It is not a native/external transfer or Boltzmann solution.
  PR-175: >-
    Invariant mechanics and external-anchor agreement do not rank or identify
    a Bianchi family and require four-axis validation if execution is authorized.
  PR-178: >-
    The estimator is reconstruction-free but not covariance- or null-free.
    Inferential shell ranks and joint covariance require terminal authenticated
    PR-151 matched support; otherwise the output is descriptive only.
  PR-182: >-
    The solver-free parity theorem registers only a future native-atlas test
    vector. No present data sign comparison may rank, identify, or adjudicate a family.
  PR-183: >-
    Before authenticated PR-159--161 receipts, only an interface schema and a
    separately owned observer-side feature extractor are allowed. No proxy may
    activate or substitute the unavailable native prediction.

