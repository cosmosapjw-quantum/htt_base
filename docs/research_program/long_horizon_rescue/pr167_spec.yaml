  - A hypothesis-only or needs-native card may not enter the ordinary automatic queue.
  - Intake is not scientific rescue, external replication, native-transfer validation,
    Bianchi family identification, or evidence for a geometry.
  - Partial PR-151 mocks may not enter a calibrated rank or significance.

