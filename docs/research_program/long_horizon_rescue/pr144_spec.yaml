claim_identity:
  claim_id: C-PR144-CF4-MANIFEST
  claim_text: >-
    The authenticated Cosmicflows-4 dataset identity is pinned to the exact
    release (Tully et al. 2023, ApJ 944, 94; VizieR J/ApJ/944/94), and every
    group-level column of table3.dat and table4.dat is bound to its
    byte range, format, units, producer, and a TYPE classification
    (identifier / position-observable / velocity-observable /
    distance-indicator / frame-derived / cosmology-corrected /
    reconstruction / cartesian-derived). The group ID (1PGC) parity across
    table3 and table4 is verified, the tables are content-addressed at the
    file and per-row level, and the selection/completeness (per-method
    observation counts) and duplicate/missing structure are recorded. A
    peculiar-velocity RECONSTRUCTION column (Vpds, Vpwf, Vpec) is never
    selected as the true flow, an audit-only replacement value is never
    promoted to an observed measurement, and a column whose authority is
    not in the registry is refused rather than used by name. This is
    dataset / estimand provenance only — no cosmological measurement, no
    detection. The two CF4 P0s stay OPEN; PR-144 supplies the data lineage
    they require, it does not resolve them.
  domain: cosmicflows4_group_catalogue_authenticated
  frame: binds_pr120_cf4_quarantine_pr134_estimand_pr143_adjudication
  claim_level_scheme: roadmap_rescue_v1
  claim_level: C1

scope_and_non_goals:
  reconstruction_as_true_flow: forbidden
  audit_value_as_observed_replacement: forbidden
  ambiguous_authority_column_by_name: forbidden
  cf4_p0_resolution_claim: forbidden
  remediation_disposition_change: forbidden

data_scope:
  cf4_data_work: authorized_by_user_2026_07_18
  pr4_npipe: excluded_by_user_scope
  raw_data_path: workdir/raw/cf4_full
  raw_data_policy: read_only_external_manifest_versioned_only

remediation_state_contract:
  path: docs/codex_handoff/research_remediation_state.yaml
  sha256: f16d9754828bb32ae4cef92f585af82ae7fd1caa2687a7b4144bc1e942328dd9
  finding_count: 102
  required_scientific_status_counts: {OPEN: 102}
  rescued_count: 0

dataset:
  module: htt/src/common/cf4_manifest.py
  catalogue: J/ApJ/944/94
  reference: Tully et al. 2023, ApJ 944, 94
  release: Cosmicflows-4
  velocity_frame: V3k (cosmic microwave background frame)
  tables:
    table3:
      path: workdir/raw/cf4_full/table3.dat
      record_length: 190
      n_records: 38053
      content: group weighted-average distance moduli per methodology
    table4:
      path: workdir/raw/cf4_full/table4.dat
      record_length: 157
      n_records: 38053
      content: group distances and peculiar velocities
  readme: workdir/raw/cf4_full/ReadMe

column_types:
  identifier: [1PGC]
  position_observable: [RAdeg, DEdeg, GLON, GLAT, SGL, SGB]
  velocity_observable: [Vh]
  frame_derived: [Vls, V3k]
  cosmology_corrected: [fV3k, Hi, logHi]
  distance_indicator: [DMzp, DMav, DMcal, DMsnIa, DMfp, DMtf, DMsbfo, DMsbfi, DMsnII, Dist]
  reconstruction: [Vpds, Vpwf, Vpec]
  cartesian_derived: [SGX, SGY, SGZ]
  units_caveat:
    SGX_SGY_SGZ: >-
      labelled Mpc in the ReadMe but expressed in OBSERVED VELOCITY UNITS
      (cz, km/s) per the rev-r196 latent-bug finding; never used as a Mpc
      length without the cz conversion.

anti_drift_guards:
  reconstruction_columns: [Vpds, Vpwf, Vpec]
  audit_only_value_km_s: 94
  rule: >-
    the peculiar-velocity reconstructions are estimator-dependent and are
    never the true flow; the audit-only sensitivity value (94, velocity units) is never an observed
    replacement; a column not in the authority registry is refused.

fixtures:
  ra_range: [0.0, 360.0]
  dec_range: [-90.0, 90.0]
  glat_range: [-90.0, 90.0]
  dist_positive: true
  rule: >-
    coordinate and distance ranges are validated against the ReadMe bounds;
    a row outside the documented range is flagged.

negative_scan:
  targets:
    - htt/src/common/cf4_manifest.py
    - docs/generated/pr144_captions.json
  forbidden_patterns:
    - 'vpec is the true flow'
    - 'audit value observed replacement'
    - 'cf4 p0 resolved'
    - 'reconstruction is the observed velocity'
    - 'sgx is a mpc length'
  rule: >-
    active PR-144 surfaces must never call a reconstruction the true flow,
    promote the audit value, claim the CF4 P0s resolved, or treat SGX/SGY/SGZ
    as Mpc lengths.

mutation_registry:
  - mutation_id: reconstruction_as_true_flow
    kill_rule: selecting Vpds/Vpwf/Vpec as the true flow is rejected by the reconstruction guard
  - mutation_id: audit_value_as_observed
    kill_rule: promoting the audit-only sensitivity value (94) to an observed replacement is rejected
  - mutation_id: ambiguous_authority_column
    kill_rule: using a column absent from the authority registry by name is rejected
  - mutation_id: id_parity_broken
    kill_rule: a table3/table4 1PGC set mismatch is rejected by the parity check
  - mutation_id: row_count_drift
    kill_rule: a record count that differs from the pinned 38053 is rejected
  - mutation_id: cartesian_as_mpc_length
    kill_rule: treating SGX/SGY/SGZ as a Mpc length without the cz conversion is rejected
  - mutation_id: cf4_p0_resolution
    kill_rule: claiming the CF4 P0s resolved by the manifest is rejected by the provenance-only guard

artifact_contract:
  outputs:
    - docs/generated/pr144_cf4_manifest.json
    - docs/generated/pr144_column_authority.json
    - docs/generated/pr144_selection_completeness.json
    - docs/generated/pr144_captions.json
    - docs/generated/pr144_mutation_report.json
    - docs/generated/pr144_artifact_manifest.json
  check_policy: fresh_build_must_equal_disk_bytes

acceptance_and_kill_switches:
  - the CF4 release identity and both tables are pinned and content-addressed
  - every group column is bound to a byte range, units, producer, and a type
  - the table3/table4 1PGC parity holds and the row count is 38053
  - the selection/completeness and duplicate/missing structure are recorded
  - a reconstruction as true flow, the audit value as observed, and an ambiguous column are refused
  - every registered mutation executes and is killed
  - all 102 remediation findings remain OPEN

forbidden_output_language:
  - vpec is the true flow
  - audit value observed replacement
  - cf4 p0 resolved
  - reconstruction is the observed velocity
  - sgx is a mpc length
  - shear detected
  - isotropy established
  - Bianchi geometry detected
  - Bianchi family identified
  - finding rescued
  - validated as native
