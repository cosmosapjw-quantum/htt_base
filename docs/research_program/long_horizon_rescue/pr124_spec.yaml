# ---------------------------------------------------------------------------
# 1. Legacy theorem-registry quarantine + typed successor
# ---------------------------------------------------------------------------
theorem_signature_contract:
  legacy_registry:
    path: docs/research_program/THEOREM_REGISTRY.yaml
    sha256: 266374abc05b179cf32e12020ced0624643f525cd42f8fcead05c9542c74f315
    disposition: byte_stable_reproduction_only
    frozen_consumers_allowed:
      - scripts/theorem_registry_v9_lib.py
      - scripts/build_egs_results_table_v9.py
      - scripts/build_external_audit_report_v9.py
      - scripts/build_open_items_ledger.py
      - tests/contracts/test_theorem_registry_v9.py
  successor_registry:
    path: docs/research_program/THEOREM_SIGNATURES_V2.yaml
    schema: htt.theorem_registry.v2
    loader: htt/src/common/theorem_signatures.py
    every_legacy_id_mapped_exactly_once: true
    legacy_status_must_match: true
  evidence_grades:
    - published_proof
    - independent_derivation
    - checked_derivation
    - numerical_test
    - sanity_anchor
    - specification
  counting_rule: >-
    counts_toward_theorem_count is true only for entries whose signature is
    CHECKED (typed quantified variables, hypotheses, frame, order, domain)
    AND whose evidence grade is one of published_proof,
    independent_derivation, checked_derivation AND whose legacy status is
    ACTIVE or ACTIVE_CONDITIONAL. sanity_anchor, specification, and
    numerical_test entries never count toward the theorem count, and
    re-evaluations of the same expression never add derivation counts.
  all_parameter_prose_rule: generated_only_from_CHECKED_signatures_else_raise
  old_overstatement_negative_test: >-
    the raw legacy entry count (65) used as a theorem count must FAIL the
    v2 counting rule; the honest count is strictly smaller and excludes
    SUPERSEDED/RETRACTED/WITHHELD/PLANNED entries, sanity anchors, and
    specifications.

# ---------------------------------------------------------------------------
# 2. Four-axis CAS contract (computational reproducibility metric)
# ---------------------------------------------------------------------------
cas_contract:
  contract_id: CAS-PR124-MES-GEODESIC-001
  contract_path: docs/generated/pr124_cas/CAS_CONTRACT_PR124_MES_GEODESIC.json
  statement_class: scalar_algebra
  gate_tool: .agent-harness/scripts/cas_gate.py
  aggregate_required: CAS_4AXIS_PASS
  axes_required: [wolfram_xact, sympy, sage_singular, lean]
  no_majority_vote: true
  engine_agreement_is_not_derivation_independence: true
  exact_statement: >-
    With raw MESa bound terms sigma: [(8/3,L2,d0),(1,L2,d1),(5,L1,d1),
    (9/7,L3,d1)] and omega: [(9,L1,d1),(3,L1,d2),(6/5,L2,d2)], and the C1/C2
    reduction factor (1/3)^d per total derivative order d, the reduced
    coefficient triples over (e1,e2,e3) are exactly sigma=(5/3,3,3/7) and
    omega=(10/3,2/15,0); the geodesic congruence has no acceleration bound
    (A^2=0); B_sigma>B_omega iff e1 < e1_crit = (43/25)e2+(9/35)e3; at the
    registered eps (e1=0, e2=3559629/10^12, e3=6065291/10^12) the ceilings
    are exactly W2_max=(3/2)B_omega^2=4223652872547/12500000000000000000000000
    and Sigma2_max=(3/2)B_sigma^2=6479509460609043/24500000000000000000000000,
    the hierarchy at e1=0 is strict, and at the observed dipole
    e1=771/625000 the hierarchy fails (full-dipole ceiling inadmissible).
  expected_exact_values:
    sigma_triple: ['5/3', '3', '3/7']
    omega_triple: ['10/3', '2/15', '0']
    accel_triple: ['0', '0', '0']
    e1_crit_coefficients: ['43/25', '9/35']
    eps_registered: {e1: '0', e2: '3559629/1000000000000', e3: '6065291/1000000000000'}
    e1_observed: '771/625000'
    B_sigma_exact: '46474041/3500000000000'
    B_omega_exact: '1186543/2500000000000'
    W2_max_exact: '4223652872547/12500000000000000000000000'
    Sigma2_max_exact: '6479509460609043/24500000000000000000000000'
  axis_scripts:
    wolfram_xact: wolfram/pr124_mes_geodesic_axis.wls
    sympy: htt/src/common/pr124_sympy_axis.py
    sage_singular: sage/pr124_mes_geodesic_axis.sage
    lean: formal_pr124/Pr124Mes.lean
  axis_independence_rule: >-
    each axis implements the C1/C2 reduction and the exact evaluations in
    its own engine from the contract-registered raw data; no axis consumes
    another axis's intermediate expressions, generated code, or results
    before adjudication. Shared inputs are the published raw-bound
    transcription (the statement under test), which is the contract, not a
    shared derivation.

# ---------------------------------------------------------------------------
# 3. Derivation-lineage oracle (derivation independence metric)
# ---------------------------------------------------------------------------
lineage_contract:
  lineage_kinds:
    - published_paper
    - external_citing_source
    - in_repo_reduction
  independence_rule: >-
    two lineages are independent only when their derivation artifacts differ
    in origin (different publication, or an in-repo reduction performed from
    the raw published bounds rather than copied from the reduced published
    values). Evaluating one implementation, AST, or generated expression on
    a second engine NEVER adds a lineage. Numeric spot checks are never
    proofs and never lineages.
  inflation_exclusion_key: implementation_fingerprint
  minimum_lineages_for_verified_branch: 2
  branch_requirements:
    MES_G_SIGMA:
      required_min: 2
      registered:
        - lineage_id: mesa_published_eq59
          kind: published_paper
          source: arXiv:astro-ph/9501016 (PRD 51, 1525), eq (59)
        - lineage_id: in_repo_c1c2_reduction_from_eq51
          kind: in_repo_reduction
          source: htt/obsstat/egs3_mes_rederivation.py (raw eq 51 -> C1/C2)
    MES_G_OMEGA:
      required_min: 2
      registered:
        - lineage_id: mesa_published_eq60
          kind: published_paper
          source: arXiv:astro-ph/9501016 (PRD 51, 1525), eq (60)
        - lineage_id: sag1997_published_eq4
          kind: external_citing_source
          source: arXiv:astro-ph/9904346 (ApJ 476, 435), eq (4)
        - lineage_id: in_repo_c1c2_reduction_from_eq52
          kind: in_repo_reduction
          source: htt/obsstat/egs3_mes_rederivation.py (raw eq 52 -> C1/C2)
    MES_G_ACCEL:
      required_min: 2
      registered:
        - lineage_id: mesa_geodesic_assumption
          kind: published_paper
          source: arXiv:astro-ph/9501016 (PRD 51, 1525), p.123 geodesic flow
        - lineage_id: sag1997_geodesic_assumption_set
          kind: external_citing_source
          source: arXiv:astro-ph/9904346 (ApJ 476, 435), assumption set (no acceleration bound)
      note: >-
        a structural ABSENCE claim has no raw bound to reduce, so only
        distinct publications count; in-repo restatements re-citing the same
        origin never add a lineage. SAG 1997 is Stoeger-coauthored
        (correlated authorship disclosed).
    MES_NG_OMEGA:
      required_min: 2
      registered:
        - lineage_id: mesb_print_only
          kind: published_paper
          source: PRD 51, 5942 (print-only; not accessible)
      expected_status: UNVERIFIED_PRINT_ONLY_INSUFFICIENT_LINEAGES
    MES_NG_ACCEL:
      required_min: 2
      registered:
        - lineage_id: mesb_print_only
          kind: published_paper
          source: PRD 51, 5942 (print-only; not accessible)
      expected_status: UNVERIFIED_PRINT_ONLY_INSUFFICIENT_LINEAGES

