acceptance_and_kill_switches:
  - all four axis results PASS under one contract hash and the adjudication is CAS_4AXIS_PASS (a single axis blocked or conflicted blocks the branch; three axes never pass)
  - zero sign/coefficient/domain disagreements between engines
  - every registered mutation executes and is killed; any survivor blocks its surface
  - the stale-triple scan over active consumers returns zero findings
  - the geodesic branches carry at least two real independent derivation lineages; MES_NG branches remain UNVERIFIED_PRINT_ONLY and are never promoted
  - the Rust D2 target executed nonzero with recorded hashes and counts; the Python anchor suite passed bit-identical
  - the old overstatement (65-entry theorem count) fails the v2 counting rule
  - the legacy registry byte-hash is unchanged and frozen modules are byte-identical
  - all 102 remediation findings remain OPEN; no disposition changes
  - PR4 commands_run equals zero and no PR4 input or derived artifact exists

forbidden_output_language:
  - four-axis pass therefore theorem true in nature
  - MES non-geodesic coefficients verified
  - D2 bit-identical anchor reproduced by this receipt
  - engine agreement establishes derivation independence
  - observed anisotropy constrained
  - Bianchi geometry detected
  - Bianchi family identified
  - remediation finding rescued
  - finding rescued
  - validated as native
