# ---------------------------------------------------------------------------
# 5. D2 dual-track authority
# ---------------------------------------------------------------------------
d2_authority_contract:
  requirement: >-
    the D2 authority row requires a Python-side anchor receipt and a Rust
    target receipt with separated origin equations and derivation streams
    (Rust MB-95 CAMB-convention synchronous gauge, Ma-Bertschinger 1995
    lineage vs Python PSTF 1+3 covariant Ellis-van Elst lineage), each with
    source/input/output/toolchain hashes and actually collected/executed
    counts; the Rust target must execute to a NONZERO D_2 in this cycle.
  rust_target:
    command: cargo test --release --lib solver::sync_gauge_camb::test_dl_200k -- --exact --nocapture
    source_path: src/solver/sync_gauge_camb.rs
    source_sha256: e031d3b20e0e1c521945e939dfdd7850c6c694728d4c9903a598e0a275cbeaf2
    cargo_manifest_sha256: edefba17d7d7f7565a381bbe65f9de359dce5704d49786669526802c336a58ed
    transcript_path: docs/audits/pr124_d2_authority/rust_test_dl_200k_20260717.log
    nonzero_required: true
  python_anchor:
    test_path: htt/bass/validation/test_d2_regression_anchor.py
    test_sha256: a435eebd2344ea2f32b7f0b4e90ed298a2e9555528c7355056bb97e211094d66
    golden_path: htt/bass/validation/_d2_anchor_golden.json
    golden_sha256: 4ba806602992b6d9be07586e46f0bd2cd621bdc4ff0389e8ac49a4b02cd0233d
    bit_identical_required: true
  documented_anchor_gap: >-
    the bit-identical production anchor D_2 = 1002.086744 uK^2 is enforced by
    the bass_rs dump_dl_spectrum_sparse configuration, which is not present
    as an executable binary in this repository; the executed Rust receipt in
    this PR uses the in-tree production-path test configuration
    (test_dl_200k: lmax_g=16, n_k=200) and records its own nonzero D_2. The
    receipt claims execution of the MB-95 production path, not bit-identical
    reproduction of the 1002.086744 anchor. Claiming the latter from this
    receipt is forbidden.
  pstf_python_closure_status: xfail_open_PR-024c_recorded_not_executed_here

# ---------------------------------------------------------------------------
# 6. Mutation registry (all preregistered; every mutant must be killed)
# ---------------------------------------------------------------------------
mutation_registry:
  - mutation_id: stale_triple_reintroduction
    defect: reintroduce_legacy_non_geodesic_triple_as_active_consumer_value
    kill_rule: static scanner flags the synthetic consumer carrying (3/4, 2, 2/7) as STALE_MES_TRIPLE; clean twin without the literal passes
  - mutation_id: branch_swap
    defect: present_geodesic_coefficients_under_the_non_geodesic_branch_or_swap_statuses
    kill_rule: authority validator rejects any branch whose congruence/status/coefficient binding differs from the registered exact table
  - mutation_id: source_count_inflation
    defect: count_the_same_reduction_implementation_twice_under_two_engine_names
    kill_rule: lineage counter collapses identical implementation_fingerprints; a claimed count exceeding the collapsed count is rejected
  - mutation_id: zero_d2_receipt
    defect: accept_a_d2_receipt_with_zero_or_missing_executed_value
    kill_rule: d2 receipt validator rejects D_2 == 0, missing execution counts, or missing transcript hash binding
  - mutation_id: sign_flip_reduction
    defect: reduction_factor_sign_flip_to_minus_one_third_per_order
    kill_rule: the REAL validator (validate_branch_entry) rejects a branch entry carrying the sign-corrupted omega triple
  - mutation_id: unit_w2_normalization
    defect: ceiling_map_uses_one_half_b_squared_instead_of_three_halves_b_squared
    kill_rule: the REAL validator (validate_ceiling_map, run by the authority verification on the adjudicated values) rejects the (1/2)B^2 ceiling
  - mutation_id: limit_eps1_domain
    defect: hierarchy_admissibility_accepts_e1_equal_or_above_e1_crit
    kill_rule: the REAL validator (validate_hierarchy_strict, run by the authority verification on the contract witnesses) raises at exactly e1 = e1_crit
  - mutation_id: overstatement_theorem_count
    defect: count_all_65_legacy_entries_as_proven_theorems
    kill_rule: v2 counting rule excludes SUPERSEDED/RETRACTED/WITHHELD/PLANNED, sanity anchors, specifications, numerical tests, and unchecked signatures; the mutant count 65 must exceed the honest count and be rejected

