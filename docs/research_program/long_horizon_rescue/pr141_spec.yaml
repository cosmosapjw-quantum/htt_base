claim_identity:
  claim_id: C-PR141-MIXTURE
  claim_text: >-
    Four EXPLICIT competitors are registered as a fixed model list —
    isotropy (null), a local kinematic boost (dipole), a survey /
    calibration systematic (a known template), and a shared global
    anisotropy (quadrupole). For any data the framework computes the exact
    conjugate-Gaussian evidence of each model, an identifiability / rank
    check on the competing templates, an out-of-sample predictive gain
    over the null, a posterior-predictive adequacy check, and the evidence
    sensitivity across a prior-scale grid. The ONLY admissible non-null
    result is a local/global discrimination CANDIDATE when a non-null
    model is decisively favored AND identified AND adequate AND predicts
    held-out data better than the null AND is not prior-sensitive;
    otherwise the mandatory result is abstain / non_identified. Residuals
    are never all absorbed into the global component; a MIO score is never
    a likelihood factor; the deterministic (fixed-amplitude, profile)
    branch is compared separately and never conflated with the covariance
    (marginalized) evidence; changing the model list or the contamination
    prior after the outcome requires a NEW registered family and updated
    look-elsewhere multiplicity; and a positive global result is never the
    objective. A discrimination candidate is not a geometry, a family, or
    a detection.
  domain: synthetic_four_hypothesis_linear_gaussian_toy_only
  frame: binds_pr133_response_pr136_identified_pr138_ppc_pr139_holdout_pr140_evidence
  claim_level_scheme: roadmap_rescue_v1
  claim_level: C3

scope_and_non_goals:
  residual_absorption_into_global: forbidden
  mio_score_as_likelihood: forbidden
  deterministic_branch_as_evidence: forbidden
  posthoc_model_list_change_without_multiplicity: forbidden
  detection_when_abstention_required: forbidden
  positive_global_as_objective: forbidden
  remediation_disposition_change: forbidden

remediation_state_contract:
  path: docs/codex_handoff/research_remediation_state.yaml
  sha256: f16d9754828bb32ae4cef92f585af82ae7fd1caa2687a7b4144bc1e942328dd9
  finding_count: 102
  required_scientific_status_counts: {OPEN: 102}
  rescued_count: 0

data_scope:
  pr4_data_work: skip_entirely_by_user_scope
  pr4_commands_run_required: 0

model:
  module: htt/src/common/mixture_competition.py
  competitors: [iso, local, sys, global]
  family: >-
    linear-Gaussian competitors on fixed sky templates: iso = intercept
    only; local = intercept + dipole (n . e_dip); sys = intercept +
    systematic template; global = intercept + quadrupole
    ((n . e_quad)^2 - 1/3). Each amplitude has a normalized Gaussian prior
    N(0, tau2); the exact marginal evidence is N(y; 0, sig2 I + tau2 X X^T).
  n_obs: 60
  sig2: '1'
  tau2: '4'
  template_seed: 7
  data_seed: 100

decision:
  gain_margin_log_bf: '3'
  identifiability_gap: '2'
  collinearity_threshold: '9/10'
  ppc_reject: '1/100'
  prior_swing_ceiling: '6'
  tau2_grid: ['1', '4', '16']
  held_out_gain_floor: '0'
  combination_margin: '5'
  n_folds: 5
  seed: 5
  rule: >-
    a discrimination candidate requires best_non_iso log BF over iso >=
    the look-elsewhere-adjusted margin (gain_margin + log(number of
    non-null competitors)), an identifiability gap between the top-two
    non-null models governed by the EVIDENCE GAP (not template
    collinearity), NO material combined-model gain (the data must not want
    more than one component), a positive out-of-sample gain over the null,
    an adequate posterior-predictive check, and a prior swing within the
    ceiling; any failure is a mandatory abstention with its typed reason.
    Identifiability is governed by the evidence gap so that an
    orthogonal-template local/global near-tie ALSO abstains; template
    collinearity is reported as the mechanism when present but is never a
    NECESSARY condition.

regimes:
  clean: {collinear: false, amplitude: '2'}
  confused: {collinear: true, amplitude: '2'}
  weak: {collinear: false, amplitude: '1/5'}
  expected: >-
    clean recovers local/sys/global and abstains on iso (no gain); confused
    abstains non_identified on the collinear local/sys pair and recovers
    global; weak abstains everywhere (no predictive gain).

abstention_demos:
  inadequate:
    true_branch: global
    amplitude: '2'
    n_outliers: 6
    outlier_scale: '8'
    seed: 100
    rule: >-
      a global signal with heavy outlier contamination the linear model
      cannot fit fails the posterior-predictive check (p < ppc_reject) and
      yields abstain_inadequate even though the model is favored and gains.
  prior_sensitive:
    true_branch: global
    amplitude: '9/10'
    tau2_grid: ['1/20', '4', '400']
    prior_swing_ceiling: '2'
    gain_margin_log_bf: '1'
    ppc_reject: '1/1000'
    held_out_gain_floor: '-1'
    seed: 101
    rule: >-
      a marginal global signal evaluated over a wide prior-scale grid
      swings the log BF beyond the ceiling and yields
      abstain_prior_sensitive.
  superposed:
    dipole_amplitude: '2'
    quad_amplitude: '3'
    seed: 102
    rule: >-
      a genuine two-component (local + global) superposition — a signal
      OUTSIDE the single-component competitor list — is DEMONSTRATED to
      abstain non_identified because the combined (local + global) model
      materially beats the best single model, so attribution to one branch
      is not identified. This directly guards the module's headline
      local/global discrimination on orthogonal templates (the collinearity
      condition never fires there; the evidence-gap and combined-model
      gates do).

deterministic_vs_covariance:
  rule: >-
    the deterministic (profile / MLE-amplitude) log-likelihood of the
    largest model always exceeds the null's, whereas the covariance
    (marginalized) evidence penalizes the extra parameter under a weak
    signal; the two branches are reported separately and the deterministic
    branch is never used for model comparison.

negative_scan:
  targets:
    - htt/src/common/mixture_competition.py
    - docs/generated/pr141_captions.json
  forbidden_patterns:
    - 'global anisotropy detected'
    - 'bianchi geometry identified'
    - 'residuals absorbed into global'
    - 'mio score as likelihood'
    - 'positive global is the objective'
  rule: >-
    active PR-141 surfaces must never claim a global-anisotropy detection,
    a Bianchi geometry, residual absorption, a MIO score as likelihood, or
    a positive global objective.

mutation_registry:
  - mutation_id: residual_absorption
    kill_rule: absorbing all residuals into the global component is rejected by the residual-absorption guard
  - mutation_id: mio_score_as_likelihood
    kill_rule: using a MIO / reporting score as a likelihood factor is rejected by the likelihood-factor guard
  - mutation_id: posthoc_model_change
    kill_rule: changing the model list after the outcome without a new family and multiplicity is rejected
  - mutation_id: detection_when_abstention_required
    kill_rule: asserting a discrimination candidate on an abstaining decision is rejected by require_not_detection
  - mutation_id: deterministic_as_evidence
    kill_rule: using the deterministic profile branch for model comparison is rejected by the branch guard
  - mutation_id: unregistered_model_before_outcome
    kill_rule: a model list that departs from the fixed pre-registered set before the outcome is rejected

artifact_contract:
  outputs:
    - docs/generated/pr141_confusion_matrix.json
    - docs/generated/pr141_abstention_demos.json
    - docs/generated/pr141_branch_comparison.json
    - docs/generated/pr141_captions.json
    - docs/generated/pr141_mutation_report.json
    - docs/generated/pr141_artifact_manifest.json
  check_policy: fresh_build_must_equal_disk_bytes

acceptance_and_kill_switches:
  - the confusion matrix recovers the true branch only in the clean/identified regimes and abstains otherwise
  - the confused regime abstains non_identified on the collinear local/sys pair
  - the weak regime abstains everywhere (no predictive gain)
  - the inadequate and prior-sensitive demos exercise those two abstention gates
  - the deterministic and covariance branches are reported separately and never conflated
  - every registered mutation executes and is killed
  - all 102 remediation findings remain OPEN

forbidden_output_language:
  - global anisotropy detected
  - bianchi geometry identified
  - residuals absorbed into global
  - mio score as likelihood
  - positive global is the objective
  - shear detected
  - isotropy established
  - Bianchi family identified
  - finding rescued
  - validated as native
