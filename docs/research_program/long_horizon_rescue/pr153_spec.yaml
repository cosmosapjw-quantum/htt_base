claim_identity:
  claim_id: C-PR153-JWST-ANCHOR
  claim_text: >-
    A row-complete manifest of the cited JWST distance anchors (Freedman et al.
    2025/2024 CCHP TRGB/JAGB + Riess et al. 2024 SH0ES Cepheids) carrying, per
    anchor, the source DOI/URL, the seed retrieval hash, the object/host name,
    the J2000 coordinate evidence, the published distance-modulus precision, the
    method/calibration group and the deterministic transform. Each anchor is
    linked to the real CF4 group catalogue by a PROBABILISTIC identity match
    (positional-uncertainty-weighted, never a coordinate radius alone) with an
    explicit ambiguity and duplicate policy; the linkage is exercised by an
    independent row replay, a crossmatch tolerance sensitivity, a leave-one-match
    report and a label-substitution negative test. Because the authoritative
    machine-readable data table (Freedman CCHP MRT) is NOT reproducible (HTTP
    404; only the arXiv abstract pages of the other two sources are fetched), the
    anchor rows are CITED-SEED, not authoritative-table-reproduced, so per the
    kill rule the JWST lane stays a cited-seed catalogue-linkage scenario and no
    CF4-conditioned precision or global-tilt forecast is authorized while
    N-DATA-CF4-DOWNSTREAM is OPEN. The synthetic 14-anchor fixture is NEVER
    renamed observed JWST data, and identity is NEVER confirmed from a coordinate
    radius alone. Catalogue-linkage DIAGNOSTIC at C1 only; no measurement,
    forecast, detection, or Bianchi-family claim. The two CF4 P0s are untouched.
  domain: jwst_distance_anchor_cf4_linkage
  frame: binds_pr122_transfer_pr134_estimand_real_cf4_groups
  claim_level_scheme: roadmap_rescue_v1
  claim_level: C1

scope_and_non_goals:
  identity_from_coordinate_radius_alone: forbidden
  synthetic_fixture_renamed_observed: forbidden
  authoritative_reproduction_claimed_without_table: forbidden
  cf4_conditioned_forecast_while_downstream_open: forbidden
  jwst_measurement_or_detection_claim: forbidden

