acceptance_and_kill_switches:
  - the row-complete manifest carries source DOI, retrieval hash, coordinate evidence, published uncertainty, method/calibration group and deterministic transform per anchor
  - the identity match is probabilistic with an ambiguity and duplicate policy, never a coordinate radius alone
  - the linkage is exercised by an independent row replay, a tolerance sensitivity, a leave-one-match report and a label-substitution negative test
  - the authoritative machine-readable table is not reproducible so the JWST lane stays a cited-seed scenario and no CF4-conditioned forecast is authorized
  - every registered mutation executes and is killed
  - all 102 remediation findings remain OPEN

forbidden_output_language:
  - identity from coordinate radius alone
  - synthetic fixture renamed observed
  - authoritative reproduction without
  - cf4-conditioned forecast
  - jwst measurement
  - bianchi family from jwst
  - Bianchi geometry detected
  - Bianchi family identified
  - finding rescued
  - validated as native
