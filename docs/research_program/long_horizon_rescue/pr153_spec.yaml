    - htt/obsstat/jwst_anchor_manifest.py
    - docs/generated/pr153_captions.json
  forbidden_patterns:
    - 'identity from coordinate radius alone'
    - 'synthetic fixture renamed observed'
    - 'authoritative reproduction without'
    - 'cf4-conditioned forecast'
    - 'jwst measurement'
    - 'bianchi family from jwst'
  rule: >-
    active PR-153 surfaces must never confirm identity from a coordinate radius
    alone, rename the synthetic fixture observed, claim authoritative reproduction
    without the table, run a CF4-conditioned forecast, or claim a JWST measurement
    or Bianchi family.

artifact_contract:
