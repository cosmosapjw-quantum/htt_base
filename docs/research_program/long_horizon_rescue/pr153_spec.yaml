    kill_rule: confirming an anchor identity from a coordinate radius alone is rejected
  - mutation_id: synthetic_renamed_observed
    kill_rule: renaming the synthetic fixture observed JWST data is rejected
  - mutation_id: authoritative_reproduction_without_table
    kill_rule: claiming authoritative-table reproduction without the machine-readable table is rejected
  - mutation_id: cf4_forecast_while_downstream_open
    kill_rule: a CF4-conditioned precision forecast while N-DATA-CF4-DOWNSTREAM is OPEN is rejected
  - mutation_id: jwst_measurement_claim
    kill_rule: a JWST-level measurement or detection claim is rejected
  - mutation_id: bianchi_family_from_jwst
    kill_rule: a Bianchi-family claim from the JWST anchors is rejected

negative_scan:
