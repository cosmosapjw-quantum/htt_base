acceptance_and_kill_switches:
  - all four registered author-source members, exact numerical cell markers, CSV bytes and exact-cell receipts are verified before a numerical result is emitted
  - the CCHP and SH0ES host offsets carry intervals, p-values and leave-one-host sensitivity
  - inverse-variance pooling is explicitly sensitivity-only because shared-anchor covariance is unavailable
  - expanded source-reported aggregates are replayed but not treated as host-level refits or pooled
  - host/SN/object count units are explicit and checked against the registered per-source contract
  - every finite probability remains nonzero after serialization
  - every generated artifact carries the full provenance covariance null generation and worktree metadata contract
  - the identity match remains probabilistic with ambiguity and duplicate policies
  - no H0 fit or CF4-conditioned forecast is authorized
  - every registered mutation executes and is killed
  - all 102 remediation findings remain OPEN

forbidden_output_language:
