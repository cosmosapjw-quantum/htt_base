claim_identity:
  claim_id: C-PR153-JWST-ANCHOR
  claim_text: >-
    Content-verified author-submitted arXiv LaTeX tables provide seven unique
    CCHP hosts with paired JAGB/TRGB moduli and thirteen SH0ES hosts with paired
    JWST/HST Cepheid moduli. The lane reports host-level mean offsets, Student-t
    intervals, sign tests, leave-one-host sensitivity and a preregistered
    5*log10(73/67.5) magnitude-shift comparison. Two additional sources expand
    coverage through their published aggregate results: 8 paired hosts in the
    Li et al. 2024 JWST-TRGB/HST-Cepheid comparison and 20 paired objects within
    the complete 35-SN TRGB compilation in Li et al. 2025. These aggregates are
    replayed with normal-reference statistics and are not represented as new
    host-level fits or pooled across overlapping samples. Host is the sampling unit for
    the primary sampling unit; its Student-t interval is conditional on treating
    host deltas as independent and excludes shared-anchor/common-systematic
    uncertainty. Inverse-variance pooling is sensitivity-only because the compact
    source tables do not publish the full shared-anchor covariance. A separate
    row-complete coordinate manifest remains linked to
    CF4 through a probabilistic positional match with ambiguity, duplicate,
    replay and label-substitution checks. This is a published-table-conditional
    distance-method consistency result at C2; it is not an H0 fit, a
    CF4-conditioned precision forecast, a detection, or a Bianchi-family claim.
  domain: jwst_host_distance_method_consistency
  frame: published_table_paired_host_comparison_plus_supporting_cf4_linkage
  claim_level_scheme: roadmap_rescue_v1
  claim_level: C2

