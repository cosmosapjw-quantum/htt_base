objective:
  estimand: not_applicable_governance
  target_population: active_pr_dag_and_remediation_records
  domain: PR-119_through_PR-166_only
  summary: >-
    Atomically intake the 48-card pre-native rescue slice while preserving the
    completed 65-card legacy DAG, then implement fail-closed contracts that keep
    orchestration state, execution resolution, and scientific status independent.

claim_identity:
  claim_id: GOV-PR119-DAG-INTAKE
  claim_text: >-
    PR-119 through PR-166 are intaken as governance records while the completed
    PR-000 through PR-118 baseline and authoritative rescued count of zero are
    preserved.
  quantifier: exactly_48_cards_once_each
  estimand: not_applicable_governance
  target_population: active_pr_dag_and_remediation_records
  domain: PR-119_through_PR-166_only
  frame: not_applicable
  perturbative_order: not_applicable
  units: not_applicable
  data_release: not_applicable
  sky_support_mask_selection: not_applicable
  statistic_pipeline: codex_dag_intake_and_remediation_state_machine
  transfer_source: none
  nuisance_prior_null_multiplicity: not_applicable
  claim_level_scheme: not_applicable_governance_v1
  claim_level: NOT_APPLICABLE
  claim_tier_ceiling: exploratory
  canonicalization: sorted_compact_json_utf8_v1
  identity_fingerprint: b5bf554526fe36a264888926478627e0a94f5b00cdfd92627c9c3ebef82da57e

source_authority:
  canonical_authoring_root: docs/codex_handoff/pr_backlog.yaml
  generated_yaml_byte_mirrors:
    - machine_readable/pr_backlog.yaml
  generated_json_semantic_mirrors:
    - docs/codex_handoff/pr_backlog.json
    - machine_readable/pr_backlog.json
  canonical_status_root: docs/codex_handoff/pr_status.yaml
  generated_status_mirror: machine_readable/pr_status.yaml
  historical_audit_policy: >-
    The PR-118 audit package and MANIFEST remain immutable historical evidence.
    Its input hashes are verified against the commit that sealed the MANIFEST,
    never against mutable live DAG inputs and never by regenerating the package.

intake_transaction:
  legacy_slice:
    expected_count: 65
    ids: PR-000_through_active_PR-118_set
    completed_count_before: 65
    mutation_allowed: false
  new_slice:
    expected_count: 48
    first_id: PR-119
    last_id: PR-166
    initial_orchestration_state: PENDING
    initial_scientific_status: OPEN
    hidden_completed_forbidden: true
  forbidden_slice:
    first_id: PR-167
    last_id: PR-183
    reason: PR-167 owns the separate advocate-track intake.
  closeout_state:
    total_prs: 113
    completed_prs: 66
    completed_new_ids:
      - PR-119
    pending_new_ids: PR-120_through_PR-158
    dormant_external_ids: PR-159_through_PR-166
    expected_unblocked_next:
      - PR-120
      - PR-121
    next_checkpoint_completed_count: 70

state_contract:
  orchestration_state:
    values:
      - PENDING
      - IN_PROGRESS
      - TERMINAL
      - DORMANT_EXTERNAL
    meaning: repository_workflow_only
  execution_resolution:
    nullable_until_terminal: true
    values:
      - COMPLETED_SUCCESS
      - COMPLETED_FAILED_WITH_RECEIPT
      - BLOCKED_WITH_RECEIPT
      - ABANDONED_WITH_RECEIPT
    meaning: terminal_process_outcome_only
  scientific_status:
    initial: OPEN
    values:
      - OPEN
      - IN_REMEDIATION
      - EVIDENCE_READY
      - ADJUDICATION_PENDING
      - RESCUED
      - CORRECTED_SUPERSEDED
      - FALSIFIED
      - BLOCKED
      - ABANDONED
    prohibited_inferences:
      - orchestration_completed_implies_evidence_ready
      - tests_passed_implies_validated
      - terminal_negative_implies_scientific_success
      - backlog_intake_implies_in_remediation
      - native_transfer_label_implies_authenticated_native_delivery
  initial_authoritative_census:
    root_record_count: 102
    known_open_and_audit_gap_count: 69
    new_open_count: 33
    rescued_count: 0
    response_dispositions_are_scientific_statuses: false

claim_level_contract:
  canonical_claim_tier:
    values:
      - exploratory
      - conditional
      - diagnostic_only
      - validated
      - blocked
    ordered: false
  family_gate_ladder:
    scheme: family_gate_v1
    values: [C0, C1, C2, C3, C4, C5, C6]
  roadmap_planning_ladder:
    scheme: roadmap_rescue_v1
    values: [C0, C1, C2, C3, C4, C5, C6]
  policy:
    - A bare C-level without its scheme is invalid in active remediation records.
    - Cross-scheme comparison or automatic mapping is forbidden.
    - Governance cards use NOT_APPLICABLE for family/scientific claim level.
    - Finding-ID prefixes such as C1-K5 are immutable identity text, not claim-level values.

new_card_schema:
  required_fields:
    - id
    - wave
    - title
    - owner
    - contributors
    - adjudicator_role
    - implementation_scopes
    - depends
    - dependency_contracts
    - targets
    - files
    - tests
    - dod
    - kill
    - cost
    - claim_tier_ceiling
    - claim_level
    - forbidden
    - anti_drift
    - roadmap_anchor
  allowed_active_owners:
    - COMMON
    - HTT
    - MIO
    - BASS
    - OBSSTAT
  forbidden_active_owners:
    - TSC
    - TSC_LEGACY
    - TEFF
    - MANUSCRIPT
    - BASS_PY
  legacy_compatibility_note: >-
    Existing TEFF/TSC artifacts may remain readable only through legacy
    TSC_LEGACY/tsc_legacy aliases or explicit historical quarantine. No
    PR-119..166 card or remediation receipt may assign TEFF or TSC_LEGACY active
    science ownership.

dependency_contract:
  graph_projection_field: depends
  typed_edge_field: dependency_contracts
  exact_projection_match_required: true
  default_mode: requires_success
  modes:
    requires_success:
      accepts: [COMPLETED_SUCCESS]
      scientific_input_allowed: false
      scientific_consumption_requires: requires_adjudicated_claim_set
    requires_terminal_receipt:
      accepts:
        - COMPLETED_SUCCESS
        - COMPLETED_FAILED_WITH_RECEIPT
        - BLOCKED_WITH_RECEIPT
        - ABANDONED_WITH_RECEIPT
      scientific_input_allowed: false
      allowed_use: adjudication_aggregation_only
    requires_authenticated_external_receipt:
      accepts: [verified_external_delivery_receipt]
      scientific_input_allowed: false
      missing_state: DORMANT_EXTERNAL
    requires_adjudicated_claim_set:
      accepts: [authorized_non_author_adjudication]
      scientific_input_allowed: accepted_claim_subset_only
      negative_results_must_not_be_imputed_as_success: true

authority_registry_contract:
  canonical_path: docs/codex_handoff/authorized_principals.yaml
  generated_mirror_path: machine_readable/authorized_principals.yaml
  default_deny: true
  required_principal_fields:
    - principal_id
    - identity_fingerprint
    - aliases
    - allowed_roles
    - allowed_scopes
    - independence_class
    - valid_from
    - valid_until
    - revoked
    - verifier
  author_adjudicator_check:
    compare_canonical_identity_after_alias_resolution: true
    string_inequality_only_forbidden: true
  pr119_bootstrap_policy:
    scientific_promotion_principals: []
    maximum_status_without_verifiable_attestation: ADJUDICATION_PENDING
    internal_subagents_are_external_replication: false

public_interfaces:
  - name: remediation_state_contract
    path: htt/src/common/remediation_state.py
    purpose: typed states, identity hashing, principal resolution, transition validation
  - name: strict_long_horizon_dag_validation
    path: scripts/codex_harness/validate_pr_dag.py
    purpose: v3 card schema, typed dependencies, frozen legacy slice, dormant native slice
  - name: mirror_sync_check
    path: scripts/codex_harness/sync_pr_dag_mirrors.py
    purpose: deterministic YAML/status byte parity and YAML-to-JSON semantic parity
  - name: remediation_intake_validator
    path: scripts/codex_harness/validate_research_remediation.py
    purpose: active finding root, authority registry, transition and reconciliation checks
  - name: typed_progress_resolution
    path: scripts/codex_harness/progress_report.py
    purpose: terminal-receipt and dormant-external dependency handling without science promotion

planned_artifacts:
  - docs/codex_handoff/authorized_principals.yaml
  - machine_readable/authorized_principals.yaml
  - docs/codex_handoff/research_remediation_state.yaml
  - machine_readable/research_remediation_state.yaml
  - docs/research_program/long_horizon_rescue/pr119_intake_reconciliation.json
  - docs/research_program/long_horizon_rescue/pr119_proposal_crosswalk.yaml
  - docs/PR_DELTAS/pr-119.md
  - docs/generated/status_snapshot.json
  - docs/generated/claim_ledger.json
  - docs/generated/status_matrix.md
  - docs/generated/progress_checkpoints/progress_scoreboard.md

pre_registered_success:
  - Exactly PR-119 through PR-166 occur once in the new active slice; PR-167 through PR-183 remain absent.
  - All 65 pre-intake cards and completed states are byte/semantic-preserved by a frozen-slice digest.
  - All four backlog mirrors and both status mirrors pass deterministic parity checks.
  - The full 113-card DAG is acyclic, dependency-complete, and policy-order-valid.
  - Every new card passes the v3 schema, canonical owner, typed dependency, and two-ceiling checks.
  - PR-159 through PR-166 remain DORMANT_EXTERNAL without authenticated native delivery.
  - The active remediation root contains 102 OPEN rows and zero RESCUED rows.
  - Alias-equivalent, unknown, expired, revoked, or wrong-scope author/adjudicator pairs are rejected.
  - Negative terminal receipts close only explicitly typed aggregation edges and never scientific producer edges.
  - The immutable checkpoint_065 hash is unchanged and the next checkpoint is 70.
  - The immutable PR-118 audit validates against its seal commit without rewriting its MANIFEST or package files.
  - Final progress is 66/113 with PR-120 and PR-121 unblocked.

decisive_falsifiers:
  - Any duplicate, cycle, missing dependency, hidden completed card, or policy-order violation.
  - Any mutation to the frozen 65-card slice or checkpoint_065.
  - Any active PR-167 through PR-183 row during PR-119.
  - Any backlog/status mirror mismatch.
  - Any initial scientific status other than OPEN or rescued_count greater than zero.
  - Any cross-scheme C-level inference or active TEFF ownership.
  - Any terminal negative receipt accepted as successful scientific input.
  - Any self-adjudication or unverifiable principal promotion above ADJUDICATION_PENDING.
  - Any runnable PR-159 through PR-166 state without authenticated native delivery.
  - Any regeneration or live-worktree rebinding of the PR-118 historical audit MANIFEST.

scope_exclusions:
  - PR-120 P0 consumer quarantine implementation
  - PR-121 hermetic packaging repair
  - PR-122 content-addressed evidence and attestation graph
  - scientific reruns, theorem changes, or data analysis
  - native low-ell solver implementation or simulation
  - family or geometry adjudication
  - rewriting historical agent or referee outputs
  - PR-167 through PR-183 intake

execution_constraints_carried_forward:
  pr3_e2e_download: complete
  pr4_download: not_started
  pr4_data_analysis: skip_entirely_when_PR-150_is_reached

required_tests:
  - venv/bin/python -B scripts/codex_harness/sync_pr_dag_mirrors.py --check
  - venv/bin/python -B scripts/codex_harness/validate_pr_dag.py docs/codex_handoff/pr_backlog.yaml --status docs/codex_handoff/pr_status.yaml --strict-rescue-slice
  - venv/bin/python -B scripts/codex_harness/validate_research_remediation.py --check
  - venv/bin/python -B scripts/codex_harness/progress_report.py docs/codex_handoff/pr_backlog.yaml docs/codex_handoff/pr_status.yaml --checkpoint-every 5 --json
  - venv/bin/python -B -m pytest -p no:cacheprovider -q scripts/codex_harness/test_pr_dag_harness.py tests/contracts/test_pr119_long_horizon_intake.py tests/contracts/test_research_remediation_state.py tests/contracts/test_pr_delta_template.py tests/contracts/test_status_snapshot.py tests/contracts/test_jcap_prd_adversarial_audit.py
  - venv/bin/python -B scripts/check_claim_language.py --dry-run --format json docs/research_program/long_horizon_rescue docs/PR_DELTAS/pr-119.md
  - venv/bin/python -B -m pytest --collect-only -q
  - venv/bin/python -B -m pytest -m smoke -q
  - git diff --check

approval:
  author_principal_id: codex:/root
  non_author_adjudicator_principal_id: codex:/root/pr119_spec
  author_adjudicator_inequality_check: passed_internal_identity_separation
  spec_matches_roadmap_scope: passed
  decisive_falsifiers_complete: passed
  verdict: APPROVE_SPEC_FOR_IMPLEMENTATION
  implementation_authorized: true
