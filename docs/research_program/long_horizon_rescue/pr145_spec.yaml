remediation_state_contract:
  path: docs/codex_handoff/research_remediation_state.yaml
  sha256: f16d9754828bb32ae4cef92f585af82ae7fd1caa2687a7b4144bc1e942328dd9
  finding_count: 102
  required_scientific_status_counts: {OPEN: 102}
  rescued_count: 0

model:
  module: htt/src/common/cf4_velocity_estimators.py
  observable: >-
    radial peculiar velocity v_a = V3k_a - H0 * Dist_a (CMB frame, H0 = 74.6
    km/s/Mpc, the CF4 value); the measurement variance is
    (H0 sigma_D)^2 + sigma_nl^2 with sigma_D = ln(10)/5 * e_DMzp * Dist and
    a nonlinear velocity dispersion sigma_nl.
  H0_kms_mpc: '373/5'
  sigma_nl_kms: 250
  cosmology: fiducial LambdaCDM (velocity_power.fiducial); sigma_v_1d verified
  cv_subsample: 3000
  cv_realizations: 4
  cv_seed: 20260718

estimators:
  registry:
    - id: bulk_flow_wls
      kind: weighted_least_squares
      model: v_a = n_a . B
    - id: flow_plus_monopole
      kind: constrained
      model: v_a = n_a . B + M (a radial monopole M shared by all groups)
  registry_rule: >-
    both estimators live in one registry; each returns a coefficient VECTOR
    and a full covariance (noise + cosmic variance); comparison is by the
    Mahalanobis distance of the vector difference under the summed
    covariance, never a scalar amplitude overlap.

coverage:
  n_injections: 200
  seed: 20260719
  inject:
    flow_kms: [120, -80, 60]
    monopole_kms: 40
  targets: [0.68, 0.95]
  rule: >-
    a known flow (and monopole) is injected on top of the fiducial cosmic-
    variance + measurement noise; the recovered per-component 68 and 95%
    interval coverage must lie within a preregistered band of the nominal.

partition:
  n_regions: 8
  scheme: supergalactic_cartesian_octants_SGX_SGY_SGZ_sign
  rule: >-
    an exact eight-region partition by the sign of the supergalactic
    Cartesian coordinates is used for a leverage check; it is labelled an
    eight-region partition, never loosely an octant subset.

negative_scan:
  targets:
    - htt/src/common/cf4_velocity_estimators.py
    - docs/generated/pr145_captions.json
  forbidden_patterns:
    - 'constrained median is the truth'
    - 'formal significance is the result'
    - 'cf4 p0 closed'
    - 'scalar amplitude overlap is the comparison'
    - 'nuisance chosen to match the headline'
  rule: >-
    active PR-145 surfaces must never call the constrained median truth,
    report the formal (noise-only) significance as the result, claim a CF4
    P0 closed, compare by scalar amplitude only, or tune a nuisance to a
    headline.

mutation_registry:
  - mutation_id: constrained_median_as_truth
    kill_rule: declaring the constrained-estimator median the truth is rejected
  - mutation_id: noise_only_significance
    kill_rule: reporting the measurement-noise-only significance as the result is rejected by the full-covariance guard
  - mutation_id: scalar_amplitude_overlap
    kill_rule: comparing estimators by scalar amplitude overlap alone is rejected by the vector-covariance guard
  - mutation_id: cf4_p0_closure
    kill_rule: a premature CF4 P0 closure claim before the PR-157 adjudication is rejected
  - mutation_id: rank_deficient_point_estimate
    kill_rule: emitting a point estimate under a rank-deficient design is rejected
  - mutation_id: octant_relabel
    kill_rule: labelling the eight-region partition an octant subset is rejected

artifact_contract:
  outputs:
    - docs/generated/pr145_bulk_flow_report.json
    - docs/generated/pr145_coverage_report.json
    - docs/generated/pr145_partition_report.json
    - docs/generated/pr145_p0_remediation_candidates.json
    - docs/generated/pr145_captions.json
    - docs/generated/pr145_mutation_report.json
    - docs/generated/pr145_artifact_manifest.json
  check_policy: fresh_build_must_equal_disk_bytes

acceptance_and_kill_switches:
  - the bulk-flow vector and its full covariance (noise + cosmic variance) are computed from the raw observable
  - the full-covariance significance is reported and is far below the noise-only figure
  - the flow-plus-monopole constrained estimator returns a vector and full covariance
  - the injections recover flow and monopole with per-component 68/95% coverage in band
  - the eight-region partition leverage check is recorded
  - the two CF4 P0s stay OPEN with remediation-candidate receipts (no closure before PR-157)
  - every registered mutation executes and is killed
  - all 102 remediation findings remain OPEN

forbidden_output_language:
