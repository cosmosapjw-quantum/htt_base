claim_identity:
  claim_id: C-PR145-VELOCITY-ESTIMATORS
  claim_text: >-
    From the authenticated CF4 raw distance observable (group luminosity
    distance and CMB-frame velocity, PR-144), a single estimand registry
    computes the bulk-flow 3-vector with its FULL covariance — the
    measurement-noise covariance PLUS the linear-theory cosmic-variance
    covariance from the fiducial peculiar-velocity power spectrum
    (Gorski radial/transverse correlation, sigma_v_1d verified) — and a
    flow-plus-radial-monopole constrained estimator. Estimators are
    compared as VECTORS under the full covariance (a Mahalanobis distance),
    never a scalar amplitude overlap. The bulk-flow amplitude and its
    significance are reported under the full covariance: the cosmic-variance
    term dominates the tiny measurement-noise term, so the honest full-
    covariance significance is FAR SMALLER than the measurement-noise-only
    (formal) figure — the linear cosmic-variance covariance is a
    conservative lower bound on the total variance, so the reported
    significance is an UPPER bound. Flow / monopole injections are recovered
    with 68/95% per-component coverage under the FULL covariance while the
    noise-only covariance UNDER-covers — a covariance-propagation self-
    consistency plus a full-versus-noise-only discrimination, not a
    validation of the physical P(k)/Gorski model itself. An eight-region
    partition by the sign of the real supergalactic Cartesian coordinates
    (never called an octant loosely) checks leverage. This is observable-
    estimator mechanics at C2 only; the two CF4
    P0s (C1-K5-MV-F1, C3-K5-VCORR-ML-F1) stay OPEN with remediation-
    CANDIDATE receipts — their closure is impossible before the PR-157
    adjudication. The constrained estimator median is never truth, and no
    nuisance/model is chosen to match a prior headline.
  domain: cf4_group_peculiar_velocity_estimators
  frame: binds_pr144_cf4_manifest_pr134_estimand_pr137_coverage_pr123_oracle
  claim_level_scheme: roadmap_rescue_v1
  claim_level: C2

