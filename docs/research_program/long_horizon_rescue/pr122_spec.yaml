data_scope:
  pr3_e2e_download: complete_analysis_deferred_to_PR-150
  pr4_download: not_started
  pr4_data_work: skip_entirely_by_user_scope
  forbidden_actions:
    - PR4 download
    - PR4 intake
    - PR4 reduction
    - PR4 analysis

caveats:
  - Graph closure proves fail-closed mechanics, not estimand correctness or independent scientific validation.
  - Current repository principals are correlated internal identities and cannot promote scientific status.
  - The launcher self-hash marker is supplemental runtime evidence, never authorization by itself.
  - The PR-122 authority snapshot is historical; future scopes remain in the evolving default-deny registry.
  - Existing MES branch PASS is a diagnostic seal result, not theorem or successor authority.
  - The native low-ell solver and morphology atlas remain absent.
  - No Bianchi family, geometry, posterior, evidence, or detection claim is created.

acceptance:
  - Clean fixtures reproduce one exact graph root and closure receipt.
  - Every registered mutation fails or is explicitly downclaimed.
  - Publication freeze and audit packages bind the exact receipt path, digest, ID, and version.
  - Blocked science cannot produce a green claim-release decision even when process execution passed.
  - Active MES consumers cannot bypass the typed missing successor without blocking release.
  - Status generation does not infer smoke-tested from DAG completion.
  - Arbitrary readiness objects and scalar pseudo-PPC/Bayes inputs cannot open inference gates.
  - Bound CLIs reject ordinary startup, executable .pth processing, and workspace bytecode shadowing.
  - Later authority-registry evolution cannot invalidate or broaden the immutable PR-122 authority slice.

kill_switch: >-
  If any mutation survives, any zero-test target is accepted as authority, any
  self/circular receipt validates, or blocked science enters a green claim
  release, PR-122 remains open and every downstream release operation stops.
