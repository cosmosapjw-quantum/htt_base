    Within the repository-local pre-solver release path, PR-122's typed
    evidence graph can establish only fail-closed C1 release/evidence
    mechanics when exact graph closure, executable test evidence, authorized
    non-self attestation, and consumer binding all pass; it does not validate
    scientific estimands.
