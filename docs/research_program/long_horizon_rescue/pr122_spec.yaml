evidence_first_roles:
  code_mapper:
    steelman: >-
      Reuse ClaimIdentity, AuthorityRegistry, package hash primitives, manifest
      validation, and exact receipt loading while adding only the missing typed
      graph, parent-DAG, and closure contracts.
  harness_engineer:
    steelman: >-
      Bind selectors, collected node IDs, executed node IDs, bucket counts,
      environment, toolchain, and input hashes; a non-existent or zero-executed
      Python or Rust target can never authorize a claim.
  physics_statistics_auditor:
    steelman: >-
      Preserve process, evidence, and scientific status as three orthogonal
      axes; keep current MES successor and D2 authority blocked until PR-124.
  claim_gate_reviewer:
    steelman: >-
      Derive readiness only from verified closure, prohibit caller booleans or
      pseudo-PPC/Bayes scalars, and allow blocked material only in explicitly
      downclaimed audit-disclosure packages.

chosen_patch:
  - Add one immutable COMMON evidence-graph kernel with typed nodes and edges.
  - Content-address graph nodes, graph roots, parent receipts, and exact consumers.
  - Launch every bound producer and consumer before Python site, .pth, or workspace bytecode processing.
  - Bind authorized principals through the PR-119 registry without creating a self-signed trust root.
  - Freeze the exact PR-122 authority slice so later default-deny registry evolution cannot rewrite historical receipts.
  - Add exact collected/executed test identity and count receipts.
  - Make publication freeze and active audit package builders consume the exact closure receipt.
  - Remove completed-equals-smoke-tested and arbitrary ready_for_claims inference paths.
  - Add a typed MES successor registry whose active successor is blocked_pending_PR124.

