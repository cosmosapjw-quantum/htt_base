pre_registered_success:
  registration_status: NOT_PRE_REGISTERED_POST_IMPLEMENTATION
  criterion_role: post_implementation_acceptance_lock_only
  retroactive_preregistration_claimed: false
  criteria:
    - criterion_id: PR122-SUCCESS-01
      criterion_type: deterministic_graph_closure
      statement: Clean tracked inputs reproduce one exact graph root and closure receipt.
      required_resolution: passed
    - criterion_id: PR122-SUCCESS-02
      criterion_type: executable_mutation_kill
      statement: Every registered mutation fails or produces an explicit downclaim.
      required_resolution: passed_or_explicitly_downclaimed
    - criterion_id: PR122-SUCCESS-03
      criterion_type: exact_consumer_binding
      statement: Publication freeze and audit packages consume the exact receipt path, digest, ID, and version.
      required_resolution: passed
    - criterion_id: PR122-SUCCESS-04
      criterion_type: authority_and_lineage
      statement: Self, circular, fabricated, correlated-as-independent, and author-equals-adjudicator authority paths are rejected.
      required_resolution: passed
    - criterion_id: PR122-SUCCESS-05
      criterion_type: executed_test_identity
      statement: Nonexistent and zero-collected Python or Rust targets cannot authorize a claim.
      required_resolution: passed
    - criterion_id: PR122-SUCCESS-06
      criterion_type: scientific_status_firewall
      statement: Blocked science cannot produce a green claim-release decision even when process execution passed.
      required_resolution: passed
    - criterion_id: PR122-SUCCESS-07
      criterion_type: mes_successor_firewall
      statement: An active MES consumer that lacks verified typed successor authority blocks release.
      required_resolution: passed

decisive_falsifier:
  registration_status: NOT_PRE_REGISTERED_POST_IMPLEMENTATION
  trigger_semantics: any_condition_is_decisive
  action: keep_PR122_open_and_stop_all_downstream_release_operations
  conditions:
    - falsifier_id: PR122-FALSIFIER-01
      falsifier_type: surviving_mutation
      condition: Any registered false-green mutation survives without rejection or explicit downclaim.
    - falsifier_id: PR122-FALSIFIER-02
      falsifier_type: zero_test_authority
      condition: Any nonexistent or zero-executed Python or Rust target is accepted as authority.
    - falsifier_id: PR122-FALSIFIER-03
      falsifier_type: invalid_authority_lineage
      condition: Any fabricated, self-signed, circular, correlated-as-independent, or self-adjudicated receipt validates.
    - falsifier_id: PR122-FALSIFIER-04
      falsifier_type: integrity_hidden_by_policy
      condition: A missing, stale, or invalid artifact is hidden by a blocked policy state and reaches a consumer.
    - falsifier_id: PR122-FALSIFIER-05
      falsifier_type: blocked_science_green_release
      condition: Blocked scientific status enters a green claim-release path.
    - falsifier_id: PR122-FALSIFIER-06
      falsifier_type: mes_registry_bypass
      condition: A stale or undeclared MES consumer reaches release without verified typed successor authority.

