claim_identity:
  claim_id: C-PR133-SOURCE-RESPONSE-TYPES
  claim_text: >-
    The linear observer proxy A_v, the physical tilt Omega_tilt,
    vorticity W2, shear Sigma, curvature Delta_Omega_k, and the
    background geometry are SEPARATE typed quantities with no automatic
    coercion between them; the A_v -> Omega_tilt bridge is refused
    unless a registered source-response equivalence edge with evidence
    exists (non-bridge semantic guard). The harmonic observer boost is
    order-counted EXACTLY: A_v enters at O(beta) in the ell = 1
    channel, the kinematic quadrupole it deposits enters at O(beta^2)
    in the ell = 2 channel; a pure local boost is removed from the
    shear reading at the declared second order by the deprojection
    Sigma_tilde^2 = Sigma^2 - alpha (Omega_tilt)^2, verified ONLY as a
    synthetic local-boost estimator property (false-positive removal,
    never a shear detection). Every candidate carries the HIGHEST rung
    it reaches on the ladder algebraic_witness -> constraint_admissible
    -> local_dynamics_admissible -> global_dynamics_admissible, and no
    rung is auto-promoted to the next. The response graph keeps the
    ANALYTIC rank distinct from the observed rank; a transfer/mask/
    window collinearity that aligns response directions surfaces the
    aligned-axis rank-1 exception explicitly (never hidden). If a pure
    local boost is not removed at the declared order, or the
    local/global response is rank-deficient, the output is
    non_identified. Pre-solver discrimination diagnostic only — no
    Bianchi family, global tilt, or geometry is measured from any
    scalar value.
  domain: pre_solver_typed_source_response_interface_only
  frame: binds_pr125_registered_contracts_and_pr127_graded_basis
  claim_level_scheme: roadmap_rescue_v1
  claim_level: C2

