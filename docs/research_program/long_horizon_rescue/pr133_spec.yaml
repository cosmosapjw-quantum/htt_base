typed_quantities:
  module: htt/src/common/source_response_types.py
  types:
    - name: observer_proxy
      symbol: A_v
      order_in_beta: 1
      harmonic_channel: 1
      physical: false
      note: linear kinematic bulk-flow proxy; NOT a physical tilt
    - name: physical_tilt
      symbol: Omega_tilt
      order_in_beta: 1
      harmonic_channel: 1
      physical: true
      note: physical peculiar-velocity tilt; linear in beta
    - name: vorticity
      symbol: W2
      order_in_beta: null
      harmonic_channel: null
      physical: true
    - name: shear
      symbol: Sigma
      order_in_beta: null
      harmonic_channel: 2
      physical: true
    - name: curvature
      symbol: Delta_Omega_k
      order_in_beta: null
      harmonic_channel: null
      physical: true
    - name: background_geometry
      symbol: geometry
      order_in_beta: null
      harmonic_channel: null
      physical: true
  firewall_rule: >-
    each quantity is a distinct type; cross-type arithmetic (add/sub)
    and ordering (<, <=, >, >=) raise, and cross-type equality is
    always False; the sanctioned cross-type conversion is bridge()
    alone. Python cannot forbid direct reconstruction
    (TypedQuantity(PHYSICAL_TILT, x) asserts a NEW tilt value, it does
    not bridge a proxy), so a bridged value carries a bridged:<edge>
    provenance and require_declared_provenance catches any quantity
    whose provenance names an unregistered bridge. A_v and Omega_tilt
    are distinct even though both are O(beta) in the ell = 1 channel
    (the proxy is kinematic, the tilt is physical).

harmonic_boost:
  order_counting:
    A_v: 'O(beta^1), ell = 1'
    kinematic_quadrupole: 'O(beta^2), ell = 2 (from the Doppler/aberration transform of the monopole)'
  derivation_rule: >-
    the ell = 2 boost power of a PURE MONOPOLE scales as beta^2
    (mu^2 = (2/3) P2(mu) + 1/3); the order counting demands a pure
    beta^2 monomial (no lower-order contamination), verified
    symbolically. Cross-reference to doppler_boost.py (ell=2 returns
    (4/5) e2 beta + e1^2): the e1^2 term IS this monopole -> quadrupole
    O(beta^2) channel (e1 is the dipole ~ beta), while the (4/5) e2 beta
    term is the SEPARATE aberration of a pre-existing background
    quadrupole e2 (a different channel, linear in beta only because a
    rest-frame quadrupole already exists). This toy models the
    pure-monopole channel (e2 = 0).

deprojection:
  formula: 'Sigma_tilde^2 = Sigma^2 - alpha (Omega_tilt)^2'
  alpha_note: >-
    alpha is the beta-INDEPENDENT registered response ratio (the beta
    dependence lives entirely in (Omega_tilt)^2 = (kappa_tilt beta)^2);
    in the registered normalization alpha = 1.
  estimator_property: >-
    on a synthetic PURE-LOCAL-BOOST sky (Sigma^2_naive = alpha
    (Omega_tilt)^2, no physical shear) the deprojected reading
    Sigma_tilde^2 -> 0 at the declared second order (false-positive
    removal); on a shear-only sky (Omega_tilt = 0) Sigma_tilde^2 =
    Sigma^2 (no over-subtraction). This is a SYNTHETIC estimator
    property that is ALGEBRAICALLY EXACT BY CONSTRUCTION (the pure-boost
    sky is defined by the same formula that is subtracted, so the zero
    illustrates the estimator's false-positive removal rather than
    measuring anything) — never a shear detection.

response_ladder:
  rungs:
    - algebraic_witness
    - constraint_admissible
    - local_dynamics_admissible
    - global_dynamics_admissible
  rule: >-
    each candidate is labeled with the HIGHEST rung it reaches, backed
    by a named evidence pointer; the ladder never auto-promotes a rung
    to the next, and a missing evidence pointer caps the candidate at
    the lower rung.

response_graph:
  basis: '(Sigma^2, W2, Omega_tilt, DeltaOmega_k) graded basis — the PR-127 DECLARED response map, IMPORTED not re-transcribed'
  analytic_rank: 2
  analytic_kernel: 'the PR-127 frozen {e_W2, e_DeltaOmega_k} two-sector joint null'
  analytic_vs_observed: >-
    the analytic response rank is the PR-127 frozen rank 2 (kernel =
    the W2/DeltaOmega_k joint null); this PR imports RESPONSE_ROWS from
    graded_nonid so it CANNOT contradict that structural
    non-identification (a rank drift raises). The observed rank is a
    SEPARATE quantity that a transfer/mask/window collinearity between
    the two ACTIVE (non-kernel) axes can reduce further. The two ranks
    are never conflated.
  aligned_axis_exception: >-
    when a window makes the two active response directions
    (Sigma^2, Omega_tilt) collinear the rank drops from 2 to 1 and the
    aligned-axis rank-1 exception is surfaced with the colliding axes
    named; hiding it is forbidden.
  non_bridge_edges:
    - from: observer_proxy
      to: physical_tilt
      status: refused_without_registered_equivalence_edge

non_identified_output:
  triggers:
    - pure local boost not removed at the declared order
    - local response rank-deficient
    - global response rank-deficient
  rule: any trigger forces the output label non_identified (fail-closed discrimination)

negative_scan:
  targets:
    - htt/src/common/source_response_types.py
    - docs/generated/pr133_captions.json
  forbidden_patterns:
    - 'bridge A_v to Omega_tilt'
    - 'measures the Bianchi family'
    - 'global tilt measured'
    - 'shear detected via deprojection'
    - 'aligned-axis exception suppressed'
  rule: >-
    active PR-133 surfaces must never auto-bridge the proxy to the
    physical tilt, claim a scalar family/global-tilt measurement,
    present the deprojection as a detection, or suppress the
    aligned-axis exception.

mutation_registry:
  - mutation_id: auto_bridge_av_omega_tilt
    kill_rule: bridging A_v into Omega_tilt with a forged reference against the empty equivalence-edge registry is rejected by bridge(); a directly-reconstructed value carrying an unregistered bridged provenance is caught by require_declared_provenance
  - mutation_id: cross_type_arithmetic
    kill_rule: arithmetic between two distinct typed quantities raises in the firewall
  - mutation_id: rung_auto_promotion
    kill_rule: claiming a rung ABOVE the highest reached (a mid-ladder gap with the top rung present) is rejected by require_rung_not_above
  - mutation_id: wrong_beta_order
    kill_rule: declaring the kinematic quadrupole at O(beta^1) fails the symbolic order-counting check
  - mutation_id: hidden_aligned_axis_exception
    kill_rule: a rank-reduced observed response that omits the aligned-axis exception is rejected by the graph validator
  - mutation_id: deprojection_as_detection
    kill_rule: labeling the synthetic deprojection estimator property a shear detection fails the language and claim validators

artifact_contract:
  outputs:
    - docs/generated/pr133_typed_quantities.json
    - docs/generated/pr133_harmonic_boost.json
    - docs/generated/pr133_deprojection_property.json
    - docs/generated/pr133_response_graph.json
    - docs/generated/pr133_captions.json
    - docs/generated/pr133_mutation_report.json
    - docs/generated/pr133_artifact_manifest.json
  check_policy: fresh_build_must_equal_disk_bytes

acceptance_and_kill_switches:
  - the six typed quantities are distinct and the firewall blocks cross-type arithmetic and the A_v -> Omega_tilt bridge
  - the harmonic order counting places A_v at O(beta) and the kinematic quadrupole at O(beta^2), verified symbolically
  - the synthetic deprojection removes a pure local boost at the declared order and does not over-subtract a shear-only sky
  - every candidate carries its highest reached rung with an evidence pointer and no rung is auto-promoted
  - the analytic and observed response ranks are separate and the aligned-axis rank-1 exception is surfaced
  - a non-removed boost or a rank-deficient response yields non_identified
  - every registered mutation executes and is killed
  - all 102 remediation findings remain OPEN

forbidden_output_language:
  - bridge A_v to Omega_tilt
  - measures the Bianchi family
  - global tilt measured
  - shear detected via deprojection
  - aligned-axis exception suppressed
  - isotropy established
  - Bianchi geometry detected
  - Bianchi family identified
  - finding rescued
  - validated as native
