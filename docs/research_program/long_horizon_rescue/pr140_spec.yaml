claim_identity:
  claim_id: C-PR140-EVIDENCE
  claim_text: >-
    The marginal likelihood (evidence) is computed under a NORMALIZED
    prior whose family and hyperparameters are bound, with the likelihood
    hash, the data hash, the engine, its config, and its diagnostics, into
    ONE content-addressed receipt. Two INDEPENDENT engines are used —
    thermodynamic integration (path sampling over a power-posterior
    ladder) and bridge sampling (Meng-Wong) — each drawing its OWN samples
    (distinct seeds and method), never post-processing the same
    samples/weights. Both are cross-checked against the EXACT conjugate-
    Gaussian evidence and must agree within a preregistered tolerance. A
    fitted score, an unnormalized prior, or a caller-supplied scalar is
    NEVER accepted as a Bayes factor or evidence. The log Bayes factor is
    evaluated over a preregistered grid of prior scale, covariance scale,
    and nuisance; if the engines disagree, the MC diagnostics are
    insufficient, or the prior sensitivity exceeds the preregistered
    ceiling, the evidence claim is `indeterminate`. Evidence agreement is
    NOT generative-model correctness, and a prior-dominated result is
    shown as-is. Coherent model-comparison mechanics conditional on the
    registered model/prior only — no detection.
  domain: conjugate_gaussian_evidence_toy_only
  frame: binds_pr122_receipt_pr134_estimand_pr138_lineage_pr139_holdout
  claim_level_scheme: roadmap_rescue_v1
  claim_level: C3

