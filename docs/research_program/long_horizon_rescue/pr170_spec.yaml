claim_identity:
  claim_id: C-PR170-BUCHERT-SCALAR-BRIDGE
  claim_text: >-
    In Buchert's irrotational-dust scalar averaging convention, on one compact
    comoving domain with H_D nonzero, Omega_Q_D_B equals the domain-rms
    normalized shear only when the expansion variance vanishes. The exact
    two-patch partition formula admits algebraic cancellation of positive
    inter-patch expansion variance against positive local shear, so Q_D_B=0
    does not algebraically identify local isotropy. These are externally
    attributed, assumption-explicit scalar results, not a new theorem and not
    a construction of a matched Bianchi spacetime.
  novelty: project_convention_audit_and_conditional_application_not_new_theorem
  domain: >-
    general relativity; pressureless irrotational geodesic dust;
    flow-orthogonal proper-time foliation; one compact comoving domain;
    same time slice and normalization throughout

frozen_conventions:
  metric_signature: '(-,+,+,+)'
  units: c_equals_1
  shear_scalar: sigma_sq=(1/2)*sigma_ab*sigma^ab
  average: '<Psi>_D=V_D^(-1)*integral_D(Psi dV)'
  H_D: '<theta>_D/3'
  Q_D_B: '(2/3)*Var_D(theta)-2*<sigma_sq>_D'
  Omega_Q_D_B: '-Q_D_B/(6*H_D^2)'
  Sigma2_D_rms: '<sigma_ab sigma^ab>_D/(6*H_D^2)=<sigma_sq>_D/(3*H_D^2)'
  denominator_guard: H_D_ne_0
  constant_expansion_premise: Var_D(theta)=0
  barrow_tsagas_symbol: Q_D_BT
  barrow_tsagas_definition: '(2/3)*Var_D(theta)-2*Var_D(sigma_magnitude)'
  forbidden_symbol_conflation: Q_D_BT_equals_Q_D_B

two_patch_contract:
  volume_weights: lambda_in_open_interval_0_1_and_lambda_2_equals_1_minus_lambda
  patchwise_constant_expansion: theta_i=3*H_i
  mean_H: H_D=lambda*H_1+(1-lambda)*H_2
  expansion_variance: 9*lambda*(1-lambda)*(H_1-H_2)^2
  mean_shear_sq: lambda*sigma_sq_1+(1-lambda)*sigma_sq_2
  partition_identity: >-
    Q_D_B=lambda*Q_1_B+(1-lambda)*Q_2_B+
    6*lambda*(1-lambda)*(H_1-H_2)^2
  patch_Q_under_internal_constancy: Q_i_B=-2*sigma_sq_i
  cancellation_condition: Var_D(theta)=3*mean_shear_sq
  interpretation: algebraic_non_identification_only

registered_fixtures:
  equal_expansion:
    inputs: {lambda: 1/2, H_1: 2, H_2: 2, sigma_sq_1: 3, sigma_sq_2: 3}
    expected: {H_D: 2, Var_theta: 0, Q_D_B: -6, Omega_Q_D_B: 1/4, Sigma2_D_rms: 1/4}
  cancellation:
    inputs: {lambda: 1/2, H_1: 3, H_2: 1, sigma_sq_1: 3, sigma_sq_2: 3}
    expected: {H_D: 2, Var_theta: 9, Q_D_B: 0, Omega_Q_D_B: 0, Sigma2_D_rms: 1/4, bridge_residual: -1/4}
  zero_shear_unequal_expansion:
    inputs: {lambda: 1/2, H_1: 3, H_2: 1, sigma_sq_1: 0, sigma_sq_2: 0}
    expected: {Q_D_B: 6, Omega_Q_D_B: -1/4, Sigma2_D_rms: 0}
  curvature_source_negative_control:
    three_S_diag: [1, -1, 0]
    sigma_diag: [1, -1, 0]
    expected_contraction: 2
    role: tensor_algebra_control_not_a_VII_h_solution

type_registry:
