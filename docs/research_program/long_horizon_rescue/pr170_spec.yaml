  - raw arXiv source archives are content-addressed and equation records are hash-bound
  - four blind axes use one schema-v2 contract and eleven canonical type labels
  - exact algebra and external type-curvature closure are adjudicated separately
  - physical witness promotion fails closed on missing same-state receipts
  - generated result artifacts and manifest reproduce byte-for-byte in check mode
