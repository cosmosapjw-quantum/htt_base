preregistered_falsifiers:
  exact:
    - any required four-axis identity or fixture fails
    - patch exchange changes an invariant
    - H_D=0 is silently normalized
    - Q_D_B and Q_D_BT are conflated
    - the curvature-source negative control contracts to zero
  provenance:
    - a raw-source hash or equation locator is absent or mismatched
    - any unresolved type is represented as externally closed
    - generic VII_h inherits the type-V isotropic-curvature row
  physical:
    - any same-state physical receipt is missing or fails
    - independently chosen patch scalars are called a matched spacetime
  claim:
    - an externally owned identity is described as a new theorem
    - a scalar result is promoted to family identification or native-transfer validation

cas_contract:
  schema: htt.cas_contract.v2
  required_axes: [wolfram_xact, sympy, sage_singular, lean]
  result_blinding: required_until_adjudication
  missing_axis_outcome: CAS_BLOCKED
  exceptions: none
  aggregate_states: [CAS_4AXIS_PASS, CAS_PASS_WITH_REGISTERED_EXCEPTION, CAS_CONFLICT, CAS_BLOCKED, CAS_FAIL]
  important_separation: >-
    The axes verify frozen scalar algebra for eleven typed rows; the external
    type-curvature coverage gate is adjudicated separately and is currently
    incomplete. Eleven repeated scalar rows are not eleven physical Bianchi
    solutions.

terminal_routing:
  - when: CAS_BLOCKED or CAS_CONFLICT
    process_gate_status: BLOCKED
    scientific_result: none
  - when: CAS_FAIL or invalid_contract or provenance_failure
    process_gate_status: FAIL
    scientific_result: none
  - when: CAS_4AXIS_PASS and universal_type_closure_is_false
    process_gate_status: PASS
    scientific_result: externally_attributed_conditional_identity_plus_algebraic_only_witness
    x_C_Buchert_home_status: NO_CURRENTLY_AUTHENTICATED_X_C_WIDE_BUCHERT_HOME
  - when: CAS_4AXIS_PASS and all_type_and_physical_receipts_pass
    process_gate_status: PASS
    scientific_result: physically_admissible_conditional_witness
    x_C_Buchert_home_status: shear_sector_only_not_x_C_as_a_whole

forbidden_output_language:
  - new Buchert theorem
  - x_C has a covariant Buchert home
