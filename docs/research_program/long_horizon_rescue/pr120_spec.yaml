external_verification:
  required: false
  reason: The quarantine decision and affected producer-consumer graph are frozen repository-local audit findings; no external API or current package semantics are used.
roles:
  code_mapper:
    steelman: Preserve exact method and historical reproduction while locating transitive consumers by filename, generated value, and semantic pushforward.
  harness_engineer:
    steelman: Use one typed content-addressed validator across CLI, freeze, and package builders with mutation and false-positive controls.
  physics_statistics_auditor:
    steelman: Quarantine observational interpretations and CF4 numeric instantiations while retaining independent MV, ML, and symbolic mechanics.
  claim_gate_reviewer:
    steelman: Keep all findings OPEN, forbid replacement values, and allow only a propagation-control C1 claim.
chosen_patch:
  - Add a typed hash-bound CF4 P0 quarantine contract, policy, inventory, block record, and validator CLI.
  - Require explicit legacy_reproduction_only mode for the frozen numerical producers and pin every legacy artifact by hash.
  - Replace active result-card, table, figure, manuscript, and pushforward consumers with blocked source records or fail-closed gates.
  - Reuse the same validator in publication-freeze and audit-package builders.
  - Add contextual stale-value and hidden-copy mutations without banning unrelated numeric tokens.
forbidden_actions:
  - Substitute 94.155 km/s, 94.8 km/s, raw 0.486, or any other audit sensitivity as corrected truth.
  - Compute a new CF4 or cosmological result.
  - Mark any affected finding RESCUED, CORRECTED_SUPERSEDED, or otherwise above OPEN.
  - Delete or rewrite historical audits, PR deltas, changelog entries, or frozen package snapshots.
  - Treat diagnostic_only wording as sufficient to bypass a blocked source.
  - Perform any PR4 download, reduction, or analysis.
acceptance:
  - Every active/public path has zero stale P0 numerical or interpretive payload and consumes the canonical block record.
  - Every preserved numerical payload is exact-hash-bound and explicitly legacy_reproduction_only with public_use false.
  - Publication freeze, figure/manuscript gates, and package builders reject stale, copied, missing, or hash-mismatched inputs.
  - Mutations cover MV amplitude/tension, mock significance, ML shape correction, GLS/Omega_tilt pushforwards, and false replacement truth.
  - Unrelated CatWISE significance and unrelated numeric fixtures remain accepted.
  - The remediation census remains 102 OPEN and zero RESCUED.
kill_switch: Any hidden active consumer or stale generated copy blocks PR-120 and every later data PR.
