claim_identity:
  claim_id: C-PR148-GROWTH-COVARIANCE
  claim_text: >-
    From the frozen CF4 peculiar-velocity observable the growth-rate amplitude
    fsigma8 is estimated per pre-registered distance shell by an eigen-whitened
    quadratic-maximum-likelihood amplitude fit against the fiducial Gorski
    velocity-correlation template, and the SAME-DATA joint covariance of the
    per-shell fsigma8 (including the cross-shell terms, since the shells share
    one catalogue and one correlated velocity field) is MEASURED from a
    Cholesky mock ensemble (binding the PR-146 generator), never assumed
    diagonal or set to a favourable correlation endpoint. The honest outcome is
    that only the nearest shell constrains fsigma8 (consistent with the LambdaCDM
    comparator) while the deeper shells are noise-dominated and unconstrained,
    the measured joint covariance is positive-definite and turns out nearly
    diagonal (the depth shells are near-independent probes, reported not
    assumed), and the joint-covariance-conditioned growth DIFFERENCE across
    depth is consistent with zero and reported as a BOUND, never a precision
    sigma and never the historical bulk-flow tension figure. The estimator
    (measurement + cosmic-variance) uncertainty is separated from the
    theoretical comparator uncertainty; a shared-data comparator is
    demonstrated to require the cross-covariance. Simultaneous depth intervals
    (Bonferroni), shell-edge stability, held-out depth prediction and the
    covariance eigen/PSD diagnostics are reported. This is growth-difference
    bound mechanics at C3 only; the two CF4 P0s stay OPEN with remediation-
    CANDIDATE receipts, closure impossible before the PR-157 adjudication. No
    global-tilt or anomaly claim is produced.
  domain: cf4_depth_resolved_growth_rate
  frame: binds_pr146_generator_pr147_bound_discipline_pr139_holdout_pr137_coverage
  claim_level_scheme: roadmap_rescue_v1
  claim_level: C3

