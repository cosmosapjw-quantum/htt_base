  - the estimator uncertainty is separated from the theoretical comparator uncertainty and a shared-data comparator is shown to require the cross-covariance
  - the simultaneous depth intervals, shell-edge stability and held-out depth prediction are reported
  - the two CF4 P0s stay OPEN with remediation-candidate receipts (no closure before PR-157)
