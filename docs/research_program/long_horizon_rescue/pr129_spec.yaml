claim_identity:
  claim_id: C-PR129-NTA3-REGISTRY
  claim_text: >-
    The sqrt(2/5) fractional dispersion is registered as an ESTIMATOR- and
    DOMAIN-SPECIFIC theorem (ideal full-sky noiseless Gaussian
    quadrupole-power estimator; reality-condition dof 2*ell+1 = 5;
    Var(C2_hat)/C2^2 = 2/5 exactly), verified three ways (chi-square
    closed form, independent Gaussian moment derivation, and a seeded
    Monte Carlo that simulates the REGISTERED ESTIMATOR from Gaussian
    a_2m draws under the reality condition) within the preregistered
    tolerance, and kept STRICTLY SEPARATE from the multi-multipole Fisher
    quantity. No universal/minimax/Cramer-Rao-floor or cannot-do-better
    reading of sqrt(2/5) survives the separation validator or the
    negative scan over the registered active NTA3 surfaces. This is a
    corrected supersession of the original universal claim, not a
    literal rescue.
  domain: ideal_full_sky_noiseless_gaussian_quadrupole_power_estimator_only
  frame: binds_pr125_registered_contracts_frame_free_statistics
  claim_level_scheme: roadmap_rescue_v1
  claim_level: C1

scope_and_non_goals:
  universal_or_minimax_or_cramer_rao_floor_reading: forbidden
  cannot_do_better_language: forbidden
  mask_noise_general_estimator_extension: forbidden
  literal_rescue_of_the_original_claim: forbidden
  remediation_disposition_change: forbidden

remediation_state_contract:
  path: docs/codex_handoff/research_remediation_state.yaml
  sha256: f16d9754828bb32ae4cef92f585af82ae7fd1caa2687a7b4144bc1e942328dd9
  finding_count: 102
