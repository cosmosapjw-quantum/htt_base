  rescued_count: 0

data_scope:
  pr4_data_work: skip_entirely_by_user_scope
  pr4_commands_run_required: 0

estimator_registry:
  module: htt/src/common/nta3_estimator_registry.py
  entries:
    - estimator_id: quadrupole_power_ideal
      statistic: 'C2_hat = (1/5) * sum_m |a_2m|^2'
      sky: full_sky
      noise: none
      field: isotropic_gaussian
      ell: 2
      dof: 5
      dispersion_squared_exact: '2/5'
      theorem: >-
        Var(C2_hat)/C2^2 = 2/dof = 2/5 exactly, with dof = 2*ell+1 = 5
        the reality-condition count (a_20 real; m = 1,2 complex with
        a_{2,-m} determined by a_{2,-m} = (-1)^m a_2m^*), derived both
        by the chi-square closed form and by the independent Gaussian
        moment computation.
    - estimator_id: multi_multipole_fisher_toy
      statistic: 'I = sum_{l=2..L} (2l+1)/2 * f_sky * r_l^2 (toy response)'
      sky: parameterized_f_sky
      noise: none
      field: isotropic_gaussian
      dof: null
      dispersion_squared_exact: null
      theorem: >-
        a DIFFERENT object: the joint low-l Fisher information with a
        documented toy response; never interchangeable with the
        single-estimator dispersion above.
  separation_rule: >-
    the two registry entries are distinct objects; any claim citing
    sqrt(2/5) as a Fisher/CR floor (or the Fisher floor as the estimator
    dispersion) is rejected by the separation validator.

monte_carlo:
  bit_generator: PCG64
  seed: 20260718
  replicates: 200000
  preregistered_tolerance_abs: 0.004
  module_pin: htt/src/common/nta3_estimator_registry.py::PREREGISTERED_TOLERANCE_ABS
  rule: >-
    |sample_sd/mean - sqrt(2/5)| < tolerance on seeded draws that
    SIMULATE THE REGISTERED ESTIMATOR (Gaussian a_2m under the reality
    condition, C2_hat formed directly) — not on draws of the chi-square
    identity under test. The tolerance is preregistered here AND pinned
    as a module constant; the runner refuses to run if the two pins
    disagree, and the module rejects any caller-supplied tolerance that
    differs from its pin. Never widened after seeing the Monte Carlo.

negative_scan:
  targets:
    - htt/obsstat/egs2_fisher.py
    - htt/src/common/nta3_estimator_registry.py
    - docs/generated/pr129_captions.json
    - scripts/prove_egs_lowell_theorems.py
    - scripts/make_egs_lowell_theorem_figures.py
    - tests/bass/test_egs_lowell_theorems.py
    - htt/bass/transfer/shear_quadrupole_seminative.py
    - htt/obsstat/egs3_omega_k_reopening.py
  forbidden_patterns:
    - 'universal floor'
    - 'minimax floor'
    - 'cannot do better'
    - 'Cramer-Rao floor of sqrt(2/5)'
    - 'Cramer-Rao bound of 0.632'
  sentinel_policy:
    allowed_only_in: htt/src/common/nta3_estimator_registry.py
    max_blocks: 1
    block_sha256: a2e3fde146213154265cb48f92ac9c094417047d803a8a55af145e9a084a0639
    rule: >-
      sentinel-skipped content is pinned by hash; hiding new text inside
      a sentinel block, or adding sentinels to any other target, fails
      the scan.
  registered_negation_allowlist:
    - path: scripts/prove_egs_lowell_theorems.py
      line_sha256: 6a14ebfa0e2b2452d5fba977180ea96b45e1b91be3d1738519ad3fbf7da37c3a
      reason: explicit negation (NOT a Cramer-Rao bound or a universal-floor reading)
    - path: scripts/make_egs_lowell_theorem_figures.py
      line_sha256: b912f20254dcdbf556bb98f62124826e0dd4d52a03b6bdd380381e3a3221a14e
      reason: explicit negation in the module docstring
    - path: scripts/make_egs_lowell_theorem_figures.py
      line_sha256: 30b871766bf990233b7088202978e45b06a10646a671f3463536f2b5b1820821
      reason: figure title carrying the explicit negation
  rule: >-
    the registered active NTA3 surfaces must not attach
    universal/minimax/CR language to the estimator-specific sqrt(2/5);
    explicit negations are admitted only via the hash-pinned allowlist
    above.

mutation_registry:
  - mutation_id: universal_floor_language
    kill_rule: a caption attaching universal/minimax/CR-floor language to sqrt(2/5) fails the real language lint
  - mutation_id: estimator_unspecified
    kill_rule: a registry entry missing sky/noise/field/dof fields fails the fail-closed registry validator
  - mutation_id: wrong_dof
    kill_rule: dof = 4 at ell = 2 fails the structural reality-condition check dof == 2*ell+1
  - mutation_id: dof_reality_condition_miscount
    kill_rule: the naive complex-component miscount dof = 9 with dispersion 2/9 at ell = 2 fails the structural check
  - mutation_id: fisher_conflation
    kill_rule: claims citing sqrt(2/5) or 0.632 in a Fisher/Cramer-Rao/minimax/universal role are rejected by the separation validator
  - mutation_id: posthoc_tolerance_widening
    kill_rule: an MC call with a tolerance different from the module pin is rejected inside run_seeded_mc on the real path

artifact_contract:
  outputs:
    - docs/generated/pr129_estimator_registry.json
    - docs/generated/pr129_mc_report.json
    - docs/generated/pr129_negative_scan.json
    - docs/generated/pr129_captions.json
    - docs/generated/pr129_mutation_report.json
    - docs/generated/pr129_artifact_manifest.json
  check_policy: fresh_build_must_equal_disk_bytes

acceptance_and_kill_switches:
  - the exact dispersion equals 2/5 on the chi-square closed form AND the independent term-by-term Gaussian moment derivation, with dof structurally equal to 2*ell+1
  - the seeded estimator-level MC (Gaussian a_2m draws) lands within the preregistered tolerance (declared-condition deviation -> no claim, re-examine)
  - the spec tolerance pin equals the module tolerance pin
  - the negative scan is clean on every registered target under the pinned sentinel policy and allowlist
  - every spec forbidden pattern is covered by the module caption lint (cross-list consistency gate)
  - every registered mutation executes and is killed
  - all 102 remediation findings remain OPEN

forbidden_output_language:
  - universal floor
  - minimax floor
  - cannot do better
  - shear detected
  - isotropy established
  - Bianchi geometry detected
  - Bianchi family identified
  - finding rescued
  - validated as native
