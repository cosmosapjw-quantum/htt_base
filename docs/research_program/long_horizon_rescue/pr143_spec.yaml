  cherry_pick_favorable_dgp: forbidden
  retune_then_rescore_same_id: forbidden
  synthetic_pass_as_observed_validity: forbidden
  hide_a_failed_family: forbidden
  generator_analyst_merge: forbidden
  self_adjudicating_referee: forbidden
  remediation_disposition_change: forbidden

