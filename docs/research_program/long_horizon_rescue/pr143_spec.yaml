claim_identity:
  claim_id: C-PR143-ADJUDICATION
  claim_text: >-
    A BLIND challenge over the integrated statistical foundation. A
    generator seals a battery of labelled DGPs (known-null, local, global,
    systematic, weak-ID, dependent-mock, covariance-misspecified); a BLIND
    analyst (the PR-141 discrimination method) predicts each item from the
    data and the KNOWN survey geometry WITHOUT seeing the truth; and a
    NON-AUTHOR referee scores size (false-candidate rate on the null),
    recovery (correct branch on a clean signal), abstention (the required
    diagnosis where no single model is admissible), and
    computational-failure behaviour against PRE-REGISTERED thresholds,
    producing a method-ready / block matrix. Passing the synthetic
    challenge is METHOD READINESS, not observed validity; the generator /
    analyst / referee separation is content-addressed. A method that fails
    a criterion blocks only the data PRs that depend on it and the failure
    is never hidden; favourable-case cherry-picking, retuning-then-
    rescoring under the same challenge id, presenting readiness as observed
    validity, and a self-adjudicating referee are refused. Pre-data
    method-calibration mechanics only — no observed-data claim, no
    detection.
  domain: synthetic_dgp_battery_toy_only
  frame: binds_pr135_pr136_pr137_pr138_pr139_pr140_pr141_pr142
  claim_level_scheme: roadmap_rescue_v1
  claim_level: C3

