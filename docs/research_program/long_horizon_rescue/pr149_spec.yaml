claim_identity:
  claim_id: C-PR149-K1-CONVENTION
  claim_text: >-
    A canonical low-multipole Planck K1 convention contract is frozen and
    content-addressed (coordinate frame, alm indexing/phase/reality, beam and
    pixel window, downgrade proc-nside, common mask, orientation grid), binding
    the existing alm-convention validator, and is verified on the REAL Planck
    PR3 SMICA and Commander maps through one shared observed-and-null pipeline
    (the same code path processes the data map and a matched Gaussian null, so a
    convention change cannot hide by moving both together). The mathematical
    headline is a BASIS THEOREM proved by an INDEPENDENT Wigner-3j oracle: the
    TT BiPoSH diagonal coefficient A^{LM}_{ll} vanishes identically for every
    ODD L and arbitrary real temperature alm (a structural zero, machine-
    precision on random real alm), so the odd-L diagonal carries no trials and
    is quotiented out of the scan family; the remaining monotone/equivalent
    orientation scans are quotiented and the effective scan family is frozen in
    a ledger. The alm reality condition, the map-to-alm-to-map round trip and a
    rotation round trip are checked against the independent oracle, and a
    hard-coded or stale Planck axis is never used as a discovery. This is
    observable feature-extraction and basis-theorem mechanics at C1--C2 only;
    freezing this mask/proc-nside/convention is the pre-condition for the PR-150
    raw-deletion swap but PR-149 makes no K1 detection or family claim. The two
    CF4 P0s are untouched and stay OPEN.
  domain: planck_lowell_k1_convention
  frame: binds_pr123_oracle_pr125_frame_pr135_ranking_alm_conventions_biposh_features
