identity:
  work_unit_id: PR-247
  change_set_id: CS-PR247-PUBLICATION-INTEGRITY-P0
  publication_group_id: PG-PR247-PUBLICATION-INTEGRITY-P0
  target_ref: origin/research/pr04-multicomponent
  candidate_branch: changeset/pr247-publication-integrity-p0
  publication_unit_limit: one_open_github_pr_per_change_set

reproduced_failures:
  bundle_sha256: c7d7f28e77c37603db8c5fdbffe43a7912a57a78fa9002e036dc8b4f2b44c199
  bundle_disposition: adapt_not_copy
  reasons:
    - direct command matching misses absolute and optioned Git invocations
    - review evidence is not transitively bound to the reviewed diff
    - an arbitrary passing command can satisfy the bundled integration receipt
    - self-declared publisher role is not a capability boundary
    - stale inventory and alias-derived change-set ids admit duplicate publication
    - authorization is replayable and lacks bounded issuance semantics
    - current run closure can succeed without every registered result or a fresh merge
    - bundled inline shell options can hide publication commands from the classifier
    - resolving a venv launcher symlink can discard the selected test environment
    - a legacy documented Antigravity tool_args payload can bypass a nested-only adapter
  direct_adoption_forbidden: true

scope:
  p0_required:
    - remove the implicit main target and resolve an explicit remote target
    - separate work_unit_id, change_set_id, and publication_group_id
    - freeze exact base, candidate, merge-base, tree, diff, file-set, remote, and policy identities
    - bind reviewer assignments and results to one immutable candidate seal
    - invalidate review and integration evidence when the candidate or target drifts
    - deny publication mutation from ordinary Codex, Claude, and Antigravity workspaces
    - require a credential-isolated external publisher to consume the sealed evidence
    - require one open GitHub PR at most per canonical change_set_id
    - collect a complete live GitHub PR topology and file inventory before authorization
    - require all registered results plus a fresh MERGED_RESULTS artifact before normal run close
    - make zero GitHub PRs the normal overnight-controller outcome
  p1_deferred:
    - richer domain-specific coverage-cell generation beyond the generic boundary matrix
    - provider-authenticated read and execution telemetry
  p2_deferred:
    - repository-wide PR-topology cleanup
    - merge-queue rollout
    - full CI cost re-tiering outside this harness change-set

candidate_seal_contract:
  schema: htt.candidate_seal.v1
  required_identities:
    - change_set_id
    - publication_group_id
    - target_remote
    - target_branch
    - target_ref
    - remote_fetch_urls
    - remote_push_urls
    - publication_repository_host
    - publication_repository_slug
    - base_sha
    - candidate_branch
    - candidate_ref
    - candidate_sha
    - merge_base_sha
    - candidate_tree_sha
    - diff_sha256
    - changed_files
    - changed_files_sha256
    - integration_policy
    - seal_sha256
  clean_candidate_required: true
  branch_prefix_required: changeset/
  mutation_rule: >-
    Any target, candidate, tree, diff, changed-file, remote-destination, or
    integration-policy drift invalidates every downstream review,
    integration, inventory, and authorization artifact.

assignment_result_contract:
  run_plan_schema: 2
  assignment_schema: 3
  result_schema: 3
  workflow_roles: [implementer, reviewer, adjudicator]
  publisher_is_subagent_role: false
  mutable_implementer_allowed: true
  frozen_candidate_required_for: [reviewer, adjudicator]
  reviewer_profile_sandbox: read-only
  exact_echo_required:
    - change_set_id
    - publication_group_id
    - workflow_role
    - candidate_binding

review_contract:
  first_verdict_read_only: true
  required_coverage_cells:
    - candidate_identity
    - changed_public_apis
    - changed_call_sites
    - bool_as_int
    - nan_inf
    - empty_zero_negative
    - shape_dtype
    - duplicate_alias_reuse
    - mutation_control
    - property_metamorphic
    - compatibility
    - concurrency_replay_state
    - latest_target_integration
  ready_statuses: [PASS, NOT_APPLICABLE]
  not_applicable_requires_rationale: true
  r2_r3_executable_oracle_minimum: 1
  same_model_repeat_is_independent_oracle: false

publication_capability_contract:
  ordinary_agent_publication_mutations: forbidden
  blocked_surfaces:
    - git push and git send-pack equivalents
    - gh PR mutation and mutating GitHub API calls
    - GitHub MCP pull-request mutations
    - authenticated GitHub web-UI publication
  repository_hook_grade: guardrail_only
  hard_boundary_requires:
    - publisher credential unavailable to ordinary agent sandboxes
    - no write-capable GitHub browser session in ordinary agent profiles
    - managed or administrator-owned hook or equivalent network policy
    - serialized publisher process
    - live remote inventory inside the publisher transaction
    - short-lived authorization and one-time nonce consumption
  repository_code_may_publish: false
  overnight_normal_output:
    - local integration branch
    - local commits
    - candidate seal when committed and clean
    - review and integration reports
    - publication recommendation
    - zero GitHub PRs

publication_policy:
  path: docs/research_program/long_horizon_rescue/pr247_publication_policy.json
  max_open_prs: 1
  max_direct_to_target_prs: 1
  max_prs_per_change_set: 1
  max_stack_depth: 1
  max_receipt_age_seconds: 1800
  max_authorization_ttl_seconds: 1800

required_tests:
  - absolute and optioned Git publication commands are denied
  - direct Git send-pack and mutating gh or GitHub API forms are denied
  - provider payload adapters consume documented fields and reject ambiguous JSON
  - current and legacy documented Antigravity payload and denial contracts are both handled fail-closed
  - init_run refuses an unresolved implicit target and never assumes main
  - target, candidate, tree, diff, file-set, remote, and policy drift break the seal
  - remote URLs with embedded credentials, query data, or ambiguous repository identities are rejected
  - reviewer assignment registration fails before a candidate is frozen
  - reviewer results fail when candidate binding or review coverage drifts
  - missing results or stale MERGED_RESULTS block normal run closure
  - result-referenced artifact drift after merge blocks normal run closure
  - arbitrary or stale integration commands cannot satisfy the policy
  - publication-capable integration-policy argv is rejected before execution
  - the Python policy token resolves to an absolute executable path and byte hash in the receipt
  - bundled shell runtime options such as bash -lc cannot hide publication commands
  - the Python policy token preserves its invocation path and separately binds its real binary
  - duplicate change-set, file overlap, stale inventory, excessive stack depth, and PR budgets block
  - missing PR metadata, truncated file inventories, duplicate heads, and stack cycles block
  - the live PR query repository must equal the repository identity sealed from Git remotes
  - duplicate-key or non-finite gh JSON is rejected before inventory normalization
  - expired, future-issued, overlong, inside-workspace, symlinked, or replayed authorization blocks
  - authorization fixes a SHA-sourced push refspec and exact PR title, body, base, head, and draft state
  - clean installer includes and exercises every provider hook and publication-integrity asset

forbidden:
  - No commit, push, GitHub PR creation, merge, approval, or reseal without explicit authority.
  - No repository hook may be described as a complete capability boundary.
  - No self-declared environment role may authorize publication.
  - No reviewer may repair the candidate before recording the first verdict.
  - No evidence for an invalidated candidate may authorize any later candidate.
  - No failure type automatically creates a GitHub PR.
  - No scientific, transfer, family-identification, or publication-readiness claim changes.

done_when:
  - the P0 tests pass against the exact repository implementation
  - the canonical DAG, status, and compatibility mirrors validate
  - an independent adversarial reviewer finds no surviving P0 or P1 publication-integrity defect
  - completion is recorded only after a committed clean candidate passes frozen review and latest-target integration
