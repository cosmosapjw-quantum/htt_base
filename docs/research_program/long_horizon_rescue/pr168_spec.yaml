claim_identity:
  claim_id: C-PR168-ACCEL-KINEMATIC-SOURCE-BASIS
  allowed_statement: >-
    Within the frozen linear, aligned-scalar, fixed-operator,
    thermodynamic-temperature source contract, acceleration and kinematic
    drives occupy the same ell=1 inhomogeneous source basis and have no
    independent direct ell>=2 source at first order. This conditional exact
    mechanics result may authorize removal of the unsupported active
    non-geodesic B_accel API only after an exception-free CAS_4AXIS_PASS and
    a complete active-consumer migration.
  forbidden_promotions:
    - observational or data result
    - unrestricted frequency-spectrum degeneracy
    - finite-k or full-transfer equivalence
    - universal non-geodesic A2=0 statement
    - native solver or transfer validation
    - cosmological anisotropy, geometry, or family identification
    - evidence, posterior, detection, or remediation rescue

physics_domain:
  metric_signature: (-,+,+,+)
  photon_direction: p^a = E (u^a + e^a)
  frame: fixed u^a frame with an aligned scalar ell-amplitude convention
  perturbative_order: first order in acceleration and kinematic amplitudes
  spatial_limit: homogeneous long-wavelength source, k_eff = 0
  spectral_mode: thermodynamic temperature mode G(E) = -E d f0/dE
  evolution_operator: fixed while source amplitude is redistributed
  direct_source_only: true
  assumptions:
    - ell_max >= 2
    - acceleration and kinematic amplitudes use the same conformal-rate normalization
    - both mechanisms are projected onto the same aligned ell=1 basis vector
    - the source comparison holds damping, collisions, initial data, and all other sources fixed
  exclusions:
    - finite-k free streaming
    - operator or damping changes between mechanisms
    - independent shear and higher-multipole initial data in any total-response claim
    - polarization and anisotropic collision sources
    - y, mu, bandpass, or other non-thermodynamic spectral distortions
    - second and higher order boost or acceleration products
    - a general three-direction or m-resolved alignment theorem

physical_bridge:
  status: conditional_projection_not_independent_derivation
  source_vector_implementation: htt/bass/transport/dipole_driven_hierarchy.py
  source_authority:
