      sha256: d500ffeef60f1f006393b7b2a21823b51bc4c9c9b41b7fb983f0393ce800217e
      supports: geodesic u_dot=0 scope and intrinsic/peculiar temperature-dipole non-separation
    - path: docs/audits/mes_primary_sources/PROVENANCE_M4b.md
      sha256: 19779be175d8f05873ead2896be3789dadf2c6df99d7acb62d2fa560f246f7be
      supports: refutation of the unsupported in-house non-geodesic acceleration triple
  qualification: >-
    The CAS statement verifies the registered projected source algebra. It is
    not a new covariant non-geodesic derivation and does not use MESa as
    authority for a nonzero acceleration kernel.

cas_contract:
  path: docs/generated/pr168_cas/CAS_CONTRACT_PR168_ACCEL_KINEMATIC_SOURCE_BASIS.json
  schema: htt.cas_contract.v2
  contract_id: CAS-PR168-ACCEL-KINEMATIC-SOURCE-BASIS-001
  statement_class: scalar_algebra
  preregistered_exceptions: []
  required_axes: [wolfram_xact, sympy, sage_singular, lean]
  missing_axis_outcome: CAS_BLOCKED
  required_aggregate: CAS_4AXIS_PASS
  result_blinding: required_until_adjudication
  exact_check_keys:
    - source_column_collinearity
    - combined_source_invariance
    - direct_support_only_ell1
    - normalized_thermodynamic_basis
    - rank_one_minor_vanishes
    - streaming_negative_control_nonzero
    - operator_change_negative_control_distinct
    - second_order_quadrupole_negative_control
  exact_computed_keys:
    - acceleration_source_test
    - kinematic_source_test
    - combined_source_test
    - normalized_basis_test
    - rank_upper_bound
    - direct_ell_ge_2_projection
    - streaming_ell2_negative_control
    - operator_change_responses
    - second_order_quadrupole_coefficient
  decisive_falsifier: >-
    Under the frozen definitions, any nonzero cross-column residual, any
    independent direct ell>=2 source at first order, any unequal normalized
    thermodynamic basis, or any axis/assumption mismatch is decisive failure.
    Missing tools are CAS_BLOCKED, never an exception pass.

