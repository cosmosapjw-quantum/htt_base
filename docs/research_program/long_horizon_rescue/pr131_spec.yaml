named_system:
  module: htt/src/common/omk_near_flrw_expansion.py
  frame: expansion-normalized orthonormal LRS frame (PR-125 registered convention family)
  variables: 'Sigma (shear-to-expansion), K (curvature parameter; KS mirror carries K < 0)'
  expansion_parameter: K
  background: 'flat FLRW fixed point Sigma = K = 0 with q0 = (1+3w)/2, w fixed symbolically'
  rhs:
    q: 'q = (1+3w)(1-K)/2 + (3/2)(1-w) Sigma^2'
    dSigma_dN: 'dSigma/dN = -K - (Sigma/2)[(1+3w)K + 3(1-w)(1-Sigma^2)]'
    dK_dN: 'dK/dN = 2K(q + Sigma)'
  class_mirror: >-
    the Bianchi III (hyperbolic 2-plane, epsilon = +1, K > 0) and
    Kantowski-Sachs (spherical 2-plane, epsilon = -1, K < 0) branches
    are the SAME reduced RHS with the signature absorbed into the sign
    of K; the mirror is a separated sign convention, never a new
    coefficient.
  legacy_alignment:
    module: htt/obsstat/egs3_omega_k_reopening.py
    note: conventions identical to the rev-r184 OMK-REOPEN registration; that module is not edited

coefficients:
  kappa_exact: '-2/(5+3w)'
  kappa_reference_values: {dust: '-2/5', radiation: '-1/3'}
  c2_construction: >-
    invariance equation dh/dK * F_K(h(K), K) = F_Sigma(h(K), K) for
    h(K) = kappa K + c2 K^2 + O(K^3), solved exactly order by order
  c2_exact: 'kappa*(g/2 - 2*kappa)/(2*g - s) with g = 1+3w, s = -(3/2)(1-w)'
  c2_reference_values: {dust: '-26/175', radiation: '-1/9'}
  vacuum_anchor: 'exact stationarity of (Sigma, K) = (-1/2, 3/4) as a system check (not part of the expansion)'

two_path_contract:
  path_a: constraint-surface invariance equation on the registered reduced RHS (sympy exact)
  path_b: >-
    metric-level Einstein reduction: diagonal LRS metric with 2-plane
    signature epsilon, Christoffel/Ricci computed symbolically, perfect
    fluid p = w rho, expansion-normalized variables constructed from
    H1, H2, and the 2-curvature; the reduced RHS must equal path_a
    EXACTLY on the constraint surface, for both epsilon branches
  rule: coefficient claims require BOTH paths to agree exactly; one-path claims are rejected

finite_difference_contract:
  engine: mpmath odefun (Taylor) at 30 significant digits
  trajectories: >-
    start on the LINEAR-ONLY slaved seed Sigma0 = kappa K0 at
    K0 = 1e-8 (independent of c2) and integrate forward; K0 sits three
    decades below the smallest probe because the linear seed's
    off-manifold transient contaminates the order-2 ratio by
    ~ |c2| K0^2 (K/K0)^(s/g) / K^2, provably below every envelope at
    this K0 (at K0 = 1e-6 the radiation transient would exceed the
    smallest-probe envelope — diagnosed pre-registration, not patched
    post-hoc).
  probes_K: ['1e-5', '1e-4', '1e-3']
  branches: 'BOTH signs: Bianchi III (K > 0) and the KS mirror (K < 0, probes at -|K|)'
  w_values: ['0', '1/3']
  order1_rule: '|Sigma/K - kappa| <= 5*K + |c2|*K*(3/2) at each probe (envelope, no fitting)'
  order2_rule: '|(Sigma - kappa K)/K^2 - c2| <= 5*K at each probe (envelope, no fitting)'
  preregistration: >-
    the envelopes above are preregistered here and never widened; a
    plateau that misses the analytic coefficient under the envelope is
    the roadmap kill condition (shrink domain or abandon).

singular_map:
  entries:
    - w: '-5/3'
      mechanism: order-1 resonance = kappa pole 2+q0 = 0 = eigenvalue collision lambda_K = lambda_Sigma
    - w: '-7/9'
      mechanism: order-2 resonance 2*lambda_K = lambda_Sigma (c2 denominator factor 9w+7)
    - w: '-3/5'
      mechanism: order-3 resonance 3*lambda_K = lambda_Sigma (c3 denominator factor 5w+3)
    - w: '-1/3'
      mechanism: lambda_K = 0 (curvature mode marginal; expansion parameter degenerates)
    - w: '1'
      mechanism: lambda_Sigma = 0 (transient marginal; slaving decay vanishes)
  resonance_family: >-
    order-n resonance n*lambda_K = lambda_Sigma at w_n = -(2n+3)/(6n-3)
    for n >= 1; the family lies in [-5/3, -1/3) (w_1 = -5/3 is itself
    the order-1 member) and accumulates at the marginal boundary -1/3,
    so the ENTIRE family is outside the declared open domain. The
    domain validator decides family membership EXACTLY (monotone
    inversion n(w) = 3(w-1)/(2(3w+1)) in Fractions), never by a
    truncated finite scan.
  higher_order_note: >-
    c3 = -2(81w^4+324w^3+594w^2+460w+141)/((3w+5)^3 (5w+3)(9w+7))
    (dust -94/875, radiation -2/27) is computed as the envelope-sizing
    check; the claimed expansion coefficients are kappa and c2 only.
  declared_domain: 'w in (-1/3, 1) OPEN at both ends'
  rule: >-
    every singular entry must lie OUTSIDE the declared domain, verified
    exactly; an in-class singularity entering the declared domain
    triggers the roadmap exit rule (shrink or abandon).

negative_scan:
  targets:
    - htt/src/common/omk_near_flrw_expansion.py
    - docs/generated/pr131_captions.json
  forbidden_patterns:
