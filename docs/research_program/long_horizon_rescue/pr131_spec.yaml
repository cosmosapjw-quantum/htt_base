acceptance_and_kill_switches:
  - both symbolic paths produce the identical reduced RHS and identical kappa/c2 exactly (epsilon both branches)
  - kappa and c2 match the reference dust/radiation values exactly
  - the FD plateau lands inside the preregistered envelope at every probe for every registered w (miss -> kill rule)
  - every singular-map entry is exactly outside the declared open domain
  - the vacuum anchor is exactly stationary and the FLRW/dimensional/sign checks pass
  - every registered mutation executes and is killed
  - all 102 remediation findings remain OPEN

