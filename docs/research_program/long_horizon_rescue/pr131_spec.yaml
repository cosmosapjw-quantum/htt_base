    active PR-131 surfaces must never carry a global-equality,
    ceiling-recovery, or observational-value reading of the
    class-conditional asymptotic coefficients.

mutation_registry:
  - mutation_id: wrong_kappa_sign
    kill_rule: kappa = +2/(5+3w) fails the exact order-K invariance identity kappa*(lambda_K - lambda_Sigma) = -1, enforced by the SAME validator the production coefficient path calls
  - mutation_id: global_equality_language
    kill_rule: a caption asserting the coefficient without fixed q/w fails the real language lint
  - mutation_id: ceiling_recovery
    kill_rule: a ceiling-recovery claim (citing the historical finite-ceiling table as restored by this PR) is rejected by the claim validator
  - mutation_id: fitted_line_as_derivation
    kill_rule: a plateau report whose value disagrees with the analytic coefficient under the preregistered envelope is rejected by the SAME validator the production FD build feeds its measured ratios through (a fit is never a derivation)
  - mutation_id: singular_domain_smuggling
    kill_rule: a declared domain containing a singular-map entry is rejected by the domain validator
  - mutation_id: path_disagreement
    kill_rule: a tampered path-B reduced RHS breaks the exact two-path equality gate

