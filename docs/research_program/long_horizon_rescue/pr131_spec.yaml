claim_identity:
  claim_id: C-PR131-OMK-NEARFLRW
  claim_text: >-
    On the NAMED LRS Bianchi III reduced system (expansion-normalized
    orthonormal LRS frame; variables Sigma, K; single fluid with fixed
    w; q = (1+3w)(1-K)/2 + (3/2)(1-w) Sigma^2 exact; KS mirror as the
    separated class-signature convention), the near-FLRW slaved-mode
    expansion Sigma = kappa K + c2 K^2 + O(K^3) has exact
    class-conditional asymptotic coefficients kappa = -2/(5+3w) and
    c2 = kappa (g/2 - 2 kappa)/(2g - s) with g = 1+3w and
    s = -(3/2)(1-w) (dust -26/175, radiation -1/9), derived by TWO
    independent symbolic paths (constraint-surface invariance equation
    AND metric-level Einstein reduction) and confirmed by an
    independent arbitrary-precision finite-difference plateau as
    K -> 0 under a preregistered envelope. The singular/zero-denominator
    boundary map is exact: w = -5/3 (kappa pole = eigenvalue
    collision), w = -7/9 (second-order resonance 2*lambda_K =
    lambda_Sigma), w = -1/3 (lambda_K = 0 marginal), w = 1
    (lambda_Sigma = 0 marginal); the declared domain w in (-1/3, 1)
    open contains none of them. Class-conditional asymptotic
    coefficient only — never a global equality without fixed q, never
    a finite-ceiling recovery, never an observational curvature/shear
    value.
  domain: named_lrs_biii_ks_reduced_system_single_fluid_fixed_w_only
  frame: expansion_normalized_orthonormal_lrs_frame_pr125_registered
  claim_level_scheme: roadmap_rescue_v1
  claim_level: C2

