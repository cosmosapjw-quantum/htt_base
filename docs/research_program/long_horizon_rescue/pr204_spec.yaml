author_gates:
  mechanics: PASS_REUSE_PR177_IDENTICAL_PIPELINE
  identification: PASS_EXACT_VALIDATED_SUPPORT
  calibration: PASS_RELEASE_SIMULATION_RANK_ONLY
  provenance: PASS_FROZEN_SOURCE_IDENTITIES
  independence: OPEN

terminal: EVIDENCE_READY_RELEASE_SUMMARY_RAW_QE_BLOCKED
forbidden_requests:
  - anisotropy_detection
  - physical_modulation_amplitude
  - sky_power_measurement
  - raw_qe_reproduction
  - pre_qe_injection_coverage
  - bianchi_family_identification
  - publication_use

kill_switches:
  - any support outside integer 41 through 762
  - any endpoint inclusion or coordinate-frame drift
  - release simulation count other than 400
  - controlled, raw, or mask-change rank drift
  - candidate or detection promotion of the PR-177 null
  - missing or shortened raw-QE blocker inventory
  - treating released-kappa post-processing as pre-QE injection response
  - accepting a future positive raw-QE receipt without its separate validator
