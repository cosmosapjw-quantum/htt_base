acceptance_and_kill_switches:
  - the exact-selection mock draws from the real random density per cap and matches the survey selection exactly
  - alpha and the nuisance amplitude are re-fit on every mock, never fixed
  - the fast covariance tier is validated against a smaller high-realism tier
  - the clustering/kinematic/selection component confusion matrix demonstrates the components are confounded
  - because the official DESI validation mocks are absent, causal attribution is abandoned and only the survey-conditional null is reported
  - every registered mutation executes and is killed
  - all 102 remediation findings remain OPEN

