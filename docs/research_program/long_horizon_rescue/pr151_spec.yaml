claim_identity:
  claim_id: C-PR151-DESI-EXACT-SELECTION
  claim_text: >-
    A DESI DR1 BGS number-count dipole mock that matches the survey selection
    EXACTLY by drawing from the real random catalogue density per cap (NGC and
    SGC), modulated by a linear-clustering Gaussian field and optional kinematic
    and selection-systematic injections, then Poisson-sampled to the data count.
    On EVERY mock the random-to-data normalisation alpha and a systematic
    nuisance amplitude are RE-FIT by the same estimator (never fixed). A fast
    covariance tier over many cheap mocks is validated against a smaller
    high-realism tier. A clustering / kinematic / selection component confusion
    matrix injects each component at a known amplitude and reports how the SAME
    number-count dipole estimator attributes it, DEMONSTRATING the three are
    confounded. Because the official DESI DR1 validation mocks (1000 EZmocks +
    25 AbacusSummit) are NOT on disk, causal attribution is ABANDONED per the
    kill rule and only the DESI-survey-conditional null of the observed dipole
    is reported. This is a DESI-survey-conditional estimator/null diagnostic at
    C3 only; no clustering-dominated causal attribution, no anisotropy, geometry,
    or Bianchi-family claim. The two CF4 P0s are untouched and stay OPEN.
  domain: desi_dr1_bgs_number_count_dipole
  frame: binds_pr134_estimand_pr135_finite_null_number_count_dipole
  claim_level_scheme: roadmap_rescue_v1
  claim_level: C3

