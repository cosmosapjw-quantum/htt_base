claim_identity:
  claim_id: C-PR151-DESI-OFFICIAL-MOCK-RANK
  claim_text: >-
    Measure the DESI DR1 BGS_BRIGHT-21.5 weighted number-count dipole over
    0.1 <= z <= 0.4 and compare its amplitude with 1000 public DESI DR1 EZmock
    FFA realizations using an observation-inclusive finite rank. Every mock uses
    its own authenticated random-index-0 NGC/SGC selection window at NSIDE=64
    and re-fits alpha and the registered nuisance amplitude. Twenty-five
    AbacusSummit FFA mocks are a separate validation ensemble and are never
    pooled with EZmock. Random index 1 on a frozen 10-EZmock plus 5-Abacus subset
    quantifies single-random Monte-Carlo integration sensitivity. This is a
    concrete official-mock-conditioned consistency/tension result, not causal
    attribution, anisotropy evidence, geometry, or Bianchi-family identification.
  domain: desi_dr1_bgs_number_count_dipole
  frame: official_FFA_mock_conditioned_finite_null
  claim_level_scheme: roadmap_rescue_v1
  claim_level: C3

