claim_boundary: >-
  Scalar identities are provenance-authenticated. Exact external curvature
  closure is available only for the registered type-V construction; type I is
  definitionally flat in the repository's internal exact registry but is not
  counted as externally authenticated by this source table. Thus neither an
  eleven-type physical bridge nor a currently authenticated x_C-wide Buchert
  home is established.
