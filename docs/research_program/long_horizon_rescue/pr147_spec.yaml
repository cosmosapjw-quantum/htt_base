    silently dropped.
  apex_nonidentified_deg: 90
  effectively_unbounded_amplitude_kms: 2000

coverage:
  n_inject: 600
  seed: 20260722
  subsample: 1500
  family_conf: 0.95
  rule: >-
    the identified set is measured for GENUINE simultaneous coverage of a
    single injected realisation scored jointly across the depth shells with a
    Bonferroni per-shell confidence; every shell that undershoots the raw
    per-shell target is reported, never hidden, and the amplitude Rice-bias
    non-Gaussianity at noise-dominated depth is disclosed.

mesh_sensitivity:
  refine_points: 5
  max_endpoint_shift_kms: 50
  rule: >-
    the continuous-nuisance mesh is refined and the identified-set amplitude
    endpoints must not move more than the reported tolerance, else the mesh is
    declared insufficient.

