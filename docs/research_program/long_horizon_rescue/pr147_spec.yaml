acceptance_and_kill_switches:
  - the nuisance box matches its committed content address before the observed result
  - the depth-resolved flow identified set over the flow-plus-monopole estimand is computed and classified; the honest outcome is bounded at every shell but widening with depth
  - the continuous optimiser is the authority and the grid vertex enumeration is enforced as a kill switch (grid inside continuous)
  - the mesh sensitivity checks the continuous-optimiser restart stability and reports the grid-minus-continuous gap
  - the genuine simultaneous coverage (one shared realisation scored jointly across shells) is measured with Imbens-Manski widening; every shell undershooting the raw Bonferroni target is reported and the Rice-bias shortfall disclosed
  - the GLS-versus-OLS weighting difference under a common injected field is predicted (NOT the minimum-variance ideal-window estimator)
  - a mis-specification diagnostic shows omitting the monopole manufactures an artificial unbounded topology, and a plausible-unbounded calibration prior yields an unbounded status
  - the two CF4 P0s stay OPEN with remediation-candidate receipts (no closure before PR-157)
  - every registered mutation executes and is killed
  - all 102 remediation findings remain OPEN

