claim_identity:
  claim_id: C-PR147-IDENTIFIED-SET
  claim_text: >-
    A frozen nuisance box (distance-scale calibration, reconstruction /
    velocity-observable choice, nonlinear-velocity dispersion) over the
    flow-plus-monopole estimand (the ell=0 monopole is ALWAYS fit so a radial
    calibration nuisance cannot alias into the ell=1 bulk flow), content-
    addressed by a committed box hash before the observed result, is swept and
    the depth-resolved CF4 bulk-flow vector is returned as an IDENTIFIED SET per
    distance shell — its amplitude interval and apex cone — classified bounded
    / empty / unbounded / undetermined (binding the PR-136 set-status
    vocabulary). The honest outcome is that the identified set is BOUNDED at
    every depth shell but its width and apex cone GROW with depth (a near-point
    nearby shell widening to a several-hundred-km/s far shell), so no favourable
    endpoint is ever taken as a point estimate and the set containing zero is
    never read as isotropy. A mis-specification diagnostic separately shows that
    omitting the monopole while sweeping the calibration manufactures an
    artificial direction-undetermined / effectively-unbounded topology — which
    is why the monopole is always fit — and a plausible-unbounded scenario
    shows an unbounded distance-scale calibration does drive an unbounded
    status. The identified-set endpoints use a CONTINUOUS optimiser as the
    authority with a GRID vertex enumeration cross-check enforced as a kill
    switch, the mesh sensitivity and depth / window sensitivity are reported,
    the GENUINE simultaneous coverage of the set (a single injected realisation
    scored jointly across the shells) is measured under Imbens-Manski widening
    with a Bonferroni family-wise note (binding PR-137), and the GLS-versus-
    OLS estimator difference under a common injected field is predicted. This
    is identified-region coverage mechanics at C3 only; the two CF4 P0s stay
    OPEN with remediation-CANDIDATE receipts, closure impossible before the
    PR-157 adjudication. No anomaly or global-tilt claim is produced.
  domain: cf4_group_peculiar_velocity_identified_sets
  frame: binds_pr136_identified_set_pr137_coverage_pr145_estimators_pr146_simulator
  claim_level_scheme: roadmap_rescue_v1
