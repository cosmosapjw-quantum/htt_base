  adjudication: >-
    Implement the mapper's raw-catalogue affine trace coefficient, the
    harness review's deterministic write/check and explicit missing-authority
    receipts, the statistics review's fixed H0/radius/diameter convention and
    response/covariance gates, and the claim review's C3 internal ceiling.
    The legacy beta closure is not an admissible response bridge.

claim:
  mandatory_core: >-
    Raw-CF4 affine-divergence measurement that is structurally distinct from
    a bulk-flow translation and a constant radial monopole, but is not immune
    to shared leakage.  Any q comparison is response-, frame-, window-, and
    covariance-conditional.
  allowed_terminal_results:
  - CONSERVATIVE_CHANNEL_FALSIFIER
  - CONSERVATIVE_CHANNEL_NOT_FALSIFIED
  - NON_INFORMATIVE_Q_RESPONSE_UNAVAILABLE
  - NON_INFORMATIVE_CROSS_CHANNEL_COVARIANCE_UNIDENTIFIED
  - NON_INFORMATIVE_DIVERGENCE_RESPONSE
  - ABSTAIN_SOURCE_AUTHORITY
  interpretation: >-
    A terminal result is an internal channel falsifier, not a detection,
    significance, acceleration measurement, global-tilt inference,
    cosmological-anisotropy result, family identification, or transfer
    validation.  NON_INFORMATIVE is a successful reproducible scientific
    result when the registered authority or identifiability gate requires it.

