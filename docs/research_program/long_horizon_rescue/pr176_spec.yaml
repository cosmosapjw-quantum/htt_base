falsifiers:
- id: F-PR176-BULK-AS-DIVERGENCE
  condition: a bulk-flow amplitude or apex is reported as theta
- id: F-PR176-MONOPOLE-IMMUNITY
  condition: structural distinction is described as leakage immunity
- id: F-PR176-H0-FIT
  condition: H0 and theta are estimated from the same radial mean response
- id: F-PR176-BETA-CLOSURE
  condition: the legacy beta dimensional closure is used as measured divergence
- id: F-PR176-Q-UNITY
  condition: either signed q response bridge is set to unity or copied from the other
- id: F-PR176-COVARIANCE-REUSE
  condition: PR-148 covariance is reused or relabeled as matched divergence-q covariance
- id: F-PR176-INDEPENDENCE
  condition: nested-radius or cross-channel independence is assumed
- id: F-PR176-NONINFORMATIVE-PROMOTION
  condition: missing response or covariance is promoted to a point estimate or significance
- id: F-PR176-RAW-RECONSTRUCTION
  condition: Vpds, Vpwf, or Vpec is used as truth
- id: F-PR176-OVERCLAIM
  condition: output claims detection, acceleration, cosmological anisotropy, geometry, family, or transfer validation

forbidden_claims:
- scalar theta apex or direction
- detection or significance
- apparent or global acceleration measurement
- global tilt or cosmological anisotropy
- Bianchi family or geometry identification
- native or external transfer validation
- immunity to monopole or selection leakage
- physical covariance validation from self-consistency injections
