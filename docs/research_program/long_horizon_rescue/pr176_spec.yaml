catalogue_domain:
  frame: published_CF4_CMB_frame_V3k
  distance: published_CF4_group_Dist_Mpc
  velocity_definition: v_radial=V3k-H0_fixed*Dist
  fixed_h0_km_s_mpc: 74.6
  nonlinear_dispersion_km_s: 250.0
  subsample_rows: 3000
  subsample_rng: numpy_PCG64
  subsample_seed: 20260718
  cumulative_physical_radius_mpc:
  - 75.0
  - 100.0
  - 125.0
  primary_radius_mpc: 100.0
  harmonic_scale_convention: lambda_physical=2*catalogue_ball_radius
  no_axis_scan: true
  raw_reconstruction_values_forbidden_as_truth:
  - Vpds
  - Vpwf
  - Vpec

divergence_estimand:
  name: theta_affine_trace
  units: km_s_Mpc
  relation: >-
    v_radial = B dot n + M + (Dist/3)*theta + n_i S_ij x_j + epsilon,
    where S is symmetric trace-free and x=Dist*n.
  coefficient_order:
  - Bx
  - By
  - Bz
  - M
  - theta
  - Sxx_minus_Szz
  - Syy_minus_Szz
  - Sxy
  - Sxz
  - Syz
  design_columns:
  - nx
  - ny
  - nz
  - '1'
  - Dist/3
  - Dist*(nx^2-nz^2)
  - Dist*(ny^2-nz^2)
  - 2*Dist*nx*ny
  - 2*Dist*nx*nz
  - 2*Dist*ny*nz
  fit: generalized_least_squares
  within_channel_covariance: >-
    PR-146 Gorski radial peculiar-velocity covariance plus the registered
    per-group distance/noise variance.  This is a model-conditional
    propagation covariance, not an independently validated physical
    covariance and not a q-channel joint covariance.
  rank_tolerance: 1.0e-10
  minimum_singular_value_ratio: 1.0e-8
  maximum_standardized_condition_number: 1.0e4
  minimum_theta_retained_information: 0.05
  exact_h0_alias: theta_hat(H0+delta_H)=theta_hat(H0)-3*delta_H
  h0_policy: >-
    H0 is fixed from PR-145 and may not be estimated from the same radial
    mean response.  The exact alias is tested as a structural fixture.
  scalar_direction_policy: theta_has_no_apex
  antisymmetric_policy: n_transpose_Omega_n_is_identically_zero

channel_injections:
  deterministic_exact:
    tolerance_relative: 1.0e-9
    cases:
    - translation_only
    - radial_monopole_only
    - divergence_only
    - trace_free_shear_only
    - combined_affine_channels
    - antisymmetric_rotation_zero_radial_response
    - h0_alias
  covariance_self_consistency:
    rng: numpy_PCG64
    draws_per_radius: 5000
    seed_by_radius:
      '75': 176000
      '100': 176001
      '125': 176002
    confidence_level: 0.95
    accepted_component_coverage_interval:
    - 0.93
    - 0.97
    wilson_interval_must_contain_nominal: true
    interpretation: >-
      Coefficient-space draws validate interval propagation under the same
      fitted covariance.  They do not independently validate the Gorski
      covariance, the physical velocity model, or any cosmology.

q_response_bridges:
  required:
  - id: R_lh_qs1
    source_equation: Rlhqs1
    description: signed_nearly_flat_tilted_frame_response
    authenticated_for_cf4_window: false
  - id: R_lh_qs2
    source_equation: Rlhqs2
    description: signed_EdS_scale_dominant_response
    authenticated_for_cf4_window: false
  no_unity_default: true
  no_shared_calibration_default: true
  legacy_beta_closure_is_forbidden: true
  formula_projection_only: >-
    The analytic coefficients may be recorded for convention audit, but q
    point estimates, intervals, signs, detections, or falsifier decisions are
    null until the corresponding signed CF4-window response is authenticated.

dependence_contract:
  pre_pr155: true
  pr148_covariance_reuse_forbidden: true
  matched_divergence_q_joint_covariance_available: false
  within_divergence_scales: >-
    Use Bonferroni simultaneous marginal intervals and interval arithmetic;
    no independence between nested catalogue balls is claimed.
  future_cross_channel_contrasts: 6
  future_bound: >-
    For each registered contrast, bound the unknown covariance by
    abs(cov_xy)<=sqrt(var_x*var_y), then apply Bonferroni across all six.
  informative_gate: >-
    Both signed q response bridges and a valid matched cross-channel
    covariance or finite conservative interval must be available.  A copied,
    resealed, or semantically mismatched PR-148 covariance is invalid.

terminal_routing:
  order:
  - source_authority
  - divergence_rank_and_response
  - signed_q_response_authority
  - cross_channel_covariance_or_conservative_bound
  - conservative_falsifier
  rules:
  - when: source_authority_fails
    status: ABSTAIN_SOURCE_AUTHORITY
  - when: any_registered_radius_fails_rank_condition_or_theta_information
    status: NON_INFORMATIVE_DIVERGENCE_RESPONSE
  - when: either_signed_q_response_bridge_is_unavailable
    status: NON_INFORMATIVE_Q_RESPONSE_UNAVAILABLE
  - when: q_response_exists_but_cross_channel_dependence_is_unidentified
    status: NON_INFORMATIVE_CROSS_CHANNEL_COVARIANCE_UNIDENTIFIED
  - when: conservative_simultaneous_interval_excludes_registered_null
    status: CONSERVATIVE_CHANNEL_FALSIFIER
  - when: conservative_simultaneous_interval_contains_registered_null
    status: CONSERVATIVE_CHANNEL_NOT_FALSIFIED
  expected_pre_pr155_route: NON_INFORMATIVE_Q_RESPONSE_UNAVAILABLE

