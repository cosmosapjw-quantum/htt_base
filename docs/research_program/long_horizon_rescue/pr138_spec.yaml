claim_identity:
  claim_id: C-PR138-SBC-PPC
  claim_text: >-
    Posterior draws are content-addressed to the normalized prior, the
    likelihood, the data, the config, the transfer, and the sampler
    diagnostics (a lineage hash); a PPC or SBC run on a posterior whose
    lineage does not verify, or whose posterior is invalid (non-finite
    variance), is refused. Simulation-based calibration (Talts et al.,
    arXiv:1804.06788) tests rank uniformity of the prior draw among the
    posterior draws: a known-GOOD (exact conjugate) model passes the
    chi-square rank-uniformity test, and known-BAD models (deflated /
    inflated posterior variance) FAIL and are reported inadequate.
    Replicated-data posterior-predictive checks compute Bayesian
    p-values for MULTIPLE PRE-REGISTERED (content-addressed, FROZEN)
    discrepancies; the discrepancy set is fixed before the data and can
    NEVER be swapped after a failure. A caller-supplied point prediction
    or p-value is NEVER accepted as a PPC receipt, and the old plug-in
    residual stays a SEPARATE residual_check type (never conflated with
    a PPC). A PPC pass is model/transfer-conditional predictive adequacy,
    NOT model truth; a failure is an inadequacy result, not a
    threshold-tuning opportunity; SBC is COMPUTATION calibration, not
    observed-fit validation. If SBC, the sampler diagnostics, or a frozen
    PPC fail, the status is inadequate/blocked and no evidence claim is
    made. Model/transfer-conditional predictive-adequacy mechanics only
    — no detection.
  domain: conjugate_gaussian_sbc_ppc_toy_only
  frame: binds_pr122_receipt_pr134_estimand_pr137_coverage
  claim_level_scheme: roadmap_rescue_v1
  claim_level: C2

scope_and_non_goals:
  caller_supplied_prediction_as_ppc_receipt: forbidden
  discrepancy_swap_after_failure: forbidden
  ppc_on_invalid_posterior: forbidden
  ppc_pass_as_model_truth: forbidden
  sbc_as_observed_fit_validation: forbidden
  residual_check_conflated_with_ppc: forbidden
  remediation_disposition_change: forbidden

remediation_state_contract:
  path: docs/codex_handoff/research_remediation_state.yaml
  sha256: f16d9754828bb32ae4cef92f585af82ae7fd1caa2687a7b4144bc1e942328dd9
