data_scope:
  pr4_data_work: skip_entirely_by_user_scope
  pr4_commands_run_required: 0

model:
  module: htt/src/common/sbc_ppc.py
  family: 'conjugate Gaussian: theta ~ N(0, tau2); y_i ~ N(theta, sig2), i=1..n'
  prior_tau2: '4'
  likelihood_sig2: '1'
  n_obs: 8
  exact_posterior: 'theta | y ~ N(post_var * sum(y)/sig2, post_var), post_var = 1/(1/tau2 + n/sig2)'
  known_good: 'var_scale = 1 (exact posterior)'
  known_bad: 'var_scale in {1/2, 2} (deflated / inflated posterior variance)'

sbc:
  reference: Talts et al. 2018 (arXiv:1804.06788)
  bit_generator: PCG64
  seed: 20260720
  n_simulations: 3000
  n_posterior_draws: 20
  uniformity_test: chi_square_on_binned_rank_histogram
  n_bins: 7
  n_bins_note: 'n_bins must divide n_draws+1 = 21 (Talts-style coarser binning; 7 bins of 3 ranks each, dof = 6)'
  pass_pvalue_floor: '0.01'
  rule: >-
    rank r = #{posterior_draw < theta0} over L draws; under a calibrated
    model+sampler r is uniform on {0..L}; the chi-square p-value on the
    rank histogram must exceed 0.01 for known-good and fall below it for
    known-bad.

ppc:
  seed: 20260721
  n_posterior_predictive: 5000
  frozen_discrepancies: [sample_variance, sample_max, sample_range]
  bayesian_p_two_sided_reject: '0.005'
  known_bad_fit_sig2: '1/9'
  rule: >-
    for each frozen discrepancy T, the Bayesian p-value is
    P(T(y_rep) >= T(y_obs)) over posterior-predictive draws (theta from
    the posterior, y_rep from the posterior predictive), with the
    posterior lineage MANDATORY and verified. The discrepancy set is
    content-addressed and frozen before the data. A PPC on the known-GOOD
    model passes (no p-value below 0.005 or above 0.995); a known-BAD
    mis-specified fitting model (fit_sig2 = 1/9, under-dispersed) is
    DEMONSTRATED to produce extreme p-values (all near 0) and the
    inadequate_ppc_extreme verdict.

residual_check:
  rule: >-
    the old plug-in residual (standardized residual r = (y - theta_hat)/
    sig) is a SEPARATE residual_check type, explicitly labeled NOT a PPC;
    it is never accepted as a posterior-predictive receipt.

negative_scan:
  targets:
    - htt/src/common/sbc_ppc.py
    - docs/generated/pr138_captions.json
  forbidden_patterns:
    - 'ppc pass proves the model'
    - 'caller p-value accepted as ppc'
    - 'swapped the discrepancy after'
    - 'sbc validates the observed fit'
    - 'residual is the ppc'
  rule: >-
    active PR-138 surfaces must never present a PPC pass as model truth,
    accept a caller p-value as a PPC, swap a discrepancy after failure,
    call SBC an observed-fit validation, or conflate the residual with
    the PPC.

mutation_registry:
  - mutation_id: caller_prediction_as_ppc
    kill_rule: a caller-supplied point prediction or p-value offered as a PPC receipt is rejected by the receipt-type guard
  - mutation_id: discrepancy_swap_after_failure
    kill_rule: replacing a frozen discrepancy (content-address change) after a failure is rejected by the frozen-discrepancy registry
  - mutation_id: ppc_on_invalid_posterior
    kill_rule: running a PPC on a posterior with non-finite variance is rejected by the posterior-validity guard
  - mutation_id: known_bad_sbc_passes
    kill_rule: a known-bad (miscalibrated) model that claims to pass SBC is refuted by the rank-uniformity chi-square test
  - mutation_id: lineage_mismatch
    kill_rule: a posterior draw whose lineage hash does not match its declared inputs is rejected by the lineage verifier
  - mutation_id: residual_as_ppc
    kill_rule: labeling the plug-in residual_check a posterior-predictive check is rejected by the type separation guard

artifact_contract:
  outputs:
    - docs/generated/pr138_sbc_report.json
    - docs/generated/pr138_ppc_report.json
    - docs/generated/pr138_lineage.json
    - docs/generated/pr138_residual_check.json
    - docs/generated/pr138_captions.json
    - docs/generated/pr138_mutation_report.json
    - docs/generated/pr138_artifact_manifest.json
  check_policy: fresh_build_must_equal_disk_bytes

acceptance_and_kill_switches:
  - the known-good model passes the SBC rank-uniformity chi-square test and both known-bad models fail
  - the PPC computes Bayesian p-values for all frozen discrepancies and the known-good model is not extreme
  - the posterior draws are content-addressed and a lineage mismatch is rejected
  - a caller prediction as a PPC, a discrepancy swap after failure, and a PPC on an invalid posterior are all refused
  - the residual_check stays a separate type, never a PPC
  - every registered mutation executes and is killed
  - all 102 remediation findings remain OPEN

forbidden_output_language:
  - ppc pass proves the model
  - caller p-value accepted as ppc
  - swapped the discrepancy after
  - sbc validates the observed fit
  - residual is the ppc
  - shear detected
  - isotropy established
  - Bianchi geometry detected
  - Bianchi family identified
  - finding rescued
  - validated as native
