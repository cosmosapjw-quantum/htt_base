# -------------------------------------------------------------------------
# SPECIFICATION-FIRST registration (before any rederivation): the l=2
# covariant relation, the coefficient DIRECTION, and the domain.
# -------------------------------------------------------------------------
coefficient_specification:
  relation: 'a2 = kappa * Sigma * (1 + delta)'
  kappa_exact: '4/21'
  kappa_provenance: ETM ell=2 hierarchy coefficient (registered figure value; the relation direction, not the numeric, is under repair here)
  delta_domain: 'the derivative correction delta satisfies |delta| <= R with R = a3/a2 (H3 proxy), REQUIRING R < 1 for the two-sided inversion'
  direction: >-
    solving for Sigma INVERTS kappa: Sigma = a2 / (kappa * (1 + delta)).
    The coefficient therefore enters the bracket RECIPROCALLY (1/kappa =
    21/4), and the H3-conditional bracket is
    a2/(kappa*(1+R)) <= Sigma <= a2/(kappa*(1-R)) for 0 <= R < 1.
  reciprocal_wrong_legacy: >-
    the shipped egs2_shear_bracket.shear_lower uses Sigma_lo = a2 * kappa /
    (1+R) — the RECIPROCAL of the proved coefficient (finding
    N-THEORY-NT2-COEFFICIENT). It remains a true but weak lower bound
    (understates by (21/4)^2 = 441/16); its labeling as the proved relation
    was the defect. The legacy module stays byte-frozen as historical
    reproduction; active consumers must traverse the successor authority.
  upper_separation: >-
    the MES placeholder upper (C_up * a2, provenance placeholder) is NEVER
    merged with the H3-conditional theorem bracket into one proven
    interval; the authority publishes them as separate labeled objects.
  f_lo: 'F_lo = Sigma_lo^2 / x_max with Sigma_lo = a2/(kappa*(1+R))'
  x_max_exact: '925/100000000'
  x_max_provenance: >-
    the S2a combined-comparator F_shear ceiling used by BOTH the legacy
    bracket (egs2_fisher.X_MAX) and the audit PASS source
    (wolfram/egs3_bracket_constants.wls xmax); registered here so the
    before/after table shares one normalization — NOT the x_C interval
    ceiling 17/100.

remediation_target:
  finding_id: N-THEORY-NT2-COEFFICIENT
  decisive_falsifier: two engines must reproduce the printed coefficient (full endpoint agreement, not direction only) for randomized admissible inputs

remediation_state_contract:
  path: docs/codex_handoff/research_remediation_state.yaml
  sha256: f16d9754828bb32ae4cef92f585af82ae7fd1caa2687a7b4144bc1e942328dd9
  finding_count: 102
  required_scientific_status_counts: {OPEN: 102}
  rescued_count: 0
  disposition_changes: forbidden
  note: >-
    PR-128 supplies the decisive mechanics; the finding's scientific status
    stays OPEN here (status changes are owned by the remediation
    adjudication flow, not by this runner).

data_scope:
  pr4_data_work: skip_entirely_by_user_scope
  pr4_commands_run_required: 0

engines:
  required: [sympy_symbolic, fraction_numeric]
  agreement: >-
    both engines must agree on the bracket endpoints for every randomized
    admissible draw AND on the coefficient direction (the lower endpoint is
    strictly DECREASING in kappa — reciprocal entry; the legacy form is
    strictly increasing, which the direction check kills).

randomized_admissible_states:
  seeds: 64
  rule: >-
    seeded exact-rational draws of (Sigma > 0, delta) with R STRICTLY
    greater than |delta| (interior containment, never endpoint-saturated);
    compute a2 = kappa*Sigma*(1+delta); the bracket MUST contain Sigma for
    every draw on both engines with full-endpoint agreement.

rejection_domain:
  - a2 < 0 rejected
  - a3 < 0 rejected
  - R >= 1 rejects the two-sided inversion (no upper theorem endpoint)
  - kappa <= 0 rejected (zero/negative denominator)

downstream_invalidation:
  consumers:
    - path: htt/obsstat/egs2_shear_bracket.py
      role: reciprocal-wrong legacy producer (byte-frozen historical reproduction)
    - path: htt/obsstat/egs3_psd_cone.py
      role: cone-shell consumer of the legacy bracket
    - path: scripts/make_egs2_egs3_theorem_figures.py
      role: frozen-era theorem figure generator
    - path: scripts/run_egs2_experiments.py
      role: egs2 experiment runner
    - path: research_gates/egs2/tests/test_egs2_fisher_bracket.py
      role: legacy gate pinning the reciprocal-wrong values
    - path: tests/contracts/test_egs2_extension.py
      role: legacy contract pin
  policy: >-
    consumers are INVALIDATED by the before/after table (correct vs legacy
    endpoints, one shared normalization); regeneration of frozen-era
    results and result-pack flow-through is DEFERRED per the roadmap
    section-7 Checkpoint-075 note (LONG_HORIZON_RESCUE_PR_ROADMAP_20260714
    "PR-128 can change existing numbers, so do not flow them into the
    manuscript/result packs yet"). The legacy gates keep passing against
    the frozen module by design; the authority is the successor surface.
    The legacy TWO-SIDED object additionally fails upper-side containment
    for R > 5/12 under the registered relation (recorded in the table).

mutation_registry:
  - mutation_id: reciprocal_coefficient
    kill_rule: the legacy kappa-direct lower endpoint disagrees with the registered inversion on a direct witness (delta = 0 gives Sigma = a2/kappa, not a2*kappa); killed by the real bracket validator
  - mutation_id: merged_placeholder_interval
    kill_rule: an interval object merging the MES placeholder upper with the theorem bracket is rejected by the authority validator
  - mutation_id: coefficient_near_output_pick
    kill_rule: a kappa chosen to reproduce the legacy output through the corrected formula (kappa' = 21/4 = kappa * 441/16) fails the specification pin (kappa_exact is registered first)
  - mutation_id: zero_denominator
    kill_rule: R >= 1 or kappa <= 0 is rejected by the domain validator
  - mutation_id: single_engine_bracket
    kill_rule: a bracket claim carried by one engine is blocked by the real require_engine_consensus gate (disagreeing engines covered by tests)
  - mutation_id: direction_flip
    kill_rule: a claimed lower endpoint INCREASING in kappa fails the registered direction check on both engines

artifact_contract:
  outputs:
    - docs/generated/pr128_coefficient_authority.json
    - docs/generated/pr128_randomized_bracket_report.json
    - docs/generated/pr128_invalidation_table.json
    - docs/generated/pr128_mutation_report.json
    - docs/generated/pr128_artifact_manifest.json
  check_policy: fresh_build_must_equal_disk_bytes

acceptance_and_kill_switches:
  - both engines agree on every randomized bracket and the direction check
  - every admissible draw is contained in the bracket exactly (any violation blocks all NT2/F consumers)
  - the direct witness kills the reciprocal-wrong form
  - the MES placeholder upper is never merged with the theorem bracket
  - every registered mutation executes and is killed
  - all 102 remediation findings remain OPEN

forbidden_output_language:
  - proven interval including the MES placeholder
  - shear detected
  - isotropy established
  - Bianchi geometry detected
  - Bianchi family identified
  - finding rescued
  - validated as native

claim_cap_note: >-
  the audit ledger caps NT2 at "C1 qualitative nondegeneracy until
  repaired" for SCIENTIFIC claims; that cap stays in force (the finding
  remains OPEN). The roadmap_rescue_v1:C2 label here covers the
  GOVERNANCE mechanics (the registered relation's conditional algebraic
  bracket), not a repaired scientific claim; cross-scheme comparison is
  forbidden per PR-119 and no numeric endpoint enters any result pack.
