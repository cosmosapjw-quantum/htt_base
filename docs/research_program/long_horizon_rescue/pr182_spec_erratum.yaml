schema: htt.pr182.spec_erratum.v1
pr_id: PR-182
date: '2026-07-21'
erratum_scope: >-
  Pre-close corrections driven by the adversarial review lane
  (workflow wf_2dfb7c5c-fda; findings archived under
  docs/generated/pr182_reviews/). The frozen pr182_spec.yaml is retained
  byte-identical; this erratum supersedes the specific statements below.
  The CAS v1 run (CAS-PR182-PARITY-001, CAS_4AXIS_PASS) is superseded by
  a fresh v2 run under CAS-PR182-PARITY-002 after hash-changing axis
  repairs; v1 evidence is retained under docs/generated/pr182_cas/v1/
  and no v1 result is reused (PR-169 v1/v2 precedent).

corrections:
- id: E1_headline_relation_refuted
  supersedes: spec registry entry 'sign(EB/TB) = sign(x_h)' and the
    claim-statement sentence registering it as the future-native
    reference relation
  finding: PR182-P1-1 (CONFIRMED)
  correction: >-
    The card's own CAS-verified identities refute the roadmap-registered
    relation: I2 proves orientation reversal flips TB and EB together,
    so EB/TB is parity-EVEN and handedness-blind; I3 shows the
    conventional h (hence any x_h built from it) is orientation-even.
    The registry now records the relation as
    ROADMAP_REFERENCE_RELATION_REFUTED_BY_I2_I3 (a registered negative
    result) and registers a signed-component replacement candidate
    (sign(TB) or sign(EB) against a registered signed handedness
    template convention) as the future-native test vector.
- id: E2_citation_identifier
  supersedes: spec interpretation text '(Phys. Rev. D 96, 023532 lineage
    per roadmap)'
  finding: PR182-P1-2 / PR182-GOV-01 (CONFIRMED)
  correction: >-
    The roadmap carries no journal identifier; the correct reference is
    Pontzen & Challinor 2007, MNRAS 380, 1387 (arXiv:0706.2075),
    identifier transcribed from the public record and not verified
    against print. The attribution DIRECTION (confirmatory) is
    unchanged.
- id: E3_axisymmetric_family_scope
  supersedes: spec registry entry family label
    'axisymmetric_classes_I_V_VII0_III_IX'
  finding: PR182-P1-3 (CONFIRMED)
  correction: >-
    B == 0 applies to mirror-symmetric axisymmetric configurations only:
    honest scope is Bianchi I/V/IX plus the registered axis-aligned mode
    subsets of III/VII_0 (FB-2.2/FB-2.3 envelope). Generic VII_0/III
    spiral configurations are excluded; the per-family axisymmetry
    premise is verified by no CAS axis.
- id: E4_identity_scope_disclosures
  supersedes: spec claim-statement phrasing for I1/I4
  finding: PR182-P2-1 / PR182-GOV-05 (CONFIRMED)
  correction: >-
    What is CAS-verified for I1 is the m=0 (E,B)-doublet parity fact
    with the spin-2 reflection law P=diag(1,-1) taken as a premise;
    axisymmetry alone does not force B=0 — the mirror-fixed condition is
    load-bearing. I4's mu-only property is structural for this kernel;
    the informative content is the exact coefficient lists, and the
    boost chain covers the temperature Doppler kernel only (spin-2
    aberration not covered). 'Theorem' language is read as 'registered
    exact identity' at ceiling C1.
- id: E5_single_instance_orientation_check
  supersedes: spec I3 phrasing 'handedness is orientation-odd at the
    structure-constant level'
  finding: PR182-P2-2 (CONFIRMED)
  correction: >-
    The CAS axes verify one explicit improper instance
    (Lambda=diag(-1,1,1)); invariance of the sign under the full proper
    group is a disclosed premise, not a verified obligation.
- id: E6_harness_repairs
  supersedes: v1 axis sources and runner
  finding: PR182-H1/H2/H3/H4/H7 + GOV-03/GOV-04 (CONFIRMED)
  correction: >-
    v2 repairs: expected-exact-values enforced in the axis PASS gate and
    in --check; Wolfram computed values parsed and normalized (shared
    key formats identical across engines); Wolfram xAct load receipt
    enforced (exit 3 when absent); Lean computed values derived from the
    verified terms (no hand-typed literals) and the fixture relabeled
    algebraic (not PSD-realizable); engine timeout sealed as
    BLOCKED_RESOURCE_LIMIT instead of crashing the run.
- id: E7_axis_vocabulary_mapping
  supersedes: none (documentation)
  finding: PR182-H6 (CONFIRMED)
  correction: >-
    The spec/backlog axis vocabulary maps onto the cas_gate vocabulary
    as wolfram_xact->wolfram_xact, sympy_high_precision->sympy,
    sage_singular->sage_singular, lean_mathlib->lean (Lean core lane,
    disclosed in the spec; same convention as formal_pr124).
- id: E8_mutation_coverage
  supersedes: none (documentation)
  finding: PR182-H5 (CONFIRMED)
  correction: >-
    Live mutants cover the SymPy axis (parity matrix, wrong kernel), the
    cas_gate aggregate (three-axis CAS_BLOCKED, stale-contract
    rejection), and a Wolfram tampered-checks parse. Lean-side mutation
    is carried at the statement level: every registered Lean fact is a
    native_decide theorem, so a falsified identity fails `lake build`.
    An adjudication-reproduction gate re-runs cas_gate adjudicate over
    the sealed envelopes.
