acceptance:
  - bass-py is the only distribution containing files under the htt top-level package.
  - The htt compatibility distribution contains no Python package files and depends exactly on the built bass-py version.
  - The compatibility sdist contains only declared packaging metadata and documentation, with no nested HTT or test source payload.
  - Editable compatibility metadata has empty package and namespace mappings and exposes no compatibility source-root path.
  - At least one isolated cell resolves htt and its exact bass-py dependency from the local wheelhouse and passes pip check.
  - Every wheel RECORD row is complete and its declared hash and size are verified, including the RECORD self-row rule.
  - Direct-wheel, sdist-built-wheel, and editable installs pass in both installation orders in independent clean environments.
  - Clean pytest runs use isolated importlib mode, execute at least one test, and report pass, skip, and blocker counts separately.
  - Imported module origins and sys.path contain neither the original worktree nor its virtual environment.
  - Canonical modules and declared compatibility aliases have identical top-level module identity.
  - Arbitrarily requested nested modules under every declared compatibility alias have canonical object identity and metadata in both import orders.
  - The dependency layer is physically read-only and its path, type, mode, size, and content manifest is unchanged before and after the build plus every clean install cell.
  - Every clean install cell owns a distinct writable TMPDIR below its private cell root; no writable temporary directory is shared across cells.
  - The installed common.status_snapshot CLI writes and independently checks the snapshot, claim-ledger, and status-matrix companions in every cell.
  - Structured metadata-only generator output is identical across every clean install mode.
  - Missing optional dependencies retain their named skip or blocker disposition and are excluded from pass counts.
  - Every mutation fails or explicitly downclaims while the clean tracked-only fixture passes reproducibly.
  - The PR4 scope firewall records only the non-numerical skipped-by-user-scope state.

kill_switch: >-
  If tracked inputs alone cannot reproduce collection, smoke reachability, import
  ownership, and representative metadata generation independently of cwd,
  install order, cache, PYTHONPATH, and untracked files, PR-121 must remain open
  and PR-122 or later evidence may not be treated as authoritative.
