source_facts:
  - fact_id: NILSSON-W-IS-WEYL
    location: equation_1_pdf_page_2
    normalized_statement: >-
      Nilsson et al. define W_N^2 as
      (E_ab E^ab + H_ab H^ab)/(6 H^4), where E_ab and H_ab are the electric
      and magnetic parts of the Weyl tensor.
  - fact_id: NILSSON-MODEL-CLASS
    location: pdf_pages_3_to_4
    normalized_statement: >-
      The exhibited models are spatially homogeneous, non-tilted Bianchi
      type VII_0 dust models, with the CMB treated as a test field.
  - fact_id: NILSSON-ASYMPTOTIC-RESULT
    location: equation_10_pdf_page_4
    normalized_statement: >-
      The cited late-time result has normalized shear tending to zero while
      the normalized Weyl parameter tends to a positive initial-condition-
      dependent constant.
