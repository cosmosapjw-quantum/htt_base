  - A-PR179-MAPPER
  - A-PR179-HARNESS
  - A-PR179-STAT
  - A-PR179-CLAIM
  observed_directional_values_seen_before_freeze: false
  preflight_amendment:
    observed_directional_values_seen: false
    reason: >-
      The first support-only preflight found 98.45 percent overall support but
      showed that the proposed every-populated-cell-by-six-family 80 percent
      rule is structurally impossible for sparse CAL/SBF/SN cells.  Before any
      coefficient or score was evaluated, null-stratum families were therefore
      frozen to FP, TF, and OTHER, with OTHER pooling CAL/SN/SBF/MIXED_OTHER.
      The hard 80 percent gate applies to each broad family in aggregate;
      every fine cell/family support fraction remains disclosed descriptively.
  adjudication: >-
    Use the statistics review's group-level domain, response-rank gates,
    position-preserving matched null, and finite-rank routing.  Use the mapper
    and claim reviews' stricter column firewall.  H_cat and q_cat are defined
    below through one linear truncated catalogue-fit relation so that every
    observed and null fit has an exact deterministic weighted-least-squares
    solution; they are coefficient labels, not physical cosmological fields.

claim:
  mandatory_core: >-
    Selection/systematics-conditional raw-catalogue directional statistic
    with a matched null; not cosmological anisotropy.
  coefficient_definition: >-
    H_cat(n_hat) and q_cat(n_hat) are phenomenological coefficients of the
    frozen truncated CF4 catalogue fit.  They are not measurements of a
    directional Hubble constant or cosmological deceleration field.
  allowed_terminal_results:
  - MATCHED_NULL_CONTAINS_DIRECTIONAL_STATISTIC
  - CATALOGUE_SELECTION_SYSTEMATICS_CONDITIONAL_DIRECTIONAL_RESIDUAL
  - NUMERICALLY_UNRESOLVED_AT_FROZEN_MC_BUDGET
  - H_ONLY_SELECTION_SYSTEMATICS_CONDITIONAL
  - NON_INFORMATIVE_RESPONSE_OVERLAP
  - NON_INFORMATIVE_SELECTION_SYSTEMATICS_DOMINATED
  - DESCRIPTIVE_ONLY_NULL_NOT_CERTIFIABLE
  - ABSTAIN_COLUMN_FIREWALL_BREACH
  interpretation: >-
    Every branch is conditional on the authenticated catalogue, available
    method metadata, reported marginal errors, fixed sky/depth support, and
    the registered residual-exchangeability null.  No branch establishes or
    excludes cosmological anisotropy, isotropy, a peculiar-flow cause, a
    geometry, a family, a transfer function, or a native-solver result.

