  frame_note: >-
    Vcmb is a published CMB-frame systemic velocity and is disclosed as
    frame-derived.  It is not a peculiar-velocity reconstruction.  No
    alternate velocity frame is scanned.

domain:
  unit: one_unique_CF4_group_1PGC
  join: exact_one_to_one_table3_table4_by_1PGC
  c_km_s: 299792.458
  redshift_definition: z=Vcmb/c
  z_min_inclusive: 0.01
  z_max_inclusive: 0.10
  required:
  - finite_DMzp
  - finite_positive_e_DMzp
  - finite_J2000_RAdeg_DEdeg
  clipping: none
  direction: >-
    n=(cos(dec)cos(ra),cos(dec)sin(ra),sin(dec)) in the frozen J2000 frame.
  variance_mag2: e_DMzp^2 + (5*300/(ln(10)*Vcmb))^2 + 0.05^2
  peculiar_velocity_floor_km_s: 300.0
  systematic_floor_mag: 0.05

method_family:
  labels:
  - CAL
  - SN
  - FP
  - TF
  - SBF
  - MIXED_OTHER
  precision_sources:
    SN:
    - e_DMsnIa
    - e_DMsnII
    FP:
    - e_DMfp
    TF:
    - e_DMtf
    SBF:
    - e_DMsbfo
    - e_DMsbfi
  dominance_fraction: 0.8
  calibrator_rule: >-
    CAL is assigned only when o_DMcal is positive and no method with a
    registered positive uncertainty supplies precision; otherwise CAL is a
    presence nuisance and the precision-based family rule wins.
  fallback: MIXED_OTHER

catalogue_fit:
  transformed_response: y=DMzp-25-5*log10(c*z)
  relation: >-
    y = a0 + b0*z + kappa*z^2 + Z*gamma + h_a dot n +
    b_q*z*(r_b dot n) + epsilon.
  q_scale_b_q: 1.0
  coefficient_map:
    H_cat: exp(-(ln(10)/5)*(a0+h_a dot n))
    q_cat: 1-(2*ln(10)/5)*(b0+r_b dot n)
  interpretation: >-
    This is a first-order-in-z logarithmic catalogue fit corresponding to a
    second-order luminosity-distance expansion.  The map is definitional for
    H_cat/q_cat and is not a claim that the global cosmographic expansion or
    its physical assumptions are validated over the catalogue.
  angular_order: dipole_only_l1
  target_order:
  - H_x
  - H_y
  - H_z
  - q_x
  - q_y
  - q_z
  nuisance:
  - intercept
  - z
  - z_squared
  - centered_log_e_DMzp
  - method_family_indicators_reference_MIXED_OTHER
  - method_family_by_z_interactions
  - train_only_Nside4_by_depth_selection_density
  alias_policy: >-
    Drop only an exactly constant nuisance column and then the later column in
    the declared order when a deterministic SVD rank test finds an exact
    numerical alias at tol=100*eps*max(n,p)*sigma_max.  Target columns are
    never dropped or repaired.
  fit: deterministic_weighted_least_squares
  score: >-
    T=2*sum held-out(logL_full-logL_reduced) over five frozen folds.  One joint
    H/q score is primary when both blocks pass.  If q fails its prospective
    response gate and H passes, the predeclared H-only score is primary.
  component_scores: descriptive_only

crossfit:
  folds: 5
  cluster: HEALPix_Nside2_NESTED_pixel_x_method_family
  allocation: deterministic_largest_cluster_first_to_current_smallest_fold_then_fold_id
  group_integrity: one_1PGC_and_cluster_never_split
  train_only:
  - nuisance_centering_and_scaling
  - selection_density_counts
  - reduced_and_full_coefficients

matched_null:
  family: position_preserving_crossfit_restricted_residual_permutation
  sky_rotation: forbidden
  stratum: fold_x_HEALPix_Nside1_NESTED_x_broad_method_family_x_redshift_bin
  broad_method_family:
    FP: FP
    TF: TF
    OTHER:
    - CAL
    - SN
    - SBF
    - MIXED_OTHER
  redshift_bin_edges:
  - 0.01
  - 0.025
  - 0.05
  - 0.075
  - 0.10
  construction: >-
    Fit the reduced model out of fold, studentize held-out residuals by the
    frozen row sigma, permute only within exact supported strata, and rebuild
    y_null=mu_reduced_oof+sigma*permuted_studentized_residual.  Positions,
    velocities, errors, methods, selection covariates, and folds never move.
  minimum_stratum_groups: 8
  minimum_overall_supported_fraction: 0.90
  minimum_broad_method_supported_fraction: 0.80
  diagnostics: >-
    Record every fine sky-cell/original-method support fraction as well as the
    broad-family aggregate and unsupported support map.  Failure of the
    registered overall or broad-family thresholds makes the null
    NOT_CERTIFIABLE; it is not repaired after results.
  same_pipeline: >-
    Every null uses the identical selected rows, folds, transforms, target
    columns, score, and conservative upper-tail comparison.

response_identifiability:
  timing: before_result_reporting
  standardized_weighted_target_columns: true
  svd_tolerance: 100*eps*max(n,p)*sigma_max
  max_condition_number: 1.0e4
  minimum_retained_information_H: 0.10
  minimum_retained_information_q: 0.10
  max_H_q_canonical_correlation: 0.95
  directional_cubic_q_stress:
    nuisance: z_squared_times_n
    minimum_retained_information: 0.05
    max_canonical_correlation: 0.95
  routing: >-
    H failure gives NON_INFORMATIVE_RESPONSE_OVERLAP.  H pass with q failure
    invokes only the frozen H-only branch and suppresses every q coefficient,
    amplitude, direction, envelope, and rank.

finite_rank:
  null_draws: 19999
  rng: numpy_PCG64DXSM
  seed_sequence_entropy:
  - 20260720
  - 179
  rank: (1+count(T_null>=T_observed))/(19999+1)
  tail: upper
  tie_policy: conservative_greater_equal
  resolution: 1/20000
  alpha: 0.05
  uncertainty: >-
    Two-sided 95 percent Clopper-Pearson interval for b/19999, transformed to
    plus-one-rank support.  The PR-173 rank certificate expands it by one
    finite grid spacing before deciding against the frozen alpha boundary.
  gaussian_sigma_forbidden: true

stability:
  required_observed_summaries:
  - per_fold_heldout_improvement
  - leave_method_family_out_coefficients
  - leave_Nside1_cell_out_coefficients
  - low_and_high_depth_half_coefficients
  gates:
  - at_least_four_of_five_fold_improvements_nonnegative
  - no_single_fold_exceeds_half_of_total_positive_improvement
  interpretation: >-
    Deletion and depth summaries disclose selection sensitivity.  If they
    make the selected response rank fail or reverse the primary coefficient
    vector beyond its matched-null reference envelope, route to
    NON_INFORMATIVE_SELECTION_SYSTEMATICS_DOMINATED.

terminal_routing:
  order:
  - INPUT_OR_DOMAIN_FAILURE -> NON_INFORMATIVE_NO_RESULT
  - COLUMN_FIREWALL_FAILURE -> ABSTAIN_COLUMN_FIREWALL_BREACH
  - NULL_SUPPORT_OR_LINEAGE_FAILURE -> DESCRIPTIVE_ONLY_NULL_NOT_CERTIFIABLE
  - H_RESPONSE_FAILURE -> NON_INFORMATIVE_RESPONSE_OVERLAP
  - Q_RESPONSE_FAILURE_WITH_H_PASS -> H_ONLY_SELECTION_SYSTEMATICS_CONDITIONAL
  - STABILITY_FAILURE -> NON_INFORMATIVE_SELECTION_SYSTEMATICS_DOMINATED
  - MC_GUARD_STRADDLES_ALPHA -> NUMERICALLY_UNRESOLVED_AT_FROZEN_MC_BUDGET
  - MC_GUARD_AT_OR_ABOVE_ALPHA -> MATCHED_NULL_CONTAINS_DIRECTIONAL_STATISTIC
  - MC_GUARD_BELOW_ALPHA -> CATALOGUE_SELECTION_SYSTEMATICS_CONDITIONAL_DIRECTIONAL_RESIDUAL
  matched_null_envelope: >-
    Report the 95th-null-quantile catalogue-coefficient amplitude envelope
    only as a matched-null conditional reference, never as a cosmological
    confidence limit.

falsifiers:
- any forbidden value enters any numerical path
- source hash, row identity, parity, domain, or fold-integrity failure
- any outcome-dependent cut, frame, mask, basis, null, or threshold change
- target rank/condition/information/overlap gate failure outside the H-only route
- unsupported or lineage-incomplete matched-null ensemble
- observation and null use non-identical scoring
- zero p-value, Gaussian-equivalent sigma, or sub-resolution claim
- physical, cosmological, geometry, family, transfer, or native-solver promotion

required_metadata:
- owner
- contributors
- implementation_scope
- claim_tier
- claim_level
- scientific_artifact_mode
- public_use
- transfer_source
- config_hash
- input_hashes
- sky_support_status
- mask_status
- selection_status
- covariance_status
- null_mock_status
- caveats
- generating_command
- runtime_versions
- git_commit_or_worktree_state

forbidden_claims:
- cosmological anisotropy detected or isotropy violated
- directional Hubble constant or measured H(n_hat)
- directional cosmic acceleration or measured q(n_hat)
- kinematic dipole bulk flow or causal local-structure attribution
- CF4 P0 resolved or replaced
- HTT evidence posterior odds PPC or LOOCV from this OBSSTAT feature
- Bianchi geometry or family identification
- native solver or transfer validation
