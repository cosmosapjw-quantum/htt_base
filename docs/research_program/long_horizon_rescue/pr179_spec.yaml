column_firewall:
  primary_fit:
    table3:
    - 1PGC
    - Vcmb
    - RAdeg
    - DEdeg
    table4:
    - 1PGC
    - DMzp
    - e_DMzp
  selection_and_nuisance_only:
    table3:
    - o_DMcal
    - o_DMsnIa
    - o_DMfp
    - o_DMtf
    - o_DMsbfo
    - o_DMsbfi
    - DMcal
    - DMsnIa
    - e_DMsnIa
    - DMfp
    - e_DMfp
    - DMtf
    - e_DMtf
    - DMsbfo
    - e_DMsbfo
    - DMsbfi
