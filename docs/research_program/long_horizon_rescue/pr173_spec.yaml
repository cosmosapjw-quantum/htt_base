falsifiers:
- id: F-PR173-SUBRESOLUTION-PROMOTION
  condition: a rank at or inside its finite support radius is labeled resolved
- id: F-PR173-MISSING-LINEAGE-PROMOTION
  condition: an aggregate-only or non-terminal source receives any numerical status
- id: F-PR173-DISPERSION-AS-MCSE
  condition: scientific/mock dispersion is silently used as Monte Carlo standard error
- id: F-PR173-IID-FOR-CLUSTERED
  condition: an iid rank standard error is used for a declared clustered ensemble
- id: F-PR173-PARTIAL-DESI
  condition: any partial PR-151 mock enters a PR-173 numerical result
- id: F-PR173-SIGMA-EXTRAPOLATION
  condition: a Gaussian-equivalent sigma is emitted at or below the finite-rank floor
- id: F-PR173-RAW-REHASH
  condition: PR-173 hashes a raw data payload instead of citing upstream hash authority

terminal:
  success: >-
    Every registered target has typed availability; every available target has
    typed lineage; every lineage-certified target has exactly one typed
    numerical-resolution status; available calculations reproduce from
    metadata/derived arrays; unavailable or insufficient-lineage lanes have
    null numerical status.
  kill: >-
    Any estimate whose registered confidence or finite-rank guard interval
    touches its registered boundary must be labeled
    NUMERICALLY_UNRESOLVED_AT_CURRENT_MC_BUDGET. Missing lineage is not a
    budget result and must be NOT_CERTIFIABLE with null numerical status.

forbidden_claims:
- physical validation
- signal or noise classification
- detection or evidence for anisotropy
- Bianchi family or geometry identification
- native or external transfer validation
- iid exact-rank language for the Planck noise-reuse ensemble
- raw-QE reproduction for ACT
- calibrated DESI rank before the PR-151 terminal receipt
