claim:
  statement: >-
    A stochastic headline is numerically resolved only when its registered
    Monte Carlo uncertainty and any discrete finite-rank resolution do not
    overlap the registered null or finite-support boundary.
  allowed_statuses:
  - RESOLVED_WITHIN_REGISTERED_MC_CONTRACT
  - NUMERICALLY_UNRESOLVED_AT_CURRENT_MC_BUDGET
  interpretation: >-
    These statuses describe numerical resolution under an authenticated,
    lineage-certified ensemble contract. They are null when input or lineage
    gates fail. They are not signal, noise, adequacy, physical validation,
    detection, or model-identification labels.

orthogonal_status_axes:
  input_availability_status:
  - AVAILABLE_AUTHENTICATED_COMPLETE
  - NOT_EVALUATED_INPUT_UNAVAILABLE
  - NOT_EVALUATED_PARTIAL_INPUT_FORBIDDEN
  replicate_lineage_status:
  - CERTIFIED
  - NOT_CERTIFIABLE_MISSING_REPLICATE_LINEAGE
  - NOT_CERTIFIABLE_INVALID_DEPENDENCE_METHOD
  numerical_resolution_status:
  - RESOLVED_WITHIN_REGISTERED_MC_CONTRACT
  - NUMERICALLY_UNRESOLVED_AT_CURRENT_MC_BUDGET
  routing: >-
    Numerical resolution is populated only when input availability is
    AVAILABLE_AUTHENTICATED_COMPLETE and replicate lineage is CERTIFIED.
    Available inputs with insufficient lineage receive a typed
    NOT_CERTIFIABLE lineage status. Unavailable or forbidden-partial inputs
    leave lineage unevaluated. In both cases numerical fields and
    numerical_resolution_status are null.

conventions:
  rank:
    estimator: (1 + b) / (N + 1)
    exceedance_count: 'b = number of null scores greater than or equal to the observation score'
    tie_policy: conservative_ge
    discrete_resolution: 1 / (N + 1)
    integer_contract: 'N >= 1 and 0 <= b <= N are integers'
    gaussian_sigma_policy: forbidden_at_or_below_resolution
    resolution_test: >-
      Expand the registered dependence-aware confidence interval by one
      discrete grid spacing f=1/(N+1). The rank decision is resolved only when
      this entire guard interval lies strictly on one preregistered side of
      the probability boundary; touching the boundary is unresolved.
  scalar:
    overlap_test: >-
      A scalar decision is resolved only when its registered estimator-unit
      confidence interval lies strictly on one preregistered side of the
      same-unit boundary. A dimensionless rank floor is never combined with a
      dimensional standard error.
  missing_lineage: >-
    Missing replicate, seed, batch, cluster, or terminal-input lineage routes
    to a NOT_EVALUATED or NOT_CERTIFIABLE axis with null numerical status; a
    scientific or mock dispersion may not be silently relabeled Monte Carlo
    standard error.
  hashes: >-
    Reuse upstream manifest-declared input hashes. Small primary derived JSON
    metadata is byte-checked once against those hashes. PR-173 must not rehash
    raw Planck, ACT, CF4, DESI, or other payload bytes, and must not repeat-hash
    the Planck support array used for deterministic output replay.

registered_uncertainty_methods:
  iid_rank_delete_one_jackknife:
    inputs: [N, b]
    formula: sqrt(b * (N-b) * (N-1)) / N^2
    boundary_guard: discrete_resolution_remains_load_bearing_when_standard_error_is_zero
  clustered_rank_bootstrap:
    inputs: [clustered_binary_exceedance_rows]
    seed: 20260719
    replicates: 20000
    resampling_unit: whole_cluster
    output: sample_standard_deviation_of_plus_one_rank
  batch_means:
    minimum_batches: 2
    equal_batch_sizes_required: true
    output: sample_standard_deviation_of_batch_means_divided_by_sqrt_batch_count
  delete_one_jackknife:
    minimum_replicates: 2
    output: sqrt((m-1)/m * sum((theta_i-mean(theta))^2))
  seed_sem:
    minimum_independent_seeds: 2
    output: sample_standard_deviation_of_seed_estimates_divided_by_sqrt_seed_count
  upstream_estimator_matched_bootstrap:
    requirement: >-
      The upstream artifact must name the estimand, resampling unit, sample
      count, and bootstrap standard error. Otherwise the field is unavailable.

