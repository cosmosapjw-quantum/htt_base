claim_identity:
  claim_id: C-PR126-EGS-ONEWAY
  claim_text: >-
    On the comparator level only: every premise-complete FLRW-limit state
    has x_C = 0 exactly (one-way), AND x_C = 0 does not imply the FLRW
    limit (constructive cancellation counterexamples, sealed together with
    the forward statement). The exact-EGS and almost-EGS premise sets are
    separated in a typed premise registry (edge-free in this PR);
    almost-EGS remains SPECIFIED_ONLY without a
    quantitative regularity/remainder registration. Conditional mathematics
    at C2; no FLRW certificate, no converse, no geometry claim.
  domain: exact_rational_comparator_states_and_premise_governance
  frame: binds_pr125_registered_contracts
  perturbative_order: exact_algebraic_at_comparator_level
  claim_level_scheme: roadmap_rescue_v1
  claim_level: C2

scope_and_non_goals:
  converse_or_truth_certificate: forbidden
  beta_zero_implies_egs: forbidden
  scalar_to_geometry_language: forbidden
  merging_exact_and_almost_claims: forbidden
  posthoc_premise_edit_without_new_theorem_id: forbidden
  remediation_disposition_change: forbidden

