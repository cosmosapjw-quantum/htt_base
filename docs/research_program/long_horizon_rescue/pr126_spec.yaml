  rescued_count: 0

data_scope:
  pr4_data_work: skip_entirely_by_user_scope
  pr4_commands_run_required: 0

premise_dag:
  module: htt/src/common/egs_oneway.py
  theorem_id_rule: >-
    theorem ids are content-addressed over (premise-id set, statement); any
    premise addition/removal/edit yields a NEW theorem id structurally —
    post-hoc counterexample removal cannot keep the old id.
  exact_egs_premises:
    - EGS-P0-expanding_congruence
    - EGS-P1-radiation_isotropy_every_fundamental_observer
    - EGS-P2-collisionless_liouville_radiation
    - EGS-P3-geodesic_matter_congruence
    - EGS-P4-barotropic_matter_generalization
    - EGS-P5-differentiability_working_class
  almost_egs_premises:
    - AEGS-P1-almost_isotropy_bounded_multipoles
    - AEGS-P2-regularity_class_UNREGISTERED
  almost_egs_status: SPECIFIED_ONLY_no_quantitative_regularity_or_remainder
  comparator_forward_premises:
    - CMP-P1-beta_zero
    - CMP-P2-sigma2_zero
    - CMP-P3-w2_zero
    - CMP-P4-delta_omega_k_zero
    - CMP-P5-omega_tilt_zero

oneway_witnesses:
  forward: >-
    for every state satisfying ALL comparator premises, x_C = Sigma2 - W2 +
    Omega_tilt + DeltaOmega_k = 0 exactly. The premise-complete set is the
    SINGLE zero state, so the check is one exact substitution plus the
    symbolic c = (1,-1,1,1) combination of the sealed parent identity —
    no random sampling exists for a one-point set.
  converse_counterexamples:
    - id: CE-1-shear_curvature_cancellation
      state: {beta: '0', sigma2: '1/100000000', omega_tilt: '0', w2: '0', delta_omega_k: '-1/100000000'}
      note: x_C = 0 with nonzero shear and beta = 0 — kills the converse AND the beta-zero shortcut in one witness
    - id: CE-2-vorticity_absorbs_tilt_and_shear
      state: {beta: '1/1000', sigma2: '1/100000000', omega_tilt: '1/1000000', w2: '101/100000000', delta_omega_k: '0'}
      note: >-
        x_C = 0 with every departure nonzero (w2 = sigma2 + omega_tilt at
        the comparator level, where the components are independent inputs;
        the tilt MAP beta -> Omega_tilt is not asserted here)
  random_cancellation_property:
    seeds: 64
    bit_generator: deterministic_seeded_fractions
    rule: >-
      draw nonnegative rational (sigma2, w2, omega_tilt), set delta_omega_k
      = w2 - sigma2 - omega_tilt; every draw has x_C = 0 exactly while the
      state is generically non-FLRW; each draw must FAIL flrw_limit unless
      all components are zero.

mutation_registry:
  - mutation_id: incomplete_premise_forward_claim
    kill_rule: >-
      the forward checker over a premise set missing CMP-P4 is refuted by a
      MACHINE-VERIFIED witness (delta_omega_k != 0 satisfies the reduced
      premises with x_C != 0); reductions with no witness (dropping
      CMP-P1) are refused fail-closed without a refutation claim
  - mutation_id: posthoc_premise_edit_keeps_id
    kill_rule: content-addressed theorem ids change under any premise edit; a claim reusing the old id is rejected by the registry validator
  - mutation_id: converse_language
    kill_rule: generated theorem text containing converse/certificate phrases fails the safe-text lint
  - mutation_id: beta_zero_egs_shortcut
    kill_rule: PR-125 require_flrw_limit raises on beta=0 with nonzero shear (cross-PR real validator)
  - mutation_id: merged_exact_almost_claim
    kill_rule: a claim object citing both the exact theorem id and the almost-EGS SPECIFIED_ONLY node as one statement is rejected

artifact_contract:
  outputs:
    - docs/generated/pr126_premise_dag.json
    - docs/generated/pr126_oneway_witness_report.json
    - docs/generated/pr126_counterexample_registry.json
    - docs/generated/pr126_mutation_report.json
    - docs/generated/pr126_artifact_manifest.json
  check_policy: fresh_build_must_equal_disk_bytes

acceptance_and_kill_switches:
  - the forward witness holds on every seeded FLRW-limit state (x_C = 0 exactly) and symbolically
  - every registered counterexample has x_C = 0 and fails flrw_limit
  - all 64 random cancellation draws have x_C = 0 and fail flrw_limit
  - every registered mutation executes and is killed
  - almost-EGS stays SPECIFIED_ONLY (no quantitative regularity claimed)
  - all 102 remediation findings remain OPEN

forbidden_output_language:
  - x_C = 0 therefore FLRW
  - FLRW certificate
  - EGS certificate
  - converse established
  - isotropy proven
  - Bianchi geometry detected
  - Bianchi family identified
  - finding rescued
  - validated as native
