scheduling: >-
  First defensible foreground card unlocked by the PR-184 remediation
  (REPLAN 9894896f rerouted the failed PR-172 requires_success edge).
  Owner directive 2026-07-21 (KST) covers this execution.

load_bearing_external_fact:
  statement: >-
    The FFP10 CMB Monte Carlo realizations INCLUDE Doppler boosting
    (1000 CMB realizations generated including lensing, Rayleigh
    scattering, and Doppler boosting; Planck 2018 III / FFP10
    description). The E2E null ensemble is therefore a BOOSTED null.
  citation: Planck 2018 results III (arXiv:1807.06207) FFP10 CMB MC
    description; identifiers transcribed, not verified against print.
  design_consequence: >-
    Subtracting the fixed boost template from the observed feature
    alone would double-subtract. The registered construction subtracts
    the SAME fixed template from the observed feature and every
    simulation feature (identical treatment; a constant subtraction is
    rank-invariant and is retained for the DoD-required residual
    semantics), removes the mask-coupling and ensemble boost
    expectation through the simulation mean, and evaluates the observed
    residual within the boosted-simulation null.

data:
  compact_cache: /mnt/sn850x2t/htt_base_e2e/k1_e2e_reduced_pr150/k1_ffp10_reduced_smica.npz
  compact_cache_sha256: sha256:86b792c821b3e641c76c83d96523148c65e9d30a439d7c850acc808c1bc5fadb
  contents: 999 FFP10 CMB MC maps + 300 noise MC maps + observed SMICA
    map + common mask, all nside 64 RING (PR-150 retention receipt)
  pairing: cmb_i + noise_(i mod 300) per the PR-150 pairing convention
  no_raw_reread: true

feature:
  id: boost_biposh_L1_dipole_frame_v1
  pipeline: >-
    masked map (map * common_mask) -> map2alm (lmax 24, iter 3) ->
    rotate alm to the solar-dipole frame -> F_ell = sum_m
    Re(a*_{ell m} a_{ell+1, m}) / (2 ell + 1), ell = 2..10
    (9 components).
  dipole:
    amplitude_beta: 1.23357e-3
    direction_galactic_l_deg: 264.021
    direction_galactic_b_deg: 48.253
    source: Planck solar dipole (identifiers transcribed)
  masked_pseudo_alm: >-
    Window coupling is NOT deconvolved; the simulations carry the
    identical mask, so the null is window-matched by construction.

boost_operator:
  id: exact_pixel_boost_v1
  definition: >-
    Zero-parameter exact boost: T'(n) = T(n_ab) / (gamma (1 - beta
    dot n)) with n_ab the aberrated direction; T evaluated by EXACT
    spherical-harmonic synthesis of the band-limited (lmax 24) input at
    the aberrated directions (no transcription of coupling-coefficient
    formulas; the operator is the definition of the boost).
  template: >-
    T_hat = mean over the first 128 CMB MC of [F(B(s_i)) - F(s_i)]
    through the identical masked pipeline. Zero free parameters (beta
    and direction fixed); deterministic.
  linearity_check: running the operator at 2*beta must double T_hat
    componentwise within the registered tolerance (rel 0.05 on the
    dominant components).
  ensemble_boost_content_measurement: >-
    The full-sky simulation-mean feature is compared with T_hat and
    REPORTED with its Monte Carlo standard error; this measures the
    effective boost content of the FFP10 ensemble and is a disclosed
    measurement, not a pass/fail gate (expected marginal power).

null_and_ranking:
  scores: >-
    Hartlap-corrected Mahalanobis of the mean-centred feature: for each
    simulation, leave-one-out centre and covariance; for the observed,
    full-ensemble centre and covariance. The identical fixed template
    subtraction applied to observed and simulations cancels in the
    centred residual (disclosed).
  rank: exact (1 + b) / (N + 1), N = 999, conservative ties
  finite_resolution_floor: 1/1000
  alpha: 0.05 (one-sided upper)
  boundary_guard: >-
    If the rank p lies within one support-grid step of alpha, the
    terminal is NUMERICALLY_UNRESOLVED_AT_CURRENT_MC_BUDGET (PR-173
    contract).

allowed_scientific_results:
- CONSISTENT_WITH_PURE_BOOST_WITHIN_THIS_PIPELINE
- NOT_EXPLAINED_BY_THE_FIXED_BOOST_TEMPLATE_WITHIN_THIS_PIPELINE
- NUMERICALLY_UNRESOLVED_AT_CURRENT_MC_BUDGET
blocked_status: BLOCKED_INTEGRITY_FAILURE

interpretation: >-
  A consistency result ONLY, conditional on this exact compact cache,
  mask, pseudo-alm convention, boosted FFP10 ensemble, and pipeline.
  It never confirms a pure boost, never claims restored statistical
  independence (a separate preregistered cross-covariance or
  conditional-independence test would be required), and is not a
  detection, isotropy, anisotropy, transfer, geometry, native-solver,
  or Bianchi-family statement. The kernel is never fitted; the residual
  is never called a geometric estimand.

kill_conditions:
- cache hash mismatch or any raw re-read
- template fitted or scaled (any free parameter)
- boundary guard ignored
- independence claim without the separate registered test
- geometry/family/detection language

