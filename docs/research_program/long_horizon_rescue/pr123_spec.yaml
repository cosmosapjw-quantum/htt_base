    On the frozen analytic and synthetic fixtures only, each registered small
    reference may establish lane-specific C2 numerical mechanics when its clean
    properties pass, its known mutation executes and is killed, and its disclosed
    lineage satisfies the independence contract. This does not remediate a
    production producer or validate an observed scientific result.
  quantifier: all_nine_frozen_mutations_and_all_registered_k6_mechanics_properties
  estimand: lane_specific_synthetic_or_analytic_numerical_mechanics
  target_population: frozen_PR123_manufactured_fixtures_and_seed_streams
  domain: pre_solver_internal_oracle_and_mutation_laboratory
  frame: analytic_cartesian_test_frame_only
  perturbative_order: not_applicable_to_generic_mechanics
  units: dimensionless_or_fixture_declared
  data_release: none
  sky_support_mask_selection: none
  statistic_pipeline: frozen_reference_property_and_mutation_registry
  transfer_source: none_or_synthetic
  nuisance_prior_null_multiplicity: fixture_specific_and_preregistered
  claim_level_scheme: roadmap_rescue_v1
  claim_level: C2
  claim_tier_ceiling: conditional

