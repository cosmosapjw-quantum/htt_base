acceptance_and_kill_switches:
  - exactly nine frozen mutation IDs are present and executed
  - every clean property passes and every registered mutant is killed
  - surviving mutation count is zero and the zero-survivor report still exists
  - every lineage row validates and production import or call scans are clean
  - K6 runs all four fields, four grids, and both stencil orders
  - K6 order, boundary, interpolation, decomposition, sqrt2, and continuum gates pass
  - K6 has zero empirical inputs and zero empirical consumers
  - PR4 commands_run equals zero and no PR4 input or derived artifact exists
  - all remediation findings remain OPEN
  - any omitted, skipped, surviving, substituted, or post-hoc-weakened mutation blocks its lane
  - any mechanics-to-science promotion fails the claim firewall

forbidden_output_language:
  - observed vorticity detected
  - Bayes factor established
  - posterior predictive adequacy established
  - globally significant anomaly
  - external transfer validated as native
  - Bianchi geometry detected
  - Bianchi family identified
  - remediation finding rescued
