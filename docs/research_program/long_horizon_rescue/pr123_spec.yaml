  amendment_id: PR123-SPEC-V6-AFTER-INVALIDATED-ATTEMPTS-1-THROUGH-5
  amended_on: '2026-07-16'
  timing: after_attempt5_and_fifth_hostile_review_before_attempt6
  previous_schema: htt.long_horizon.pr123_oracle_lab.v5
  previous_config_hash: 6f367dfcb1529d5ab39cf205447930fcf1c81ecda27e7b6b4692a7c8177961a4
  previous_attempt_status: INVALIDATED_FALSE_GREEN
  previous_success_claim_withdrawn: true
  prospective_preregistration_claimed_for_v6: false
  current_attempt_id: PR123-ATTEMPT-6
  rationale: >-
    Attempt 1 exposed hard-coded properties and descriptor-only mutation handling.
    Attempt 2 fixed those defects but the second hostile replay proved that fixture
    and receipt hashes, execution counts, seed-ledger replay, signed covariance,
    equation/source resolution, callable scans, and smaller-than-production gates
    could still false-green. Attempt 3 then exposed trusted derived status fields,
    permissive integer equality, and alias/dynamic callable-scan gaps. Attempt 4
    closed those exact examples but a fourth replay found container transport,
    higher-order calls, and computed introspection paths that still bypassed the
    call-shape scanner. Attempt 5 closed those forms but used module-global local
    binding suppression; an unrelated scope or injected parameter could therefore
    suppress a forbidden load. All invalid attempts and reviews remain
    content-addressed below. Version 6 uses lexical-scope-local suppression only
    for the explicitly allowed numeric `curl` and `divergence` shadows. It is a
    post-result repair, not prospective preregistration, and no earlier PASS count
    may be consumed.
