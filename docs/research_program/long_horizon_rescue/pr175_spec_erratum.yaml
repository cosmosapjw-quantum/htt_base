schema: htt.pr175.spec_erratum.v1
pr_id: PR-175
date: '2026-07-21'
erratum_scope: >-
  Pre-close corrections driven by the adversarial review lane (workflow
  wf_a792c5f9-750; three lane reviews completed with 0 P0 / 1 P1 / ~14
  P2; the per-finding verification stage was cut off by an external API
  spend limit — the three completed lane reviews each carried their own
  inline verification (independent rederivation of the Koszul chain,
  curvature contraction, canonical table, anchor arithmetic, and Engine
  B construction), and every finding was remediated inline by the main
  writer; the absence of the separate verification pass is DISCLOSED
  here rather than papered over (PR-132 API-credit precedent). The
  frozen pr175_spec.yaml stays byte-identical; the CAS v1 run
  (CAS-PR175-INVARIANT-001, CAS_4AXIS_PASS) is superseded by a fresh v2
  run under CAS-PR175-INVARIANT-002 after hash-changing axis repairs; v1
  evidence retained under docs/generated/pr175_cas/v1/, no result reuse.

corrections:
- id: E1_gap_field_rounding
  finding: PR175-R1 (P1) / PR175-P2-3
  correction: >-
    The card field max_engine_gap_abs_ceiling rounded BELOW the true
    maximum (8.2e-10 vs 8.2157e-10); replaced by the raw
    max_engine_gap_abs. No headline may quote a rounded-down bound.
- id: E2_class_b_obligation_strengthened
  finding: PR175-P2-1 / R3 / GOV-04
  correction: >-
    The class-B obligation was a fixture-table lookup with dead code and
    a vacuous clause; on the sympy/sage/wolfram axes it now RECONSTRUCTS
    n^{ab} and a_b from the constructed structure constants, requires
    a_b n^{ba} = 0, and verifies the Jacobi identity for every
    representative; the lean axis binds the class-B and h-relation
    checks to the reps table rows (editing a row breaks the theorem).
- id: E3_lean_h_relation_table_bound
  finding: PR175-P2-2 / R5
  correction: superseded by E2 (lean h-relations now computed from the
    table entries, not literal constants).
- id: E4_engine_lineage_disclosure
  finding: PR175-P2-4
  correction: >-
    The sage axis header overstated independence; reworded — the sage
    and wolfram axes are independent EXECUTION engines transliterating
    the same registered Koszul formula lineage; the algorithmically
    independent falsifiers are Engine B (coordinate/complex-step) and
    the external anchor formula.
- id: E5_runner_environment_robustness
  finding: PR175-R2 / P2-5
  correction: >-
    A missing engine binary now seals a BLOCKED_PLATFORM_OR_LICENSE
    envelope instead of crashing (FileNotFoundError caught); the axis
    scripts' declared package-missing exit code 3 maps to
    BLOCKED_PACKAGE_UNAVAILABLE, so environment failures adjudicate
    CAS_BLOCKED, never CAS_FAIL. The same repair is applied to the
    PR-182 runner (shared defect, disclosed).
- id: E6_roadmap_scope_narrowing
  finding: PR175-GOV-01
  correction: >-
    Roadmap PR-175 names curvature/shear invariants and an external
    Buchert anchor; the executed scope is the spatial Ricci-scalar
    invariant against the Ellis-MacCallum anchor formula (with two
    textbook normalization sanity points). Shear-invariant rows and a
    Buchert-anchor comparison are NOT executed and remain open scope;
    this narrowing is a disclosed deviation, not a silent substitution.
- id: E7_cas_fail_terminal_vocabulary
  finding: PR175-GOV-02
  correction: >-
    allowed_scientific_results gains INVARIANT_ORACLE_CAS_FAIL (and
    CAS_CONFLICT maps to it); an axis FAIL is never surfaced under the
    engine/anchor-mismatch label.
- id: E8_lean_depth_disclosure
  finding: PR175-GOV-03
  correction: >-
    The uniform obligation keyset carries a disclosed depth asymmetry:
    the lean axis verifies closed rational arithmetic (anchor values,
    class-B reconstruction arithmetic, table-bound h-relations), not the
    Koszul chain; recorded in the card's axis_verification_depth field
    and in the v2 contract obligation text.
- id: E9_authorization_timezone
  finding: PR175-GOV-05
  correction: >-
    The owner directive arrived 2026-07-21 (KST, UTC+9); all CAS
    adjudication timestamps are UTC. The directive preceded the v1
    contract registration and every sealed envelope; the spec's
    date-only field is refined to Asia/Seoul civil time.
- id: E10_blinding_self_attestation
  finding: PR175-GOV-06
  correction: >-
    sibling_results_read=[] is runner-attested, not externally enforced;
    the structural guarantee is that no axis script contains any code
    path reading another axis's envelope (verifiable from the pinned
    sources). Disclosed as attestation-plus-source-inspection rather
    than a cryptographic guarantee.
