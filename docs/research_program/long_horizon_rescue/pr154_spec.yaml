acceptance_and_kill_switches:
  - CCHP and SH0ES signs and source rows are separate and exact-hash bound
  - latent and collapsed Gaussian diagonal fixtures agree within 0.0001 mag
  - group zero point decomposition reports not identified, never a fabricated posterior
  - exact fixed-diagonal PSD mean-SE bounds reproduce analytic extrema
  - independence is sensitivity-only and one total interval is not claimed
  - Gaussian and variance-matched Student-t results are reported separately
  - leave-host and group-rank gates execute without threshold changes
  - SBC/PPC execute under the frozen registry or emit MODEL_INADEQUATE
  - every nonzero CF4-overlap row is scenario-only
  - all mutations execute and are killed
  - all 102 findings and both CF4 P0s remain OPEN

forbidden_output_language:
  - methods are equal
  - independence gives total uncertainty
  - CF4 host identity confirmed
  - H0 inferred from host offsets
  - cosmological anisotropy detected
  - Bianchi geometry detected
  - Bianchi family identified
  - finding rescued
  - validated as native
