  finalize_requires_random_index_1_audit: {ezmock: 10, abacus: 5}
  finalize_requires_full_rehash: true
  fast_progress_payload_hashing: forbidden
  stall_rule: two_probes_900_seconds_apart_with_zero_log_and_part_growth

