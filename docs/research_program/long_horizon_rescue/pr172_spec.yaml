frozen_on: '2026-07-20'
owner: COMMON
contributors: [OBSSTAT]
implementation_scope: [common]
artifact_mode: standard_internal
execution_authorization: EXPLICIT_APPROVED_SEQUENCE
public_use: false
claim_tier: exploratory
claim_tier_ceiling: exploratory
claim_level: {scheme: roadmap_rescue_v1, level: C1}
scientific_status: OPEN
transfer_source: none

claim_identity:
  claim_id: C-PR172-METAMORPHIC-CONSISTENCY
  allowed_success_token: PASS_METAMORPHIC_SELF_CONSISTENCY_C1
  blocked_relation_token: BLOCKED_METAMORPHIC_RELATION_VIOLATION
  incomplete_token: INCONCLUSIVE_EVIDENCE_INCOMPLETE
  invalid_contract_token: BLOCKED_CONTRACT_INVALID
  statement: >-
    The two named production surfaces are tested only for the eight frozen
    transform relations on deterministic synthetic fixtures. A pass is an
    internal same-estimator C1 self-consistency result. A clean relation
    failure blocks the affected adapter and the overall PR-172 success edge.
  not_established:
    - physical validation
    - matched-data, matched-null, or covariance adequacy
    - observed-sky parity
    - transfer validation
    - morphology compatibility
    - geometry evidence or Bianchi family identification

source_bindings:
  cf4_estimator:
    path: htt/src/common/cf4_velocity_estimators.py
    symbol: common.cf4_velocity_estimators.estimate
    sha256: 4fc9364a4a59c159445d524df5b7a09495059468ed0d7f9ecce2da1ce57a6054
  b_projector:
    path: htt/bass/los/b_mode_projector.py
    symbols:
      - bass.los.b_mode_projector.spin2_parity_odd_combination
      - bass.los.b_mode_projector.project_B_mode_transfer
    sha256: 4f0268892e59c0145e59e822fb9d6d1828fbb375f8a3d67d5fbb170cae6dacdf
  upstream_pr123:
    path: docs/PR_DELTAS/pr-123.md
    role: mutation-discipline precedent only; no reference implementation or fixture is reused
  upstream_pr167:
    path: docs/PR_DELTAS/pr-167.md
    role: execution-lane and status authority

conventions:
  cf4:
    basis: right-handed orthonormal Cartesian basis
    transformation_reading: passive basis change applied to directions and positions together
    scalar_fields: [v, w, sig_v]
    vector_fields: [n, pos_hmpc, sg]
    coefficient_units: km_per_s
    covariance_units: km2_per_s2
    full_rank_required: true
    max_normal_matrix_condition_number: 1.0e6
  b_index_mechanics:
    channel_order: [-2, -1, 0, 1, 2]
    arrays: real_float64
    input_action: simultaneous_M_and_m_index_reversal
    output_action: sign_reversal
    relation_class: anti_equivariant_index_identity
    physical_parity_status: UNDERDEFINED_NOT_TESTED
    caveat: >-
      K(-M,-m)=-K(M,m) is a convention-scoped coded index identity. It is
      not the ell-dependent spatial-parity law for physical B-mode alms.

fixtures:
  cf4:
    fixture_id: F172-CF4-SYNTHETIC-01
    raw_directions:
      - [1, 0, 1]
      - [0, 1, 1]
      - [-1, 0, 2]
      - [0, -1, 1]
      - [1, 2, -1]
      - [-2, 1, 1]
      - [1, -2, 2]
      - [2, 1, -1]
    direction_rule: normalize_each_row_in_float64
    distances_hmpc: [15, 18, 21, 24, 27, 30, 33, 36]
    sig_v_kms: [250, 260, 270, 280, 290, 300, 310, 320]
    weights: inverse_sig_v_squared
    true_flow_kms: [120, -80, 45]
    true_monopole_kms: 37
    radial_velocity_rule: n_dot_true_flow_plus_true_monopole
  b_axisymmetric_challenge:
    fixture_id: F172-B-AXISYM-CHALLENGE-01
    eta_grid: linspace_0_1_9
    visibility_history: ones_9
    tower_shape: [9, 3, 5]
    b_source: ell_2_m_minus_2_equals_one_else_zero
    e_source: all_zero
    sigma_source: m_zero_equals_one_else_zero
    k_norm: 2
    ell_max: 3
    reason: >-
      The public callable accepts this finite, shape-valid state while its
      docstring states that an axisymmetric sigma history forces zero output.

transforms:
  proper_rotation:
    matrix:
      - [36/65, -4/5, 3/13]
      - [48/65, 3/5, 4/13]
      - [-5/13, 0, 12/13]
    numeric_matrix:
      - [0.5538461538461539, -0.8, 0.23076923076923078]
      - [0.7384615384615385, 0.6, 0.3076923076923077]
      - [-0.38461538461538464, 0.0, 0.9230769230769231]
    guards: [R_times_RT_equals_I, determinant_equals_plus_one]
  axis_permutation:
    matrix: [[0, 1, 0], [0, 0, 1], [1, 0, 0]]
    interpretation: cyclic coordinate relabelling, not physical parity
  amplitude_scale: -2.5
  monopole_shift_kms: 101

tolerances:
  scaled_float_residual: 1.0e-10
  exact_integer_kernel_residual: 0
  documented_exact_zero_residual: 0
  flow_only_monopole_leak_challenge_min_kms: 50

relations:
  - relation_id: MR172-CF4-SO3-001
    adapter: cf4_estimator
    class: equivariant
    input_action: n_pos_sg_right_multiply_R_transpose
    output_action: coefficients_left_multiply_blockdiag_R_1_and_covariance_conjugation
    assertions: [coefficient_equivariance, noise_covariance_equivariance, cosmic_covariance_equivariance]
  - relation_id: MR172-CF4-AXISPERM-002
    adapter: cf4_estimator
    class: equivariant
    input_action: cyclic_coordinate_permutation_on_n_pos_sg
    output_action: coefficients_and_covariances_transform_by_blockdiag_P_1
    assertions: [coefficient_equivariance, full_covariance_equivariance]
  - relation_id: MR172-CF4-QUADRATIC-003
    adapter: cf4_estimator
    class: typed_scaling
    input_action: v_times_lambda_with_all_geometry_and_covariance_inputs_fixed
    output_action: coefficients_times_lambda_covariance_invariant_bulk_flow_norm_squared_times_lambda_squared
    assertions: [coefficient_linearity, covariance_invariance, quadratic_bulk_power_scaling]
  - relation_id: MR172-CF4-MONOPOLE-004
    adapter: cf4_estimator
    class: projection_invariance
    input_action: v_plus_constant
    output_action: bulk_flow_invariant_and_intercept_plus_constant
    assertions: [augmented_projection, covariance_invariance, flow_only_leakage_challenge]
  - relation_id: MR172-B-INDEX-ODD-005
    adapter: b_projector
    class: anti_equivariant_index_identity
    input_action: M_to_minus_M_and_m_to_minus_m
    output_action: kernel_sign_reversal
    assertions: [all_ell_2_through_6_and_M_m_minus2_through_2]
  - relation_id: MR172-B-SUPPORT-006
    adapter: b_projector
    class: selection_rule
    input_action: enumerate_ell_M_m
    output_action: zero_unless_absolute_M_minus_m_equals_2
    assertions: [exact_support]
  - relation_id: MR172-B-M0-CANCEL-007
    adapter: b_projector
    class: signed_channel_cancellation
    input_action: sum_kernel_over_M_at_m_zero
    output_action: exact_zero
    assertions: [all_ell_2_through_6]
  - relation_id: MR172-B-AXISYM-DOC-008
    adapter: b_projector
    class: documented_callable_invariant
    input_action: finite_nonzero_B_history_with_only_sigma_m_zero_nonzero
    output_action: exact_zero_as_unconditionally_documented_by_callable
    assertions: [main_projector_exact_zero]
    interpretation_if_failed: >-
      The callable contract and implementation disagree. This blocks the B
      adapter; it does not establish a physical parity violation in the sky.

mutation_registry:
  - {mutation_id: MU172-CF4-NONLY-ROT, relation_id: MR172-CF4-SO3-001, defect: rotate_directions_but_not_positions}
  - {mutation_id: MU172-CF4-AXIS-FIXED, relation_id: MR172-CF4-AXISPERM-002, defect: retain_untransformed_output_frame}
  - {mutation_id: MU172-CF4-LINEAR-POWER, relation_id: MR172-CF4-QUADRATIC-003, defect: scale_quadratic_power_linearly}
  - {mutation_id: MU172-CF4-DROP-INTERCEPT, relation_id: MR172-CF4-MONOPOLE-004, defect: force_flow_only_design}
  - {mutation_id: MU172-B-EVEN-KERNEL, relation_id: MR172-B-INDEX-ODD-005, defect: absolute_value_erases_kernel_sign}
  - {mutation_id: MU172-B-OFFSUPPORT, relation_id: MR172-B-SUPPORT-006, defect: inject_off_support_coupling}
  - {mutation_id: MU172-B-M0-PLUS, relation_id: MR172-B-M0-CANCEL-007, defect: replace_signed_kernel_by_absolute_value}

mutation_contract:
  exact_execution_count: 7
  each_mutant_must_change_intended_surface: true
  each_mutant_must_be_killed_by_registered_relation: true
  crash_skip_xfail_or_missing_envelope_is_survivor: true
  tracked_production_sources_must_not_be_edited: true
  zero_survivors_required_for_any_success_token: true

lineage:
  kind: same_production_adapter_metamorphic_pair
  independent_numerical_oracle_count: 0
  base_and_transformed_runs_are_independent_oracles: false
  pr123_reference_or_fixture_reused: false
  co04_delta: anisotropy_specific_frame_projection_and_B_index_relations

terminal_routing:
  precedence:
    - BLOCKED_CONTRACT_INVALID
    - INCONCLUSIVE_EVIDENCE_INCOMPLETE
    - BLOCKED_METAMORPHIC_RELATION_VIOLATION
    - PASS_METAMORPHIC_SELF_CONSISTENCY_C1
  rules:
    - when: registry_source_schema_or_replay_invalid
      result: BLOCKED_CONTRACT_INVALID
    - when: required_execution_or_provenance_missing
      result: INCONCLUSIVE_EVIDENCE_INCOMPLETE
    - when: any_clean_relation_fails_or_any_registered_mutant_survives
      result: BLOCKED_METAMORPHIC_RELATION_VIOLATION
    - when: all_clean_relations_pass_all_mutants_killed_and_replay_matches
      result: PASS_METAMORPHIC_SELF_CONSISTENCY_C1
  scientific_status_for_every_route: OPEN
  public_use_for_every_route: false

deterministic_replay:
  fresh_processes: 2
  environment:
    PYTHONHASHSEED: '0'
    OPENBLAS_NUM_THREADS: '1'
    OMP_NUM_THREADS: '1'
    MKL_NUM_THREADS: '1'
  semantic_digest_fields: [source_bindings, fixtures, relations, primitive_metrics, mutation_records, terminal]
  excluded_volatile_fields: [runtime_seconds, pid, generated_at_utc, temporary_path]

acceptance:
  - all relation and mutation identifiers execute exactly once
  - derived relation, mutation, adapter, and terminal states are recomputed from primitive metrics
  - no bool value is accepted as an integer execution count
  - deterministic fresh-process semantic digests match
  - CO-04 delta states correlated same-estimator lineage
  - result and manifest preserve C1, OPEN, standard_internal, and public_use false
  - a clean relation failure remains a reproducible terminal result and does not satisfy PR-180 requires_success

forbidden_output_language:
  - physical parity validated
  - matched-null or covariance validated
  - observed anisotropy detected
  - independent oracle
  - Bianchi geometry detected
  - Bianchi family identified
  - external transfer validated as native
