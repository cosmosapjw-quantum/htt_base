# PR-124 typed theorem-signature successor registry (v2).
# Generated once by PR-124 and hand-maintained afterwards; the
# loader/validator is htt/src/common/theorem_signatures.py.
schema: htt.theorem_registry.v2
owner: COMMON
claim_tier: diagnostic_only
legacy_registry_path: docs/research_program/THEOREM_REGISTRY.yaml
legacy_registry_sha256: 266374abc05b179cf32e12020ced0624643f525cd42f8fcead05c9542c74f315
counting_rule: counts_toward_theorem_count = CHECKED signature AND evidence grade in {published_proof,
  independent_derivation, checked_derivation} AND legacy status in {ACTIVE, ACTIVE_CONDITIONAL}. sanity
  anchors, specifications, numerical tests, superseded/retracted/withheld/planned entries, and unchecked
  signatures never count; engine re-evaluation never adds a derivation.
caveats:
- This registry is governance metadata; it validates no theorem by itself.
- MIGRATION_PENDING entries are excluded from theorem counts and from all-parameter prose generation until
  fully typed.
- The legacy registry stays byte-frozen for the v9 report lane; active consumers traverse this successor
  only.
