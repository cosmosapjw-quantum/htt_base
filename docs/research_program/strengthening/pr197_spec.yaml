schema: htt.strengthen_spec.v1
pr_id: PR-197
title: Cluster-exchangeable / split finite-null rank theorem and symmetric scorer
baseline_commit: 5255be072658dfe7d492b51b27968b2b2e84fc84
frozen_before_result: true
owner: OBSSTAT
targets_audit_criticisms: [H11]
risk_tier: R2
claim_ceiling: {scheme: roadmap_rescue_v1, level: C1}
public_use: false

strengthened_claim: >
  A finite-sample exact rank test requires (i) the score fixed on an INDEPENDENT
  training ensemble so the observation and calibration units pass through a
  byte-identical scoring pipeline, and (ii) reused/correlated units handled as
  independent cluster units -- one predeclared representative per independent
  cluster. Under exchangeability of (observation, one representative per cluster)
  the rank is uniform, so P(reject) <= alpha exactly (Phipson-Smyth discrete
  support); the naive all-rows procedure that treats correlated rows as
  independent is only an EMPIRICAL rank and its exact-test label is refused.

decisive_falsifier: >
  Fails if the exact small-N enumeration shows rejection probability > alpha for
  any tie pattern of the cluster-safe rank, if the observation leaks into the
  score fit, or if the naive reused-cluster procedure is granted an exact label.

interfaces:
  module: htt/src/common/cluster_exchangeable_rank.py
  runner: scripts/codex_harness/run_pr197_cluster_rank.py
  card_out: docs/generated/pr197_result_card.json

pass_gate_conjunctive:
  - N<=12 exact enumeration: the cluster-safe rank has rejection probability
    <= alpha for every tie pattern.
  - a moderate reproducible Monte-Carlo (card budget, documented) gives a 99%
    one-sided size upper bound <= alpha + tolerance for the cluster-safe split;
    the full publication budget (20 DGP x 10 seed x >=20k reps) is recorded as
    a parameter with the reference-run evidence.
  - the observation and calibration scores are byte-equivalent after the training
    object is fixed (no observation leakage into the fit).
  - cluster representative / permutation / randomized variants agree within MC 2SE.
  - the naive reused-cluster negative control is refused an exact label.

fail_kill_gate:
  - observation leakage into the score fit.
  - cluster ids missing or ambiguous.
  - any size cell fails the exact enumeration.

independence_gate_status_on_close: OPEN
readiness_target_on_close: EVIDENCE_READY
notes: >
  The exactness is PROVEN by the small-N enumeration; the Monte-Carlo corroborates
  at a moderate card budget (the full 20x10x20k publication budget is documented,
  with the strengthening package's reference validation_outputs as large-budget
  evidence). Reference asset: cluster_exchangeable_rank.py.
