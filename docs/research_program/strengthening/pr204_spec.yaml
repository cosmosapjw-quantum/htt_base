route:
  selected: validated_band_post_reconstruction
  raw_qe_selected: false
  statement: >
    Calibrate the already-frozen PR-177 strict-band reconstructed-kappa
    modulation estimator with paired, hard-reprojected variance-modulation
    injections into all 400 authenticated ACT DR6 release reconstructions.
  boundary: >
    This is a post-reconstruction release-alm response test. It is not a
    pre-QE injection, raw-QE reproduction, RDN0 validation, or validation of
    the ACT reconstruction transfer.

