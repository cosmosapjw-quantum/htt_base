harmonic_contract:
  coordinate_frame: Equatorial
  support: "40 < L < 763"
  integer_min: 41
  integer_max: 762
  endpoints_included: false
  nside: 1024
  ordering: RING
  synthesis_lmax: 762
  mask_variant: baseline
  mask_threshold: 0.99
  real_y2_order: [Y20, Y21c, Y21s, Y22c, Y22s]

injection_contract:
  total_units: 400
  amplitude_magnitude: 0.08
  assignment:
    axis: "(simulation_id - 1) mod 5"
    within_axis_index: "(simulation_id - 1) div 5"
    sign: "+ for even within_axis_index; - for odd"
    response_fit: "within_axis_index 0..19; 10 positive and 10 negative per axis"
    coverage_calibration: "within_axis_index 20..39; 10 positive and 10 negative per axis"
    evaluation: "within_axis_index 40..79; 20 positive and 20 negative per axis"
  field_definition: >
    Start from the strict-band reconstructed-kappa map x(n). Form
    x_mod(n)=x(n)*sqrt(1+a*T_j(n)), where T_j is the assigned physical
    real-Y2 basis function and 1+a*T_j remains positive. Transform x_mod to
    alm, hard-zero every mode outside 41..762, synthesize the projected map,
    then run the unchanged PR-177 raw and mask-controlled feature fit.
  transform:
    map2alm_iterations: 0
    pixel_weights: false
    hard_reprojection_required: true
  paired_baseline_gate:
    cached_feature_match_absolute_tolerance: 1.0e-10

calibration_and_coverage:
  response_matrix: >
    For each input axis, regress paired injected-minus-baseline five-vectors
    on the signed amplitude without an intercept using only its 20
    response-fit units.
  response_gates:
    diagonal_min: 0.8
    diagonal_max: 1.2
    maximum_absolute_off_diagonal: 0.2
    maximum_condition_number: 2.0
  split_conformal_coverage:
    response_fit_units_per_axis: 20
    coverage_calibration_units_per_axis: 20
    evaluation_units_per_axis: 40
    score: absolute recovered-amplitude error
    quantile: "19th ordered coverage-calibration residual out of 20: ceil((20+1)*0.9)"
    minimum_evaluation_coverage_per_axis: 0.9
    maximum_absolute_evaluation_bias: 0.01
  mask_sensitivity:
    ratio: "norm(delta_q_raw-delta_q_controlled)/norm(delta_q_controlled)"
    maximum_evaluation_p95_ratio: 0.5

terminal_routing:
  pass: AUTHOR_EVIDENCE_READY_VALIDATED_BAND_RESPONSE_CALIBRATED
  fail_response: BLOCKED_INBAND_INJECTION_RESPONSE_FAILURE
  fail_coverage: BLOCKED_INBAND_INJECTION_COVERAGE_FAILURE
  fail_mask: BLOCKED_MASK_SENSITIVITY_COMPARABLE_TO_INJECTION
  fail_integrity: BLOCKED_PR204_INPUT_OR_EXECUTION_INTEGRITY
  interpretation: >
    A pass calibrates only the selected post-reconstruction strict-band
    estimator on the author side. PR-177's release-simulation-conditional
    null remains an upstream result rather than a new PR-204 result, and the
    non-author Independence gate remains OPEN. This is not a raw-QE or
    sky-anisotropy result.

resource_policy:
  raw_workers: 1
  sequential_reader: true
  required_nice: 15
  required_ionice_class: idle
  thread_caps:
    OMP_NUM_THREADS: 1
    OPENBLAS_NUM_THREADS: 1
    MKL_NUM_THREADS: 1
  minimum_free_gib_to_start: 300
  pr151_log_fresh_seconds: 1800
  collision_rule: stop_PR204_preserve_PR151
  network_access: false
  raw_payload_rehash: false
  cache: ignored_atomic_per_unit

kill_switches:
  - any injected or measured mode outside integer 41..762
  - any use of fewer than the registered 400 release simulations
  - any observed/simulation, raw/control, or calibration/evaluation path drift
  - response, coverage, bias, or mask-sensitivity gate failure
  - any label implying pre-QE injection, raw-QE reproduction, detection, isotropy, cosmological anisotropy, geometry, or family identification
