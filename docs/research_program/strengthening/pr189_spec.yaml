schema: htt.strengthen_spec.v1
pr_id: PR-189
title: General joint feasible-set support theorem and certified comparator optimizer
baseline_commit: 9cac1fc3ba10ad68ddf6ffe89878e71306f21f1a
frozen_before_result: true
owner: HTT
targets_audit_criticisms: [H05, H06]
risk_tier: R3-CAS
claim_ceiling: {scheme: roadmap_rescue_v1, level: C1}
public_use: false
strengthened_claim: >
  For a compact feasible set F the comparator identified set is the exact interval
  I_C = [inf_F c^T g, sup_F c^T g]; the product-box formula is the corollary that
  holds only when F factorizes. On a coupled polytope the joint support is
  strictly narrower than the product box. I_C is computed by exact-rational vertex
  enumeration (the certified authority) and cross-checked by a floating HiGHS LP;
  empty / bounded topology is an explicit output.
decisive_falsifier: >
  Fails if the certified (exact) and HiGHS optimizers disagree on the interval, if
  a product-box endpoint is reported as sharp when the joint set is strictly
  narrower, or if an infeasible system is not classified empty.
interfaces:
  module: htt/src/common/joint_feasible_set.py
  runner: scripts/codex_harness/run_pr189_joint.py
  card_out: docs/generated/pr189_result_card.json
  cas_contract: docs/generated/pr189_cas/CAS_CONTRACT_PR189_JOINT.json
pass_gate_conjunctive:
  - exact-rational joint interval and the HiGHS cross-check agree on the coupled
    fixture; the joint interval is strictly inside the product box.
  - a factorized fixture gives joint = product (the corollary).
  - an infeasible system is classified empty (InfeasibleError).
  - random feasible witnesses never fall outside the certified interval.
  - five-axis blind CAS confirms joint sup 1 < product sup 2 (strict) on the
    coupled fixture and joint sup = product sup 2 factorized -> CAS_5AXIS_PASS.
fail_kill_gate:
  - certified and floating optimizers disagree.
  - product endpoint reported sharp when joint is strictly narrower.
  - feasible-set topology misclassified.
independence_gate_status_on_close: OPEN
readiness_target_on_close: EVIDENCE_READY
notes: >
  Reference asset joint_comparator_feasible_set.py. Lean and Rocq are
  kernel-independent proof-assistant lineages on the strict-containment fact.
