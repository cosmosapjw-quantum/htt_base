frozen_before_result: true
owner: COMMON
targets_audit_criticisms: [H02, H03, H09, H10]
risk_tier: R3-CAS
claim_ceiling: {scheme: roadmap_rescue_v1, level: C1}
public_use: false

strengthened_claim: >
  The component vector g carries a congruence/frame type (g[n], g[u], g[obs]) and
  a perturbative order; DeltaOmega_k is a signed real, while Sigma^2/W^2/Omega_tilt
  are nonnegative (positive block). The ambient carrier is S+^3 x R: the PSD-cone
  embedding applies only to the positive block, never to the signed curvature axis.
  Cross-frame / cross-type arithmetic is admitted only through a registered bridge
  with a declared remainder. Boost order is a type parameter: Omega_tilt =
  (1+w) Omega_m sinh^2(beta) is O(beta^2), the observer-boost kinematic quadrupole
  is O(beta^2), so subtracting alpha*Omega_tilt^2 (O(beta^4)) can NOT remove the
  O(beta^2) kinematic quadrupole -- the order-correct deprojection subtracts an
  O(beta^2) term.

decisive_falsifier: >
  Fails if an unregistered cast lets n-frame curvature and u-frame vorticity enter
  one comparator, if the signed DeltaOmega_k is clipped by a PSD projection, if the
  Omega_tilt^2 (O(beta^4)) subtraction is admitted against an O(beta^2) quadrupole,
  or if a registered round-trip frame transformation has nonzero residual.

interfaces:
  module: htt/src/common/frame_typed_algebra.py
  runner: scripts/codex_harness/run_pr187_frame_typed.py
  card_out: docs/generated/pr187_result_card.json
  cas_contract: docs/generated/pr187_cas/CAS_CONTRACT_PR187_FRAME_ORDER.json

pass_gate_conjunctive:
  - registered-fixture round-trip frame (boost beta then -beta) residual exactly 0.
  - 50 wrong-frame / wrong-order mutations all rejected by the typed algebra.
  - the PSD-cone theorem applies to the positive block only; DeltaOmega_k positive
    and negative branches both pass property tests.
  - a static/type gate catches the forbidden Omega_tilt^2 (O(beta^4)) subtraction
    against the O(beta^2) kinematic quadrupole; the order-correct O(beta^2)
    deprojection is admitted.
  - single-stream vs antipodal-pair Omega_tilt density conventions are exact and
    the factor-two pairing is registered (H10).
  - five-axis blind CAS (Wolfram+xAct, SymPy, Sage+Singular, Lean, Rocq) confirms
    the order facts (Omega_tilt=O(beta^2), quadrupole=O(beta^2), Omega_tilt^2=
    O(beta^4), 4 != 2) and the exact rapidity round-trip -> CAS_5AXIS_PASS.

fail_kill_gate:
  - implicit cast or a default frame exists.
  - hypersurface curvature is forced on a vortical (omega != 0) congruence.
  - the factor-two pair convention is undefined.

independence_gate_status_on_close: OPEN
readiness_target_on_close: EVIDENCE_READY
kill_switch: >
  Roadmap section 10.2 -- PR-187 must pass before any new comparator number is
  authoritative; this card does not regenerate comparator numbers, it fixes the
  type system that guards them.
