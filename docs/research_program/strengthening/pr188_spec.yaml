schema: htt.strengthen_spec.v1
pr_id: PR-188
title: Hermetic reproduce path, load-bearing mutation firewall, checksum data recipe
baseline_commit: 4ea931c6733ecc1aa3b914beb60608a7b5b9a516
frozen_before_result: true
owner: COMMON
targets_audit_criticisms: [H19, H20, H23]
risk_tier: R2
claim_ceiling: {scheme: roadmap_rescue_v1, level: C1}
public_use: false

strengthened_claim: >
  The data-free artifact set (theorem seals, dual-axis ledger, the W2 and
  frame-typed cards, the v10 report text) regenerates from tracked inputs alone
  with zero private-absolute-path or implicit-PYTHONPATH dependency, and each
  regenerated claim is load-bearing on its source (a mutation of a load-bearing
  source flips the artifact --check to failure). The external data cache is
  resolved through a checksum-bound data-root recipe (HTT_DATA_ROOT); missing
  data yields an explicit BLOCKED exit, never a silent skip.

decisive_falsifier: >
  Fails if the hermetic reproduce path reads a private absolute path, if a
  load-bearing source mutation leaves the artifact --check green, if a
  non-load-bearing (dead) source is claimed load-bearing, or if missing external
  data is silently skipped instead of a BLOCKED exit.

interfaces:
  data_root: htt/src/common/data_root.py
  reproduce: scripts/codex_harness/reproduce_hermetic.py
  runner: scripts/codex_harness/run_pr188_hermetic.py
  card_out: docs/generated/pr188_result_card.json

pass_gate_conjunctive:
  - the hermetic reproduce path regenerates every data-free artifact byte-identically
    and has zero /mnt, /home, or implicit-PYTHONPATH dependency (scanned).
  - >=15 load-bearing mutations each flip the target artifact --check to failure
    (the artifact is load-bearing on that source); a dead-source negative control
    leaves the artifact green.
  - the checksum data-root recipe resolves the external cache when present and
    returns an explicit BLOCKED exit 2 when absent (no silent skip).
  - the hermeticity scan reports every active module that hard-codes a private
    absolute path as a migration finding (surfaced, not hidden).
  - CI-style collect/executed receipt records a nonzero executed count; a
    zero-test mutation is rejected.

fail_kill_gate:
  - a private absolute path is on the hermetic reproduce path.
  - a load-bearing mutation leaves the artifact green.
  - missing external data is silently skipped.

independence_gate_status_on_close: OPEN
readiness_target_on_close: EVIDENCE_READY
notes: >
  The two-clean-container identical-hash replication is the external Independence
  gate and stays OPEN this session (no container runtime invoked). The sealed
  data modules (boost_biposh_residual.py, k1_evenl_biposh_rank.py) hard-code the
  /mnt cache; they are surfaced by the hermeticity scan as a migration backlog and
  are NOT edited (their PR-180 / v10 seals stay byte-identical). The hermetic
  reproduce path deliberately excludes the data-dependent cards.
