schema: htt.strengthen_spec.v1
pr_id: PR-200
title: Calibrated partial-identification confidence set with continuum coverage
baseline_commit: 5aa4e7f96ae218de15e4237d7f91690b8d8c2945
frozen_before_result: true
owner: HTT
targets_audit_criticisms: [H14]
risk_tier: R2
claim_ceiling: {scheme: roadmap_rescue_v1, level: C1}
public_use: false
strengthened_claim: >
  The honest CF4 simultaneous coverage 0.913 is a FAILURE of applying a
  point-estimate confidence interval to a partially-identified parameter, not a
  calibrated set. The Imbens-Manski construction restores simultaneous coverage
  of the true point at the least-favorable identified-set boundary across the
  point / weak / nonidentified regimes; crossing samples are routed to a
  pseudotrue (never-empty) branch.
decisive_falsifier: >
  Fails if the IM confidence set's 99% one-sided lower coverage bound is < 0.94 in
  any pre-registered regime, if a mesh refinement shifts coverage beyond
  tolerance, or if the point-estimate CI is not shown to undercover.
interfaces:
  module: htt/src/common/partial_id_coverage.py
  runner: scripts/codex_harness/run_pr200_coverage.py
  card_out: docs/generated/pr200_result_card.json
pass_gate_conjunctive:
  - the IM set's 99% CP lower coverage bound is >= 0.94 in every regime cell (card
    budget); the full 25 DGP x 3 cov x 10 seed x 10k publication budget is documented.
  - the point-estimate Gaussian CI is demonstrated to undercover (the 0.913-class
    pathology), quantitatively worse as the identified set widens.
  - two mesh refinements of the half-width grid change coverage by < 0.01.
  - crossing / empty samples are routed to a pseudotrue never-empty branch.
fail_kill_gate:
  - any regime cell undercovers below 0.94.
  - point-estimate CI not shown to undercover.
  - empty samples produce an empty set.
independence_gate_status_on_close: OPEN
readiness_target_on_close: EVIDENCE_READY
notes: Reference asset coverage_gate.py (Clopper-Pearson / Wilson / planned_n).
