schema: htt.strengthen_spec_erratum.v1
pr_id: PR-186
amends: docs/research_program/strengthening/pr186_spec.yaml
frozen_spec_unchanged: true
reason: >
  The frozen PR-186 spec set the CAS minimum at "two independent derivation
  lineages; blind four-axis CAS a deferred follow-up (CAS_BLOCKED legitimate)".
  After the freeze, the CAS policy was repaired (ADJ-CAS-ROCQ-AXIS-001): Rocq
  (Coq) joins Lean as a second kernel-independent proof-assistant lineage, and
  the gate became a five-axis blind CAS. PR-186 therefore EXCEEDS its frozen
  minimum with a genuine CAS_5AXIS_PASS. This erratum records the strengthening;
  the frozen spec sha256 is unchanged and its minimum still holds a fortiori.
cas_upgrade:
  contract: docs/generated/pr186_cas/CAS_CONTRACT_PR186_W2.json (htt.cas_contract.v3)
  axes: [wolfram_xact, sympy, sage_singular, lean, rocq]
  aggregate: CAS_5AXIS_PASS
  kernel_independent_lineages: [lean, rocq]
  note: >
    Wolfram+xAct / SymPy / Sage+Singular give symbolic universal proofs; Lean
    gives kernel-checked exact-rational witness evaluation (native_decide); Rocq
    gives a universal Ring proof on an independent kernel. All five PASS under
    one contract hash; no majority vote.
