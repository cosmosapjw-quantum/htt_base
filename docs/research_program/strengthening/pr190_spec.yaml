publication_group_id: PG-PR190-TYPED-COMPARATOR-ATTAINABILITY
title: Typed comparator endpoint attainability and dynamical sharpness programme
baseline_commit: 7214ef7e91763ed807e0e350e1cfeffb82cec0f5
baseline_tree: ca06887abc3f7c8dae94cbab08115fd061dfae09
frozen_before_result: true
owner: BASS
contributors: [COMMON]
adjudicator_role: independent_non_author_reviewer
risk_tier: R3
artifact_mode: standard_internal
execution_authorization: DAG_SCHEDULABLE
public_use: false
claim_tier_ceiling: theorem_candidate
capability_before_pr285: CONTRACT_VALIDATED_ONLY

dependencies:
  - {id: PR-187, mode: requires_success}
  - {id: PR-189, mode: requires_success}
  - {id: PR-249, mode: requires_success}

claim_identity:
  claim_id: C-PR190-FULL-COMPARATOR-ATTAINABILITY
  statement: >-
    The lower endpoint, upper endpoint, and every interior value of the
    registered open-branch comparator interval [11/100, 17/100] are realized
    in one declared frame and convention by admissible Einstein-matter
    solutions.  Algebraic, constraint, local-dynamical, and global-dynamical
    sharpness are separate conjunctive levels; no lower level promotes a
    higher level.
  success_token: FULL_TYPED_DYNAMICAL_SHARPNESS_CANDIDATE
  refuted_token: FULL_TYPED_DYNAMICAL_SHARPNESS_REFUTED
  blocked_token: FULL_TYPED_DYNAMICAL_SHARPNESS_BLOCKED_WITH_RECEIPT
  not_established:
    - theorem capability before PR-285 adjudication
    - observed-data result
    - native low-ell solver result
    - native morphology atlas result
    - Bianchi family identification

controlling_conventions:
  metric_signature: (-,+,+,+)
  spatial_basis: STF5_CARTESIAN_XX_YY_XY_XZ_YZ_V1
  kinematic_units: SIGMA_OVER_THETA_STF5_AND_OMEGA_OVER_THETA_AXIAL3
  theta_relation: Theta=3H with H>0
  normalized_invariants:
    Sigma2: (3/2)*norm_F(sigma/Theta)^2
    W2: 3*norm_2(omega/Theta)^2
  comparator: x_C=Sigma2-W2+Omega_tilt+DeltaOmega_k
  transfer_source: none
  frame_rule: >-
    Every endpoint binding seals one JointAnisotropyState, one orbit-v3
    report, frame, congruence class, matter model, epoch window, and averaging
    scale. Cross-frame substitution is refused.
  congruence_rule: >-
    A Bianchi-I hypersurface-normal congruence is hypersurface orthogonal and
    therefore has omega_ab[n]=0. A nonzero W2 target in that same congruence
    is a constraint-level contradiction, not a free rotational mode.

registered_targets:
  lower:
    endpoint_id: PR190-LOWER-XC-11-100
    solution_class: BIANCHI_I_HOMOGENEOUS
    congruence_class: HYPERSURFACE_NORMAL
    invariants:
      Sigma2: 3/25
      W2: 1/25
      Omega_tilt: 3/100
      DeltaOmega_k: 0
      x_C: 11/100
  upper:
    endpoint_id: PR190-UPPER-XC-17-100
    solution_class: BIANCHI_V_HOMOGENEOUS
    congruence_class: HYPERSURFACE_NORMAL
    invariants:
      Sigma2: 3/25
      W2: 0
      Omega_tilt: 3/100
      DeltaOmega_k: 1/50
      x_C: 17/100
  interior_challenge:
    endpoint_id: PR190-INTERIOR-XC-12-100
    solution_class: BIANCHI_I_HOMOGENEOUS
    congruence_class: HYPERSURFACE_NORMAL
    invariants:
      Sigma2: 3/25
      W2: 3/100
      Omega_tilt: 3/100
      DeltaOmega_k: 0
      x_C: 12/100

sharpness_levels:
  - id: algebraic
    pass: every sealed state reproduces its registered invariants and x_C
  - id: constraint
    pass: each state satisfies frame-compatible Gauss, momentum, Frobenius, and matter constraints
  - id: local_dynamical
    pass: admissible initial data have a registered local Einstein-matter development
  - id: global_dynamical
    pass: the registered solution remains in-domain over the declared evolution interval

cas_contract: docs/research_program/strengthening/pr190_cas/CAS_CONTRACT.json
cas_run_spec: docs/research_program/strengthening/pr190_cas/CAS_RUN_SPEC.json
required_cas_axes: [wolfram_xact, sympy, sage_singular, lean]
optional_non_gating_axes: [rocq]
cas_scope: >-
  The four canonical axes independently verify the exact normal-frame
  vorticity obstruction and the nonpromotion implication. They do not prove
  an Einstein-matter evolution or turn the negative result into a theorem
  capability.

pass_gate_conjunctive:
  - all three registered targets have replayable typed state and orbit identities
  - frame, congruence, matter model, epoch, scale, units, and transfer provenance match
  - algebraic, constraint, local-dynamical, and global-dynamical levels are reported separately
  - all four required CAS axes run under one contract and one assumption branch
  - every endpoint and the full interior family attain all four levels
  - independent non-author review accepts the exact claim without weakening

negative_closeout_rule: >-
  A decisive contradiction at any conjunctive level closes PR-190 as
  COMPLETED_FAILED_WITH_RECEIPT with success_dependency_satisfied=false.
  The failed statement is not weakened, and downstream requires_success edges
  remain closed. Tests may pass by faithfully reproducing this terminal
  negative result.

kill_conditions:
  - any frame, congruence, unit, branch, matter-model, epoch, or scale mismatch
  - the statement must be weakened to pass
  - any required CAS axis is absent or uses a different assumption branch
  - an algebraic or constraint witness is called a cosmological solution
  - a withdrawn W2 endpoint is silently replaced by a shear endpoint

forbidden_actions:
  - auto-promote a JointAnisotropyState to a physical solution witness
  - treat optimizer convergence as proof of attainability
  - treat antipodal matter-flux cancellation as normal-congruence vorticity
  - grant theorem capability before PR-285
  - use observed or partially acquired data
  - claim native solver, native atlas, geometry detection, or family identification

required_outputs:
  module: htt/src/common/comparator_attainability.py
  runner: scripts/codex_harness/run_pr190_attainability.py
  focused_test: tests/pr_cards/test_pr_190_strengthen.py
  result: docs/generated/pr190_attainability/attainability_report.json
  cas_adjudication: docs/research_program/strengthening/pr190_cas/CAS_ADJUDICATION.json
  delta: docs/PR_DELTAS/pr-190.md
