candidate_contract:
  exact_ids:
    - PLANCK_PR3_FFP10_SMICA_COMPACT_REFERENCE
    - CF4_QUERY_BATCH_COMPACT_REFERENCE
    - DESI_DR1_PR151_PARTIAL_BACKGROUND
    - PLANCK_NAME_ONLY_CONTROL
    - HSC_NAME_ONLY_CONTROL
    - KIDS_NAME_ONLY_CONTROL
  exact_component_roles: [data, mask, covariance]
  required_identity_fields:
    - source_identity
    - release_version
    - license_identity
    - repository_path
    - content_sha256
    - sky_support_status
    - sky_support_identity
    - directional_convention
    - covariance_identity
    - transfer_provenance
    - required_fields
  closed_schema: true
  duplicate_candidate_ids: forbidden
  typed_identity_registry:
    schema: htt.pr274.data_identity_registry.v1
    evidence_schema: htt.pr274.data_identity_evidence.v1
    production_membership: empty
    population_requires_separate_review: true

admission_requirements:
  source_identity:
    rule: >-
      a product or survey name and a bare scheme prefix are not source
      identities; BOUND requires an exact typed registry row and bound
      repository evidence bytes
    accepted_status: BOUND
  release:
    rule: >-
      an explicit version-bearing release token is mandatory and must exactly
      match both the typed registry row and its bound evidence bytes
    accepted_status: BOUND
  license:
    rule: >-
      a non-empty resolvable license identity is mandatory and must exactly
      match both the typed registry row and its bound evidence bytes
    accepted_status: BOUND
  repository_binding:
    rule: every required component is a regular non-symlink file below the declared repository root and matches its sha256
  sky_support:
    rule: >-
      the sky-support identity must equal the bound mask/selection component
      sha256 and the directional convention must use the closed v1 vocabulary
    accepted_status: BOUND
  covariance:
    rule: >-
      a separately identified covariance component is mandatory and its
      covariance identity must equal the bound component sha256
  transfer:
    rule: >-
      v1 admits explicit none_observer_side only; every transfer-dependent
      candidate is refused until a typed non-native TransferFunctionSpec
      registry contract is added in a separately reviewed schema revision
    forbidden_values: [MISSING, native_solver, native_morphology_atlas]
  fields:
    rule: every preregistered required field must be present
  acquisition:
    forbidden_values:
      - PARTIAL_BACKGROUND_ACQUISITION
      - NAME_ONLY
      - INCOMPLETE
  pr151:
    partial_scientific_use: forbidden
    canonical_status_required: background_in_progress

decision_contract:
  admitted_input_status: ADMITTED_FOR_SEPARATE_PILOT_AUTHORIZATION
  admitted_without_execution_authority: ADMITTED_INPUTS_AWAITING_EXECUTION_AUTHORIZATION
  no_admitted_input_status: NO_ADMITTED_DATA_PILOT
  pilot_executed: false
  execution_side_effects: forbidden
  requirement: >-
    Admission and pilot execution authorization are separate decisions.
    This change set may produce admission verdicts only.

outputs:
  result:
    path: docs/research_program/vector_tensor/data_admission/PR274_ADMISSION_RESULT.json
    artifact_mode: data_admission_preflight
  allowed_use:
    - repository-bound input gap analysis
    - pre-solver data-admission planning
  forbidden_use:
    - observed-data inference
    - claim-bearing figure
    - transfer validation
    - native solver or morphology-atlas validation
    - geometry detection
    - Bianchi family identification or ranking

tests:
  focused:
    command: PYTHONPATH=htt/src:htt python -B -m pytest -p no:cacheprovider -q tests/contracts/test_vector_tensor_data_admission.py
  generator_check:
    command: python -B scripts/codex_harness/build_pr274_data_admission.py --check
  adjacent:
    command: python -B scripts/codex_harness/run_pr274_data_admission.py adjacent
  smoke:
    command: python -B scripts/codex_harness/run_pr274_data_admission.py smoke

kill_conditions:
  - dataset name alone passes admission
  - an unbound or hash-mismatched required component passes
  - PR-151 partial or background bytes pass as complete input
  - admission silently implies execution authorization
  - this change set executes an observed-data pilot
  - raw or incomplete data enters a claim-bearing figure
  - a native-solver, geometry, or family-identification claim appears
