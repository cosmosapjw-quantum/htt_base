pre_execution_revision:
  reason: >-
    The canonical status file must change when PR-274 closes, so freezing its
    whole-file hash would make the admission generator fail after an honest
    closeout. PR-151 status is therefore checked as live semantic authority,
    while the execution-time status hash remains result provenance.
  result_inspected_before_revision: false
failed_review_remediation:
  failed_candidate_sha: c8230ff6cc52aeddf98b632ff5469386352e535f
  review_run: .agent-harness/runs/pr274-final-review-20260730-r1
  disposition: FAILED_PRESERVED
  repaired_before_next_preflight:
    - bound status no longer overrides missing source, release, or license identity
    - a product name cannot serve as its own source identity
    - sky-support identity, directional convention, and covariance identity are explicit
    - arbitrary transfer strings are refused pending a typed non-native registry contract
    - frozen registry date, scope, membership, order, and required fields are exact
    - the PR delta exists before the next claim-language review
second_failed_review_remediation:
  failed_candidate_sha: 1fd766b08bc60b03161b8d0ddfd5a990ffe10943
  review_run: .agent-harness/runs/pr274-final-review-20260730-r2
  disposition: FAILED_PRESERVED
  repaired_before_next_preflight:
    - bare source and license prefixes are not resolvable identities
    - a release placeholder must carry an explicit version token
    - every BOUND source, release, and license triple must match one typed registry row
    - the typed registry row must resolve to regular non-symlink repository evidence with an exact sha256
    - identity evidence bytes must restate the exact candidate, product, source, release, and license tuple
third_failed_review_remediation:
  failed_candidate_sha: f1edad211fafc3fae36a7493f0dd9b5580a80dfb
  review_run: .agent-harness/runs/pr274-final-review-20260730-r3
  disposition: FAILED_PRESERVED
  repaired_before_next_preflight:
    - identity evidence JSON rejects duplicate object keys before semantic comparison
    - identity evidence JSON rejects NaN, Infinity, and negative Infinity constants
    - ambiguous bytes cannot be legitimized by registering their own sha256

