schema_version: 1
work_unit_id: PR-266
title: Typed depth, mask, transport, and coherence path
target_ref: origin/research/pr04-multicomponent
target_sha: e7c20643c0dd323481f0887aff8e437a1bf7950a
change_set_id: CS-PR266-DEPTH-MASK-PATH
publication_group_id: PG-PR266-DEPTH-MASK-PATH
dependencies:
  - PR-264
owner: OBSSTAT
contributors:
  - MIO
  - HTT
  - COMMON
capability: sky_support_typed_depth_coherence_path
scientific_role: >-
  Bind an observer-side depth sequence to exact sky support, mask, selection,
  covariance, source, feature-layout, and transport identities. Evaluate MIO
  coherence and a depth-scramble negative control separately from an HTT
  model-conditional likelihood adapter. This is pre-solver methodology and
  diagnostic output, not evidence for a global tilt, geometry, or family.
public_contract:
  common_module: common.depth_path
  obsstat_module: obsstat.depth_path
  mio_module: mio.formalism.depth_path
  htt_module: htt.infer.depth_path
  types:
    - MaskStratum
    - TransportKernel
    - DepthPath
    - ObservableFeatureStep
    - DepthCoherenceReport
    - DepthScrambleControl
    - DepthModelPrediction
    - DepthLikelihoodResult
ownership:
  OBSSTAT: feature extraction and typed transport only
  MIO: diagnostic depth coherence and scramble control only
  HTT: explicit model-conditional likelihood adapter only
  COMMON: shared immutable contracts and semantic firewalls
sky_support_contract:
  authority: common.contracts.SkySupport
  nesting_rule: TARGET_SUPPORT_SUBSET_OF_SOURCE
  support_identity: exact finite unit ids and universe size
  coordinate_requirements:
    - common coordinate frame
    - common pixelization and nside
    - exact sky fraction equals retained support fraction
  non_nested: fail closed
per_stratum_provenance:
  required:
    - depth coordinate and unit
    - mask and sky-support identities
    - selection identity
    - covariance identity
    - source artifact identity
    - feature names and unit
transport_contract:
  required:
    - exact source and target stratum content identities
    - source and target feature layouts
    - mask transport identity
    - selection transport identity
    - covariance transport identity
    - method identity and assumptions
  feature_rule: y_target = K y_source
  covariance_rule: C_target = K C_source K^T
  composition: exact shared middle stratum required
coherence_contract:
  owner: MIO
  statistic: adjacent transported residual Mahalanobis square divided by rank
  covariance: target covariance plus transported source covariance
  rank_deficient: typed COVARIANCE_RANK_DEFICIENT with no score
  probability_status: not a p-value, posterior, evidence, or truth probability
negative_control:
  method: preregistered non-identity depth scramble
  pass_rule: scrambled mean normalized score degrades by the declared margin
htt_likelihood:
  owner: HTT
  hypothesis_classes:
    - LOCAL_RESPONSE
    - GLOBAL_CANDIDATE
    - SURVEY_SYSTEMATIC
    - STRUCTURED_NULL
  covariance_requirement: positive definite
  mio_report_as_prediction: forbidden
  output_status: model-conditional likelihood value only, no evidence or posterior
claim_boundary:
  ceiling: diagnostic_only
  allowed:
    - observer-side feature path
    - typed feature and covariance transport
    - MIO diagnostic coherence
    - depth-scramble negative control
    - HTT model-conditional likelihood adapter
  forbidden:
    - silent merging of incompatible sky supports
    - global-tilt evidence from coherence alone
    - native solver or native morphology-atlas result
    - geometry detection
    - Bianchi family identification
tests:
  - >-
    PYTHONPATH=.:htt/src:htt python -B -m pytest -p no:cacheprovider -q
    tests/contracts/test_depth_path.py
  - >-
    PYTHONPATH=.:htt/src:htt python -B -m pytest -p no:cacheprovider -q
    tests/htt/test_sky_support_contract.py
    tests/mio/test_redshift_binned_coherence.py
    tests/obsstat/test_bulkflow_depth.py
kill_switches:
  - non-nested or coordinate-incompatible sky supports enter one path
  - mask, selection, covariance, or source identity is dropped
  - rank-deficient covariance emits a coherence number
  - a MIO diagnostic is consumed as an HTT model prediction
  - coherence alone is labelled global evidence, native, geometry, or family
