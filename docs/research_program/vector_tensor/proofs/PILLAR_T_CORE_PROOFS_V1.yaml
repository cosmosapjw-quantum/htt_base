  source_identity:
    kind: proposal_registry_rows
    id: I-3.1
    statement_identity_sha256: 829ca929285ca36083db983171c328689c42be7627b8e0d45419fc9224cacbfd
    evidence_path: docs/research_program/vector_tensor/proof_registry_two_pillars.yaml#I-3.1
  relation_to_source: TYPED_ELABORATION_WITH_EXPLICIT_PREMISES
  statement: A budget that factors through the four registered named invariants is constant on their
    common fibres and has zero directional derivative along tangent vectors annihilated by all four
    differentials.
  statement_identity_sha256: 1d6475c2d3ca777d6b93a394b13122cc53857c0cd382c07c2581c776df587886
  assumptions:
  - the registered budget factors through tr_sigma2, omega2, beta2, and delta_omega_k
  - the budget is differentiable at the evaluated state
  - tangent directions annihilate all four named invariant differentials
  domain:
  - regular points of the common level sets of the four named invariants
  frame_convention: REGISTERED_KINEMATIC_INVARIANT_COORDINATES
  branch_convention: REAL_FINITE_REGISTERED_BRANCH
  proof_method: factorization through named invariants and the chain rule
  proof_artifact: docs/research_program/vector_tensor/proofs/PR269_PILLAR_T_CORE.md#pr269-tf-07-budget-morphology-split
  executable_evidence:
  - tests/contracts/test_pillar_t_core.py::test_tf_analytic_core_boundaries
  counterexample_boundary:
  - a budget with explicit helicity or other morphology dependence
  - a singular point where the declared differential statement is unavailable
  - replacing named factorization with a polynomial-degree claim
  verdict: PROVED_CONDITIONAL_ANALYTIC
  claim_ceiling: diagnostic_only
- proof_id: PR269-TF-08-PRODUCT-GAUGE-MAX
  obligation_id: TF-08-PRODUCT-GAUGE-MAX
  source_identity:
    kind: proposal_registry_rows
    id: II-2.1
    statement_identity_sha256: 5295198b8114e1d6e4883d7f306715ecf0d5fc72065f4cc329558fad4ba2bbf1
    evidence_path: docs/research_program/vector_tensor/proof_registry_two_pillars.yaml#II-2.1
  relation_to_source: EXACT_ANALYTIC_STATEMENT
  statement: The gauge of the Cartesian product anchor body is the maximum of the sector gauges, and
    its exceedance is max(rho - 1, 0).
  statement_identity_sha256: cd1ae40daa20e55b4e41470f83ba692a40e296683f252416beaea16de3bb5946
  assumptions:
  - each sector body is a nonempty closed centered norm ball
  - every sector radius is finite and strictly positive
  - the joint anchor is the Cartesian product of the sector bodies
  domain:
  - finite direct product of the registered sector normed spaces
  frame_convention: FRAME_FREE_PRODUCT_NORMED_SPACE
  branch_convention: REAL_FINITE_REGISTERED_BRANCH
  proof_method: Cartesian-product membership and Minkowski-gauge definition
  proof_artifact: docs/research_program/vector_tensor/proofs/PR269_PILLAR_T_CORE.md#pr269-tf-08-product-gauge-max
  executable_evidence:
  - tests/contracts/test_pillar_t_core.py::test_tf_analytic_core_boundaries
  counterexample_boundary:
  - a nonpositive or nonfinite sector radius
  - a coupled non-product joint anchor
  - a nonabsorbing sector body with a nonfinite gauge
  verdict: PROVED_ANALYTIC
  claim_ceiling: diagnostic_only
- proof_id: PR269-TF-12-ACCELERATION-EULER-SLAVING
  obligation_id: TF-12-ACCELERATION-EULER-SLAVING
  source_identity:
    kind: proposal_registry_rows
    id: I-4.1
    statement_identity_sha256: e18afc8e39a7af15870ec465ea31d5021b87db01874c5c71d5355784c6b74c42
    evidence_path: docs/research_program/vector_tensor/proof_registry_two_pillars.yaml#I-4.1
  relation_to_source: CONDITIONAL_ANALYTIC_SHAPE_ONLY
  statement: A/Theta = -[cs2/(1+w)] D ln(mu)/Theta. If eps_g is the exact norm of D ln(mu)/Theta then
    A2_std = (3/2)[cs2/(1+w)]^2 eps_g^2; if eps_g is only an upper bound, the corresponding relation
    is an upper bound on A2_std.
  statement_identity_sha256: 485736a889b71a3370ce7c78b4b685d328de56978802492c9889574de175a590
  assumptions:
  - perfect fluid
  - no heat flux
  - no anisotropic stress
  - barotropic pressure with declared sound-speed convention
  - one declared spatial gradient and congruence convention
  - mu is strictly positive
  - mu plus p is nonzero, equivalently 1 plus w is nonzero
  domain:
  - finite fluid variables with mu greater than zero and w not equal to minus one
  frame_convention: DECLARED_PERFECT_FLUID_CONGRUENCE
  branch_convention: REAL_FINITE_REGISTERED_BRANCH
  proof_method: perfect-fluid momentum equation and normalization conversion
  proof_artifact: docs/research_program/vector_tensor/proofs/PR269_PILLAR_T_CORE.md#pr269-tf-12-acceleration-euler-slaving
  executable_evidence:
  - tests/contracts/test_pillar_t_core.py::test_tf_analytic_core_boundaries
  counterexample_boundary:
  - vacuum or a nonpositive mu where ln(mu) is unavailable
  - w equals minus one so the Euler denominator vanishes
  - heat flux, anisotropic stress, or nonbarotropic pressure terms are present
  verdict: PROVED_CONDITIONAL_ANALYTIC
  claim_ceiling: diagnostic_only
- proof_id: PR269-VT-T1
  obligation_id: VT-T1
  source_identity:
    kind: vt_theorem_obligations
    id: VT-T1
    statement_identity_sha256: fe86f771d3f376c34ee82f36d491cd1fa4fd1655134ae3a9158b075059984311
    evidence_path: docs/research_program/vector_tensor/VECTOR_TENSOR_PROOF_PROGRAM_V1.yaml#VT-T1
  relation_to_source: TYPED_ELABORATION_WITH_EXPLICIT_PREMISES
  statement: Sigma2 = (sigma_ab sigma^ab)/(6 H^2) = (3/2) ||sigma/Theta||_F^2, and W2 = (omega_ab
    omega^ab)/(6 H^2) = (omega_a omega^a)/(3 H^2) = 3 ||omega/Theta||_2^2.
  statement_identity_sha256: d06b417cb8e484f07dca31aa666abf65e15e2f1165cf3957e90449c14dfeb832
  assumptions:
  - H is finite and strictly positive and Theta equals 3 H
  - sigma_ab is a spatial symmetric trace-free tensor
  - omega_ab is a spatial antisymmetric two-form with spatial dual omega_a
  domain:
  - real finite components with H greater than zero
  frame_convention: DECLARED_SPATIAL_METRIC_AND_CONGRUENCE
  branch_convention: REAL_FINITE_PRINCIPAL_BRANCH
  proof_method: index contraction and convention-exact algebra
  proof_artifact: docs/research_program/vector_tensor/proofs/PR269_PILLAR_T_CORE.md#pr269-vt-t1
  executable_evidence:
  - tests/contracts/test_pillar_t_core.py::test_vt_analytic_core_exact_vectors
  - tests/contracts/test_pillar_t_core.py::test_vt_analytic_core_mutations_refuse
  counterexample_boundary:
  - H or Theta zero
  - non-spatial or non-STF shear
  - polar rather than axial vorticity-vector convention
  verdict: PROVED_ANALYTIC
  claim_ceiling: diagnostic_only
