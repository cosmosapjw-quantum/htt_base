- proof_id: PR269-VT-T9
  obligation_id: VT-T9
  source_identity:
    kind: vt_theorem_obligations
    id: VT-T9
    statement_identity_sha256: b33994613f9fa7b26f4546732b3e5470f831698d04b62b9f1578cf8792567e9d
    evidence_path: docs/research_program/vector_tensor/VECTOR_TENSOR_PROOF_PROGRAM_V1.yaml#VT-T9
  relation_to_source: TYPED_ELABORATION_WITH_EXPLICIT_PREMISES
  statement: A polar vector transforms as R v and an axial vector as det(R) R w; polar-polar and axial-axial
    contractions are scalars, while polar-axial contraction is a pseudoscalar. Proper rotations preserve
    all contractions and reflections flip only pseudoscalars.
  statement_identity_sha256: 606794846644e0e80a4674877c800c83f82976c2a27970e2428304ba68b4419d
  assumptions:
  - R is orthogonal in three spatial dimensions
  - polar and axial slots retain their parity types
  domain:
  - O(3), with SO(3) as the determinant-positive subgroup
  frame_convention: ACTIVE_CARTESIAN_O3_ACTION_V1
  branch_convention: REAL_FINITE_PRINCIPAL_BRANCH
  proof_method: determinant bookkeeping in the O(3) representation
  proof_artifact: docs/research_program/vector_tensor/proofs/PR269_PILLAR_T_CORE.md#pr269-vt-t9
  executable_evidence:
  - tests/contracts/test_pillar_t_core.py::test_vt_analytic_core_exact_vectors
  - tests/contracts/test_pillar_t_core.py::test_vt_analytic_core_mutations_refuse
  counterexample_boundary:
  - erasing polar or axial type
  - treating an O(3) reflection as an SO(3) action
  verdict: PROVED_ANALYTIC
  claim_ceiling: diagnostic_only
- proof_id: PR269-VT-T10
  obligation_id: VT-T10
  source_identity:
    kind: vt_theorem_obligations
    id: VT-T10
    statement_identity_sha256: 01bb50795b0f36e2d00f3660f7f4f1e508f2b7fc543ed5026e129a055575cd3a
    evidence_path: docs/research_program/vector_tensor/VECTOR_TENSOR_PROOF_PROGRAM_V1.yaml#VT-T10
  relation_to_source: TYPED_ELABORATION_WITH_EXPLICIT_PREMISES
  statement: k = r u with r = p_A(k), u = k/r, and p_A(u) = 1; r and u are unique. The group orbit
    of u is the normalized orbit shape.
  statement_identity_sha256: 2a051f7d2e05b43fd5ee4aded07958937ed540d25915b908e21f6186ef3f352c
  assumptions:
  - A is a group-invariant gauge body
  - k is nonzero and r = p_A(k) is finite and strictly positive
  domain:
  - nonzero finite-gauge states
  frame_convention: REGISTERED_GROUP_ACTION_ON_TYPED_STATE_SPACE
  branch_convention: REAL_FINITE_PRINCIPAL_BRANCH
  proof_method: positive one-homogeneity and normalization uniqueness
  proof_artifact: docs/research_program/vector_tensor/proofs/PR269_PILLAR_T_CORE.md#pr269-vt-t10
  executable_evidence:
  - tests/contracts/test_pillar_t_core.py::test_vt_analytic_core_exact_vectors
  - tests/contracts/test_pillar_t_core.py::test_vt_analytic_core_mutations_refuse
  counterexample_boundary:
  - k equals zero
  - gauge has a nontrivial null direction
  - A is not group invariant when orbit invariance is claimed
  verdict: PROVED_ANALYTIC
  claim_ceiling: diagnostic_only
