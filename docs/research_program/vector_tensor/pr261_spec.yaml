schema_version: 1
work_unit_id: PR-261
title: Canonical joint vector/tensor anisotropy state
target_ref: origin/research/pr04-multicomponent
target_sha: cb25861932b65ce54970351810dff22291685ca8
change_set_id: CS-PR261-JOINT-ANISOTROPY-STATE
publication_group_id: PG-PR261-JOINT-ANISOTROPY-STATE
scientific_role: >-
  Introduce a diagnostic-only pre-solver state transport contract that keeps
  congruence kinematics, between-frame velocities, and partial geometry
  separate. The contract records missing channels, convention identities, and
  transfer provenance. It does not infer tensors from scalar beta, identify a
  source or geometry, validate a native transfer, or identify a Bianchi family.
governing_sources:
  - source_id: PR260-PROGRAMME-INTAKE
    identity: docs/research_program/vector_tensor/PROGRAM_INTAKE_REGISTRY_V1.yaml
    role: registered U2 and TC-01 typed-state obligations
  - source_id: PR249-DEPARTURE-CONTRACTS
    identity: htt/src/common/statistical_foundations.py
    role: immutable legacy DepartureState and value-preservation boundary
  - source_id: PR256-VELOCITY-FRAMES
    identity: htt/htt/htt/departure/velocity_frame_decomposition.py
    role: first-order beta_RO = beta_RM + beta_MO + O(beta^2) semantics
  - source_id: PR251-O3-ACTION
    identity: htt/src/common/orbit_nonlinearity.py
    role: registered active O(3) action, STF5 basis, and polar/axial parity
  - source_id: PR014-TRANSFER-PROVENANCE
    identity: htt/src/common/transfer_registry.py
    role: external/native transfer-source distinction and metadata contract
controlling_assumptions:
  metric_signature: "(-,+,+,+)"
  state_role: diagnostic_only
  kinematics_are_of_a_declared_congruence: true
  velocity_components_are_relations_between_distinct_frames: true
  delta_omega_k_is_not_anisotropic_spatial_curvature_tensor: true
  native_lowell_solver_available: false
  native_morphology_atlas_available: false
contracts:
  - contract_id: PR261-THREE-LAYER-SEPARATION
    statement: >-
      CongruenceKinematics owns sigma, axial omega, and optional polar
      acceleration for one declared congruence. VelocityFrameBundle owns
      beta_RO, beta_RM, and beta_MO between named physical frames.
      GeometryState owns signed delta_omega_k separately from optional STF
      geometry tensors.
    ceiling: diagnostic_only
  - contract_id: PR261-TYPED-MISSINGNESS
    statement: >-
      An unavailable acceleration, velocity, Weyl, anisotropic-curvature, or
      anisotropic-stress component is a MissingComponent with MISSING,
      ABSTAIN, or NEEDS_NATIVE status. It is never represented by numerical
      zero and is never derived from the other velocity components.
    ceiling: diagnostic_only
  - contract_id: PR261-ACCELERATION-UNITS
    statement: >-
      Available acceleration uses exactly A_OVER_C_THETA in the explicit-c
      branch or A_OVER_THETA_C_EQUALS_ONE in the c=1 branch. Conversion
      requires an explicit positive numerical c in the declared source
      velocity units. Missing acceleration carries no normalization.
    ceiling: methodology_conditional
  - contract_id: PR261-VELOCITY-REPLAY
    statement: >-
      COMMON adapts a PR-256 payload by direct payload replay and content
      identity, without importing HTT. Closure is a consistency diagnostic;
      missing velocities remain missing.
    ceiling: diagnostic_only
  - contract_id: PR261-LEGACY-ADAPTER
    statement: >-
      DepartureState remains unchanged. Migration requires an exact source
      content identity, semantic-authority identity, basis, units, parity,
      sigma/omega normalization declaration, three distinct physical frame
      identities, and one explicit beta semantic role. Missing or mismatched
      binding returns ABSTAIN.
    ceiling: diagnostic_only
  - contract_id: PR261-O3-PARITY
    statement: >-
      The registered active O(3) action treats omega and magnetic Weyl as
      axial, acceleration and all beta components as polar, and delta_omega_k
      as a scalar. The coordinate frame and STF5 basis must match.
    ceiling: diagnostic_only
  - contract_id: PR261-TRANSFER-BINDING
    statement: >-
      transfer_source=none carries no TransferFunctionSpec. Every non-none
      source carries an exact spec with matching source. This state contract
      creates no transfer values and no native result.
    ceiling: transfer_conditional
required_public_types:
  - CongruenceKinematics
  - VelocityFrameBundle
  - GeometryState
  - JointAnisotropyState
  - MissingComponent
required_metadata:
  - content identity
  - frame and congruence identity
  - epoch window and averaging scale
  - STF/vector basis
  - unit and acceleration normalization branch
  - polar/axial parity contract
  - perturbative order
  - transfer source and exact spec when applicable
tests:
  - PYTHONPATH=htt/src:htt python -B -m pytest -p no:cacheprovider -q tests/contracts/test_joint_anisotropy_state.py
  - PYTHONPATH=htt/src:htt python -B -m pytest -p no:cacheprovider -q tests/pr_cards/test_pr_249_departure_contracts.py tests/pr_cards/test_pr_256_velocity_frame_decomposition.py
  - python -B scripts/codex_harness/validate_pr_dag.py docs/codex_handoff/pr_backlog.yaml --status docs/codex_handoff/pr_status.yaml --strict-rescue-slice
kill_switches:
  - existing DepartureState fields, values, or fixture meaning change
  - a missing component becomes a numerical zero
  - beta_RM, beta_MO, or beta_RO is inferred from the other two
  - legacy beta is assigned a semantic role without an exact binding
  - acceleration normalization mixes explicit-c and c=1 branches
  - frame, congruence, epoch, mask-support scale, basis, or transfer mismatch is accepted
  - TSC or Teff becomes an active owner
  - a state emits a native-solver, geometry-detection, posterior, evidence, or family-identification claim
claim_boundary:
  allowed:
    - typed pre-solver state transport
    - explicit missing-component and partial-geometry reports
    - first-order velocity closure replay
    - O(3) action and parity regression
    - explicit legacy value-preservation adapter
    - transfer-conditional metadata transport
  forbidden:
    - scalar-to-vector or scalar-to-tensor inference
    - global-tilt detection
    - geometry detection
    - native solver result
    - Bianchi family identification
    - posterior, evidence, or truth-certificate semantics
