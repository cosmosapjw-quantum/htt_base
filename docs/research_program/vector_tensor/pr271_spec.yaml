  tf_statistical_core:
    exact_ids: [TF-09-PARITY-SIGN-EXACTNESS]
    bounded_ids: [TF-11-MASK-PATH-MARTINGALE]
    required_boundary: >-
      TF-11 is only a finite registered nested-path conditional-expectation
