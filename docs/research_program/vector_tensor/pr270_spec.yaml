  required_axes: [wolfram_xact, sympy, sage_singular, lean]
  allowed_aggregate_verdicts:
    - CAS_4AXIS_PASS
    - CAS_PASS_WITH_REGISTERED_EXCEPTION
    - CAS_CONFLICT
    - CAS_BLOCKED
    - CAS_FAIL
  exceptions: []

outputs:
