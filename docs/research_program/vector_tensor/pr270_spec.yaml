forbidden_actions:
  - omit or merge a required CAS axis
  - register an exception after any axis result is read
  - use majority vote
  - treat preflight readiness as claim validation
  - promote a restricted local chart to global orbit completeness
  - invent a 1+3 evolution branch or native geometry payload
  - claim a native solver result, morphology atlas, geometry, or Bianchi family

kill_condition: >-
  Stop with a typed blocked/conflict/fail verdict if an axis is unavailable,
  assumptions or branches diverge, an exception is post-hoc, or the source
  statement would have to be silently weakened.
