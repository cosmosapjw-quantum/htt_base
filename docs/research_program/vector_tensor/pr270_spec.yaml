statement_identity_policy:
  no_source_promotion: >-
    READY_FOR_PROOF, ORACLE_VERIFIED, PROVEN_CAS4, ACTIVE_CONDITIONAL, and
    PROGRAM_OBLIGATION are frozen source-provenance labels. They are not
    PR-270 verdicts.
  no_silent_weakening: >-
    A restricted local-chart, conditional-response, or chain-rule result must
    record its relation to the source statement. It cannot replace a global
    orbit, full 1+3 source decomposition, or kinematic-to-geometric escalation.
  global_local_separation: >-
    A nonzero Jacobian on one principal/cyclic slice establishes a generic
    local chart on a Zariski-open set. It does not establish global orbit
    separation, invariant-ring completeness, or a morphology atlas.
  engine_gate: >-
    Wolfram+xAct, SymPy, SageMath+Singular, and Lean must all execute against
    one byte-identical CAS contract. A missing engine, activation/license
    blocker, assumption mismatch, or post-hoc exception prevents CAS_4AXIS_PASS.

typed_statements:
  VT-T5:
    relation_to_source: EXACT_ELABORATION
    assumptions:
      - sigma is a real symmetric trace-free 3 by 3 matrix
      - I2 equals tr(sigma squared) and is strictly positive
      - I3 equals tr(sigma cubed)
    statement: >-
      Delta = I2^3/2 - 3 I3^2 is the characteristic discriminant and
      Delta = I2^3(1-J_sigma^2)/2 for
      J_sigma = sqrt(6) I3/I2^(3/2). Thus abs(J_sigma) <= 1; equality is the
      repeated-eigenvalue stratum.
    counterexample_boundary: [zero shear, non-STF matrix, complex spectrum]
  VT-T6:
    relation_to_source: EXACT_ELABORATION
    assumptions: [sigma is a real trace-free 3 by 3 matrix]
    statement: >-
      sigma^3 = tr(sigma^2) sigma/2 + tr(sigma^3) identity/3, so every
      vector-shear contraction with power at least three reduces to powers
      zero, one, and two.
    counterexample_boundary: [non-trace-free matrix without the missing trace terms]
  VT-T7:
    relation_to_source: EXACT_ELABORATION
    assumptions:
      - sigma is diagonalizable over the reals with eigenvalues lambda_1..lambda_3
      - v has eigenframe coordinates v_1..v_3
    statement: >-
      det[v,sigma v,sigma^2 v] equals
      v_1 v_2 v_3 product_{i<j}(lambda_j-lambda_i). Its square is the Krylov
      Gram determinant. The vector is cyclic exactly when the eigenvalues are
      simple and every eigenframe component is nonzero.
    counterexample_boundary: [repeated eigenvalue, zero eigenframe component]
  VT-T8:
    relation_to_source: RESTRICTED_GENERIC_LOCAL_ELABORATION
    assumptions:
      - sigma has simple spectrum
      - one declared polar or axial reference vector is cyclic
      - the 14-coordinate chart uses I2, I3 and powers zero through two against four typed vectors
    statement: >-
      On the declared eigenframe slice the 14 chart coordinates have a
      nonzero exact Jacobian at a registered rational witness. Hence they are
      local coordinates on a generic principal/cyclic SO(3) quotient. The
      reference Krylov sign retains its declared O(3) parity.
    forbidden_extension: global orbit separation, invariant-ring completeness, or family identification
  VT-T11:
    relation_to_source: CONDITIONAL_LINEAR_ALGEBRA_CORE
    assumptions:
      - the observable covariance support has already been selected
      - the nuisance tangent has full declared column rank in supported coordinates
    statement: >-
      P_N=N(N^T N)^(-1)N^T is the nuisance projector and
      (I-P_N)R is the supported response quotient. Covariance-null directions
      are removed before, not conflated with, nuisance projection.
  VT-T12:
    relation_to_source: CONDITIONAL_LINEAR_ALGEBRA_CORE
    assumptions:
      - local and global tangent bases are orthonormal in supported whitened coordinates
    statement: >-
      G^T(I-LL^T)G has eigenvalues sin^2(theta_i), where theta_i are the
      principal angles. It is positive definite exactly when no global
      direction lies in the local tangent. Small positive angles are
      weak-identification, not rank deficiency.
  VT-T13:
    relation_to_source: PARTIAL_CHAIN_RULE_ONLY
    assumptions:
      - sigma(t) is differentiable, symmetric, trace-free, and I2 is positive
    statement: >-
      dI2/dt=2 tr(sigma sigma_dot),
      dI3/dt=3 tr(sigma^2 sigma_dot), and J_sigma obeys the exact quotient
      chain rule recorded by the CAS contract.
    withheld_source_extension: >-
      The requested decomposition into E_ab, H_ab, pi_ab, A_a, and omega_a
      remains INCONCLUSIVE_MISSING_TYPED_EVOLUTION_LAW because no single
      branch/sign/domain convention is registered in the frozen inputs.
  VT-T14:
    relation_to_source: EXTERNAL_GATE_REFUSAL
    statement: >-
      Without an admitted Weyl/three-curvature/anisotropic-stress geometry
      payload and the future native morphology atlas, the only permitted
      output is a partial kinematic diagnostic report.
    verdict_boundary: INCONCLUSIVE_NATIVE_GEOMETRY_GATE

