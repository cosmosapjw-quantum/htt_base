  evidence_grade: SIMULATION_DIAGNOSTIC

preregistration:
  random_stream:
    engine: numpy.random.PCG64
    derivation: >-
      sha256(master_seed, canonical_registered_seed_family, cell_id,
      replicate_family)
    master_seed: 27220260730
    seed_family: [272003, 272005, 272007, 272009, 272011]
    seed_family_role: >-
      The ordered registered family is a load-bearing salt for every
      non-SBC stream. Each registered member additionally seeds one
      independent SBC repetition, and the acceptance statistic pools all
      five rank histograms. Editing any family member therefore changes the
      execution result.
    mutation_rule: any seed edit requires a new change set before rerun
  confidence:
    nominal_coverage: 0.95
    family_confidence: 0.99
    retain_lower_bound: 0.92
    failure_map_required: true
    interval: one-sided Clopper-Pearson lower bound
  max_q:
    dimension: 4
    calibration_draws: 4095
    evaluation_draws: 4096
    alpha: 0.05
    statistic: max absolute whitened coordinate
    critical_order: ceil((n_calibration + 1) * (1 - alpha))
    correct_covariance: identity
    misspecified_evaluation_covariance_scale: 1.5625
    misspecified_failure_upper_coverage: 0.90
  partial_identification:
    width_grid: [0.0, 0.5, 1.0, 2.0]
    delivered_replicates_per_grid_point: 4000
    independent_seed_streams: 10
    sigma: 1.0
    least_favourable_position: boundary
    method: Imbens-Manski
    adversarial_method: naive_no_expansion
    optimizer_requirement: >-
      An uncertified interior extremum or unbounded identified set is a typed
      refusal; a selected optimizer point is never a probability draw.
  random_anchor:
    numerator_mean: 1.0
    anchor_mean: 2.0
    joint_covariance: [[0.16, 0.06], [0.06, 0.09]]
    sample_size: 64
    evaluation_draws: 4000
    normal_critical_value: 1.959963984540054
    true_ratio: 0.5
    rule: full numerator-anchor joint covariance is mandatory
  sbc:
    prior_variance: 4
    likelihood_variance: 1
    observations: 8
    simulations: 3000
    posterior_draws: 20
    rank_bins: 7
    pvalue_floor: 0.01
    seed_family_aggregation: >-
      Pool the rank histograms from exactly one independent repetition per
      registered seed-family member, then apply one chi-square uniformity
      test to the pooled histogram.
    per_seed_results_retained: true
    acceptance_statistic: pooled_seed_family_rank_uniformity
    calibrated_variance_scale: 1
    misspecified_variance_scales: [0.5, 2.0]
    required_only_for: HTT posterior computation calibration
  depth_multiplicity:
    depth_count: 5
    correlation: 0.55
    calibration_draws: 4095
    evaluation_draws: 4096
    alpha: 0.05
    statistic: maximum absolute standardized finite-path contrast
    unadjusted_failure_lower_fwer: 0.10
    same_centered_target_required: true
    nested_path_required: true
  weak_identification:
    singular_value_floor: 0.05
    principal_angle_floor_radians: 0.05
    perturbation_radius: 0.01
    well_identified_singular_values: [1.0, 0.5, 0.3]
    weak_singular_values: [1.0, 0.4, 0.02]
    verdict_below_floor: ABSTAIN_WEAK_IDENTIFICATION
    wrong_covariance_id: refusal
  composition:
    orbit_chart_dimension: 3
    supported_response_rows: 4
    rank_tolerance: 1.0e-12
    scope: one registered principal-stratum linear cell only
    global_claim: forbidden
  matched_counterpair:
    replicates: 4000
    feature_dimension: 3
    modes_per_replicate: 16
    null_shift: 0.0
    alternative_shift: 0.9
    per_mode_feature_noise_sd: 1.0
    summary: mean over the frozen number of independent synthetic modes
    alpha: 0.05
    minimum_power_lower_bound: 0.80
    scalar_and_anchor_coordinates: exactly matched
  open_set:
    calibration_per_known_class: 2048
    evaluation_per_known_class: 2048
    evaluation_unknown: 4096
    feature_noise_sd: 0.35
    known_centres: [[-2.0, 0.0], [2.0, 0.0]]
    unknown_centre: [0.0, 3.0]
    alpha: 0.05
    minimum_known_coverage_lower_bound: 0.92
    minimum_unknown_abstention_lower_bound: 0.95
    finite_library_sensitivity_required: true
  depth_local_global:
    depths: [0.25, 0.5, 0.75, 1.0]
    covariance:
      [[1.0, 0.45, 0.25, 0.10],
       [0.45, 1.0, 0.45, 0.25],
       [0.25, 0.45, 1.0, 0.45],
       [0.10, 0.25, 0.45, 1.0]]
    local_design: [0.25, 0.5, 0.75, 1.0]
    global_design: [1.0, 1.0, 1.0, 1.0]
    mask_path_id: synthetic-nested-mask-v1
    transfer_source: none
    HTT_output: Gaussian generalized-least-squares diagnostic comparison
    MIO_output: residual/coherence cross-check without likelihood or posterior
    true_amplitude: 4.0
    evaluation_draws: 4096
    minimum_correct_selection_lower_bound: 0.80

registered_statement_boundaries:
  VT-S3: >-
    Split matched-null calibration controls the registered finite max-Q family
    under exchangeability. It is not class-wide calibration.
  VT-S5: >-
    Coverage is grid-conditional for the registered bounded identified sets.
    Failing points and optimizer refusals remain visible.
  VT-S6: >-
    A Fieller-style ratio confidence-body pushforward is evaluated only from a
    registered joint numerator-anchor law. Marginals alone are insufficient.
  VT-S9: >-
    The finite nested depth/mask path uses a maximum statistic calibrated from
    the same centered-null path. No exact continuum-path statement follows.
  VT-S10: >-
    The perturbation bound scales as inverse minimum whitened singular value.
    A full-rank cell below either frozen floor abstains.
  VT-S11: >-
    Rank of a registered orbit-chart/response composition is checked for one
    declared linear cell. It does not establish global orbit separation.
  VT-S12: >-
    Power is a registered synthetic matched-counterpair property and does not
    identify a physical family.
  VT-S13: >-
    Coverage and abstention are finite-library synthetic diagnostics with a
    frozen calibration/evaluation split.
  VT-S14: >-
    The adapter is validated on a declared synthetic depth covariance and
    mask path. The source remains a program obligation pending admitted data.

ownership:
  HTT:
    - sampling laws, likelihood objectives, SBC, coverage, model comparison
  MIO:
    - diagnostic residual, coherence, failure-map, and abstention cross-checks
  COMMON:
    - typed preregistration, validation records, intervals, and refusal states

conditional_requirements:
  null: required for VT-S3 and VT-S9
  prior: required only for the registered SBC cell
  PPC: not required; no predictive-adequacy claim is made
  LOOCV: not required; no out-of-sample model-ranking claim is made

forbidden:
  - post-hoc seed, tolerance, DGP, grid, or threshold adjustment
  - dropping a failed coverage or misspecified-covariance cell
  - optimizer output relabelled as a sample or posterior
  - MIO likelihood, posterior, Bayes factor, or evidence
  - native solver or native morphology-atlas validation
  - observed-data or PR-151 partial-data execution
  - geometry detection or Bianchi family identification

kill_conditions:
  - a failed registered coverage cell is hidden or removed
  - a seed, tolerance, DGP, or threshold changes after result inspection
  - a marginal numerator-anchor law is accepted as a joint law
  - a weakly identified cell emits a nearest type instead of abstaining
  - an unadjusted multiple-depth result is reported as familywise controlled
  - a source theorem status is promoted from simulation-only evidence
