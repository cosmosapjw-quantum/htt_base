counting_contract:
  source_obligation_count: 123
  cardinality_aliases:
    requested_pillar_T_65: legacy_signature_inventory
    requested_pillar_S_58: proposal_registry_rows
  exact_source_partitions:
    legacy_signature_inventory: {T: 31, S: 34}
    proposal_registry_rows: {I: 30, II: 24, BRIDGE: 4}
  semantic_guard: >-
    65 and 58 are source-inventory aliases, not literal proof-pillar theorem
    counts; source rows, evidence rows, and proved rows are never conflated.
  raw_record_count_is_public_theorem_count: false

status_contract:
  source_proof_adjudication_status: NOT_ADJUDICATED
  source_status_promotion: forbidden
  vt_programme_partition: {VT-T: 14, VT-S: 14}
  vt_programme_raw_count_is_public_theorem_count: false
  evidence_layers:
    - pillar_t_core
    - pillar_t_cas
    - pillar_s_core
    - pillar_s_inference
  render_rule: >-
    Evidence-layer verdicts render beside, never over, the source obligation's
    own NOT_ADJUDICATED status. Inconclusive and restricted records retain
    their exact verdict text.
  cas_aggregate_allowed: CAS_4AXIS_PASS
  cas_aggregate_effect: exact registered CAS obligations only; no source-row promotion

synthetic_analysis_contract:
  source_pack: PR273-BLIND-SYNTHETIC-DIAGNOSTIC-PACK-V1
  exact_case_ids: [C01, C02, C03, C04, C05]
  exact_partitions: {development: 3, held_out: 2}
  quantities:
    - max_finite_abs_x
    - max_finite_abs_q
    - depth_mean_normalized_score
    - missing_functional
  depth_alert_threshold_source: pr273_diagnostic_pack
  point_summary_rule: finite absolute maxima are descriptive synthetic diagnostics, not estimators
  observed_data: false

figure_contract:
  path: docs/research_program/vector_tensor/report/fig_pr275_synthetic_case_diagnostics.png
  source_json: docs/research_program/vector_tensor/report/SYNTHETIC_CASE_ANALYSIS.json
  manifest: docs/research_program/vector_tensor/report/fig_pr275_synthetic_case_diagnostics.manifest.json
  category: VALIDATION
  exactly_one_category: true
  artifact_mode: synthetic_diagnostic
  plot_owner: COMMON
  claim_tier: diagnostic_only
  panels:
    - finite_abs_x_q_by_case
    - depth_score_and_missingness_by_case
  forbidden_content:
    - governance readiness visualization
    - proof count presented as a scientific result
    - observed-data point or claim
    - geometry or Bianchi family label

data_admission_contract:
  required_status: NO_ADMITTED_DATA_PILOT
  required_admitted_count: 0
  required_pilot_executed: false
  admitted_data_figure: forbidden

replication_contract:
  exact_replay_grade: local_generated_artifact_exact_replay
  scientific_reproducibility_grade: deterministic_registered_synthetic
  source_identity_grade: repository_paths_and_sha256
  required_metadata:
    - commands
    - environment
    - source_identities
    - seeds
    - tolerances
    - caveats
    - claim_ceiling
  manuscript_number_without_generated_source: forbidden

outputs:
  directory: docs/research_program/vector_tensor/report
  required:
    - PROOF_ATLAS.json
    - PROOF_ATLAS.md
    - SYNTHETIC_CASE_ANALYSIS.json
    - fig_pr275_synthetic_case_diagnostics.png
    - fig_pr275_synthetic_case_diagnostics.manifest.json
    - REPLICATION_PACKAGE.json
    - VECTOR_TENSOR_PROGRAM_REPORT.md
  generator: scripts/vector_tensor/build_pr275_proof_atlas.py
  runner: scripts/codex_harness/run_pr275_report.py

kill_conditions:
  - a source obligation is rendered proved from an evidence-layer verdict
  - a blocked, restricted, partial, or inconclusive record is rendered proved
  - 65 or 58 is presented as a literal proved-theorem pillar count
  - a hand-copied status/count survives source mutation
  - a governance or readiness plot is presented as scientific analysis
  - an observed-data point appears despite NO_ADMITTED_DATA_PILOT
  - a manuscript number lacks generated source
  - native solver, native atlas, geometry, or Bianchi family identification is implied
