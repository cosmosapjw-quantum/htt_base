statement_identity_policy:
  source_identity: >-
    PR-268 registration titles and source links remain immutable. PR-269 may
    type a source statement only by recording the source identity, the exact
    typed successor statement, every added premise, and the relation
    TYPED_ELABORATION_WITH_EXPLICIT_PREMISES.
  no_silent_weakening: >-
    If an exact registered statement cannot be proved under its declared
    assumptions, retain FAIL or INCONCLUSIVE. Never weaken its conclusion,
    narrow its domain, or add a premise without recording the change.
  proof_effect: >-
    Only rows selected below may receive a PR-269 adjudication. PR-268 source
    status and NOT_ADJUDICATED fields remain provenance and are not rewritten.
  evidence_posture: >-
    Human-readable analytic derivations are primary proof artifacts. Exact
    executable vectors and metamorphic checks verify boundaries and typed
    implementation; they are not general-purpose proof substitutes.

