typed_statements:
  VT-T1:
    relation_to_source: TYPED_ELABORATION_WITH_EXPLICIT_PREMISES
    assumptions:
      - H is finite and strictly positive and Theta equals 3 H
      - sigma_ab is a spatial symmetric trace-free tensor
      - omega_ab is a spatial antisymmetric two-form with spatial dual omega_a
    frame: one declared spatial metric and congruence frame
    domain: real finite components with H greater than zero
    statement: >-
      Sigma2 = (sigma_ab sigma^ab)/(6 H^2)
      = (3/2) ||sigma/Theta||_F^2, and
      W2 = (omega_ab omega^ab)/(6 H^2)
      = (omega_a omega^a)/(3 H^2)
      = 3 ||omega/Theta||_2^2.
    counterexample_boundary:
      - H or Theta zero
      - non-spatial or non-STF shear
      - polar rather than axial vorticity-vector convention
  VT-T2:
    relation_to_source: TYPED_ELABORATION_WITH_EXPLICIT_PREMISES
    assumptions:
      - g is an invertible linear action on the typed state space
      - each anchor body is nonempty, closed, convex, absorbing, and contains zero
      - A(g y) equals g A(y)
    domain: finite-dimensional real typed state space
    statement: p_{A(g y)}(g k) = p_{A(y)}(k)
    counterexample_boundary:
      - non-invertible g
      - action-equivariance failure
      - non-absorbing body where the gauge is not finite
  VT-T3:
    relation_to_source: TYPED_ELABORATION_WITH_EXPLICIT_PREMISES
    assumptions:
      - A is closed, convex, balanced, absorbing, and contains zero
      - A_polar is defined by absolute dual pairing at most one
    domain: finite-dimensional real vector space and algebraic dual
    statement: p_A(k) = sup_{phi in A_polar} abs(phi(k))
    counterexample_boundary:
      - non-balanced A with an absolute-polar definition
      - non-closed or non-absorbing A without the required gauge closure
  VT-T4:
    relation_to_source: TYPED_ELABORATION_WITH_EXPLICIT_PREMISES
    assumptions:
      - the VT-T3 anchor and polar premises hold
      - x_phi is typed as abs(phi(k)) for phi in A_polar
    domain: admissible directional functionals in the registered polar body
    statement: x_phi <= p_A(k), so each typed directional stress is a certified lower bound
    counterexample_boundary:
      - phi outside A_polar
      - signed phi(k) relabelled as the nonnegative x_phi
      - point estimate relabelled as a global equality
  VT-T9:
    relation_to_source: TYPED_ELABORATION_WITH_EXPLICIT_PREMISES
    assumptions:
      - R is orthogonal in three spatial dimensions
      - polar and axial slots retain their parity types
    domain: O(3), with SO(3) as the determinant-positive subgroup
    statement: >-
      A polar vector transforms as R v and an axial vector as det(R) R w;
      polar-polar and axial-axial contractions are scalars, while
      polar-axial contraction is a pseudoscalar. Proper rotations preserve all
      contractions and reflections flip only pseudoscalars.
    counterexample_boundary:
      - erasing polar or axial type
      - treating an O(3) reflection as an SO(3) action
  VT-T10:
    relation_to_source: TYPED_ELABORATION_WITH_EXPLICIT_PREMISES
    assumptions:
      - A is a group-invariant gauge body
      - k is nonzero and r = p_A(k) is finite and strictly positive
    domain: nonzero finite-gauge states
    statement: >-
      k = r u with r = p_A(k), u = k/r, and p_A(u) = 1; r and u are
      unique. The group orbit of u is the normalized orbit shape.
    counterexample_boundary:
      - k equals zero
      - gauge has a nontrivial null direction
      - A is not group invariant when orbit invariance is claimed
  TF-01-PARITY-TYPING:
    relation_to_source: EXACT_REGISTERED_ORACLE_STATEMENT
    assumptions:
      - sigma is a real spatial symmetric trace-free rank-two tensor
      - omega is axial and beta is polar under the same O(3) action
      - the Krylov determinants use columns v, sigma v, and sigma squared v
    domain: real three-dimensional O(3) representation
    statement: >-
      Under sigma -> R sigma R^T, beta -> R beta, and
      omega -> det(R) R omega, the axial Krylov determinant
      det[omega, sigma omega, sigma^2 omega] is an O(3) scalar, while the
      polar analogue is a pseudoscalar.
    counterexample_boundary:
      - axial omega is silently transformed as a polar vector
      - the determinant parity type is erased before a reflection
  TF-02-CATALOGUE-COMPLETION:
    relation_to_source: EXACT_RESTRICTED_WITNESS_ONLY
    assumptions:
      - sigma is diag(1, 2, -3), beta is zero, and omega is (1, 2, 3)
      - comparison uses omega and minus omega under the registered SO(3) action
      - the residual stabilizer is computed from the commutant
    domain: the registered off-principal-stratum beta-equals-zero witness only
    statement: >-
      At the registered witness the v2 catalogue does not separate
      (sigma, omega) from (sigma, -omega); the axial Krylov determinant does,
      and the two states lie in distinct SO(3) orbits because the computed
      Klein four stabilizer contains no map from omega to -omega.
    counterexample_boundary:
      - generic beta where the witness premise does not hold
      - an arbitrary odd non-invariant used as a separating coordinate
      - a claimed stabilizer not computed from the commutant
    forbidden_extension: generic orbit separation or invariant-ring completeness
  TF-07-BUDGET-MORPHOLOGY-SPLIT:
    relation_to_source: TYPED_ELABORATION_WITH_EXPLICIT_PREMISES
    assumptions:
      - the registered budget factors through tr_sigma2, omega2, beta2, and delta_omega_k
      - the budget is differentiable at the evaluated state
      - tangent directions annihilate all four named invariant differentials
    domain: regular points of the common level sets of the four named invariants
    statement: >-
      A budget that factors through the four registered named invariants is
      constant on their common fibres and has zero directional derivative
      along tangent vectors annihilated by all four differentials.
    counterexample_boundary:
      - a budget with explicit helicity or other morphology dependence
      - a singular point where the declared differential statement is unavailable
      - replacing named factorization with a polynomial-degree claim
    forbidden_extension: degree-wide invariant-generation claim
  TF-08-PRODUCT-GAUGE-MAX:
    relation_to_source: EXACT_ANALYTIC_STATEMENT
    assumptions:
      - each sector body is a nonempty closed centered norm ball
      - every sector radius is finite and strictly positive
      - the joint anchor is the Cartesian product of the sector bodies
    domain: finite direct product of the registered sector normed spaces
    statement: >-
      The gauge of the Cartesian product anchor body is the maximum of the
      sector gauges, and its exceedance is max(rho - 1, 0).
    counterexample_boundary:
      - a nonpositive or nonfinite sector radius
      - a coupled non-product joint anchor
      - a nonabsorbing sector body with a nonfinite gauge
  TF-12-ACCELERATION-EULER-SLAVING:
    relation_to_source: CONDITIONAL_ANALYTIC_SHAPE_ONLY
    assumptions:
      - perfect fluid
      - no heat flux
      - no anisotropic stress
      - barotropic pressure with chi_s defined as the dimensionless ratio dp/dmu
      - one declared spatial gradient and congruence convention
      - mu is strictly positive
      - mu plus p is nonzero, equivalently 1 plus w is nonzero
      - Theta is finite and nonzero
      - the acceleration normalization exactly matches the declared joint-state units convention
      - the explicit-c branch supplies a finite strictly positive numerical c in the source velocity units
      - eps_g uses c D ln(mu)/Theta on the explicit-c branch and D ln(mu)/Theta on the c-equals-one branch
    domain: >-
      finite fluid variables with mu greater than zero, w not equal to minus
      one, nonzero expansion Theta, and exactly one registered acceleration
      normalization branch
    statement: >-
      On EXPLICIT_C_THETA_NORMALIZED with A_OVER_C_THETA and a declared
      positive c, (mu+p)A/c^2 = -D p and therefore
      A/(c Theta) = -[chi_s/(1+w)] [c D ln(mu)/Theta]. On
      C_EQUALS_ONE_THETA_NORMALIZED with A_OVER_THETA_C_EQUALS_ONE,
      A/Theta = -[chi_s/(1+w)] D ln(mu)/Theta. If eps_g is the exact norm
      of the matching branch-normalized gradient then A2_std is (3/2) times
      [chi_s/(1+w)] squared times eps_g squared; if eps_g is only an upper
      bound, the corresponding relation is an upper bound on A2_std.
    forbidden_extension: numerical ceiling without a registered eps_g input
    counterexample_boundary:
      - vacuum or a nonpositive mu where ln(mu) is unavailable
      - w equals minus one so the Euler denominator vanishes
      - Theta equals zero so the normalized gradient and acceleration are unavailable
      - a missing, nonpositive, or silently assumed c on the explicit-c branch
      - an acceleration normalization that does not match the declared units convention
      - a gradient normalization that does not match the declared units convention
      - a nonfinite branch-normalized coefficient or shape in representable arithmetic
      - heat flux, anisotropic stress, or nonbarotropic pressure terms are present

