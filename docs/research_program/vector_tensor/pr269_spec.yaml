forbidden_actions:
  - modify PR-268 theorem-signature v3 source rows
  - relabel source CHECKED or oracle PASS as a PR-269 proof
  - add a CAS gate for an elementary identity or type-preservation statement
  - silently add assumptions, narrow domains, or weaken conclusions
  - promote TF-02 beyond its exact registered witness
  - attach a numerical ceiling to TF-12 without a registered input
  - use a native solver, native morphology atlas, or observed data
  - emit a geometry or Bianchi-family identification

kill_condition: >-
  Stop and retain FAIL or INCONCLUSIVE if a registered statement can pass only
  after an unrecorded premise, domain restriction, convention change, or
  weakened conclusion.
