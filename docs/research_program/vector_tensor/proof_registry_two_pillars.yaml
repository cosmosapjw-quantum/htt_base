  - id: I-2.2
    legacy_id: PR257-TRACEFREE-CAYLEY-HAMILTON
    pillar: I
    section: invariant_algebra
    statement: >-
      sigma^3 = (tr sigma^2 / 2) sigma + (tr sigma^3 / 3) I for trace-free
      symmetric sigma; hence v.sigma^3.v and v.sigma^4.v reduce.
    status: PROVEN_CAS4
    also: ORACLE_VERIFIED (TF-04)
    no_go: false
    buys: Degree bound - no v.sigma^k.v with k >= 3 is a new generator.

  - id: I-2.3
    legacy_id: PR257-KRYLOV-GRAM-SYZYGY
    pillar: I
    section: invariant_algebra
    statement: >-
      det[v, sigma v, sigma^2 v]^2 equals the Gram determinant of the Krylov
      chain, which is a polynomial in the five even invariants of (sigma, v).
    status: PROVEN_CAS4
    also: ORACLE_VERIFIED (TF-03)
    no_go: false
    buys: >-
      The magnitude of a Krylov determinant is old information; its entire new
      content is one bit, the sign. This makes II-3.1 an exact one-bit test.

  - id: I-2.4
    legacy_id: TF-05-SHAPE-DISCRIMINANT
    pillar: I
    section: invariant_algebra
    statement: >-
      J_sigma = sqrt(6) I3 / I2^{3/2} lies in [-1, 1]; Delta_sigma = I2^3/2 -
      3 I3^2 = (I2^3/2)(1 - J^2) is exactly the discriminant of the
      characteristic polynomial; |J| = 1 iff repeated eigenvalue, J = 0 iff
      eigenvalues (lambda, -lambda, 0); J is scale-free.
    status: ORACLE_VERIFIED
    evidence: >-
      oracle TF-05 (exact symbolic corroboration, sympy residuals 0; empirical
      range over 2e5 draws). J_sigma is degree-0 scale-free; Delta_sigma is
      degree-6 homogeneous.
    no_go: false
    buys: >-
      Promotes tr sigma^3 from higher-order amplitude to an anisotropy-TYPE
      coordinate; shear morphology becomes nameable without a Bianchi family.

  - id: I-2.5
    legacy_id: TF-02-CATALOGUE-COMPLETION
    pillar: I
    section: invariant_algebra
    statement: >-
      At the registered witness (beta = 0) the v2 catalogue does not separate
      (sigma, omega) from (sigma, -omega); the axial Krylov determinant does;
      and the two states lie in distinct SO(3) orbits (the stabiliser of
      diag(1,2,-3) is COMPUTED from the commutant to be the Klein four-group,
      no element of which maps omega to -omega).
    scope: >-
      The witness lies OFF the principal stratum. For generic beta the v2
      catalogue already separates and K_omega does not raise the Jacobian rank.
      K_omega supplies a sign bit exactly where a vector fails to be cyclic.
    status: ORACLE_VERIFIED
    evidence: >-
      oracle TF-02 (K_omega = +/-120; candidate SO(3)-invariance verified before
      separation is claimed; commutant dimension 3; stabiliser order 4 verified;
      0 spurious stabiliser elements in 2000 random rotations)
    closes: PR257-NONGENERIC-NONSEPARATION (the non-generic witness only)
    unchanged_statuses: [generic_orbit_separation_status, degree_completeness_status]
    no_go: false
    buys: >-
      Closes the registered non-generic witness, and the same exhaustive check
      is positive evidence for the still-unproved generic-separation conjecture
      I-2.7.

  - id: I-2.6
    pillar: I
    section: invariant_algebra
    statement: >-
      Catalogue v3 is the degree-bounded closure of the Gram-Krylov generating
      set over {beta_RM, beta_MO, A, omega} plus one Krylov determinant per
      vector, triple determinants, tr sigma^2, tr sigma^3 and DeltaOmega_k;
      parity is mechanical in (#omega + #epsilon).
    status: PROPOSED
    acceptance_gate: I-1.2 Jacobian rank
    no_go: false
    buys: Replaces hand enumeration with an auditable, extensible, rank-testable rule.

  - id: I-2.7
