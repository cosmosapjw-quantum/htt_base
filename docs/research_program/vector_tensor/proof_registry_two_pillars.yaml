  - id: I-1.1
    legacy_id: TF-01-PARITY-TYPING
    pillar: I
    section: state_and_orbit
    statement: >-
      Under sigma -> R sigma R^T, beta -> R beta, omega -> det(R) R omega, the
      axial Krylov determinant det[omega, sigma omega, sigma^2 omega] is an O(3)
      scalar; the polar analogue is a pseudoscalar.
    status: ORACLE_VERIFIED
    evidence: oracle TF-01 (axial max abs error 1.47e-14, polar 5.8e-15, 600 proper and improper transforms)
    no_go: false
    buys: >-
      Parity type is derivable rather than declared; enables the exact test
      II-3.1 and forbids collapsing reflection-related types.

  - id: I-1.2
    legacy_id: TF-06-INVARIANT-DIMENSION
    pillar: I
    section: state_and_orbit
    statement: >-
      ON THE PRINCIPAL STRATUM (finite generic isotropy) the kinematic state has
      exactly dim(state) - 3 functionally independent SO(3) invariants: 9 for
      (sigma, omega, beta, DeltaOmega_k), 12 with four-acceleration, 15 with the
      velocity-frame split. x_C resolves one. Off-stratum the rule fails: a
      single vector alone has isotropy U(1) and one invariant, not zero.
    status: ORACLE_VERIFIED
    evidence: oracle TF-06 (Jacobian rank at 5 base points for all three dimensions, plus the off-stratum counterexample)
    not_an_identifiability_claim: >-
      counts directions in the INVARIANT space; reachability from data is the
      separate question of II-1.2 and II-4.4
    no_go: false
    buys: >-
      The counted statement of what the tensor upgrade recovers, and the
      acceptance test for any proposed catalogue.

  - id: I-1.3
    pillar: I
    section: state_and_orbit
    statement: >-
      Generic orbits are three-dimensional; isotropy jumps on the axisymmetric
      shear locus and on non-cyclic vector configurations. Separation statements
      are stratum-conditional.
    status: PROPOSED
    no_go: false
    buys: The degenerate strata are the anisotropy types, not the failures.

  - id: I-2.1
