      PLACEHOLDER numerically equal to C.eps2 (a Delta T / T quadrupole
      amplitude) carrying no MES authority. What is established is the SHAPE of
      the result - the [c_s^2/(1+w)]^2 factor and its exact zero at c_s^2 = 0 -
      not any absolute ceiling value.
    status: ACTIVE_CONDITIONAL
    premises: [perfect_fluid, vanishing_frame_heat_flux, vanishing_anisotropic_stress,
               barotropic_or_constant_w]
    gradient_regularity_registered: false
    authority_kind: MOMENTUM_CONSTRAINT_NOT_MES
    evidence: oracle TF-12
    forbidden_use:
