  - id: II-3.1
    legacy_id: TF-09-PARITY-SIGN-EXACTNESS
    pillar: II
    section: exact_inference
    statement: >-
      Under (H1) a null law invariant under a reflection P that also fixes the
      analysis geometry, (H2) an exactly P-equivariant estimator including mask
      deconvolution and weighting, and (H3) P(psi_hat = 0) = 0: the law of
      psi_hat is symmetric about zero, hence sign ~ Bernoulli(1/2) exactly and
      independent of magnitude.
    hypotheses: [reflection_symmetric_null, P_equivariant_estimator, no_atom_at_zero]
    status: ORACLE_VERIFIED
    evidence: >-
      oracle TF-09 - three reflection-symmetric nulls, P(psi>0) = 0.4988 /
      0.4980 / 0.5022, while the even statistic's SCALE moves by 36.5x (sd 3.18
      -> 116.0) with its mean fixed at zero; plus the (H3) failure demonstration
      on Delta_sigma = 0 (max |K_beta| = 2.1e-14).
    h3_failure_strata: ["Delta_sigma = 0 (axisymmetric shear)", "any MISSING_COMPONENT sector"]
    requires_covariance_model: false
    requires_mock_ensemble: false
    scope: >-
      Tests the one bit per vector sector identified by I-2.3. With one sky it
      is a single Bernoulli draw. Independence of sign from magnitude is a
      statement about ONE statistic: signs across nested rungs are NOT
      independent (II-3.2 proves they form a filtration), so BINOMIAL POOLING IS
      INVALID and combination must use the arbitrary-dependence e-value merge of
      II-3.3. (H2) is the binding practical hypothesis: real selection functions
      and point-source holes are not b -> -b symmetric and any violation must be
      declared. A detected asymmetry localises to genuine chirality OR to a
      parity-asymmetric systematic.
    no_go: false
    buys: >-
      The most differentiating statistical capability in the programme: exact
      calibration that survives mask coupling, anisotropic noise and covariance
      misspecification, because reflection through the Galactic plane fixes any
      latitude-symmetric mask and any parity-symmetric variance model.

  - id: II-3.2
    legacy_id: TF-11-MASK-PATH-MARTINGALE
    pillar: II
    section: exact_inference
    statement: >-
      A nested mask ladder is a reverse martingale if and only if every rung
      reports the conditional expectation of the SAME full-sky target; Doob then
      calibrates the path by P(max |M_j| >= lambda sd(M_full)) <= 1/lambda^2.
    status: ORACLE_VERIFIED
    evidence: >-
