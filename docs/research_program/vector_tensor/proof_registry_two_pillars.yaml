  - id: II-1.2
    legacy_id: TF-10-LOCAL-GLOBAL-SEPARATION
    pillar: II
    section: estimand_and_identifiability
    statement: >-
      Dipole alone gives rank 3 against 6 velocity parameters. A boost-only
      channel restores rank 6 - but only ABERRATION is a linear O(beta) channel
      and can do so; the kinematic quadrupole is O(beta^2) (repo-typed,
      frame_typed_algebra.py), contributes no linear rank about beta = 0, and
      about a fiducial beta_MO != 0 enters at relative amplitude O(beta) ~ 1e-3,
      already the WEAKLY_IDENTIFIED regime - an over-determination check, not a
      second linear channel. As that channel weakens, rank stays 6 while
      the minimum principal angle tends to zero - a state distinct from rank
      deficiency.
    status: ORACLE_VERIFIED
    evidence: oracle TF-10 (angle 0.704 -> 0.001 rad at constant rank 6)
    required_status_set: [MISSING_RESPONSE_PROVIDER, NON_IDENTIFIED, SUM_ONLY,
                          WEAKLY_IDENTIFIED, SEPARABLE_CANDIDATE]
    required_gate: (psi_min, s_min, kappa, held-out wrong-source rate)
    no_go: false
    buys: >-
      The positive identification result for the tilt-vs-boost axis: the local
      sector is over-determined once a boost-only channel is registered, so the
      global tilt is identified as the residual rather than removed by a
      subtraction convention.

