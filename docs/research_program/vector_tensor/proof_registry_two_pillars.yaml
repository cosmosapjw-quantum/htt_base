  # ---------------- BRIDGE ----------------
  - id: B-1
    pillar: BRIDGE
    statement: >-
      The MES anchors bound the degree-2 even invariants and, by I-3.1, the
      budget factors through the same four. Therefore NO MES-ANCHORED ceiling
      exists for a scale-free shape coordinate and no morphology statistic
      contributes to the budget. The firewall is about AUTHORITY, not algebraic
      independence: |J_sigma| <= 1 (I-2.4) is an exact algebraic bound, so an
      anchor on I2 does induce |tr sigma^3| <= I2^{3/2}/sqrt(6) - that bound is
      ALGEBRAIC, NOT ANCHORED, is saturated on the axisymmetric locus, and must
      never be reported as a saturation or occupancy.
    status: PROPOSED
    no_go: false
    buys: >-
      Physically a statement about what the constraint and the almost-EGS bounds
      can see; statistically the reason a shape coordinate must be tested
      against a null rather than a ceiling.

  - id: B-2
    pillar: BRIDGE
    statement: >-
      One-way MES logic supplies the deterministic implication; restricted J2
      supplies the condition under which the corresponding test is valid.
      Neither alone licenses a refutation claim.
    status: ACTIVE_CONDITIONAL
    no_go: false

  - id: B-3
    pillar: BRIDGE
    statement: >-
      The acceleration ceiling of I-4.1 is a statement about a declared
      congruence; the statistical channel key must carry congruence or two
      epochs' acceleration saturations become silently comparable.
    status: ACTIVE_CONDITIONAL
    no_go: false

  - id: B-4
    pillar: BRIDGE
    statement: >-
      Parity typing is what makes the exact sign test available; collapsing
      parity for convenience destroys an exact test, not merely a label.
    status: ORACLE_VERIFIED
    no_go: false

