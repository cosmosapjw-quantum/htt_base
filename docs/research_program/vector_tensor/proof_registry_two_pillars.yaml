      the conditional map is MONOTONE, or quasi-convex for the upper endpoint
      AND QUASI-CONCAVE for the lower; otherwise return OPTIMIZER_REQUIRED.
      Bauer's maximum principle places the SUPREMUM of a quasi-convex function at
      an extreme point; the INFIMUM is generically interior (Pi = eta^2 on
      conv{-1,+1}: true inf 0 at eta = 0, vertex enumeration returns 1), and the
      lower envelope is the conservative endpoint.
    status: PROPOSED
    no_go: false
    buys: Turns the local/global no-go into an interval with content.

  - id: II-4.5
    legacy_id: J2-UNIFORM
    pillar: II
    section: partial_identification
    status: RESTRICTED
    original_statement: A noisy random-anchor exceedance test is uniformly finite-sample valid over the whole composite null.
    counterexample: >-
      Equal numerator and anchor marginals give exceedance probabilities 0
      (comonotone) and 1/2 (countermonotone). Retained exactly.
    surviving_statement: >-
      Validity holds under a REGISTERED joint law of the numerator-anchor pair;
      marginals alone do not determine the ratio's exceedance probability.
    conclusion_id: equal_marginals_do_not_determine_raw_ratio_exceedance
    no_go: false
    buys: The reason PR-250 mandatory cross-covariance is not optional.

  - id: II-5.1
    pillar: II
    section: invariance_optimality_multiplicity
    statement: >-
      For a testing problem whose null and alternative class are invariant under
      a group G, every G-invariant test statistic is a function of a maximal
      invariant; on the principal stratum the completed catalogue is a maximal
      invariant for SO(3). With registered external directions, G is their
      stabiliser and the maximal invariant is the catalogue augmented by
      relative-orientation coordinates.
    status: PROPOSED
    basis: classical invariance reduction, applied; separation supplied by I-2.7
    no_go: false
    buys: >-
      The deepest justification for the orbit-space reduction - nothing is lost;
      and the reason alignment statistics belong inside the catalogue.

  - id: II-5.2
    pillar: II
    section: invariance_optimality_multiplicity
    statement: >-
      SO(3) is compact hence amenable; by Hunt-Stein the best invariant test is
      minimax among all tests for the invariant problem.
    status: PROPOSED
    no_go: false
    buys: >-
      Upgrades the reduction from canonical to optimal. A hand-picked low-ell
      anomaly statistic is an arbitrary member of the same function class with
      no optimality property.

  - id: II-5.3
    pillar: II
    section: invariance_optimality_multiplicity
    statement: >-
      Because the maximal invariant is a finite-dimensional coordinate (9/12/15)
      and the catalogue is pre-registered, the invariant test family is finite
      and known; look-elsewhere becomes bookkeeping over a complete catalogue.
    status: PROPOSED
    no_go: false
    buys: A design fix for the a-posteriori-selection objection, not a better correction.

  - id: II-5.4
    legacy_id: P20
    pillar: II
    section: invariance_optimality_multiplicity
    status: ACTIVE
    disposition: restate over the invariant catalogue
    no_go: false

