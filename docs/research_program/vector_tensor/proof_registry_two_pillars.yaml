# This file is a machine-readable mirror of the two-pillar registry. It is
# governance metadata and validates no theorem by itself. It proposes deltas;
# owning code, contracts and CAS adjudications remain authoritative. The legacy
# THEOREM_REGISTRY.yaml stays byte-frozen; new entries type directly into
# THEOREM_SIGNATURES_V2.yaml.

status_enum:
  ACTIVE: proven as stated
  ACTIVE_CONDITIONAL: proven under explicitly stated premises
  PROVEN_CAS4: proven with a four-axis CAS contract at CAS_4AXIS_PASS
  ORACLE_VERIFIED: verified by an executable independent oracle, no CAS contract yet
  PROPOSED: stated with a derivation, awaiting CAS or independent adjudication
  RESTRICTED: stronger conjecture cut down by an exact counterexample; surviving form registered
  OPEN: registered so no downstream claim silently assumes it
  SUPERSEDED: replaced by a stronger or corrected item
  RETRACTED: statement false as printed; retained as a marked counterexample

claim_posture: >-
  No entry is a detection, a Bianchi-family identification, a geometry
  measurement, or a native-solver validation. No entry consumes PR-151 partial
  acquisition data.

oracle:
  module: tensor_foundations_oracle.py
  oracle_id: TENSOR_FOUNDATIONS_ORACLE_V1
  seed: 20260730
  propositions: 12
  all_ok: true
  independence_note: >-
    The oracle re-implements every generator, action and identity from its
    mathematical definition and imports nothing from the repository, so
    agreement with orbit_nonlinearity / orbit_catalogue_v2 / anchor_geometry is
    evidence rather than tautology. It is executable multi-surface evidence, not
    independent human derivation, and it is not a CAS contract.

pillars:
  I:
    name: mathematical physics and theoretical cosmology
    sections: [state_and_orbit, invariant_algebra, constraint_structure,
               sector_closure, anchor_geometry, realizability]
  II:
    name: statistics for real data analysis
    sections: [estimand_and_identifiability, gauge_and_stress,
               exact_inference, partial_identification,
               invariance_optimality_multiplicity, discrimination]
  BRIDGE:
    name: load-bearing in both pillars

