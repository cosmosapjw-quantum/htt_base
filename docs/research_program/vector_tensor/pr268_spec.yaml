schema: htt.pr268.theorem_signatures_v3.spec.v1
pr_id: PR-268
title: Two-pillar theorem registry v3 and executable oracle intake
owner: COMMON
contributors: [HTT, MIO, OBSSTAT]
dependencies: [PR-262, PR-263, PR-267]
capability: theorem_signature_v3_and_tensor_oracle_registration
scope: pre-solver proof-obligation registration and executable test evidence
claim_ceiling: diagnostic_only
roadmap_level: C2
scientific_status_effect: none

frozen_inputs:
  theorem_signatures_v2:
    path: docs/research_program/THEOREM_SIGNATURES_V2.yaml
    sha256: 4e43de815088b372cac82e889fe86b55c815f327af231611336b11ebb8a487d9
  theorem_signatures_v2_loader:
    path: htt/src/common/theorem_signatures.py
    sha256: 214edec76e6deb8c2064b7edb5765a683213b552783baebe6be1b902fa0e160e
  programme_intake:
    path: docs/research_program/vector_tensor/PROGRAM_INTAKE_REGISTRY_V1.yaml
    sha256: b6964771c50c483e7697b087b9f058a3fd7d20ec893475a056608b852fdeb677
  two_pillar_source:
    path: docs/research_program/vector_tensor/proof_registry_two_pillars.yaml
    sha256: 01e278c2223c7f117b429a3359dbc3d483ce0ef409bbb06140b62a9ca3b2f201
  oracle_proposal:
    path: docs/research_program/vector_tensor/tensor_foundations_oracle_proposal.py
    sha256: ddd819323642f5b86e26ee8cad2c9e0bca9175ab842aa66ac4fc81d0c20eb444

cardinality_contract:
  requested_pillar_T_65_alias: legacy_signature_inventory
  requested_pillar_S_58_alias: proposal_registry_rows
  semantic_guard: >-
    These names preserve the owner-requested cardinality aliases only.
    Scientific routing must retain the true source partitions: legacy 65 is
    31 T plus 34 S, and proposal 58 is 30 I plus 24 II plus 4 BRIDGE.
  exact_total_rows: 123
  raw_cardinality_is_theorem_count: false
  partitions_must_be_disjoint: true

signature_contract:
  schema: htt.theorem_signatures.v3
  registration_status: REGISTERED_OBLIGATION
  proof_adjudication_status: NOT_ADJUDICATED
  required_fields:
    - entry_id
    - source_group
    - source_partition
    - statement_status
    - statement
    - statement_identity_sha256
    - assumption_status
    - assumptions
    - domain_status
    - domains
    - frame_status
    - frame_convention
    - branch_status
    - branch_convention
    - proof_class
    - registry_owner
    - scientific_owner
    - dependencies
    - required_evidence
    - evidence_path
    - source_status
    - registration_status
    - proof_adjudication_status
    - claim_ceiling
  missing_component_policy: >-
    A source that did not type assumptions, domains, frame, or branch must use
    an explicit SOURCE_NOT_TYPED status and an empty value. The loader must
    never infer a formal premise from prose.
  statement_identity_policy: >-
    Every identity is recomputed from the authoritative source record and
    compared with the generated v3 row. Source text or signature drift fails
    closed.
  proof_status_policy: >-
    Source statuses are provenance fields only. Loading a row or observing an
    oracle PASS never changes NOT_ADJUDICATED.

oracle_contract:
  production_path: htt/src/common/tensor_foundations_oracle.py
  wrapper_owner: COMMON
  oracle_id: TENSOR_FOUNDATIONS_ORACLE_V1
  seed: 20260730
  proposition_count: 12
  statement_links_required: true
  stable_vectors:
    - id: TF-STABLE-FULL-20260730
      seed: 20260730
      fast: false
      expected_ok: true
    - id: TF-STABLE-REPEAT-20260730
      seed: 20260730
      fast: false
      expected_relation: exact_receipt_equality
  supplied_fast_mode_status: >-
    REPRODUCED_NON_STABLE: at seed 20260730 the supplied fast mode reduces
    TF-11 to 20000 draws and returns ok=false on its direct martingale-control
    separation check. It is not an acceptance vector and must not be repaired
    by changing the frozen proposal.
  mutation_vectors:
    - TF-MUT-ORACLE-ID
    - TF-MUT-SEED
    - TF-MUT-MISSING-PROPOSITION
    - TF-MUT-PROPOSITION-FAIL
    - TF-MUT-UNPROVEN-PROMOTION
    - TF-MUT-PREMISE-ERASURE
  evidence_posture: executable_test_evidence_only
  forbidden_promotion: >-
    Oracle PASS is neither a proof adjudication nor a four-axis CAS verdict.

outputs:
  registry: docs/research_program/vector_tensor/THEOREM_SIGNATURES_V3.yaml
  loader: htt/src/common/theorem_signatures_v3.py
  oracle: htt/src/common/tensor_foundations_oracle.py
  generator: scripts/codex_harness/build_pr268_theorem_signatures.py
  runner: scripts/codex_harness/run_pr268_theorem_registry.py
  tests: tests/contracts/test_theorem_signatures_v3.py

forbidden_actions:
  - modify frozen theorem-signature v2 bytes or loader semantics
  - edit the frozen legacy theorem registry
  - count registry rows as proven theorems
  - promote source status from an oracle self-report
  - relabel executable evidence as four-axis CAS evidence
  - use a native solver, native morphology atlas, or observed data
  - emit a geometry or Bianchi-family identification

kill_condition: >-
  Stop if a theorem statement and its linked oracle use different domain,
  branch, frame, or premise conventions; preserve the mismatch as
  INCONCLUSIVE rather than weakening either statement.
