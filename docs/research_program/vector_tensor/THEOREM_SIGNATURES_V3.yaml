    - entry_id: B-1
      source_group: proposal_registry_rows
      source_partition: BRIDGE
      statement_status: DECLARED
      statement: 'The MES anchors bound the degree-2 even invariants and, by I-3.1, the budget factors
        through the same four. Therefore NO MES-ANCHORED ceiling exists for a scale-free shape coordinate
        and no morphology statistic contributes to the budget. The firewall is about AUTHORITY, not algebraic
        independence: |J_sigma| <= 1 (I-2.4) is an exact algebraic bound, so an anchor on I2 does induce
        |tr sigma^3| <= I2^{3/2}/sqrt(6) - that bound is ALGEBRAIC, NOT ANCHORED, is saturated on the
        axisymmetric locus, and must never be reported as a saturation or occupancy.'
      statement_identity_sha256: 804008b84646c9d0217965f7fb0683cd4afd75813426f45d9060030bc325cca8
