    - entry_id: II-4.4
      source_group: proposal_registry_rows
      source_partition: II
      statement_status: DECLARED
      statement: 'When eta is not point-identified, report the envelope [inf_eta Pi_phi(c|eta), sup_eta
        Pi_phi(c|eta)]. Vertex enumeration over the existing vertex/recession representation returns the
        endpoints when the identified set is convex AND BOUNDED (no active recession direction) and the
        conditional map is MONOTONE, or quasi-convex for the upper endpoint AND QUASI-CONCAVE for the
        lower; otherwise return OPTIMIZER_REQUIRED. Bauer''s maximum principle places the SUPREMUM of
        a quasi-convex function at an extreme point; the INFIMUM is generically interior (Pi = eta^2 on
        conv{-1,+1}: true inf 0 at eta = 0, vertex enumeration returns 1), and the lower envelope is the
        conservative endpoint.'
