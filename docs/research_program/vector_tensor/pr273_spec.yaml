case_contract:
  opaque_case_ids: [C01, C02, C03, C04, C05]
  development_ids: [C01, C02, C03]
  held_out_ids: [C04, C05]
  hidden_scenarios:
    - SCALAR_LIMIT
    - TENSOR_ONLY
    - MISSING_CHANNEL
    - LOCAL_GLOBAL_DEGENERATE
    - MASK_DEPTH_CONFOUNDED
  required_pipeline:
    - JointAnisotropyState
    - TensorFunctionalResult
    - OrbitCatalogueV3Report
    - CertifiedFunctionalPushforward
    - SupportUtilizationProfile
    - OccupancyMeasure
    - ConditionalExceedanceProfile
    - DepthPath
    - DepthCoherenceReport
    - AnisotropyTypeReport
  scalar_successor_mapping:
    x: preregistered scalarized functional value
    Q: premise-anchor stress
    F: finite-direction support utilization and empirical occupancy
    G_F: typed depth path and coherence report
    Pi: matched-null ConditionalExceedanceProfile

depth_alert:
  statistic: mean_normalized_score
  threshold: 25.0
  role: synthetic diagnostic flag only
  posterior_or_evidence_meaning: forbidden

declared_mutations:
  - TRUTH_FIELD_IN_CHALLENGE
  - OBSERVED_DATA_FLAG
  - CHALLENGE_AFTER_SUBMISSION
  - SUBMISSION_AFTER_SEAL
  - TRUTH_VAULT_COMMITMENT
mutation_acceptance: every declared mutation must be rejected mechanically

artifact_contract:
  diagnostic_pack:
    path: docs/research_program/vector_tensor/integration/PR273_DIAGNOSTIC_PACK.json
    required_metadata:
      - owner
      - scope
      - config_identity
      - seed
      - transfer_source
      - claim_ceiling
      - challenge_content_id
      - submission_content_id
      - adjudication_content_id
      - mutation_results
  allowed_use:
    - synthetic state-to-report integration diagnostic
    - held-out abstention and mutation testing
  forbidden_use:
    - observed-data inference
    - native solver or native morphology-atlas validation
    - geometry detection
    - Bianchi family identification or ranking
    - MIO likelihood, posterior, Bayes factor, or evidence

kill_conditions:
  - held-out truth or scenario labels appear in the challenge or analyst submission
  - analysis code reads or receives the truth vault
  - any declared mutation survives
  - observed-data language or input enters the diagnostic pack
  - any report exceeds diagnostic_only
