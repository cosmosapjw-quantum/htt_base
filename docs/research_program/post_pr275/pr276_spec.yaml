entry_contract:
  dependency:
    upstream_id: PR-190
    mode: requires_terminal_receipt
  rationale: >-
    PR-190 ended in a receipt-bearing refutation.  Its failed full-attainability
    statement closes success-only consumers but supplies the terminal chronology
    needed for this post-275 reconciliation.
  preserved_closed_success_edges:
  - downstream_id: PR-191
    upstream_id: PR-190
    mode: requires_success
  - downstream_id: PR-205
    upstream_id: PR-190
    mode: requires_success
  relaxation_authority: >-
    Only a future versioned ClaimCapabilityDecision with explicit supersession
    and evidence closure may replan either edge; PR-276 does not do so.

