frozen_decisions:
- decision_id: D-TYPED-FOUNDATION
  decision: >-
    JointAnisotropyState is the current scientific state authority.  Scalar x_C
    survives only through an explicit LegacyProjectionReport with BC1/BC2 status.
  reopen_condition: A proof-bearing receipt shows that BC1 is violated.
- decision_id: D-GOVERNANCE-BRAKE-2026-08
  decision: >-
    After two consecutive assurance-only PRs, the next PR must deliver a named
    downstream scientific capability, data integration, experiment, or
    interpretable result unless a reproduced high-severity defect directly blocks it.
  reopen_condition: A versioned replacement demonstrates a downstream consumer and a reproduced failure.

defined_scientific_gates:
- gate_id: G1
  statement: Typed state identity and frame/congruence/units are closed.
- gate_id: G2
  statement: Orbit/type acceptance preserves parity, strata, and explicit incompleteness.
- gate_id: G3
  statement: Estimator, mask, and weighting pass executable parity equivariance.
- gate_id: G4
  statement: Weak identification produces abstention rather than a forced label.
- gate_id: G5
  statement: Depth paths carry nested-support and transport identities.
- gate_id: G6
  statement: Reverse-martingale calibration has a proved premise or matched-mock fallback.
- gate_id: G7
  statement: Source separation retains covariance-supported unidentified directions.
- gate_id: G8
  statement: Claim capability follows evidence closure and independent adjudication.
undefined_gate_ids_forbidden:
- G9
- G10
- G11
- G12
gate_correction: >-
  Supplied proposal prose referred to G1-G12, but only G1-G8 had statements and
  pass criteria.  PR-276 registers only G1-G8 and does not invent missing gates.

