kill_conditions:
- Remote merge lineage or candidate-tree identity no longer matches the recorded baseline.
- Reconciliation requires changing a frozen historical receipt.
- A user-owned untracked input collides with a tracked target.
- A completed status alone grants theorem, data, inference, morphology, family, or publication capability.
