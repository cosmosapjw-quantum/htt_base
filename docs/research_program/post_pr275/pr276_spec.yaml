acceptance:
  required:
  - Canonical backlog, status, JSON/YAML mirrors, and policy order agree.
  - PR-276 through PR-294 are atomically registered with complete card contracts.
  - PR-276 alone is in progress; PR-277 through PR-294 remain pending.
  - Current handoff surfaces contain no false statement that PR-258 is pending or unmerged.
  - Generated status and claim surfaces bind the current worktree identity.
  - CLAUDE and both long-backlog copies identify typed state as current authority.
  - PR-270 is rendered completed without moving its frozen CAS adjudication.
  - PR-172 failure and PR-184 successor chronology remain unchanged.
  forbidden:
  - Modify a historical proof receipt or sealed scientific artifact.
  - Track, move, delete, unpack, or rewrite user-owned untracked inputs.
  - Treat admission as observed-data execution authorization.
  - Open a success-only dependency using completion status alone.

