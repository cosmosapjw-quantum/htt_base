canonical_dispositions:
- STABLE_REPLAY
- MIGRATION_ONLY
- REPROVE
- RECALIBRATE_SYNTHETIC
- RERUN_FROM_RAW_DATA
- RERUN_FROM_ADMITTED_SUMMARY
- CORRECTED_SUPERSEDED
- FALSIFIED_HISTORICAL
- LEGACY_REPRODUCTION_ONLY
- EXTERNAL_BLOCKED
- NATIVE_BLOCKED

legacy_normalization:
  lossless_fields:
  - legacy_disposition
  - legacy_actions
  - normalized_dispositions
  - execution_steps
  atomic_rules:
    MIGRATE_REVALIDATE:
      dispositions: [MIGRATION_ONLY, STABLE_REPLAY]
    HOLD_NATIVE:
      dispositions: [NATIVE_BLOCKED]
    PROOF_READJUDICATION:
      dispositions: [REPROVE]
    FRESH_SYNTHETIC:
      dispositions: [RECALIBRATE_SYNTHETIC]
    FROM_RAW:
      dispositions: [RERUN_FROM_RAW_DATA]
    LEGACY_PUSHFORWARD:
      dispositions: [LEGACY_REPRODUCTION_ONLY]
    REGENERATE:
      dispositions: [STABLE_REPLAY]
    REBASE_THEN:
      dispositions: [MIGRATION_ONLY]
    FULL_REFIT:
      dispositions: []
      execution_steps: [FULL_REFIT_AFTER_REQUIRED_ADMISSION_OR_SYNTHETIC_CALIBRATION]
    RESUME_COMPLETE_THEN:
      dispositions: [EXTERNAL_BLOCKED]
      execution_steps: [COMPLETE_AUTHENTICATED_ACQUISITION]
    REPAIR_THEN_RERUN:
      dispositions: [CORRECTED_SUPERSEDED]
      execution_steps: [USE_REGISTERED_SUCCESSOR_NOT_HISTORICAL_FAILURE]
    READMIT_COMPLETE_DATA_THEN_SEPARATELY_AUTHORIZE:
      dispositions: [EXTERNAL_BLOCKED, RERUN_FROM_ADMITTED_SUMMARY]
      execution_steps: [READMIT_COMPLETE_DATA, REQUIRE_SEPARATE_EXECUTION_AUTHORIZATION]
  source_grammar:
    ordinary_join: _AND_
    prefix_composition:
      REBASE_THEN_: REBASE_THEN
      RESUME_COMPLETE_THEN_: RESUME_COMPLETE_THEN
    exact_atoms:
    - MIGRATE_REVALIDATE
    - HOLD_NATIVE
    - REPAIR_THEN_RERUN
    - READMIT_COMPLETE_DATA_THEN_SEPARATELY_AUTHORIZE
    rule: >-
      Prefix composition consumes the first following atomic action without
      an `_AND_` delimiter; later actions retain `_AND_`. This explicitly
      covers the 23 immutable REBASE/RESUME rows and must round-trip to the
      original string.
  explicit_current_overrides:
    PR-172:
      add: [FALSIFIED_HISTORICAL, CORRECTED_SUPERSEDED]
      successor: PR-184
    PR-190:
      add: [FALSIFIED_HISTORICAL]
      reason: registered_full_typed_dynamical_sharpness_refuted
  rules:
  - A combined legacy string is parsed into registered atomic actions without dropping order or multiplicity.
  - FULL_REFIT remains an execution step; it is not silently renamed as a data source.
  - RERUN_FROM_ADMITTED_SUMMARY is allowed only after a registered data-admission receipt.
  - Current orchestration state and execution resolution come only from canonical pr_status.yaml.
  - Historical source fields are immutable; corrections are explicit supersession edges.

