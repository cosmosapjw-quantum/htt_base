lifecycle_projection:
  node_contract: common.evidence_graph.EvidenceNode
  edge_contract: common.evidence_graph.EvidenceEdge
  required_edge_metadata: [affected_capabilities, reason_ref]
  active_claim_authority: false
  rules:
  - Root authority and target artifact nodes are content-addressed over tracked bytes or normalized row identities.
  - Only artifact-level edges instantiate PR-277 lifecycle types.
  - Internal PR routing uses a separate ROUTED_TO relation and never enters ClaimCapabilityDecision closure.
  - Completion status, PR number, or dependency position is not an invalidation reason.

