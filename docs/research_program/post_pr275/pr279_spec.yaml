data_artifact_scope:
  source_count_status: approximate_45_groups
  normalized_scope: exactly_45_named_groups
  grouping_authority: >-
    PR-279 implementation normalization selected from the approximate campaign
    groups and independent physics/statistics audit. The 45 boundaries are not
    represented as a historical fact of the source document.
  expected_totals:
    REDO_REQUIRED: 20
    REDO_UPGRADE: 14
    PRESERVE: 5
    BLOCKED: 6
  rule: >-
    Each named group must carry a resolvable tracked producer or historical
    source surface, an internal PR owner, a recompute route, consumers, and a
    claim ceiling. BLOCKED entries additionally require one named external or
    admission event.
  required_fields:
  - artifact_id
  - artifact_kind
  - materialized
  - disposition
  - disposition_basis
  - internal_prs
  - scientific_owner
  - producer_or_source_paths
  - consumers
  - normalized_dispositions
  - recompute_route
  - claim_ceiling
  - transfer_source
  - sky_mask_covariance_null_status
  - assumptions
  - caveats
  - generating_procedure
  semantic_rules:
  - REDO_UPGRADE is a migration target, not admission, readiness, calibration, or claim promotion.
  - Only the shared-cause fitted score is directly falsified by N-STAT-PSEUDO-BAYES; propagated V1 surfaces remain conservative legacy-only reruns.
  - A non-materialized target is identified as such and never called an observed-data artifact.
  - DESI BGS_ANY and BGS_BRIGHT-21.5 are different versioned estimands.
  - Any missing dedicated downstream card is a named failure-debt row, not an invented execution route.

output_metadata:
  required_global_fields:
  - owner
  - scope
  - allowed_use
  - transfer_source
  - source_identities
  - assumptions
  - caveats
  - generating_procedure
  - claim_tier_ceiling
  rule: Exact hashes are required for the tracked intake and lifecycle nodes; they do not by themselves confer validity or readiness.

output_invariants:
- Exactly 222 historical internal work units occur once each.
- The 19 PR-276 through PR-294 units occur only in the prospective section.
- Exactly 366 GitHub records use the GITHUB-PR namespace.
- Every legacy disposition round-trips through legacy_actions without loss.
- Every internal row has at least one canonical disposition and a named recompute route.
- Every typed lifecycle edge resolves content-addressed endpoints and carries affected_capabilities and reason_ref under the PR-277 contract.
- Every supersession edge preserves its historical predecessor.
- Every claim, artifact, and consumer in scope resolves to a known disposition and recompute route.
- Unknown disposition, orphan endpoint, orphan consumer, and unregistered downstream route count are zero.

fixed_boundaries:
  capability_effect: none
  public_use: false
  observed_data_execution: false
  native_solver_status: absent
  native_morphology_atlas_status: absent
  family_identification: blocked_pre_native_atlas
  mio_posterior_or_evidence: forbidden
  legacy_projection_role: comparison_only

hard_stops:
- An internal PR number and GitHub PR number are treated as the same identity.
- A completed status is used as scientific capability evidence.
- A historical disposition or receipt is rewritten in place.
- A claim, artifact, consumer, or edge endpoint is unresolved.
- An unknown disposition or recompute route survives validation.
- A blocked data item lacks a named event or is silently used as admitted input.
- A synthetic or legacy number is promoted to current observed evidence.
- Native status, Bianchi-family identification, or MIO posterior semantics are introduced.
