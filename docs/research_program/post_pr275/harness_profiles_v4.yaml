schema_version: htt.harness_profiles.v4
manifest_id: PR280-HARNESS-PROFILES-V4
changed_surface_routes:
- route_id: harness_and_common_contracts
  path_regex: (\.agent-harness/context/CLAIM_REGISTRY\.jsonl|htt/src/common/(contracts|status_snapshot|harness_profiles_v4|failure_inventory_v4|mes_successor_registry)\.py|scripts/(ver2_artifact_export\.py|codex_harness/(run_pr280_harness|run_subset)\.py)|tests/__init__\.py|tests/contracts/test_(harness_profiles_v4|failure_inventory_v4|harness_runner|status_snapshot|mes_successor_registry|ownership_firewall)\.py|docs/(codex_handoff/test_harness\.md|research_program/post_pr275/(harness_profiles_v4|test_execution_receipts_v4|pr280_spec|full_inventory_v4_failure_rules)\.yaml|research_program/post_pr275/(pr280_publication_policy|full_inventory_v4_classification|full_inventory_v4_receipt)\.json))
  profiles: [exact, smoke, active-import]
- route_id: package_surface
  path_regex: (htt/pyproject\.toml|htt/src/common/resources/.*|htt/test_packaging_imports\.py)
  profiles: [package, active-import]
- route_id: pr280_root_cause_dag_surface
  path_regex: (docs/codex_handoff/pr_(backlog\.(yaml|json)|status\.yaml)|machine_readable/pr_(backlog\.(yaml|json)|status\.yaml)|docs/research_program/post_pr275/(pr276_spec|failure_debt|PR_RETRACE_LEDGER|data_runbooks|recompute_matrix)\.yaml|htt/src/common/pr_retrace\.py|scripts/codex_harness/(run_pr279_reverse_trace|validate_pr_dag|test_pr_dag_harness)\.py|tests/(contracts/test_pr_retrace_ledger|pr_cards/test_pr_276_post275_reconciliation)\.py|docs/generated/(status_snapshot|claim_ledger)\.json|docs/generated/(status_matrix|progress_scoreboard)\.md)
  profiles: [exact, current-active]
- route_id: typed_scientific_surface
  path_regex: (htt/(src/common|mio|obsstat|htt/htt)/(joint_anisotropy_state|tensor_functionals|orbit_catalogue_v3|conditional_exceedance|depth_path|anisotropy_type_report|.*pillar_.*|blind_synthetic).*|tests/(contracts|integration)/test_(joint_anisotropy_state|tensor_functionals|orbit_catalogue_v3|conditional_exceedance|depth_path|anisotropy_type_report|pillar_.*|vector_tensor_blind_synthetic)\.py)
  profiles: [scientific, smoke]
- route_id: data_preflight_surface
  path_regex: (data|docs/research_program/.*/data|htt/obsstat|tests/(obsstat|htt)|tests/contracts/test_(vector_tensor_data_admission|pr1(44|51|52|53|54)_.*)).*
  profiles: [data:planck, data:cf4, data:hsc-kids, data:act, data:desi, data:jwst]
- route_id: formal_surface
  path_regex: (formal/.*|docs/generated/.*/axis_.*|tests/contracts/test_pillar_t_cas\.py)
  profiles: [formal:wolfram-xact, formal:sympy, formal:sage-singular, formal:lean]
- route_id: publication_surface
  path_regex: (papers/planck_mes_first_observation/.*|tests/paper/test_planck_mes_first_paper\.py|tests/contracts/test_claim_language_lint\.py)
  profiles: [publication]
- route_id: safe_default
  path_regex: .*
  profiles: [current-active]
profiles:
- profile_id: exact
  kind: pytest
  lane: contract_exactness
  selectors:
  - scripts/codex_harness/test_pr_dag_harness.py
