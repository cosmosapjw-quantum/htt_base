schema: htt.observational_readiness_pr.v1
pr_id: PR-320
title: HSC-KiDS paired same-sky joint-covariance derivation
capability: HSC_KIDS_PAIRED_SAME_SKY_JOINT_COVARIANCE_AND_LOCAL_STRUCTURAL_RANK
predecessor:
  commit: 44016e4af2f41cf566be653d448dad8b434da38e
claim_ceiling: synthetic_joint_covariance_and_local_structural_rank_only

source_boundary:
  hsc: HSC_S19A_Y3
  kids: KIDS_1000_DR4_1
  official_joint_covariance: not_published_with_the_two_release_products
  observed_readiness: blocked_without_admitted_paired_same_sky_null_rows

covariance_estimator:
  branch: PAIRED_SAME_SKY_NULLS
  row_semantics: PAIRED_SAME_SKY_COSMIC_REALIZATION
  required_identity:
    - exact identical ordered unique realization IDs
    - HSC and KiDS feature order
    - per-feature units
    - per-feature normalization IDs
    - realization source identity
    - common overlap support identity
    - survey-specific operator identities
  centering: JOINT_SAMPLE_MEAN
  denominator: N_MINUS_ONE
  formula: transpose(X - column_mean) @ (X - column_mean) / (N - 1)
  covariance_blocks: [HSC_auto, HSC_KiDS_cross, KiDS_auto]
  exact_zero_cross_block: valid_when_estimated_from_complete_paired_rows
  missing_cross_information: NON_IDENTIFIED_CROSS_SURVEY_COVARIANCE

rank_boundary:
  covariance_validity: symmetric_positive_semidefinite_sample_covariance
  whitening_requirement: positive_definite_and_condition_number_at_most_1e10
  whitening_failure: COVARIANCE_VALID_WHITENING_UNAVAILABLE
  success_label: LOCAL_STRUCTURAL_FULL_INCREMENTAL_RANK
  global_identification: NOT_ESTABLISHED
  likelihood_ready: false
  finite_mock_precision_correction: none

pass:
  - joint covariance exactly matches the centered paired-row N-minus-one estimator
  - row-order, unit, feature-order, normalization, and operator drift fail closed
  - an evidenced zero cross block remains valid cross information
  - a singular sample covariance never reaches Cholesky whitening or rank
  - a legacy arbitrary cross matrix has no covariance authority
  - synthetic HSC and KiDS rows share one latent-sky realization identity

terminal:
  implementation: PASS_SYNTHETIC_PAIRED_NULL_COVARIANCE_CLOSURE
  data_identity: NO_ADMITTED_OBSERVED_PAIRED_NULL_ENSEMBLE
  scientific_execution: NOT_EXECUTED
  observed_statistic_seen: false
  observed_science_executed: false
  release_status: BLOCKED_OBSERVED_CROSS_COVARIANCE

forbidden:
  - arbitrary supplied cross-covariance matrix
  - block-diagonal zero-fill for missing cross information
  - treating HSC and KiDS as independent skies
  - pseudoinverse rank after covariance singularity
  - likelihood or p-value without finite-sample precision treatment
  - global or practical identification from local structural rank
  - source attribution or Bianchi-family identification
