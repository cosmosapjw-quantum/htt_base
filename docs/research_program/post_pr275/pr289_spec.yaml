schema: htt.pr289.data_identity_v2.spec.v1
pr_id: PR-289
title: Data identity registry v2 and execution-authorization separation
owner: COMMON
contributors: [OBSSTAT, HTT]
change_set_id: CS-PR289-DATA-IDENTITY-V2
publication_group_id: PG-PR289-DATA-IDENTITY-V2

dependencies: [PR-280]
dependency_contract:
  upstream_id: PR-280
  mode: requires_terminal_receipt
  accepted_terminal: COMPLETED_FAILED_WITH_RECEIPT
  success_dependency_required: false
  rule: >-
    The preserved PR-280 terminal receipt authorizes bounded, non-executing
    data-identity work only. It does not relabel the failed aggregate or admit
    any external product.

capability: authenticated_data_identity_and_separate_execution_receipts
scope: external-data identity admission without acquisition or analysis
claim_tier: diagnostic_only
claim_level: {scheme: roadmap_rescue_v1, level: C2}
scientific_artifact_mode: data_admission_preflight
transfer_source: none
observed_data_executed: false
public_use: false
family_identification_gate: BLOCKED_PRE_NATIVE_ATLAS
scientific_status_effect: OPEN_UNCHANGED

historical_boundary:
  immutable_predecessor: PR-274
  v1_registry: docs/research_program/vector_tensor/data_admission/PR274_DATA_IDENTITY_REGISTRY.yaml
  v1_result: docs/research_program/vector_tensor/data_admission/PR274_ADMISSION_RESULT.json
  rule: >-
    PR-274 v1 bytes and its zero-admission conclusion remain immutable.
    Every PR-289 record has a v2 identity and a separate authorization
    lifecycle; no v1 record is edited, promoted, or silently migrated.

data_identity_record_v2:
  schema: common.data_identity_record.v2
  factory_only: true
  content_address: sha256_of_canonical_payload
  required_fields:
    - record_id
    - lane_id
    - product_id
    - component_id
    - source_locator_kind
    - source_locator_identity
    - release_name
    - release_version
    - release_identity
    - license_identity
    - regular_file_status
    - symlink_status
    - byte_size
    - content_sha256
    - component_inventory_id
    - completeness_status
    - units_contract_id
    - coordinate_frame_id
    - directional_or_harmonic_convention_id
    - mask_or_selection_id
    - covariance_id
    - null_ensemble_id
    - transfer_source
    - sky_support_status
    - acquisition_status
    - inspected_at_utc
  exact_file_rules:
    - candidate components must resolve to existing regular files
    - symlinks and any path traversing a symlink are rejected
    - byte size must be positive and equal the registered value
    - sha256 is streamed from the exact regular file and must match
    - duplicate inode aliases and hard-linked out-of-root aliases are rejected
    - component order and completeness are content-addressed
  semantic_rules:
    - release and license identities are mandatory and nonempty
    - units frame conventions mask selection covariance null and sky support are typed
    - transfer provenance remains observer-side none or an explicit external-transfer identity
    - an admitted identity is not an execution authorization

candidate_root_contract:
  source: caller-supplied local roots descriptor outside Git
  accepted_locator_kinds: [absolute_local_root]
  forbidden:
    - automatic_download
    - network_fetch
    - repository_copy
    - repository_symlink
    - glob_without_frozen_inventory
    - mutable_partial_file
  portability_rule: >-
    A clean checkout with no external roots deterministically emits explicit
    NOT_PRESENT refusals and never downloads. A supplied root is inspected
    read-only; the committed registry contains identities, not large files or
    machine-specific authorization.

lane_registry:
  order: [PLANCK, CF4, HSC_KIDS, ACT, DESI, JWST_SN]
  lanes:
    PLANCK:
      first_candidate: true
      required_products:
        - PR3 temperature or polarization map product
        - matching mask and beam identities
        - frozen harmonic convention
        - FFP10 null ensemble or explicit unavailable status
        - covariance identity
      downstream_gate: H-PLANCK
    CF4:
      required_products:
        - raw group catalogue
        - selection and zone-of-avoidance definition
        - units and coordinate frame
        - full covariance identity
      downstream_gate: H-CF4
    HSC_KIDS:
      required_products:
        - separate HSC and KiDS product identities
        - masks randoms PSF n_z shear calibration and covariance
      name_only_status: REJECTED_NAME_ONLY
      downstream_gate: H-HSC-KiDS
    ACT:
      required_products:
        - one frozen validated product or raw-QE branch
        - response mean-field noise mask simulation and covariance identities
      downstream_gate: H-ACT
    DESI:
      required_products:
        - complete BGS_BRIGHT-21.5 data and random inventory
        - exactly 1000 complete EZmock identities
        - exactly 25 separate Abacus validation identities
        - matched selection and covariance identities
      partial_status: BLOCKED_PR151_INCOMPLETE
      forbidden_inputs: [aria2_part_file, unfinished_session, mutable_manifest]
      downstream_gate: H-DESI
    JWST_SN:
      required_products:
        - row-level source and host identities
        - individual errors
        - shared zero-point and peculiar-velocity covariance identities
        - competitor-model identity
      downstream_gate: H-JWST

admission_decision_contract:
  statuses:
    - ADMITTED_IDENTITY_ONLY
    - REJECTED_NOT_PRESENT
    - REJECTED_NOT_REGULAR_FILE
    - REJECTED_SYMLINK_OR_ALIAS
    - REJECTED_IDENTITY_MISMATCH
    - REJECTED_INCOMPLETE_COMPONENT_SET
    - REJECTED_MISSING_RELEASE_OR_LICENSE
    - REJECTED_MISSING_SEMANTIC_CONTRACT
    - REJECTED_NAME_ONLY
    - BLOCKED_PR151_INCOMPLETE
  pass_semantics: >-
    ADMITTED_IDENTITY_ONLY means exact product bytes and semantic identities
    passed the registered preflight. It authorizes no feature extraction,
    likelihood, observed statistic, figure, or scientific claim.
  aggregate_statuses:
    - NO_ADMITTED_IDENTITIES
    - PARTIAL_LANE_ADMISSION
    - ADMITTED_IDENTITIES_AWAITING_SEPARATE_AUTHORIZATION

execution_authorization_receipt:
  schema: common.execution_authorization_receipt.v1
  factory_only: true
  distinct_content_identity: true
  default_status: NOT_AUTHORIZED
  required_fields:
    - authorization_id
    - lane_id
    - exact_admission_record_ids
    - analysis_plan_id
    - human_gate_id
    - human_authority_identity
    - authorized_scope
    - issued_at_utc
    - expires_at_utc
    - status
  statuses: [NOT_AUTHORIZED, AUTHORIZED, EXPIRED, REVOKED]
  authorization_rule: >-
    PR-289 may define and emit NOT_AUTHORIZED receipts only. AUTHORIZED needs
    a later lane-specific human gate and cannot be inferred from admission,
    backlog state, user-wide overnight permission, or a process PASS.

receipt_contract:
  output_path: docs/generated/pr289_data_identity_v2_receipt.json
  pass_token: PASS_DATA_IDENTITY_V2_PREFLIGHT
  block_token: BLOCKED_DATA_IDENTITY_V2_CONTRACT
  terminal_precedence:
    - BLOCKED_CONTRACT_OR_DEPENDENCY
    - BLOCKED_PATH_ESCAPE_OR_MUTATION
    - BLOCKED_REGISTERED_MUTATION
    - PASS_DATA_IDENTITY_V2_PREFLIGHT
  required_metadata:
    - owner
    - scope
    - claim_tier
    - transfer_source
    - lane_and_product_identities
    - sky_mask_selection_covariance_null_status
    - assumptions
    - caveats
    - generating_procedure
    - git_commit_or_worktree_state
  process_success_semantics: >-
    PASS means the v2 factories, refusal paths, identity checks, and registered
    mutations executed. It does not mean any lane was admitted, authorized,
    executed, scientifically validated, or approved for public use.

mutation_registry:
  - {mutation_id: MU289-PR274-MUTATION, intended_defect: immutable v1 bytes or result are changed}
  - {mutation_id: MU289-ADMISSION-AUTH-COLLAPSE, intended_defect: admission directly produces AUTHORIZED}
  - {mutation_id: MU289-SYMLINK, intended_defect: symlinked component is admitted}
  - {mutation_id: MU289-PARENT-SYMLINK, intended_defect: path traversing a symlinked parent is admitted}
  - {mutation_id: MU289-HARDLINK-ALIAS, intended_defect: out-of-root hard-linked alias is admitted}
  - {mutation_id: MU289-SIZE, intended_defect: byte size differs from the frozen identity}
  - {mutation_id: MU289-HASH, intended_defect: content digest differs from the frozen identity}
  - {mutation_id: MU289-INVENTORY, intended_defect: component is missing duplicated or reordered}
  - {mutation_id: MU289-RELEASE-LICENSE, intended_defect: release or license identity is absent}
  - {mutation_id: MU289-SEMANTIC-FIELD, intended_defect: units frame mask selection covariance null or sky support is absent}
  - {mutation_id: MU289-NAME-ONLY, intended_defect: name-only HSC or KiDS input is admitted}
  - {mutation_id: MU289-DESI-PARTIAL, intended_defect: PR151 partial or aria2 part file is admitted}
  - {mutation_id: MU289-AUTODOWNLOAD, intended_defect: missing input triggers a network or download side effect}
  - {mutation_id: MU289-MUTATION-OMISSION, intended_defect: returned mutation evidence is incomplete or hardcoded}
  - {mutation_id: MU289-CLAIM-PROMOTION, intended_defect: admission pass becomes observed native public or family evidence}

allowed_uses:
  - read-only external product identity preflight
  - explicit refusal and input-gap reporting
  - downstream human-gate preparation after identity admission
forbidden_uses:
  - automatic acquisition or clean-checkout redownload
  - Git copy symlink or partial-file admission
  - observed-data execution or scientific result
  - admission inferred as execution authorization
  - native solver validation geometry detection or Bianchi family identification
caveats:
  - PR-274 v1 remains immutable and admitted zero inputs.
  - PR-151 background acquisition remains incomplete and is forbidden input.
  - Missing roots are expected refusal outcomes rather than skipped tests.
  - A valid local identity can become stale if external bytes or semantic metadata change.
