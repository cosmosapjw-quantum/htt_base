schema: htt.pr289.data_identity_v2.spec.v1
pr_id: PR-289
title: Data identity registry v2 and execution-authorization separation
owner: COMMON
contributors: [OBSSTAT, HTT]
change_set_id: CS-PR289-DATA-IDENTITY-V2
publication_group_id: PG-PR289-DATA-IDENTITY-V2

dependencies: [PR-280]
dependency_contract:
  upstream_id: PR-280
  mode: requires_terminal_receipt
  accepted_terminal: COMPLETED_FAILED_WITH_RECEIPT
  success_dependency_required: false
  rule: >-
    The preserved PR-280 terminal receipt authorizes bounded, non-executing
    data-identity work only. It does not relabel the failed aggregate or admit
    any external product.

capability: authenticated_data_identity_and_separate_execution_receipts
scope: external-data identity admission without acquisition or analysis
claim_tier: diagnostic_only
claim_level: {scheme: roadmap_rescue_v1, level: C2}
scientific_artifact_mode: data_admission_preflight
transfer_source: none
observed_data_executed: false
public_use: false
family_identification_gate: BLOCKED_PRE_NATIVE_ATLAS
scientific_status_effect: OPEN_UNCHANGED

historical_boundary:
  immutable_predecessor: PR-274
  v1_replay_commit: ff9ef9f45747e559c5343b463cf010dfc3a7432a
  v1_registry: docs/research_program/vector_tensor/data_admission/PR274_DATA_IDENTITY_REGISTRY.yaml
  v1_registry_sha256: 92ca32a29b7a660efd0f54780009e7a4ef901133b9d6e50d187d931a2b3c60c9
  v1_result: docs/research_program/vector_tensor/data_admission/PR274_ADMISSION_RESULT.json
  v1_result_sha256: e841af100465d9c76b200e2aad0030ec76319a9d120e91226232d52c51d5baea
  rule: >-
    PR-274 v1 bytes and its zero-admission conclusion remain immutable.
    Source-bound PR-274 replay runs in its exact canonical commit context;
    later repaired PR-273 pack bytes are not substituted into the old receipt.
    Every PR-289 record has a v2 identity and a separate authorization
    lifecycle; no v1 record is edited, promoted, or silently migrated.

data_identity_record_v2:
  schema: common.data_identity_record.v2
  factory_only: true
  content_address:
    record_id: sha256_of_stable_identity_payload_excluding_record_id_inspection_time_and_local_path
    inspection_receipt_id: sha256_of_full_record_payload_excluding_inspection_receipt_id
    source_locator_rule: serialize a content-addressed root descriptor identity, never the machine-local absolute path
    component_inventory_rule: sha256 of the ordered component_id byte_size content_sha256 tuples
  required_fields:
    - record_id
    - inspection_receipt_id
    - lane_id
    - product_id
    - component_id
    - component_ordinal
    - source_locator_kind
    - source_locator_identity
    - release_name
    - release_version
    - release_identity
    - license_identity
    - regular_file_status
    - symlink_status
    - byte_size
    - content_sha256
    - component_inventory_id
    - completeness_status
    - units_contract_id
    - coordinate_frame_id
    - sign_orientation_convention_id
    - directional_convention_id
    - harmonic_convention_id
    - mask_id
    - selection_id
    - sky_support_id
    - covariance_id
    - covariance_status
    - null_ensemble_id
    - null_ensemble_status
    - transfer_source
    - transfer_function_spec_id
    - transfer_provenance_status
    - sky_support_status
    - license_status
    - native_identity_profile_id
    - native_identity_profile
    - acquisition_status
    - inspected_at_utc
  exact_file_rules:
    - candidate components must resolve to existing regular files
    - symlinks and any path traversing a symlink are rejected
    - byte size must be positive and equal the registered value
    - sha256 is streamed from the exact regular file and must match
    - duplicate inode aliases and hard-linked out-of-root aliases are rejected
    - component order and completeness are content-addressed
  semantic_rules:
    - source identities use a registered resolvable scheme with a nonempty authority payload
    - release versions contain both alphabetic and numeric version material and are bound by the typed evidence object
    - license identities use a registered SPDX DOI URL URN repository or docs scheme and resolve through the typed evidence object
    - duplicate keys nonfinite constants placeholder schemes one-character releases and missing evidence are rejected
    - units frame sign directional harmonic mask selection covariance null and sky support identities and statuses are independently typed
    - transfer provenance remains observer-side none with NOT_APPLICABLE status or binds an explicit external TransferFunctionSpec identity
    - Planck CF4 and HSC/KiDS admission requires a complete content-bound native profile whose relative component paths child identities and relationships replay from the exact component inventory
    - exported records replay every typed evidence field and every repeated component role appears exactly once at each registered ordinal
    - generic strings record IDs or component counts cannot substitute for native selection operator catalogue covariance or survey-child roles
    - an admitted identity is not an execution authorization

stable_identity_evidence:
  schema: common.data_identity_evidence.v2
  required_bindings:
    - lane_id
    - product_id
    - source_locator_identity
    - release_name
    - release_version
    - release_identity
    - license_identity
    - license_status
  evidence_rule: exact regular non-symlink JSON with duplicate-key and nonfinite-value rejection and a frozen SHA-256

candidate_root_contract:
  source: caller-supplied local roots descriptor outside Git
  accepted_locator_kinds: [absolute_local_root]
  forbidden:
    - automatic_download
    - network_fetch
    - repository_copy
    - repository_symlink
    - glob_without_frozen_inventory
    - mutable_partial_file
  portability_rule: >-
    A clean checkout with no external roots deterministically emits explicit
    NOT_PRESENT refusals and never downloads. A supplied root is inspected
    read-only; the committed registry contains identities, not large files or
    machine-specific authorization.

lane_registry:
  machine_registry: docs/research_program/post_pr275/data_registry_v2/LANE_REGISTRY_V2.json
  machine_registry_rule: exact content-addressed lane product component cardinality semantic convention and human-gate authority
  native_profile_rule: exact per-lane schema plus content-bound component relationships replayed by the existing data-identity evaluator
  order: [PLANCK, CF4, HSC_KIDS, ACT, DESI, JWST_SN]
  lanes:
    PLANCK:
      first_candidate: true
      required_products:
        - distinct PR3 SMICA and Commander map identities
        - per-pipeline mask beam covariance and window/operator identities
        - exact same-sky pixelization and native-selection pairing
        - content-bound FFP10 null inventory and null-ensemble identity
      downstream_gate: H-PLANCK
    CF4:
      required_products:
        - raw group catalogue
        - exact row-selection and zone-of-avoidance definitions
        - exact units coordinate-frame and radial-sign definitions
        - full covariance grouping and depth-definition identities
      downstream_gate: H-CF4
    HSC_KIDS:
      required_products:
        - separate HSC and KiDS product identities
        - separate masks randoms PSF and n_z child identities
        - separate HSC calibration and KiDS response identities
        - separate auto-covariances and one content-bound cross-covariance
      name_only_status: REJECTED_NAME_ONLY
      downstream_gate: H-HSC-KiDS
    ACT:
      required_products:
        - one frozen validated product or raw-QE branch
        - response mean-field noise mask simulation and covariance identities
      downstream_gate: H-ACT
    DESI:
      required_products:
        - complete BGS_BRIGHT-21.5 data and random inventory
        - exactly 1000 complete EZmock identities
        - exactly 25 separate Abacus validation identities
        - matched selection and covariance identities
      partial_status: BLOCKED_PR151_INCOMPLETE
      forbidden_inputs: [aria2_part_file, unfinished_session, mutable_manifest]
      downstream_gate: H-DESI
    JWST_SN:
      required_products:
        - row-level source and host identities
        - individual errors
        - shared zero-point and peculiar-velocity covariance identities
        - competitor-model identity
      downstream_gate: H-JWST

admission_decision_contract:
  statuses:
    - BLOCKED_PATH_ESCAPE_OR_MUTATION
    - ADMITTED_IDENTITY_ONLY
    - REJECTED_NOT_PRESENT
    - REJECTED_NOT_REGULAR_FILE
    - REJECTED_SYMLINK_OR_ALIAS
    - REJECTED_IDENTITY_MISMATCH
    - REJECTED_INCOMPLETE_COMPONENT_SET
    - REJECTED_MISSING_RELEASE_OR_LICENSE
    - REJECTED_MISSING_SEMANTIC_CONTRACT
    - REJECTED_NAME_ONLY
    - BLOCKED_PR151_INCOMPLETE
  pass_semantics: >-
    ADMITTED_IDENTITY_ONLY means exact product bytes and semantic identities
    passed the registered preflight. It authorizes no feature extraction,
    likelihood, observed statistic, figure, or scientific claim.
  canonical_status_precedence:
    - BLOCKED_PATH_ESCAPE_OR_MUTATION
    - BLOCKED_PR151_INCOMPLETE
    - REJECTED_NAME_ONLY
    - REJECTED_NOT_PRESENT
    - REJECTED_NOT_REGULAR_FILE
    - REJECTED_SYMLINK_OR_ALIAS
    - REJECTED_IDENTITY_MISMATCH
    - REJECTED_MISSING_RELEASE_OR_LICENSE
    - REJECTED_MISSING_SEMANTIC_CONTRACT
    - REJECTED_INCOMPLETE_COMPONENT_SET
    - ADMITTED_IDENTITY_ONLY
  reason_rule: every applicable reason is preserved but exactly one status is selected by precedence
  lane_admission_rule: only a complete machine-registry lane bundle counts as one admitted lane; admitted components or products never count as an admitted lane
  aggregate_statuses:
    - NO_ADMITTED_IDENTITIES
    - PARTIAL_LANE_ADMISSION
    - ADMITTED_IDENTITIES_AWAITING_SEPARATE_AUTHORIZATION
  aggregate_semantics:
    NO_ADMITTED_IDENTITIES: zero complete lanes admitted
    PARTIAL_LANE_ADMISSION: at least one whole lane admitted and at least one whole lane refused; authorizes nothing
    ADMITTED_IDENTITIES_AWAITING_SEPARATE_AUTHORIZATION: every registered lane is completely admitted and every execution receipt remains NOT_AUTHORIZED

execution_authorization_receipt:
  schema: common.execution_authorization_receipt.v1
  factory_only: true
  distinct_content_identity: true
  default_status: NOT_AUTHORIZED
  required_fields:
    - authorization_id
    - lane_id
    - exact_admission_record_ids
    - lane_admission_bundle_id
    - analysis_plan_id
    - required_human_gate_id
    - human_gate_receipt_id
    - human_authority_identity
    - authorized_scope
    - issued_at_utc
    - expires_at_utc
    - status
  statuses: [NOT_AUTHORIZED, AUTHORIZED, EXPIRED, REVOKED]
  state_machine:
    NOT_AUTHORIZED:
      exact_admission_record_ids: empty unless a complete lane bundle exists
      human_gate_receipt_id: null
      human_authority_identity: null
      authorized_scope: null
      issued_at_utc: null
      expires_at_utc: null
    AUTHORIZED:
      availability: forbidden_to_PR-289
      requires: complete lane bundle plus external lane-specific human gate receipt authority scope issue and expiry identities
  authorization_rule: >-
    PR-289 may define and emit NOT_AUTHORIZED receipts only. AUTHORIZED needs
    a later lane-specific human gate and cannot be inferred from admission,
    backlog state, user-wide overnight permission, or a process PASS.
  workflow_authorization_boundary: >-
    The backlog execution_authorization field is workflow-only permission to
    implement this PR. authorization_domain must equal workflow_only and is
    never a lane data-execution token.

receipt_contract:
  output_path: docs/generated/pr289_data_identity_v2_receipt.json
  pass_token: PASS_DATA_IDENTITY_V2_PREFLIGHT
  block_token: BLOCKED_DATA_IDENTITY_V2_CONTRACT
  terminal_precedence:
    - BLOCKED_CONTRACT_OR_DEPENDENCY
    - BLOCKED_PATH_ESCAPE_OR_MUTATION
    - BLOCKED_REGISTERED_MUTATION
    - PASS_DATA_IDENTITY_V2_PREFLIGHT
  required_metadata:
    - owner
    - scope
    - claim_tier
    - transfer_source
    - lane_and_product_identities
    - sky_mask_selection_covariance_null_status
    - assumptions
    - caveats
    - generating_procedure
    - git_commit_or_worktree_state
  process_success_semantics: >-
    PASS means the v2 factories, refusal paths, identity checks, and registered
    mutations executed. It does not mean any lane was admitted, authorized,
    executed, scientifically validated, or approved for public use.

mutation_registry:
  - {mutation_id: MU289-PR274-MUTATION, intended_defect: immutable v1 bytes or result are changed}
  - {mutation_id: MU289-ADMISSION-AUTH-COLLAPSE, intended_defect: admission directly produces AUTHORIZED}
  - {mutation_id: MU289-AUTH-LANE-BINDING, intended_defect: one lane receipt binds another lane admission records or bundle}
  - {mutation_id: MU289-SYMLINK, intended_defect: symlinked component is admitted}
  - {mutation_id: MU289-PARENT-SYMLINK, intended_defect: path traversing a symlinked parent is admitted}
  - {mutation_id: MU289-HARDLINK-ALIAS, intended_defect: out-of-root hard-linked alias is admitted}
  - {mutation_id: MU289-SIZE, intended_defect: byte size differs from the frozen identity}
  - {mutation_id: MU289-HASH, intended_defect: content digest differs from the frozen identity}
  - {mutation_id: MU289-INVENTORY, intended_defect: component is missing duplicated or reordered}
  - {mutation_id: MU289-RELEASE-LICENSE, intended_defect: release or license identity is absent}
  - {mutation_id: MU289-PLACEHOLDER-PROVENANCE, intended_defect: bare identity scheme one-character release or unresolved evidence is accepted}
  - {mutation_id: MU289-EVIDENCE-JSON, intended_defect: duplicate key or nonfinite evidence value is accepted}
  - {mutation_id: MU289-SEMANTIC-FIELD, intended_defect: units frame mask selection covariance null or sky support is absent}
  - {mutation_id: MU289-SEMANTIC-STATUS, intended_defect: covariance null license transfer or sky status contradicts its identity}
  - {mutation_id: MU289-RECORD-ID-STABILITY, intended_defect: local path or inspection time changes stable record_id}
  - {mutation_id: MU289-INVENTORY-ID, intended_defect: ordered component inventory cannot be independently recomputed}
  - {mutation_id: MU289-NATIVE-PROFILE-OMISSION, intended_defect: generic record IDs or strings replace a complete native profile}
  - {mutation_id: MU289-NATIVE-REGISTRY-ROLE, intended_defect: one exact native component role is renamed aliased or removed}
  - {mutation_id: MU289-PLANCK-NATIVE-RELATIONSHIP, intended_defect: SMICA and Commander collapse or lose same-sky FFP10 operator relationships}
  - {mutation_id: MU289-CF4-NATIVE-RELATIONSHIP, intended_defect: catalogue selection covariance frame sign units grouping depth or ZoA role drifts}
  - {mutation_id: MU289-HSC-KIDS-CHILD-IDENTITY, intended_defect: HSC and KiDS share a PSF n_z calibration response or covariance child}
  - {mutation_id: MU289-NATIVE-REPLAY, intended_defect: exported native record payload bypasses full profile replay}
  - {mutation_id: MU289-EXPORTED-SEMANTIC-REPLAY, intended_defect: a re-signed exported record bypasses typed evidence replay}
  - {mutation_id: MU289-REPEATED-ROLE-ORDINAL, intended_defect: a repeated native role duplicates one ordinal and omits another}
  - {mutation_id: MU289-NAME-ONLY, intended_defect: name-only HSC or KiDS input is admitted}
  - {mutation_id: MU289-DESI-PARTIAL, intended_defect: PR151 partial or aria2 part file is admitted}
  - {mutation_id: MU289-AUTODOWNLOAD, intended_defect: missing input triggers a network or download side effect}
  - {mutation_id: MU289-MUTATION-OMISSION, intended_defect: returned mutation evidence is incomplete or hardcoded}
  - {mutation_id: MU289-GATE-ID-ALIAS, intended_defect: H-HSC slash KiDS is normalized to H-HSC-KiDS}
  - {mutation_id: MU289-WORKFLOW-AUTH-LAUNDERING, intended_defect: workflow permission constructs a lane AUTHORIZED receipt}
  - {mutation_id: MU289-STATUS-PRECEDENCE, intended_defect: overlapping refusal reasons select a lower-priority canonical status}
  - {mutation_id: MU289-PARTIAL-LANE-AGGREGATE, intended_defect: one component or incomplete product counts as an admitted lane}
  - {mutation_id: MU289-CLAIM-PROMOTION, intended_defect: admission pass becomes observed native public or family evidence}

allowed_uses:
  - read-only external product identity preflight
  - explicit refusal and input-gap reporting
  - downstream human-gate preparation after identity admission
forbidden_uses:
  - automatic acquisition or clean-checkout redownload
  - Git copy symlink or partial-file admission
  - observed-data execution or scientific result
  - admission inferred as execution authorization
  - native solver validation geometry detection or Bianchi family identification
caveats:
  - PR-274 v1 remains immutable and admitted zero inputs.
  - PR-151 background acquisition remains incomplete and is forbidden input.
  - Missing roots are expected refusal outcomes rather than skipped tests.
  - A valid local identity can become stale if external bytes or semantic metadata change.
