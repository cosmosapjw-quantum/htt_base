  debt_resolution_rule: >-
    The existing PR-279 debt row becomes RESOLVED_IN_PR280 only when the
    complete PR-280 classification and receipt pass strict validation with
    active_core_count zero. A structurally valid receipt with any active-core
    failure instead becomes OPEN_ROOT_CAUSE_REQUIRED. This inventory binds the
    three exact nodes to PR-295, PR-296, and PR-297 without granting scientific
    capability; an unregistered active node fails debt generation closed.
