claim_boundary:
  artifact_mode: governance_diagnostic
  observed_data_execution: false
  admitted_data_products: 0
  theorem_or_cas_promotion: false
  native_solver_validation: false
  morphology_atlas_validation: false
  bianchi_family_identification: forbidden
  mio_posterior_or_evidence: forbidden
  external_transfer_as_native: forbidden

hard_stops:
- An active-core failure is assigned to any softer bucket or omitted.
- UNKNOWN_UNCLASSIFIED is nonzero at closeout.
- A cached or marker-only run sets smoke_tested.
- A publication or full-inventory failure is waived.
- A package resource bypasses a present mutated repository receipt.
- A missing formal axis is counted as another axis pass.
- G-CI-H is treated as authorization to mutate GitHub rulesets.
- Harness evidence promotes a scientific, native, morphology, or family claim.
- PR-280 is marked successful, or any direct science consumer can start before
  all three exact root-cause successors complete successfully.
