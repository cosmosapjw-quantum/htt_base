fresh_inventory:
  command:
  - python
  - -m
  - pytest
  - -p
  - no:cacheprovider
  - -o
  - addopts=
  - --junitxml=artifacts/full_inventory.xml
  root_addopts_cleared: true
  cache_provider_disabled: true
  junit_path: artifacts/full_inventory.xml
  junit_tracking: ephemeral_hash_bound_input
  receipt_path: docs/research_program/post_pr275/full_inventory_v4_receipt.json
  classification_path: docs/research_program/post_pr275/full_inventory_v4_classification.json
  exact_failure_buckets:
  - ACTIVE_CORE_REGRESSION
  - STALE_EXPECTATION
  - MISSING_HISTORICAL_ARTIFACT
  - LEGACY_BYTE_REPLAY_FAILURE
  - OPTIONAL_EXTERNAL_TOOL
  - DATA_NOT_ADMITTED
  - NATIVE_NOT_AVAILABLE
  - CF4_QUARANTINE
  - PUBLICATION_DEBT
  - UNKNOWN_UNCLASSIFIED
  bucket_semantics:
    ACTIVE_CORE_REGRESSION: >-
      A failure in a current supported contract or implementation path after
      its declared repository inputs and required dependencies are present.
      This bucket activates the downstream stop rule.
    STALE_EXPECTATION: >-
      A test still asserts a superseded, future-skeleton, or otherwise
      non-current expectation; it is not evidence that the current contract
      passed.
    MISSING_HISTORICAL_ARTIFACT: >-
      Exact legacy replay requires a preserved artifact that is intentionally
      absent from a clean checkout. The missing input is recorded, never
      reconstructed or silently substituted.
    LEGACY_BYTE_REPLAY_FAILURE: >-
      A legacy exact-byte or content-identity assertion changes across a
      declared interpreter/numerical environment while current semantic tests
      remain separately passing.
    OPTIONAL_EXTERNAL_TOOL: >-
      An explicitly optional executable, library, compiler, or formal engine
      is absent; only its named profile or proof grade is unavailable.
    DATA_NOT_ADMITTED: >-
      External observational or simulation data lacks a valid admission or
      execution-authorization receipt. No acquisition or observed run is
      inferred from this bucket.
    NATIVE_NOT_AVAILABLE: >-
      The external native solver or morphology atlas is unavailable. No
      surrogate or family-identification claim is permitted.
    CF4_QUARANTINE: >-
      A test correctly preserves the registered CF4 P0 quarantine or fails
      because that quarantined lane cannot be treated as an active input.
    PUBLICATION_DEBT: >-
      A current report, PDF, figure, bibliography, or publication freeze
      surface is absent or stale, without implying a scientific-core pass.
    UNKNOWN_UNCLASSIFIED: >-
      No bounded disposition is supported. This must be zero for successful
      PR-280 closeout and cannot be matched by a fallback rule.
  rules:
  - Every non-pass JUnit case receives exactly one bucket and one registered rule identity.
  - Classification uses exact node identity plus bounded failure evidence after replacing only the execution checkout root, user-home root, and pytest temporary-run root; path-only broad defaults are forbidden.
  - UNKNOWN_UNCLASSIFIED must be zero before successful closeout.
  - ACTIVE_CORE_REGRESSION must be zero before any downstream scientific PR starts.
  - Optional or native absence blocks only its named profile or proof grade.
  - A cache-free execution receipt never changes scientific status or grants a ClaimCapability.
  count_observability:
    passed_or_xpassed_case_elements: >-
      Pytest JUnit XML does not distinguish an ordinary pass from XPASS, so
      the baseline records pass-like testcase elements and never invents an
      XPASS count.
    deselected: >-
      Pytest JUnit XML does not represent deselected items. The receipt records
      this limitation instead of asserting a synthetic zero.
    subtests: >-
      Multiple non-pass subtest children are preserved with ordinal case
      identities. Passing subtests are not individually represented, so the
      suite-declared test count and extra declared subtest units remain
      separate raw counts rather than being folded into pass-like testcase
      elements.
  stop_rule: >-
    Any ACTIVE_CORE_REGRESSION stops PR-281 through PR-294. PR-280 must report
    the exact failing nodes and bind one separately registered root-cause work
    unit to each failure type; it must not hide or bulk-reclassify the failure.
  terminal_inventory_candidate:
    outcome: COMPLETED_FAILED_WITH_RECEIPT
    execution_source_commit: 315277077e27e8493342f5b219da152197bad059
    junit_sha256: df931aa1c82959767a643f7842fc007e2ab627df6216a349446ca7d0d1d3d538
    junit_counts:
      collected: 10799
      suite_declared_tests: 10815
      subtest_extra_declared_units: 16
      multi_outcome_containers: 1
      passed_or_xpassed_case_elements: 10265
      failed: 458
      errors: 0
      skipped: 71
      xfailed: 19
    exact_bucket_counts:
      ACTIVE_CORE_REGRESSION: 3
      STALE_EXPECTATION: 130
      MISSING_HISTORICAL_ARTIFACT: 152
      LEGACY_BYTE_REPLAY_FAILURE: 14
      OPTIONAL_EXTERNAL_TOOL: 50
      DATA_NOT_ADMITTED: 26
      NATIVE_NOT_AVAILABLE: 3
      CF4_QUARANTINE: 136
      PUBLICATION_DEBT: 34
      UNKNOWN_UNCLASSIFIED: 0
    unknown_count: 0
    active_core_count: 3
    success_dependency_satisfied: false
    scientific_status_after: OPEN_UNCHANGED
    exact_root_cause_bindings:
    - failure_node: htt.bass.validation.test_external_code_policy::test_no_external_code_imports_in_production
      successor_pr: PR-295
      failure_type: forbidden_external_code_import_in_production
    - failure_node: htt.bass.spectrum.test_d2_pstf_progressive_closure::test_python_pstf_closure_does_not_regress
      successor_pr: PR-296
      failure_type: python_pstf_progressive_closure_regression
    - failure_node: scripts.codex_harness.test_codex_assets::test_installer_copies_repo_scoped_assets_with_project_harness_config
      successor_pr: PR-297
      failure_type: repo_scoped_installer_transitive_context_closure
    downstream_contract: >-
      PR-280's terminal receipt may be consumed as negative evidence only.
      PR-281 through PR-286, PR-288, and PR-289 remain stopped until PR-295,
      PR-296, and PR-297 each complete successfully.

execution_receipts:
  execution_schema: common.pytest_execution_evidence.v2
  binding_schema: htt.harness_receipt_bindings.v4
  registry_path: docs/research_program/post_pr275/test_execution_receipts_v4.yaml
  consumer: common.status_snapshot
  authority_reuse: >-
    TestExecution.from_pytest_evidence, verify_pytest_selector_inputs, and
    verify_pytest_environment_inputs remain the only execution-evidence
    validators. The v4 registry binds an eligible profile and candidate git
    objects to that existing receipt; it is not a parallel execution authority.
  required_identity:
  - pr_id
  - profile_id
  - manifest_derived_profile_kind_and_smoke_eligibility
  - profile_manifest_sha256
  - common_pytest_execution_evidence_v2_content_sha256
  - TestExecution.execution_ref
  - candidate_commit
  - candidate_tree
  - waiver_id_null
  - binding_sha256
  transitive_subject_closure: >-
    The reused receipt binds selector inputs, pytest configuration, plugins,
    conftests, interpreter, and every loaded file-backed import origin. Live
    validation rehashes those inputs; the wrapper additionally resolves the
    exact candidate commit/tree from Git.
  status_rule: >-
    smoke_tested is true only when a strict receipt validator rechecks the
    registered manifest, subject bytes, exact profile, zero failures, and an
    eligible smoke execution. DAG completion, marker labels, caller fields,
    cached counts, broad-suite waivers, and publication waivers never set it.
  default_without_valid_receipt: false
  row_provenance_fields:
  - smoke_evidence_ref
  - smoke_execution_ref
  - smoke_profile_id
  - smoke_candidate_commit
  - smoke_candidate_tree
  non_smoke_profiles: >-
    exact/current/scientific/package/publication receipts remain named process
    evidence but cannot set generic smoke readiness. Data and formal profiles
    are never receipt eligible. Formal availability results cannot be combined
    or substituted for CAS_CONTRACT or the five-state CAS adjudicator.

