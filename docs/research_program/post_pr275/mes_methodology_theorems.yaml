    source_statement: >-
      Without independently supplied directional structure, every O(3)-equivariant
      map from rotational scalars to a polar/axial vector or STF2 tensor is zero.
    boundaries:
      - scalar MES anchor does not determine an axis
      - scalar MES anchor does not determine tensor components
