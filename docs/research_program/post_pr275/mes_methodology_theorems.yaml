  - id: MR-THEOREM-005
    title: Finite reverse-martingale depth-path Doob theorem
    truth_status: ESTABLISHED
    evidence_status: ANALYTIC_REVERSE_TIME_DOOB_PROOF
    replay_status: PAPER_PROOF_PENDING_OPTIONAL_LEAN
    release_status: STATISTICAL_FOUNDATION_LEMMA
    source_statement: >-
      For any finite decreasing filtration G_j and X in L2,
      P(max_j |E[X|G_j]|^2 >= lambda^2 E[X^2]) <= 1/lambda^2.
    boundaries:
      - nested sky masks are not thereby shown to be sigma fields
      - data-fitted rung estimators are not thereby conditional expectations
      - observed calibration is not thereby free
    current_receipt:
      status: BLOCKED_LEAN_REVERSE_MARTINGALE
      evidence_refs: [E-PR323-LOCAL-FORMAL-TASKS]
      claim_promotion: false
