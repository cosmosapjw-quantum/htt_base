schema: htt.pr304.admission_bound_human_authorization.spec.v3
pr_id: PR-304
title: Admission-bound external authorization contract
owner: COMMON
contributors: [HTT]
base_commit: 612c2c11ad448df9d48040fb6d0e5e459b97fe8d
dependencies: [PR-303]
capability: define_fail_closed_candidate_contract_for_external_human_authorization
claim_tier: diagnostic_only
transfer_source: none
scientific_effect: none
observed_data_executed: false
nonce_consumed: false
public_use: false
family_identification_gate: BLOCKED_PRE_NATIVE_ATLAS

scope:
  - require a root-owned launcher and Ed25519 trust root outside the candidate
  - keep every human private key, root key, and nonce store outside repository and agent access
  - bind any future receipt to an exact PR-289 LaneSpec and complete replayed LaneAdmissionDecision
  - make candidate validation objects non-authoritative cache evidence
  - inspect candidate identity and resources through absolute Git and exact commit blobs
  - bind provider code, configuration, live runtime, computed response rank, normalization evidence, and execution plan
  - block sampler start and posterior consumers until the external launcher and PR-305 terminal receipts exist

trust_model:
  algorithm: Ed25519
  trusted_launcher: /usr/local/libexec/htt-auth-launcher
  external_root_public_key: /etc/htt/trust/root_authority_ed25519.pub
  external_root_fingerprint: /etc/htt/trust/root_authority_ed25519.pub.sha256
  candidate_registry: docs/research_program/post_pr275/human_authority_registry.json
  candidate_registry_role: diagnostic_input_only
  candidate_registry_signature_template: docs/research_program/post_pr275/human_authority_registry.signature.json
  candidate_registry_signature_status: PENDING_EXTERNAL_ROOT_SIGNATURE
  candidate_can_establish_authority: false
  active_signers_in_this_pr: 0
  external_launcher_provisioned_by_this_pr: false
  private_key_location: outside_repository_and_agent_access
  private_key_handling_by_repository: forbidden
  same_process_hmac: forbidden
  candidate_self_root: forbidden

receipt_contract:
  schema: common.human_execution_authorization_receipt.v3
  python_compatibility_name: HumanExecutionAuthorizationReceiptV1
  mandatory_bindings:
    - authorization_id
    - lane_id
    - exact_admission_record_ids
    - lane_admission_bundle_id
    - analysis_plan_id
    - required_human_gate_id
    - authorized_scope
    - authorization_domain
    - model_contract_content_id
    - runtime_environment_receipt_id
    - computed_response_rank_receipt_id
    - normalization_evidence_id
    - execution_plan_content_id
    - candidate_commit
    - candidate_tree
    - issued_at_utc
    - expires_at_utc
    - nonce
    - signer_key_id
    - authorization_signature_ed25519
  signature_payload: sorted_compact_ascii_json_including_authorization_id_excluding_signature
  signer_resolution: external_launcher_only
  maximum_ttl_seconds: 1800
  accepted_interval: '[issued_at_utc, expires_at_utc)'
  evaluation_clock: external_trusted_launcher_clock_not_caller_supplied
  registered_domain: lane_data_execution
  nonce_format: 'nonce:v1:<64 lowercase hex>'
  nonce_generation: external_CSPRNG_required_not_proven_by_format
  nonce_consumption: PR305_external_launcher_transaction_only
  registered_scopes:
    PLANCK: admitted_planck_observed_execution
    CF4: admitted_cf4_observed_execution
    HSC_KIDS: admitted_hsc_kids_observed_execution
    ACT: admitted_act_observed_execution
    DESI: admitted_desi_observed_execution
    JWST_SN: admitted_jwst_sn_observed_execution

candidate_contract:
  factory: build_clean_candidate_identity
  attached_branch_required: true
  derived_from:
    - attached git branch
    - exact HEAD commit
    - exact HEAD tree
    - empty tracked and untracked status
  caller_supplied_commit_or_tree: forbidden
  git_executable: /usr/bin/git
  git_environment: scrubbed_minimal
  git_alias_hook_and_replace_object_influence: disabled
  resource_resolution:
    - PR-289 lane registry from exact candidate commit blob
    - candidate authority metadata from exact candidate commit blob
    - provider manifest, code, dependencies, configuration, environment, response, normalization, and plan from exact candidate commit blobs
  worktree_check_then_read_for_authority: forbidden
  python_installation_relative_registry_lookup: forbidden
  immutable_detached_replay: deferred_to_external_launcher

production_model_binding:
  schema: htt.production_bayesian_contract.v3
  raw_callable_input: forbidden
  provider_loader: nonexecuting_exact_candidate_git_blob_validator
  candidate_code_execution_in_validation_process: forbidden
  provider_execution: external_launcher_OS_isolation_only
  mandatory_bindings:
    - lane_admission_bundle_id
    - ordered_admission_record_ids
    - admitted_data_identity
    - admitted_covariance_identity
    - candidate_commit
    - candidate_tree
    - provider_manifest_binding
    - provider_source_and_dependency_bindings
    - provider_code_fingerprints
    - provider_configuration_binding
    - provider_environment_binding
    - runtime_environment_receipt_id
    - computed_response_rank_receipt_id
    - normalization_evidence_id
    - execution_plan_content_id
  runtime_receipt:
    - exact Python executable path and content identity
    - Python implementation and version
    - platform system and machine
    - registered package versions
    - NumPy native extension content identity
  response_rank: computed_from_exact_response_matrix_with_registered_threshold
  normalization: exact_evidence_blob_bound_to_likelihood_and_prior_identities
  execution_plan:
    - exact entrypoint and argv
    - output root and run mode
    - provider manifest identity
    - runtime environment receipt identity
  authority_use_rule: rebuild_and_compare_all_bindings_from_exact_candidate_blobs

readiness_states:
  registered_for_forward_compatibility:
    - BLOCKED_PRODUCTION_MODEL_CONTRACT_UNBOUND
    - BLOCKED_HUMAN_AUTHORIZATION
    - READY_TO_START_SAMPLER
    - BLOCKED_SAMPLER_TERMINAL
    - READY_FOR_POSTERIOR_CONSUMERS
  PR304_emittable:
    - BLOCKED_PRODUCTION_MODEL_CONTRACT_UNBOUND
    - BLOCKED_HUMAN_AUTHORIZATION
    - BLOCKED_SAMPLER_TERMINAL
  PR304_forbidden:
    - READY_TO_START_SAMPLER
    - READY_FOR_POSTERIOR_CONSUMERS
  posterior_input_rule: >-
    Any posterior lineage or consumer plan remains BLOCKED_SAMPLER_TERMINAL
    because PR-305 observed-run and sampler-terminal receipt types do not yet
    exist.
  legacy_wire_status: BLOCKED_PRODUCTION_MODEL_CONTRACT_UNBOUND

pr305_requirements:
  - externally provision and review the root-owned trusted launcher
  - verify a detached root signature over the authority registry and candidate identity
  - reverify signed authorization bytes immediately before transaction authority use
  - replay exact admission and all model/runtime/plan bindings
  - acquire the output lock before nonce consumption
  - consume a canonical nonce atomically only immediately before the start receipt
  - write and fsync start and terminal receipts
  - define observed-run and sampler-terminal identities before posterior readiness can exist

required_terminal:
  terminal: PASS_AUTHORIZATION_CONTRACT_ONLY
  admitted_lane_count: 0
  authorized_lane_count: 0
  executed_lane_count: 0
  active_authority_count: 0
  observed_data_executed: false
  nonce_consumed: false

forbidden:
  - minting or storing a real authorization receipt, root key, or human private key
  - caller-selected trust-anchor or Git paths
  - candidate-local registry activation as authority
  - mutating or subclassing PR-289 ExecutionAuthorizationReceipt into AUTHORIZED
  - nonce consumption
  - observed payload access, data admission, canary, lane execution, or scientific result
  - status-string authorization
  - legacy PR-151 numerical result or withdrawn DESI artifact
  - starting PR-305
  - default-branch merge

anti_inflation:
  max_new_production_modules: 1
  max_new_test_modules: 1
  max_new_runners: 0
  no_new_global_ledger: true
  external_contract_documents: 2
  downstream_consumer: PR-305 observed execution transaction
