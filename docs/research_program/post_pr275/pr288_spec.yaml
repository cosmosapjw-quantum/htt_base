schema: htt.pr288.bayesian_semantics_repair.spec.v1
pr_id: PR-288
title: Bayesian semantics, evidence, PPC, and LOOCV repair
owner: HTT
contributors: [COMMON]
change_set_id: CS-PR288-BAYES-SEMANTICS
publication_group_id: PG-PR288-BAYES-SEMANTICS

dependencies: [PR-280]
dependency_contract:
  upstream_id: PR-280
  mode: requires_terminal_receipt
  accepted_terminal: COMPLETED_FAILED_WITH_RECEIPT
  success_dependency_required: false
  rule: >-
    PR-280's preserved failed scientific regressions remain visible. Its
    terminal receipt authorizes a bounded synthetic repair attempt only; it
    does not turn the failed aggregate into scientific success.

capability: independently_cross_checked_model_dependent_bayesian_inference
scope: preregistered synthetic and analytic Bayesian-method diagnostics
claim_tier: diagnostic_only
claim_level: {scheme: roadmap_rescue_v1, level: C2}
scientific_artifact_mode: synthetic_diagnostic
transfer_source: none
observed_data_executed: false
public_use: false
family_identification_gate: BLOCKED_PRE_NATIVE_ATLAS
scientific_status_effect: OPEN_UNCHANGED

engine_contract:
  model_owner: HTT
  required_engines:
    - engine_id: DYNESTY_NESTED
      algorithm_class: nested_sampling
      optional_dependency: dynesty
      absence_status: BLOCKED_REQUIRED_ENGINE_UNAVAILABLE
      version_floor: 3.0.0
      nlive: 384
      dlogz: 0.01
      sample: rwalk
      bound: multi
      fixture_seeds:
        PR288-NORMAL-MEAN-ANALYTIC: 288101
        PR288-NULL-EQUAL-MODELS-A: 288102
        PR288-NULL-EQUAL-MODELS-B: 288103
        PR288-REGISTERED-CORRELATED-NUISANCE: 288104
        PR288-MISSPECIFIED-NEGATIVE-CONTROL: 288105
    - engine_id: SCIPY_SOBOL_QMC
      algorithm_class: randomized_scrambled_quasi_monte_carlo
      implementation: scipy.stats.qmc.Sobol
      independent_randomizations_required: true
      scramble: true
      scramble_count: 8
      power_m: 14
      points_per_scramble: 16384
      scramble_seeds_by_fixture:
        PR288-NORMAL-MEAN-ANALYTIC: [288001, 288002, 288003, 288004, 288005, 288006, 288007, 288008]
        PR288-NULL-EQUAL-MODELS-A: [288011, 288012, 288013, 288014, 288015, 288016, 288017, 288018]
        PR288-NULL-EQUAL-MODELS-B: [288021, 288022, 288023, 288024, 288025, 288026, 288027, 288028]
        PR288-REGISTERED-CORRELATED-NUISANCE: [288031, 288032, 288033, 288034, 288035, 288036, 288037, 288038]
        PR288-MISSPECIFIED-NEGATIVE-CONTROL: [288041, 288042, 288043, 288044, 288045, 288046, 288047, 288048]
      aggregation_space: linear_evidence
      uncertainty_formula: sample_sd_of_independent_linear_evidence_estimates_divided_by_sqrt_8
      log_uncertainty_delta_method: standard_error_linear_evidence_divided_by_mean_linear_evidence
  no_shared_estimate_rule: >-
    Engines may share only the frozen likelihood, prior transform, parameter
    domain, and fixture bytes. They must not share samples, quadrature nodes,
    estimated evidence, uncertainty, stopping decisions, or cached results.
  required_outputs_per_engine:
    - log_evidence
    - declared_standard_uncertainty
    - effective_or_live_sample_count
    - termination_status
    - engine_version
    - seed_or_scramble_identity
    - likelihood_call_count
  combined_uncertainty_rule:
    metric: absolute_log_evidence_difference
    threshold: k_sigma_times_quadrature_sum
    k_sigma: 3
    deterministic_floor: 0.02
    formula: >-
      abs(logZ_dynesty-logZ_sobol) <=
      max(0.02, 3*sqrt(sigma_dynesty^2+sigma_sobol^2))
    frozen_before_execution: true
    forbidden: [post_result_tolerance_change, single_engine_substitution]
  analytic_accuracy_rule:
    formula: abs(logZ_engine-logZ_closed_form) <= max(0.05, 3*declared_standard_uncertainty)
    deterministic_floor: 0.05
  engine_independence_identities:
    - likelihood_and_prior_contract_content_id
    - engine_algorithm_and_version
    - seed_or_scramble_inventory_content_id
    - sample_or_node_inventory_content_id
    - independent_estimate_content_id

evidence_fixtures:
  - fixture_id: PR288-NORMAL-MEAN-ANALYTIC
    kind: analytic_normal_mean_with_normal_prior
    dimensions: 1
    role: analytic_accuracy_and_uncertainty_calibration
    expected_identity: closed_form_log_evidence_from_frozen_parameters
    units: dimensionless_registered_synthetic
    base_measure: Lebesgue_parameter_and_observation_measure
    observations: [-0.4, 0.1, 0.6]
    likelihood:
      family: independent_normal
      parameter: scalar_mean
      known_sigma: 0.75
      normalized_density: true
    prior:
      family: normal
      mean: 0.0
      sigma: 1.25
      normalized_density: true
      transform: scipy_stats_norm_ppf
    analytic_rule: observations_marginal_normal_with_covariance_sigma2_I_plus_tau2_11T
  - fixture_id: PR288-NULL-EQUAL-MODELS
    kind: identical_likelihood_and_prior_pair
    dimensions: 2
    role: degenerate_null_and_false_preference_control
    required_result: log_bayes_factor_compatible_with_zero
    units: dimensionless_registered_synthetic
    base_measure: Lebesgue_parameter_and_observation_measure
    observations: [0.25, -0.15]
    likelihood:
      family: independent_normal
      known_sigma_by_coordinate: [0.8, 1.1]
      normalized_density: true
    prior:
      family: independent_standard_normal
      normalized_density: true
      transform: scipy_stats_norm_ppf
    model_copy_ids: [PR288-NULL-EQUAL-MODELS-A, PR288-NULL-EQUAL-MODELS-B]
    independent_engine_runs_required: true
    null_compatibility_rule: abs(log_bayes_factor) <= max(0.02, 3*sqrt(sigma_A2+sigma_B2))
  - fixture_id: PR288-REGISTERED-CORRELATED-NUISANCE
    kind: synthetic_correlated_signal_and_nuisance
    dimensions: 3
    role: engine_agreement_and_foldwise_nuisance_refit
    units: dimensionless_registered_synthetic
    base_measure: Lebesgue_parameter_and_observation_measure
    observations: [0.35, -0.2, 0.15, 0.5]
    design_matrix:
      - [1.0, 0.2, 0.0]
      - [1.0, -0.3, 0.4]
      - [1.0, 0.5, -0.2]
      - [1.0, -0.1, 0.6]
    covariance:
      - [0.64, 0.12, 0.05, 0.0]
      - [0.12, 0.81, 0.09, 0.03]
      - [0.05, 0.09, 0.49, 0.08]
      - [0.0, 0.03, 0.08, 0.72]
    prior_mean: [0.0, 0.0, 0.0]
    prior_covariance:
      - [1.0, 0.0, 0.0]
      - [0.0, 0.64, 0.0]
      - [0.0, 0.0, 0.49]
    normalized_likelihood_and_prior: true
    covariance_required_rank: 4
    design_required_rank: 3
    fold_ids: [CHANNEL-1, CHANNEL-2, CHANNEL-3, CHANNEL-4]
    nuisance_parameter_indices: [1, 2]
    fold_refit_method: exact_conjugate_gaussian_posterior
  - fixture_id: PR288-MISSPECIFIED-NEGATIVE-CONTROL
    kind: synthetic_covariance_misspecification
    dimensions: 3
    role: required_failure_visibility
    generator_fixture: PR288-REGISTERED-CORRELATED-NUISANCE
    analysis_covariance: diagonal_of_registered_generator_covariance
    generator_covariance_content_identity_required: true
    analysis_covariance_content_identity_required: true
    covariance_identities_must_differ: true
    required_covariance_rank: 4
    required_design_rank: 3
    expected_terminal: MISSPECIFIED_NEGATIVE_CONTROL_VISIBLE
    analytic_log_evidence_shift_minimum: 0.05
    analytic_shift_definition: abs(logZ_generator_covariance-logZ_diagonal_analysis_covariance)

posterior_predictive_contract:
  input: weighted posterior parameter draws and frozen replicate generator
  required_draw_identity:
    - posterior_sample_content_sha256
    - normalized_weight_content_sha256
    - replicate_seed_commitment
    - model_and_likelihood_identity
    - discrepancy_statistic_identity
  computation:
    - resample or weight posterior draws according to registered normalized weights
    - generate one registered replicated dataset per posterior draw
    - evaluate the same frozen discrepancy on observed and replicated data
    - derive posterior_predictive_pvalue from comparison indicators
    - derive predictive summaries from the replicated ensemble
  minimum_draws: 256
  registered_draw_count: 512
  fixture_id: PR288-REGISTERED-CORRELATED-NUISANCE
  posterior_draw_seed: 288201
  replicate_seed: 288202
  replicate_generator: normalized_multivariate_gaussian_from_registered_design_and_covariance
  discrepancy_statistic: registered_whitened_quadratic_residual
  equality_rule: replicated_discrepancy_greater_or_equal_observed_counts_in_tail
  forbidden_inputs:
    - caller_supplied_pvalue
    - caller_supplied_predicted_summary_without_draws
    - plug_in_posterior_mean_residual
    - observed_data_or_pr151_partial_acquisition

loocv_contract:
  fold_unit: preregistered channel_or_probe
  minimum_folds: 3
  registered_fold_order: [CHANNEL-1, CHANNEL-2, CHANNEL-3, CHANNEL-4]
  fixture_id: PR288-REGISTERED-CORRELATED-NUISANCE
  posterior_draws_per_fold: 512
  fold_draw_seeds: [288301, 288302, 288303, 288304]
  nuisance_parameter_indices: [1, 2]
  fold_refit_method: exact_conjugate_gaussian_posterior
  correlated_holdout_rule: conditional_gaussian_density_given_training_channels_and_fold_posterior_draw
  held_out_density: normalized_univariate_gaussian_integrated_over_fold_posterior
  required_per_fold:
    - held_out_id
    - training_input_identity
    - held_out_input_identity
    - nuisance_refit_identity
    - posterior_draw_identity
    - integrated_held_out_log_predictive_density
    - fit_status
  computation:
    - remove exactly one registered fold
    - refit all fold-dependent nuisance and model parameters on training data
    - integrate held-out log predictive density over the fold posterior draws
    - aggregate only after every registered fold has a unique result
  forbidden:
    - full_data_posterior_reuse
    - fixed_full_data_nuisance_values
    - caller_supplied_fold_log_evidence_without_refit_receipt
    - missing_duplicate_reordered_or_unregistered_fold

legacy_disposition:
  legacy_fields: [ln_B, beta, F_Bayes, Qbar, Pi_HTT, chapter_tables]
  status: LEGACY_REPRODUCTION_ONLY
  promotion_precondition: >-
    A PR-288 process pass may create new synthetic method evidence, but legacy
    numerical values remain legacy-only until separately regenerated from
    admitted inputs under an authorized downstream observed-data PR.
  forbidden_roles: [engine_anchor, tolerance_anchor, posterior_draw, fold_result, observed_claim]

receipt_contract:
  output_path: docs/generated/pr288_bayesian_semantics_receipt.json
  pass_token: PASS_BAYESIAN_SEMANTICS_REPAIR
  block_token: BLOCKED_BAYESIAN_SEMANTICS_REPAIR
  terminal_precedence:
    - BLOCKED_DEPENDENCY_OR_ENGINE
    - BLOCKED_EVIDENCE_CROSSCHECK
    - BLOCKED_PPC_OR_LOOCV_CONTRACT
    - BLOCKED_REGISTERED_MUTATION
    - PASS_BAYESIAN_SEMANTICS_REPAIR
  required_metadata:
    - owner
    - scope
    - claim_tier
    - transfer_source
    - fixture_and_config_identities
    - posterior_draw_and_fold_identities
    - covariance_and_null_status
    - assumptions
    - caveats
    - generating_procedure
    - git_commit_or_worktree_state
    - claim_level
    - scientific_artifact_mode
    - observed_data_executed
    - public_use
    - family_identification_gate
    - scientific_status_effect
    - allowed_uses
    - forbidden_uses
    - legacy_disposition
    - engine_versions_and_seed_inventories
    - analytic_accuracy_and_null_status
    - negative_control_status
  source_bindings_required:
    - docs/research_program/post_pr275/pr288_spec.yaml
    - docs/research_program/post_pr275/pr288_publication_policy.json
    - htt/htt/htt/infer/bayesian_semantics.py
    - scripts/codex_harness/run_pr288_bayesian_semantics.py
    - tests/htt/test_bayesian_semantics_repair.py
    - docs/PR_DELTAS/pr-280.md
    - docs/research_program/post_pr275/full_inventory_v4_receipt.json
  content_id_algorithm: sha256_of_canonical_json_excluding_own_content_id
  process_success_semantics: >-
    PASS means the registered analytic/synthetic cross-check, posterior-draw
    PPC, fold-wise-refit LOOCV, and mutations executed as specified. It is not
    observed evidence, native validation, a geometry result, or family
    identification.

mutation_registry:
  - {mutation_id: MU288-SINGLE-ENGINE, intended_defect: one evidence engine is omitted or substituted}
  - {mutation_id: MU288-SHARED-SAMPLES, intended_defect: dynesty and Sobol reuse samples or estimates}
  - {mutation_id: MU288-POSTHOC-TOLERANCE, intended_defect: combined uncertainty threshold changes after results}
  - {mutation_id: MU288-DEGENERATE-NULL-PREFERENCE, intended_defect: identical models yield a directional Bayes preference}
  - {mutation_id: MU288-SOBOL-UNCERTAINTY, intended_defect: one scramble is reported as uncertainty-calibrated}
  - {mutation_id: MU288-PPC-CALLER-PVALUE, intended_defect: caller scalar pvalue bypasses posterior draws}
  - {mutation_id: MU288-PPC-PLUGIN, intended_defect: posterior mean residual replaces replicated draws}
  - {mutation_id: MU288-PPC-DRAW-IDENTITY, intended_defect: posterior draw or weight identity drifts}
  - {mutation_id: MU288-LOOCV-FULL-POSTERIOR, intended_defect: fold reuses the full-data posterior}
  - {mutation_id: MU288-LOOCV-FIXED-NUISANCE, intended_defect: nuisance values are not refit within a fold}
  - {mutation_id: MU288-LOOCV-FOLD-INVENTORY, intended_defect: fold is missing duplicated reordered or unregistered}
  - {mutation_id: MU288-NEGATIVE-CONTROL-HIDDEN, intended_defect: covariance misspecification failure is suppressed}
  - {mutation_id: MU288-LEGACY-ANCHOR, intended_defect: a legacy value seeds or validates current inference}
  - {mutation_id: MU288-MUTATION-OMISSION, intended_defect: returned mutation evidence is incomplete or inconsistent}
  - {mutation_id: MU288-CLAIM-PROMOTION, intended_defect: synthetic process pass becomes observed native or family evidence}

allowed_uses:
  - analytic and synthetic model-dependent Bayesian method diagnostics
  - bounded engine-agreement and uncertainty-calibration evidence
  - posterior-draw PPC and fold-wise nuisance-refit LOOCV receipts
forbidden_uses:
  - observed-data evidence or PR-151 partial-data use
  - legacy number reuse as current evidence
  - MIO posterior or MIO evidence
  - native solver validation geometry detection or Bianchi family identification
caveats:
  - Dynesty is an optional dependency but is mandatory for the registered two-engine terminal pass.
  - Sobol randomization uncertainty is conditional on the frozen scramble ensemble and power-of-two sample counts.
  - Analytic and synthetic method success does not authorize observed-data inference.
  - PR-280 remains a completed failed receipt and is not relabeled successful.
