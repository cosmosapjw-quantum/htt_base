  exact_family_rows: 28
  exact_dual_axis_rows: 62
  exact_dual_axis_terminal_receipt_crosswalks: 0
  required_disposition: >-
    Each of the 62 dual-axis rows must receive an individual INCONCLUSIVE
    disposition. This is a preserved negative result, not permission to infer
    a family or receipt from semantic similarity.

family_partition:
  eligible_source_status: PROMOTABLE_ON_SINGLE_INDEPENDENCE_ADJUDICATION
  eligible_count: 20
  event_gated_count: 8
  event_gated:
    D-DESI: data_acquisition_pr151
    D-TEFF: native_solver
    II-NATIVE: native_solver
    T-SHARP: native_solver
    M-ESTCOV: genuinely_incomplete
    M-PARTIALID: genuinely_incomplete
    T-KE: genuinely_incomplete
    M-DUALAXIS: process_only_no_literature_axis
  rule: >-
    The partition is derived from the exact family unlock ledger. No reviewer,
    runner, or caller may move an event-gated family into the eligible set.

review_units:
  family_lanes:
    count: 28
    independently_reviewable_candidates: 20
    required_source_binding:
    - exact family-ledger row
    - every named PR card
    - existing terminal PR delta or terminal execution receipt
    - non-author registered result envelope
  dual_axis_rows:
    count: 62
    required_source_binding:
    - exact dual-axis row
    - exact v10 source row
    - explicit terminal-receipt crosswalk
    rule: >-
      Semantic similarity must not invent a family or receipt crosswalk. A row
      without an exact registered crosswalk receives INCONCLUSIVE, never a
      family-level GRANT copied in bulk.

verdict_contract:
  vocabulary:
  - GRANT
  - HOLD
  - DOWNGRADE
  - INCONCLUSIVE
  required_fields:
  - unit_id
  - unit_kind
  - verdict
  - evidence_fingerprint
  - evidence_refs
  - reviewer_assignment_id
  - dissent
  - claim_ceiling
  - source_ledger_sha256
  - capability_effect
  semantics:
    GRANT: >-
      The non-author panel accepts this exact lane evidence for consumption by
      the later PR-157 aggregator. This is not ClaimCapability.GRANT and does
      not change readiness, public use, or scientific status by itself.
    HOLD: Evidence is present but a named existing gate remains unresolved.
    DOWNGRADE: Exact evidence supports a lower ceiling than the source row.
    INCONCLUSIVE: Receipt, identity, crosswalk, or reviewer agreement is insufficient.
  invariant_capability_effect: NONE_PENDING_PR157
  invariant_public_use: false
  invariant_claim_ceiling: diagnostic_only

independence_contract:
  reviewer_must_not_be_author: true
  author_self_approval: forbidden
  registered_assignment_required: true
  unique_result_path_required: true
  bulk_verdict: forbidden
  per_unit_evidence_fingerprint: required
  dissent_field: required_even_when_empty
  conflict_resolution: HOLD_OR_INCONCLUSIVE_NO_MAJORITY_VOTE

fixed_non_promotion_rules:
  cf4_p0_rescue_count: 0
  cf4_p0_status: OPEN
  final_aggregator: PR-157
  family_status_changes: forbidden
  dual_axis_readiness_changes: forbidden
  publication_use_changes: forbidden
  capability_issuance: forbidden

hard_stops:
- Any adjudicator is an author of a reviewed lane.
- A source row or terminal receipt is missing or has drifted identity.
- A family verdict is copied to multiple dual-axis rows without exact crosswalks.
- Any event-gated family is treated as eligible before its named event.
- CF4 P0 rescue count becomes nonzero.
- A lane verdict is represented as a ClaimCapabilityDecision or public-use grant.
- Family identification, native status, MIO posterior, or bulk promotion is asserted.
