schema: htt.pr284.depth_path_doob_spec.v1
pr_id: PR-284
title: Premise-bound depth-path reverse-martingale and Doob calibration
owner: HTT
contributors:
  - OBSSTAT
  - MIO
  - COMMON
change_set_id: CS-PR284-DEPTH-DOOB
publication_group_id: PG-PR284-DEPTH-DOOB
dependencies:
  - PR-280
dependency_contract:
  upstream_id: PR-280
  mode: requires_terminal_receipt
claim_tier: diagnostic_only
claim_level:
  scheme: roadmap_rescue_v1
  level: C2
scientific_artifact_mode: synthetic_diagnostic
transfer_source: none
observed_data_executed: false
public_use: false
family_identification_gate: BLOCKED_PRE_NATIVE_ATLAS

gate:
  gate_id: G6
  statement: Reverse-martingale calibration has a proved premise or matched-mock fallback.
  pass_token: PASS_PREMISE_BOUND_DEPTH_PATH_CALIBRATION
  block_token: BLOCKED_DEPTH_PATH_CALIBRATION_CONTRACT
  derivation_rule: >-
    A Doob bound is emitted only after replaying an exact finite registered
    probability law, one centered square-integrable target, a decreasing
    filtration aligned with the exact DepthPath, and the conditional-
    expectation tower identity. Support nesting alone never proves the premise.
    An unproved premise returns no bound and requires a pre-registered matched-
    mock plan.

mathematical_boundary:
  source_oracle_id: TF-11-MASK-PATH-MARTINGALE
  source_registry: docs/research_program/vector_tensor/proof_registry_two_pillars.yaml
  source_registry_status: ORACLE_VERIFIED
  typed_proof_artifact: docs/research_program/vector_tensor/proofs/PILLAR_S_CORE_PROOFS_V1.yaml
  typed_proof_verdict: PROVED_FINITE_REGISTERED_PATH
  source_proof_adjudication_status: NOT_ADJUDICATED
  relation_to_source: FINITE_REGISTERED_PATH_ONLY
  pr284_effect: runtime_execution_without_general_theorem_promotion
  boundary: >-
    The finite registered tower is exact only for the supplied atomic law and
    partitions. It is not a convergence theorem, optional-stopping theorem,
    observed-sky calibration, or proof that nested supports themselves induce
    the required sigma fields.

reverse_martingale_premise:
  required_for_bound:
    - exact DepthPath content identity with strictly nested sky supports
    - one finite atomic probability law with positive exact rational weights
    - one exact rational common target for every rung
    - exact zero mean under the registered law
    - finite positive second moment
    - one preprocessing identity shared by every rung
    - one estimator identity shared by every rung
    - explicit sigma-field partition per path rung
    - partitions decrease along depth-path order
    - exact conditional-expectation tower replay
    - exact target, law, filtration, and premise evidence identities
    - finite-target-law content identity binding atom ids, weights, and target
    - selected_atom_id and preregistered selection-rule content identity
    - threshold-contract content identity
    - exact path-maximum content identity derived from conditional expectations
  forbidden_substitutes:
    - support nesting without explicit partitions
    - independent rung refits
    - rung-specific target or preprocessing
    - rung-specific renormalization
    - caller-supplied proved boolean
    - source ORACLE_VERIFIED label without finite-law replay
  status_ladder:
    proved: PROVED_FINITE_REGISTERED_PATH
    unproved: UNPROVED_REQUIRES_MATCHED_MOCKS

filtration_contract:
  path_order: increasing_depth_and_decreasing_information
  sigma_field_order: DECREASING
  partition_rule: >-
    Each next path-order partition is a coarsening of the preceding partition.
    Reversed partitions are passed to the exact finite-tower verifier, which
    requires each next partition to refine the preceding one.
  path_binding:
    - path_content_id
    - ordered stratum content ids
    - ordered support ids and mask hashes through the path identity
    - ordered sigma_field_ids
    - filtration_content_id
  non_nested_path: fail_closed_before_report
  mismatched_sky_support: fail_closed_before_report

doob_contract:
  process: centered scalar reverse martingale on one finite registered path
  threshold: lambda_times_sqrt_registered_target_second_moment
  threshold_multiplier: positive exact rational frozen before path inspection
  exact_threshold_representation: lambda_squared_times_E_target_squared
  event_rule: >-
    Compare exact rational squares as max_j_abs_M_j_squared greater than or
    equal to lambda_squared times E_target_squared. Equality is included and
    no floating square root or numerical tolerance is authorized.
  conservative_bound: min(1, 1 / lambda_squared)
  normalization: registered E_target_squared from the common finite target
  path_maximum: >-
    For the preregistered selected atom, max absolute exact conditional
    expectation over the registered path; this diagnostic is sealed separately
    from the law-level probability bound.
  allowed_when: premise_status_is_PROVED_FINITE_REGISTERED_PATH
  forbidden_when: premise_unproved_or_any_identity_drifted
  interpretation: conservative conditional finite-path upper bound only

matched_mock_fallback:
  trigger: any reverse-martingale premise remains unproved
  required_bindings:
    - matched_mock_plan_id
    - matched_mock_plan_content_id
    - plan_registration_id proving pre-result registration
    - exact path_content_id
    - mask and sky-support identities through the path
    - estimator_id
    - preprocessing_id
    - threshold_contract_id
    - stated unresolved premise reasons
    - null_law_id and mock_generator_id
    - ensemble_policy_id and seed_policy_id
    - matching_variable_ids
    - acceptance_rule_id and multiplicity_rule_id
  output_status: MATCHED_MOCKS_REQUIRED
  forbidden_outputs:
    - doob_probability_bound
    - free_calibration
    - observed_significance
    - mock_pass_without_executed_matched_mocks

runtime_contract:
  common_module: htt/src/common/depth_path_calibration.py
  htt_projection: htt/htt/htt/infer/depth_path_calibration.py
  historical_depth_path_dependency: >-
    htt/src/common/depth_path.py remains byte-identical because the PR-271
    proof registry freezes it; the new module composes its public DepthPath
    contract without mutating that historical source.
  public_types:
    - DepthPathFiniteTargetLaw
    - DepthPathSelectionContract
    - DepthPathThresholdContract
    - DepthPathMatchedMockPlan
    - DepthPathReverseMartingaleReport
    - DepthPathDoobCalibration
    - ReverseMartingalePremiseStatus
    - DepthPathCalibrationStatus
  proved_factory: build_depth_path_reverse_martingale_report
  fallback_factory: build_unproved_depth_path_reverse_martingale_report
  calibration_factory: build_depth_path_doob_calibration
  finite_law_factory: build_depth_path_finite_target_law
  selection_factory: build_depth_path_selection_contract
  matched_mock_plan_factory: build_depth_path_matched_mock_plan
  ownership:
    COMMON: immutable path, filtration, report, and calibration contracts
    OBSSTAT: estimator and mask-feature inputs only
    MIO: diagnostic path-consistency consumers only
    HTT: premise evaluation and calibration decision

synthetic_fixtures:
  sky_status: synthetic_nested_support_only
  covariance_status: not_used_by_exact_finite_tower
  null_mock_status: not_used_for_proved_finite_fixture
  proved_case:
    fixture_id: pr284.finite-centered-tower.v1
    atom_count: 4
    exact_weights: [1/4, 1/4, 1/4, 1/4]
    exact_common_target: [-3, -1, 1, 3]
    path_partition_direction: fine_to_coarse
    expected_status: BOUND_AVAILABLE_CONDITIONAL_PROVED_PREMISE
    expected_second_moment: 5
  unproved_case:
    fixture_id: pr284.support-nesting-only.v1
    missing_premise: explicit_conditional_expectation_partitions
    expected_status: MATCHED_MOCKS_REQUIRED
    expected_probability_bound: null

mutation_registry:
  - mutation_id: MU284-SUPPORT-NESTING-AS-PROOF
    mutation_kind: nested_support_substituted_for_partition_tower
    intended_defect: a free bound is emitted without an explicit filtration
    expected_kill: proved factory refuses absent finite-law evidence
  - mutation_id: MU284-NONNESTED-SUPPORT
    mutation_kind: one path support is not a subset of its predecessor
    intended_defect: incompatible masks enter one path
    expected_kill: DepthPath construction fails closed
  - mutation_id: MU284-TARGET-DRIFT
    mutation_kind: one common-target value changes after report sealing
    intended_defect: rung expectations no longer share the sealed target
    expected_kill: report replay rejects target identity drift
  - mutation_id: MU284-REPORT-BUILDER-BYPASS
    mutation_kind: caller_supplied_proved_report_bypasses_replay
    intended_defect: an importable internal builder mints a proved report from caller-supplied premises
    expected_kill: common report construction independently replays centering, tower, path values, second moment, and identities
  - mutation_id: MU284-PREPROCESSING-DRIFT
    mutation_kind: preprocessing identity differs across rungs or calibration
    intended_defect: independently normalized rungs receive a free bound
    expected_kill: report or calibration binding fails
  - mutation_id: MU284-FILTRATION-DIRECTION-DRIFT
    mutation_kind: non-coarsening partition is inserted
    intended_defect: path is not a decreasing filtration
    expected_kill: exact refinement replay fails
  - mutation_id: MU284-THRESHOLD-DRIFT
    mutation_kind: threshold changes after report construction
    intended_defect: inspected path chooses its own calibration threshold
    expected_kill: threshold contract identity mismatch blocks calibration
  - mutation_id: MU284-ATOM-SELECTION-DRIFT
    mutation_kind: selected atom or selection rule changes after registration
    intended_defect: the displayed maximum is chosen after path inspection
    expected_kill: selection content identity mismatch blocks report replay
  - mutation_id: MU284-PATH-MAXIMUM-DRIFT
    mutation_kind: sealed path maximum is changed without expectation replay
    intended_defect: displayed diagnostic disagrees with exact conditionals
    expected_kill: report identity validation fails
  - mutation_id: MU284-PROBABILITY-LAW-DRIFT
    mutation_kind: one exact weight changes under a stale finite-law identity
    intended_defect: centering, second moment, and conditionals use a different law
    expected_kill: finite-target-law identity validation fails
  - mutation_id: MU284-ESTIMATOR-IDENTITY-DRIFT
    mutation_kind: estimator identity changes at calibration
    intended_defect: independently refitted rungs inherit a stale premise
    expected_kill: report-to-calibration estimator binding fails
  - mutation_id: MU284-FREE-BOUND-ON-UNPROVED
    mutation_kind: unproved report is relabelled bound_available
    intended_defect: matched mocks are bypassed
    expected_kill: calibration constructor forbids a bound and requires the plan
  - mutation_id: MU284-MATCHED-MOCK-PLAN-OMITTED
    mutation_kind: unproved premise carries no resolvable fallback identity
    intended_defect: fallback is merely prose
    expected_kill: unproved report construction fails
  - mutation_id: MU284-MATCHED-MOCK-PLAN-DRIFT
    mutation_kind: null law, generator, seed policy, or acceptance rule changes
    intended_defect: a post-result mock design reuses the registered plan label
    expected_kill: matched-mock-plan content identity validation fails

receipt_contract:
  output_path: docs/generated/pr284_depth_path_doob_receipt.json
  content_address: sha256_of_canonical_json_excluding_receipt_content_sha256
  binding_scope: >-
    Bind the depth-path implementation modules and replay contracts directly.
    The growing htt.infer package export surface is checked by an API identity
    smoke test but is not whole-file content-bound into this claim-bearing
    receipt, so unrelated successor exports cannot invalidate PR-284 replay.
  required_bindings:
    - docs/research_program/post_pr275/pr284_spec.yaml
    - htt/src/common/depth_path.py
    - htt/src/common/depth_path_calibration.py
    - htt/src/common/vector_tensor_statistical_foundations.py
    - htt/htt/htt/infer/depth_path.py
    - htt/htt/htt/infer/depth_path_calibration.py
    - docs/research_program/vector_tensor/proof_registry_two_pillars.yaml
    - docs/research_program/vector_tensor/proofs/PILLAR_S_CORE_PROOFS_V1.yaml
    - scripts/codex_harness/run_pr284_depth_path_doob.py
    - tests/contracts/test_depth_path.py
    - tests/contracts/test_depth_path_doob_calibration.py
    - tests/contracts/test_pillar_s_core.py
  terminal_precedence:
    - BLOCKED_CONTRACT_INVALID
    - BLOCKED_DEPTH_PATH_CALIBRATION_CONTRACT
    - PASS_PREMISE_BOUND_DEPTH_PATH_CALIBRATION
  mutation_rule: >-
    Every registered mutation must execute and be killed. Missing, skipped,
    duplicated, reordered, unmapped, inconsistently flagged, or surviving
    mutation results block G6.
  required_metadata:
    - owner
    - scope
    - claim_tier_and_level
    - transfer_source
    - synthetic_sky_mask_and_covariance_status
    - null_mock_status
    - assumptions
    - caveats
    - generating_command_or_procedure
    - exact_source_bindings
    - git_commit_or_worktree_state
    - selected_atom_and_selection_rule_content_id
    - threshold_and_path_maximum_content_id
    - matched_mock_plan_content_and_registration_id_when_required
    - TF-11 source status, finite-only relation, NOT_ADJUDICATED status, and known fast-oracle instability caveat

future_consumer_contract:
  consumer: PR-287
  required_input: exact PR-284 receipt and per-report typed status
  rules:
    - BOUND_AVAILABLE_CONDITIONAL_PROVED_PREMISE permits only the sealed synthetic conditional bound.
    - MATCHED_MOCKS_REQUIRED remains unresolved until a separate executed and independently reviewed matched-mock receipt passes.
    - PR-284 process success never implies that a bound is available or that mocks executed.

assumptions:
  - The finite registered law and selected atom are synthetic and preregistered.
  - DepthPath nesting and filtration refinement are distinct checks.
  - The registered target is centered and square-integrable under one common law.
  - A matched-mock requirement is not itself evidence that matched mocks passed.

allowed_uses:
  - Synthetic exact replay of one finite reverse-martingale depth path.
  - Conservative premise-bound path-maximum calibration diagnostics.
  - Fail-closed routing to a matched-mock plan when the premise is unproved.
forbidden_uses:
  - Free calibration from support nesting alone.
  - Optional-stopping, asymptotic, or general reverse-martingale theorem claims.
  - Observed-data significance, posterior, evidence, or source attribution.
  - Native solver validation, geometry detection, or Bianchi family identification.
caveats:
  - The Doob bound may be conservative and is conditional on every registered premise.
  - The exact finite proof does not validate a data-derived conditional-expectation estimator.
  - Matched mocks must be separately executed and reviewed before any statistical use.
  - PR-151 partial/background data is forbidden input.
  - The known fast TF-11 simulation-oracle instability remains excluded from acceptance evidence and is not repaired or promoted here.
