pr_id: PR-299
title: production Bayesian inference readiness after PR-288 audit
predecessor_contract:
  required_pr: PR-288
  required_terminal: PASS_BAYESIAN_SEMANTICS_REPAIR
  interpretation: synthetic_reference_only
scope:
  owner: HTT
  implementation: typed production model contract and observational-run readiness adapter
  observed_data_execution: false
  result_generation: false
  native_transfer_or_atlas: false
claim_boundary:
  claim_tier: diagnostic_only
  transfer_source: none
  family_identification_gate: BLOCKED_PRE_NATIVE_ATLAS
  forbidden:
    - observed evidence or Bayes-factor result
    - legacy evidence reuse
    - native solver validation
    - Bianchi geometry or family identification
production_model_contract:
  required_fields:
    - model_id
    - parameter_schema
    - normalized_log_likelihood
    - prior_transform
    - data_identity
    - covariance_identity
    - block_partition
    - replicate_generator
    - discrepancy_registry
  posterior_lineage_required:
    - posterior_sample_content_sha256
    - normalized_weight_content_sha256
    - weighted_ess
    - resampling_rule
    - sampler_settings
    - sampler_lineage_to_ppc_and_blockwise_loo_plan
  fail_closed_on:
    - incomplete_model_contract
    - nonfinite_or_unnormalized_weight
    - rank_deficient_response
    - missing_block_partition
    - missing_or_mismatched_authorization
    - missing_required_dynesty_engine
readiness_lanes:
  - lane_id: H-PLANCK
    runner_patterns: [scripts/codex_harness/run_pr150_k1_e2e.py, htt/bass/inference/planck_likelihood.py]
  - lane_id: H-DESI
    runner_patterns: [scripts/codex_harness/run_pr151_desi_exact_selection.py, scripts/desi_dipole_mock_significance.py]
  - lane_id: H-CF4
    runner_patterns: [scripts/cf4_mv_bulkflow.py, scripts/cf4_mock_calibrated_significance.py]
  - lane_id: H-JWST
    runner_patterns: [scripts/codex_harness/run_pr153_jwst_anchor.py, scripts/codex_harness/run_pr154_jwst_host_hierarchy.py]
  - lane_id: H-ACT
    runner_patterns: [scripts/codex_harness/run_pr152_act_raw_qe.py, scripts/act_raw_qe_card.py]
exit_gates:
  - general callable likelihood/prior/schema/data identity contract
  - weighted sampler posterior lineage to PPC and blockwise LOO
  - explicit readiness or blocked decision for every registered lane
  - exact Dynesty optional extra declaration
  - no observed payload opened and no numerical output generated
  - focused contract, runner, claim, DAG, and mirror checks
anti_inflation:
  max_new_production_modules: 2
  max_new_runners: 1
  max_new_tests: 2
  no_new_global_ledger_or_status_enum: true
  downstream_consumer: PR-151 finalization and all listed observed lanes consume the readiness contract
audit_findings_addressed:
  - general_model_contract
  - engine_posterior_to_ppc_loocv_lineage
  - blockwise_fold_registration
  - weighted_ess_and_sampler_metadata
  - dynesty_environment_declaration
deferred_to_observed_execution:
  - repeated_nested_sampling_seed_ensembles
  - lane-specific_prior_sensitivity_results
  - simulation_based_calibration_or_independent_likelihood_oracle
  - observed_ppc_and_delta_elpd
  - observed_covariance_power_curves
