publication_group_id: PG-PR287-FRESH-BLIND-REPLAY

dependencies: [PR-281, PR-282, PR-283, PR-284, PR-285, PR-286]
dependency_contracts:
  - upstream_id: PR-281
    mode: requires_success
    required_resolution: COMPLETED_SUCCESS
    required_receipt: docs/PR_DELTAS/pr-281.md
  - upstream_id: PR-282
    mode: requires_success
    required_resolution: COMPLETED_SUCCESS
    required_terminal: PASS_EXECUTABLE_P_EQUIVARIANCE
    required_receipt: docs/generated/pr282_exact_parity_readiness_receipt.json
  - upstream_id: PR-283
    mode: requires_success
    required_resolution: COMPLETED_SUCCESS
    required_terminal: PASS_WEAK_IDENTIFICATION_ABSTENTION
    required_receipt: docs/generated/pr283_weak_identification_receipt.json
  - upstream_id: PR-284
    mode: requires_success
    required_resolution: COMPLETED_SUCCESS
    required_terminal: PASS_PREMISE_BOUND_DEPTH_PATH_CALIBRATION
    required_receipt: docs/generated/pr284_depth_path_doob_receipt.json
  - upstream_id: PR-285
    mode: requires_success
    required_resolution: COMPLETED_SUCCESS
    required_terminal: PASS_COMPLETE_PILLAR_T_ADJUDICATION
    required_receipt: docs/research_program/post_pr275/pillar_t_adjudication/PILLAR_T_COMPLETE_ADJUDICATION_V1.json
    success_semantics: PROCESS_COMPLETION_ONLY
    downstream_row_contract:
      preserve_row_verdicts: true
      preserve_fail_inconclusive_and_blocked: true
      preserve_exact_row_semantics: true
      synthetic_validation_effect: NO_THEOREM_SOURCE_OBSERVED_OR_EXACTNESS_PROMOTION
  - upstream_id: PR-286
    mode: requires_success
    required_resolution: COMPLETED_SUCCESS
    required_terminal: PASS_COMPLETE_PILLAR_S_ADJUDICATION
    required_receipt: docs/research_program/post_pr275/pillar_s_adjudication/PILLAR_S_COMPLETE_ADJUDICATION_V1.json
    success_semantics: PROCESS_COMPLETION_ONLY
    downstream_row_contract:
      preserve_row_verdicts: true
      preserve_inconclusive_and_blocked: true
      synthetic_validation_effect: NO_OBSERVED_OR_SOURCE_PROOF_PROMOTION

activation_contract:
  current_state: ACTIVE_PREDECESSOR_PR_OPEN
  authority_mode: STACKED_PR_OPEN_EXACT_SEALED_HEAD
  canonical_status_source: docs/codex_handoff/pr_status.yaml
  canonical_target_sha: ff9ef9f45747e559c5343b463cf010dfc3a7432a
  required_predecessor_state: PR_OPEN
  required_predecessor_sealed_sha: b955a050f19db853a93779506e8acb4e4a5352a9
  predecessor_pr_url: https://github.com/cosmosapjw-quantum/htt_base/pull/383
  review_evidence_role: HISTORICAL_PROVENANCE_ONLY
  pre_activation_allowed:
    - frozen design and publication-policy review
    - typed interface mapping and fail-first contract tests
    - dependency-stack replay without held-out generation or result inspection
  pre_activation_forbidden:
    - fresh seed generation
    - challenge or truth-vault generation
    - blind analyst execution
    - held-out truth inspection or adjudication
    - result-pack generation
  rule: >-
    Fresh challenge execution is eligible only because all six canonical
    predecessor rows satisfy their registered dependency contracts and PR-286
    is OPEN at its exact sealed head. A moving target tip, merge state, or a
    different predecessor commit cannot substitute for that recorded head.
  exact_validation:
    - require exact canonical spec path docs/research_program/post_pr275/pr287_spec.yaml
    - require exact canonical status path docs/codex_handoff/pr_status.yaml
    - resolve every predecessor from the canonical status row
    - require resolution COMPLETED_SUCCESS and success_dependency_satisfied true
    - resolve every declared receipt and review receipt as a regular non-symlink file
    - treat predecessor review envelopes as historical provenance rather than replaying them against the current descendant worktree
    - require PR-283 through PR-286 to have the exact complete PR_OPEN lifecycle and PASS implementation validation review seal push and publication gates
    - require every stacked base predecessor and predecessor_sealed_sha to equal the immediately preceding exact SEALED_HEAD
    - require current PR-287 to be the only ACTIVE implementation and to start from the recorded PR-286 SEALED_HEAD
    - recompute and bind receipt hashes and candidate identities before side effects
    - validate PR-282 through PR-286 process-terminal tokens from their exact receipts
    - read each terminal only from its registered schema path; recursive token search is forbidden
    - reject missing duplicate stale mismatched or unregistered predecessor evidence
  side_effect_boundary: >-
    Activation validation is pure and completes before entropy access, scratch
    creation, challenge construction, truth construction, historical replay,
    submission parsing, adjudication, or pack writes.

capability: current_vector_tensor_spine_replay_and_held_out_challenge
scope: pre-solver fresh synthetic integration and historical replay
claim_tier: diagnostic_only
claim_level: {scheme: roadmap_rescue_v1, level: C2}
scientific_artifact_mode: synthetic_diagnostic
transfer_source: none
observed_data_executed: false
public_use: false
family_identification_gate: BLOCKED_PRE_NATIVE_ATLAS
scientific_status_effect: OPEN_UNCHANGED

lane_separation:
  historical_replay:
    source_pr: PR-273
    source_pack: docs/research_program/vector_tensor/integration/PR273_DIAGNOSTIC_PACK.json
    mode: EXACT_HISTORICAL_REPLAY_ONLY
    execution_order: after_fresh_submission_is_content_frozen
    allowed_use:
      - reproduce historical typed-pipeline behavior and archived failure boundaries
      - BC1-tagged compatibility projection into a separate comparison appendix
    forbidden_use:
      - seed, threshold, normalizer, case design, expected label, or truth anchor for the fresh challenge
      - replacement for current-spine execution
      - proof, observed, native, geometry, or family promotion
  fresh_challenge:
    mode: NEW_CHALLENGE_AND_NEW_TRUTH_VAULT
    case_ids: [D01, D02, D03, D04, H01, H02, H03, H04, H05, H06, H07, H08]
    development_ids: [D01, D02, D03, D04]
    held_out_ids: [H01, H02, H03, H04, H05, H06, H07, H08]
    hidden_scenario_bank:
      schema: htt.pr287.typed_scenario_bank.v1
      content_address: sha256_of_canonical_scenario_inventory
      scenario_order:
        - SCALAR_LIMIT
        - TENSOR_ONLY
        - MISSING_CHANNEL
        - COVARIANCE_CORRECT
        - COVARIANCE_MISSPECIFIED_PAIRED
        - MULTIPLICITY_STRESS
        - COVERAGE_FAILURE
        - WEAK_LOCAL_GLOBAL_OVERLAP
        - SEPARATED_LOCAL_GLOBAL
        - OPEN_SET_UNKNOWN
        - PROVED_DEPTH_PATH
        - PREMISE_MISSING_DEPTH_PATH
      required_scenario_fields:
        - scenario_id
        - partition
        - data_generating_law_id
        - estimand_id
        - analysis_unit
        - covariance_generator_id
        - covariance_analysis_id
        - covariance_generator_matrix
        - covariance_analysis_matrix
        - latent_draw_inventory_id
        - replicate_or_exact_enumeration_rule
        - exact_enumeration_cell_ids
        - seed_policy_id
        - hypothesis_family_id
        - alpha
        - simultaneous_method
        - acceptance_rule_id
        - expected_negative_control_terminal
        - mc_precision_rule_id
      common_statistical_contract:
        replicate_count: 512
        analysis_unit: one complete synthetic challenge case
        alpha: 0.05
        hypothesis_family_id: PR287-HELDOUT-FAMILY-V1
        simultaneous_method: Holm-Bonferroni_FWER
        raw_cell_results_preserved: true
        coverage_estimand: repeated_case_interval_contains_frozen_truth
        coverage_target: 0.90
        coverage_acceptance: exact_binomial_95pct_interval_contains_target
        mc_precision_rule: exact_binomial_interval_half_width_at_most_0.04
        insufficient_precision_terminal: INCONCLUSIVE_MC_PRECISION
      scenario_template:
        partition: exact development for first four scenarios and held_out for remaining eight
        data_generating_law_id: scenario_specific_content_id_required
        analysis_unit: one_complete_synthetic_challenge_case
        covariance_generator_id: scenario_specific_content_id_required
        covariance_analysis_id: scenario_specific_content_id_required
        covariance_generator_matrix: finite_symmetric_positive_definite_and_content_bound
        covariance_analysis_matrix: finite_symmetric_positive_definite_and_content_bound
        latent_draw_inventory_id: generated_after_seed_and_content_addressed
        replicate_or_exact_enumeration_rule: 512_independent_replicates_or_exact_finite_enumeration
        exact_enumeration_cell_ids: empty for Monte Carlo or a complete ordered distinct content-ID inventory frozen before exact execution
        seed_policy_id: PR287-CRYPTO-SEED-DERIVATION-V1
        hypothesis_family_id: PR287-HELDOUT-FAMILY-V1
        alpha: 0.05
        simultaneous_method: Holm-Bonferroni_FWER
        acceptance_rule_id: scenario_specific_content_id_required
        expected_negative_control_terminal: scenario_specific_required
        mc_precision_rule_id: PR287-EXACT-BINOMIAL-HALFWIDTH-004-V1
      canonicalization_rule: >-
        Expand the template with every scenario-specific value and secret
        partition assignment before hashing the truth-vault scenario bank.
        Placeholder, missing, duplicate, or unexpanded effective fields block
        challenge generation.
      paired_covariance_contract:
        shared_latent_draw_inventory: required
        correct_analysis_covariance: equals_generator_covariance
        misspecified_analysis_covariance: registered_distinct_positive_definite_matrix
        misspecified_terminal: MISSPECIFIED_NEGATIVE_CONTROL
        forbidden: [calibrated_alias, independent_draw_substitution, hidden_negative_control]
      scenario_contracts:
        - {scenario_id: SCALAR_LIMIT, estimand_id: scalar_limit_crosswalk, expected_negative_control_terminal: NOT_APPLICABLE}
        - {scenario_id: TENSOR_ONLY, estimand_id: tensor_channel_response, expected_negative_control_terminal: NOT_APPLICABLE}
        - {scenario_id: MISSING_CHANNEL, estimand_id: typed_missingness, expected_negative_control_terminal: REQUIRED_ABSTENTION}
        - {scenario_id: COVARIANCE_CORRECT, estimand_id: covariance_calibrated_coverage, expected_negative_control_terminal: CALIBRATED_CONTROL}
        - {scenario_id: COVARIANCE_MISSPECIFIED_PAIRED, estimand_id: paired_covariance_failure_visibility, expected_negative_control_terminal: MISSPECIFIED_NEGATIVE_CONTROL}
        - {scenario_id: MULTIPLICITY_STRESS, estimand_id: familywise_error_control, expected_negative_control_terminal: SIMULTANEOUS_FAILURE_VISIBLE}
        - {scenario_id: COVERAGE_FAILURE, estimand_id: registered_interval_coverage, expected_negative_control_terminal: COVERAGE_FAILURE_VISIBLE}
        - {scenario_id: WEAK_LOCAL_GLOBAL_OVERLAP, estimand_id: source_separation_abstention, expected_negative_control_terminal: TYPE_UNIDENTIFIED}
        - {scenario_id: SEPARATED_LOCAL_GLOBAL, estimand_id: source_separation_candidate_eligibility, expected_negative_control_terminal: NOT_APPLICABLE}
        - {scenario_id: OPEN_SET_UNKNOWN, estimand_id: open_set_unknown_abstention, expected_negative_control_terminal: UNKNOWN_CLASS}
        - {scenario_id: PROVED_DEPTH_PATH, estimand_id: premise_bound_depth_calibration, expected_negative_control_terminal: NOT_APPLICABLE}
        - {scenario_id: PREMISE_MISSING_DEPTH_PATH, estimand_id: depth_bound_unavailability, expected_negative_control_terminal: MATCHED_MOCKS_REQUIRED}
    mapping_visibility: truth_vault_and_adjudicator_only

