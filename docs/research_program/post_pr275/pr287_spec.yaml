analysis_protocol:
  stages:
    - stage: SPEC_AND_DEPENDENCY_FREEZE
      readable: [this specification, predecessor terminal receipts, typed interfaces]
      forbidden: [fresh seed, fresh truth, held-out mapping, fresh result packs]
      output: dependency activation receipt
      required_output_id: dependency_activation_receipt_content_id
    - stage: CHALLENGE_DESIGN
      role: challenge_designer
      readable: [this specification, activated typed interfaces]
      forbidden: [analyst output, reviewer verdicts, historical result numbers as design inputs]
      required_input_ids: [dependency_activation_receipt_content_id, challenge_config_content_id, threshold_contract_content_id]
      output: fresh challenge, sealed truth vault reference, seed commitment
      required_output_ids: [challenge_content_id, truth_vault_content_id, seed_commitment_content_id, case_inventory_content_id]
    - stage: BLIND_ANALYSIS
      role: blind_analyst
      readable: [fresh challenge, current typed runtime, frozen thresholds]
      forbidden:
        - fresh truth vault and seed
        - held-out scenario mapping and expected outcomes
        - PR-273 truth, adjudication, analyst submission, and diagnostic pack
        - sibling reviewer results
      required_input_ids: [challenge_content_id, challenge_config_content_id, threshold_contract_content_id]
      output: content-addressed analyst submission
      required_output_id: submission_content_id
    - stage: REGISTERED_ADJUDICATION
      role: independent_adjudicator
      precondition: analyst submission content identity is frozen
      readable: [fresh truth vault, frozen analyst submission, mutation registry]
      required_input_ids: [truth_vault_content_id, submission_content_id, challenge_content_id, threshold_contract_content_id]
      output: adjudication, packs A/B/C, terminal receipt
      required_output_ids: [adjudication_content_id, pack_A_content_id, pack_B_content_id, pack_C_content_id, terminal_receipt_content_id]
    - stage: HISTORICAL_REPLAY
      role: replay_auditor
      precondition: fresh analyst submission content identity is frozen
      readable: [frozen PR-273 pack and replay sources]
      required_input_ids: [submission_content_id, historical_pr273_pack_content_id]
      output: separate historical replay receipt
      required_output_id: historical_replay_receipt_content_id
  stage_trace_contract:
    exact_stage_order: [SPEC_AND_DEPENDENCY_FREEZE, CHALLENGE_DESIGN, BLIND_ANALYSIS, REGISTERED_ADJUDICATION, HISTORICAL_REPLAY]
    required_per_stage: [stage_id, input_content_ids, output_content_ids, status, started_at_utc, completed_at_utc]
    failure_rule: missing_duplicate_reordered_or_identity_mismatched_stage_blocks_terminal

current_pipeline_contract:
  semantic_order:
    - JointAnisotropyStateV2 orbit acceptance
    - exact parity P-equivariance readiness
    - covariance-supported weak-identification decision
    - open-set mandatory abstention
    - premise-bound DepthPath calibration
    - Pillar T row-level adjudication projection
    - Pillar S row-level adjudication projection
    - result-pack composition
  required_diagnostics:
    - x_phi, Q_phi, Pi_phi_of_q, F_phi_certified, and G_F typed crosswalk
    - SectorStress and support utilization
    - partial-identification and simultaneous coverage
    - multiplicity and covariance-misspecification outcomes
    - local/global rank, principal angle, weak-ID, and abstention
    - open-set unknown-class behavior
    - depth-path premise and matched-mock fallback status
  pr286_row_rule:
    preserve_row_verdicts: true
    preserve_inconclusive_and_blocked: true
    exact_rows_require_exact_evidence: true
    synthetic_replay_cannot_promote_source_status: true
  classifier_precedence:
    - OUTSIDE_SUPPORTED_QUOTIENT
    - MISSING_RESPONSE_PROVIDER
    - NON_IDENTIFIED_OR_SUM_ONLY_OR_WEAKLY_IDENTIFIED_TO_TYPE_UNIDENTIFIED
    - UNKNOWN_CLASS_AT_OR_ABOVE_DISTANCE_THRESHOLD
    - RESPONSE_EQUIVALENCE_OR_MARGIN_ABSTENTION
    - UNIQUE_RESPONSE_CLASS_CANDIDATE
  row_projection_contract:
    sources:
      pillar_t: docs/research_program/post_pr275/pillar_t_adjudication/PILLAR_T_COMPLETE_ADJUDICATION_V1.json
      pillar_s: docs/research_program/post_pr275/pillar_s_adjudication/PILLAR_S_COMPLETE_ADJUDICATION_V1.json
    frozen_source_sha256:
      pillar_t: 5c22fb53883926ae607751de736cf0f3f637791247aa548b9cb36f48cbf2ad13
      pillar_s: f924d67ae6f25340cb5844895cea96a9257f145d2935e93f91445dafcc98c053
    exact_inventory:
      pillar_t_rows: 80
      pillar_s_rows: 72
      order_sensitive: true
    required_row_fields:
      - row_id
      - source_statement_or_replay_identity
      - verdict
      - evidence_class
      - statement_relation
      - claim_ceiling
      - units_normalization_and_frame
      - sign_orientation_convention
      - prior_applicability_and_identity
      - covariance_law_coverage_status
      - rank_and_identification_scope
      - singular_value_and_principal_angle_status
      - row_semantic_content_id
    required_preserved_terminals:
      - FAIL
      - INCONCLUSIVE_WITH_RECEIPT
      - BLOCKED_WITH_RECEIPT
    forbidden_promotions:
      - simulation_to_exact_proof
      - process_pass_to_row_pass
      - unavailable_to_not_applicable
      - source_unproved_to_source_proved
      - synthetic_to_observed
  depth_path_projection_contract:
    required_fields:
      - depth_path_report_id
      - calibration_receipt_id
      - premise_status
      - finite_bound_status
      - matched_mock_plan_id
      - matched_mock_plan_content_id
      - matched_mock_registration_chronology
      - null_law_and_generator_id
      - acceptance_rule_id
      - null_mock_status
    rule: >-
      A missing premise or null bound remains MATCHED_MOCKS_REQUIRED or
      BLOCKED/INCONCLUSIVE exactly; downstream composition cannot infer a
      finite bound or completed mocks from a PR-284 process pass.

legacy_bc1_contract:
  label: BC1_LEGACY_PROJECTION
  allowed_fields: [legacy_source_path, legacy_content_id, projected_field_name, projected_value]
  required_output_flag: legacy_reproduction_only
  forbidden_roles: [seed, threshold, normalizer, case_truth, expected_outcome, inference_anchor]
  execution_lane: separate_historical_comparison_appendix_only
  execution_precondition: fresh_submission_content_id_frozen
  forbidden_fresh_pack_membership: true

result_pack_contract:
  canonical_surface_semantics:
    x_phi:
      owner: MIO
      semantics: signed registered projection coordinate
      required_metadata: [units_normalization_and_frame, sign_orientation_convention]
    Q_phi:
      owner: MIO
      semantics: registered policy-normalized diagnostic ratio
      required_metadata: [policy_id, denominator_identity, zero_denominator_status]
    Pi_phi_of_q:
      owner: MIO
      semantics: threshold exceedance fraction not truth probability
      required_metadata: [q_threshold, comparison_rule, denominator_identity]
    F_phi_certified:
      owner: MIO
      semantics: numeric only under registered sign-clean admissible ceiling
      required_metadata: [ceiling_identity, sign_clean_status, admissibility_status]
      numeric_range_when_admissible: closed_unit_interval
      exact_state_machine:
        - {sign_clean_status: PASS, admissibility_status: ADMISSIBLE, value: required_closed_unit_interval}
        - {sign_clean_status: FAIL, admissibility_status: INADMISSIBLE, value: null}
    G_F:
      owner: MIO
      semantics: ordered-depth diagnostic gap conditional on registered null calibration
      required_metadata: [ordered_depth_bin_identity, path_identity, covariance_id, null_status]
  common_forbidden_numeric_ownership: >-
    COMMON may validate schemas, identities, and compose an index. It does not
    derive or own numerical x/Q/Pi/F/G_F or morphology statistics.
  pack_A:
    owner: COMMON
    scope: typed composition envelope and owner-preserving diagnostic index
    required_surfaces: [x_phi, Q_phi, Pi_phi_of_q, F_phi_certified, G_F, SectorStress, support_utilization, partial_identification]
    required_per_surface: [subject_owner, schema_id, content_id, status, allowed_use, forbidden_use]
    forbidden_surfaces: [derived_numeric_value_by_COMMON, likelihood, posterior, Bayes_factor, evidence, truth_probability, family_label, truth_certificate]
  pack_B:
    owner: HTT
    scope: local/global, weak-ID, open-set, covariance, multiplicity, and depth diagnostic gate report
    required_surfaces: [rank, principal_angles, covariance_status, weak_identification, abstention, depth_calibration, coverage]
    likelihood_semantics: NOT_APPLICABLE_DIAGNOSTIC_ONLY
    prior_applicability_and_identity: NOT_APPLICABLE_DIAGNOSTIC_ONLY
    forbidden_surfaces: [likelihood, posterior, Bayes_factor, evidence, truth_probability, family_label, truth_certificate]
  pack_C:
    owner: MIO
    scope: family-independent x-Q-Pi-F-G diagnostic report
    required_surfaces: [x_phi, Q_phi, Pi_phi_of_q, F_phi_certified, G_F, direction_coherence, depth_coherence]
    likelihood_semantics: NOT_APPLICABLE_DIAGNOSTIC_ONLY
    prior_applicability_and_identity: NOT_APPLICABLE_DIAGNOSTIC_ONLY
    forbidden_surfaces: [likelihood, posterior, Bayes_factor, evidence, truth_probability, family_label, truth_certificate]
  shared_metadata:
    - owner
    - scope
    - claim_tier
    - claim_level
    - scientific_artifact_mode
    - transfer_source
    - config_and_input_identities
    - synthetic_sky_mask_status
    - covariance_and_null_status
    - observed_data_executed
    - public_use
    - scientific_status_effect
    - family_identification_gate
    - evidence_lane_identity
    - pr151_partial_data_excluded
    - likelihood_semantics
    - prior_applicability_and_identity
    - units_normalization_and_frame
    - sign_orientation_convention
    - surface_semantic_content_ids
    - seed_commitment_and_disclosure_status
    - assumptions
    - caveats
    - generating_procedure
    - git_commit_or_worktree_state
  pack_identity_rule: >-
    Each pack is built by its owner-specific factory, recursively rejects
    forbidden fields and forbidden claim language in runtime string values,
    binds every upstream content identity, and recomputes its own canonical
    content ID. Declared owner strings alone are insufficient.
  pack_B_precedence_evidence:
    weak_identification_surface_fields: [classifier_terminal, precedence_rule_id, response_equivalence, margin_abstention]
    rank_geometry_rule: max_local_or_global_rank_at_most_joint_rank_at_most_rank_sum
    principal_angle_rule: zero exactly when positive-rank response subspaces intersect; undefined when either component rank is zero
  factory_module_binding:
    PACK_A: common.post275_blind_replay
    PACK_B: htt.infer.post275_blind_replay
    PACK_C: mio.reports.post275_blind_replay
  recursive_forbidden_aliases:
    - posterior_odds
    - log_evidence
    - family_candidate
    - detected_geometry

mutation_registry:
  - {mutation_id: MU287-ACTIVATION-BYPASS, intended_defect: entropy or artifact construction occurs before exact predecessor activation}
  - {mutation_id: MU287-TRUTH-IN-CHALLENGE, intended_defect: held-out truth field enters analyst challenge}
  - {mutation_id: MU287-TRUTH-IN-SUBMISSION, intended_defect: analyst submission carries truth or expected label}
  - {mutation_id: MU287-LEGACY-SEED, intended_defect: PR-273 or legacy pack value seeds fresh execution}
  - {mutation_id: MU287-HISTORICAL-BEFORE-FREEZE, intended_defect: PR273 truth result or replay is read before fresh submission freeze}
  - {mutation_id: MU287-CHALLENGE-IDENTITY, intended_defect: challenge bytes or config change without content identity update}
  - {mutation_id: MU287-TRUTH-VAULT-IDENTITY, intended_defect: truth mapping changes without truth-vault identity update}
  - {mutation_id: MU287-THRESHOLD-IDENTITY, intended_defect: threshold contract changes after challenge freeze}
  - {mutation_id: MU287-CHALLENGE-AFTER-SUBMISSION, intended_defect: challenge changes after submission freeze}
  - {mutation_id: MU287-SUBMISSION-AFTER-SEAL, intended_defect: submission changes after its content identity freezes}
  - {mutation_id: MU287-SEED-COMMITMENT, intended_defect: disclosed seed does not match challenge commitment}
  - {mutation_id: MU287-CASE-PARTITION, intended_defect: case is missing duplicated reordered or assigned to two partitions}
  - {mutation_id: MU287-STAGE-ORDER, intended_defect: stage is missing duplicated reordered or carries mismatched input output identities}
  - {mutation_id: MU287-COVARIANCE-BYPASS, intended_defect: misspecified covariance is treated as calibrated}
  - {mutation_id: MU287-MULTIPLICITY-BYPASS, intended_defect: unadjusted pointwise result replaces simultaneous control}
  - {mutation_id: MU287-COVERAGE-SUPPRESS, intended_defect: registered coverage failure is hidden}
  - {mutation_id: MU287-WEAK-ID-LABEL, intended_defect: weakly identified case emits a point label}
  - {mutation_id: MU287-WEAK-ID-PRECEDENCE, intended_defect: weak source gate is overwritten by unknown or equivalence label}
  - {mutation_id: MU287-OPEN-SET-FALLBACK, intended_defect: unknown case is forced to nearest registered class}
  - {mutation_id: MU287-DEPTH-PREMISE, intended_defect: bound emitted when reverse-martingale premise is absent}
  - {mutation_id: MU287-DEPTH-IDENTITY, intended_defect: depth report calibration plan null law or chronology identity drifts}
  - {mutation_id: MU287-PR285-PROMOTION, intended_defect: failed inconclusive or blocked Pillar T row is promoted by process success}
  - {mutation_id: MU287-PR286-PROMOTION, intended_defect: inconclusive or blocked PR-286 row is promoted by simulation}
  - {mutation_id: MU287-ROW-SEMANTIC-DRIFT, intended_defect: units sign prior covariance rank or statement changes while verdict is retained}
  - {mutation_id: MU287-PACK-OWNER, intended_defect: COMMON derives numerical diagnostics or an owner factory is substituted}
  - {mutation_id: MU287-XQPI-FG-SEMANTICS, intended_defect: sign denominator threshold ceiling depth or null semantics drift}
  - {mutation_id: MU287-MIO-INFERENCE, intended_defect: pack C contains HTT-only probabilistic or adjudicative inference surfaces}
  - {mutation_id: MU287-PACK-METADATA, intended_defect: pack omits C2 synthetic observed public family or evidence-lane metadata}
  - {mutation_id: MU287-PACK-CLAIM-PROMOTION, intended_defect: any fresh pack exceeds diagnostic-only synthetic scope}
  - {mutation_id: MU287-MUTATION-OMISSION, intended_defect: returned mutation battery is incomplete or reordered}

portable_clean_contract:
  mode: git_archive_or_enumerated_tracked_candidate_copy
  source_root_must_differ_from_execution_root: true
  reject_symlinks_and_missing_bindings: true
  scrub_environment:
    - PYTHONPATH
    - PYTHONHOME
    - PYTEST_ADDOPTS
    - PYTEST_PLUGINS
    - PYTHONSTARTUP
    - PR287_ORBIT_ACTIVATION_OVERRIDE
  required_evidence:
    - tracked_source_manifest_and_content_ids
    - interpreter_and_dependency_versions
    - scrubbed_environment_keys
    - exact_command_exit_code_and_runtime
    - source_and_clean_root_pre_post_hashes
    - zero_untracked_truth_submission_adjudication_or_pack_inputs
  execution_rule: >-
    Run from the clean copy with no source-worktree import path. Verify the
    exact PR_OPEN sealed-head activation and typed isolated-executor blocker
    without generating fresh challenge, truth, submission, adjudication, or
    pack artifacts.

terminal_contract:
  pass_token: PASS_FRESH_BLIND_TYPED_REPLAY
  block_token: BLOCKED_FRESH_BLIND_TYPED_REPLAY
  precedence:
    - BLOCKED_PREDECESSOR_FINAL_SUCCESS
    - BLOCKED_CAPABILITY_ISOLATED_EXECUTOR_NOT_INSTALLED
    - BLOCKED_BLINDNESS_OR_IDENTITY
    - BLOCKED_REGISTERED_MUTATION
    - BLOCKED_STATISTICAL_OR_TYPED_CONTRACT
    - PASS_FRESH_BLIND_TYPED_REPLAY
  process_success_semantics: >-
    A pass means the preregistered synthetic pipeline, blind protocol, and
    mutations executed as specified. It does not promote any theorem row,
    observed result, physical source, geometry, native-solver, or family claim.

allowed_uses:
  - synthetic current-spine integration and mutation evidence
  - diagnostic-only typed result packs for later separately authorized consumers
  - exact historical replay kept separate from fresh evidence
forbidden_uses:
  - observed-data inference or PR-151 partial-data use
  - legacy-number copying into current inference or challenge design
  - MIO likelihood posterior Bayes factor or evidence
  - native solver validation geometry detection or Bianchi family identification
  - synthetic promotion of an inconclusive blocked or source-unproved row
caveats:
  - All fresh outputs are synthetic and conditional on the registered challenge generator.
  - Historical PR-273 replay is reproducibility evidence only and is not fresh validation.
  - PR-285 current CAS reexecution remains platform-blocked on Wolfram even though its frozen historical aggregate is CAS_4AXIS_PASS.
  - PR-286 process completion preserves its row-level inconclusive and blocked dispositions.
  - Bare source-layout smoke requires the repository's declared PYTHONPATH and remains separate packaging debt.
