    truth_vault: docs/research_program/post_pr275/blind_replay/FRESH_TRUTH_VAULT_V1.json
    submission: docs/research_program/post_pr275/blind_replay/FROZEN_SUBMISSION_V1.json
    submission_freeze_receipt: docs/research_program/post_pr275/blind_replay/SUBMISSION_FREEZE_RECEIPT_V1.json
    adjudication: docs/research_program/post_pr275/blind_replay/REGISTERED_ADJUDICATION_V1.json
    pack_A: docs/research_program/post_pr275/blind_replay/PACK_A_V1.json
    pack_B: docs/research_program/post_pr275/blind_replay/PACK_B_V1.json
    pack_C: docs/research_program/post_pr275/blind_replay/PACK_C_V1.json
    historical_replay_receipt: docs/research_program/post_pr275/blind_replay/HISTORICAL_REPLAY_RECEIPT_V1.json
    terminal_receipt: docs/generated/pr287_fresh_blind_typed_replay_receipt.json
  blocked_state_rule: none_of_the_artifact_paths_may_exist_before_exact_dependency_activation
  recursive_forbidden_fields:
