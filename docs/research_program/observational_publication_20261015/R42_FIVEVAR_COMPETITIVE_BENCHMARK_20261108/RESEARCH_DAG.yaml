stop_conditions:
  - "If actual source data are unavailable, complete theory/operator work and mark only affected likelihood blocked; continue independent probes."
  - "If a parameter is not identifiable, report its quotient/fibre or bound rather than force a detection."
  - "If HTT underperforms a competitor on calibrated held-out metrics, preserve that result and narrow the novelty claim."
  - "If the harness blocks a scientifically supported claim for a non-scientific reason, execute the harness correction workflow in HARNESS_REPAIR_AND_MUTATION_GATES.yaml."
