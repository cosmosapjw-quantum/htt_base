schema: htt.r42_legacy_disposition/1
program: HTT_R42_TENSOR_FIVE_VARIABLE_COMPETITIVE_BENCHMARK
as_of: 2026-11-08
governing_rule: "Never delete historical artifacts; classify all historical packages and dossiers into KEEP, REUSE, TRANSFORM, CONDITIONAL, QUARANTINE, or RETIRED."

dispositions:
  # R38-R41 Observational Packages
  - package_id: R38_OBSERVATIONAL_CONVERGENCE
    path: "docs/research_program/observational_publication_20261015/OBSERVATIONAL_CONVERGENCE_20261107"
    category: OBSERVATIONAL_PACKAGE
    disposition: QUARANTINE
    authority_boundary: "R38 reported rank 13 with condition ~2.5e17 and Delta BIC=17.2, but code inspection revealed empty adapter dictionaries and diagonal fallbacks."
    current_verdict: QUARANTINED_NOT_REPRODUCED
    replacement_or_successor: "Replaced by R41 source-bound forward operators and R42 Cobaya joint likelihood with genuine data bytes."

  - package_id: R39_FIVEVAR_OBSERVATIONAL_IDENTIFIABILITY
    path: "docs/research_program/observational_publication_20261015/OBSERVATIONAL_CONVERGENCE_R39_20261107"
    category: FIVE_VARIABLE_FRAMEWORK
    disposition: TRANSFORM
    authority_boundary: "Provides formal definitions for (x,Q,Pi,F,G_F) and kinematics theorems, but includes hardcoded response factors, arbitrary Gaussian null (1e-4), uncalibrated Q bounds, and unphysical depth scaling sigma0/(1+z)."
    current_verdict: PARTIALLY_VALID_NEEDS_REPAIR
    replacement_or_successor: "Transformed in R42 Stage B: source-specific forward operators for x, physical anchor priors for Q, empirical matched nulls for Pi, spherical quadrature for F, and shell-specific cross-covariance for G_F."

  - package_id: R40_TENSOR_X_RESEARCH_LOOPS
    path: "docs/research_program/observational_publication_20261015/TENSOR_X_RESEARCH_LOOPS_20261107"
    category: THEORY_LOOPS
    disposition: REUSE
    authority_boundary: "Defines the 6 independent theory research loops (L1..L6). Provides sound mathematical definitions of kinematic charts, STF tensors, and BipoSH."
    current_verdict: VALID_METHODOLOGICAL_SPECIFICATION
    replacement_or_successor: "Directly executed in R42 Stage D under genuine data and adversarial benchmarks."

  - package_id: R41_PUBLICATION_GATE_CONVERGENCE
    path: "docs/research_program/observational_publication_20261015/R41_PUBLICATION_GATE_20261107"
    category: OBSERVATIONAL_OPERATORS
    disposition: REUSE
    authority_boundary: "Built the 5 source-bound operators in htt/src/common/source_bound_*.py and Cobaya joint likelihood. Numerical claims (R-hat, ESS, SBC/PPC) are quarantined pending local data replay."
    current_verdict: OPERATORS_VALID_NUMERICAL_CLAIMS_QUARANTINED
    replacement_or_successor: "Operators reused and extended in R42; joint sampling replayed with locked data bytes in Stage E."

  # Foundational Theory & CAS Packages
  - package_id: METHOD_REBOOT_20261023
    path: "docs/research_program/observational_publication_20261015/METHOD_REBOOT_20261023"
