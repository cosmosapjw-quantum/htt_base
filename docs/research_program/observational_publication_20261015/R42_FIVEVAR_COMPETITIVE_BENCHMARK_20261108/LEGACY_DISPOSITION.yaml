    category: LEGACY_FRAMEWORK
    disposition: RETIRED
    authority_boundary: "TSC/Teff full polarization closure is legacy. Must not own any active scientific artifacts or claims."
    current_verdict: RETIRED_FROM_ACTIVE_SCIENCE
    replacement_or_successor: "Semantic guards moved to common.semantic_guards; HTT owns model inference; MIO owns diagnostics."

  # Observational Data Packages & Dossiers
