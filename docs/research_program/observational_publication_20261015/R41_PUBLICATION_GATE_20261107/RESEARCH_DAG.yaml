claim_ceiling:
  current: C0
  permitted_language:
    - "source-conditioned tensor-functional inference framework (proposed)"
    - "local/global discrimination candidate"
    - "transfer-conditional morphology compatibility"
    - "locally identifiable physical functional under stated observation operator"
  forbidden_language:
    - "Bianchi geometry detected"
    - "Bianchi family identified"
    - "model-independent truth certificate"
    - "validated empirical detection"
    - "native Bianchi transfer" 
  promotion_rule: "Every claim is promoted independently after source replay, scientific validation and an independent bounded review; no PR status, hash list, MIO certificate or synthetic mock promotes a claim."
parameter_contract:
  metric_signature: "(-,+,+,+)"
  units: "Keep c explicit except inside explicitly declared dimensionless helper functions."
  physical_state:
    name: theta_K
    components:
      - {name: sigma_ab, type: STF2_spatial, dimension: 5, normalization: sigma_over_H}
      - {name: omega_a, type: axial_vector, dimension: 3, normalization: omega_over_H}
      - {name: A_a, type: polar_vector, dimension: 3, normalization: A_over_cH}
      - {name: beta_RM_a, type: polar_vector, dimension: 3, normalization: v_over_c}
      - {name: beta_MO_a, type: polar_vector, dimension: 3, normalization: v_over_c}
    dimension: 17
    chart: "STF5 chart (Sxx,Syy,Sxy,Sxz,Syz), Szz=-Sxx-Syy; declare Gram metric or transform to orthonormal STF basis before Euclidean operations."
  background_state:
    name: psi
    components: [H0, Omega_m, r_d, Omega_k_or_delta_Omega_k]
    requirement: "Background parameters and curvature must be read from the sampled state; no hidden fiducial constants."
  frame_contract:
    frames: [radiation, matter, observer, source, catalogue]
    requirement: "Declare ordered frame maps and sign convention. Compose Lorentz boosts with exact four-velocity transformations; include Wigner rotation for non-collinear chains."
  observable_contract:
    x: "Typed sample-by-functional bundle. Every functional carries tensor rank, SO(3)/O(3) representation, parity, units, frame, redshift support, mask/window, and covariance identity."
    x_C: "Optional scalar comparator only; never replaces or reconstructs the tensor carrier."
    Q_Pi_F_GF: "Declare normalization, support/measure, joint law, denominators, and cross-bin dependence. A deterministic pushforward is not a probability."
  likelihood_contract:
    equation: "d_p = O_p(theta_K, psi, eta_p; source_p, window_p) + n_p; d jointly distributed with covariance C including evidenced cross-probe blocks."
    identifiability: "J_eff=(I-P_{W N}) W J, W=C^{-1/2}, N=dO/deta, J=dO/dtheta. For a target phi(theta), local identifiability requires ker(J_eff) subset ker(D phi)."
    parameter_scaling: "Use a declared physical/prior metric to whiten parameter coordinates before reporting singular values, rank or Fisher-volume comparisons."
    source_binding: "Bind exact source release, query/selection, row IDs/order, units, coordinate frame, estimator, mask/beam/selection window, covariance and transformation chain."
    covariance: "No silent block-diagonal cross-probe assumption. Estimate cross blocks or document conditional independence and demonstrate robustness."
    invalid_shortcuts:
      - "hard-coded observed amplitudes/directions"
      - "identity/diagonal covariance without calibration evidence"
      - "single fixed transfer coefficient presented as a physical solver"
      - "unexplained linear response factors"
      - "unoptimized model points used as BIC"
      - "held-out folds evaluated at full-data MAP without refit"
      - "hand-built PSIS estimator"
      - "rank or pseudodeterminant with arbitrary threshold and incomparable parameter units"
      - "first-order beta composition used where exact closure is required"
      - "vorticity excluded at all redshift orders from its leading scalar-contraction identity"
      - "synthetic/null data mixed with observed vectors"
