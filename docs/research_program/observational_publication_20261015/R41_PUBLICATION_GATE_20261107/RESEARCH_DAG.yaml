      - CLAIM_LEDGER.json
    acceptance:
      - "R38/R39/R40 historical identities preserved"
      - "conflicting empirical claims explicitly quarantined"
      - "local data existence/hash not asserted from GitHub manifests"
    evidence: "GitHub tree/blob review; static source review; no local execution"

