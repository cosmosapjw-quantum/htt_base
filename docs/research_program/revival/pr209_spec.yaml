track: I
title: Round-2 intake, immutable legacy inventory and disposition graph
roadmap_anchor: htt_legacy_revival_round2_20260721/docs/03_ROUND2_DUAL_TRACK_PR_ROADMAP_20260721.md
claim_identity: >
  Every legacy artifact is an immutable, hash-bound research object adjudicated
  into KEEP/REBUILD/MUTATION/RETIRE; no legacy module is importable on a
  production path.
estimand: sha256/CRC inventory match + disposition adjudication + zero direct legacy imports
frame_order_domain: N/A (provenance mechanics only; no physical estimand)
inputs:
  - docs/generated/revival_legacy_disposition.json  # pinned ledger (16 objects)
  - htt_legacy_revival_round2_20260721/legacy_sources/**  # on-disk drop (gitignored)
outputs:
  - docs/generated/pr209_result_card.json
decisive_falsifier: >
  A deleted or altered legacy archive member/hash/disposition, or a direct
  legacy import injected under a production root, still leaves the verifier green.
pass_gates:
  P1: spec frozen before result read
  P2: two independent implementations agree (module verify + independent sha recompute in the runner)
  P3: three hostile mutations (flipped sha / missing disposition entry / injected legacy import) each kill the gate
  P4: seeded/clean-CWD reproduce -> card --check byte-stable
  P5: zero stale/legacy production-path import hits
forbidden:
  - copy a legacy number into a new receipt
  - weaken scope wording to close a defect
readiness_state: EVIDENCE_READY
independence_gate: OPEN
public_use: false
