claim_identity: >
  Teff is a domain-certified reduced-order surrogate; it authorizes inference
  only with a native solver release hash + validation-sample hash + CERTIFIED
  status. With no native solver, the certificate authorizes NO inference.
decisive_falsifier: training and calibration points overlap, or out-of-domain output passes as inference.
pass_gates:
  P1: spec frozen before result read
  P2: envelope from an independent nested test split holds (0 violations)
  P3: out-of-domain error rejected (>5x envelope); overlapping split flagged
  P4: card --check byte-stable
  P5: authorizes_inference is False (no native solver)
readiness_state: EVIDENCE_READY
independence_gate: OPEN
