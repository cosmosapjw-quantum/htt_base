schema: htt.theorem_registry.v1
# Single source of truth for theorem/lemma status across the external-audit
# report, ledgers, and code contracts (REV-R170, v9 cycle).
#
# Status enum:
#   ACTIVE             proven/derived as stated; live in the current report body
#   ACTIVE_CONDITIONAL proven under explicitly stated conditions/assumptions
#   SUPERSEDED         replaced by a stronger/corrected item (superseded_by)
#   RETRACTED          statement false as printed; kept only as a marked
#                      counterexample/history pointer (superseded_by required)
#   WITHHELD           no accessible derivation/source; not usable in any lane
#   PLANNED            registered v9 item whose module/seal lands in a later
#                      phase of this cycle (flipped to ACTIVE on landing)
#
# sharpness_level (T3/P31 family, per R1 2026-07-10 review taxonomy):
#   1 = algebraic-box sharpness (product component model)
#   2 = constraint-surface endpoint attainability (exact initial data)
#   3 = dynamical solution-space sharpness (Einstein-matter evolution)
#
# The report builder MUST render its theorem ledger (and supersede badges)
# from this file; tests/contracts/test_theorem_registry_v9.py enforces
# structural validity. P-numbering is registry-stable, not body-monotone.

