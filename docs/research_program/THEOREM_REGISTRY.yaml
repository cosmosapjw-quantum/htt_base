  - id: U1
    title: Beta-channel toy correspondence (s = tanh beta; pair-tilt map s^2 = t/(2+t))
    owner: OBSSTAT/TEFF
    status: ACTIVE_CONDITIONAL
    claim_tier: diagnostic_only
    body_section: v8_update_cycle
    note: >-
      Toy correspondence conditional on the by-fiat identification of the
      observer-boost and matter-tilt rapidities. v9 pins symbols: pair tilt
      Omega_tilt^(pm) = 2(1+w)Omega_m^(1) sinh^2 beta with PER-STREAM
