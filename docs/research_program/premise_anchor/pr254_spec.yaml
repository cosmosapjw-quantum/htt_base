schema_version: 1
work_unit_id: PR-254
title: Normalizer benchmark and typed anchor geometry
target_ref: origin/research/pr04-multicomponent
target_sha: 7e63eaba54c50589676a50449627f9ebc7fa7e8d
change_set_id: CS-PR254-ANCHOR-GEOMETRY
publication_group_id: PG-PR254-ANCHOR-GEOMETRY
scientific_role: >
  Build a claim-tiered, purpose-specific intermediate layer for comparing
  premise anchors and other invertible normalizations.  This work does not
  detect FLRW departure, identify a Bianchi family, or turn anchor stress into
  evidence.
governing_sources:
  - source_id: MES-1995
    identity: arXiv:astro-ph/9501016
    role: source for conditional model-light anisotropy and inhomogeneity limits
  - source_id: NILSSON-1999
    identity: arXiv:astro-ph/9904252
    role: counterexample boundary against an almost-isotropic-CMB converse
  - source_id: CLARKSON-BARRETT-1999
    identity: arXiv:gr-qc/9906097v2
    role: accelerating-observer boundary against an isotropy-to-FLRW converse
  - source_id: PR253-INTAKE
    identity: docs/research_program/premise_anchor/pr253_input_intake.yaml
    role: proposed input only; quoted numbers remain evidence-ineligible
adopted_claims:
  - claim_id: PA-THM-GAUGE-SUBLEVEL
    statement: >
      For the registered closed convex absorbing runtime anchor classes, the
      unit sublevel of the implemented Minkowski gauge is the registered body.
    ceiling: conditional
  - claim_id: PA-THM-PRODUCT-BALL
    statement: >
      The gauge of a product of typed Euclidean block balls is the maximum
      block norm divided by its positive radius.
    ceiling: conditional
  - claim_id: PA-THM-ONE-WAY-MES
    statement: >
      If a registered premise class is contained in a typed MES anchor body,
      membership in the premise class implies gauge at most one; no converse
      is licensed.
    ceiling: conditional
  - claim_id: PA-THM-RANK-INVARIANCE
    statement: >
      Right multiplication of a response by an invertible anchor scaling
      preserves rank on the declared anchored supported subspace.
    ceiling: conditional
conjectures:
  - claim_id: J1-EXACT
    status: CONJECTURE_COUNTEREXAMPLE_FIRST
    required_outcome: >
      REFUTED_OR_RESTRICTED unless physical-set equality, essential uniqueness,
      four-axis CAS, and counterexample adjudication all independently pass.
  - claim_id: J2-UNIFORM
    status: CONJECTURE_COUNTEREXAMPLE_FIRST
    required_outcome: >
      REFUTED_OR_RESTRICTED unless a joint numerator-anchor law, a finite-sample
      uniform-validity proof, an independent coverage oracle, and
      counterexample adjudication all independently pass.
public_contract:
  module: common.anchor_geometry
  types:
    - NormalizerPurpose
    - NormalizerSpec
    - AnchorBodySpec
    - AnchorFamily
    - AnchorGaugeInterval
    - AnchorMarginReport
    - NormalizerBenchmarkReport
  supported_anchor_geometry:
    - product_block_ball
    - ellipsoid
    - certified_centrally_symmetric_polytope
    - finite_conditional_family
    - missing_or_withheld_block
  fail_closed:
    continuous_conditional_family: OPTIMIZER_REQUIRED
    nonconvex_union: NONCONVEX_CONDITIONAL_ONLY
    missing_or_withheld_block: ANCHOR_UNAVAILABLE
    channel_or_frame_mismatch: CHANNEL_MISMATCH
  margin_semantics:
    additive_radial_margin: 1-rho
    multiplicative_boundary_scale: 1/rho
    relative_boundary_growth: 1/rho-1
    raw_anchor_excess: max(rho-1,0)
    automatic_e_value: forbidden
normalizer_benchmark:
  required_kinds:
    - EXPANSION_NORMALIZED
    - MES_ANCHORED
    - FISHER_WHITENED
    - TEMPLATE_LIMIT
    - DYNAMICAL_BREAKDOWN
    - PRIOR_QUANTILE
  comparison:
    - same registered base draws
    - purpose-specific metric vectors
    - Pareto fronts
    - no universal scalar score
  anti_drift: >
    MES may be reported as ONE_ANCHOR_AMONG_FAMILY.  Invertible scaling is a
    reparameterization and is never reported as newly identified information.
tests:
  - PYTHONPATH=htt/src:htt python -B -m pytest -p no:cacheprovider -q htt/src/common/test_anchor_geometry.py
  - PYTHONPATH=htt/src:htt python -B -m pytest -p no:cacheprovider -q tests/pr_cards/test_pr_254_normalizer_anchor_geometry.py
  - >-
    python .agent-harness/scripts/cas_gate.py run-adjudicate
    --contract docs/generated/pr254_anchor_geometry/CAS_CONTRACT_PR254_ANCHOR_GEOMETRY.json
    --run-spec docs/generated/pr254_anchor_geometry/CAS_RUN_SPEC_PR254_ANCHOR_GEOMETRY.json
    --out docs/generated/pr254_anchor_geometry/CAS_ADJUDICATION_PR254_ANCHOR_GEOMETRY.json
kill_switches:
  - a nonconvex union is assigned one sublinear gauge
  - a continuous nuisance family is silently discretized
  - a missing or withheld block is replaced by zero
  - an unavailable observable is represented as a zero response
  - invertible anchor scaling is reported as rank or information gain
  - one minus stress is labelled multiplicative headroom
  - raw anchor excess is serialized as a calibrated e-value
  - J1-EXACT or J2-UNIFORM is promoted despite a valid counterexample
  - PR-151 partial acquisition data enters a fixture, calibration, or claim
claim_boundary:
  allowed:
    - typed premise-anchor stress diagnostics
    - purpose-specific normalization comparison
    - exact algebraic and executable counterexample evidence
  forbidden:
    - FLRW proximity or converse
    - source or Bianchi family identification
    - observational validation
    - native solver status
    - automatic evidence or cross-lane evidence merge
