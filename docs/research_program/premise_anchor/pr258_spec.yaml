kill_switches:
  - response-class labels are serialized or narrated as Bianchi family labels
  - all classes sharing a boundary are force-ranked instead of collapsed or abstained
  - an unknown input is assigned to its nearest known class
  - support-node duplication changes output or finite-support perturbation is called prior robustness
  - covariance-null residual or a missing observable is replaced by zero
  - a future-native adapter emits synthetic or external-transfer science values
  - a toy or proxy result enters the manuscript as observed validation
  - strong J1 or J2 language enters the claim registry or manuscript
  - historical x_C or PR-219 bytes change
  - PR-151 partial data, old Rust output or native-solver output enters a fixture or claim
  - a local/global source-labelled candidate bypasses PR-256 rank status
  - a PR-256 source gate is reused across observable, covariance, nuisance,
    provider, provider-response, transfer or class-contract identities
  - an added observable is aligned by row position rather than support_node_id
  - an old component is reopened without full joint-covariance regraphing
claim_boundary:
  claim_tier_ceiling: diagnostic_only
  requested_claim_level:
    scheme: roadmap_rescue_v1
    level: C2
  allowed_claim_level:
    scheme: roadmap_rescue_v1
    level: C2
  allowed:
    - typed pre-native response-class quotient
    - finite analytic or synthetic support diagnostics
    - equivalence coverage, unknown rejection and abstention metrics
    - negative, inconclusive and missing-provider results
  forbidden:
    - FLRW departure detection
    - observed anisotropy or geometry detection
    - Bianchi family identification or ranking
    - native-solver or external-transfer validation
    - posterior odds, Bayes factors, p-values or e-values from response-class distance
