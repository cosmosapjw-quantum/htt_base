schema_version: 1
work_unit_id: PR-258
title: Open-set response-class quotient and premise-anchor integration
target_ref: origin/research/pr04-multicomponent
target_sha: d62d63de6fdae1fbaf595ccce52b3abf532899e5
change_set_id: CS-PR258-OPEN-SET-INTEGRATION
publication_group_id: PG-PR258-OPEN-SET-INTEGRATION
scientific_role: >
  Extend the PR-219 response quotient into a typed, diagnostic-only open-set
  response-class layer using preregistered analytic or synthetic finite
  response supports.  The layer reports response equivalence, unknown-class
  rejection, abstention, parameter-support sensitivity and the minimal
  registered observable needed to reopen a quotient class.  It does not use
  observed data, instantiate a native solver manifold, classify a Bianchi
  family, or detect departure from FLRW.
