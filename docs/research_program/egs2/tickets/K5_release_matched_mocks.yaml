id: EGS2-K5-mocks
title: CF4 release-matched forward mocks for the K5 cosmic-variance term
state: blocked
blocker: BLOCKED_MISSING_RELEASE_MOCK_OWNERSHIP
owner_lane: cf4_reconstruction
method: >
  CF4 WF/CR Bias-Gaussianization (Hoffman et al. 2024, arXiv:2311.01340): draw
  log-normal density fields, apply the BGc correction, sample at the CF4 group
  positions with the CF4 distance-error model, run the GLS bulk-flow estimator on
  each mock. The mock ensemble gives the cosmic-variance-inclusive bulk-flow
  covariance and a calibrated coverage.
mechanics_ready: htt/obsstat/bulkflow_mle.py:hierarchical_coverage_experiment + htt/obsstat/constrained_realizations.py
exit_gate: component/amplitude coverage + bias with cosmic variance (separate covariance rows)
inputs_required: [CF4 release binding, BGc + WF/CR mock owner]
