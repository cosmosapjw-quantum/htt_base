id: EGS2-semi-native
title: Interim semi-native shear -> low-ell quadrupole/octupole calculator
state: cross_checked_camb_visibility
blocker: AWAITING_NATIVE_LOWELL_SOLVER (partial discharge only)
owner_lane: gr_xact
scope: >
  Covariant 1+3 multipole (Gebbie-Ellis PSTF) hierarchy for a SINGLE shear-sourced
  mode, truncated at modest ell_max, with a real recombination visibility from
  CAMB/CLASS, to compute the shear -> low-ell quadrupole/octupole transfer. NOT
  the 11-family morphology atlas; makes no family-ID claim. Replaces the toy r_ell
  of NT2-A1 with a physically-sourced response and feeds NT2-A1/B1 real coefficients.
exit_gate: exact-FLRW-anchored single-mode shear transfer cross-checked vs CAMB/CLASS visibility
not_in_scope: matched masks/randoms/covariance, family-equivalence gates (PR10 native solver)
exit_gate_discharged_2026_07_10: |
  v8-update cycle (REV-R162): htt/bass/transfer/visibility_camb_crosscheck.py
  recomputes the frozen lane's line-of-sight Bessel projection through the REAL
  CAMB 1.6.6 recombination visibility (pinned H0=67.5, ombh2=0.022, omch2=0.122,
  YHe=0.24; chi_star = 13804.5 Mpc, sigma_FWHM-equiv = 16.3 Mpc -- far narrower
  than the registered 250 Mpc Gaussian stand-in). All three load-bearing
  conclusions hold with the real visibility:
    - super-horizon floor saturates at sqrt(2/5): CAMB 0.632456 = Gaussian
      0.632456 (k*chi_star = 0.0138);
    - finite-k floor strictly below: CAMB 0.095673 vs matched Gaussian 0.095870
      at k = 1e-3 (0.2% apart);
    - band peak tracks l ~ k*chi_star (l_peak = 11 vs k*chi_star = 13.8).
  Seal docs/generated/seminative_camb_crosscheck_seal.json
  (egs2.seminative_camb_crosscheck, PASS; exit-2 registered blocker when camb
  absent). Gates research_gates/egs2/tests/test_egs2_camb_crosscheck.py.
  Makefile target egs2-camb-crosscheck. The frozen Gaussian module is imported
  read-only. AWAITING_NATIVE_LOWELL_SOLVER stays partially discharged: the full
  transfer still needs the shear-power mode integral / native line of sight.
