  - external transfer validated as native

acceptance:
  - spec, sources, equations, domain, target, fixtures, and falsifiers are frozen before axes
  - raw source archives and normalized records are hash-bound
  - four blind axes use one schema-v2 contract with no exception
  - source theorem authentication is separate from CAS algebra
  - the published persistent-tilt counterexample retires the blanket no-go
  - generated result artifacts reproduce byte-for-byte in check mode
