frame_contract:
  module: htt/src/common/frame_contract.py
  frames: [NORMAL, MATTER, ELECTRON, CMB, LOCAL_OBSERVER, FRAME_FREE]
  perturbative_orders: [BACKGROUND, LINEAR, SECOND_ORDER, EXACT]
  background_classes:
    - FLRW_FLAT
    - FLRW_CURVED
    - BIANCHI_I
    - BIANCHI_II
    - BIANCHI_IV
    - BIANCHI_V
    - BIANCHI_VI_0
    - BIANCHI_VI_H
    - BIANCHI_VII_0
    - BIANCHI_VII_H
    - BIANCHI_VIII
    - BIANCHI_IX
    - LRS_BIANCHI_III
    - KANTOWSKI_SACHS
    - NOT_APPLICABLE_ALGEBRAIC
  units_conventions: [DIMENSIONLESS_HUBBLE_NORMALIZED, MICRO_K2, KM_S, MPC_COMOVING, PURE_NUMBER]
  harmonic_conventions: [COMPLEX_SPHERICAL_CAMB, REAL_SPHERICAL, NOT_APPLICABLE]
  redshift_depth_conventions: [CZ_KM_S, COMOVING_MPC, DISTANCE_MODULUS, NOT_APPLICABLE]
  explicit_fields_required: true
  legacy_reproduction_mode: labeled_channel_only
  sign_registry:
    tilt_direction: >-
      boost.beta is the velocity of the TARGET frame measured in the SOURCE
      frame ("beta points FROM source TO target"); a scalar tilt value is
      the velocity of the MEASURED congruence read in its declared frame;
      the reading in the target frame is the relativistic SUBTRACTION
      compose(value, -boost.beta). Witness: rest in the declared frame
      (value = 0) reads as -boost.beta in the target frame. Swapping frames
      negates beta exactly (antisymmetry, machine-witnessed via
      FrameBoost.validate_pair). Collinear scalars only; non-collinear
      composition is a separate typed theorem (SIG-P7).
    vorticity_norm: >-
      W^2 = omega_ab omega^ab / (6 H^2) is quadratic and frame-swap
      invariant at fixed congruence; the SIGNED helicity flips with spatial
      orientation. REGISTERED PROSE ONLY in this PR — no helicity witness
      is machine-checked here; only the tilt antisymmetry is witnessed.
  kinematic_witnesses:
    rapidity_composition: beta12 = (beta1 + beta2) / (1 + beta1*beta2), exact Fractions
    round_trip: compose(beta, -beta) == 0 exactly
    associativity: compose(compose(b1,b2),b3) == compose(b1,compose(b2,b3)) exactly
  limit_predicates:
    flrw_limit: beta == 0 AND sigma2 == 0 AND w2 == 0 AND delta_omega_k == 0
    no_tilt_limit: beta == 0 only (NOT sufficient for the FLRW limit)
    local_boost_limit: >-
      observer boost reattribution at LINEAR order in beta (collinear); the
      tilt reading transforms by the registered subtraction and the
      quadratic sector copy is the linear-order convention map only — the
      O(beta^2) shear-reading leak is owned by the rev-r141 kinematic
      deprojection, not by this helper
    global_tilt_limit: nonzero beta with homogeneous background class
  forbidden_shortcut_witness: >-
    a state with beta = 0 and sigma2 > 0 must satisfy no_tilt_limit and must
    FAIL flrw_limit — the historical `beta=0 implies EGS/FLRW` shortcut is
    structurally rejected.

theorem_frame_graph:
  artifact: docs/generated/pr125_theorem_frame_graph.json
  rule: >-
    every CHECKED signature in THEOREM_SIGNATURES_V2.yaml binds to exactly
    one registered premise contract; MIGRATION_PENDING entries are excluded
    (their typing is the pending migration); an unbound CHECKED signature
    fails closed.

mutation_registry:
  - mutation_id: unknown_frame_rejected
    kill_rule: constructing a contract with an unregistered frame/order/background/units value raises
  - mutation_id: defaulted_field_rejected
    kill_rule: omitting any contract field raises (no silent defaults outside the labeled reproduction channel)
  - mutation_id: sign_flip_tilt_witness
    kill_rule: a transform claiming boost(A->B).beta == boost(B->A).beta violates the antisymmetry witness and is rejected
  - mutation_id: beta_zero_egs_shortcut
    kill_rule: a state with beta=0, sigma2>0 claiming the FLRW limit is rejected by the limit predicate
  - mutation_id: alias_without_transform
    kill_rule: reading a tilt magnitude across frames without a registered transform raises (scalar alias firewall)
  - mutation_id: unbound_checked_signature
    kill_rule: a CHECKED signature absent from the frame graph fails the graph builder

artifact_contract:
  outputs:
    - docs/generated/pr125_frame_contract_registry.json
    - docs/generated/pr125_theorem_frame_graph.json
    - docs/generated/pr125_kinematic_witness_report.json
    - docs/generated/pr125_mutation_report.json
    - docs/generated/pr125_artifact_manifest.json
  write_policy: validate_all_then_atomic_replace
  check_policy: fresh_build_must_semantically_equal_disk

acceptance_and_kill_switches:
  - every registered mutation executes and is killed
  - round-trip/associativity/antisymmetry witnesses hold exactly (Fractions)
  - beta=0 with nonzero shear fails the FLRW limit (shortcut rejected)
  - every CHECKED signature binds to exactly one registered contract
  - active construction with defaulted/unknown fields raises
  - all 102 remediation findings remain OPEN

forbidden_output_language:
  - frame contract validates physics
  - FLRW certified
  - EGS certified
  - Bianchi geometry detected
  - Bianchi family identified
  - finding rescued
  - validated as native
