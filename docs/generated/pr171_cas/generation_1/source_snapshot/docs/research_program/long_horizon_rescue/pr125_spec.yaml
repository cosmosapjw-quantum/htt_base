claim_identity:
  claim_id: C-PR125-FRAME-CONTRACT
  claim_text: >-
    The typed premise contract (frame, perturbative order, background class,
    units, harmonic convention, redshift/depth convention) is internally
    consistent: frame boosts round-trip exactly, the tilt sign convention
    is registered and machine-witnessed (the vorticity-norm convention is
    registered prose-only in this PR), the FLRW/no-tilt/local-boost/
    global-tilt limits behave as declared, unknown or defaulted fields fail
    closed, and every CHECKED theorem signature binds to exactly one
    registered contract. Convention contract correctness only; no physical
    statement is validated.
  domain: exact_rational_kinematic_witnesses_and_registry_governance
  frame: contract_defines_frames_it_does_not_assume_one
  perturbative_order: contract_field_not_assumption
  claim_level_scheme: roadmap_rescue_v1
  claim_level: C1

