    sigma_lit_range_deg: [10.0, 12.0]
    delta_deg: 4.0
    source: "DOI:10.3847/1538-4357/acf1a4"  # Tully+2023 CF4
    status: "literature-consistent / conservative"

  - probe_id: BiPoSH
    sigma_code_deg: 20.0
