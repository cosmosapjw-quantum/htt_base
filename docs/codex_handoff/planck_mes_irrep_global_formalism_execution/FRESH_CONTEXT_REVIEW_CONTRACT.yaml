schema: htt.planck_mes_irrep_global_formalism.fresh_context_review.v1
package_id: PLANCK_MES_IRREP_GLOBAL_FORMALISM_EXECUTION_20260827
mode: READ_ONLY_FIRST_PASS
scope: ONE_WORK_UNIT_DELTA_ONLY
required_inputs:
- work_unit_id
- authoritative_base_sha
- candidate_final_sha
- base_to_candidate_diff
- work_unit contract from AUDIT_COMPILED_EXEC_PLAN.yaml
- executed verification commands and exit statuses
- objective output paths and identities
- replay and plot-audit status where applicable
- unresolved blockers and candidate dispositions
forbidden_inputs_as_authority:
- implementer chain of thought
- implementer self-review conclusions
- transcript-only success claims
finding_schema:
  severity: P0|P1|P2|P3
  current_task_blocking: boolean
  file: repository path
  line_or_symbol: exact location
  violated_invariant: PMG-INV-* or literal contract statement
  reproducer: command or minimal deterministic evidence
  explanation: why the current delta is defective
  smallest_repair: bounded repair or explicit blocked disposition
review_questions:
- Did the implementation violate an exact type or claim boundary?
- Did it preserve all frozen scalar outputs and operator semantics?
- Did it produce the real objective output required by this work unit?
- Did any observation/null/injection row use a different path?
- Did the implementation add a semantic fallback or suppress a hard row?
- Are output identities, units, frame, basis, row order, and source provenance complete?
- Did scope expand into unrelated refactor or new governance?
- Does PASS cause the declared next executable transition?
pass_condition:
  P0: 0
  P1: 0
pass_transition: Accept the candidate final SHA and execute the work unit transition without another review.
failure_transition: Return findings read-only; the implementer may perform one targeted repair followed by focused
  re-verification and review of the repair delta.
stopping_rule: No further review after PASS. A second repair/review cycle requires a newly reproduced current-task
  P0/P1, not a representation-only or optional-hardening finding.
