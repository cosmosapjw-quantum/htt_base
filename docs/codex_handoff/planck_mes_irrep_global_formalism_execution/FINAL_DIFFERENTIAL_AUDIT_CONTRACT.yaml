schema: htt.planck_mes_irrep_global_formalism.final_differential_audit.v1
package_id: PLANCK_MES_IRREP_GLOBAL_FORMALISM_EXECUTION_20260827
mode: DIFFERENTIAL_STRONG_MODEL_AUDIT
inputs:
- canonical science base SHA/tree
- planning predecessor SHA/tree
- accepted final SHA/tree
- full predecessor-to-final diff
- compiled package
- work-unit terminals and objective artifact identities
- fresh-context findings and repair dispositions
- unresolved blockers
must_answer:
- Did implementation violate a compiled invariant?
- Did the package miss a P0/P1 failure class visible in the actual delta or execution?
- Was any evidence invalid, stale, or misclassified?
- Did scope expand beyond authorization?
- Did a reviewer produce a false PASS or false block?
- Did the workflow reach real mechanism, map, irrep, and power outputs rather than only process artifacts?
must_not_reconsider:
- the entire historical repository from zero
- closed old findings absent a contradictory current delta
- unrelated solver, HSC/KiDS, DESI, CF4, or BASS programme work
- optional full-suite reassurance
- another planning framework or review-of-review
novel_p0_p1_learning:
  required: true
  action: Convert each genuinely new reproduced P0/P1 into one minimal durable regression/invariant or an explicit
    fail-closed gate.
  gate_non_proliferation: Prefer replacing or extending an existing control; do not add duplicate gates.
pass_condition:
  P0: 0
  P1: 0
pass_transition: Close the internal implementation loop and move to external scientific review/submission preparation.
failure_transition: Apply one bounded repair for a reproduced current-deliverable P0/P1 or return a typed blocked
  state; do not restart the project audit.
