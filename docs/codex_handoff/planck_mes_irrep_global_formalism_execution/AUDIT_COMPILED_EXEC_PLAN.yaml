global_invariants:
- ObservableIrrepState, JointAnisotropyState, MesPremiseNormalizer, and ResponseBoundObservableState remain semantically
  and nominally distinct.
- The frozen scalar Planck analysis is immutable and replayable.
- Every new Planck map read preserves the retained 32-dimensional harmonic carrier.
- Observation and null rows use the same operator, projection, reducer, tail, and degeneracy policies within each
  pool.
- Execution permission is separate from scientific claim admission.
- No physical/Bianchi claim is emitted without a certified response/template receipt.
global_transition_policy:
  execution_permission_separate_from_claim_admission: true
  fail_closed_on_claims_not_progress: true
  first_two_work_units: ENABLING_OUTPUT
  first_mandatory_objective_execution: PMG-WU-003
  process_starvation_trigger: two substantial process-only cycles
  on_process_starvation: freeze optional governance and execute PMG-WU-003 or the shortest currently admissible
    objective work unit
  successor_planning_package_before_PMG_WU_003: forbidden
  trusted_verification_boundary:
  - Python runtime and standard numeric serialization
  - Git content identities and exact repository ancestry
  - PyYAML/JSON strict package validator
  - existing frozen Planck operator and scalar result contracts
  - one fresh-context read-only review per work unit
  review_stopping_rule: one fresh review plus at most one targeted repair per work unit
  full_suite_default: false
  pass_must_advance_dag: true
completion_states:
- PASS
- PASS_WITH_NONBLOCKING_FINDINGS
- BLOCKED_BY_UNRESOLVED_SPEC
- BLOCKED_BY_P0
- BLOCKED_BY_P1
- PARTIAL
- FAILED
candidate_dispositions:
- PROMOTED
- REFUTED
- UNRESOLVED
- DEFERRED
- NOT_ATTEMPTED
final_success_definition:
- Global typed formalism is implemented across the listed relevant surfaces.
- The coordinate/reducer mechanism audit is executed on the frozen 301-row pool.
- Paired-300 and extended Planck passes preserve carriers and replay map-free.
- Observable ell=2/3 irrep morphology is calibrated without physical overclaim.
- At least the algebraic injection lane is executed; physical lanes are executed or explicitly deferred.
- The methods-first paper revision builds and passes bounded visual/claim audit.
