schema: htt.planck_mes_irrep_global_formalism.process_cost_assessment.v1
package_id: PLANCK_MES_IRREP_GLOBAL_FORMALISM_EXECUTION_20260827
output_classification:
  objective_outputs:
  - executed coordinate-mechanism result
  - paired-300 carrier and irrep result
  - 999 robustness and Commander descriptive result
  - injection power result
  - rebuilt methods paper
  enabling_outputs:
  - canonical typed formalism
  - minimal adapters and architecture guards
  - read-only data intake
  - targeted regression/property tests
  - map-free replay metadata
  process_outputs:
  - this one execution package
  - one compact work-unit terminal per unit
  - one fresh-context finding set per unit when needed
minimum_required_assurance:
  fresh_reviews_per_work_unit: 1
  targeted_repairs_per_work_unit_without_new_failure_class: 1
  full_suite_required: false
  full_raw_tree_hash_required: false
  native_solver_validation_required: false
  paper_visual_audit_required: true
reuse_instead_of_regenerate:
- frozen PR-314/PR-315/PR-327 scalar artifacts
- existing joint cut-sky operator tests
- existing MES theorem authority and coefficient registry
- existing JointAnisotropyState and orbit_catalogue_v3 physical contracts
- predecessor data inventory as planning input pending WU-004 replay
expensive_work_justified:
- one paired-300 carrier reconstruction because the old package discarded retained alms
- one 999 CMB-only map pass with carrier export
- one Commander descriptive map pass with carrier export
- bounded injection trials on map-free carriers
remove_or_do_not_add:
- another successor planning package
- review of the fresh reviewer
- preflight hashing of every unrelated 910-GiB raw file
- full repository suite after every local work unit
- duplicate provenance reports that copy machine-readable fields
- architecture refactor outside listed migration rows
- re-running map passes solely to change packaging metadata
process_starvation_brake:
  trigger: two substantial consecutive cycles with only process outputs
  response: freeze optional governance and execute PMG-WU-003 or the shortest admissible objective work unit
  prohibited_response: create a PROCESS_STARVATION remediation contract
expected_ratio_after_PMG_WU_003: OBJECTIVE_OUTPUT_PLUS_ENABLING_OUTPUT_GREATER_THAN_PROCESS_OUTPUT
