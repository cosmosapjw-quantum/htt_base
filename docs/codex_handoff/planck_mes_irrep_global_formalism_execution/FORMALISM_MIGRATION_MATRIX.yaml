schema: htt.planck_mes_irrep_global_formalism.migration_matrix.v1
contract_id: PLANCK_MES_GLOBAL_FORMALISM_MIGRATION_V1
migration_policy:
  strategy: ADDITIVE_TYPED_SUCCESSOR_WITH_FROZEN_COMPATIBILITY_SURFACES
  whole_repository_rewrite: false
  legacy_result_mutation: false
  unrelated_lane_migration: false
  completion_definition: Every listed relevant surface either consumes the canonical type, provides an explicit
    adapter, or remains frozen with a tested boundary.
