cross_cutting_checks:
- No function accepts both ObservableIrrepState and JointAnisotropyState through an untyped object parameter.
- No module imports Planck-specific code into common physical-state modules.
- No scalar-only input can construct a nonzero observer or physical vector/STF block.
- Existing scalar packages and exact ranks remain reproducible byte-for-byte or scientifically identical under their
  frozen contract.
- All new result schemas carry candidate commit/tree, source/operator identities, row order, units, frame, basis,
  and claim ceiling.
