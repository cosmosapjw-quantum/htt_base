schema: htt.planck_mes_irrep_global_formalism.formalism_contract.v1
contract_id: PLANCK_LOWELL_OBSERVABLE_IRREP_AND_MES_PREMISE_FORMALISM_V1
conventions:
  spacetime_metric_signature: (-,+,+,+)
  spatial_orientation: epsilon_123=+1
  cmb_harmonics: orthonormal Condon-Shortley
  planck_map_frame: GALACTIC
  planck_map_ordering: HEALPIX_RING
  temperature_map_unit: microK_CMB
  cl_unit: microK_CMB^2
  epsilon_l_unit: dimensionless
  mes_ceiling_unit: dimensionless
  joint_cutsky_fit_band: ell=0..5
  retained_carrier_band: ell=2..5
  retained_real_harmonic_dimension: 32
typed_layers:
- type: ObservableIrrepState
  proposed_module: htt/src/common/observable_irrep_state.py
  meaning: Measured or simulated observer-space O(3) irreducible harmonic/STF content with bound frame, basis, units,
    and operator provenance.
  may_contain:
  - real spherical-harmonic blocks
  - Cartesian STF2 and STF3 blocks
  - typed absent shapes or contractions on degenerate strata
  must_not_claim:
  - physical shear
  - physical vorticity
  - physical acceleration
  - anisotropic spatial curvature
  - Bianchi family
  - native transfer response
- type: JointAnisotropyState
  existing_module: htt/src/common/joint_anisotropy_state.py
  meaning: Physical pre-solver kinematic, velocity-frame, and geometry state.
  input_boundary: Only direct physical state construction or a separately authorized physical adapter may construct
    this type.
  must_not_accept:
  - scalar MES ceilings
  - Planck feature rows
  - ObservableIrrepState without a response inversion contract
- type: MesPremiseNormalizer
  proposed_module: htt/src/common/mes_premise_normalization.py
  meaning: One-way channel-typed MES premise bound and radial normalization report.
  semantics:
  - normalizes an already supplied compatible numerator or observable coordinate
  - does not create direction, STF shape, physical response, or independent information
- type: ResponseBoundObservableState
  proposed_module: htt/src/common/response_bound_observable_state.py
  meaning: ObservableIrrepState explicitly bound to a certified forward-response identity and physical source channel.
  construction_gate:
  - response identity is content-bound
  - frame, basis, units, epoch, and normalization match
  - response rank/identified-set status is recorded
  claim_ceiling_without_identification: diagnostic_only
type_firewalls:
- id: TYPE-FW-001
  rule: ObservableIrrepState is never an alias, subclass, or implicit constructor input for JointAnisotropyState.
  violation_severity: P0
- id: TYPE-FW-002
  rule: MES scalar values may scale compatible amplitudes but may not generate nonzero vector or STF components.
  violation_severity: P0
- id: TYPE-FW-003
  rule: common.orbit_catalogue_v3 remains a physical-state catalogue; observable-space orbit diagnostics use a separate
    module and vocabulary.
  violation_severity: P0
- id: TYPE-FW-004
  rule: Typed absence is preserved on zero-amplitude, repeated-root, undefined-plane, or noncyclic strata; no fallback
    axis is synthesized.
  violation_severity: P1
mes_coordinate_identities:
  premise: SAG observer-motion branch with residual cosmological epsilon_1=0
  definitions:
  - epsilon_l = sqrt((2*l+1)*C_l/(4*pi))/T0
  - B_sigma = 3*epsilon_2 + (3/7)*epsilon_3
  - B_omega = (2/15)*epsilon_2
  - Sigma2_max = (3/2)*B_sigma^2
  - W2_max = (3/2)*B_omega^2
  exact_identities:
  - W2_max = C_2/(30*pi*T0^2)
  - Sigma2_max = (27/98)*(7*epsilon_2 + epsilon_3)^2
  inverse_on_nonnegative_domain:
  - epsilon_2 = sqrt((75/2)*W2_max)
  - epsilon_3 = sqrt((98/27)*Sigma2_max) - 7*epsilon_2
  - C_l = 4*pi*T0^2*epsilon_l^2/(2*l+1)
  information_statement: sigma(Sigma2_max,W2_max,M) = sigma(C_2,C_3,M) on the registered nonnegative domain
  independent_information_gain: false
  w_axis_rank_statement: Every complete-pool coordinate rank for W2_max is identical to the corresponding C_2 rank
    under the legacy absolute-deviation reducer because W2_max is a positive constant multiple of C_2.
epsilon1_sensitivity:
  general_carriers:
  - B_sigma = (5/3)*epsilon_1 + 3*epsilon_2 + (3/7)*epsilon_3
  - B_omega = (10/3)*epsilon_1 + (2/15)*epsilon_2
  required_scan:
    minimum: 0.0
    maximum: 1.0e-05
    points: 101
    spacing: linear
  output:
  - Sigma2_max(epsilon_1)
  - W2_max(epsilon_1)
  - ratio_to_epsilon1_zero
  - rank sensitivity only when the same epsilon1 branch is applied rowwise to all rows
  claim: The epsilon_1=0 result is premise-conditioned and must not be reported with precision that hides this sensitivity.
finite_null_reducers:
- id: LEGACY_ABSOLUTE_MEDIAN_V1
  definition: D_ij = |X_ij - median(X_-i,j)| followed by complete-pool conservative ranks
  invariance: positive affine scaling only; not invariant to general monotone reparameterization
  role: frozen legacy baseline and mechanism comparison
- id: LOO_ECDF_MIDRANK_V1
  definition: u_ij = (count(X_kj<X_ij,k!=i)+0.5*count(X_kj=X_ij,k!=i))/(N-1)
  two_sided_score: 2*|u_ij-1/2|
  upper_score: u_ij
  lower_score: 1-u_ij
  invariance: exact under strictly increasing coordinatewise transforms with identical tie structure
  tie_policy: midrank at the coordinate transform, conservative complete-pool inequality at the family rank
  role: coordinatewise monotone-invariant companion analysis
tail_registries:
- id: LEGACY_ALL_TWO_SIDED_V1
  status: FROZEN_BASELINE
  coordinates:
    all_existing_scalar_coordinates: two-sided
  role: Exact reproduction of the PR-327 scalar baseline only.
- id: REGISTERED_PHYSICS_ORIENTED_SCALAR_V1
  status: DESCRIPTIVE_COMPANION_NOT_RETROACTIVE_PRIMARY
  coordinates:
    Sigma2_max: upper
    W2_max: upper
    parity_even_over_odd_l2_l5: two-sided
    power_tensor_gap_l2: upper
    power_tensor_gap_l3: upper
    multipole_l2_absdot: two-sided
    multipole_l3_absdot_0: two-sided
    multipole_l3_absdot_1: two-sided
    multipole_l3_absdot_2: two-sided
    multipole_plane_alignment_max_l2_l3: upper
  reason: Ceilings, power-tensor concentration, and quadrupole-octupole alignment have predeclared upper-direction
    interpretations; remaining shape coordinates retain two-sided atypicality.
- id: OBSERVABLE_IRREP_ORBIT_V1
  status: PRIMARY_FOR_NEW_IRREP_ANALYSIS_FROZEN_BEFORE_EXECUTION
  rules:
  - 'nonnegative radial amplitudes q2 and o2: two-sided CMB-atypicality'
  - 'signed or bounded intrinsic shape invariants including J_Q: two-sided'
  - 'unsigned normalized alignment/concentration statistics: upper'
  - 'pseudoscalars: two-sided unless an oriented physical template predeclares a sign'
  - typed-absent coordinates follow the frozen row-disposition policy and are never zero-filled
factorial_coordinate_mechanism:
  common_morphology_block: M
  cells:
  - id: EPS_LINEAR
    coordinates:
    - epsilon_2
    - epsilon_3
    - M
    square: false
    mix: false
  - id: SQUARE_ONLY
    coordinates:
    - epsilon_2^2
    - epsilon_3^2
    - M
    square: true
    mix: false
  - id: CARRIER_ONLY
    coordinates:
    - B_sigma
    - B_omega
    - M
    square: false
    mix: true
  - id: MES_SQUARED
    coordinates:
    - B_sigma^2
    - B_omega^2
    - M
    square: true
    mix: true
  required_contrasts:
  - square_without_mix = rank(SQUARE_ONLY)-rank(EPS_LINEAR)
  - square_with_mix = rank(MES_SQUARED)-rank(CARRIER_ONLY)
  - mix_linear = rank(CARRIER_ONLY)-rank(EPS_LINEAR)
  - mix_squared = rank(MES_SQUARED)-rank(SQUARE_ONLY)
  - interaction = [rank(MES_SQUARED)-rank(CARRIER_ONLY)]-[rank(SQUARE_ONLY)-rank(EPS_LINEAR)]
  forbidden_interpretation: Do not force an additive convexity-plus-mixing decomposition when the discrete rank
    functional has a nonzero interaction.
observable_irrep_blocks:
- id: T_L2
  ell: 2
  representation:
  - REAL_SPHERICAL_HARMONIC_5
  - CARTESIAN_STF2_5
  parity: EVEN
  units: microK_CMB
  symbol: Q_ab
- id: T_L3
  ell: 3
  representation:
  - REAL_SPHERICAL_HARMONIC_7
  - CARTESIAN_STF3_7
  parity: ODD_UNDER_DIRECTION_INVERSION_AS_ELL3_SCALAR_HARMONIC
  units: microK_CMB
  symbol: O_abc
- id: T_L4
  ell: 4
  representation:
  - REAL_SPHERICAL_HARMONIC_9
  status: CARRIER_PRESERVED_PROJECTION_DEFERRED_UNLESS_POWER_GAIN_JUSTIFIES
  units: microK_CMB
- id: T_L5
  ell: 5
  representation:
  - REAL_SPHERICAL_HARMONIC_11
  status: CARRIER_PRESERVED_PROJECTION_DEFERRED_UNLESS_POWER_GAIN_JUSTIFIES
  units: microK_CMB
observable_orbit_morphology:
  module: htt/obsstat/observable_irrep_orbit.py
  required_quantities:
  - q2 = Q_ab Q^ab
  - q3 = Q_a^b Q_b^c Q_c^a
  - J_Q = sqrt(6)*q3/q2^(3/2) when q2>0
  - o2 = O_abc O^abc
  - v_a = O_abc Q^bc
  - S_ab = STF(O_acd O_b^cd)
  - R_v0 = v_a v^a
  - R_v1 = v_a Q^a_b v^b
  - R_v2 = v_a (Q^2)^a_b v^b
  - R_QS = Q_ab S^ab
  - K_v = det(v,Qv,Q^2v) with explicit parity and scale normalization when defined
  shape_normalization:
  - Qhat_ab = Q_ab/sqrt(q2) for q2>0
  - Ohat_abc = O_abc/sqrt(o2) for o2>0
  - no shape at zero amplitude
  mathematical_boundaries:
  - For real symmetric trace-free Q, Delta_Q = q2^3/2 - 3*q3^2 >= 0.
  - J_Q lies in [-1,1] where defined.
  - Cayley-Hamilton reduces Q powers k>=3 to k<=2.
  - The registered catalogue is a diagnostic separating family; generic/global completeness remains UNPROVEN.
  orientation_policy:
  - Orbit-invariant family is primary for frame-free morphology.
  - Absolute Galactic/ecliptic orientation is a separately registered descriptive family.
  - Antipodal or plane degeneracies produce typed absence, not a substituted power-tensor axis.
carrier_package:
  schema: PLANCK_PR3_LOWELL_IRREP_CARRIER_V1
  arrays:
    observed_real_alm:
    - 32
    null_real_alm_paired300:
    - 300
    - 32
    null_real_alm_cmbonly999:
    - 999
    - 32
  required_metadata:
  - row_ids in exact order
  - real_alm_layout
  - map frame and HEALPix ordering
  - map and coefficient units
  - joint-cutsky operator identity
  - mask identity and f_sky
  - source and target beam/pixel transfer identities
  - nside and smoothing/degrade specification
  - source input content identities
  - candidate commit and tree
  - weighted residual diagnostics
  serialization: NUMPY_NPZ_NO_PICKLE_PLUS_STRICT_JSON_METADATA
  old_feature_package_mutation: false
injection_contract:
  equation: a_lm^(r,A,R) = a_lm^(r) + A*sum_m' D^l_mm'(R)*t_lm'
  lanes:
  - id: ALGEBRAIC_HARMONIC_TEMPLATE
    claim_ceiling: METHOD_POWER_ONLY
    requirements:
    - fixed template coefficients
    - fixed amplitude grid
    - fixed orientation quadrature
    - same operator and reducer
  - id: PHYSICAL_BIANCHI_TEMPLATE
    claim_ceiling: CONDITIONAL_PHYSICAL_SENSITIVITY
    requirements:
    - template artifact content identity
    - solver commit/tree and authority
    - frame, normalization, epoch, transfer, and units
    - same beam/mask/operator
    - explicit family and global-tilt/local-boost semantics
    missing_artifact_disposition: DEFERRED_NOT_ATTEMPTED_NOT_REFUTED
  required_outputs:
  - power(A,R)
  - orientation_marginal_power(A)
  - A50
  - A90
  - scalar_vs_irrep_power_ratio
  threshold: p_family<0.05 using the predeclared reducer/tail family
