schema_version: common.artifact_gate_outputs.v2
purpose: >
  Compatibility annotations for generated DAG rows. This file cannot grant a
  claim capability, scientific readiness, production validation, manuscript
  use, native status, or public use. Those axes require an exact factory-issued
  ClaimCapabilityDecision; without one the status snapshot remains internal
  and records claim_capability_decision_absent.

state_annotations:
  completed:
    caption_policy:
      - must_state_dag_row_not_science_readiness
      - must_state_no_capability_decision
    promotion_blockers:
      - claim_capability_decision_absent
    report_generation_gates:
      dag_status_row_generated: pass
  blocked:
    caption_policy:
      - must_state_blocker
      - must_state_no_capability_decision
    promotion_blockers:
      - dag_status_blocked
      - claim_capability_decision_absent
    report_generation_gates:
      dag_status_row_generated: pass
  not_completed:
    caption_policy:
      - must_state_not_completed
      - must_state_no_capability_decision
    promotion_blockers:
      - dag_status_not_completed
      - claim_capability_decision_absent
    report_generation_gates:
      dag_status_row_generated: pass

pr_annotations:
  PR-080:
    caption_policy:
      - must_state_external_transfer_path
      - must_state_not_native_solver_result
    promotion_blockers:
      - native_transfer_validation_absent
  PR-082:
    caption_policy:
      - must_state_atlas_metadata_only
      - must_state_no_family_identification
    promotion_blockers:
      - native_morphology_atlas_absent
  PR-083:
    caption_policy:
      - must_state_schema_only
      - must_state_adapter_stub_no_science_values
    promotion_blockers:
      - native_solver_outputs_absent
  PR-100:
    caption_policy:
      - must_state_diagnostic_only_certificate
      - must_state_not_posterior_or_truth
    promotion_blockers:
      - covariance_null_status_incomplete_for_public_claim
  PR-101:
    caption_policy:
      - must_state_depth_coherence_diagnostic_only
    promotion_blockers:
      - depth_null_calibration_incomplete_for_public_claim
  PR-102:
    caption_policy:
      - must_state_flrw_tension_diagnostic_only
    promotion_blockers:
      - null_predictive_distribution_not_publication_grade
  PR-110:
    caption_policy:
      - must_state_scalar_scores_do_not_identify_geometry
      - must_state_native_morphology_atlas_absent
    promotion_blockers:
      - native_morphology_atlas_absent
      - family_equivalence_gate_absent
  PR-111:
    caption_policy:
      - must_state_local_global_candidate
      - must_state_rank_fpr_ppc_loocv_gates
    promotion_blockers:
      - matched_null_ppc_loocv_not_publication_grade
      - survey_systematic_fpr_gate_incomplete
  PR-112:
    caption_policy:
      - must_state_mio_diagnostic_only
      - must_state_not_htt_evidence
    promotion_blockers:
      - mio_is_not_posterior
  PR-113:
    caption_policy:
      - must_state_figure_inventory_not_content_audit
    promotion_blockers:
      - figure_pixel_audit_not_claimed
  PR-114:
    caption_policy:
      - must_state_disclosure_package_not_publication_readiness
      - must_state_transfer_conditional
    promotion_blockers:
      - native_solver_validation_absent
      - pdf_claim_lint_required
  PR-115:
    caption_policy:
      - must_state_claim_freeze_not_submission_approval
    promotion_blockers:
      - native_solver_validation_absent
      - public_claims_capped
