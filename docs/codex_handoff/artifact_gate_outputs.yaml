schema_version: common.artifact_gate_outputs.v1
purpose: >
  Separate DAG completion bookkeeping from artifact readiness, allowed use,
  and science/publication promotion gates. A completed PR can generate a useful
  audit artifact without becoming production-validated science.

state_defaults:
  completed:
    claim_tier: diagnostic_only
    artifact_readiness: generated
    artifact_mode: governance_diagnostic
    allowed_use: external_audit
    production_validated: false
    manuscript_used: false
    caption_policy:
      - must_state_dag_row_not_science_readiness
      - must_state_no_native_solver_validation
    promotion_blockers:
      - native_solver_validation_absent
    report_generation_gates:
      dag_status_row_generated: pass
    science_promotion_gates:
      native_solver_validation: not_applicable
    publication_gates:
      dag_completion_not_publication_readiness: pass
  blocked:
    claim_tier: blocked
    artifact_readiness: blocked
    artifact_mode: governance_diagnostic
    allowed_use: internal_only
    production_validated: false
    manuscript_used: false
    caption_policy:
      - must_state_blocker
    promotion_blockers:
      - dag_status_blocked
    report_generation_gates:
      dag_status_row_generated: pass
    science_promotion_gates:
      blocked: fail
    publication_gates:
      blocked: fail
  not_completed:
    claim_tier: diagnostic_only
    artifact_readiness: missing
    artifact_mode: governance_diagnostic
    allowed_use: internal_only
    production_validated: false
    manuscript_used: false
    caption_policy:
      - must_state_not_completed
    promotion_blockers:
      - dag_status_not_completed
    report_generation_gates:
      dag_status_row_generated: pass
    science_promotion_gates:
      implementation_complete: fail
    publication_gates:
      implementation_complete: fail

