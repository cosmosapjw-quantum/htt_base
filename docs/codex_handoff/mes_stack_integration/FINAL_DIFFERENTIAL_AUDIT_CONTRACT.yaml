schema: htt.mes_stack_integration.final_differential_audit.v1
inputs:
- integration_base..final
- compiled contract
- evidence bundle
- fresh review findings
- blockers
questions:
- Did implementation violate a compiled invariant?
- Did the contract miss a P0/P1 visible in the delta?
- Was any imported evidence altered or misclassified?
- Did scope expand into bulk PR merge, security, or unrelated science?
- Did the fresh reviewer issue a false PASS or false blocker?
do_not_restart_full_project_audit: true
absorption_rule: Novel P0/P1 becomes the smallest nonduplicative regression/assertion/STOP.
