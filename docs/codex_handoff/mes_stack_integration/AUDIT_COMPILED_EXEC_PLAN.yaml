user_locks:
- restore MES methodology as the scientific spine
- preserve PR314 133/301 as benchmark control
- preserve SMICA-only exact-300 fast path
- private single-researcher; no security architecture
- preserve existing DAG order and edges
- integrate committed work by ancestry or exact source disposition, not bulk merge
source_precedence:
- latest owner decision
- current integrated branch
- repaired PR321 science/code
- exact imported PR411 package
- exact imported PR404 plan
- exact imported PR403 evidence
- other open PRs according to disposition ledger
defaults:
