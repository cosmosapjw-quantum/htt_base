  - command: git merge-base --is-ancestor 4733a4c6dbc638372dee7f99ac38f39dba56d933 HEAD && git merge-base --is-ancestor 5a3825f903546891fd90e3d708481707d59babf4 HEAD
    expect: exit=0
  - command: git status --porcelain=v1 --untracked-files=all
    expect: empty
  completion_evidence:
  - base_sha
  - final_sha
  - final_tree
  - git_diff_stat
  - git_diff_check
  - executed_tests
  - generated_evidence
  - unresolved_blockers
  agent_policy:
    ask_user_questions: false
    guessing_across_spec_boundary: forbidden
    unresolved_spec_action: BLOCKED_BY_UNRESOLVED_SPEC
    changing_tests_to_fit_implementation: forbidden
    changing_reference_outputs_without_authority: forbidden
    suppressing_failures: forbidden
    claiming_unexecuted_work: forbidden
    another_planning_successor: forbidden
  review_gate:
    fresh_context_required: true
    reviewer_first_pass: read_only_findings_only
    pass_condition:
      P0: 0
      P1: 0
