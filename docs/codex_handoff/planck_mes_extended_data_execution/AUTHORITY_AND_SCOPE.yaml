allowed_scope:
- Verify the additional local data inventory without mutating raw inputs.
- Execute a separate 999-CMB-only SMICA robustness lane.
- Execute a Commander observation-only descriptive comparison.
- Rebind clean submission provenance and add a bounded robustness supplement.
- Classify all other available datasets into separate future scientific lanes.
forbidden_scope:
- Replace the paired 300 CMB+noise Paper A result with a CMB-only result.
- Use three Commander simulations or partial files as a calibrated null ensemble.
- Claim NPIPE/PR4 or HSC availability when the reported directories contain no such payload.
- Mix Planck component-separation products under an unregistered shared null model.
- Promote ACT, CF4, DESI, KiDS, JWST, SPT, BICEP/Keck, or theory archives into Paper A without a separate scientific contract.
- Modify canonical DAG/status mirrors in this planning package.
- Commit raw or downloaded observational payloads.
explicit_non_goals:
