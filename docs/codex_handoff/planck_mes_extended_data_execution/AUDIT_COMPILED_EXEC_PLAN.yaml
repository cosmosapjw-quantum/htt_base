  on_process_starvation: freeze optional governance and execute the shortest safe current work unit
  trusted_verification_boundary: [git object identity, Python JSON/YAML parsers, focused Planck/MES regression suites, FITS reader and release checksum sidecar]
  review_stopping_rule: one fresh-context review plus at most one targeted repair unless a new reproduced current-task P0/P1 appears
