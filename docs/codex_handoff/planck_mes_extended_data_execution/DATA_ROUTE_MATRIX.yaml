schema: htt.planck_mes_extended_data.route_matrix.v1
principle: Paper A Planck robustness is immediate; non-Planck datasets are routed without being silently promoted into the MES result.
routes:
- id: planck_primary_paired_300
  data:
  - planck_data/smica_map
  - planck_data/temperature_mask
  - planck_ffp10/smica_cmb_00000_00299
  - planck_ffp10/smica_noise_00000_00299
  status: FROZEN_PRIMARY_AUTHORITY
  scientific_role: Paper A primary paired CMB+noise conditional finite-null analysis
  claim_ceiling: C2_CONDITIONAL_DIAGNOSTIC_ONLY
  work_unit: null
- id: planck_smica_cmbonly_999
  data:
  - planck_data/smica_map
  - planck_data/temperature_mask
  - planck_ffp10/smica_cmb_999_complete_except_00970
  status: EXECUTE_NOW_AFTER_INTAKE
  scientific_role: CMB-only robustness empirical rank on a separate 1000-row complete pool
  claim_ceiling: C2_ROBUSTNESS_NOT_TYPE_I_CALIBRATED
  work_unit: PED-WU-002
- id: planck_commander_observation
  data:
  - planck_data/commander_map
  - planck_data/temperature_mask
  - planck_ffp10/commander_complete_00000_00002
  status: EXECUTE_DESCRIPTIVE_ONLY
  scientific_role: Observation-level component-separation feature delta and three-row implementation sanity
  claim_ceiling: EXPLORATORY_NONAUTHORITATIVE_NO_FINITE_RANK
  work_unit: PED-WU-003
- id: planck_commander_finite_null
  data:
  - planck_ffp10/commander_complete_00000_00002
  - planck_ffp10/commander_partial_00003_00006
  status: BLOCKED_INSUFFICIENT_COMPLETE_NULLS
  scientific_role: No calibrated Commander finite-null result
  claim_ceiling: NONE
  work_unit: null
- id: planck_npipe_pr4
  data:
  - planck_npipe_pr4
  status: BLOCKED_MISSING_DATA
  scientific_role: No PR4/NPIPE robustness claim
  claim_ceiling: NONE
  work_unit: null
- id: submission_provenance_rebind
  data:
  - current_map_free_paper_inputs
  - PED-WU-001 intake
  - PED-WU-002 result
  - PED-WU-003 result
  status: EXECUTE_AFTER_PLANCK_ROBUSTNESS
  scientific_role: Clean source/commit/tree rebind and bounded robustness supplement
  claim_ceiling: PAPER_A_PRIMARY_CLAIM_UNCHANGED
  work_unit: PED-WU-004
- id: act_dr6_lensing_control
  data:
  - act_data
  - act_dr6_lensing
  - downloads/act_dr6_lensing
  status: DEFER_SEPARATE_TRACK
  scientific_role: Lensing/systematics control; not an MES temperature ceiling and not a Paper A blocker
  claim_ceiling: SEPARATE_C2_CONTROL_ONLY
  work_unit: null
- id: cf4_directional_lowz_paper_b
  data:
  - cf4/CF4pp_mean_std_grids.npz
  - cf4_full/table2.dat
  - cf4_full/table3.dat
  - cf4_full/table4.dat
  status: DEFER_UNTIL_PHYSICAL_RESPONSE_AUTHORITY
  scientific_role: Preferred directional low-z Paper B candidate for local/global response discrimination
  claim_ceiling: NO_LOCAL_GLOBAL_LABEL_WITHOUT_RESPONSE_RANK
  work_unit: null
- id: desi_mock_calibrated_control
  data:
  - desi
  - desi_dr1_mocks
  - desi_dr1_fullshape_bgs_bright_v1.2
  status: DEFER_SEPARATE_TRACK
  scientific_role: Mock-calibrated density/tomographic control; compressed fullshape products remain scalar controls
  claim_ceiling: NO_DIRECTION_FROM_COMPRESSED_STATISTICS
  work_unit: null
- id: kids_spin2_candidate
  data:
  - hsc_kids/kids
  - hsc_kids/kids_dr5_candidate
  status: DEFER_RELEASE_AND_CALIBRATION_ADMISSION
  scientific_role: KiDS spin-2 directional candidate; HSC is not present
  claim_ceiling: NO_HSC_OR_CROSS_SURVEY_CLAIM
  work_unit: null
- id: jwst_2mrs_local_velocity_candidate
  data:
  - jwst_sn
  - jwst_anchors
  status: DEFER_SEPARATE_TRACK
  scientific_role: Local velocity/anchor candidate for a future local-boost control
  claim_ceiling: NO_DIRECT_MES_OR_GLOBAL_TILT_CLAIM
  work_unit: null
- id: spt_actdr4_bk_crosscmb_controls
  data:
  - downloads
  - cobaya_packages/data
  status: DEFER_SEPARATE_TRACK
  scientific_role: Cross-experiment CMB controls after Paper A
  claim_ceiling: NO_PAPER_A_BLOCKING_ROLE
  work_unit: null
- id: pr171_theory_sources
  data:
  - pr171_primary_sources
  status: THEORY_SOURCE_ONLY
  scientific_role: Future response/formalism provenance; not observational evidence
  claim_ceiling: NO_OBSERVED_RESULT
  work_unit: null
next_route_after_paper_a:
  preferred: cf4_directional_lowz_paper_b
  condition: A physical covariant response operator and depth-rank criterion are implemented and validated.
  fallback: act_dr6_lensing_control
  reason: CF4 is direction-indexed and low-z, whereas ACT lensing is a separate CMB control rather than a local/global discriminator.
