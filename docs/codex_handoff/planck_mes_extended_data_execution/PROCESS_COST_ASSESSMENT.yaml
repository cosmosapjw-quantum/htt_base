schema: htt.planck_mes_extended_data.process_cost.v1
remove_or_do_not_add:
- another planning successor after this package
- review-of-review or meta-audit
- full repository suite by default
- preflight hashing of every unrelated 910-GiB raw file
- duplicate provenance reports
- new canonical DAG nodes for planning aliases
reuse:
- prepare_planck_pr3_admission.py official index and raw-manifest logic
- run_planck_pr3.py joint cut-sky operator and attended-execution pattern
- run_planck_mes_morphology.py active MES factory and map-free rank scan
- tests/paper/test_planck_mes_first_paper.py canonical rank and claim locks
- tests/integration/test_planck_mes_morphology.py primary MES replay
- existing SHA256SUMS.raw_fits.available1299.txt checksum sidecar
reference_not_regenerate:
- current 301-row primary map-free package
- PR-314 generic benchmark result
- theory/CAS receipts not touched by these work units
- existing manuscript figures unless source changes
expensive_work_not_justified_now:
- Commander finite-null download campaign
- Planck NPIPE/PR4 acquisition
- ACT/DESI/KiDS/JWST multi-probe integration
- full 999-row Commander or alternate-mask study
- native Bianchi transfer/atlas
- Paper B local/global response implementation
minimum_required_assurance:
  package_validation: 1
  fresh_reviews_per_work_unit: 1
  targeted_repairs_per_review: 1
  full_suite_required: false
objective_output_ratio_rule: Every implementation work unit must produce at least one executable result/terminal, not only documents.
