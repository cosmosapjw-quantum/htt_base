schema: htt.planck_mes_extended_data.final_differential_audit.v1
inputs:
- base_sha..final_sha
- compiled execution plan
- final evidence bundle
- fresh-context findings
- unresolved blockers
questions:
- Did implementation violate the compiled contract?
- Did the contract miss a P0/P1 failure class visible in the delta?
- Was any evidence invalid or misclassified?
- Did scope expand beyond Planck robustness and provenance?
- Did the fresh reviewer produce a false PASS or false FAIL?
must_not_reconsider:
- The original MES theory program from zero.
- The already settled primary 301-row ranks absent a reproduced conflict.
- Commander/999/NPIPE as prerequisites for the already completed first draft.
- All deferred ACT/CF4/DESI/KiDS/JWST/SPT/BK tracks.
- The verification framework itself.
novel_p0_p1_policy: Convert only a newly reproduced failure class into one minimal durable guard.
pass_condition:
  P0: 0
  P1: 0
pass_transition: Merge/advance the completed work unit; after PED-WU-004 begin external scientific review or submission preparation.
