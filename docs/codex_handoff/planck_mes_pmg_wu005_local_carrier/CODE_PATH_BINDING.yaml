schema: htt.planck_mes.pmg_wu005.code_path_binding.v1
frozen_operator:
  fit: htt/obsstat/planck_pr3_operator.py::fit_joint_cutsky_alm
  fit_output: JointCutSkyFit.retained_alm and retained_coefficients
  retained_dimension: 32
  layout: real_alm_layout(lmin=2,lmax=5)
current_worker:
  path: scripts/observed_runs/run_planck_pr3.py
  row_function: _process_map
  current_return: features, timings, alm
  loss_point_1: _process_ffp10_component discards the returned alm and retains only features
  loss_point_2: run_pr315_joint_cutsky_attended discards observed alm and writes only the scalar feature package
raw_preparation:
  path: scripts/observed_runs/prepare_planck_pr3_admission.py
  functions:
  - inspect_smica_cmb_noise_inventory
  - read_temperature_fits
  - reduce_temperature_map
  - reduce_smica_cmb_plus_noise
  - read_temperature_beam
  - read_mask_fits
  - reduce_mask
  pair_semantics: CMB_i + noise_i in K_CMB before one band-limited reduction to microK_CMB
required_local_delta:
- capture the existing third return from _process_map without a second fit
- add a one-pass feature+carrier null-row path while preserving exact row order
- capture the observed retained alm from the same frozen operator context
- write carrier through obsstat.planck_irrep_carrier and compare carrier-derived scalar rows
- do not change fit mathematics, tolerances, mask, beam/pixel order, multipole-vector conventions, or frozen scalar package
forbidden_shortcuts:
- reconstruct carrier from the 12 scalar features
- rerun a different estimator for carrier only
- drop a failed row
- loosen scalar closure tolerance after seeing results
- call observable carrier physical shear, vorticity, tilt, curvature, or Bianchi family
