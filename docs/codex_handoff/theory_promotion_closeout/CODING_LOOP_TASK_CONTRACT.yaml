bounded_solutions:
- id: A
  description: execute PR407's full A-F plus E1-E5 sequence
  decision: REJECT
  reason: new-theory debt blocks existing survivor closeout
- id: B
  description: research-first survivor manifest, status projection, exact replay,
    novelty gate, focused overlay
  decision: SELECT
  reason: smallest coherent closeout with no new theory
- id: C
  description: status-only documentation patch without tests or evidence binding
  decision: REJECT
  reason: cannot prevent recurrence of P0/P1
implementation:
  ordered_units:
  - CLOSEOUT-A-RESEARCH-EVIDENCE-FREEZE
  - CLOSEOUT-B-STATUS-AND-RELEASE-PROJECTION
  - CLOSEOUT-C-EXACT-RESULT-REPLAY
  - CLOSEOUT-D-NOVELTY-AND-SURVIVOR-OVERLAY
  - CLOSEOUT-E-FOCUSED-CI-AND-FRESH-REVIEW
  policy:
  - RED test before production edit
  - smallest coherent patch
  - no unrelated cleanup
  - no new abstraction without a current consumer
  - one risk family per commit and review gate
validation:
  software:
  - JSON/YAML parse
  - imports and targeted tests
  - executable command syntax
  - DAG snapshot comparator
  - git diff --check
  scientific:
  - exact statement and domain
  - broad-parent/narrow-child separation
  - truth/campaign/release orthogonality
  - novelty and publication role
  - forbidden claim scan
  numerical:
  - zero-tolerance rational fixture
  - exact integer Jacobian witness
  - symbolic chain rule
  - exact target contradiction
  reproducibility:
  - content-bound source/evidence/replay manifest
  - canonical deterministic projection
  - clean merge-ref focused CI
independent_review:
  fresh_context: true
  first_pass_read_only: true
  pass_condition:
    P0: 0
    P1: 0
completion_bar:
- all work units Done, Blocked, or Cancelled
- no unresolved spec guessed
- unrun checks and reasons recorded
- no unnecessary diff
- complete evidence bundle
