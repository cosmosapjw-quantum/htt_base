task_contract:
  user_visible_goal: produce a current survivor overlay for already-established theory
    results without developing new theory
  scope:
  - survivor statement/evidence manifest
  - campaign versus survivor-release separation
  - exact replay of existing results
  - novelty/publication-role gate
  - focused CI and fresh review
  non_goals:
  - solve all NOT_ATTEMPTED proposals
  - derive PR210 frame transformation
  - derive PR216 branch-complete constraints
  - prove PR223 moment-cone theorem
  - modify observed-data lanes
  - security or authorization infrastructure
  preserve:
  - all historical artifacts byte-for-byte
  - broad parent failure/inconclusive status
  - NOT_ATTEMPTED distinct from REFUTED
  - existing DAG node order and edges
  acceptance:
  - evidence precedes status
  - P0=0 and P1=0
  - survivor release may close while campaign remains OPEN
  - all exact formulas replay
  - novelty remains blocking where unassessed
  approval_boundary:
  - new theorem
  - new dependency
  - historical status rewrite
  - DAG edge rewrite
  - scientific statement or domain change
