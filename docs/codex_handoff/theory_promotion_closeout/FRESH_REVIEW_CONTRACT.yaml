schema: htt.theory_survivor_fresh_review.v1
fresh_context_required: true
reviewer_may_modify_code_on_first_pass: false
reviewer_inputs:
- exact PR407 terminal receipt
- base SHA
- final SHA and tree
- research loop closeout
- scientific contract
- validation matrix
- threat catalog
- compiled execution plan
- final diff
- RED and GREEN logs
- exact replay receipts
- survivor evidence manifest
- novelty table
- DAG before/after snapshots
- clean CI logs
review_dimensions:
- claim-source consistency
- mathematical correctness
- domain and assumption fidelity
- truth/evidence/replay/release separation
- campaign versus survivor-release separation
- novelty and publication-role precision
- DAG append-only preservation
- missing negative or metamorphic test
- scope expansion into new theory
output_only:
- severity
- exact_file_and_line
- violated_invariant
- reproducer
- missing_test_or_assertion
pass_condition:
  P0: 0
  P1: 0
implementation_explanation_is_authority: false
