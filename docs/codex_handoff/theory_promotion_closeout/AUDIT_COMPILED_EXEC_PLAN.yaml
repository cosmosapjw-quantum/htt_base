    command: python -m pytest -q tests/contracts/test_theory_survivor_closeout.py --collect-only
    expect: exit=0 after the first RED-test commit
  - id: PRE-008
    command: git diff --check
    expect: exit=0

verification:
  targeted:
    - PYTHONPATH=htt:htt/src:htt/htt python -m pytest -q tests/contracts/test_theory_survivor_closeout.py
  numerical:
    - exact PR284 Fraction projection
    - exact VT-T8 determinant and dimension
    - exact VT-T13 chain rule
    - exact PR190 target contradiction
  regression:
    - python scripts/codex_harness/sync_pr_dag_mirrors.py --check
    - python scripts/codex_harness/validate_pr_dag.py docs/codex_handoff/pr_backlog.yaml --status docs/codex_handoff/pr_status.yaml --strict-rescue-slice
    - git diff --check
  negative:
    - try to project truth ESTABLISHED into PROMOTED without a campaign receipt
    - keep a survivor blocked only because NOT_ATTEMPTED count is nonzero
    - claim universal candidate closure from registered source closure
    - count VT-S14 as a theorem
    - call VT-T8 global orbit separation
    - call PR284 a general reverse-martingale theorem
    - run implementation without exact PR407 audited-input terminal
    - run implementation without exact PR408 controlling terminal commit and tree
  metamorphic:
    - engine availability changes replay but not truth
    - candidate ordering changes no statement identity
    - equivalent source serialization changes no exact formula
    - adding an unrelated NOT_ATTEMPTED candidate changes campaign state but not eligible survivor state

completion_evidence:
  required:
    - exact_PR407_terminal_receipt
    - exact_PR408_terminal_receipt
    - exact_PR408_terminal_commit
    - exact_PR408_terminal_tree
    - allocated_DAG_node_ids
    - before_DAG_snapshot_hashes
    - after_DAG_snapshot_hashes
    - proof_old_nodes_and_edges_are_exact_prefix
    - base_sha
    - final_sha
    - final_tree
    - git_status_porcelain
    - git_diff_stat
    - git_diff_check
    - research_loop_closeout_hash
    - scientific_contract_hash
    - validation_matrix_hash
    - evidence_manifest_hash
    - survivor_overlay_hash
    - exact_replay_receipts
    - novelty_table
    - RED_logs
    - GREEN_logs
    - clean_CI_run_ids
    - fresh_context_review_receipt
    - unresolved_blockers
    - P0_remaining
    - P1_remaining

agent_policy:
  ask_user_questions: false
  guessing_across_spec_boundary: forbidden
  unresolved_spec_action: BLOCKED_BY_UNRESOLVED_SPEC
  changing_expected_science_to_fit_code: forbidden
  suppressing_failures: forbidden
  rewriting_historical_receipts: forbidden
  inventing_DAG_ids: forbidden
  security_or_antitamper_infrastructure: forbidden
  new_theory_on_core_path: forbidden
  same_agent_final_authority: false
  partial_success_reported_complete: forbidden
