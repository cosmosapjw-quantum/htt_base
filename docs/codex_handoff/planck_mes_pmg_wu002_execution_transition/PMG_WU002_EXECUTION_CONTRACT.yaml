schema: audit-compiled-work-unit/v1
id: PMG-WU-002
title: Apply typed formalism across MES, directional, orbit, and response boundaries
authority:
  canonical_science_base_sha: 3cdeaba39e164c911a26c5daa37f0e15b29614d3
  planning_base_sha: 80781295cb161436eac164fc40bd7f57adfe10d1
  wu001_implementation_sha: 47ef087b158e0dbf8ac4b7b5205f39c1a050d9c0
  host_branch: changeset/planck-mes-observable-irrep-state-20260827
  upstream_dependencies:
  - PMG-WU-001
  implementation_base_rule: accepted PR419 descendant containing exact WU001 implementation and this package, or explicit user-authorized stacked head
  implementation_branch_pattern: changeset/planck-mes-global-formalism-adapters-YYYYMMDD
objective:
  statement: Make every declared pre-existing MES, directional, physical-orbit, and response boundary consume, adapt to, or explicitly refuse the canonical observable/physical/premise/response types without changing frozen scientific behavior.
  observable_success: Typed normalization and response-boundary modules exist; all migration rows terminate explicitly; adapters preserve legacy payload semantics; architecture and negative tests reject cross-layer imports, scalar information fabrication, and unsupported identification.
  non_goals:
  - no Planck map read
  - no new statistical result
  - no physical response numerical model
  - no generic repository-wide refactor
risk:
  class: critical
  P0_failure_modes:
  - PMG2-FM-001
  - PMG2-FM-002
  - PMG2-FM-003
  - PMG2-FM-004
  P1_failure_modes:
  - PMG2-FM-005
  - PMG2-FM-006
  - PMG2-FM-007
  - PMG2-FM-008
scope:
  allowed_paths:
  - htt/src/common/mes_premise_normalization.py
  - htt/src/common/response_bound_observable_state.py
  - htt/src/common/joint_anisotropy_state.py
  - htt/src/common/mes_directional_state.py
  - htt/obsstat/mes_directional_moments.py
  - htt/src/common/orbit_catalogue_v3.py
  - tests/contracts/test_global_formalism_boundaries.py
  - tests/contracts/test_mes_premise_normalization.py
  - tests/contracts/test_response_bound_observable_state.py
  - tests/architecture/test_import_boundaries.py
  - docs/generated/planck_mes_irrep_formalism/wu002_terminal.json
  - docs/generated/planck_mes_irrep_formalism/migration_status.json
  forbidden_paths:
  - /mnt/sn850x2t/htt_base_e2e/workdir/raw/**
  - /mnt/sn850x2t/htt_base_e2e/workdir/downloads/**
  - /mnt/sn850x2t/htt_base_e2e/workdir/cobaya_packages/data/**
  - docs/codex_handoff/**
  - scripts/validate_planck_mes_irrep_global_formalism_plan.py
  - tests/contracts/test_planck_mes_irrep_global_formalism_plan.py
  forbidden_changes:
  - Do not change frozen scalar expected outputs, ranks, hashes, or tolerances.
  - Do not construct orientation, STF shape, response, or information from a scalar premise.
  - Do not let ObservableIrrepState enter physical orbit_catalogue_v3.
  - Do not claim point identification for a rank-deficient response.
  - Do not create another planning package.
preconditions:
- id: PMG2-PRE-001
  command: python -c "import json; p=json.load(open('docs/generated/planck_mes_irrep_formalism/wu001_terminal.json')); assert p['state']=='SUCCEEDED' and p['next_executable_action']=='PMG-WU-002'"
  expect: WU-001 terminal permits PMG-WU-002
- id: PMG2-PRE-002
  command: python -m pytest -q tests/contracts/test_observable_irrep_state.py
  expect: canonical observable-irrep contracts pass
- id: PMG2-PRE-003
  command: python scripts/validate_planck_mes_pmg_wu002_transition.py --check-git
  expect: transition package and exact WU-001 source are valid
invariants:
- id: PMG2-INV-PREMISE-NO-INFORMATION
  severity_if_violated: P0
  statement: MesPremiseNormalizer is a one-way same-channel scaling object and cannot create direction, STF shape, response, independent information, or a physical state.
  mechanical_check:
    command: python -m pytest -q tests/contracts/test_mes_premise_normalization.py
    expect: PASS
- id: PMG2-INV-RESPONSE-IDENTIFICATION
  severity_if_violated: P0
  statement: ResponseBoundObservableState requires exact response/channel/frame/basis/units compatibility and reports an identified set rather than a point under rank deficiency.
  mechanical_check:
    command: python -m pytest -q tests/contracts/test_response_bound_observable_state.py
    expect: PASS
- id: PMG2-INV-PHYSICAL-ORBIT-REFUSAL
  severity_if_violated: P0
  statement: orbit_catalogue_v3 accepts only exact physical JointAnisotropyState inputs; ObservableIrrepState is refused and remains in an observable morphology namespace.
  mechanical_check:
    command: python -m pytest -q tests/contracts/test_global_formalism_boundaries.py -k orbit_catalogue_refusal
    expect: PASS
- id: PMG2-INV-LEGACY-PAYLOAD
  severity_if_violated: P0
  statement: Adapters do not mutate frozen serialized payloads or promote old diagnostics.
  mechanical_check:
    command: python -m pytest -q tests/contracts/test_global_formalism_boundaries.py -k 'legacy or payload or promotion'
    expect: PASS
- id: PMG2-INV-MIGRATION-COVERAGE
  severity_if_violated: P1
  statement: Every PMG-WU-002 migration row ends in MIGRATED, ADAPTED, FROZEN_WITH_GUARD, or EXPLICITLY_DEFERRED; no silent bypass exists.
  mechanical_check:
    command: python -m pytest -q tests/contracts/test_global_formalism_boundaries.py -k migration_coverage
    expect: PASS
failure_modes:
- id: PMG2-FM-001
  severity: P0
  trigger: A scalar premise or scalar feature creates a vector/STF object or independent-information claim.
  required_detection:
    test_or_gate: python -m pytest -q tests/contracts/test_mes_premise_normalization.py
- id: PMG2-FM-002
  severity: P0
  trigger: A response-bound observable is built across response/channel/frame/basis/unit mismatch.
  required_detection:
    test_or_gate: python -m pytest -q tests/contracts/test_response_bound_observable_state.py
- id: PMG2-FM-003
  severity: P0
  trigger: Rank-deficient response is reported as a point identification.
  required_detection:
    test_or_gate: python -m pytest -q tests/contracts/test_response_bound_observable_state.py -k rank
- id: PMG2-FM-004
  severity: P0
  trigger: ObservableIrrepState enters physical orbit_catalogue_v3 or changes its physical mathematics.
  required_detection:
    test_or_gate: python -m pytest -q tests/contracts/test_global_formalism_boundaries.py -k orbit_catalogue_refusal
- id: PMG2-FM-005
  severity: P1
  trigger: A migration row is omitted or silently bypassed.
  required_detection:
    test_or_gate: python -m pytest -q tests/contracts/test_global_formalism_boundaries.py -k migration_coverage
- id: PMG2-FM-006
  severity: P1
  trigger: Legacy serialized payloads or diagnostic claim tiers are changed by an adapter.
  required_detection:
    test_or_gate: python -m pytest -q tests/contracts/test_global_formalism_boundaries.py -k 'legacy or payload or promotion'
- id: PMG2-FM-007
  severity: P1
  trigger: PMG-WU-002 PASS is reported without production changes, focused tests, and both objective artifacts.
  required_detection:
    test_or_gate: git diff --name-only ${PMG_WU002_BASE_SHA:?set accepted base sha}..HEAD | python scripts/validate_planck_mes_pmg_wu002_transition.py --changed-paths -
- id: PMG2-FM-008
  severity: P1
  trigger: Another planning/review package is created instead of PMG-WU-002 implementation.
  required_detection:
    test_or_gate: git diff --name-only ${PMG_WU002_BASE_SHA:?set accepted base sha}..HEAD | python scripts/validate_planck_mes_pmg_wu002_transition.py --changed-paths -
implementation:
  ordered_steps:
  - id: PMG2-STEP-001
    files:
    - tests/contracts/test_mes_premise_normalization.py
    - tests/contracts/test_response_bound_observable_state.py
    - tests/contracts/test_global_formalism_boundaries.py
    - tests/architecture/test_import_boundaries.py
    action: Write and run RED tests for scalar information fabrication, channel/frame/basis/unit mismatch, rank-deficient point-identification refusal, physical-orbit exact type refusal, legacy payload preservation, and migration coverage.
    must_preserve:
    - current WU-001 observable-irrep tests
    - frozen Planck regressions
  - id: PMG2-STEP-002
    files:
    - htt/src/common/mes_premise_normalization.py
    - htt/src/common/response_bound_observable_state.py
    action: Implement dependency-light immutable types and fail-closed constructors. Do not import Planck-specific runners or implement a physical forward model.
    must_preserve:
    - no scalar-to-direction conversion
    - identified-set semantics
  - id: PMG2-STEP-003
    files:
    - htt/src/common/joint_anisotropy_state.py
    - htt/src/common/mes_directional_state.py
    - htt/obsstat/mes_directional_moments.py
    - htt/src/common/orbit_catalogue_v3.py
    action: Add minimal compatibility adapters/refusals using exact types. Preserve old payloads and all physical orbit mathematics; do not generalize the old ell<=2 bridge into an unsupported ell=3 claim.
    must_preserve:
    - physical namespaces
    - orbit completeness remains UNPROVEN
  - id: PMG2-STEP-004
    files:
    - docs/generated/planck_mes_irrep_formalism/migration_status.json
    - docs/generated/planck_mes_irrep_formalism/wu002_terminal.json
    action: Update all WU-002 migration rows and emit a compact terminal binding final commit/tree, commands, invariant results, output hashes, replay status, and next action PMG-WU-003.
    must_preserve:
    - claim_promotion=false
    - science_execution_performed=false
  interfaces:
    required_types:
    - MesPremiseNormalizer
    - ResponseBoundObservableState
    - ResponseIdentificationStatus
    required_properties:
      MesPremiseNormalizer:
      - same-channel normalization only
      - creates_direction=false
      - creates_shape=false
      - creates_information=false
      ResponseBoundObservableState:
      - exact response identity
      - channel/frame/basis/units compatibility
      - rank and identified-set status
verification:
  targeted:
  - python -m pytest -q tests/contracts/test_mes_premise_normalization.py
  - python -m pytest -q tests/contracts/test_response_bound_observable_state.py
  - python -m pytest -q tests/contracts/test_global_formalism_boundaries.py
  negative:
  - python -m pytest -q tests/contracts/test_global_formalism_boundaries.py tests/contracts/test_mes_premise_normalization.py tests/contracts/test_response_bound_observable_state.py -k 'scalar or mismatch or rank or orbit or physical or legacy'
  regression:
  - python -m pytest -q tests/contracts/test_observable_irrep_state.py
  - PYTHONPATH=htt:htt/src python -m pytest -q tests/integration/test_planck_mes_morphology.py tests/paper/test_planck_mes_first_paper.py
  - PYTHONPATH=htt:htt/src python -m pytest -q tests/contracts/test_orbit_catalogue_v3.py -k 'claim or group_action or parity'
  integration:
  - PYTHONPATH=htt:htt/src python -m pytest -q tests/architecture/test_import_boundaries.py
  - git diff --name-only ${PMG_WU002_BASE_SHA:?set accepted base sha}..HEAD | python scripts/validate_planck_mes_pmg_wu002_transition.py --changed-paths -
  full_relevant_suite: []
completion_evidence:
  required:
  - base_git_head
  - final_git_head
  - final_git_tree
  - git_status_porcelain
  - git_diff_stat
  - git_diff_check
  - red_test_receipts
  - executed_test_commands
  - invariant_results
  - objective_output_paths
  - objective_output_sha256
  - replay_status
  - unresolved_blockers
agent_policy:
  ask_user_questions: false
  guessing_across_spec_boundary: forbidden
  changing_tests_to_fit_implementation: forbidden
  changing_reference_outputs_without_authority: forbidden
  suppressing_failures: forbidden
  claiming_unexecuted_work: forbidden
  creating_successor_planning_package: forbidden
  raw_data_mutation: forbidden
  same_agent_as_only_reviewer: forbidden
review_gate:
  fresh_context_required: true
  read_only_first_pass: true
  pass_condition:
    P0: 0
    P1: 0
  stopping_rule: One fresh-context read-only review and at most one targeted repair unless a newly reproduced current-task P0/P1 appears.
transition:
  pass_next_executable_action: Start PMG-WU-003 immediately and execute the map-free coordinate/reducer audit.
  fail_next_action: Emit BLOCKED_BY_P0, BLOCKED_BY_P1, or BLOCKED_BY_UNRESOLVED_SPEC with exact reproducer; do not weaken type/response contracts or create more governance.
