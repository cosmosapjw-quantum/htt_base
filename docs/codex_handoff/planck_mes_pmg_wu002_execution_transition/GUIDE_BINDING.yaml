schema: htt.planck_mes_pmg_wu002_transition.guide_binding.v1
guides:
- title: Universal Audit-Compiled Execution Plan / Weak-Agent-Safe Implementation Compiler
  binding:
  - every foreseeable P0/P1 has a test/assertion/blocked gate
  - work unit uses audit-compiled-work-unit/v1
  - fresh review diagnoses before repair
  - completion requires compact evidence, not prose PASS
- title: Universal Execution-Transition and Anti-Bureaucracy Directive
  binding:
  - this package is the last process output before PMG-WU-002 code
  - one repair and one fresh review maximum absent a new reproduced blocker
  - execution permission is separate from claim admission
  - PASS moves directly to PMG-WU-003
- title: Adaptive CMB Code Development Protocol
  binding:
  - reconstruct contract and actual code path before patching
  - write bounded hypotheses and focused kill tests only if an implementation mismatch appears
  - perform PHYS-MATH then PHYS-MATH-CODE audit after patch
  - do not run plot ceremony because PMG-WU-002 has no plot objective
- title: Adaptive CMB Code Research Executor
  binding:
  - current DAG node is formalism boundary migration
  - large architecture refactor and performance work remain forbidden
  - apply immediately actionable fixes; defer unsupported extensions
  - update DAG and start the next executable node after acceptance
rust_environment_note: PMG-WU-002 is Python/common-boundary work and does not require the local Rust 1.94.1 toolchain unless a directly affected architecture test unexpectedly reaches Rust code.
