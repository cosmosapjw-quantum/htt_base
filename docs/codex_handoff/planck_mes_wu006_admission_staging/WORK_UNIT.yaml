schema: audit-compiled-work-unit/v1
id: PMG-WU-006-ADMISSION-STAGING
title: Reuse reviewed RB2 evidence and preserve the provisional irrep result after
  exact-head CI
classification: CODE_ONLY_PREPARATION_NOT_SCIENCE_TRANSITION
authority:
  repository: cosmosapjw-quantum/htt_base
  branch: changeset/planck-mes-wu006-admission-staging-20260829
  base_sha: 0ae0e70791273c13c7b80ac835232c3c63555c5b
  base_tree: 680795842feafa8028b8e2b9fe8e1086c5f12280
  base_pr: 430
  reviewed_code_sha: 32c9b828ef92a569b36067a8daedcef8f11b4c30
  reviewed_code_tree: 57cbbe79107404c069389b90363a747ff6bc4bf4
  provisional_wu006_sha: 67a8e08cc24836130c89bab5c1be26ef71d19ca8
  provisional_wu006_pr: 431
  precedence:
  - latest explicit user decision
  - live repository and reviewed artifacts
  - executed evidence
  - provided guides
  - historical prose
objective:
  statement: Prepare the minimal downstream admission repair without executing WU006/007
    before the owner-mandated CI gate.
  observable_success: 'After CI: preserved scientific arrays/tables/figures, map-free
    replay MATCH, external code/artifact/visual-bound receipt, evidence-only push.'
  non_goals:
  - No raw maps or downloads
  - No new scientific family, reducer, tail, tolerance, or physical inference
  - No RB2 re-review or re-finalization
  - No billing/settings/branch-protection change
  - No science merge or approval
  - No legacy cleanup integration
risk:
  class: high
  P0_failure_modes:
  - SCOPE-RAW-CLAIM
  P1_failure_modes:
  - CI-ATTRIBUTION
  - PREDECESSOR-BYPASS
  - SELF-ATTESTED-CLOSEOUT
  - RESULT-REBIND-DRIFT
scope:
  allowed_paths:
  - htt/obsstat/observable_irrep_orbit.py
  - htt/obsstat/planck_lowell_irrep_projection.py
  - tests/obsstat/test_observable_irrep_orbit.py
  - tests/obsstat/test_planck_lowell_irrep_projection.py
  - scripts/observed_runs/run_planck_mes_irrep_analysis.py
  - scripts/observed_runs/check_planck_mes_rb2_ci.py
  - scripts/observed_runs/planck_mes_wu006_admission.py
  - tests/obsstat/test_planck_mes_rb2_ci.py
  - tests/obsstat/test_planck_mes_wu006_admission.py
  - tests/integration/test_planck_mes_wu006_control_boundary.py
  - tests/integration/test_planck_mes_irrep_analysis.py
  - docs/codex_handoff/planck_mes_wu006_admission_staging/**
  - docs/generated/planck_mes_irrep_analysis/**
  generated_output_gate: PRE-CI
  forbidden_paths:
  - raw/**
  - downloads/**
  - private manifests/checkpoints in Git
  - unrelated legacy docs/plots cleanup
  forbidden_changes:
  - No override of exact RB2 CI
  - No recreation of WU005 evidence
  - No new science while CI is unstarted
  - No force-push
  - No self-issued review or automatic plot PASS
preconditions:
- id: PRE-BASE
  command: git merge-base --is-ancestor 0ae0e70791273c13c7b80ac835232c3c63555c5b HEAD
  expect: exit 0
- id: PRE-CI
  command: python scripts/observed_runs/check_planck_mes_rb2_ci.py --head 0ae0e70791273c13c7b80ac835232c3c63555c5b
  expect: state PASS, transition_open true; otherwise stop before scientific action
invariants:
- id: CI-ATTRIBUTION
  severity_if_violated: P1
  statement: All eight jobs on the latest attempt of the three required workflows
    must actually succeed at exact RB2 HEAD.
  mechanical_check:
    command: python -m pytest -q tests/obsstat/test_planck_mes_rb2_ci.py
    expect: PASS; no-run is not a code failure or a PASS
- id: PREDECESSOR-BYPASS
  severity_if_violated: P1
  statement: Consume the reviewed RB2 terminal through its existing validators, not
    just SUCCEEDED/MATCH strings.
  mechanical_check:
    command: python -m pytest -q tests/integration/test_planck_mes_irrep_analysis.py
      -k predecessor_acceptance
    expect: six stale/mutation cases reject
- id: SELF-ATTESTED-CLOSEOUT
  severity_if_violated: P1
  statement: Finalization binds external review to clean committed code head/tree,
    exact result/upstream/artifacts and all four visual inspections.
  mechanical_check:
    command: python -m pytest -q tests/obsstat/test_planck_mes_wu006_admission.py
      tests/integration/test_planck_mes_wu006_control_boundary.py
    expect: missing, mismatched, mutable, false-success evidence rejects
- id: RESULT-REBIND-DRIFT
  severity_if_violated: P1
  statement: Only four provisional evidence JSONs are rebound; numerical NPZ, four
    CSV tables, registry and four PDFs remain byte-identical.
  mechanical_check:
    command: --rebind-preserved then --replay-committed; compare original per-file
      SHA list
    expect: 11 scientific files unchanged; ranks 27,27,34,33 / 301
verification:
  targeted:
  - tests/obsstat/test_planck_mes_rb2_ci.py
  - tests/obsstat/test_planck_mes_wu006_admission.py
  - tests/integration/test_planck_mes_wu006_control_boundary.py
  post_ci_only:
  - tests/obsstat/test_observable_irrep_orbit.py
  - tests/obsstat/test_planck_lowell_irrep_projection.py
  - tests/integration/test_planck_mes_irrep_analysis.py -k predecessor_acceptance
  - run_planck_mes_irrep_analysis.py --replay-committed
  full_relevant_suite: []
  here_executed: 57 synthetic/control-boundary tests, not real 301-row analysis or
    full-repository integration
implementation:
  ordered_steps:
  - id: '1'
    action: Owner resolves billing; rerun existing exact-head workflows once, then
      use the live CI checker.
  - id: '2'
    action: Use a separate worktree on the delivered staging branch; do not touch
      old cleanup/recovery worktrees.
  - id: '3'
    action: Materialize only provisional WU006 output directory from exact 67a8e08
      commit, retaining a private copy/hash list.
  - id: '4'
    action: Use the implemented --rebind-preserved command; archive old four JSONs
      privately and run map-free replay.
  - id: '5'
    action: Run scoped post-CI tests, inspect existing PDFs, obtain one fresh external
      receipt for the current committed code and exact outputs.
  - id: '6'
    action: Finalize using that receipt; push only reviewed output evidence to the
      existing staging branch and check exact new-head CI.
completion_evidence:
  required:
  - base and final head/tree
  - exact-head CI live reads
  - 11 preserved scientific-file SHA comparisons
  - map-free replay MATCH
  - external fresh-review SHA
  - candidate identity
  - no raw access
  - no unrelated cleanup changes
review_gate:
  fresh_context_required: true
  read_only_first_pass: true
  maximum_targeted_repairs: 1
  pass_condition:
    P0: 0
    P1: 0
  scope: Only this downstream delta and its evidence; do not restart the RB2 audit.
agent_policy:
  ask_user_questions: false
  guessing_across_spec_boundary: forbidden
  claiming_unexecuted_work: forbidden
  changing_tests_to_fit_implementation: forbidden except removal of reproduced unsafe
    success test
  successor_planning_package: forbidden
transition:
  before_ci: 'STOP: NOT_STARTED_EXTERNAL_GITHUB_BILLING or exact measured CI state;
    code preparation is not WU006 success.'
  after_success: Report WU006 admission and point to the existing WU007 contract;
    no automatic science merge/approval or WU007 execution in this work unit.
