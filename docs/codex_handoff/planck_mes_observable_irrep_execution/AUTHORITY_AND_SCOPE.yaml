user_locks:
- Preserve the exact paired 300 FFP10 SMICA CMB+noise Paper-A pool and its 301-row order.
- Preserve GENERIC_12=133/301, RAW_REDUCED_10=110/301, EPS_REDUCED_10=109/301, MES_10=98/301, ANCHORS_ONLY_2=78/301, and MORPHOLOGY_ONLY_8=88/301 as immutable legacy scalar baselines.
- Preserve multipole_l3_absdot_0=16/301 as the legacy observation-row minimum and both MES ceiling local ranks as 74/301.
- Treat W_max^2=C2/(30*pi*T0^2) at eps1=0 as an analytic identity, not an empirical discovery.
- Treat (Sigma_max^2,W_max^2) and (C2,C3) as information-equivalent on the non-negative physical domain at eps1=0.
- Do not identify ObservableIrrepState with JointAnisotropyState or any physical shear, vorticity, acceleration, tilt, curvature, or Bianchi family.
- A scalar MES anchor may scale a channel-matched existing object but may not manufacture a direction, axis, vector, or STF tensor.
- The pooled covariance remains diagnostic unless a separately preregistered statistic explicitly consumes leave-one-out covariance.
- The 999 CMB-only lane remains a separate robustness result and cannot replace the paired-300 primary result.
- Commander remains observation-only and cannot emit a calibrated finite-null rank from three complete simulations.
- No raw observational payload may be committed or mutated.
- One fresh-context review and at most one targeted repair per work unit unless a new reproduced current-task P0/P1 appears.
- Do not create another planning package during execution.
allowed_scope:
- Introduce a canonical observable-irrep state separate from the physical anisotropy state.
- Centralize finite-null family specifications and add a monotone-invariant leave-one-out ECDF reducer beside the legacy reducer.
- Execute a map-free coordinate-mechanism audit before any large-data pass.
- Reuse and execute the predecessor read-only Planck intake.
- Preserve retained ell=2..5 harmonic coefficients in new V2 portable carriers for the primary 301-row and robustness 1000-row pools.
- Add observable-only orbit projections and a covariance-whitened harmonic template score.
- Execute preregistered operator-aware analytic and conditional native-template injection studies.
- Execute Commander as a same-operator descriptive comparison only.
- Reframe the manuscript as a finite-null coordinate-sensitivity methods paper with MES as a case study.
forbidden_scope:
- Insert observed harmonic coefficients into JointAnisotropyState without a content-bound physical response operator.
- Treat a Planck observable tensor as physical shear, vorticity, acceleration, tilt, curvature, or geometry.
- Select reducers, tails, family membership, templates, rotations, amplitude grids, or rejection rules after inspecting outcomes.
- Add templates after scalar feature extraction while calling the study end-to-end or operator-aware.
- Replace or mutate V1 scalar products, ranks, row order, or primary claim.
- Use Commander simulations or partial files as a calibrated null ensemble.
- Commit raw FITS/catalog/archive/cache payloads.
- Run a full raw-tree hash sweep or full repository suite as a default prerequisite.
- Add physical inference, posterior evidence, local/global labels, or Bianchi-family identification.
explicit_non_goals:
- no new MES physical coefficient derivation
- no full nonlinear physical response or native morphology atlas
- no NPIPE/PR4 analysis absent admitted data
- no broad multi-probe inference
- no performance-first optimization before carrier and injection correctness
- no general ell>5 irrep framework in this execution sequence
