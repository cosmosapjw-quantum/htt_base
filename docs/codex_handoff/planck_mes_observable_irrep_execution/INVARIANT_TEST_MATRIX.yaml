- requirement: Classify identity mismatches before blocking
  invariant: PMI-INV-IDENTITY-CLASSIFICATION
  invariant_statement: Mismatches are classified as source, deterministic evidence, scientific numeric, or packaging before disposition.
  failure_mode: PMI-FM-022
  severity: P1
  mechanical_detector: python -m pytest -q tests/contracts/test_planck_mes_identity_classification.py
  work_unit: PMI-WU-003
