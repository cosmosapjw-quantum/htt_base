- requirement: Inspect plots before claims
  invariant: PMI-INV-PLOT-INSPECTION
  invariant_statement: Required figures are hash-bound to inspection findings and cannot be generated-only evidence.
  failure_mode: PMI-FM-024
  severity: P1
  mechanical_detector: python -m pytest -q tests/integration/test_planck_mes_irrep_injections.py::test_plot_audit_binds_all_required_figures_and_findings
