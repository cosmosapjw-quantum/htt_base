- requirement: Expose eps1 premise sensitivity
  invariant: PMI-INV-EPS1-SENSITIVITY
  invariant_statement: Exact coefficients and a registered eps1 grid are reported beside eps1=0 values.
  failure_mode: PMI-FM-023
  severity: P1
  mechanical_detector: python -m pytest -q tests/integration/test_planck_mes_coordinate_mechanism_audit.py::test_eps1_sensitivity_uses_active_authority_and_full_grid
  work_unit: PMI-WU-002
