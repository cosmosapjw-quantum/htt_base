  - id: PMI-FM-016
    severity: P0
    trigger: Templates are added after scalar feature extraction, or directly to post-operator carriers without applying the registered orientation-dependent mask/beam/operator response, while called end-to-end.
    required_detection:
      test_or_gate: python -m pytest -q tests/integration/test_planck_mes_irrep_injections.py::test_every_template_orientation_has_content_bound_operator_response
  - id: PMI-FM-018
    severity: P0
    trigger: The observation contributes to its own mean/covariance/template whitening, covariance is singular or silently regularized, or orientation maximization is not applied identically to all rows.
    required_detection:
      test_or_gate: python -m pytest -q tests/obsstat/test_harmonic_template_score.py::test_leave_one_out_whitening_and_orientation_max_are_permutation_equivariant
  - id: PMI-FM-017
    severity: P0
    trigger: A Bianchi VII_h template is used without exact template bytes, solver commit/tree, conventions, transfer provenance, and response/operator identity.
    required_detection:
      test_or_gate: python -m pytest -q tests/integration/test_planck_mes_irrep_injections.py::test_native_bianchi_template_requires_exact_authority_or_is_deferred
  - id: PMI-FM-019
    severity: P1
    trigger: The analytic observable-STF benchmark template, native Bianchi template, or another registered candidate silently disappears from execution or is mislabeled as refuted.
    required_detection:
      test_or_gate: python -m pytest -q tests/integration/test_planck_mes_irrep_injections.py::test_candidate_disposition_ledger_is_complete
  - id: PMI-FM-024
    severity: P1
    trigger: Required rank distributions, injection power curves, or operator-response diagnostics are generated but not inspected, or their plot audit is absent.
    required_detection:
      test_or_gate: python -m pytest -q tests/integration/test_planck_mes_irrep_injections.py::test_plot_audit_binds_all_required_figures_and_findings
  implementation:
