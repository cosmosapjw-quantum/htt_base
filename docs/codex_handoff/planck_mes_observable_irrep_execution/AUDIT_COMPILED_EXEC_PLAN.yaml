    claiming_unexecuted_work: forbidden
    creating_successor_planning_package: forbidden
    raw_data_mutation: forbidden
    posthoc_statistic_or_template_selection: forbidden
  review_gate:
    fresh_context_required: true
    read_only_first_pass: true
    pass_condition:
      P0: 0
      P1: 0
    stopping_rule: One fresh review and at most one targeted repair unless a new reproduced current-task P0/P1 appears.
  transition:
    pass_next_executable_action: Start PMI-WU-007 with only successful replayed projections; a deferred native template is an allowed nonblocking disposition.
    fail_next_action: On score equivariance, operator-response, or preregistration failure emit BLOCKED_BY_P0; on missing native authority mark only that candidate DEFERRED and continue the analytic lane.
