      - A50/A90 bracket when monotonicity is not resolved
    interfaces:
      produces:
      - obsstat.lowell_irrep_morphology.observable_morphology_report
      - obsstat.harmonic_template_score.template_finite_null_score
      - docs/generated/planck_mes_irrep_injections/result.json
      - docs/generated/planck_mes_irrep_injections/candidate_dispositions.json
      - docs/generated/planck_mes_irrep_injections/terminal.json
