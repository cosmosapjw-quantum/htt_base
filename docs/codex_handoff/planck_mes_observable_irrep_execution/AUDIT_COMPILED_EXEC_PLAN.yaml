    observable_success: Replayed outputs provide observable morphology, exact rotation tests, complete-pool template ranks, analytic injection power with Wilson intervals/A50/A90 brackets/orientation spread, scalar-versus-harmonic power comparison, and explicit candidate dispositions; no physical inference is emitted.
