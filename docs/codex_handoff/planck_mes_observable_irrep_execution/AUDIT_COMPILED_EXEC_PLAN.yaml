    claiming_unexecuted_work: forbidden
    creating_successor_planning_package: forbidden
    raw_data_mutation: forbidden
    posthoc_statistic_or_template_selection: forbidden
  review_gate:
    fresh_context_required: true
    read_only_first_pass: true
    pass_condition:
      P0: 0
      P1: 0
    stopping_rule: One fresh review and at most one targeted repair unless a new reproduced current-task P0/P1 appears.
  transition:
    pass_next_executable_action: Transition to external scientific review or submission preparation; do not start another internal audit loop.
    fail_next_action: If Commander attempts calibration or the paper consumes unexecuted/overclaimed evidence, emit BLOCKED_BY_P0/P1 and apply one bounded repair only.
global_transition_policy:
  execution_permission_separate_from_claim_admission: true
  first_objective_output_required_by: PMI-WU-002
  large_data_execution_must_preserve_harmonic_carrier: true
  process_starvation_trigger: two substantial process-only cycles
  process_starvation_action: freeze optional governance and execute the shortest accepted work unit; do not create a remediation contract
  trusted_verification_boundary:
  - Python runtime and standard library
  - NumPy finite-array arithmetic and npz with allow_pickle=False
  - Git object identity and repository content APIs
  - existing canonical Planck joint-cutsky operator tests
  - the package validator and its focused contract test
  review_stopping_rule: one read-only fresh-context review and at most one targeted repair per work unit; a further loop requires a newly reproduced current-task P0/P1
  full_repository_suite_default: false
  candidate_terminal_states:
  - PROMOTED
  - REFUTED
  - UNRESOLVED
  - DEFERRED
  - NOT_ATTEMPTED
  claim_gate: authoritative scientific promotion remains disabled until the specific work-unit terminal and portable replay pass; exploratory execution is not blocked by absent publication-grade evidence
