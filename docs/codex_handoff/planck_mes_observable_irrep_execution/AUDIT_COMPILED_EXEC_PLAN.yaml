      - 'run_irrep_injections(*, primary_carrier: Path, robustness_carrier: Path, template_registry: Path, output_dir: Path) -> dict[str, object]'
  verification:
    targeted:
    - python -m pytest -q tests/obsstat/test_lowell_irrep_morphology.py tests/obsstat/test_harmonic_template_score.py tests/integration/test_planck_mes_irrep_injections.py
    negative:
