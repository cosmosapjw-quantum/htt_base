schema: htt.mes_methodology_recovery.local_formal_tasks.v1
policy:
  local_result_never_changes_truth_status_automatically: true
  every_result_requires_content_bound_receipt: true
  independent_review_required: true
  non_geodesic_MES_requires_primary_source_bytes: true
tasks:
  - id: LOCAL-XACT-001
    tools: [Wolfram_15, xAct_1_3]
    objective: >-
      Derive covariant boost/frame transformations for expansion, shear,
      acceleration, radiation multipoles, Hubble/deceleration multipoles and
      luminosity-distance observables across radiation, matter and observer frames.
    required_outputs:
      - metric_and_sign_convention_table
      - first_order_terms_and_declared_higher_order_remainder
      - frame_and_congruence_identity
      - xAct_script_and_zero_residual_receipt
      - refusal_domain
    terminal_on_failure: BLOCKED_FRAME_TRANSFORM_DERIVATION
  - id: LOCAL-XACT-002
    tools: [Wolfram_15, xAct_1_3]
    objective: >-
      Replay branch-complete homogeneous Gauss, momentum, curl and
      structure-constant constraints for the PR216 sharpness ladder.
    required_outputs:
      - per_branch_constraint_residuals
      - exact_congruence_and_frame
      - local_development_assumptions
      - negative_witnesses_for_unattainable_branches
    terminal_on_failure: BLOCKED_BRANCH_CONSTRAINT_CLOSURE
  - id: LOCAL-SAGE-001
    tools: [SageMath, Singular]
    objective: >-
      Factor the VT-T8 14-coordinate Jacobian, the eigenframe-slice
      transversality determinant and the residual discrete branch ideal.
    required_outputs:
      - exact_factorisation
      - ordered_simple_spectrum_branch
      - residual_SO3_sign_action
      - singular_and_refusal_ideal
    terminal_on_failure: BLOCKED_VTT8_DISCRETE_BRANCH
  - id: LOCAL-LEAN-001
    tools: [Lean_4, Mathlib]
    objective: >-
      Formalise the scalar-only equivariant no-go and fixed-positive-anchor
      shape/rank invariance.
    allowed_axioms: [propext, Classical.choice, Quot.sound]
    forbidden: [sorryAx, custom_scientific_axiom, native_decide_as_proof_replacement]
    terminal_on_failure: BLOCKED_LEAN_EQUIVARIANCE
  - id: LOCAL-LEAN-002
    tools: [Lean_4, Mathlib]
    objective: >-
      Formalise the finite reverse-martingale theorem by reversing the
      filtration and applying Doob's maximal inequality.
    bounded_fallback: >-
      If Mathlib conditional expectation integration is disproportionate,
      retain a complete paper proof and formalise the finite-partition tower only.
    terminal_on_failure: BLOCKED_LEAN_REVERSE_MARTINGALE
  - id: LOCAL-ROCQ-001
    tools: [Rocq]
    objective: >-
      Formalise conservative finite ranks with ties and the zero-mean PSD
      trace-one antipodal second-moment construction.
    terminal_on_failure: BLOCKED_ROCQ_FINITE_RANK_OR_MOMENT_CONE
  - id: LOCAL-MES-NG-001
    tools: [Wolfram_xAct, SageMath]
    precondition: hashed_MES_1995b_primary_source_available
    objective: >-
      Attempt an independent non-geodesic derivation and compare it with the
      print-only registered candidate coefficients.
    without_precondition: BLOCKED_PRIMARY_SOURCE
