schema: htt.mes_methodology_recovery.audit_compiled_plan.v1
authority:
  repository: cosmosapjw-quantum/htt_base
  planning_base_branch: changeset/pr320-hsc-kids-cross-covariance-20260825
  planning_base_sha: a968e11461ed28c8d5cc1244f0122edc704579c4
  planning_base_tree: 3e1f1cf27683d122618de6b8296dbc1ca4f6f27f
  source_precedence:
    - latest_explicit_user_decision
    - current_inspectable_repository
    - merged_code_tests_contracts
    - durable_evidence
    - documentation
    - PR_history
    - historical_proposals
user_locks:
  - restore_MES_anchored_methodology_as_scientific_spine
  - preserve_SMICA_only_exact_300_pair_fast_path
  - private_single_researcher_no_security_architecture
  - preserve_existing_DAG_order_and_edges
  - generic_lowell_result_is_benchmark_control
  - research_receipt_precedes_scientific_status_projection
planning_aliases_are_not_canonical_PR_ids: true
canonical_id_allocation: DEFER_TO_LIVE_DAG_GENERATOR
ordered_work_units:
  - MR-WU-000
  - MR-WU-001
  - MR-WU-002
  - MR-WU-003
  - MR-WU-004
  - MR-WU-005
  - MR-WU-006
  - MR-WU-007
  - MR-WU-008
work_units:
  - schema: audit-compiled-work-unit/v1
    id: MR-WU-000
    title: Live authority and append-only allocation
    authority:
      base_sha: a968e11461ed28c8d5cc1244f0122edc704579c4
      upstream_dependencies: []
    objective:
      statement: Re-read live DAG and open stacks, then allocate successor IDs without modifying existing order, edges or resolutions.
      observable_success: Old DAG is an exact prefix and all mirrors agree.
      non_goals: [science_implementation, historical_receipt_rewrite]
    risk:
      class: high
      P0_failure_modes: []
      P1_failure_modes: [FM-P1-006]
    scope:
      allowed_paths: [docs/codex_handoff/pr_backlog.yaml, docs/codex_handoff/pr_status.yaml, machine_readable/**, docs/generated/status_*, docs/generated/claim_ledger.json]
      forbidden_paths: [htt/**, src/**, historical_receipts]
      forbidden_changes: [rewrite_existing_node, rewrite_existing_edge, manual_PR_id_guess]
    invariants:
      - id: INV-DAG-PREFIX
        severity_if_violated: P1
        statement: Every pre-existing node, edge and resolution is unchanged.
        mechanical_check:
          command: existing strict DAG validator plus exact old-prefix comparator
          expect: PASS
    implementation:
      ordered_steps:
        - id: S1
          action: Record live ordered nodes, edges, resolutions and hashes.
        - id: S2
          action: Allocate implementation IDs with the existing generator.
        - id: S3
          action: Append only and regenerate all mirrors together.
    verification:
      targeted: [strict_DAG_validation, mirror_sync]
      negative: [delete_old_node, reorder_old_node, repoint_old_edge]
    stop_conditions: [BLOCKED_DAG_PREFIX_DRIFT, BLOCKED_DAG_ID_NOT_ALLOCATED]
    review_gate: {fresh_context_required: true, pass_condition: {P0: 0, P1: 0}}
  - schema: audit-compiled-work-unit/v1
    id: MR-WU-001
    title: Theory receipt integration
    authority:
      base_sha: a968e11461ed28c8d5cc1244f0122edc704579c4
      upstream_dependencies: [MR-WU-000, PR408_terminal_or_explicit_supersession]
    objective:
      statement: Integrate established MES bridge theorems, negative results and local formalisation obligations into versioned research receipts.
      observable_success: Every decision has truth, evidence, replay and release status with proof or blocker evidence.
      non_goals: [edit_MES_authority_table, promote_non_geodesic_MES]
    risk: {class: high, P0_failure_modes: [], P1_failure_modes: []}
    scope:
      allowed_paths: [docs/research_program/**/mes_*, docs/generated/mes_methodology_recovery/**, wolfram/mes_methodology_recovery_proofs.wls, tests/contracts/test_mes_methodology_theorems.py]
      forbidden_paths: [htt/src/common/mes_theorem_authority.py, archived_primary_sources, historical_PR254_PR284_receipts]
    invariants:
      - id: INV-FOUR-AXIS
        severity_if_violated: P1
        statement: Truth, evidence, replay and release remain separate.
        mechanical_check: {command: theorem-receipt schema test, expect: PASS}
      - id: INV-WOLFRAM
        severity_if_violated: P1
        statement: All exact registered Wolfram oracles pass.
        mechanical_check: {command: wolframscript -file wolfram/mes_methodology_recovery_proofs.wls, expect: all_pass=true}
    implementation:
      ordered_steps:
        - {id: S1, action: Add exact paper proofs and decision metadata without changing source authority.}
        - {id: S2, action: Replay Wolfram and bind engine/version/output.}
        - {id: S3, action: Route xAct, Sage, Lean and Rocq obligations to LOCAL_FORMALIZATION_TASKS.}
    verification:
      targeted: [Wolfram_replay, theorem_receipt_schema]
      negative: [collapse_replay_into_truth, promote_non_geodesic_branch]
    stop_conditions: [BLOCKED_PRIMARY_SOURCE, BLOCKED_LOCAL_FORMAL_RECEIPT]
    review_gate: {fresh_context_required: true, pass_condition: {P0: 0, P1: 0}}
  - schema: audit-compiled-work-unit/v1
    id: MR-WU-002
    title: Complete existing PR315 cut-sky repair
    authority:
      base_sha: a968e11461ed28c8d5cc1244f0122edc704579c4
      upstream_dependencies: [MR-WU-000, PR314_execution_evidence, PR404_compiled_PR315_plan]
    objective:
      statement: Execute the already compiled joint monopole/dipole plus l=2..5 cut-sky estimator and preserve the PR314 branch.
      observable_success: Known-alm, masked-contamination and observation/null identity tests pass; corrected exact-300 feature package exists.
      non_goals: [MES_bridge_implementation]
    risk: {class: high, P0_failure_modes: [], P1_failure_modes: [FM-P1-001]}
    scope:
      allowed_paths: [paths_allowed_by_PR404_PR315_contract]
      forbidden_paths: [PR314_result_bytes, PR314_replay_bytes, MES_modules]
    invariants:
      - id: INV-JOINT-CUTSKY
        severity_if_violated: P0
        statement: Nuisance and retained harmonics are jointly fit.
        mechanical_check: {command: PR315 known-alm and masked-contamination tests, expect: PASS}
    implementation:
      ordered_steps:
        - {id: S1, action: Follow PR404 exactly; do not duplicate or broaden it.}
    verification:
      targeted: [PR315_focused_tests]
      negative: [masked_only_contamination]
      integration: [same_exact_300_pair_rerun]
    stop_conditions: [BLOCKED_PR315_TERMINAL_RECEIPT]
    review_gate: {fresh_context_required: true, pass_condition: {P0: 0, P1: 0}}
  - schema: audit-compiled-work-unit/v1
    id: MR-WU-003
    title: Rowwise active MES anchor operator
    authority:
      base_sha: a968e11461ed28c8d5cc1244f0122edc704579c4
      upstream_dependencies: [MR-WU-001, MR-WU-002]
    objective:
      statement: Compute epsilon_l and verified geodesic Sigma2/W2 anchors from each corrected observed/null row through the active typed MES authority.
      observable_success: Observation and all null rows have content-bound active anchor states; no legacy import occurs.
      non_goals: [non_geodesic_MES, independent_information_gain_from_self_anchor]
    risk:
      class: high
      P0_failure_modes: [FM-P0-004, FM-P0-005, FM-P0-007]
      P1_failure_modes: [FM-P1-004]
    scope:
      allowed_paths: [htt/obsstat/mes_row_anchor.py, tests/obsstat/test_mes_row_anchor.py, scripts/observed_runs/run_planck_mes_morphology.py]
      forbidden_paths: [htt/bass/observational/planck_mes_bounds.py, htt/src/common/mes_theorem_authority.py, historical_results]
    invariants:
      - id: INV-ACTIVE-AUTHORITY
        severity_if_violated: P0
        statement: Only verified geodesic typed anchors are emitted.
        mechanical_check: {command: static import and branch-status tests, expect: PASS}
      - id: INV-ROW-SYMMETRY
        severity_if_violated: P0
        statement: One pure anchor function is applied to every row.
        mechanical_check: {command: row permutation and observation-swap tests, expect: PASS}
    implementation:
      ordered_steps:
        - {id: S1, action: Extract C_l and epsilon_l from corrected alms in registered units.}
        - {id: S2, action: Require explicit residual-dipole attribution; never guess a default.}
        - {id: S3, action: Use registered_geodesic_mes_anchors and serialize shared source/covariance identity.}
    verification:
      targeted: [anchor_formulas, dimensions, units]
      negative: [legacy_import, observed_dipole_attribution, row_order_mutation]
      regression: [PR124_authority_tests]
    stop_conditions: [BLOCKED_MES_ATTRIBUTION, BLOCKED_MES_HIERARCHY, BLOCKED_LEGACY_MES_IMPORT]
    review_gate: {fresh_context_required: true, pass_condition: {P0: 0, P1: 0}}
  - schema: audit-compiled-work-unit/v1
    id: MR-WU-004
    title: MES-anchored directional vector/tensor state
    authority:
      base_sha: a968e11461ed28c8d5cc1244f0122edc704579c4
      upstream_dependencies: [MR-WU-001, MR-WU-003]
    objective:
      statement: Implement the legal direction-indexed scalar-to-vector/STF moment bridge, scale/shape separation and physical-stress refusal boundary.
      observable_success: Scalar-only construction fails; exact full-sky fixtures recover vector/STF moments; masked/discrete estimator identity is bound.
      non_goals: [infer_physical_shear_orientation_from_CMB_shape]
    risk:
      class: high
      P0_failure_modes: [FM-P0-002, FM-P0-005]
      P1_failure_modes: [FM-P1-005]
    scope:
      allowed_paths: [htt/src/common/mes_directional_state.py, htt/obsstat/mes_directional_moments.py, tests/common/test_mes_directional_state.py, tests/obsstat/test_mes_directional_moments.py]
      forbidden_paths: [historical_joint_state_types, legacy_scalar_constructors]
    invariants:
      - id: INV-O3
        severity_if_violated: P0
        statement: Outputs transform in the registered polar, axial and STF irreducible representations.
        mechanical_check: {command: random O3 covariance and parity tests, expect: PASS}
      - id: INV-REALIZABILITY
        severity_if_violated: P1
        statement: Nonnegative-measure second moments are PSD and trace one.
        mechanical_check: {command: moment-cone tests, expect: PASS}
    implementation:
      ordered_steps:
        - {id: S1, action: Separate observer-space MES index from physical MES stress.}
        - {id: S2, action: Implement exact dipole/STF normalisations and missing-direction refusal.}
        - {id: S3, action: Keep anchor amplitude, normalised shape and transfer identity separate.}
    verification:
      targeted: [analytic_moment_recovery]
      negative: [scalar_only, wrong_parity, non_PSD_moment]
      regression: [rotation_reflection_covariance, positive_anchor_rescaling]
    stop_conditions: [BLOCKED_DIRECTIONAL_SUPPORT, BLOCKED_CHANNEL_MATCH, BLOCKED_MOMENT_REALIZABILITY]
    review_gate: {fresh_context_required: true, pass_condition: {P0: 0, P1: 0}}
  - schema: audit-compiled-work-unit/v1
    id: MR-WU-005
    title: MES-anchored Planck observed/null analysis
    authority:
      base_sha: a968e11461ed28c8d5cc1244f0122edc704579c4
      upstream_dependencies: [MR-WU-002, MR-WU-003, MR-WU-004]
    objective:
      statement: Run corrected Planck observation and exact 300-pair nulls through the MES-anchored amplitude/shape operator and row-equivariant finite calibration.
      observable_success: Portable observation plus 300-row MES feature package and exact ranks exist; PR314 is reported only as a control.
      non_goals: [Planck_only_local_global_identification]
    risk:
      class: critical
      P0_failure_modes: [FM-P0-001, FM-P0-006, FM-P0-007]
      P1_failure_modes: [FM-P1-002, FM-P1-004]
    scope:
      allowed_paths: [scripts/observed_runs/run_planck_mes_morphology.py, docs/generated/planck_mes_morphology/**, tests/integration/test_planck_mes_morphology.py]
      forbidden_paths: [PR314_immutable_artifacts, generic_feature_definition_except_control_reference]
    invariants:
      - id: INV-METHOD-SPINE
        severity_if_violated: P0
        statement: The primary result binds an MES anchor state and irreducible morphology state.
        mechanical_check: {command: result-schema and claim test, expect: PASS}
      - id: INV-FINITE-RANK
        severity_if_violated: P0
        statement: The complete pooled scorer is row-permutation equivariant.
        mechanical_check: {command: observation-swap, permutation and tie tests, expect: PASS}
    implementation:
      ordered_steps:
        - {id: S1, action: Freeze primary and control result semantics before the observed rerun.}
        - {id: S2, action: Apply one pure row operator to observation and all nulls.}
        - {id: S3, action: Export anchors, vector/tensor shapes, shared dependence metadata and ranks.}
        - {id: S4, action: Emit SINGLE_SHELL_LOCAL_GLOBAL_NONIDENTIFIED.}
    verification:
      targeted: [portable_replay]
      negative: [remove_MES_state, change_observation_index, use_observation_only_anchor]
      integration: [exact_301_row_rerun]
    stop_conditions: [BLOCKED_INCOMPLETE_300_PAIR_POOL, BLOCKED_ROW_EQUIVARIANCE, BLOCKED_METHOD_SPINE_DRIFT]
    review_gate: {fresh_context_required: true, pass_condition: {P0: 0, P1: 0}}
  - schema: audit-compiled-work-unit/v1
    id: MR-WU-006
    title: Physical local/global depth-response interface
    authority:
      base_sha: a968e11461ed28c8d5cc1244f0122edc704579c4
      upstream_dependencies: [MR-WU-001, LOCAL-XACT-001, MR-WU-004]
    objective:
      statement: Replace support-indicator templates with content-bound covariant local-boost/global-tilt response matrices and the exact depth-rank criterion.
      observable_success: Single-shell and proportional profiles abstain; independent profiles with full directional support attain conditional rank.
      non_goals: [posterior_evidence, family_identification]
    risk:
      class: critical
      P0_failure_modes: [FM-P0-003]
      P1_failure_modes: [FM-P1-003]
    scope:
      allowed_paths: [htt/htt/htt/infer/mes_local_global_response.py, tests/htt/test_mes_local_global_identifiability.py, docs/generated/mes_local_global_response/**]
      forbidden_paths: [support_library_historical_files_except_adapter, posterior_and_evidence_modules]
    invariants:
      - id: INV-PHYSICAL-RESPONSE
        severity_if_violated: P1
        statement: Every response column binds source, frame, depth, units and parameter identity.
        mechanical_check: {command: response receipt tests, expect: PASS}
      - id: INV-IDENTIFIABILITY
        severity_if_violated: P0
        statement: Conditional claim tier requires full nuisance-projected whitened rank.
        mechanical_check: {command: one-shell, proportional-profile and missing-response tests, expect: PASS}
    implementation:
      ordered_steps:
        - {id: S1, action: Ingest xAct-validated boost and frame responses.}
        - {id: S2, action: Implement projected-rank and separable determinant oracle.}
        - {id: S3, action: Return identified sets or typed nonidentification, never forced labels.}
    verification:
      targeted: [response_identity, rank]
      negative: [single_shell, proportional_profiles, missing_global_response]
      regression: [invertible_anchor_scaling]
    stop_conditions: [BLOCKED_PHYSICAL_GLOBAL_RESPONSE, BLOCKED_DEPTH_RANK, BLOCKED_FRAME_TRANSFORM_DERIVATION]
    review_gate: {fresh_context_required: true, pass_condition: {P0: 0, P1: 0}}
  - schema: audit-compiled-work-unit/v1
    id: MR-WU-007
    title: Tomographic local-boost/global-tilt observed programme
    authority:
      base_sha: a968e11461ed28c8d5cc1244f0122edc704579c4
      upstream_dependencies: [MR-WU-005, MR-WU-006, exact_lowz_lane_admission]
    objective:
      statement: Apply the physical depth-response framework to the first exact admitted low-z directional lane and combine it with the separate Planck high-z anchor.
      observable_success: Each probe has operator-identical observed/null packages; the joint response is conditionally identified or explicitly nonidentified.
      non_goals: [wait_for_all_lanes]
    risk:
      class: critical
      P0_failure_modes: [FM-P0-003, FM-P0-007]
      P1_failure_modes: [FM-P1-003, FM-P1-004]
    scope:
      allowed_paths: [new_lane_adapters_allocated_after_live_intake, docs/generated/mes_tomographic/**, tests/integration/test_mes_tomographic_local_global.py]
      forbidden_paths: [unadmitted_data, partial_PR151_products, invented_global_response]
    invariants:
      - id: INV-DATA-ADMISSION
        severity_if_violated: P0
        statement: Only exact admitted observed/null components enter.
        mechanical_check: {command: PR289 identity replay and lane-specific admission tests, expect: PASS}
      - id: INV-CROSS-PROBE
        severity_if_violated: P1
        statement: Cross-probe covariance and shared frames are explicit.
        mechanical_check: {command: joint covariance and frame mutations, expect: PASS}
    implementation:
      ordered_steps:
        - {id: S1, action: Select the first fully admitted low-z direction/depth lane.}
        - {id: S2, action: Build shell moments and responses without frame shortcuts.}
        - {id: S3, action: Run matched nulls and report conditional identification or abstention.}
    verification:
      targeted: [selected_lane_only]
      negative: [missing_shell, frame_mismatch, cross_covariance_omission]
      integration: [Planck_plus_one_lowz_lane]
    stop_conditions: [BLOCKED_NO_EXACT_LOWZ_ADMISSION, BLOCKED_CROSS_PROBE_COVARIANCE, BLOCKED_NONIDENTIFIED_RESPONSE]
    review_gate: {fresh_context_required: true, pass_condition: {P0: 0, P1: 0}}
  - schema: audit-compiled-work-unit/v1
    id: MR-WU-008
    title: Publication evidence and independent review
    authority:
      base_sha: a968e11461ed28c8d5cc1244f0122edc704579c4
      upstream_dependencies: [MR-WU-005, MR-WU-006]
    objective:
      statement: Produce portable paper-facing evidence, focused clean CI, fresh-context review and one final differential strong-model audit.
      observable_success: All claim-bearing values replay, forbidden claims are absent and P0=P1=0.
      non_goals: [new_meta_framework, full_unrelated_repo_suite]
    risk:
      class: high
      P0_failure_modes: [FM-P0-001, FM-P0-006]
      P1_failure_modes: []
    scope:
      allowed_paths: [docs/manuscript/**, docs/generated/mes_methodology_recovery/**, .github/workflows/repository-integrity.yml, tests/contracts/test_mes_publication_claims.py]
      forbidden_paths: [raw_restricted_data, unrelated_workflows, security_framework]
    invariants:
      - id: INV-PORTABLE
        severity_if_violated: P1
        statement: Reported ranks, anchors and shapes replay without raw data.
        mechanical_check: {command: portable replay test, expect: exact_match}
      - id: INV-CLAIMS
        severity_if_violated: P0
        statement: No converse, family ID or false local/global claim appears.
        mechanical_check: {command: claim-language tests, expect: PASS}
    implementation:
      ordered_steps:
        - {id: S1, action: Add one focused cell to the existing workflow.}
        - {id: S2, action: Run fresh-context read-only review on base-to-final diff and evidence.}
        - {id: S3, action: Run one differential strong-model audit and absorb only novel P0/P1 as minimal guards.}
    verification:
      targeted: [portable_replay, claim_lint, directly_affected_integration]
      negative: [remove_anchor_reference, promote_single_shell]
    stop_conditions: [BLOCKED_P0_OR_P1, BLOCKED_NONPORTABLE_RESULT, BLOCKED_FORBIDDEN_CLAIM]
    review_gate: {fresh_context_required: true, pass_condition: {P0: 0, P1: 0}}
global_agent_policy:
  ask_user_questions: false
  guessing_across_spec_boundary: forbidden
  unresolved_spec_action: BLOCKED_BY_UNRESOLVED_SPEC
  changing_tests_to_fit_implementation: forbidden
  changing_reference_outputs_without_authority: forbidden
  suppressing_failures: forbidden
  claiming_unexecuted_work: forbidden
  security_infrastructure: forbidden
completion:
  paper_A_ready_when:
    - MR-WU-001_through_005_PASS
    - MR-WU-008_PASS
    - corrected_exact_300_rerun_complete
    - MES_method_result_portable
    - P0_0_P1_0
  paper_B_ready_when:
    - MR-WU-006_through_008_PASS
    - at_least_one_exact_lowz_lane_admitted
    - physical_local_global_response_full_rank_or_honest_nonidentification
