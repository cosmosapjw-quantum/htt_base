decisions:
  - id: MR-THEOREM-001
    title: Scalar-only O3-equivariant no-go
    truth_status: ESTABLISHED
    evidence_status: ANALYTIC_PROOF_PLUS_WOLFRAM_GENERATOR_SOLVE
    replay_status: EXTERNAL_WOLFRAM_PASS_PENDING_REPO_REPLAY
    release_status: METHOD_LEMMA_CANDIDATE
    statement: >-
      Without independently supplied directional structure, every O(3)-equivariant
      map from rotational scalars to a polar/axial vector or STF2 tensor is zero.
    forbidden_extensions:
      - scalar MES anchor determines an axis
      - scalar MES anchor determines tensor components
  - id: MR-THEOREM-002
    title: Directional scalar moment reconstruction
    truth_status: ESTABLISHED
    evidence_status: EXACT_SPHERE_INTEGRATION
    replay_status: EXTERNAL_WOLFRAM_PASS_PENDING_REPO_REPLAY
    release_status: CENTRAL_METHOD_PROPOSITION_CANDIDATE
    statement: >-
      V_a=3/(4pi) integral q(n)n_a dOmega and
      T_ab=15/(8pi) integral q(n)n_<a n_b> dOmega exactly reconstruct the
      l=1 vector and l=2 STF tensor of a full-sky directional scalar field.
    implementation_boundary: Masked or discrete data require a registered quadrature or joint harmonic fit.
  - id: MR-THEOREM-003
    title: MES anchor scale-shape and response-rank invariance
    truth_status: ESTABLISHED
    evidence_status: LINEAR_ALGEBRA_PLUS_WOLFRAM_CONGRUENCE
    replay_status: EXTERNAL_WOLFRAM_PASS_PENDING_REPO_REPLAY
    release_status: CENTRAL_METHOD_PROPOSITION_CANDIDATE
    statement: >-
      Positive fixed scalar anchors rescale amplitudes but preserve normalized
      directions, tensor eigenspaces, homogeneous shape invariants, response rank
      and response subspaces.
    caveat: A row-dependent self-anchor is a new nonlinear statistic and needs symmetric null calibration.
  - id: MR-THEOREM-004
    title: Local/global single-shell no-go and depth criterion
    truth_status: ESTABLISHED
    evidence_status: FISHER_FACTORISATION_PLUS_WOLFRAM
    replay_status: EXTERNAL_WOLFRAM_PASS_PENDING_REPO_REPLAY
    release_status: CENTRAL_IDENTIFICATION_THEOREM_CANDIDATE
    statement: >-
      For V_i=f_L(z_i) beta_L+f_G(z_i) beta_G+noise, the six-parameter Fisher
      determinant is det(K_depth)^3 det(S_direction)^2. One shell is
      nonidentified; identification requires independent depth profiles and
      full directional support after nuisance projection.
  - id: MR-THEOREM-005
    title: Finite reverse-martingale depth-path Doob theorem
    truth_status: ESTABLISHED
    evidence_status: ANALYTIC_REVERSE_TIME_DOOB_PROOF
    replay_status: PAPER_PROOF_PENDING_OPTIONAL_LEAN
    release_status: STATISTICAL_FOUNDATION_LEMMA
    statement: >-
      For any finite decreasing filtration G_j and X in L2,
      P(max_j |E[X|G_j]|^2 >= lambda^2 E[X^2]) <= 1/lambda^2.
    not_proved:
      - nested sky masks are sigma fields
      - data-fitted rung estimators are conditional expectations
      - observed calibration is free
  - id: MR-THEOREM-006
    title: Row-equivariant nested finite-rank validity
    truth_status: ESTABLISHED
    evidence_status: EXCHANGEABILITY_PROOF_PLUS_EXISTING_PR197
    replay_status: CURRENT_PLANCK_IMPLEMENTATION_CONSISTENT_REGRESSION_REQUIRED
    release_status: STATISTICAL_FOUNDATION_LEMMA
    statement: >-
      A permutation-equivariant complete observation/null scoring map preserves
      exchangeability; conservative observation-inclusive ranks are super-uniform,
      including nested family scores when every layer is equivariant.
  - id: MR-THEOREM-007
    title: Zero-mean spherical second-moment cone
    truth_status: ESTABLISHED
    evidence_status: CONSTRUCTIVE_SPECTRAL_ANTIPODAL_PROOF
    replay_status: EXTERNAL_WOLFRAM_PASS_PENDING_FORMAL_REPLAY
    release_status: SUPPORTING_REALIZABILITY_LEMMA
    statement: >-
      M is the second moment of a zero-mean antipodal probability measure on S2
      iff M is PSD and trace one.
    not_proved: [higher_moment_cone, nonzero_mean_joint_moment_cone, dynamical_attainability]
  - id: MR-THEOREM-008
    title: VT-T8 eigenframe-slice transversality
    truth_status: ESTABLISHED_ON_ORDERED_SIMPLE_SPECTRUM_BRANCH
    evidence_status: INFINITESIMAL_ORBIT_JACOBIAN_PLUS_EXISTING_14D_JACOBIAN
    replay_status: EXTERNAL_WOLFRAM_PASS_LOCAL_SAGE_LEAN_REQUIRED
    release_status: CENTRAL_PROPOSITION_PENDING_DISCRETE_BRANCH_AND_NOVELTY
    statement: >-
      The diagonal STF eigenframe slice is transverse to the continuous SO(3)
      orbit on the simple-spectrum locus.
  - id: MR-NEGATIVE-009
    title: Broad J1/J2 anchor conjectures
    truth_status: REFUTED_OR_RESTRICTED
    evidence_status: EXISTING_PR254_EXACT_COUNTEREXAMPLES
    replay_status: CURRENT_REPLAY_REQUIRED_BEFORE_LEDGER_PROJECTION
    release_status: NEGATIVE_METHOD_RESULT
    statement: Only the one-way anchor-containment implication survives.
  - id: MR-STAT-010
    title: PR197 exact finite-rank resolution
    truth_status: ESTABLISHED
    evidence_status: ANALYTIC_FORMULA_PLUS_EXISTING_EXACT_ENUMERATION
    replay_status: CURRENT_IMPLEMENTATION_PRESENT
    release_status: METHOD_LEMMA
    statement: >-
      Worst-case conservative rank size is floor(alpha(m+1))/(m+1), ties cannot
      increase rejection, and alpha=0.05 first has a nonempty rejection region
      at m=19 calibration rows.
  - id: MR-BLOCK-011
    title: Physical frame and boost bridge
    truth_status: NOT_ASSESSED_FULLY
