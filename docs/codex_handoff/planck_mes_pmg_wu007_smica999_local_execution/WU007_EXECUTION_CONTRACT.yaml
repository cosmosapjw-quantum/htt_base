schema: audit-compiled-work-unit/v1
id: PMG-WU-007
title: Execute separate SMICA CMB-only 999-row carrier robustness
authority:
  base_sha: 242eb4b9904a0c5d8514f3b50c7341d4837d71f5
  base_tree: 86c580bbdd9d465992b2db6532d1086e1ec1ce9a
  base_branch: changeset/planck-mes-wu006-admission-staging-20260829
  package_branch: changeset/planck-mes-wu007-smica999-preflight-20260829
  upstream_dependencies:
  - PMG-WU-006
objective:
  statement: Process the official 999 SMICA CMB-only FFP10 maps through the exact accepted joint-cutsky operator, preserve their low-ell harmonic carriers and same-row scalar/irrep projections, and calibrate the frozen WU-006 families as a separate null-model robustness lane.
  observable_success: A 1000-row observation-inclusive portable package, map-free replay, exact inventory receipt, primary-separation receipt, reviewed terminal, and externally inspected diagnostic figures exist; no primary artifact or physical claim is changed.
  non_goals:
  - no primary paired-300 replacement
  - no unconditional p-value
  - no foreground-fidelity or component-separation claim
  - no power or injection study
  - no Commander/NILC/SEVEM/NPIPE execution
  - no physical shear/vorticity/local-global/Bianchi inference
  - no manuscript submission revision
  - no additional downloads
risk:
  class: critical
  P0_failure_modes:
  - PMG7-FM-001
  - PMG7-FM-002
  - PMG7-FM-003
  - PMG7-FM-004
  - PMG7-FM-005
  - PMG7-FM-008
  P1_failure_modes:
  - PMG7-FM-006
  - PMG7-FM-007
  - PMG7-FM-009
  - PMG7-FM-010
  - PMG7-FM-011
  - PMG7-FM-012
  - PMG7-FM-013
  - PMG7-FM-014
scope:
  allowed_paths:
  - scripts/observed_runs/preflight_planck_mes_smica999.py
  - scripts/observed_runs/run_planck_mes_smica_cmbonly_999.py
  - tests/integration/test_planck_mes_smica999_preflight.py
  - tests/integration/test_planck_mes_smica_cmbonly_999.py
  - docs/generated/planck_mes_smica_cmbonly_999_irrep/**
  - docs/research_program/post_pr327/planck_mes_wu007_registry.yaml
  forbidden_paths:
  - /mnt/sn850x2t/htt_base_e2e/workdir/raw/**
  - /mnt/sn850x2t/htt_base_e2e/workdir/downloads/**
  - /mnt/sn850x2t/htt_base_e2e/workdir/cobaya_packages/data/**
  - docs/generated/planck_pr3_paired300_irrep_carrier/**
  - docs/generated/planck_mes_irrep_analysis/**
  - papers/**
  forbidden_changes:
  - Do not change the accepted paired-300 primary, WU-006 numerical results, families, tails, reducers, tolerances, or expected ranks.
  - Do not download or repair missing data.
  - Do not query, rerun, or gate on GitHub Actions.
  - Do not promote claims because a rank is small or close to a previous rank.
  - Do not create another planning/audit package.
preconditions:
- id: PMG7-PRE-001
  command: git cat-file -e 242eb4b9904a0c5d8514f3b50c7341d4837d71f5^{commit} && test "$(git rev-parse 242eb4b9904a0c5d8514f3b50c7341d4837d71f5^{tree})" = "86c580bbdd9d465992b2db6532d1086e1ec1ce9a"
  expect: exact PMG-WU-006 authority available
- id: PMG7-PRE-002
  command: git merge-base --is-ancestor 242eb4b9904a0c5d8514f3b50c7341d4837d71f5 HEAD
  expect: implementation descends from accepted WU-006
- id: PMG7-PRE-003
  command: python scripts/validate_planck_mes_pmg_wu007_smica999.py --check-git
  expect: PASS
- id: PMG7-PRE-004
  command: python -m pytest -q tests/contracts/test_planck_mes_pmg_wu007_smica999.py tests/integration/test_planck_mes_smica999_preflight.py
  expect: PASS
invariants:
- id: PMG7-INV-NULL-IDENTITY
  severity_if_violated: P0
  statement: The null rows are exactly official SMICA CMB IDs 00000..00999 excluding 00970, with no noise product.
  mechanical_check:
    command: python -m pytest -q tests/integration/test_planck_mes_smica999_preflight.py -k 'exact_inventory or noise or 00818'
    expect: PASS
- id: PMG7-INV-PRIMARY-SEPARATION
  severity_if_violated: P0
  statement: The 999 lane has distinct output paths, schema, null identity, and claim role and cannot overwrite or supersede the paired-300 primary.
  mechanical_check:
    command: python -m pytest -q tests/integration/test_planck_mes_smica_cmbonly_999.py -k 'primary or separate or overwrite'
    expect: PASS
- id: PMG7-INV-SAME-OPERATOR
  severity_if_violated: P0
  statement: Every 999 null carrier uses the exact accepted operator/layout/frame/units and same-pass retained coefficients.
  mechanical_check:
    command: python -m pytest -q tests/integration/test_planck_mes_smica_cmbonly_999.py -k 'operator or layout or same_pass'
    expect: PASS
- id: PMG7-INV-CLAIM-ENVELOPE
  severity_if_violated: P1
  statement: WU-007 changes only the null/systematics-fidelity axis and never promotes ontological, power, completeness, cross-map, or physical claims.
  mechanical_check:
    command: python -m pytest -q tests/contracts/test_planck_mes_pmg_wu007_smica999.py -k claim
    expect: PASS
- id: PMG7-INV-LOCAL-VERIFICATION
  severity_if_violated: P1
  statement: Completion is based on local focused tests, replay, fresh review, and exact remote readback, not GitHub Actions.
  mechanical_check:
    command: python -m pytest -q tests/contracts/test_planck_mes_pmg_wu007_smica999.py -k actions
    expect: PASS
implementation:
  ordered_steps:
  - id: PMG7-STEP-001
    files:
    - tests/integration/test_planck_mes_smica999_preflight.py
    - tests/integration/test_planck_mes_smica_cmbonly_999.py
    - docs/research_program/post_pr327/planck_mes_wu007_registry.yaml
    action: Freeze the exact inventory, accepted operator/carrier identity, family/tail/reducer registry, output schema, and claim envelope; write and run RED tests.
    must_preserve:
    - accepted WU-005/WU-006 artifacts
    - 301-row primary null identity
  - id: PMG7-STEP-002
    files:
    - scripts/observed_runs/preflight_planck_mes_smica999.py
    action: Run the read-only local preflight, including exact ID/order, containment, 00818 FITS structure plus streaming digest, no partials/noise, and pre/post stat immutability.
    must_preserve:
    - raw bytes
    - no full-tree hash
    - no download
  - id: PMG7-STEP-003
    files:
    - scripts/observed_runs/run_planck_mes_smica_cmbonly_999.py
    action: Reuse the accepted observation carrier; process each official CMB-only null exactly once through the accepted operator and serialize scalar plus 32-component carrier outputs from the same fit.
    must_preserve:
    - row 00818 included
    - 00970 absent
    - no noise reads
    - no second estimator
  - id: PMG7-STEP-004
    files:
    - docs/generated/planck_mes_smica_cmbonly_999_irrep/**
    action: Compute the frozen scalar and irrep families under both accepted reducers, emit result/replay/tables/figures and classify rank differences only as null-ensemble sensitivity.
    must_preserve:
    - no feature/tail/reducer changes
    - methods-diagnostic ceiling
  - id: PMG7-STEP-005
    files:
    - docs/generated/planck_mes_smica_cmbonly_999_irrep/terminal.json
    - docs/generated/planck_mes_smica_cmbonly_999_irrep/plot_audit.json
    action: Run focused/negative/regression checks, map-free replay, external direct figure inspection, and one fresh read-only review with at most one bounded repair; then bind a reviewed terminal.
    must_preserve:
    - no self-attested visual PASS
    - no full-suite default
    - no WU-008 start before PASS
  required_outputs:
  - docs/generated/planck_mes_smica_cmbonly_999_irrep/preflight_summary.json
  - docs/generated/planck_mes_smica_cmbonly_999_irrep/observable_irreps.npz
  - docs/generated/planck_mes_smica_cmbonly_999_irrep/observable_irreps.json
  - docs/generated/planck_mes_smica_cmbonly_999_irrep/result.json
  - docs/generated/planck_mes_smica_cmbonly_999_irrep/replay.json
  - docs/generated/planck_mes_smica_cmbonly_999_irrep/family_table.csv
  - docs/generated/planck_mes_smica_cmbonly_999_irrep/plot_audit.json
  - docs/generated/planck_mes_smica_cmbonly_999_irrep/terminal.json
verification:
  targeted:
  - python -m pytest -q tests/integration/test_planck_mes_smica999_preflight.py tests/integration/test_planck_mes_smica_cmbonly_999.py
  negative:
  - python -m pytest -q tests/integration/test_planck_mes_smica999_preflight.py tests/integration/test_planck_mes_smica_cmbonly_999.py -k 'missing or duplicate or 00970 or 00818 or noise or symlink or mutation or primary or claim'
  regression:
  - python -m pytest -q tests/obsstat/test_lowell_irrep_carrier.py tests/integration/test_planck_irrep_carrier_execution.py tests/integration/test_planck_mes_irrep_analysis.py
  integration:
  - python scripts/observed_runs/preflight_planck_mes_smica999.py --workdir /mnt/sn850x2t/htt_base_e2e/workdir --output-dir docs/generated/planck_mes_smica_cmbonly_999_irrep --private-output /mnt/sn850x2t/htt_base_e2e/workdir/analysis/planck_mes_irrep/smica999/preflight_manifest.json --execute
  - python scripts/observed_runs/run_planck_mes_smica_cmbonly_999.py --replay-committed
  full_relevant_suite: []
completion_evidence:
  required:
  - base_git_head
  - final_git_head
  - final_git_tree
  - git_status_porcelain
  - git_diff_stat
  - git_diff_check
  - executed_test_commands
  - inventory_receipt
  - operator_identity_receipt
  - primary_separation_receipt
  - objective_output_sha256
  - map_free_replay
  - plot_audit
  - fresh_review
  - unresolved_blockers
agent_policy:
  ask_user_questions: false
  guessing_across_spec_boundary: forbidden
  changing_tests_to_fit_implementation: forbidden
  changing_reference_outputs_without_authority: forbidden
  suppressing_failures: forbidden
  claiming_unexecuted_work: forbidden
  creating_successor_planning_package: forbidden
  github_actions_query_rerun_or_gate: forbidden
  additional_downloads: forbidden
review_gate:
  fresh_context_required: true
  read_only_first_pass: true
  pass_condition:
    P0: 0
    P1: 0
  maximum_targeted_repairs: 1
  stopping_rule: After one clean fresh review or one bounded repaired PASS, transition immediately; no review-of-review.
transition:
  pass_next_executable_action: START_PMG-WU-008_INJECTION_POWER_STUDY
  fail_next_action: Emit a narrow typed BLOCKED state, preserve completed rows/checkpoints, and stop without another package.
