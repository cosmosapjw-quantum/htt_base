verification:
  targeted:
  - recompute 98/301 from the committed PR327 package
  - recompute 133/301 from the committed PR315/PR314 package
  - verify row count 301 and exact feature orders
  - verify all six families use the same observation-inclusive scan
  - verify observation/null row permutation equivariance
  - verify manuscript numeric tokens are generated from analysis_summary.json
  negative:
  - reject any directional/local-global/family-identification promotion
  - reject any builder attempt to open raw maps in the first pass
  - reject post-hoc omission or renaming of a predeclared family
  not_required:
  - full repository suite
  - new external reaudit
  - raw map rerun
  - Commander or 999-row expansion
  - new provenance schema
identity_policy:
  immutable_inputs: byte identity remains binding
  deterministic_json_csv: canonical content identity is sufficient unless existing
    contract requires bytes
  figures: scientific/content equivalence; PDF bytes are not a scientific gate
  numerical_outputs: judge exact rational ranks, invariants, and numerical values;
    do not use figure/archive SHA as a scientific acceptance test
claim_matrix:
  allowed:
  - conditional exact finite-ensemble rank under the frozen 301-row operator
  - the typed MES anchors are realization-conditional same-row coordinates
  - the global rank is not unusually small in the frozen ensemble
  - the minimum local rank is morphology-driven rather than anchor-driven
  - Planck-only local/global separation is nonidentified
  forbidden:
  - unconditional p-value
  - detection of anisotropy, shear, vorticity, local boost, or global tilt
  - independent information gain from self-anchors
  - evidence favoring a Bianchi family or non-FLRW geometry
  - claim that 98/301 is significantly different from 133/301
  - claim that MES reveals a hidden anomaly
execution_sequence:
- implement and run the one map-free builder
- inspect only the generated tables/figures for reproduced numerical defects
- write the full first manuscript draft from generated outputs
- run one targeted numeric/claim review and one bounded repair if needed
- stop; do not create another planning or audit package
blockers_for_next_action:
- a required committed map-free package is missing or unreadable
- 98/301 or 133/301 cannot be reproduced under the existing operator
- family decomposition reveals a code/row-order inconsistency
next: RUN_THE_MAP_FREE_PAPER_BUILDER_AND_WRITE_THE_DRAFT
