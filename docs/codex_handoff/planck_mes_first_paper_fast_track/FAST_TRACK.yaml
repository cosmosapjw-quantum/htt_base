statistical_lock:
  tail_policy: two-sided for every frozen coordinate
  score: leave-one-out absolute deviation from the row-excluded median
  local_rank: conservative greater-or-equal observation-inclusive rank
  family_reducer: minimum local rank / maximum negative log rank
  family_rank: observation-inclusive pooled rank over all 301 row scores
  operator_selection: no operator/family selected from observed outcomes
  comparison_interpretation: descriptive paired operator sensitivity only; differences
    between family ranks are not independent hypothesis tests
required_diagnostics:
- global finite rank for all six predeclared families
- local coordinate ranks for GENERIC_12 and MES_10
- feature responsible for each observation-row family minimum
- Pearson and Spearman dependence of sigma and omega anchors
- numerical rank and condition of the two-anchor correlation block
- paired row-score Spearman correlations across family variants
- null row-score distribution with observation marked
- generic-versus-MES rank profile without significance claims on their difference
