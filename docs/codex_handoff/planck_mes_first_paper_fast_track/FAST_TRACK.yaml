findings:
- id: FT-BLOCK-001
  triage: BLOCK_NOW
  severity: P1_FOR_PAPER_INTERPRETATION
  finding: The change 133/301 -> 98/301 conflates dropping C4/C5 with reparameterizing
    C2/C3 into two MES anchors.
  why_it_blocks: Without decomposition, the draft could falsely attribute the rank
    shift to MES physics rather than family composition and coordinate choice.
  minimal_fix: Run the six frozen map-free family variants in predeclared_families
    and report all results without selecting a preferred variant post hoc.
- id: FT-BLOCK-002
  triage: BLOCK_NOW
  severity: P1_FOR_PAPER_INTERPRETATION
  finding: The observed minimum local rank is 16/301 from an octupole multipole-vector
    morphology coordinate, while each MES anchor is 74/301.
  why_it_blocks: The present result cannot be described as an anchor-driven anomaly
    or as evidence that the MES anchors reveal an otherwise hidden signal.
  minimal_fix: Make the anchor/morphology attribution explicit in the abstract, result
    table, family ablations, and discussion.
- id: FT-FIX-001
  triage: FIX_SOON
  severity: P1_FOR_SUBMISSION_PROVENANCE_ONLY
  finding: PR327 metadata records DIRTY_BOUND_BY_GENERATOR_SOURCE_SHA256.
  blocking_for_draft: false
  minimal_fix: Before submission, perform one clean-head map-free replay or repair
    only the provenance binding; do not invalidate numerically reproduced results.
- id: FT-BACKLOG-001
  triage: BACKLOG
  finding: Commander, 999 CMB-only, alternate masks/maps, and Planck PR4 robustness.
  blocking_for_first_draft: false
- id: FT-BACKLOG-002
  triage: BACKLOG
  finding: Direction-indexed moments, physical local/global response, eligible low-z
    lane, native solver, and Bianchi morphology atlas.
  blocking_for_first_draft: false
- id: FT-IGNORE-001
  triage: IGNORE
  finding: Additional audit packages, cryptographic authority, full-suite reruns,
    and repeated hash/provenance layers.
paper_story:
  working_title: Finite-null calibration of MES-anchored low-multipole morphology
    in Planck PR3
  primary_contribution:
  - typed geodesic MES one-way ceiling coordinates from corrected C2 and C3
  - a frozen scalar irreducible morphology family
  - one row-equivariant observation-inclusive finite-null statistic
  - a map-free reproducible Planck PR3 application with honest nonidentification
  primary_result_wording: Within the frozen SMICA observation plus 300 paired FFP10
    CMB+noise ensemble, the MES-family finite rank is 98/301. This is not an unconditional
    p-value and does not constitute an anomaly detection.
  negative_result: No family-level outlier is found; the smallest coordinate rank
    is 16/301 and is a morphology feature rather than an MES anchor.
  novelty_boundary: The contribution is the typed MES-coordinate construction plus
    exact finite-null calibration and claim discipline, not new directional reconstruction
    or local/global identification.
