    mes_branch: MES_G_SIGMA
    authority_status: VERIFIED_NUMERICAL_ANCHOR
    target_invariant: sigma_ab_sigma_ab_over_6H2
    response_status: NO_CURRENT_FULL_PHYSICAL_CMB_RESPONSE
  vorticity:
    state_component: CongruenceKinematics.omega_axial3
    mes_branch: MES_G_OMEGA
    authority_status: VERIFIED_NUMERICAL_ANCHOR
    target_invariant: omega_ab_omega_ab_over_6H2
