    independence: OPTIONAL_GEOMETRY_BLOCK

dimension_counts:
  general_core:
    included_independent_blocks:
      - sigma_ab
      - omega_a
      - A_a
      - beta_RM
      - beta_MO
      - DeltaOmega_k
    raw_dimension: 18
    locally_free_SO3_quotient_dimension: 15
  geodesic_core:
    domain_premise: A_a = 0
    included_independent_blocks:
      - sigma_ab
      - omega_a
      - beta_RM
      - beta_MO
      - DeltaOmega_k
    raw_dimension: 15
    locally_free_SO3_quotient_dimension: 12
  qualifier: >-
    Quotient dimensions use d-3 only on locally free SO3 strata. They are not
    global orbit-separation theorems and do not apply unchanged on strata with
    non-trivial stabilisers. Each admitted optional STF2 geometry block adds
    five raw dimensions before stabiliser corrections.

sector_authority:
