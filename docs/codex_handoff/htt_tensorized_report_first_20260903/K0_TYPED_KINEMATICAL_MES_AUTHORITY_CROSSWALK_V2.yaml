four_object_separation:
  observable_state:
    symbol: O_low
    components:
      - Q_ab
      - O_abc
    meaning: observable low-multipole temperature-tensor morphology
  physical_state:
    symbol: X_phys
    factors:
      - K_congruence
      - V_frame
      - G_geometry
    meaning: typed pre-solver physical state
  anchor_family:
    symbol: B_MES
    meaning: premise-conditioned constraints on named physical invariants
  identified_set:
    symbol: Theta
    meaning: physical states jointly compatible with anchor and response restrictions

state_factorisation:
  congruence_kinematics:
    symbol: K_congruence
    components:
      - sigma_ab
      - omega_a
      - A_a
  frame_velocities:
    symbol: V_frame
    components:
      - beta_RO
      - beta_RM
      - beta_MO
    first_order_relation: beta_RO = beta_RM + beta_MO + O(beta^2)
    rule: beta_RO is closure-derived rather than an additional independent block
  geometry:
    symbol: G_geometry
    scalar_coordinate:
      name: DeltaOmega_k
      semantic_type: SIGNED_SCALAR_CURVATURE_BUDGET_COORDINATE
      dimension: 1
      forbidden_name: anisotropic_curvature_budget
    optional_tensor_components:
      - name: spatial_curvature_stf5
        symbol: three_R_angle_ab
        dimension: 5
        o3_type: STF2_POLAR
      - name: electric_weyl_stf5
        symbol: E_ab
        dimension: 5
        o3_type: STF2_POLAR
      - name: magnetic_weyl_stf5
        symbol: H_ab
        dimension: 5
        o3_type: STF2_AXIAL
      - name: anisotropic_stress_stf5
        symbol: pi_ab
        dimension: 5
        o3_type: STF2_POLAR

representation_registry:
  - id: Q_ab
    dimension: 5
    o3_type: STF2_POLAR
    parity_note: ell_2_even_temperature_multipole
    independence: OBSERVABLE_BLOCK
  - id: O_abc
