  - id: omega_a
    dimension: 3
    o3_type: VECTOR_AXIAL
    independence: PHYSICAL_CORE_BLOCK
  - id: A_a
    dimension: 3
    o3_type: VECTOR_POLAR
    independence: PHYSICAL_CORE_BLOCK_GENERAL_ONLY
  - id: beta_RM
    dimension: 3
    o3_type: VECTOR_POLAR
    independence: PHYSICAL_CORE_BLOCK
  - id: beta_MO
    dimension: 3
    o3_type: VECTOR_POLAR
    independence: PHYSICAL_CORE_BLOCK
  - id: beta_RO
    dimension: 3
    o3_type: VECTOR_POLAR
    independence: FIRST_ORDER_CLOSURE_DERIVED
  - id: DeltaOmega_k
    dimension: 1
    o3_type: SCALAR
    independence: PHYSICAL_CORE_BLOCK
  - id: spatial_curvature_stf5
    dimension: 5
    o3_type: STF2_POLAR
    independence: OPTIONAL_GEOMETRY_BLOCK
  - id: electric_weyl_stf5
    dimension: 5
