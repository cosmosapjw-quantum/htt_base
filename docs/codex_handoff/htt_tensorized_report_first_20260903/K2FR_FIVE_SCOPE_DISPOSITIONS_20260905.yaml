claims:
  - claim_id: RA-ORBIT-004
    disposition: EXISTING_SCOPE_RECOVERED_EXPLICIT_BINDING_PROPOSED
    original_truth_status: DERIVED_CONDITIONAL
    original_role: EVIDENCE_BOUNDARY
    manuscript_locations: ['3.3', '7.3']
    source_refs:
      - authority: T2
        sections: ['1', '2', '3', '12']
      - authority: T4
        sections: ['1', '6']
    proposed_claim_fields:
      scientific_boundary:
        kind: REGISTERED_QO_CHART_REFUSAL_AND_ROW_POLICY
        input_space: Real STF2 quadrupole and STF3 octupole with declared coordinate and norm conventions.
        covered_cases:
          - Zero Q or O, contraction-null states, repeated spectra and noncyclic contractions.
          - Algebraically cyclic states outside the frozen numerical condition limit.
        policies:
          - Preserve the original tensor objects and original row membership.
          - Separate algebraic chart failure from numerical conditioning refusal.
          - Use a full-tensor statistic under a symmetric frozen fallback or pool-level abstention when required by the finite-null analysis.
        exclusions:
          - No imputed zero statistic, manufactured axis or simulation-only row deletion.
          - No all-strata reconstruction theorem or extension to arbitrary packet values.
    interpretation_guard: >-
      Nonzero cyclicity is a premise for successful reconstruction, not a
      premise for recognising chart failure. Requiring it for this refusal
      claim would exclude precisely the zero and singular rows being covered.
    remaining_empirical_admission: No concrete null pool or decoder run is admitted by this annotation.

  - claim_id: RA-STAT-002
    disposition: EXISTING_SCOPE_RECOVERED_EXPLICIT_BINDING_PROPOSED
    original_truth_status: DERIVED_CONDITIONAL
    original_role: CORE_THEOREM
    manuscript_locations: ['6.1', '6.3', '7.1', '7.3']
    source_refs:
      - authority: T4
        sections: ['1', '2', '3', '5', '6', '8']
      - authority: reviewed_source.overlay
        locator: revisions entry RA-STAT-002
    proposed_claim_fields:
      scientific_boundary:
        kind: COMPLETE_ANALYSIS_FINITE_NULL_VALIDITY
        exchangeable_row_route:
          - Observation/reference rows are jointly exchangeable under the declared null.
          - The complete status-and-score map is equivariant under every row permutation used by the rank construction.
          - Tail and tie conventions are fixed, with complete row treatment or symmetric abstention.
          - Data-derived MES ceiling construction and anchor conditioning are included in that same map, along with nuisance fitting, selection, charts and missingness.
        separate_design_route: >-
          A separately justified independent design requires an identified
          validity argument and its own conditioning/calibration assumptions.
          Independence alone is not sufficient and this review registers no
          new independent-design implementation or theorem.
        exclusions:
          - A proper subgroup invariance is not joint exchangeability of arbitrary rows.
          - The transformation-group orbit route remains the separate RA-STAT-004 claim.
          - Same-data constraints are not automatically independent evidence.
          - Tuning on the observed row alone is not validated by rank arithmetic.
    interpretation_guard: >-
      This is a validity guarantee under the named source assumptions, not a
      universal necessity theorem for every conceivable valid rank statistic.
    remaining_empirical_admission: No corrected Planck/FFP10 joint law or selected physical statistic is certified.

  - claim_id: RA-STAT-003
    disposition: EXISTING_SCOPE_RECOVERED_AS_ADMISSION_BOUNDARY
    original_truth_status: DERIVED_CONDITIONAL
    original_role: EVIDENCE_BOUNDARY
    manuscript_locations: ['7.3']
    source_refs:
      - authority: T4
        sections: ['2', '7']
    proposed_claim_fields:
      scientific_boundary:
        kind: NULL_FIDELITY_NOT_IMPLIED_BY_COMMON_REPRESENTATION
        comparison: A noisy observed product versus noise-free CMB-only reference rows in the proposed finite-null calibration.
        required_for_finite_null_admission: >-
          A declared matched observation/reference joint law that establishes
          the applicable exchangeability or conditional randomisation premise,
          including relevant noise, mask, calibration and systematics treatment.
        without_that_justification: Descriptive sensitivity rather than an accepted exact finite-null calibration.
        exclusions:
          - Equal harmonic representation or equal file format is not a joint-law argument.
          - Matching marginal distributions alone is not a proof of joint exchangeability.
          - No universal theorem that arbitrary distributions labelled noisy and noiseless must differ is asserted here.
          - Shared sky or simulation rows are not independent replications without a dependence model.
    interpretation_guard: >-
      The statement is retained as an evidence/admission boundary. It must not
      be strengthened into an unsupported distributional impossibility claim.
    remaining_empirical_admission: A specific faithful joint law has not been established in this theory-only phase.

  - claim_id: RA-PROC-001
    disposition: EXISTING_SCOPE_RECOVERED_EXPLICIT_BINDING_PROPOSED
    original_truth_status: DERIVED_CONDITIONAL
    original_role: CORE_THEOREM
    manuscript_locations: ['8.1', '9.1']
    source_refs:
      - authority: T6
        sections: ['1', '2', '3', '4', '13']
    proposed_claim_fields:
      scientific_boundary:
        kind: FIXED_WU011_PROCESSED_OPERATOR_DOMAIN
        domain:
          - Strictly positive absolute thermodynamic-temperature sky and the scoped d=1 local observer boost.
          - Exact finite boost on its declared velocity domain or the stated first-order approximation, not an interchangeable approximation label.
          - Declared source beam and pixel transfer, HEALPix synthesis, fixed weighted joint ell=0 through 5 estimator, and retained ell=2 through 5 coordinates.
          - Post-fit source/target commonisation under the registered smoothing-only policy.
          - Declared real-coordinate metrics and adapters; mask, nside, cutoffs, harmonic registries, transfer and estimator identities remain part of the operator.
        order:
          - Local boost.
          - Source transfer.
          - HEALPix synthesis.
          - Weighted joint fit.
          - Post-fit commonisation.
          - Retention of the output band.
        exclusions:
          - No reordering of boost and transfer without a separate equivalence proof.
          - No substitution of continuum and finite operators by matching matrix dimensions.
          - No physical-source attribution or exact runtime pass from an operator definition.
    interpretation_guard: >-
      The old runtime_boundary is an execution-history annotation, not the
      scientific scope. It remains separate from these operator premises.
    remaining_empirical_admission: Current finite-HEALPix containment remains RANK_UNRESOLVED.

  - claim_id: RA-ERR-004
    disposition: EXISTING_SCOPE_RECOVERED_EXPLICIT_BINDING_PROPOSED
    original_truth_status: DERIVED_CONDITIONAL
    original_role: EVIDENCE_BOUNDARY
    manuscript_locations: ['11.1', '11.2']
    source_refs:
      - authority: T8
        sections: ['1', '8', '12', '13']
    proposed_claim_fields:
      scientific_boundary:
        kind: PARTIAL_RANK_DOES_NOT_CERTIFY_PROJECTOR
        scope:
          - True and computed operators use the same declared source/output coordinates or an explicit equivalent metric.
          - A partial rank lower bound alone does not bound singular-vector or nuisance-projector orientation.
          - A quantitative subspace interpretation requires a controlled perturbation and positive separation of the target singular cluster under the chosen applicable perturbation theorem.
          - A survivor lower bound using a computed projector additionally requires an established projector error bound in the same norm.
        exclusions:
          - No exact constant or numerical threshold is inferred from the schematic Wedin-type inequality in T8.
          - No singular-value gap or projector bound is inferred from rank alone.
          - No actual finite-HEALPix error-class completeness or stable physical survivor is certified here.
    interpretation_guard: >-
      This row is an explicit limitation on a rank certificate. Recording its
      scope is not evidence that a target gap or a small projector error has
      been measured for the current operator.
    remaining_empirical_admission: Actual error coverage and a target-specific projector bound remain separate obligations.

