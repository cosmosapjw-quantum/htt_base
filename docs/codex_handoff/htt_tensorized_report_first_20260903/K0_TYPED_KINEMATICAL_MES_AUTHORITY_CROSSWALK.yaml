  scalar_mes_sector_bounds: RETAINED_AS_CONDITIONAL_ANCHORS
  scalar_to_tensor_reconstruction: FORBIDDEN
  observable_QO_equals_physical_sigma_omega: FORBIDDEN
  local_beta_RO_equals_global_tilt: FORBIDDEN
  acceleration_anchor_invention: FORBIDDEN
  native_bass_solver: EXCLUDED
  corrected_planck_result: NONE
  finite_healpix_containment: RANK_UNRESOLVED

evidence:
