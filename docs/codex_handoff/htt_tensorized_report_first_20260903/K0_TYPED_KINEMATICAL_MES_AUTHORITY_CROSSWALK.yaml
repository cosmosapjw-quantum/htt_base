state_spaces:
  observable_low_ell:
    symbol: O_low
    components: [Q_ab_STF2_polar, O_abc_STF3_polar]
    meaning: observable low-multipole tensor morphology
  physical_state:
    symbol: X_phys
    factors:
      - K_congruence=(sigma_ab,omega_a,A_a)
      - V_frames=(beta_RO,beta_RM,beta_MO)
      - G_geometry=(DeltaOmegaK,optional_registered_geometry_tensors)
    meaning: typed physical pre-solver state, not generated by scalar bounds
  mes_anchor_family:
    symbol: B_MES(epsilon)
    meaning: premise-conditioned sector bounds on registered physical invariants
  identified_set:
    symbol: Theta(y)
    definition: >-
      Physical states compatible with every available sector anchor and the
      separately declared response/observation relation.

sector_crosswalk:
  - sector: shear
    state_component: CongruenceKinematics.sigma_stf5
    o3_type: STF2_POLAR
    functional_operators: [SIGMA_STF5, TR_SIGMA2, TR_SIGMA3]
    mes_anchor:
      status: VERIFIED
      branch: MES_G_SIGMA
      target_sector: Sigma2
      target_invariant: sigma_ab_sigma_ab_over_6H2
      frame: registered MES fundamental-observer frame
      congruence: geodesic
      normalization: Sigma2_std
      perturbative_order: linear almost-EGS
    response_status: NO_CURRENT_FULL_PHYSICAL_CMB_FORWARD_RESPONSE_IN_REPORT_A
    identification_status: PARTIAL_OR_NON_IDENTIFIED
  - sector: vorticity
    state_component: CongruenceKinematics.omega_axial3
    o3_type: AXIAL_VECTOR
    functional_operators: [OMEGA_AXIAL3, OMEGA2]
    mes_anchor:
      status: VERIFIED
      branch: MES_G_OMEGA
      target_sector: W2
      target_invariant: omega_ab_omega_ab_over_6H2
      frame: registered MES fundamental-observer frame
      congruence: geodesic
      normalization: W2_std
      perturbative_order: linear almost-EGS
    response_status: NO_CURRENT_FULL_PHYSICAL_CMB_FORWARD_RESPONSE_IN_REPORT_A
    identification_status: PARTIAL_OR_NON_IDENTIFIED
  - sector: acceleration
    state_component: CongruenceKinematics.acceleration_polar3
    o3_type: POLAR_VECTOR
    functional_operators: [ACCELERATION_POLAR3]
    mes_anchor:
      status: NO_MES_ANCHOR
      branch: MES_G_ACCEL
      reason: registered geodesic premise; no active acceleration ceiling
    response_status: UNRESOLVED
    identification_status: ANCHOR_UNAVAILABLE_AND_RESPONSE_UNRESOLVED
  - sector: observer_radiation_velocity
    state_component: VelocityFrameBundle.beta_RO
    o3_type: POLAR_VECTOR
    functional_operators: [BETA_RO_POLAR3]
    mes_anchor: {status: NOT_A_MES_ANCHOR}
    response_status: WU010_FULL_SKY_LOCAL_OBSERVER_RESPONSE_IMPLEMENTATION_VERIFIED
    identification_status: LOCAL_OBSERVER_RESPONSE_ONLY_NOT_GLOBAL_TILT
  - sector: radiation_matter_velocity
    state_component: VelocityFrameBundle.beta_RM
    o3_type: POLAR_VECTOR
    functional_operators: [BETA_RM_POLAR3, BETA_RM2, BETA_RM_DOT_OMEGA, BETA_RM_SIGMA_BETA_RM]
    mes_anchor: {status: NO_REGISTERED_ACTIVE_MES_ANCHOR}
    response_status: UNRESOLVED
    identification_status: TYPED_FRAME_RELATION_ONLY
  - sector: matter_observer_velocity
    state_component: VelocityFrameBundle.beta_MO
    o3_type: POLAR_VECTOR
    functional_operators: [BETA_MO_POLAR3]
    mes_anchor: {status: NO_REGISTERED_ACTIVE_MES_ANCHOR}
    response_status: UNRESOLVED
    identification_status: TYPED_FRAME_RELATION_ONLY
  - sector: anisotropic_curvature_budget
    state_component: GeometryState.delta_omega_k
    o3_type: SIGNED_SCALAR
    functional_operators: [DELTA_OMEGA_K]
    mes_anchor:
      status: NO_MES_ANCHOR
      branch: NO_MES_BRANCH
      reason: no registered MES curvature ceiling
    response_status: REQUIRES_INDEPENDENT_FORWARD_MODEL
    identification_status: PARTIAL_OR_NON_IDENTIFIED
  - sector: optional_geometry_tensors
    state_component: GeometryState.optional_STF2_fields
    o3_type: POLAR_OR_AXIAL_STF2_AS_REGISTERED
    functional_operators: []
    mes_anchor: {status: NO_CURRENT_REPORT_A_ANCHOR}
    response_status: REQUIRES_INDEPENDENT_FORWARD_MODEL
    identification_status: MISSING_OR_UNRESOLVED_COMPONENTS_REMAIN_TYPED

structural_claims:
  state_anchor_separation: >-
    A physical tensor/vector state is not an anchor body, and an anchor value is
    not a physical-state estimate.
  radial_only_information: >-
    An O(3)-invariant norm bound is constant on rotational orbits; it restricts
    magnitude but cannot select orientation or tensor morphology.
  sector_matching: >-
    A stress ratio is numeric only when numerator and anchor channel keys match
    in sector, invariant, frame, congruence, normalization, perturbative order and branch.
  product_body_anti_cancellation: >-
    For available Euclidean sector balls, the product-body Minkowski gauge is
    max_j(||x_j||/R_j), not a signed sum.
  typed_absence: >-
    Missing components and unavailable anchors remain typed and are never
    replaced by numerical zero.
  response_limited_identification: >-
    MES constraints alone do not identify a physical tensor state; inadequate
    or missing response yields an identified set or abstention.

provisional_claim_candidates:
  - RA-KIN-001 typed congruence/frame/geometry state partition
  - RA-KIN-002 kinematical tensors and frame-relative velocities are distinct
  - RA-KIN-003 missing physical components are typed and never zero-imputed
  - RA-KFUNC-001 O(3)-typed functional-indexed physical-state evaluation
  - RA-MESA-001 physical state and MES anchor body are distinct objects
  - RA-MESA-002 active MES anchors are registered for shear and vorticity only
  - RA-MESA-003 MES norm bounds are radial-only and do not reconstruct directions
  - RA-MESA-004 channel-matched sector stress and product-body anti-cancellation
  - RA-ID-001 response-constrained identified set and abstention
  - RA-ID-002 WU010 beta_RO is the only currently closed kinematical response lane

claim_count_policy:
  current_claims: 30
  provisional_new_claims: 10
  maximum_provisional_total: 40
  final_count_frozen_in: K2_CLAIM_LEDGER_RECOMPILE
  no_claim_promotion_in_k0: true

scope_firewall:
