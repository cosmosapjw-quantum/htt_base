      separate source-binding receipt before parent adjudication.
    state: SOURCE_IMPLEMENTED
  - id: R4A1V0-SYMPY-01
    previous_state: >-
      The SymPy axis used a generic 2-by-2 Gram fixture but did not explicitly
      encode the nonzero-vector condition required by the general PosDef
      implication.
    repair: >-
      The axis retains the exact Gram-type SOS identity and separately checks
      the dimension-independent ordered implication q_psd>=0, ||x||^2>0,
      lambda_reg>0 => q_psd+lambda_reg^2||x||^2>0.
    state: SOURCE_IMPLEMENTED
  - id: R4A1V0-ROUTE-01
    previous_state: >-
      lean-action built the package before cas_gate, so an elaboration failure
      could terminate the workflow without a typed parent adjudication.
    repair: >-
      lean-action now installs/caches only; the Lean wrapper and module
      elaboration are launched by cas_gate run-adjudicate.
    state: SOURCE_IMPLEMENTED

