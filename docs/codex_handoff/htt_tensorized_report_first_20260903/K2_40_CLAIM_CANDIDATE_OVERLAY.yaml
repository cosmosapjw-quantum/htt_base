additions:
  - id: RA-KIN-001
    statement: >-
      The physical anisotropy state is a typed product of congruence
      kinematics, frame-relative velocities and geometry, distinct from the
      observable Q/O temperature-tensor state.
    truth_status: SOURCE_DEFINED_EXACT
    implementation_status: SOURCE_IMPLEMENTED_IN_DIVERGED_DONOR
    report_role: CORE_THEOREM
    authority:
      - K0_TYPED_KINEMATICAL_MES_AUTHORITY_CROSSWALK_V2
      - K1R-T1-STATE-PARTITION
      - PR367_joint_anisotropy_state
    assumptions:
      - declared frame, congruence, epoch, scale, basis, units and perturbative branch
    forbidden_extensions:
      - observable_tensor_equals_physical_tensor
      - untyped_legacy_projection_as_state
      - donor_execution_inferred_on_report_branch

  - id: RA-KIN-002
    statement: >-
      beta_RO, beta_RM and beta_MO have distinct frame semantics; the
      registered first-order closure is diagnostic and does not identify
      global matter-frame tilt.
    truth_status: DERIVED_CONDITIONAL
    implementation_status: SOURCE_IMPLEMENTED_IN_DIVERGED_DONOR
    report_role: CORE_THEOREM
    authority:
      - K0_TYPED_KINEMATICAL_MES_AUTHORITY_CROSSWALK_V2
      - K1R-T1-STATE-PARTITION
      - K1R-T11-BETA-BOUNDARY
      - PR367_VelocityFrameBundle
    assumptions:
      - first-order velocity-frame closure convention
    forbidden_extensions:
      - beta_RO_equals_beta_MO_without_beta_RM_premise
      - beta_RO_equals_global_tilt
      - source_attribution_from_closure

  - id: RA-KIN-003
    statement: >-
      Missing physical components and unavailable numerical anchors remain
      typed and are never replaced by zero, an infinite bound or a guessed
      radius.
    truth_status: SOURCE_DEFINED_EXACT
    implementation_status: SOURCE_IMPLEMENTED_IN_DIVERGED_DONOR
    report_role: EVIDENCE_BOUNDARY
    authority:
      - K1R-T1-STATE-PARTITION
      - K1R-T4-ACCELERATION-PREMISE-ANCHOR-SPLIT
      - PR367_missing_component_and_anchor_status_contracts
    assumptions:
      - exact typed-state and anchor-status contracts
    forbidden_extensions:
      - zero_imputation
      - guessed_anchor
      - missingness_as_physical_null

  - id: RA-GEO-001
    statement: >-
      DeltaOmega_k is a signed scalar curvature-budget coordinate distinct
      from optional anisotropic spatial-curvature, Weyl and stress STF tensors;
      the quoted d-3 quotient counts apply only on locally free SO3 strata.
    truth_status: DERIVED_CONDITIONAL
    implementation_status: SOURCE_IMPLEMENTED_IN_DIVERGED_DONOR
    report_role: CORE_THEOREM
    authority:
      - K0_TYPED_KINEMATICAL_MES_AUTHORITY_CROSSWALK_V2
      - K1R-T2-GEOMETRY-DIMENSION-PARITY
      - PR367_GeometryState
    assumptions:
      - registered GeometryState convention
      - beta_RO treated as first-order closure-derived in the core count
      - optional geometry tensors excluded from the stated core count
      - locally free SO3 action for quotient subtraction
    forbidden_extensions:
      - scalar_budget_as_anisotropic_curvature_tensor
      - dimension_count_as_global_orbit_separation
      - unchanged_count_on_nontrivial_stabiliser_strata

  - id: RA-KFUNC-001
    statement: >-
      Physical tensor functionals retain codomain, O3 type, parity, frame,
      congruence, source-state identity and optional anchor identity
      independently of observational identification.
    truth_status: SOURCE_DEFINED_EXACT
    implementation_status: SOURCE_IMPLEMENTED_IN_DIVERGED_DONOR
    report_role: CORE_THEOREM
    authority:
      - K1R-T12-PHYSICAL-MORPHOLOGY-AND-SCALAR-INHERITANCE
      - PR367_tensor_functionals
    assumptions:
      - registered TensorFunctionalSpec and TensorFunctionalResult contract
    forbidden_extensions:
      - functional_exists_implies_observational_identification
      - scalarization_erases_tensor_source_authority
      - diagnostic_functional_as_likelihood

  - id: RA-MESA-001
    statement: >-
      The active geodesic MES authority provides numerical shear and
      vorticity anchors, while acceleration is a structural geodesic premise
      with no numerical MES denominator and optional geometry sectors remain
      unanchored.
    truth_status: SOURCE_DEFINED_EXACT
    implementation_status: SOURCE_IMPLEMENTED
    report_role: CORE_THEOREM
    authority:
      - K1R-T3-ANCHOR-SEPARATION
      - K1R-T4-ACCELERATION-PREMISE-ANCHOR-SPLIT
      - PR124_MES_theorem_authority
      - PR252_typed_anchor_surface
    assumptions:
      - exact registered geodesic MES branch
    forbidden_extensions:
      - zero_radius_acceleration_anchor
      - nongeodesic_acceleration_ceiling
      - invented_geometry_anchor

  - id: RA-MESA-002
    statement: >-
      A numerical sector stress requires exact channel matching and a fixed
      ensemble-calibrated positive denominator; a realisation-conditional
      anchor remains ratio-unidentified and requires joint random-anchor
      inference.
    truth_status: SOURCE_DEFINED_EXACT
    implementation_status: SOURCE_IMPLEMENTED
    report_role: CORE_THEOREM
    authority:
      - K1R-T7-QUADRATIC-STRESS
      - K1R-T8-CHANNEL-MATCH
      - PR252_SectorStress_and_Fieller_contracts
    assumptions:
      - exact channel identity
      - fixed ensemble-calibrated denominator for direct division
    forbidden_extensions:
      - cross_channel_ratio
      - random_denominator_treated_as_fixed
      - stress_as_probability_or_evidence

  - id: RA-MESA-003
    statement: >-
      For a factorised product anchor body the combined Minkowski gauge is the
      maximum sector gauge and its square equals the maximum quadratic sector
      saturation; this formula does not extend automatically to the coupled
      response-constrained feasible set.
    truth_status: DERIVED_EXACT
    implementation_status: SOURCE_IMPLEMENTED_IN_DIVERGED_DONOR
    report_role: CORE_THEOREM
    authority:
      - K1R-T6-PRODUCT-GAUGE
      - K1R-T7-QUADRATIC-STRESS
      - PR367_anchor_geometry
      - PR189_joint_feasible_set
    assumptions:
      - factorised Cartesian-product anchor body
      - available absorbing sector blocks
      - positive registered radii
    forbidden_extensions:
      - signed_cross_sector_cancellation
      - product_gauge_as_coupled_feasible_set_gauge
      - gauge_margin_equals_quadratic_exceedance

  - id: RA-ID-001
    statement: >-
      When MES ceilings and response compatibility use the same data, the
      physical identified set jointly conditions on both restrictions and the
      two restrictions are not independent evidence without an additional
      joint-law argument.
    truth_status: DERIVED_CONDITIONAL
    implementation_status: SOURCE_SUPPORTED
    report_role: CORE_THEOREM
    authority:
      - K1R-T9-JOINT-IDENTIFIED-SET
      - PR136_identified_set
      - PR189_joint_feasible_set
      - partial_identification_literature
    assumptions:
      - predeclared analysis and nuisance policy eta
      - declared response and compatibility region
      - data-derived anchor construction included in the complete analysis map
    forbidden_extensions:
      - independent_evidence_multiplication_without_joint_law
      - anchor_construction_omitted_from_finite_null_map
      - empty_set_as_detection
      - broad_set_as_central_estimate

  - id: RA-ID-002
    statement: >-
      Under an exact linear response, point identification is equivalent to a
      singleton admissible response-kernel fibre; absent or inadequate
      response providers yield partial identification, non-identification or
      abstention rather than inferred tensors.
    truth_status: DERIVED_EXACT
    implementation_status: SOURCE_SUPPORTED
    report_role: CORE_THEOREM
    authority:
      - K1R-T10-SINGLETON-FIBRE
      - K1R-T11-BETA-BOUNDARY
      - PR136_identified_set
    assumptions:
      - exact linear response for the stated singleton criterion
      - predeclared feasible domain
    forbidden_extensions:
      - full_column_rank_as_necessary
      - solver_failure_as_nonidentification
      - missing_response_as_point_estimate
      - response_unavailable_as_physical_null

revisions:
  - id: RA-MES-002
    replacement_statement: >-
      The retained MES shear and vorticity ceilings are one-way,
      premise-conditioned radial anchors on named physical sectors, not tensor
      observations, state estimates, distances, occupancy measures or direct
      measurements of shear or vorticity.
    add_authority:
      - K1R-T3-ANCHOR-SEPARATION
      - K1R-T5-RADIAL-ONLY
      - K1R-T12-PHYSICAL-MORPHOLOGY-AND-SCALAR-INHERITANCE
    add_forbidden_extensions:
      - anchor_as_tensor_state
      - scalar_radius_as_morphology

  - id: RA-MES-003
    replacement_statement: >-
      Rotational scalars and orbit-constant MES anchor bodies cannot
      equivariantly generate a nonzero vector or STF tensor without additional
      directional data, while separately typed physical morphology remains a
      valid state property.
    add_authority:
      - K1R-T5-RADIAL-ONLY
      - K1R-T12-PHYSICAL-MORPHOLOGY-AND-SCALAR-INHERITANCE
    add_forbidden_extensions:
      - radial_no_go_denies_physical_morphology

  - id: RA-RESP-001
    replacement_statement: >-
      WU010 supplies the exact full-sky thermodynamic-temperature
      radiation-observer Lorentz pullback for the scoped beta_RO lane on
      strictly positive absolute skies with d=1; it does not close beta_RM,
      beta_MO, global tilt or congruence-kinematical responses.
    add_authority:
      - K1R-T11-BETA-BOUNDARY
      - K0_TYPED_KINEMATICAL_MES_AUTHORITY_CROSSWALK_V2
    add_forbidden_extensions:
      - beta_RO_equals_beta_MO_without_beta_RM_premise
      - congruence_response_from_observer_boost

  - id: RA-STAT-002
    replacement_statement: >-
      Data-adaptive finite-null validity requires row symmetry of the complete
      analysis map, including data-derived MES ceiling construction, anchor
      conditioning, chart handling, nuisance fitting, selection, missingness,
      tie handling and final scoring, or a valid independent design.
    add_authority:
      - K1R-T9-JOINT-IDENTIFIED-SET
    add_forbidden_extensions:
      - data_derived_anchor_fixed_only_on_observation_row
      - common_data_constraints_treated_as_independent_evidence

