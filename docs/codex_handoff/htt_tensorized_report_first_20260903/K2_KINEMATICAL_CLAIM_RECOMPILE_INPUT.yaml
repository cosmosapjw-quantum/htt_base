proposed_new_claims:
  - id: RA-KIN-001
    source_theorems: [K1-T1-STATE-PARTITION]
    statement: >-
      The physical anisotropy state is a typed product of congruence
      kinematics, frame-relative velocities and geometry, distinct from the
      observable Q/O tensor state.
  - id: RA-KIN-002
    source_theorems: [K1-T1-STATE-PARTITION, K1-T8-BETA-BOUNDARY]
    statement: >-
      beta_RO, beta_RM and beta_MO have different frame semantics; their
      first-order closure is diagnostic and does not identify global tilt.
  - id: RA-KIN-003
    source_theorems: [K1-T1-STATE-PARTITION, K1-T6-NO-ANCHOR]
    statement: >-
      Missing physical components and unavailable anchors remain typed and are
      never replaced by numerical zero or a guessed radius.
  - id: RA-KFUNC-001
    source_theorems: [K1-T9-PHYSICAL-MORPHOLOGY]
    statement: >-
      Physical tensor functionals retain codomain, O(3) type, parity, frame,
      congruence and anchor identity independently of observational
      identification.
  - id: RA-MESA-001
    source_theorems: [K1-T2-ANCHOR-SEPARATION, K1-T6-NO-ANCHOR]
    statement: >-
      Active geodesic MES anchors are registered for the shear and vorticity
      invariants; acceleration and anisotropic curvature carry typed no-anchor
      outcomes.
  - id: RA-MESA-002
    source_theorems: [K1-T4-PRODUCT-GAUGE, K1-T5-CHANNEL-MATCH]
    statement: >-
      A matched multi-sector MES stress uses exact channel keys and the maximum
      product-body gauge, preventing cross-sector signed cancellation.
  - id: RA-ID-001
    source_theorems: [K1-T7-RESPONSE-IDENTIFIED-SET]
    statement: >-
      Available anchors and a declared response define a physical identified
      set; point attribution is allowed only when that set is a singleton under
      the declared assumptions.

