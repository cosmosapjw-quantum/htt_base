schema: htt.report_a.execution_receipt_index.v2
date: 2026-09-03
repository: cosmosapjw-quantum/htt_base
purpose: >-
  Separate scientific truth, source presence, execution, byte-exact replay,
  and publication status. A workflow conclusion without executed steps is not
  a test failure or pass.

status_vocabulary:
  EXECUTED_SUCCESS: runner assigned and declared checks completed successfully
  EXECUTED_FAILURE: runner assigned and at least one declared check failed
  MIXED_EXECUTED_EVIDENCE: scoped checks succeeded but a broader suite remained non-green
  PRESTART_NO_EXECUTION: job completed without runner assignment or steps
  SOURCE_ONLY: code or test source exists without an accepted execution receipt
  ARTIFACT_ONLY: committed generated evidence exists without accepted generating-run readback
  LOCAL_NON_BYTE_EXACT: an external or source-equivalent local run exists but not on the exact repository checkout
  SUMMARY_ONLY: a prose or user-supplied result is not a materialized proof/execution

