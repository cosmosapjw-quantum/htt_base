vocabulary:
  disposition:
    INCLUDE_CORE: central Report A result
    INCLUDE_LIMITED: include only with explicit assumptions and ceiling
    FRAMEWORK_ONLY: architectural or typed-contract background, not a theorem of the report target
    INPUT_ONLY: historical object may be consumed as immutable input later
    DEFER_PROOF: plausible/source-supported statement requiring direct proof or independent review
    UNRESOLVED: current evidence does not decide the statement
    EXCLUDE_WITHDRAWN: superseded or scientifically withdrawn
    EXCLUDE_SCOPE: outside HTT-only report
  evidence:
    ESTABLISHED: standard external theorem with matched assumptions
    DERIVED: reproduced directly in the current audit
    LITERATURE_SUPPORTED: architecture or premise supported by primary literature
    NUMERICALLY_CHECKED: computed under a declared numerical contract
    IMPLEMENTATION_VERIFIED: exact implementation plus accepted execution receipt
    SOURCE_IMPLEMENTED: code exists but accepted execution is absent
    SUMMARY_ONLY: user/prose theorem summary, formal dossier absent
    BLOCKED: required evidence unavailable

