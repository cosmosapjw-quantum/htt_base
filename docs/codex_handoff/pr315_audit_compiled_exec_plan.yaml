schema: htt.audit_compiled_pr.v2

identity:
  proposed_pr_id: PR-315
  title: Planck SMICA joint cut-sky low-ell robustness and portable feature replay
  risk: high
  owner: OBSSTAT
  audited_predecessor: PR-314
  audited_base_sha: 883a7cf41116e6740b1bac9b76a5e9c6b3fd188e
  audited_base_tree: de7b83aac8a5357e9cfee518924ab6c0a0972fb3
  audited_result_sha256: 898d08fc7c70205fbb8c7580fbaef1074357a8b3255ac77afd8273b92511da97
  capability: PLANCK_SMICA_JOINT_CUTSKY_LOWELL_ROBUSTNESS_AND_PORTABLE_FEATURE_REPLAY
  deployment_profile: private_single_researcher_local_v1

fast_path_contract:
  user_authorized: true
  primary_component: SMICA
  primary_null_rows: 300
  primary_null_semantics: FFP10_CMB_PLUS_NOISE_PAIRED_BY_ID
  commander_required: false
  CMB_only_999_required: false
  full_repository_suite_required_locally: false
  forbidden_drift:
    - expand scope merely to wait for Commander
    - pool 999 CMB-only rows with 300 primary rows
    - replace focused direct-consumer verification with generic assurance work
    - select an operator branch from its observed rank

DAG_integration:
  mode: append_only_successor
  depends:
    - PR-314
  dependency_mode: requires_terminal_receipt
  preserve_existing_topological_order: true
  forbidden:
    - reorder_existing_PRs
    - change_existing_dependencies
    - delete_or_relabel_PR314_evidence
  first_repository_step: >-
    After PR-314 has an exact terminal disposition, register PR-315 as its
    append-only successor with the existing DAG generator and regenerate the
    canonical and machine-readable mirrors. If PR-314 closes without merge,
    bind its exact terminal receipt; never invent predecessor success.

objective:
  statement: >-
    Preserve the exact PR-314 delivered-full-sky SMICA result, add a
    mathematically correct joint monopole/dipole plus ell=2..5
    mask-conditioned estimator, rerun the same exact 300-pair fast slice, and
    export a feature-level portable replay and an explicit old-versus-new
    scientific comparison.
  observable_success: >-
    One reviewed candidate emits the frozen PR-314 result unchanged, one
    separately named joint cut-sky result, one portable 12+300x12 feature
    package, and a branch comparison without Commander, global, source,
    Bayesian, cross-probe or Bianchi claims.

scope:
  allowed_paths:
    - scripts/observed_runs/prepare_planck_pr3_admission.py
    - scripts/observed_runs/run_planck_pr3.py
    - htt/obsstat/planck_pr3_operator.py
    - htt/obsstat/planck_post275_lane.py
    - tests/integration/test_planck_pr3_admission_preparation.py
    - tests/integration/test_planck_pr3_current_stack.py
    - tests/integration/test_planck_pr3_operator.py
    - .github/workflows/repository-integrity.yml
    - docs/PR_DELTAS/pr-315.md
    - docs/research_program/post_pr275/pr315_spec.yaml
    - docs/research_program/post_pr275/pr315_planck_smica_rerun_report.md
    - docs/generated/pr315_planck_smica_feature_replay.*
    - docs/generated/pr315_planck_smica_result.json
    - docs/codex_handoff/pr_backlog.yaml
    - docs/codex_handoff/pr_backlog.json
    - machine_readable/pr_backlog.yaml
    - machine_readable/pr_backlog.json
    - docs/codex_handoff/pr_status.yaml
    - machine_readable/pr_status.yaml
    - scripts/codex_harness/validate_post300_dag.py
    - direct fixed-count consumers proven by a failing test
  forbidden_paths:
    - data/canonical/**
    - legacy/**
    - docs/generated/pr314_planck_pr3_smica_existing_result.json
    - docs/generated/pr314_planck_pr3_smica_existing_replay.json
    - PR-289 exact seven-source files
  hard_limits:
    new_security_or_authorization_frameworks: 0
    new_ledgers: 0
    Rust_changes: 0
    whole_pipeline_rewrite: false
    new_science_modules_max: 1
  forbidden_changes:
    - change expected scientific output merely to pass a test
    - pool CMB-only and CMB-plus-noise rows
    - describe reused or paired rows as more independent than they are
    - add Commander values without complete Commander inputs
    - weaken claim ceiling or family-identification firewall
    - remove or overwrite the original PR-314 result
    - make the joint cut-sky branch primary after inspecting observed ranks
    - use sequential monopole/dipole removal as a substitute for the joint fit

preconditions:
  - id: PRE-001
    command: git rev-parse HEAD HEAD^{tree}
    expect: exact PR-314 terminal head/tree or a recorded stacked successor
  - id: PRE-002
    command: git status --porcelain=v1 --untracked-files=all
    expect: empty
  - id: PRE-003
    command: >-
      PYTHONPATH=htt:htt/src:htt/htt python -m pytest -q
      tests/integration/test_planck_pr3_admission_preparation.py
      tests/integration/test_planck_pr3_current_stack.py
      tests/integration/test_planck_pr3_operator.py
    expect: baseline PASS
  - id: PRE-004
    command: sha256sum docs/generated/pr314_planck_pr3_smica_existing_result.json
    expect: 898d08fc7c70205fbb8c7580fbaef1074357a8b3255ac77afd8273b92511da97

invariants:
  - id: SCI-001
    severity_if_violated: P0
    statement: >-
      The cut-sky estimator profiles monopole, dipole and all retained
      ell=2..5 real harmonics in one joint weighted linear system, or by an
      exactly equivalent FWL projection of both data and retained design.
    mechanical_check:
      test: tests/integration/test_planck_pr3_operator.py::test_joint_cutsky_fit_recovers_known_lowell_with_arbitrary_monopole_dipole
  - id: SCI-002
    severity_if_violated: P1
    statement: >-
      Pixels with zero common-mask weight cannot alter the joint cut-sky
      retained coefficients or any derived feature.
    mechanical_check:
      test: tests/integration/test_planck_pr3_operator.py::test_masked_region_contamination_cannot_change_joint_cutsky_features
  - id: SCI-003
    severity_if_violated: P0
    statement: >-
      Observation and every primary null row use byte-identical joint cut-sky
      operator code and configuration.
    mechanical_check:
      test: tests/integration/test_planck_pr3_current_stack.py::test_observation_and_null_joint_operator_identity_is_exact
  - id: SCI-004
    severity_if_violated: P0
    statement: >-
      The primary null remains exactly 300 ordered paired SMICA CMB-plus-noise
      rows and is never pooled with CMB-only rows.
    mechanical_check:
      test: tests/integration/test_planck_pr3_admission_preparation.py::test_primary_pair_manifest_is_exact_ordered_and_hash_bound
  - id: SCI-005
    severity_if_violated: P0
    statement: A partial, mismatched or reordered primary inventory emits no result.
    mechanical_check:
      test: tests/integration/test_planck_pr3_current_stack.py::test_partial_or_mismatched_rerun_emits_no_result
  - id: SCI-006
    severity_if_violated: P0
    statement: >-
      A singular or over-conditioned joint normal matrix, undefined
      multipole-vector plane, or unstable beam/pixel transfer produces a typed
      abstention.
    mechanical_check:
      test: tests/integration/test_planck_pr3_operator.py::test_joint_cutsky_fit_abstains_on_rank_condition_or_plane_failure
  - id: SCI-007
    severity_if_violated: P1
    statement: >-
      PR-314 remains the frozen delivered-product two-sided omnibus and the
      joint cut-sky branch is separately named; neither branch is selected by
      observed outcome.
    mechanical_check:
      test: tests/integration/test_planck_pr3_current_stack.py::test_branch_and_tail_registry_are_frozen_before_rerun
  - id: SCI-008
    severity_if_violated: P1
    statement: >-
      The raw observed map, common mask, all 300 raw CMB files, all 300 raw
      noise files and exact pair order are hash-bound before attended execution.
    mechanical_check:
      test: tests/integration/test_planck_pr3_admission_preparation.py::test_raw_observation_and_pair_manifest_are_acceptance_bound
  - id: SCI-009
    severity_if_violated: P1
    statement: >-
      The portable feature package alone exactly reproduces covariance
      diagnostics, all local ranks and the family rank.
    mechanical_check:
      test: tests/integration/test_planck_pr3_current_stack.py::test_portable_feature_package_recomputes_exact_result
  - id: SCI-010
    severity_if_violated: P1
    statement: >-
      The original PR-314 result is retained and explicitly compared, not
      silently replaced.
    mechanical_check:
      command: >-
        python scripts/check_claim_language.py --strict-missing
        docs/PR_DELTAS/pr-315.md
        docs/research_program/post_pr275/pr315_planck_smica_rerun_report.md
  - id: SCI-011
    severity_if_violated: P1
    statement: PR-315 tests and portable replay execute in clean pull-request CI.
    mechanical_check:
      command: inspect and execute the PR-315 Repository-integrity step

failure_modes:
  - id: FM-001
    severity: P0
    trigger: sequential nuisance removal changes retained coefficients on a cut sky
    required_detection: SCI-001
    stop: BLOCKED_JOINT_NUISANCE_PROFILE_NOT_CLOSED
  - id: FM-002
    severity: P1
    trigger: masked-only contamination changes the joint cut-sky branch
    required_detection: SCI-002
    stop: BLOCKED_MASK_CONDITIONED_ROBUSTNESS
  - id: FM-003
    severity: P0
    trigger: observation and null rows use different operator order or configuration
    required_detection: SCI-003
    stop: BLOCKED_OBSERVATION_NULL_OPERATOR_MISMATCH
  - id: FM-004
    severity: P0
    trigger: fewer than 300 pairs, wrong order, duplicate pair or CMB-only pooling reaches calibration
    required_detection: SCI-004 and SCI-005
    stop: BLOCKED_PRIMARY_NULL_INVENTORY
  - id: FM-005
    severity: P1
    trigger: branch or tail family is selected after observed result inspection
    required_detection: SCI-007
    stop: BLOCKED_POST_HOC_ESTIMAND
  - id: FM-006
    severity: P1
    trigger: result cannot be recomputed from the feature package without raw maps
    required_detection: SCI-009
    stop: BLOCKED_PORTABLE_REPLAY_INCOMPLETE
  - id: FM-007
    severity: P1
    trigger: new result silently replaces or relabels PR-314
    required_detection: SCI-010
    stop: BLOCKED_RESULT_PROVENANCE

implementation:
  ordered_steps:
    - id: STEP-000
      action: >-
        Register PR-315 append-only after the exact PR-314 terminal
        disposition and regenerate existing DAG/status mirrors with current
        generators.
      must_preserve:
        - every existing PR order and dependency
    - id: STEP-001
      action: >-
        Add RED tests for joint nuisance recovery, masked contamination,
        observation/null identity, pair manifest, portable replay and frozen
        branch/tail registry before production edits.
      expect_before_patch:
        - joint nuisance known-alm oracle fails on the PR-314 path
        - masked contamination oracle fails on the legacy branch
    - id: STEP-002
      action: >-
        Implement a chunked joint weighted fit over the 36 real harmonics
        ell=0..5. Retain the 32 ell=2..5 coefficients. Do not materialize a
        full high-resolution design matrix.
      files:
        - htt/obsstat/planck_pr3_operator.py
        - scripts/observed_runs/prepare_planck_pr3_admission.py
      record:
        - basis_order
        - mask_hash
        - normal_matrix_hash
        - condition_number
        - singular_floor
        - weighted_residual_norm
    - id: STEP-003
      action: >-
        Freeze source/target beam and pixel-window semantics and apply the
        transfer to retained coefficients after the joint masked fit.
    - id: STEP-004
      action: >-
        Generate an ordered raw-input manifest and bind its digest in attended
        acceptance before the observed rerun.
    - id: STEP-005
      action: >-
        Preserve the PR-314 full-sky branch and add the joint cut-sky branch as
        a separately named estimator. Freeze branch roles before observing new
        ranks.
    - id: STEP-006
      action: >-
        Export and verify a compact feature package with observed row, null
        matrix, covariance, row IDs, feature order/units, tail registry and
        input/operator hashes.
    - id: STEP-007
      action: >-
        Add the exact PR-315 matrix and portable replay to the existing
        Repository-integrity workflow; do not create a new workflow.
    - id: STEP-008
      action: >-
        Rerun exactly 300 primary pairs and the observed SMICA map with the
        joint cut-sky branch. Recompute the frozen PR-314 branch only as a
        comparison/replay.
    - id: STEP-009
      action: >-
        Produce a twelve-feature old/new table, local and family ranks,
        covariance diagnostics, runtime/RSS and operator hashes.
    - id: STEP-010
      action: >-
        Hand the final diff, RED/GREEN logs, feature package and comparison to
        a fresh-context reviewer that did not implement the patch.

verification:
  targeted:
    - command: >-
        PYTHONPATH=htt:htt/src:htt/htt python -m pytest -q
        tests/integration/test_planck_pr3_admission_preparation.py
        tests/integration/test_planck_pr3_current_stack.py
        tests/integration/test_planck_pr3_operator.py
      expect: all pass
  regression:
    - command: python scripts/codex_harness/sync_pr_dag_mirrors.py --check
      expect: exit=0
    - command: >-
        python scripts/codex_harness/validate_pr_dag.py
        docs/codex_handoff/pr_backlog.yaml
        --status docs/codex_handoff/pr_status.yaml
        --strict-rescue-slice
      expect: PR-315 appended after PR-314 and all prior order preserved
    - command: git diff --check
      expect: exit=0
  negative:
    - arbitrary monopole/dipole with known retained coefficients
    - masked-only contamination
    - partial/reordered/duplicate pair inventory
    - wrong raw SHA or pair order
    - observation/null operator digest mismatch
    - singular or over-conditioned joint normal matrix
    - post-hoc branch/tail registry mutation
    - portable package row/feature/cell corruption
  metamorphic:
    - monopole/dipole rescaling leaves retained joint-fit coefficients unchanged
    - zero-mask contamination amplitude 1 through 1e8 leaves joint cut-sky features unchanged
    - consistent row permutation plus manifest permutation leaves finite ranks unchanged
    - nonzero feature-unit rescaling with matching tail orientation leaves finite ranks unchanged
    - raw execution and portable feature replay have identical scientific projection
  clean_CI:
    - Repository contracts
    - Python package smoke
    - Rust compile unchanged
    - exact PR-315 Planck matrix
    - portable feature replay

completion_evidence:
  required:
    - base_sha
    - final_sha
    - final_tree
    - git_status_porcelain
    - git_diff_stat
    - git_diff_check
    - DAG_and_mirror_results
    - RED_joint_nuisance_log
    - RED_mask_oracle_log
    - GREEN_logs
    - clean_CI_run_ids
    - raw_input_manifest_hash
    - feature_package_hash
    - PR314_result_hash
    - PR315_result_hash
    - old_new_scientific_comparison
    - unresolved_blockers
    - observed_statistic_seen_boolean

agent_policy:
  ask_user_questions: false
  guess_across_scientific_spec_boundary: forbidden
  unresolved_spec_action: BLOCKED_BY_UNRESOLVED_SPEC
  change_expected_science_to_fit_implementation: forbidden
  suppress_failures: forbidden
  security_or_antitamper_infrastructure: forbidden
  same_agent_final_authority: false
  broaden_fast_path: forbidden

review_gate:
  fresh_context_required: true
  reviewer_may_modify_code_on_first_pass: false
  reviewer_input:
    - audited_base_sha
    - final_sha
    - final_diff
    - this_contract
    - RED_and_GREEN_logs
    - old_new_result_table
    - portable_feature_package
  reviewer_output:
    - severity
    - exact_file_and_line
    - violated_invariant
    - reproducer
    - missing_test
  pass_condition:
    P0: 0
    P1: 0

claim_boundary:
  allowed:
    - frozen PR-314 delivered-full-sky SMICA conditional rank
    - separately named joint cut-sky SMICA conditional rank
    - exact operator-order robustness comparison
    - exact 300-pair empirical calibration statement
  forbidden:
    - unconditional p-value
    - Commander robustness
    - joint Planck result
    - global response
    - source attribution
    - Bayesian evidence without a registered model
    - native solver result
    - Bianchi family identification
    - cross-probe result
