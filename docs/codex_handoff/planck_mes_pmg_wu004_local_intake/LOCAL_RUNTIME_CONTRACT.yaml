schema: audit-compiled-work-unit/v1
id: PMG-WU-004
title: Verify the local Planck/FFP10 inventory read-only
authority:
  base_sha: 03f002d97deb31648f47a9a5bdc0e7706354909e
  base_tree: 1d4447dbf90e0a7170fbe68e5db287e91e4d0391
  branch: changeset/planck-mes-irrep-data-intake-20260828
  upstream_dependencies: [PMG-WU-003]
objective:
  statement: Convert the reported NVMe Planck inventory into a content-bound typed read-only intake for carrier-preserving execution.
  observable_success: Real-host intake, route, selected-input, private-manifest, and terminal artifacts exist; exact inventory and row 00818 semantics pass; pre/post raw metadata remain unchanged.
  non_goals:
  - no scientific rank
  - no full 910-GiB preflight hash sweep
  - no download
  - no HSC/KiDS/CF4 execution
  - no carrier generation
  - no manuscript modification
scope:
  allowed_paths:
  - scripts/observed_runs/inspect_planck_mes_irrep_data.py
  - tests/integration/test_planck_mes_irrep_inventory.py
  - docs/generated/planck_mes_irrep_inventory/**
  forbidden_paths:
  - /mnt/sn850x2t/htt_base_e2e/workdir/raw/**
  - /mnt/sn850x2t/htt_base_e2e/workdir/downloads/**
  - /mnt/sn850x2t/htt_base_e2e/workdir/cobaya_packages/data/**
  host_private_output: /mnt/sn850x2t/htt_base_e2e/workdir/analysis/planck_mes_irrep/intake_manifest.json
inventory_contract:
  planck_data:
    required_observed_smica: COM_CMB_IQU-smica_2048_R3.00_full.fits
    required_observed_commander: COM_CMB_IQU-commander_2048_R3.00_full.fits
    required_temperature_mask: COM_Mask_CMB-common-Mask-Int_2048_R3.00.fits
  smica_cmb_mc:
    expected_ids: 00000..00999 excluding only 00970
    expected_complete_count: 999
    required_special_adjudication: '00818'
    00818_rule: FITS structure, semantic metadata, finite payload checks, and streaming digest; size alone is forbidden
  smica_noise_mc:
    expected_ids: 00000..00299
    expected_complete_count: 300
  commander_cmb_mc:
    complete_ids: ['00000','00001','00002']
    partial_ids_quarantined: ['00003','00004','00005','00006']
    finite_null_eligible: false
  unavailable_routes:
    planck_npipe_pr4: BLOCKED_MISSING_DATA
    hsc_or_sacc_under_hsc_kids: UNAVAILABLE_KIDS_ONLY
io_policy:
  enumeration: metadata and existing release/checksum sidecars first
  hashing: no unrelated full-tree hash; stream-hash row 00818 during adjudication and downstream-selected files on first scientific read
  symlinks: resolve and require containment below declared roots before open
  open_mode: read-only binary
  git_staging: raw, downloads, and private manifests forbidden
  mutation_check: capture selected-file stat identity before and after; fail on size, mtime_ns, inode/device, or computed-digest drift
ordered_steps:
- id: PMG4-STEP-RED
  action: Write and run RED tests for exact inventories, partial quarantine, 00818 semantics, root containment, no staging, and pre/post immutability.
- id: PMG4-STEP-IMPLEMENT
  action: Implement the smallest read-only inspector using strict schemas and typed blocked dispositions.
- id: PMG4-STEP-EXECUTE
  action: Run on the real NVMe host and emit every required portable/private artifact.
- id: PMG4-STEP-VERIFY
  action: Run focused, negative, admission-preparation regression, output-schema, and git-diff checks.
- id: PMG4-STEP-REVIEW
  action: Perform one read-only fresh review; apply at most one bounded repair for a reproduced current-task P0/P1.
required_outputs:
  portable:
  - docs/generated/planck_mes_irrep_inventory/intake_summary.json
  - docs/generated/planck_mes_irrep_inventory/route_receipt.json
  - docs/generated/planck_mes_irrep_inventory/selected_input_manifest.json
  - docs/generated/planck_mes_irrep_inventory/terminal.json
  private:
  - /mnt/sn850x2t/htt_base_e2e/workdir/analysis/planck_mes_irrep/intake_manifest.json
verification:
  targeted:
  - python -m pytest -q tests/integration/test_planck_mes_irrep_inventory.py
  negative:
  - python -m pytest -q tests/integration/test_planck_mes_irrep_inventory.py -k 'partial or symlink or mutation or 00818 or staged'
  regression:
  - python -m pytest -q tests/integration/test_planck_pr3_admission_preparation.py
  integration:
  - python scripts/observed_runs/inspect_planck_mes_irrep_data.py --workdir /mnt/sn850x2t/htt_base_e2e/workdir --execute
  full_relevant_suite: []
completion:
  state_for_pass: SUCCEEDED
  required:
  - base_git_head
  - final_git_head
  - final_git_tree
  - executed_test_commands
  - invariant_results
  - objective_output_paths
  - objective_output_sha256
  - private_manifest_sha256
  - pre_post_immutability_receipt
  - unresolved_blockers
  - next_executable_action
  pass_transition: START_PMG_WU_005_IMMEDIATELY
  fail_transition: emit narrow typed BLOCKED state and stop; do not create another package
