schema: htt.pr321.reaudit.audit_compiled_plan.v1
authority:
  pr: 412
  base_sha: a968e11461ed28c8d5cc1244f0122edc704579c4
  audited_head: 43e27e8c93eb18195ceca41a22c90b7e6dd014bf
  audited_tree: c4379c1c24aee5dec22af930a39242eb52f35c9d
  source_precedence:
  - latest explicit user decision
  - official HSC release documentation
  - current PR code/tests/result
  - current canonical DAG/status
  - historical PR prose
objective:
  statement: Repair PR-321 before any MES-recovery implementation begins.
  observable_success: Exact SACC rerun binds N(z), official fiducial 60-vector/covariance,
    independent row ordering and scalar-control-only MES role.
  non_goals:
  - cosmological likelihood
  - finite-null p-value
  - HSC-KiDS result
  - MES vector/tensor construction
  - local/global discrimination
scope:
  allowed_paths:
  - htt/obsstat/hsc_kids_current_stack.py
  - scripts/observed_runs/run_hsc_kids.py
  - tests/integration/test_hsc_kids_current_stack.py
  - docs/PR_DELTAS/pr-321.md
  - docs/research_program/post_pr275/pr321_spec.yaml
  - docs/research_program/post_pr275/pr321_hsc_sacc_report.md
  - docs/generated/pr321_hsc_sacc_result.json
  - docs/codex_handoff/pr_status.yaml
  - machine_readable/pr_status.yaml
  - derived status/claim mirrors required by the status repair
  forbidden_changes:
  - Do not change the official input SHA/size.
  - Do not commit numerical bandpowers or n(z) arrays.
  - Do not invent a theory/reference vector.
  - Do not add KiDS or cross-survey inference.
  - Do not add MES vector/tensor claims.
  - Do not reorder any existing DAG node or edge.
ordered_steps:
- id: STEP-001
  action: Write RED tests for N(z), fiducial scale selection, ordering crosscheck,
    MES role and status URL mapping.
- id: STEP-002
  action: Extend the SACC byte-snapshot loader to extract and validate z/nz and to
    crosscheck row.value against payload.mean and pair-selection indices.
- id: STEP-003
  action: Compute exact fiducial indices for 300<ell<1800, the 60-vector hash and
    matching 60x60 covariance diagnostics.
- id: STEP-004
  action: Emit full-release and fiducial-selection surfaces separately; add scalar-tomographic-control-only
    MES metadata.
- id: STEP-005
  action: Repair PR-289/PR-321 URL mappings and regenerate all affected status mirrors
    without changing DAG order.
- id: STEP-006
  action: Replace the false LOC cap with a semantic allowlist boundary and update
    title/report terminology.
- id: STEP-007
  action: Run the exact local SACC replay, replace the blocked placeholder artifact,
    then execute focused clean CI and fresh-context review.
verification:
  targeted:
  - python -m pytest -q tests/integration/test_hsc_kids_current_stack.py -k pr321
  - python scripts/observed_runs/run_hsc_kids.py --inspect-hsc-sacc ...
  negative:
  - missing or nonpositive N(z)
  - all-scale vector promoted as fiducial
  - row/mean/API order mismatch
  - PR URL swap
  - MES directional role mutation
  integration:
  - strict DAG and mirror validation
  - claim-language check
  - byte-identical repeat of the corrected compact result
completion_evidence:
- base_sha
- final_sha
- git_diff_check
- focused test logs
- real SACC rerun log
- corrected compact-result hash
- status mirror hashes
- fresh-context findings with P0=0 and P1=0
stop_conditions:
- BLOCKED_HSC_TRACER_NZ
- BLOCKED_HSC_FIDUCIAL_SCALE_SELECTION
- BLOCKED_HSC_SACC_ORDERING
- BLOCKED_NO_DIRECTION_INDEXED_HSC_FIELD
- BLOCKED_PR321_STATUS_PROVENANCE
- BLOCKED_EXACT_HSC_SACC_RERUN_REQUIRED
