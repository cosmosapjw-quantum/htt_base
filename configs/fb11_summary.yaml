seed: 42

dataset:
  kind: synthetic_surrogate
  allow_surrogate: true
  reference_likelihood: planck2018_v
  truth_type: IX
  noise_scale: 1.0

models:
  baseline: FLRW
  type_labels:
    - I
    - II
    - III
    - IV
    - V
    - VI_0
    - VI_h
    - VII_0
    - VII_h
    - VIII
    - IX

outputs:
  summary_json: figures/paper/fb11_summary_table.json
  summary_markdown: figures/paper/fb11_summary_table.md
  posterior_dir: figures/paper/fb11_posteriors

sampler:
  driver: emcee
  schedule:
    - n_walkers: 48
      n_steps: 320
      burnin: 120
      parallel: false
    - n_walkers: 48
      n_steps: 640
      burnin: 320
      parallel: false
    - n_walkers: 48
      n_steps: 960
      burnin: 480
      parallel: false
    - n_walkers: 48
      n_steps: 1600
      burnin: 800
      parallel: false
    - n_walkers: 48
      n_steps: 1600
      burnin: 800
      parallel: false
    - n_walkers: 48
      n_steps: 1600
      burnin: 800
      parallel: false
    - n_walkers: 48
      n_steps: 2400
      burnin: 1200
      parallel: false

diagnostics:
  r_hat_max: 1.01
  ess_min: 400
  geweke_abs_z_max: 2.0
