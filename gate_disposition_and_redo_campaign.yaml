    - pdf_claim_lint 12 STRICT_FAIL_PATTERN_NAMES
    - CLAIM_GATES rows 1,3,4,6 (scalar->family; MIO-as-odds; curl-suppressed vorticity; old-Rust-as-native)
    - the 24 anti-laundering kill rules of PR-248..275
