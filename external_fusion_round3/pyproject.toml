[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "htt-external-fusion"
version = "0.1.0"
description = "External cosmology integration and shell-resolved low-ell pole research bundle"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.12"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
