[package]
name = "htt-auth-launcher"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
test-path-overrides = []

[dependencies]
base64 = "=0.22.1"
ed25519-dalek = "=2.2.0"
hex = "=0.4.3"
libc = "=0.2.189"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
thiserror = "=2.0.17"

[dev-dependencies]
tempfile = "=3.23.0"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
