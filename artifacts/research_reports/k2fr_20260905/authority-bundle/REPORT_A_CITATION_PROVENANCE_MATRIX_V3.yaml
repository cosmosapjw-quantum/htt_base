citation_rules:
- External sources support only the role declared in source_registry.
- Adjacent invariant literature is not a proof of the Q/O Krylov16 theorem.
- Internal numerical artifacts require their execution grade in the same sentence or caption.
- A source-only implementation is never cited as an executed validation.
- Continuum and finite-HEALPix claims receive separate citations and labels.
- Exchangeable-row and finite-group-orbit theorems are distinct claims with distinct assumptions.
- The formal BibTeX file is the sole rendered bibliography authority; manual reference lists are noncanonical
  history.
- No observational Planck or FFP10 value enters Report A.
- Candidate external sources support only their declared contextual roles.
- The K1R state, anchor, gauge and fibre theorems remain repository-specific direct derivations or source
  contracts.
- Common-data set intersection does not establish statistical independence.
- A source-only donor implementation is not cited as executed on the Report-A branch.
- The candidate supplement is not a rendered bibliography authority before K2 freeze.
- No Planck or FFP10 value enters the candidate report.
